# ラボ8 · OpenBaoシークレットストアの注文。
# ダッシュボードでマウスを使って注文するのと同じもの — ただしテキストで。
# これはラボクラスタではなく、管理クラスタ上のテナントに適用します:
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f openbao.yaml
#
# 適用する前に: tenant-workshopXX を自分の namespace に置き換えてください。XX はプレースホルダー
# であって名前の一部ではありません。自分の番号はパスワードと一緒に受け取っています。他人のテナントに
# 入ってしまうと — アクセス拒否になりますが、それが起こりうる最良の結末です。
#
# kind: OpenBAO — これは組み込みの Kubernetes オブジェクトではなく、Cozystack が追加する
# 型です。あなたは必要なものを記述し、プラットフォーム自体がポッド、ディスク、
# サービスをデプロイし、その後も自ら更新します。渡された仮想マシンにソフトウェアを
# インストールするのではなく、カタログからサービスを注文するのに最も近いものです。
apiVersion: apps.cozystack.io/v1alpha1
kind: OpenBAO
metadata:
  # 名前はダッシュボードのカードに影響するだけではありません。ストアの内部アドレスは
  # そこから組み立てられます — openbao-secrets.<namespace>.svc.cozy.local。名前を変更したら —
  # secrets-demo.yaml と check.sh 用の BAO_APP 変数のアドレスを修正してください。
  name: secrets
  namespace: tenant-workshopXX
spec:
  # 1つのコピー。本番環境では3つ配置し、Raft レプリケーションを得ます: replicas > 1 になると
  # チャートが自らそれを有効にします。行き来を切り替えるにはデータの移動が
  # 必要なので、決定は後ではなく前に行います。
  replicas: 1
  # ストアのデータ用ディスク。2ギガバイトは余裕を持たせた値です: シークレットはバイト単位の重さで、
  # 容量はバージョン履歴と監査ログに使われます。ボリュームは作成後に縮小
  # できませんが、通常は拡大できるので、ここでケチる意味はありません。
  size: 2Gi
  # replicated ストレージクラスは、データが異なるノード上の複数のコピーとして
  # 存在することを意味します。ノード障害があっても、あなたのすべてのパスワードが道連れになることはありません — そして
  # シークレットストアをバックアップから復元するのは、それ自体が別に不快な作業です。
  storageClass: replicated
  # 既製の「CPUとメモリをどれだけ」のセット。プラットフォームはそれらをリストで提供し、
  # 全員に requests と limits を手作業で計算させないようにします。
  resourcesPreset: t1.small
  # Web インターフェースはクラスタ内部で起動します。外部には公開しません:
  # external: true にすると LoadBalancer が付きますが、ラボでは必要ありません。
  ui: true
  external: false
