# ラボ8・ステップ3/3: マニフェストにパスワードは存在しない — 平文でもbase64でもない。
# 最終版。このファイルはGitにコミットしても、業者に見せても、Tシャツに印刷しても
# 構わない。
#
# このステップが2番目とどう違うか: あちらでは値はやはり書き込まれていた — ファイルに、
# そしてクラスタオブジェクトに。ここでは記述の中にまったく存在しない。アプリケーションは
# 起動時に、パスワードを自分でOpenBaoストアから取得する。
#
#   secrets-demo-naive.yaml      パスワードはファイルを開いた誰にでも見える
#   secrets-demo-secret.yaml     パスワードはSecretオブジェクトに移されている
#   secrets-demo.yaml         <- あなたはここ: パスワードは起動時にストアから届く
#
# 適用する前に: tenant-workshopXX を自分のnamespaceに置き換えること — それは下のストア
# アドレスの一部である。XX はプレースホルダーであり、名前の一部ではない。
# どこで適用するか: あなたの `lab` クラスタ (export KUBECONFIG=~/lab.kubeconfig)。
# コマンド: kubectl apply -f secrets-demo.yaml
#
# アプリケーションがストアに対して自身を証明するトークンは、passes-bao-token シークレットにある。
# それはファイルではなくコマンドで作成する: このマニフェストにはオブジェクト名だけがあり、
# 名前はシークレットではない。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # すべては非rootで動く。fsGroup が必要なのは、ここにコンテナが2つあるからだ: 一方は
      # パスワードのファイルを書き、もう一方がそれを読む。共通のグループがなければinitコンテナは
      # メインコンテナが開けないファイルを書いてしまい、あなたは30分ほどどこで間違えたのかと
      # 悩むことになる。
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # 一方のコンテナがパスワードを置き、もう一方がそれを読む場所。
      # medium: Memory は、この「ディスク」がノードのRAMの中に存在し、
      # 本物のディスクには決して届かないことを意味する: バックアップにも、ボリュームのダンプにも、
      # サーバーからディスクを抜き取る者にも渡らない。Podが消えれば、その中身も消える。
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      # initコンテナはメインコンテナの前に動き、正常に完了しなければならない。
      # パスワードの取得に失敗すればアプリケーションはまったく起動せず、それが正しい
      # 振る舞いだ: データベースへのパスワードのないサービスはどのみち使えない。起動して
      # ログにエラーをまき散らすより、起動しない方が誠実だ。
      initContainers:
        - name: fetch-secret
          # OpenBao自身のイメージを、たった一つのユーティリティ `bao` — そのクライアント — のために使う。
          # 自前のコードを書く必要はない。
          image: openbao/openbao:2.5.1
          # bao kv get -field=password — 一つのパスで一つのフィールドだけを取得する。シークレット
          # 全体ではない。tr -d '\n' は、さもなければパスワードの中に入り込む改行を取り除く:
          # 末尾の余分な文字はデータベースが受け付けず、そういうものを探し当てるのは不愉快だ。
          # chmod 0400 — ファイルを読めるのは所有者だけ。
          # set -e は最初のエラーでスクリプトを止める: さもなければコンテナは空のファイルのまま
          # 正常終了してしまい、調べる羽目になるのはアプリケーションの側になる。
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              bao kv get -field=password secret/passes/db \
                | tr -d '\n' > /secrets/db_password
              chmod 0400 /secrets/db_password
              echo "пароль получен из OpenBao, в манифесте его нет"
          # ストアのアドレスと、アプリケーションが読み取り権限を証明するトークン。
          # トークンはコマンドで作成されたオブジェクトへの参照によるもの。ここ、ファイルの中には入らない。
          # アドレスの中の tenant-workshopXX が、置き換えるべき例のプレースホルダーだ。
          env:
            - name: BAO_ADDR
              value: http://openbao-secrets.tenant-workshopXX.svc.cozy.local:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: passes-bao-token
                  key: token
          # 共有フォルダ。このコンテナには書き込み用に与えられている — ここに書き込む。
          volumeMounts:
            - name: secrets
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # リミットはメインコンテナより高い: OpenBaoのユーティリティはbusyboxより重いが、
          # 数秒しか生きないので、これは恒常的なコストではない。
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      # メインコンテナはinitコンテナが終わった後にだけ起動する。
      containers:
        - name: app
          image: busybox:1.36
          # 前のステップと同じループだが、パスワードは今や環境変数ではなくファイルの中にある:
          # フィンガープリントは /secrets/db_password から直接計算される。
          # 環境変数は kubectl describe pod の出力に見え、プロセスのダンプに入り込む。
          # Podのメモリ内のファイルはそうではない。
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(sha256sum /secrets/db_password | cut -c1-12)"
                sleep 10
              done
          # ここに残っているのは秘密でない設定だけ — アドレスとログイン。
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
          # 同じフォルダだが読み取り専用: アプリケーションはたとえどんなに望んでも、
          # パスワードを壊したり差し替えたりできない。
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
