# ラボ8 · ステップ2/3: パスワードを Deployment から切り出し、独立した Secret オブジェクトに移す。
# 「素朴な修正」: アプリケーションの記述からパスワードが見えなくなり、開発者は満足するが、
# 監査人はそうではない。なぜかは、コマンド一つで分かる。
#
# このステップが最初のステップより優れている点: 値がアプリケーションの記述の一部ではなくなり、
# 名前で参照されるようになった。3番目のステップより劣っている点は、値をやはりどこかに
# 書き留めなければならず、それがまさにこのファイルに書かれていることだ。
#
#   secrets-demo-naive.yaml      パスワードはファイルを開いた誰もが目にする
#   secrets-demo-secret.yaml  <- 現在地: パスワードは Secret オブジェクトの中にある
#   secrets-demo.yaml            マニフェストにパスワードは一切ない
#
# 適用先: あなたの `lab` クラスター（export KUBECONFIG=~/lab.kubeconfig）。
# コマンド: kubectl apply -f secrets-demo-secret.yaml
#
# このファイルのパスワードは学習用の架空のものだ。ファイルには `---` 行で区切られた二つの
# オブジェクトがある: Secret と、それを参照する Deployment。apiVersion、kind、
# metadata.name はこの先のファイルではコメントしない。
#
# Secret は、アプリケーションの記述に置くべきでないもののための専用の種類のオブジェクトだ。
# クラスターは通常の設定より少し慎重にこれを扱う: 値は kubectl describe に表示されず、
# 読み取り権限は個別に付与される。
apiVersion: v1
kind: Secret
metadata:
  name: passes-db
# Opaque は「任意のキー・値の集まり」を意味する。特別な型もある —
# イメージレジストリへのアクセス用、TLS 証明書用など — が、ここでは特別なものは
# 何も必要ない。
type: Opaque
data:
  # これは暗号化ではない。これは base64 — バイト列を印字可能な文字で書く方法だ。
  # 鍵はなく、復号のためのパスワードもなく、逆変換は誰にでもできる。
  password: UHJvcHVzazIwMTkh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # 下の Deployment は最初のステップと全く同じものだ。変わったのはちょうど一箇所だけ:
  # DB_PASSWORD がどうやって pod に入るか。
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # root ではなく、制限されたシステムコールの集合。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 再び busybox とシェルの数行: アプリケーションの動作ではなく、
          # パスワードの経路を見る。
          image: busybox:1.36
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # これが最初のステップとの違いのすべてだ。value ではなく valueFrom は
            # 「そこから値を取る」ことを意味する: secretKeyRef.name — どのオブジェクトか、key — その
            # 中のどのフィールドか。置換は pod の起動時に行われ、アプリケーションの記述には
            # 名前だけが残る。
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: passes-db
                  key: password
          # 最初のステップと同じループ: パスワードそのものではなく、パスワードのフィンガープリントを
          # 表示する。フィンガープリントはまさにステップ間の比較に便利だ — それが変わって
          # いなければ、以前と同じ値が pod に届いたということだ。
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
