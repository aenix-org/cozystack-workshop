# ラボ8 · 3ステップ中のステップ1: パスワードがマニフェスト内に平文で置かれている。
# これが「Propusk」サービスの現在の姿であり、まさにこのファイルを監査が発見した。
# 問題を自分の目で確かめるために、これをちょうど一度だけ適用する。
#
# 迷わないための、ラボの3つのステップ:
#   secrets-demo-naive.yaml   <- 現在ここ: ファイルを開いた誰もがパスワードを見る
#   secrets-demo-secret.yaml     パスワードは別の Secret オブジェクトに移される
#   secrets-demo.yaml            マニフェストにパスワードはまったく存在しない
#
# 適用先: あなたの `lab` クラスタ (export KUBECONFIG=~/lab.kubeconfig)。
# コマンド: kubectl apply -f secrets-demo-naive.yaml
#
# このファイル内のパスワードは学習用の架空のもので、本物はここにない。単一のオブジェクト —
# Deployment。apiVersion、kind、metadata.name はこれ以降コメントしない。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # 1コピーで十分: ここで見ているのは耐障害性ではなく、
  # アプリケーションがどこからパスワードを取得するかである。
  replicas: 1
  # このラベルで Deployment は自分のポッドを認識する。下の template のラベルと一致する。
  selector:
    matchLabels:
      app: secrets-demo
  # template — ポッドのテンプレート: コピーを何から組み立てるか。
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # セキュリティ要件: root では実行しない、システムコールの限定セット。
      # ギャップに注目: ポッドはすべてのセキュリティ規則どおりに構成されているが、それは
      # 10行下のファイルにパスワードが置かれていることをまったく防がない。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 本物のアプリケーションはここにない — busybox と数行の shell だけ。
          # このラボで重要なのはただ一つ: パスワードがどこから来るかであり、その後それが
          # どう使われるかではない。
          image: busybox:1.36
          env:
            # データベースのアドレスとユーザー名は秘密ではない: データベースが
            # passes-db という名前だと知っていること自体はアクセスを与えない。
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # 監査が発見したのはまさにこの行である。
            # ファイルは Git にあり、つまりパスワードはリポジトリにアクセスできる全員、
            # そしてかつてそれをクローンした全員に知られている。
            - name: DB_PASSWORD
              value: "Propusk2019!"
          # 無限ループ: 10秒ごとにログへ1行出力する。ログに出るのはパスワードそのもの
          # ではなく、その sha256 フィンガープリント — 先頭12文字。フィンガープリントからは
          # パスワードが変わったことは分かるが、そこから値を復元することはできない。
          # 本物のサービスでもログはまさにこのように書かれる。
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s %s に %s として接続、パスワードのフィンガープリント sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          # 要求は極小: これはデモンストレーションであり、ワークロードではない。
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
