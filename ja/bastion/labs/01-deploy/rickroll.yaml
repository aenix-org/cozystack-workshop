# ラボ1。学習用アプリ rickroll のすべてを1ファイルに: nginx の設定、ページ、
# デプロイそのもの、そしてそこへの恒久的なアドレス。`---` で区切られた4つのオブジェクト。
#
# これは管理クラスタのテナントではなく、あなたの学習用クラスタ `lab` に適用します:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll.yaml
# ここには tenant-workshopXX のようなプレースホルダはありません — 自分の番号をどこかに入れる必要はありません。
#
# 4つのオブジェクトすべてで繰り返されるフィールドは、ここで一度だけ説明します:
#   apiVersion — このオブジェクトの型が属する API のセクション;
#   kind       — オブジェクトの型そのもの;
#   metadata.name — 後で `kubectl get` で探すときに使う名前。
# 名前は同じ型の中で一意なので、下の Deployment と Service はどちらも
# rickroll という名前でも衝突しません。
---
# nginx の設定。ページのバージョン間で変わらないので、別に切り出してあります。
# ConfigMap — クラスタの中に単独で存在し、起動時にコンテナの中へ差し込まれる設定ファイル。
# 狙いは、イメージを再ビルドせずに設定を変えられるようにすること。キー `default.conf` は
# ボリュームがマウントされたディレクトリの中でのファイル名になります。
#
# `|` の後のインデントより下はすべて YAML ではなく、ファイルの内容そのままです。この
# ブロック内のシャープ記号で始まる行は、解析時に消えるのではなく、そのまま nginx の設定に
# 入ります。同じ理由で、下のページのブロックにはコメントを付けていません:
# あれは HTML であり、その中のシャープ記号は画面上でユーザーに見えてしまうからです。
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-conf
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      location / {
        # このラボの肝: nginx が自分の Pod 名を HTML に直接差し込みます。
        # Pod 内の $hostname がまさに Pod 名です。
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
---
# ページ、バージョン1。設定とは別のオブジェクトにしてあります — ラボ4でアプリを
# 第2バージョンに切り替えるとき、nginx の設定に触れずイメージも再ビルドせずに済むように。
# 名前の -v1 という接尾辞は飾りではありません: 隣に rickroll-page-v2 が現れ、両者の間で
# ボリュームを切り替えることこそが新バージョンのロールアウトになります。
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v1
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Never Gonna Give You Up</title>
    <style>
      body{background:#0d0d12;color:#e8e8ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#ff0057,#ffb800,#00e0ff,#ff0057);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#9aa0b5;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#6f7690}
      .pod b{display:block;margin-top:.4em;color:#00e0ff;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#4d5366;font-size:14px}
    </style>
    <h1>Never Gonna Give You Up</h1>
    <p class="lyr">Never gonna let you down &middot; Never gonna run around and desert you</p>
    <div class="pod">対応したPod<b>__POD__</b></div>
    <p class="hint">ページを再読み込みしてください。レプリカが増えると、名前が変わり始めます。</p>
    </html>
---
# アプリ本体。Deployment は望ましい状態を記述します — どのイメージを起動し、
# 何個のコピーを保ち、更新時にどう置き換えるか。あとはクラスタ自身が現実をこの記述に
# 合わせ、作成時に一度だけでなく、常時それを監視し続けます。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rickroll
  labels:
    app: rickroll
spec:
  # 何個のコピーを起動状態で保つか。言い回しはまさにこうです: 「1つ起動しろ」ではなく
  # 「1つ保て」。コピーが消えれば、クラスタは何も尋ねずに新しいものを作ります。ラボ3では
  # このフィールドをオートスケーリングが変え始めるので、以降は手で触りません。
  replicas: 1
  # Deployment がどのラベルで Pod を自分のものと見なすか。ここのラベルと下の template の
  # ラベルは一致していなければなりません: 食い違うとオブジェクトはそもそも作成されません。
  selector:
    matchLabels:
      app: rickroll
  # Pod のテンプレート — 各コピーはこれから打ち出されます。template 内のどのフィールドを
  # 直しても、アプリの新しいリビジョンとなり、コピーを順に置き換えます(これがまさにラボ4)。
  # template の外のフィールド(例えば replicas)を直してもリビジョンは作られません。
  template:
    metadata:
      labels:
        # 同じラベルは Pod 自身にも付いています: ファイル末尾の Service がこれで Pod を見つけます。
        app: rickroll
    spec:
      # Pod 全体のレベルでの `restricted` セキュリティプロファイルの要件: root では
      # なく動かすこと、特定の UID、標準の seccomp プロファイル。`restricted` を有効にした
      # 企業クラスタでは、これらのフィールドがない Pod は起動を許可されません。しかも
      # 拒否は manifest の apply 時ではなく、Pod の作成の瞬間に返ってきます。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # 同じ厳しさを、今度はコンテナのレベルで: 内部のプロセスは自分の権限を
          # 昇格させることを禁じられ、すべての linux ケイパビリティを取り上げられます。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 非特権版: 8080 を待ち受け、root ではなく動きます。
          # これだけで `baseline` プロファイルには十分ですが、`restricted` には足りません — あちらは
          # Pod とコンテナに明示的な securityContext を要求し、それらは上で設定済みです。企業
          # クラスタではたいてい `restricted` のほうが有効になっています。
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # デフォルトで nginx はノードのコアごとに1つのワーカープロセスを立ち上げます。1コアの
          # 学習用マシンではそれは1プロセスですが、64コアの本番ノードでは64プロセスになり、
          # メモリ上限の小さい Pod は最初のリクエストの前に OOMKilled で落ちます。
          # オートチューンはワーカーを CPU 上限から数えます: 300m なら1プロセスです。
          # -g ではなく環境変数を通して: このディレクティブはイメージの基本設定に既にあり、
          # 二度目の宣言は nginx を「duplicate」エラーで落とします。
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # ポートには番号だけでなく名前を付けています: `http` は下の readinessProbe と
          # Service の targetPort が参照します。番号を変えても、直すのは1か所で済みます。
          ports:
            - containerPort: 8080
              name: http
          # 絶えず混同される2つの別物。requests — リソースをどれだけ確実に予約するか;
          # これをもとにスケジューラがノードを選び、またこれをもとにラボ3のオートスケーリングが
          # 負荷をパーセントで計算します。
          # limits — それ以上には上がらせない上限: CPU は限界に達すると絞られ、
          # メモリは超えるとコンテナが殺されます。
          resources:
            # わざと極小にしています: ワークショップではこういうアプリがたくさんあります。
            # 20m はコアの100分の2です。値が低いのは意図的です: requests が小さいほど
            # 負荷が速くしきい値を超え、ラボ3でのコピーの増加が30分ではなく
            # 数秒で見えます。
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          # 準備完了チェック。このアドレスから応答が来るまで、クラスタはコピーに
          # トラフィックを流しません。そのために nginx の設定に「ok」を返す専用の
          # location /healthz が用意されています。このフィールドがラボ4での無停止ロールアウトを
          # 支えます: 古いコピーは、新しいコピーが応答したあとで初めて落とされます。
          # これを外すと、更新がリクエストを落とし始めます。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            # 最初のノックまで2秒 — 経験から選んだ値です。これより短くしても意味は
            # ありません、nginx の起動にそれだけかかります; これより長くすると、各ロールアウトを無駄に引き延ばします。
            initialDelaySeconds: 2
          # ConfigMap の内容をコンテナ内のどこに置くか。ディレクトリは適当に選んだのでは
          # ありません: 1つ目からは nginx がファイルを配信し、2つ目からは設定を読みます。
          # この2行がなければ、両方の ConfigMap はクラスタに置かれたままになり、
          # nginx は自分の標準ページを表示します。
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
      # どの ConfigMap を Pod に接続するか。ここのボリューム名が、上の volumeMounts の
      # エントリと結びつけます — 一致すべきはまさに名前で、結びつけには順序は関係ありません。
      # ですがラボ4では順序が関係します、下の警告を参照。
      volumes:
        # 注意: このボリュームは最初(volumes[0])でなければなりません。
        # ラボ4はページのバージョンをインデックス指定のパッチで切り替えます。
        # JSON Patch はリストの要素を名前ではなく番号で指定します。ボリュームを
        # 入れ替えると、パッチはページの代わりに nginx の設定を黙って差し替え、アプリは
        # 壊れ、エラーメッセージはまったく別のことを語ることになります。
        - name: page
          configMap:
            name: rickroll-page-v1
        - name: conf
          configMap:
            name: rickroll-conf
---
# アプリの恒久的なアドレス。コピーは生まれては死に、そのアドレスは変わりますが、クラスタの
# 中での名前 `rickroll` は変わりません — 隣人はこれでアプリを呼びます。
# この名前の裏にある生きたコピーのリストは、クラスタがラベルをもとに自分で管理します。
apiVersion: v1
kind: Service
metadata:
  name: rickroll
spec:
  # このアドレスの裏に誰を置くか: このラベルを持つすべての Pod、それが誰に
  # 作られたものであろうと。ここから典型的な厄介事が生じます — app: rickroll ラベルを持つ無関係な Pod が
  # 黙ってロードバランシングに入り込み、あなたのユーザーに応答し始めます。このフォルダの
  # スクリプト check.sh は、そうした偽物がいないことを別途チェックします。
  selector:
    app: rickroll
  ports:
    # port — サービス自身がどのポートで応答するか、targetPort — サービスが Pod の内部の
    # どこにノックするか。ここでは targetPort をコンテナのポート名で指定しており、数字では
    # ありません: コンテナ内の番号が変わっても、このファイルを直す必要はありません。
    - port: 80
      targetPort: http
