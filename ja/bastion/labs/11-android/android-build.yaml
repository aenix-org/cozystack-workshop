---
# ラボ11。ビルドそのもの。ConfigMap内のスクリプトと、それを実行するJob。
# 1つのファイルに2つのオブジェクトがあり、`---` の行で区切られている。
#
# 管理クラスタ上のテナントではなく、あなたの学習用クラスタ `lab` に適用する:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f android-build.yaml
# ここには tenant-workshopXX のようなプレースホルダーはない — 自分の番号をどこかに差し込む必要はない。
#
# 適用する前に、2つのオブジェクトがすでにクラスタ内に存在していなければならない。さもないとビルドPodは起動しない:
# クラスタは存在しないものはマウントできず、Podは待機したままになる。
#     configmap/propusk-src   ソース: kubectl apply -f propusk-src.yaml
#     secret/bucket-creds     バケットへのアクセスキー4つ、手作業で入力する
#
# DeploymentではなくJob: ビルドには終わりがある。Deploymentは終了したプロセスを
# 障害とみなして新しいコピーを立ち上げる — ビルドが延々とループし、決して止まらなくなる。
#
# なぜビルドスクリプトがJob自身のcommandフィールド内の文字列ではなく、別オブジェクトとして存在するのか:
#   - YAMLフィールド内の60行のシェルは読むことも検査することもできない。ここではそれは
#     エディタがハイライトし、`bash -n` を受け付ける普通のファイルである;
#   - 1つのコマンドで全体を見られる: kubectl get configmap android-build-script -o yaml;
#   - タスクの記述に触れずにビルドを修正でき、その逆も可能である。
# 利便性の代償: スクリプトはJobとは別に存在する。ConfigMapを変更しても、すでに実行中の
# ビルドはそれに気づかない — 新しいテキストを見るのは次回の実行だけである。
apiVersion: v1
kind: ConfigMap
metadata:
  name: android-build-script
data:
  # 5つのビルドステップ — ビルドサーバー上で手作業で打ち込むであろう、まさにそのコマンド群。
  # コンテナはほとんど空の状態で起動する: JavaとGradleはイメージから来るが、残りはスクリプトが
  # 自分で持ち込む。
  #   1/5  command-line tools をダウンロードする — Android SDK 自体をインストールするユーティリティ(1〜2分)
  #   2/5  ライセンスに同意し、SDK、プラットフォーム34、build-tools をインストールする。最も長いステップで、
  #        5〜15分かかり、その間ずっとログは沈黙する: sdkmanager は非対話モードでは進捗を
  #        表示しない。ここでの沈黙はハングではない
  #   3/5  gradle :app:assembleDebug — /src のソースをAPKにコンパイルする(3〜8分)
  #   4/5  mc、オブジェクトストレージ用のコンソールクライアントをインストールする
  #   5/5  APKを2つの名前でバケットに置く: 日付付きのものと propusk-latest(数秒)
  #
  # どのビルドも同じだけ時間がかかる: キャッシュはなく、/work ディスクは使い捨てである(ファイル末尾の
  # emptyDir を参照)。実際のビルドサーバーであれば代わりに永続ボリュームがあり、2回目の
  # ビルドは数分で終わるだろう。
  #
  # 以下は build.sh ファイルの一字一句そのままの内容であり、YAMLではない。その中のハッシュで始まる行は
  # スクリプトにそのまま入る: それらはシェルのコメントであり、削除する必要はない。
  build.sh: |
    #!/usr/bin/env bash
    # ここでの set -e は適切: これは検査ではなくビルドである。ステップが失敗したら —
    # 続行しても意味がなく、Jobはエラーで終了し、ログとともにクラスタに
    # 残るべきである。
    set -euo pipefail

    WORK=/work
    export HOME="$WORK"
    export ANDROID_SDK_ROOT="$WORK/android-sdk"
    export ANDROID_HOME="$ANDROID_SDK_ROOT"
    export GRADLE_USER_HOME="$WORK/gradle-home"
    # 使い捨てコンテナではGradleデーモンは不要: それは次回のビルドのために存在するが、
    # このコンテナに次回のビルドはない。
    # -Duser.home は必須であり、上の export HOME の重複ではない。Javaはホーム
    # ディレクトリを環境変数からではなくシステムのユーザーレコードから取得するが、
    # 非特権uidにはそれがない — Gradleは "?" を代入し、APKのパッケージングで
    # 失敗する: 署名鍵を /work/project/app/?/.android/ のようなパスで探すからである。
    export GRADLE_OPTS="-Xmx3g -Dorg.gradle.daemon=false -Duser.home=$WORK"

    CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
    MC_URL="https://dl.min.io/client/mc/release/linux-amd64/mc"

    echo "== 1/5 ставлю Android command-line tools =="
    mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    cd "$ANDROID_SDK_ROOT/cmdline-tools"
    curl -fsSL -o tools.zip "$CMDLINE_TOOLS_URL"
    # unzip はすべてのベースイメージにあるわけではないが、JDKのjarはzipを展開できる。
    unzip -q tools.zip 2>/dev/null || jar xf tools.zip
    rm -f tools.zip
    mv cmdline-tools latest
    export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

    echo "== 2/5 принимаю лицензии и качаю SDK (самый долгий шаг) =="
    # `yes` は sdkmanager が入力を閉じたときに SIGPIPE を受け取り、非ゼロの
    # コードを返す。set -o pipefail があると、これが理由もなくビルドを失敗させて
    # しまうので、戻りコードはここで意図的に握りつぶしている。もしライセンスが実際に
    # 同意されていなければ — 次のコマンドがそれを教えてくれる。
    yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
    sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
      "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    echo "== 3/5 собираю APK =="
    # ConfigMap は読み取り専用でマウントされ、Gradleはソースの隣に書き込むので、
    # ツリーはまずディスクにコピーされる。
    # -L はシンボリックリンクを解決する: ConfigMap はファイルとしてではなく、
    # 内部の ..data ディレクトリへのリンクとしてマウントされるので、-L がないとリンクがプロジェクトに紛れ込む。
    # /src/. ではなくグロブを使うのは — この内部ディレクトリ自体がコピーされないようにするため。
    mkdir -p "$WORK/project"
    cp -rL /src/* "$WORK/project/"
    cd "$WORK/project"
    gradle --no-daemon :app:assembleDebug

    APK="$WORK/project/app/build/outputs/apk/debug/app-debug.apk"
    ls -l "$APK"

    echo "== 4/5 ставлю клиент S3 =="
    # クライアントを /usr/local/bin ではなく作業フォルダに置く。Podは非特権
    # ユーザーとして実行され、イメージのシステムフォルダはrootに属している:
    # そこへの書き込みは Permission denied で終わる — しかもここ、4番目のステップ、
    # つまり30分のビルドの後で。/work フォルダは我々のもので、書き込める。
    mkdir -p "$WORK/bin"
    curl -fsSL -o "$WORK/bin/mc" "$MC_URL"
    chmod +x "$WORK/bin/mc"
    # PATH はシェルがコマンドを探すフォルダのリストである。自分のを追加して、以降は
    # フルパスではなく単に `mc` と書けるようにする。
    export PATH="$WORK/bin:$PATH"

    echo "== 5/5 кладу APK в бакет =="
    # 変数 accessKey/secretKey/endpoint/bucketName は envFrom を通じて Secret から
    # 来る。alias set の出力は握りつぶす: ログに何かを表示する必要はない。
    # 同じ理由でスクリプトに set -x はない — それはキーを表示してしまう。
    # エイリアス名は lab ではなく builds: `lab` という語はすべてのラボで学習用
    # クラスタを指すのに使われており、一方を他方と混同すべきではない。
    mc alias set builds "https://${endpoint}" "${accessKey}" "${secretKey}" >/dev/null
    STAMP="$(date -u +%Y%m%d-%H%M%S)"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-${STAMP}.apk"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-latest.apk"
    # マーカー行: check.sh はこれで「Jobが実行された」と「APKが届いた」を区別する。
    echo "APK-UPLOADED ${bucketName}/propusk/propusk-${STAMP}.apk"
    mc ls --recursive "builds/${bucketName}/propusk/"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: propusk-build
spec:
  # ビルドが失敗した場合にPodを再作成する回数。ゼロの方が正直だろうが、
  # ネットワークはSDKのダウンロード中にときどき瞬断する。2回目の試行は
  # 「なぜ自分のは失敗したのか」を説明するより安上がりだ。
  backoffLimit: 1
  # ビルド全体の上限。これがないと、ハングしたビルドが夕方までノードを占有してしまう。
  # カウントダウンはコンテナの起動からではなくJobの作成から進む: Pending中の時間や
  # ラボの少し先でのノード再作成もこれを消費する。1時間では足りなかった —
  # 人がビルドを待ち終えた直後に DeadlineExceeded で死んでいた。
  activeDeadlineSeconds: 7200
  # Podテンプレート: Jobはこれからビルドを実行するPodを打ち出す。Podには自分の
  # 名前がない — Jobは自分の名前にランダムな末尾を付け足すので、Podは名前ではなく
  # job-name ラベルで探すことになる。
  template:
    spec:
      # ビルドはインターネットから他人のコードを引いてきて、すぐにそれを実行する。そのために
      # root権限は不要: 書き込むのは /work だけ — S3クライアントも含めて。それもそこへ
      # ダウンロードする、なぜなら非特権ユーザーはイメージのシステムフォルダへの書き込みを
      # 許されないからである。同じ3つのフィールドが最初のラボのアプリにも同じ理由で
      # 付いていた: それらがないと、`restricted` セキュリティプロファイルが有効な
      # クラスタにPodは受け入れられない。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # Jobにとってこれは必須のフィールドである。Never が意味するのは: 失敗したPodを
      # その場で再起動せず、判断をJobに委ねる — Jobが新しいものを作成する。
      restartPolicy: Never
      containers:
        - name: build
          # コンテナレベルでも同じ厳格さ: 自分の権限を昇格させるのは禁止、
          # linuxのケーパビリティは一つ残らず剥奪されている。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # GradleとJDK 17を備えた出来合いのイメージ。JDKのバージョンは恣意的に選ばれた
          # ものではない: app-build.gradle.kts の jvmTarget = "17" と一致しなければ
          # ならず、さもないとビルドはバイトコードのバージョン不一致で失敗する。イメージに
          # Android SDK はない — スクリプトの最初のステップがそれをダウンロードする、なぜなら
          # SDKを内包したイメージは数十ギガバイトあり、SDK自体より引くのに時間がかかるからである。
          image: gradle:8.9-jdk17
          # イメージがデフォルトで行うことではなく、/scripts にマウントされたConfigMapから
          # 自前のスクリプトを実行する。
          command: ["bash", "/scripts/build.sh"]
          envFrom:
            # 4つのシークレットキーはすべて同じ名前の環境変数になる:
            # accessKey, secretKey, endpoint, bucketName。
            - secretRef:
                name: bucket-creds
          # Androidビルドの正直なコスト、経験的に見つけたもの。requests — どれだけ
          # 予約するか: スケジューラは実際の消費量ではなくこの数値でノードを選ぶ。
          # 4ギガバイト未満ではKotlinコンパイラは生き延びられない。
          # limits — 上限: CPUではそこに達すると絞られ、メモリでは
          # コンテナが殺される(OOMKilled)。比較のために、最初のラボのアプリは
          # CPU 20m とメモリ 32Mi で済んでいた。まさにこれらの数値のために学習用
          # クラスタのノードは拡張しなければならない: ラボ0で発注したものにはビルドが収まらない。
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 6Gi
          # 3つのボリューム。ソースとスクリプトは読み取り専用: ConfigMap はどのみち
          # 読み取り専用でマウントされるが、明示的な readOnly はビルドがそこに書き込まないことをすぐに示す。
          # 書き込むのは /work であり、そこが唯一許された場所である。
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: src
          configMap:
            name: propusk-src
            # ConfigMapのキーにはスラッシュを含められないが、マウント時のパスには
            # 含められる。こうしてフラットなマップが、Gradleが期待する
            # ディレクトリツリーへと展開される。
            items:
              - key: settings.gradle.kts
                path: settings.gradle.kts
              - key: build.gradle.kts
                path: build.gradle.kts
              - key: app-build.gradle.kts
                path: app/build.gradle.kts
              - key: AndroidManifest.xml
                path: app/src/main/AndroidManifest.xml
              - key: MainActivity.kt
                path: app/src/main/kotlin/io/aenix/propusk/MainActivity.kt
              - key: strings.xml
                path: app/src/main/res/values/strings.xml
        - name: scripts
          configMap:
            name: android-build-script
            # ボリュームのファイル権限: 読み取りと実行。スクリプトは
            # `bash /scripts/build.sh` として呼び出されるので、ここでの実行ビットは保険である — それは
            # いつかファイルを直接実行する人に必要になる。
            defaultMode: 0755
        - name: work
          # ノード上の一時ディスク、Podとちょうど同じだけ生きる。
          # ここにSDK、Gradleの依存関係、ビルド結果が置かれる。
          emptyDir:
            # 余裕を見て12ギガバイト: SDK、Gradleキャッシュ、ビルド結果で
            # 6〜8である。上限が必要なのは、暴走したビルドがノードのディスクを丸ごと
            # 食い尽くし、隣のPodを道連れにしないようにするためである。
            sizeLimit: 12Gi
