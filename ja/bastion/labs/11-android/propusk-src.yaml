---
# ラボ11。モバイルアプリ「Пропуск」のソース — ビルドに入力として渡されるもの。
#
# これは管理クラスタ上のテナントではなく、あなたの学習用クラスタ `lab` に適用します:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f propusk-src.yaml
# ここには tenant-workshopXX のようなプレースホルダはありません — 自分の番号をどこにも差し込む必要はありません。
# Namespace も指定されていません: オブジェクトは kubeconfig に記載されたものに配置されます。
#
# アプリはあえて極小です: 1つのアクティビティ、画面に1行のテキストだけ。
# このラボの主眼は Android ではなく、ビルドがクラスタへと運ばれるという事実にあります。
#
# これらのファイルが何なのか、モバイルアプリを一度もビルドしたことがない場合のために。
# Android プロジェクトはコードの入った1つのファイルではなく、3種類のファイルからなるツリーです:
#   *.gradle.kts  ビルドの記述: どこからライブラリを取得し、何でコンパイルし、どの
#                 Android バージョン向けにビルドするか。役割としては makefile ですが、言語は Kotlin です;
#   *.kt          アプリケーション本体のコード;
#   *.xml         リソース: テキストと、アイコンをタップしたときにどの画面を開くかの
#                 記述。
# ビルダーの Gradle はこのツリーを読み、APK を出力します — 電話用の1つのインストーラファイルで、
# 役割としては Windows の .msi と同じです。自分で Android SDK を入れて手作業でビルドする必要は
# ありません: それは android-build.yaml の Job がやってくれ、ここにはその入力だけが置かれています。
#
# ソースがイメージではなく ConfigMap に置かれているのは、最初のアプリのラボで nginx の
# ページが ConfigMap に置かれていたのとまったく同じ理由からです:
# 何も再ビルドせずにそれらを変更できるようにするためです。ConfigMap はクラスタのオブジェクトで、その中に
# テキストファイルが入っており、コンテナ起動時にクラスタがそれらを
# ディスク上の普通のファイルとしてコンテナ内に差し込みます。
#
# `data` の中のキーはファイル名で、`|` の後のインデントより下にあるものはすべて
# YAML ではなくファイルの逐語的な内容です。そのような
# ブロックの中に置かれたコメントはファイル自体の1行になってしまうため、以下の説明はすべて外側、
# キーの前に置かれています。
#
# 6つのキーからなる平坦なマップがディレクトリツリーに展開されるのはここではなく、
# マウント時です:「キー -> パス」の対応は android-build.yaml の
# volumes.items ブロックで定義されています。ConfigMap のキーはスラッシュを含められません — そのため平坦な名前の
# app-build.gradle.kts になっており、プロジェクトでは app/build.gradle.kts になります。
apiVersion: v1
kind: ConfigMap
metadata:
  name: propusk-src
data:
  # プロジェクトの最上位ファイル: Gradle がどこからプラグインとライブラリを取得するか、そしてどの
  # モジュールがプロジェクトに含まれるか（ここでは1つ — app）を列挙します。3つのリポジトリはすべて公開で、インターネット上にあります:
  # ビルドコンテナは空の状態で起動し、そこからすべてを取得します。それがビルドの所要時間の理由です。
  # ここは、情報セキュリティが外部への出口を閉じたときに最初に直す場所でもあります — ここに
  # 内部プロキシリポジトリが書き込まれます。Docker Hub を Harbor に切り替えたのとまったく同じように。
  settings.gradle.kts: |
    pluginManagement {
      repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
      }
    }
    dependencyResolutionManagement {
      repositories {
        google()
        mavenCentral()
      }
    }
    rootProject.name = "propusk"
    include(":app")

  # ルートのビルドファイル: 2つのプラグイン — Android ビルダーと Kotlin コンパイラ — のバージョンを
  # 固定します。`apply false` は「バージョンは宣言するが、ルートプロジェクトでは有効化しない」という意味で:
  # 有効化するのは app モジュールです。バージョンはあえて釘で打ち付けてあります。
  # 「最新」を取得するビルドは、1か月後には今日とは違う形でビルドされ、それを解明するのはあなたになります。
  build.gradle.kts: |
    plugins {
      id("com.android.application") version "8.5.2" apply false
      id("org.jetbrains.kotlin.android") version "1.9.24" apply false
    }

  # アプリモジュールそのものの記述。ここにはビルドが何をダウンロードするか、そしてアプリが
  # そもそもどこで動くかを左右する3つの数字があります:
  #   compileSdk 34   コンパイルに使う Android SDK のバージョン。SDK インストールの手順が
  #                   ダウンロードするのがこれで — 約1.5ギガバイト、ビルドで最も時間のかかる手順です;
  #   minSdk 24       アプリが動く最も古い Android（これは Android 7 です）。
  #                   上げれば古い電話を切り捨て、下げれば互換性
  #                   ライブラリを引きずり込む羽目になります;
  #   jvmTarget 17    Kotlin は Java のバイトコードにコンパイルされ、この数字は
  #                   ビルドイメージ内の JDK バージョン（android-build.yaml の gradle:8.9-jdk17）と一致していなければなりません。
  #                   食い違うと、バイトコードのバージョン不一致でビルドが落ちます。
  app-build.gradle.kts: |
    plugins {
      id("com.android.application")
      id("org.jetbrains.kotlin.android")
    }

    android {
      namespace = "io.aenix.propusk"
      compileSdk = 34

      defaultConfig {
        applicationId = "io.aenix.propusk"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
      }

      compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
      }

      kotlinOptions {
        jvmTarget = "17"
      }

      sourceSets {
        getByName("main") {
          java.srcDirs("src/main/kotlin")
        }
      }
    }

  # 電話向けのアプリのパスポート: どんな画面があり、そのうちどれがアイコンをタップしたときに
  # 開くか。それをまさに担うのが MAIN と LAUNCHER を持つ intent-filter ブロックです —
  # それがないとアプリはインストールされますが、メニューにアイコンが現れません。
  AndroidManifest.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <manifest xmlns:android="http://schemas.android.com/apk/res/android">
      <application android:label="@string/app_name">
        <activity
            android:name=".MainActivity"
            android:exported="true">
          <intent-filter>
            <action android:name="android.intent.action.MAIN" />
            <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
        </activity>
      </application>
    </manifest>

  # アプリの唯一の画面 — そしてプロジェクトが持つコードのすべて。
  # 互換性ライブラリではなく、素の android.app.Activity を使っています: プロジェクトの外部
  # 依存はゼロで、それによって各ビルドで数分のダウンロードが節約できます。
  # R.string.greeting — strings.xml のテキストへの参照。R クラスはソースには入っておらず、
  # ビルドが生成します。そのため「unresolved reference: R」というエラーは、コードのタイプミスではなく、
  # リソース生成の手順が落ちたことを意味します。
  MainActivity.kt: |
    package io.aenix.propusk

    import android.app.Activity
    import android.os.Bundle
    import android.widget.TextView

    class MainActivity : Activity() {
      override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val view = TextView(this)
        view.textSize = 22f
        view.setPadding(48, 96, 48, 48)
        view.text = getString(R.string.greeting)
        setContentView(view)
      }
    }

  # コードから切り出されたテキスト: こうすることでプログラマに触れずに編集・翻訳できます。
  # app_name は電話のアイコンの下に見え、greeting は画面そのものに見えます。
  strings.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <resources>
      <string name="app_name">Пропуск</string>
      <string name="greeting">Заказать пропуск для гостя</string>
    </resources>
