---
# ラボ 11. ビルド済み APK 用のバケット。
#
# バケットとはオブジェクトストレージ内の名前付き領域であり、ファイルは丸ごとの
# オブジェクトとして HTTP 経由で格納・取得され、どこにもマウントされません。内部に
# ディレクトリは存在せず、オブジェクト名のスラッシュはインターフェース上でだけツリー
# として描画されます。
#
# これはテナントオブジェクトです。`lab` クラスタ内ではなく、管理クラスタ上の
# あなたの namespace に存在します。だからここで必要な kubeconfig はテナント用のもので
# あり、`lab` クラスタを操作するときに使うものではありません。これは意図的な設計です。
# ビルド成果物はそれがビルドされたクラスタよりも長く存続すべきだからです。
#
# 適用する前に tenant-workshopXX を自分の namespace に置き換えてください。さもないと
# 注文が誤ったテナントに送られ、おそらく権限チェックを通過しません。
#
#     export KUBECONFIG=~/.kube/config
#     kubectl apply -f bucket.yaml
#
# 同じことはテナントダッシュボードでマウスを使っても行えます（アプリケーションを作成 -> Bucket）。
# 結果は同一で、違いはテキストならレビューして Git に入れられることです。
#
# 適用後に起きること: プラットフォームは数秒でバケットを立ち上げ、アクセスキーを
# 発行し、それを同じ namespace 内のシークレット bucket-builds-ci-credentials に格納します。
# そこにある 4 つの値（endpoint, bucketName, accessKey, secretKey）は手作業で
# `lab` クラスタに転送します。クラスタは別物であり、何も自動では移動しません。
apiVersion: apps.cozystack.io/v1alpha1
kind: Bucket
metadata:
  # Cozystack オブジェクトの名前であり、それだけです。ストレージ内の実際のバケット名は
  # プラットフォーム自身が発行します。bucket-a9209f83-... のような長い形式です。それは
  # 発行されるシークレットの bucketName フィールドに入り、ビルドに差し込むべきなのは
  # まさにそれであって、`builds` ではありません。
  name: builds
  namespace: tenant-workshopXX
spec:
  users:
    # このマップの各キーは、それぞれ独自のキーペアを持つ別々の S3 ユーザーです。
    # 空のオブジェクトは「読み取りと書き込みのフルアクセス」を意味します。
    # こうすればビルダーには書き込みを、モバイルチームには読み取り専用を付与できます:
    #   ci: {}
    #   mobile:
    #     readonly: true
    ci: {}
