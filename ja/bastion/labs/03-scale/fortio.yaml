# ラボ3。Fortio 負荷ジェネレーター: ジェネレーター本体と、その Web
# インターフェースへの安定したアドレス。`---` で区切られた 2 つのオブジェクト。
#
# 管理クラスターのテナントではなく、あなたの学習用クラスター `lab` に適用します:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f fortio.yaml
# ここには tenant-workshopXX のようなプレースホルダーはありません — 自分の番号をどこかに差し込む必要はありません。
# この同じファイルはラボ4でも必要になります: `kubectl apply -f ../03-scale/fortio.yaml`。
#
# マニフェストの共通フィールド (apiVersion, kind, metadata.name, selector, template,
# securityContext) は ../01-deploy/rickroll.yaml で 1 行ずつ解説されているため、ここでは
# 繰り返しません。負荷ジェネレーター固有のものだけをコメントします。
---
# Web インターフェース付きの負荷ジェネレーター。
# hey/ab の代わりにあえてこれを選びました: 負荷はブラウザのボタンで開始し、
# 遅延のヒストグラムもその場で見られます。過去のワークショップでは、まさに
# コンソールツールで人を取りこぼしていました。
#
# Fortio は通常のアプリケーションとしてクラスター内に存在し、内部から rickroll のアドレスを叩きます。
# 外部から、VM から負荷をかけたほうがトラフィック的には正直ですが、クラスターへの回線に
# 突き当たってしまい、アプリケーションではなく自分の Wi-Fi を測ることになってしまいます。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # ジェネレーターは 1 コピーで十分です: それ自身が多数のスレッドで負荷を生み出します。
  # ここで 2 つ目のコピーは絵をぼかすだけです — Web インターフェースのカウンターは
  # コピーごとに別々で、リクエストの半分しか見えなくなります。
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # rickroll と同じセキュリティプロファイル: root 以外で動作し、特定の
      # UID、標準の seccomp。あえて残しています — `restricted` プロファイルが有効な
      # クラスターでもこのファイルを適用できるように。そうでなければ Pod は起動しません。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # latest タグはバージョンを照合しないためのワークショップ向けの意図的な簡略化です。
          # 本番クラスターではこうしません: このタグの下のイメージは 2 回の apply の間に
          # 気づかれずに入れ替わることがあり、昨日の結果を再現できなくなります。
          image: fortio/fortio:latest
          # `server` モードは Web インターフェースを立ち上げて動かし続けます。この引数がないと
          # Fortio はコマンドラインから 1 回だけ実行して終了し、クラスターはコンテナを
          # ループで再起動し続けることになります。
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            # リクエストは rickroll 自身 (20m) より高くしています: ジェネレーターにはノード上の場所が
            # 事前に必要で、そうでないとスケジューラーがぎりぎりに配置し、立ち上がりが不揃いになります。
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # ジェネレーターには CPU の余裕が必要です。そうでないと自分自身に
              # 突き当たり、アプリケーションではなく Fortio に負荷をかけることになります。
              cpu: "1"
              memory: 256Mi
---
# クラスター内部のジェネレーターの安定したアドレス。`kubectl port-forward svc/fortio 8081:8080`
# 経由で VM から Web インターフェースを開くために必要です — 外部にクラスターは
# 何も公開しておらず、Fortio への他の扉はありません。
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  ports:
    # 両側とも 8080: サービスもコンテナも。番号は Pod 内の rickroll と同じですが、
    # 衝突はありません — 各 Pod には独自のネットワークスタックがあります。
    - port: 8080
      targetPort: http
