---
# ラボ 3. CPU 負荷に応じてレプリカを増やす。
# 目標は requests.cpu（20m）の 50%、つまりしきい値は 1 ポッドあたり 10m。
# 意図的に低く設定している: 負荷は数秒で発火しなければならない。
# ラボに使えるのは半日ではなく 30 分だからだ。
#
# 単一のオブジェクト。テナントの管理クラスターではなく、あなたの学習クラスター `lab` に適用する:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f hpa.yaml
# ここには tenant-workshopXX のようなプレースホルダーはない — 自分の番号をどこかに差し込む必要はない。
#
# オブジェクトは作成されても動作しなくなる、2 つの条件:
#   1. rickroll コンテナに requests.cpu が設定されていること — さもないとパーセンテージを計算する基準がなく、
#      `kubectl get hpa` の TARGETS 列は永遠に <unknown> のままになる。
#   2. クラスターで metrics-server が動作していること — ポッドの現在の消費量のソース。
# このフォルダの check.sh が両方の条件を検証する。
#
# HPA が存在する限り、Deployment の replicas フィールドはそれに属する。`kubectl scale` で手動でコピー数を
# 変更することはできるが、HPA は数秒以内に自分の値を復元する。
# だからラボ 4 ではロールアウト前にこのオブジェクトを削除する: 1 つのフィールドに 2 つのメカニズム —
# 何が起きたのか理解できなくなる確実な方法だ。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # HPA の名前はアプリケーション名と一致する必要はない — ここで一致しているのは便宜上のことだ。
  # 何を管理するかは、この名前ではなく下の scaleTargetRef が決める。
  name: rickroll
spec:
  # 誰を監視し、誰の replicas フィールドを変更するか。3 つのフィールドを一緒に指定するのは、型なしの
  # 名前が曖昧だからだ: Deployment と StatefulSet が同じ名前を持ちうる。
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rickroll
  # どんな負荷でも HPA が超えない範囲。下限はラボが始まったときと同じ
  # 1 コピー。上限は 6: limits.cpu 300m で学習ノードに収まる数であり、
  # かつポッド一覧で目で見て分かる数だ。
  # maxReplicas: 1 にすると、オブジェクトは作成されるが何もしない。
  minReplicas: 1
  maxReplicas: 6
  # 何をもとに判断するか。メトリクスは複数ありうる。その場合 HPA は
  # より多くのコピー数を必要とするものを採用する。ここでは 1 つ — CPU。
  metrics:
    - type: Resource
      resource:
        name: cpu
        # Utilization はノードの容量ではなく、コンテナの requests.cpu に対する割合。
        # ここから直感に反する帰結が生じる: 値は平然と 600% になりうるが、それは
        # エラーではない: ポッドは予約した量の 6 倍を消費している。
        # 代替は AverageValue で、しきい値をミリコアで直接指定する。
        target:
          type: Utilization
          averageUtilization: 50
  # どれだけ機敏に反応するか。ブロックは任意: なければデフォルト値が使われ、
  # それはデモではなく本番運用向けに設計されている。
  behavior:
    scaleUp:
      # デフォルトでは Kubernetes は安定化を待ち、ゆっくり増える。
      # ラボではこれが「何も起きていない」ように見えるので、加速する。
      stabilizationWindowSeconds: 0
      # 15 秒ごとに新しいコピーは最大 2 つまで。ステップは経験的に選んだ:
      # 増加が増加として見え、1 から一気に 6 への瞬間的な跳躍ではない。
      # その跳躍では参加者に見るべきものが何もない。
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      # 一方、下方向は逆に — 瞬時ではない。さもないとポッドは
      # 参加者が見る間もなく消えてしまう。
      # デフォルトの 5 分ではなく 1 分: ラボは 30 分で進行し、縮小を待つ
      # 5 分を埋めるものがない。本番クラスターでは長い窓こそ有用だ —
      # 不均一な負荷での揺れを抑えてくれる。
      stabilizationWindowSeconds: 60
