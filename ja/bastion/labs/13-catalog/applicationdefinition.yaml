---
# ラボ 13。Cozystack カタログ用のアプリケーション定義 — まさに「カタログの項目」。
#
# このオブジェクト自体は何もデプロイしません。次の三つを結びつけます。あなたのチャート
#（何をデプロイするか）、API 内の新しいオブジェクト型（アプリケーションをどう注文するか）、そして
# ダッシュボードのカード（その過程で人が何を見るか）。これが存在しない間、チャートはプラット
# フォームが何も知らないファイルのフォルダのままで、Postgres や Redis の隣のアプリケーション一覧は空です。
#
# namespace なしで、単一のコマンドで適用します:
#   kubectl apply -f applicationdefinition.yaml
#
# 重要: このオブジェクトは CLUSTER-SCOPED です — namespace を持たず、クラスタ全体で一つ
# だけ存在します。テナントはこれを適用できません。これは検証済みです:
#   kubectl auth can-i create applicationdefinitions   ->   no
# あなたの作業はファイルを書いてローカルで確認したところで終わります。
# 適用はプラットフォーム管理者が行います。README の「あなたの権限が
# どこで終わるか」の節を参照してください。
apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: guest-pass
spec:
  # --- API ではどう見えるか ----------------------------------------------
  application:
    # 新しいオブジェクト型の Kind。適用後、クラスタに
    # kind: GuestPass が現れ、通常の kubectl でそれを扱えるようになります。
    kind: GuestPass
    plural: guestpasses
    singular: guestpass
    # 値のスキーマ — チャート内に values.schema.json というファイルとして置かれているのと
    # 同じもので、一行で書かれているだけです。API はこれを使って不正な値を
    # 拒否し、ダッシュボードは作成フォームを描画します。
    openAPISchema: |-
      {"title":"Chart Values","type":"object","properties":{"replicas":{"description":"Number of application replicas.","type":"integer","default":2},"greeting":{"description":"Text shown on the main page.","type":"string","default":"Order a pass for your guest"},"external":{"description":"Enable external access from outside the cluster.","type":"boolean","default":false},"resources":{"description":"Explicit CPU and memory configuration.","type":"object","default":{},"properties":{"cpu":{"description":"CPU available to each replica.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true},"memory":{"description":"Memory (RAM) available to each replica.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true}}}}}

  # --- 何をデプロイするか ----------------------------------------------
  release:
    # リリース名 = prefix + オブジェクト名。`main` という名前の GuestPass オブジェクトは
    # リリース `guest-pass-main` としてデプロイされます。prefix は必須で、
    # 異なるアプリケーションのリリースが名前で衝突しないために必要です。
    prefix: guest-pass-
    labels:
      # 同じキーで Cozystack はテナントのリリースを Flux のシャードに分配します。
      # これがないとリリースを reconcile する担当がいなくなります。
      sharding.fluxcd.io/key: tenants
    chartRef:
      # チャートをどこから取るか。許可される kind: OCIRepository, HelmChart,
      # ExternalArtifact。外部カタログは通常
      # GitRepository -> HelmChart を経由して届き、その namespace は cozy-public です。
      kind: HelmChart
      name: cozystack-guest-pass
      namespace: cozy-public

  # --- ダッシュボードではどう見えるか ------------------------------------------
  dashboard:
    # カタログのセクション。使われる値は PaaS, IaaS, NaaS, Administration,
    # Networking です — 自分で考え出すのではなく既存のものを使ってください。
    # さもないとアプリケーションが項目一つだけのセクションに入ってしまいます。
    category: PaaS
    singular: Guest Pass
    plural: Guest Passes
    description: Internal guest pass service for employees and reception
    tags:
      - internal
      - web
    # アイコン — base64 の SVG。パスや URL ではなく、まさに base64 です: ダッシュボードは
    # どこかへ何かをダウンロードしに行ったりしません。ソースは隣の icon.svg にあります。
    icon: 
    # オブジェクトの YAML 表現でのフィールドの順序。装飾的なものですが、これがないと
    # フィールドが無秩序に並び、フォームが読みにくくなります。
    keysOrder: [["apiVersion"], ["kind"], ["metadata"], ["metadata", "name"], ["spec", "replicas"], ["spec", "greeting"], ["spec", "external"], ["spec", "resources"]]
