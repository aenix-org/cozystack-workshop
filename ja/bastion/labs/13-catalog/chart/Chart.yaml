# ラボ13。「入館証」チャートのパスポート。
#
# チャートとはフォルダのことです。マニフェストのテンプレートは templates/、デフォルト値は values.yaml、
# パラメータのスキーマは values.schema.json に置かれます。ラボのフォルダから
# `helm install <リリース名> chart` コマンドでデプロイされ、Cozystack のカタログでは、
# 誰かがダッシュボードからアプリケーションを注文したときに、プラットフォーム自身によってデプロイされます。
#
# Chart.yaml はパッケージの表紙です。これによって Helm はパッケージの名前とバージョンを把握します。
apiVersion: v2
name: guest-pass
description: Internal guest pass service — order a pass for a visitor
type: application

# 次に2つのバージョンが出てきますが、Helm の中でこれほど混同されるものは他にありません。これらは別物です。
#
# version — パッケージングのバージョン。テンプレート、値、またはスキーマを編集したときに変わります。
# たとえ中身のアプリケーションが同じままでも変わります。これこそが Helm がリリースの更新時に比較するもので、
# リポジトリにアップロードされたパッケージを区別するのもこれです。これを上げなければ、
# プラットフォームはパッケージが変更されていないとみなし、新しいバージョンが見過ごされることがあります。
version: 0.1.0
# appVersion — パッケージの中にあるアプリケーション自体のバージョン。ここでは nginx です。独自の
# ライフサイクルを持ちます。テンプレートを一切編集せずにアプリケーションが10回更新されることもあれば、その逆——
# テンプレートを書き換えたのにアプリケーションは同じ、ということもあります。オブジェクト名には現れず、
# `helm list` の出力とカタログのカードに表示されます。
appVersion: "1.0"
