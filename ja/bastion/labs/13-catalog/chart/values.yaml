# ラボ 13。「入館証」チャートのデフォルト値。
#
# これはチャートがデプロイ時に尋ねる質問への回答です: コピーを何個にするか、ページに
# どんなテキストを表示するか、外部アドレスが必要かどうか。「何も選ばなかった」場合に
# 備えてここに書かれています。アプリケーションを注文する人がこれらを上書きします:
# ダッシュボードではフォームの各フィールドで、ターミナルでは `--set replicas=5` という
# キーや自前のファイル `helm install ... -f my.yaml` で。このファイルを編集すると、
# すでにデプロイ済みのものではなく、今後の注文のためのデフォルトが変わります。
#
# ここの値がダッシュボードの注文フォームにどう変わるか:
#   型         — どのフィールドを表示するか: {int} 数値、{bool} トグル、
#                {string} 入力欄、{struct} 入れ子のフィールドグループ;
#   説明       — フィールドのラベルとその下のヒント;
#   =値        — フォームを開いたときにすでに入っている内容;
#   必須かどうか — スキーマの required リストで指定されます。ここには無し: どの
#                パラメータにもデフォルト値があるので、どのフィールドも省略できます。
# だからこそ説明は英語で書かれます: それを読むのはチャートの作者だけでなく、
# ダッシュボードでアプリケーションを注文する誰もがだからです。

## `## @param` の形式のコメントは飾りではありません。これらから Cozystack のジェネレーター
## (cozyvalues-gen) が values.schema.json と README のパラメータ表を生成します。
## 形式: ## @param {型} 名前=デフォルト値 - 説明。

# アプリケーションのコピーをいくつ起動しておくか。コピーが 1 つだと、ノードの再起動中は
# ダウンタイムになり、2 つならどちらか一方を失っても生き残ります。
## @param {int} replicas=2 - Number of application replicas.
replicas: 2

# メインページのテキスト。子会社ごとに内容が違い、そのためだけに別のイメージを
# ビルドする人などいないので、パラメータとして切り出しています。
## @param {string} greeting=Order a pass for your guest - Text shown on the main page.
greeting: "Order a pass for your guest"

# アプリケーションにクラスター外のアドレスが必要かどうか。Cozystack カタログの慣習:
# external という名前のフィールドは、どのアプリケーションでも同じこと — 外部アクセス — を意味します。
## @param {bool} external=false - Enable external access from outside the cluster.
external: false

# 1 つのコピーのサイズ。注文フォームで 2 つの無関係なフィールドではなく 1 つの
# 「リソース」ブロックに見えるよう、別のフィールドグループとして切り出しています。
## @typedef {struct} Resources - CPU and memory for each replica.
## @field {quantity} cpu - CPU available to each replica.
## @field {quantity} memory - Memory (RAM) available to each replica.

## @param {Resources} resources - Explicit CPU and memory configuration.
resources:
  cpu: 100m
  memory: 128Mi
