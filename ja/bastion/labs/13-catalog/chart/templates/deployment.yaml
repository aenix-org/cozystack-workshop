# ラボ13。Deploymentテンプレート: 何を、いくつのコピーで起動するか。
#
# templates/ 内のファイルは完成したマニフェストではなく、雛形です。Helmはそこに値を差し込み、
# 結果をクラスタへ渡します: `helm template main chart` は何も適用せずレンダリング結果のテキストを
# 表示し、`helm install main chart` はそれを適用します。
#
# 二重波括弧は差し込みの箇所です。その中には次のものが現れます:
#   .Values.名前  — パラメータ値: 顧客が触っていなければ values.yaml から、
#                   自分で選んだならダッシュボードの注文フォームから取られます;
#   .Release.Name — リリース名、つまりチャートの具体的な展開の名前。
# 波括弧の外側のテキストはそのままマニフェストへ入ります。
apiVersion: apps/v1
kind: Deployment
metadata:
  # オブジェクト名はリリース名から組み立てられ、直書きされません。同じチャートは
  # 1つのnamespaceに一度ならず展開され、固定名だと二番目の注文が一番目を上書きしてしまいます。
  # リリース `main` は `main` という名前のDeployment、Service、ConfigMapを生み、
  # 名前を見ればそれらが一つのグループだと一目でわかります。
  name: {{ .Release.Name }}
  # ラベル: name はこのアプリケーションのすべての注文で同じで、instance は注文を区別します。
  # オブジェクトはこれらで互いを見つけ、`kubectl get` の出力もこれらで絞り込まれます。
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # いくつのコピーを起動し続けるか。コピーが消えると、クラスタは尋ねずに新しいものを作ります。
  # ここから当直の管理者なしでの自己修復が生まれます。
  replicas: {{ .Values.replicas }}
  # selector はどのPodを自分のものとみなすかをDeploymentに伝えます — 名前ではなくラベルで。
  # ここのラベルと template.metadata.labels のラベルは一致しなければなりません。食い違うと、
  # Deploymentは自分のコピーを見つけられず、何度も何度も打ち出し続けます。
  selector:
    matchLabels:
      app.kubernetes.io/name: guest-pass
      app.kubernetes.io/instance: {{ .Release.Name }}
  # template はPodの雛形です。以下のすべては、Deployment自体ではなく、
  # それがこの雛形から作るアプリケーションのコピーを記述します。
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guest-pass
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Podのアノテーションに入る設定のハッシュ。これがないと、ConfigMapを編集してもPodは
        # 再起動されず、誰かが手で削除するまで新しいテキストは現れません。
        # これはチャート全般に対する最もよくある不満です。
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # アプリケーションはrootではなく、権限を絞って動きます。カタログのチャートは
      # 他のテナントが自分のnamespaceで展開するもので、コンテナの権限は
      # アプリケーションとともに彼らに約束するものの一部です。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # イメージはテンプレートに書かれ、意図的にパラメータへ出していません: 顧客はサイズと
          # テキストを選びますが、アプリケーション自体を任意のものに差し替えることはできません。
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # この変数がないと、nginxはノードのコアごとに1つのワーカープロセスを立ち上げます。
          # 数十コアのノードでは数十個になり、メモリ上限が100メガバイトのPodは最初のリクエストの
          # 前にOOMKilledで死にます。チャートは他のテナントへ出ていき、そこのノードは何でもあり得るので、
          # ここではこれが必須です。
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # コンテナ内部のポート。名前 http はこの先プローブとServiceで使われ、
          # ポート番号が3か所ではなく1か所に記録されるようにしています。
          ports:
            - containerPort: 8080
              name: http
          # requests — どれだけを保証して割り当てるか。この数値でスケジューラがノードを選びます。
          # ここでの limits はメモリのみ: 超えるとコンテナは殺されて起動し直されます。
          # CPUの上限は意図的にありません。さもないとアプリケーションはより遅く動くのではなく
          # 天井にぶつかってしまいます。
          # `| quote` フィルタは差し込まれた値を引用符で包みます: ユーザーは 1 と
          # 入力するかもしれず、引用符がないと "1" や "100m" のような記述が期待される場所に
          # 数値がマニフェストへ入ってしまいます。
          resources:
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
            limits:
              memory: {{ .Values.resources.memory | quote }}
          # readinessProbe —「リクエストを受け付ける準備はできたか?」という問い。/healthz が
          # 応答するまで、Serviceはこのコピーへトラフィックを送りません。ここから中断のない更新が
          # 生まれます: 古いコピーは新しいものが応答した後にバランシングから外されます。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          # nginxのページと設定はConfigMapからファイルとしてマウントされます。subPath はちょうど
          # 1つのファイルを差し込みます: これがないと、マウントされたディレクトリが /etc/nginx/
          # conf.d 全体を置き換え、イメージの標準設定が消えてしまいます。
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      # ConfigMapの名前はリリース名から組み立てられるので、Podは常に隣ではなく
      # 自分の注文の設定をマウントします。
      volumes:
        - name: page
          configMap:
            name: {{ .Release.Name }}
        - name: conf
          configMap:
            name: {{ .Release.Name }}
