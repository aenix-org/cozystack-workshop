# ラボ13。Service テンプレート: アプリケーションの安定したアドレス。
#
# アプリケーションのコピーは現れては消え、そのアドレスは毎回新しくなります。Service は変わらない
# 名前を与え、リクエストを生きているコピーへ振り分けます。隣のポッドから
# アプリケーションへはリリース名でアクセスします。
#
# 二重波括弧での置換と、オブジェクト名がどこから来るのかについては
# templates/deployment.yaml に書かれています。ここでもすべて同じ仕組みです。
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # values の中の一つのフラグが、アプリケーションがクラスタ外のアドレスを得るかどうかを決めます。
  # Cozystack の標準アプリケーションも同じ仕組みです: external フィールド。
  # if/else 構文はレンダリング時に二つの値のうち一つを選びます。完成したマニフェストには
  # LoadBalancer か ClusterIP のどちらかが入り、その中に分岐はもう残りません。
  type: {{ if .Values.external }}LoadBalancer{{ else }}ClusterIP{{ end }}
  # トラフィックを誰に渡すか。Service は名前ではなくラベルでポッドを選ぶため、
  # コピーが何個あるか、どんな名前かは気にしません。ラベルは Deployment が
  # 自分のコピーに付けるものと同じです。
  selector:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
  # port — Service 自身がどのポートで待ち受けるか、targetPort — ポッドの内側のどこへ叩きに行くか。
  # targetPort は名前で書かれています: http という名前のポートは Deployment テンプレートで宣言されています。
  # そこで番号が変わっても、ここを直す必要はありません。
  ports:
    - name: http
      port: 80
      targetPort: http
