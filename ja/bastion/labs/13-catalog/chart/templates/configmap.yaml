# ラボ 13。ConfigMap テンプレート: 「パス」ページと nginx の設定。
#
# ConfigMap はテキストファイルを保持し、Pod に配信する。ページはイメージの中ではなく
# ここに置かれており、再ビルドせずにテキストを変更できる: greeting の値はレンダリング時に
# 差し込まれ、リリースを更新するだけで済む。
#
# 差し込みは `|` ブロックの中でも機能する: Helm はテンプレートファイルを単なるテキストとして
# 処理し、YAML の構造については何も知らない。詳細は templates/deployment.yaml を参照。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
# data 内のキーはファイル名であり、`|` の下にあるものはその全内容である。
# 各キーは個別のファイルとしてコンテナにマウントされる。Deployment の volumeMounts を参照。
data:
  # 従業員が目にするページ。ここには 2 つの値が入る: 注文フォームの greeting と
  # リリース名 — 開いたページを見れば誰の注文かが分かるようにするため。
  index.html: |
    <!doctype html>
    <html lang="en">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Guest Pass</title>
    <style>
      body{background:#0d1117;color:#e6edf3;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:12vh 5vw;margin:0}
      h1{font-size:clamp(26px,6vw,56px);margin:0 0 .3em;color:#2f6fed}
      .pod{font-family:ui-monospace,Menlo,monospace;color:#7d8590;margin-top:3em}
    </style>
    <h1>{{ .Values.greeting }}</h1>
    <p>Guest Pass service, release <b>{{ .Release.Name }}</b></p>
    <div class="pod">served by __POD__</div>
    </html>
  # nginx の設定。sub_filter はページを配信する瞬間に __POD__ マーカーを Pod 名に置き換える:
  # こうすることでどのコピーが応答したかがブラウザで分かる。/healthz への個別の応答は
  # Deployment の readinessProbe が必要とする — まさにこのアドレスに問い合わせるからだ。
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location / {
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
