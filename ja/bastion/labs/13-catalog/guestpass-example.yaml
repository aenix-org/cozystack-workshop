---
# ラボ 13。管理者が applicationdefinition.yaml を適用した後に、
# あなたのアプリケーションの注文がどう見えるかを示します。自分のテナントで適用します:
#   kubectl apply -f guestpass-example.yaml
#
# 注意: tenant-workshopXX はプレースホルダーであり、namespace 名ではありません。適用前に XX を
# 自分のテナント番号に置き換えてください。さもないと kubectl は拒否します: そのような namespace は存在せず、
# 他人の namespace には入れてもらえません。
#
# 注目してください: apps.cozystack.io グループは、Bucket や VMInstance、
# その他のカタログアプリケーションが使っているものと同じです。あなたのアプリケーションは
# それらと横並びになり、どこか脇に置かれるわけではありません。
#
# 管理者が定義を登録する前にこのファイルを適用することはできません:
# kubectl は `no matches for kind "GuestPass"` と返します。
apiVersion: apps.cozystack.io/v1alpha1
kind: GuestPass
metadata:
  name: main
  namespace: tenant-workshopXX
# spec 内のフィールドは、chart/values.yaml に記述され、ダッシュボードの注文フォームで
# 表示されるパラメータそのものです。ここではそれらをテキストで書き出しています: ダッシュボードで
# ボタンを押すのと同じですが、このようなファイルはレビューでき、Git に入れてロールバックできます。
spec:
  replicas: 2
  greeting: "Order a pass for your guest"
  external: false
  resources:
    cpu: 100m
    memory: 128Mi
