# ラボ 10 · 各種パスのための MongoDB データベースを注文する。
# あなたが得たいものの記述。サービスの組み立てと設定はプラットフォームが行う。
# ダッシュボードでマウス操作して注文するのと同じこと — ただしテキストで。
# ラボクラスターにではなく、管理クラスター上のテナントに適用する:
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f mongodb.yaml
#
# 適用する前に: tenant-workshopXX を自分の namespace に、
# ЗдесьВашПароль を自分で決めるパスワードに置き換える。
apiVersion: apps.cozystack.io/v1alpha1
kind: MongoDB
metadata:
  name: passes
  namespace: tenant-workshopXX
spec:
  # コピーは 1 つ。MongoDB は 3 つのレプリカセットを想定しており、どれがプライマリかを
  # 投票で決め、1 つの喪失に耐える。コピーが 1 つだと投票する相手がおらず、
  # そのためにチャートは別の「安全でない」モードを有効にする。ラボには十分だが、
  # 本番には向かない。
  replicas: 1
  # データ用のディスク。4 つの学習用ドキュメントなら 1 メガバイトで足りるが、ボリュームは
  # 後で拡張するより最初から余裕を持たせるほうが簡単だ。
  size: 5Gi
  # replicated — クラスターの別ノードにコピーを持つボリューム: ノードが脱落しても、
  # データは残る。
  storageClass: replicated
  # データベースの Pod に割り当てられる CPU とメモリ。4 つのドキュメントには十分すぎる。
  resourcesPreset: s1.small
  # MongoDB のブランチ。稼働中のデータベースで後から変更するにはアップグレードが必要。
  version: v8
  # false — データベースはクラスター内部からのみアクセス可能で、外部にポートは公開されない。
  # アクセスは隣で動く作業用 Pod から行う。
  external: false
  # シャーディングはデータを複数のサーバーセットに分割する。データが 1 台のサーバーに
  # 収まらないときに必要。4 つのパスは収まる。
  sharding: false
  # データベースのユーザーとそのパスワード。パスワードは自分で決めて覚えておくこと: 作業用 Pod
  # (接続文字列 MONGO_URI 内) とチェックスクリプト
  # (変数 MONGO_PASSWORD) で必要になる。アカウントはサービス用データベース admin に作られる —
  # だからこそ接続文字列で authSource=admin が必須になる。
  users:
    passapp:
      password: ЗдесьВашПароль
  # passes データベースとその中の権限: passapp ユーザーにはこのデータベースの admin ロールが
  # 付与され、読み取り、書き込み、インデックス作成、コレクション設定の変更ができる。
  # これは他のデータベースへの権限は与えない。
  databases:
    passes:
      roles:
        admin:
          - passapp
  # オブジェクトストレージへのバックアップ。学習用スタンドでは無効。
  backup:
    enabled: false
