---
# ラボ12。レガシーな従業員名簿用の仮想マシン: ディスクとマシン本体、
# 2つのオブジェクトを1ファイルにまとめ、`---` の行で区切っています。
#
# これらはテナントのオブジェクトです: `lab` クラスタではなく、管理クラスタ上の
# あなたの namespace に配置されます。テナント用の kubeconfig が必要です。
#
# 適用する前に tenant-workshopXX を自分の namespace に置き換えてください。さもないと
# 注文が自分のテナントではなく別のテナントに届いてしまいます。
#
#     export KUBECONFIG=~/.kube/config
#     kubectl apply -f staff-directory-vm.yaml
#
# 同じことはテナントのダッシュボードからマウスでも行えます(アプリケーションを作成 -> VM Disk、
# 続いて VM Instance)。結果は同じです。
#
# 注意: マシンをあとで呼び出す名前は metadata.name とは一致しません。これはラボの
# 誤植ではありません。名前 X の VMInstance オブジェクトを、プラットフォームは
# `vm-instance` チャートでデプロイし、チャート名はリリース名と連結されます: 起動した
# インスタンスは vm-instance-X という名前になります。加えて、ターゲットは型のプレフィックス付きで
# 指定します。テナントの権限がインスタンス(virtualmachineinstances、別名 vmi)に対して
# 付与されており、virtualmachines には付与されていないためです。裸の名前では forbidden が返ります。
# そこでコンソールに入るコマンドは次のようになります:
#     virtctl console --namespace=tenant-workshopXX vmi/vm-instance-spravochnik
# 起動中のインスタンス一覧: kubectl get vmi -n tenant-workshopXX
# そして `kubectl get vminstance spravochnik` はインスタンスではなく、それに対するあなたの注文を
# 表示します。下で記述されているまさにそのオブジェクトです。
#
# ディスクとマシンは2つの別々のオブジェクトであり、これはお役所仕事ではありません: ディスクは
# マシンより長く残ります。マシンは削除して作り直し、同じディスクを付け直すことができます。
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  source:
    image:
      # プラットフォームの共有イメージコレクションにある名前であり、URLではありません。
      # 一覧はディスク作成時にダッシュボードで確認できます。
      name: ubuntu-22.04
  # ディスクサイズ。ソースイメージより小さくすることはできません: ubuntu-22.04 は 20Gi に
  # 展開されるため、プラットフォームは 10Gi のディスクを満たすことを拒否します。ディスクはあとで拡張
  # できますが、縮小はできません。ですからここで小さく見積もるほうが大きく見積もるより高くつきます。
  storage: 20Gi
  # ストレージクラス。`replicated` — データはプラットフォームの複数のノードに複数のコピーとして
  # 書き込まれます: コピーを保持するノードが死んでも、マシンは動き続けます。本質的にはこれは
  # ミラーであり、ただしネットワーク越しに組み立てられたものです。隣のラボのデータベースも同じクラスを使います。
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  # CPU 1、4GB。Kubernetes ノードのサイズを取得するのと同じカタログの参照です:
  # マシンとノードはここでは同じ尺度で測られます。
  instanceType: u1.medium
  # ゲストOSのプロファイル: どのドライバとデバイスをマシンに渡すか。
  instanceProfile: ubuntu
  # Always は「起動し続ける」という意味です: 自分で停止しても — 再び起動されます。
  # Halted — 停止、Manual — 残したまま。
  runStrategy: Always
  # どのディスクをマシンに接続するか。参照は上の VMDisk オブジェクトの名前で行います — この
  # マシンより長く残る、まさにそのディスクです。
  disks:
    - name: spravochnik
  # 注目: ここに replicas フィールドはありませんし、今後もありません。
  # 仮想マシンは単一のオブジェクトです。2台のマシンが必要なら — 名前の異なる
  # 2つのオブジェクトです。これは Deployment との根本的な違いです。
  # この違いがどこで痛むかについては README のセクションを参照してください。
  # ゲストOSの初期設定。cloud-init は Linux クラウドイメージの標準的な仕組みです:
  # 初回起動時にマシンはこのテキストを読み、自分自身に適用します。役割としては
  # vSphere のゲストカスタマイズです — パスワード、ファイル、サービス — ただしウィザードではなく
  # 記述によるものです。`|` の後のインデントより下にあるものはすべて、ゲストへそのまま送られ、
  # Kubernetes ではなくそこで解釈されます。
  #
  # ここで cloud-init は名簿をサーバーにします: HTMLページを配置し、それをポート 8080 で HTTP 越しに
  # 配信するサービスを立ち上げます。python3 は ubuntu イメージにすでに含まれています — このために
  # インターネットは不要です。ポート 8080 は偶然ではありません: 講師があらかじめあなたのテナントに
  # Service `spravochnik-http`(80 -> 8080)と Ingress `spravochnik` を作成しており、マシン内部の
  # サービスが立ち上がるとすぐに、名簿はテナントのドメインで公開されます。
  cloudInit: |
    #cloud-config
    # このパスワードはダッシュボードからコンソールにログインするために必要です。本番のマシンでは
    # このようにしてはいけません — そこでは sshKeys を使います。
    password: ubuntu
    chpasswd: { expire: false }
    ssh_pwauth: true
    write_files:
      - path: /opt/directory/index.html
        content: |
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><title>名簿</title></head><body><h1>社員名簿</h1><ul><li>田中 — 101</li><li>山田 — 102</li></ul></body></html>
      - path: /etc/systemd/system/directory.service
        content: |
          [Unit]
          Description=Staff directory
          After=network.target
          [Service]
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0 --directory /opt/directory
          Restart=always
          [Install]
          WantedBy=multi-user.target
    runcmd: [ "systemctl daemon-reload", "systemctl enable --now directory" ]
