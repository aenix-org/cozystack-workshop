# ラボ 1〜14 用のトレーニング用 Kubernetes クラスター。
# 適用する前に、tenant-workshopXX を自分の namespace に置き換えてください。
#
# 管理クラスター上で適用します — テナントと一緒に発行されたアクセス権を使います。
# このクラスター自体の kubeconfig はまだ存在しません。クラスターが起動してから
# 初めて生成されます。
#
#   kubectl apply -f cluster.yaml
#
apiVersion: apps.cozystack.io/v1alpha1
kind: Kubernetes
metadata:
  name: lab
  namespace: tenant-workshopXX
spec:
  version: v1.35
  storageClass: replicated
  controlPlane:
    # コントロールプレーンのコピーは 1 つだけ: トレーニング用スタンドなので、
    # 耐障害性よりもリソースの節約を優先します。
    replicas: 1
  addons:
    monitoringAgents:
      # 今すぐ有効にします。メトリクス収集は後からさかのぼって有効にはできません:
      # チェックを入れる前に起きたことはすべて失われます。ラボ 14 はこのデータに依存します。
      enabled: true
  nodeGroups:
    md0:
      # コピーの空き容量が足りなくなると、グループは自分でノードを追加できます。
      # スケーリングのラボではそこまでは至りません: そこで増えるのはコピーであり、ノードではありません。
      minReplicas: 1
      maxReplicas: 3
      instanceType: u1.medium
      diskSize: 20Gi
      storageClass: replicated
