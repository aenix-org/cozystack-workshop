---
# ラボ 6 · 自分専用のプライベートイメージレジストリ。このファイルは意図的に不完全です。
#
# これは動作しません。それが狙いです。あなた自身の目で失敗を確認し、クラスタに何が足りなかったのかを
# 自分で理解してもらうためです。ここで足りないものはただ一つ — クラスタがイメージを取りに行くとき、
# 閉じたレジストリに対して自分を何者だと名乗るか、です。レジストリは誰彼かまわずイメージを渡したりはせず、
# この記述の中にはクラスタが自分の権利を証明する助けになるものが何もありません。どの行がこれを直すのかは、
# ラボを進めながら解き明かします。動く版はすぐ隣、passes.yaml にありますが、解説の前に開いても意味はありません。
#
# ここには Deployment だけがあり、Service はありません。サービスに固定の名前はまだ不要です —
# イメージがダウンロードできない以上、応答するポッドまでは結局たどり着かないからです。
#
# あなたの `lab` クラスタの、デフォルトの名前空間に適用します:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f passes-broken.yaml
#     kubectl get pods -l app=passes-api -w
#
# 注意: HARBOR-HOST はプレースホルダであり、動作するアドレスではありません。自分の Harbor のアドレスに置き換えてください。
# さもないと、このファイルが書かれた目的とは違うエラーが出ます（プレースホルダのある行は二つあります）:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # macOS
#
# 下のオブジェクトで: apiVersion — 記述スキーマのバージョン、kind — 何を作るか、
# metadata.name — オブジェクトの名前。以降では別途説明しません。
#
# Deployment とは「コンテナを起動せよ」ではなく「このようなコンテナのコピーを指定した数だけ起動し続けよ」です。
# コピーが消えれば — クラスタは何も尋ねずに新しいものを作ります。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # コピーは一つ: 失敗を解説するには一つで十分ですし、ログや
  # kubectl describe の出力のノイズも減ります。
  replicas: 1
  # 「私のコピーとは app: passes-api ラベルの付いたポッドである」という条件。下のポッドの雛形にあるラベルは
  # これと一致しなければならず、さもないとクラスタはマニフェストを拒否します。
  selector:
    matchLabels:
      app: passes-api
  # コピーが打ち出される雛形。この中身のすべてが一つのポッドを記述します。
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # ポッド全体へのセキュリティ制約: root で実行しない、非特権ユーザー 10001 として動作する、
      # システムコールの集合を標準プロファイルに制限する。イメージもこれに合わせてビルドされています
      # （app/Dockerfile の USER 行を参照）。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # コンテナレベルの権限: 自分に追加の特権を与えず、あらゆる特別なカーネル権限を
          # 手放す。アプリケーションが必要とするのはネットワークポート一つで、それ以外は不要です。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # イメージ名の最初の部分がレジストリのアドレスです。まさにこれゆえに、自分のレジストリへ
          # 移行するとマニフェストが変わります: イメージ名が別のものになるのです。アドレスがなければ、
          # クラスタはイメージを Docker Hub へ取りに行くでしょう — つまり、情報セキュリティが禁じた先へ。
          image: HARBOR-HOST/passes/passes-api:v1
          # アプリケーションのポート。名前 `http` はこの先で readiness プローブが使うので、
          # ポート番号は二か所ではなく一か所で指定されています。
          ports:
            - containerPort: 8080
              name: http
          # 環境変数。アプリケーションはここから、自分が何者でどこから来たのかを知ります。
          # 応答にはまさにこれらを出力します（app/main.go の identity 構造体を参照）。
          # APP_VERSION と IMAGE_REGISTRY はテキストで指定されています — これらは私たち自身が書きます。続く三つは
          # コピーの起動時にクラスタ自身が埋めます。アプリケーションにはそれらを知る術がありません。
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — コピーのために何を予約するか: スケジューラはこの数値でノードを選びます。
          # limits — 上限: メモリが上限を超えるとコンテナは kill され、CPU が超えると
          # スロットルされます。16Mi で足りるのは、アプリケーションが依存関係のない Go 製だからです。
          # 20m は CPU コアの二万分の一（千分の二十）です。
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # readiness プローブ: アプリケーションが /healthz に応答するまで、コピーへの
          # トラフィックは流れません。今日はここまで話は及びません — これは既に起動した
          # プロセスを確認するものですが、私たちの場合はより早い段階、イメージのダウンロードで詰まります。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
