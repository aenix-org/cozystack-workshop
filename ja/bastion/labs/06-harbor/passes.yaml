---
# ラボ6 · 自前のプライベートイメージレジストリ。マニフェストの動作する版。
#
# これは passes-broken.yaml と同じファイルで、そこに欠けていた一箇所だけを加えたものです —
# その箇所は下で「欠けていたのはこれ」という言葉で示してあります。壊れた版で拒否を
# 目にして、なぜそれが起きたのかを理解してから適用してください。
#
# 適用先はあなたの `lab` クラスタ（Cozystack 管理クラスタではありません — そこには
# Harbor 自身だけが住んでいます）、デフォルトの名前空間です:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl delete -f passes-broken.yaml
#     kubectl apply -f passes.yaml
#
# 注意: HARBOR-HOST はプレースホルダであり、動作するアドレスではありません。適用する前に、自分の
# Harbor のアドレスを差し込んでください。文字列 HARBOR-HOST はファイル内に2回現れ、sed は両方を置き換えます:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # macOS
#
# 下のオブジェクトで: apiVersion は記述スキーマのバージョン、kind は何を作るか、
# metadata.name はオブジェクトの名前です。これ以降は個別には説明しません。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # 1つではなく2つのコピー: こうするとサービスの応答から、リクエストが異なる
  # ポッドで処理されていること、そしてイメージがノードに一度だけダウンロードされ、二度起動されたことが見えます。
  replicas: 2
  # 「私のコピーとは app: passes-api ラベルを持つポッドである」という条件。下のポッドテンプレートのラベルは
  # これと一致しなければならず、さもないとクラスタはマニフェストを拒否します。
  selector:
    matchLabels:
      app: passes-api
  # コピーが打ち出される元になるテンプレート。中身のすべてが1つのポッドを記述します。
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # ポッド全体へのセキュリティ制約: root で実行しない、非特権
      # ユーザー 10001 で動く、システムコールの集合を
      # 標準プロファイルに制限する。イメージはこれに合わせてビルドされています（app/Dockerfile の USER 行を参照）。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # 欠けていたのはこれ、passes-broken.yaml で — この2行だけであり、他には何もありません。
      #
      # プライベートレジストリは誰にでもイメージを渡すわけではありません: まず名乗る必要があります。シークレット `harbor`
      # （タイプ kubernetes.io/dockerconfigjson）はレジストリのアドレス、ログイン、パスワードを保持します。あなたは
      # kubectl create secret docker-registry コマンドで作成しました。ここではシークレットは名前で
      # 参照されるだけです — そこから取り出すのはアプリケーションではなく、ノード上の kubelet が、
      # イメージをダウンロードしに行く瞬間にです。だからこそシークレットはポッドと同じ
      # 名前空間に置かれなければなりません: kubelet はまさにそこを探し、他のどこも探しません。
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # コンテナレベルの権限: 余分な特権を得ず、すべての特別な
          # カーネルケーパビリティを手放す。アプリケーションはネットワークポートが1つ必要で、残りは不要です。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # イメージ名の最初の部分はレジストリのアドレスであり、まさにこれが自前の
          # レジストリへの移行がマニフェストを変える理由です: イメージ名が別のものになります。もしアドレスが
          # 先頭になければ、クラスタはイメージを Docker Hub へ取りに行きますが、それをこそセキュリティは禁じました。
          image: HARBOR-HOST/passes/passes-api:v1
          # アプリケーションのポート。名前 `http` は以降でレディネスプローブと Service が使うので、
          # ポート番号は3箇所ではなく1箇所で設定されています。
          ports:
            - containerPort: 8080
              name: http
          # アプリケーションが自分が誰でどこから来たかを知るための環境変数。
          # まさにこれを応答に出力します（app/main.go の identity 構造体を参照）。
          # APP_VERSION と IMAGE_REGISTRY はテキストで設定されています — これらは私たち自身が書きます。
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # 次は Downward API: クラスタ自身がポッドについて知っていることを変数に入れます。
            # アプリケーションは自分の名前を推測する必要も、それを求めてクラスタ API に行く必要も、
            # そのようなリクエストの権限を持ち歩く必要もありません。値はコピーが
            # 起動する瞬間に差し込まれるので、各コピーは自分固有の値を持ちます。
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — コピーのために何を予約するか: これらの数値でスケジューラはノードを選びます。
          # limits —上限: メモリが上限を超えるとコンテナは kill され、
          # CPU は絞られます。16Mi で足りるのはアプリケーションが依存のない Go 製で、
          # メモリにほとんど何も保持しないからです。JVM なら2桁
          # 多く必要でしょう。20m は CPU コアの千分の20です。
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # レディネスプローブ: アプリケーションが /healthz に応答するまで、Service は
          # このコピーにトラフィックを送りません。新しいバージョンのロールアウト時、古いコピーは
          # 新しいコピーが応答した後にはじめて負荷分散から外されます — だからリクエストは
          # まだ立ち上がっていないプロセスで失敗しません。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# 両方のコピーが背後に立つ恒久的な名前。ポッドは再作成されアドレスが変わりますが、
# 名前 passes-api.default.svc.cluster.local は変わりません。このオブジェクトがないとアプリケーションは
# 動きますが、クラスタ内でそこへ到達する手段がありません — そして check.sh のチェックは
# ポッドではなく、まさにここへ来ます。
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # ポッドとのリンクはアドレスのリストではなく、ラベルによる条件です。app: passes-api ラベルを持つ
  # 新しいコピーは自分で負荷分散の対象になり、登録する必要はありません。
  selector:
    app: passes-api
  # port — Service 自身がどのポートで応答するか; targetPort は上の ports ブロックの
  # 名前 `http` を参照し、番号ではないので、番号が変わってもリンクは切れません。
  ports:
    - port: 80
      targetPort: http
