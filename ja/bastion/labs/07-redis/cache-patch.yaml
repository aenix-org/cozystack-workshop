---
# ラボ7 · キャッシュを本番として有効化する。すでにデプロイ済みの passes-api の上に適用します
# あなたの `lab` クラスタで（export KUBECONFIG=~/lab.kubeconfig）:
#   kubectl patch deployment passes-api --patch-file cache-patch.yaml
#
# これはパッチであって完全なマニフェストではありません。変更点だけを記述します。それ以外のすべて —
# イメージ、ラベル、プローブ、リソース — は passes-api.yaml のまま手つかずで残ります。だからこのファイルは
# いきなり spec: から始まります。コンテナまでのパスは Deployment の構造をなぞっており、
# クラスタが編集を適用すべき正確な場所を理解できるようにしています。
#
# コンテナ名 `api` は飾りではなくアドレスです。クラスタはこれを使って一覧から正しいコンテナを
# 見つけ出します。名前を間違えると、編集ではなく2つ目のコンテナができてしまいます。
#
# REDIS-ADDR の代わりに自分の Redis のアドレスを入れてください — これはホスト名ではなくプレースホルダーです。
# アドレスはダッシュボードの、あなたのマネージド Redis アプリケーションのカードから取得します。
spec:
  template:
    spec:
      containers:
        - name: api
          # Kubernetes の env リストは name フィールドでマージされるので、下の3つのエントリは
          # Deployment にすでにあるものを置き換えるのではなく、それらに追加されます。
          env:
            # この変数が現れることこそが「キャッシュを有効にする」ということです。アプリは起動時に
            # これをチェックし、設定されていれば、まず Redis を見に行きます。空または
            # 未設定なら、以前と同じく、リクエストごとに参照テーブルを引く動作になります。
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
            # パスワードは平文で書きません。別のコマンドであなたが作成するシークレットから
            # やってきます。Git に置かれるマニフェストに、パスワードの居場所は
            # ありません。
            #
            # secretKeyRef は参照です。name — 同じクラスタ内のシークレットオブジェクトの名前、
            # key — その中のどのフィールドを取るか。値はポッドの起動時に差し込まれ、
            # ファイルには決して現れません。
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
            # 1エントリがキャッシュに何秒生きるか。60 なのは、
            # 従業員の参照テーブルが1秒に1回ではなく、1日に1回変わるからです。
            #
            # 期間を長くすると — 参照テーブルを引く回数は減りますが、古くなった姓を
            # より長く返してしまいます。短くすると — データは新しくなりますが、得は小さくなります。これはトレードオフであって、
            # 正しい値が1つある設定ではありません。
            - name: CACHE_TTL
              value: "60"
