---
# ラボ7 · レガシーな従業員名簿のスタブ。
# 現実にはこれは他人のシステムで、あなたには書き直す権限が与えられません。応答に800msかかり、
# それと何とか付き合っていく必要があります。ここでは同じ挙動をするスタブを用意し、測定対象を確保します。
#
# 適用先: あなたの `lab` クラスタ(export KUBECONFIG=~/lab.kubeconfig)であり、Cozystackの
# 管理クラスタではありません。コマンド: kubectl apply -f hr-legacy.yaml
#
# HARBOR-HOST はアドレスではなくプレースホルダです。自分のHarborのアドレスに置き換えてください。さもないとクラスタは
# 存在しないホストからイメージを取得しようとします:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # macOS
#
# このファイルには `---` 行で区切られた2つのオブジェクトがあります: Deployment(何が何個の
# コピーで動くか)と Service(それらのコピーに到達するための恒久的な名前)。各オブジェクトの
# apiVersion と kind はそれがどんな種類のオブジェクトかを示し、metadata.name はその名前です。
# これ以降、この3つのフィールドにはコメントを付けません。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-legacy
  labels:
    app: hr-legacy
spec:
  # 動かし続けるコピー数。コピーが消えると、クラスタは尋ねることなく新しいものを作ります。
  # 名簿には1つで十分です: これは負荷のためではなく測定のためにあります。
  replicas: 1
  # このラベルによって Deployment はクラスタ内の他のすべての中から自分のPodを見分けます。
  # selector のラベルと下の template のラベルは一致しなければなりません。さもないとオブジェクトは
  # 自分自身が作ったものを見つけられません。
  selector:
    matchLabels:
      app: hr-legacy
  # template はPodのテンプレートです。以下のすべてが1つのコピーを記述します: 何から組み立てるか、
  # どんな権限で動かすか、そしてリクエストを受け付ける準備ができたかをどう判断するか。
  template:
    metadata:
      labels:
        app: hr-legacy
    spec:
      # Podレベルのセキュリティ要件。プロセスはroot以外(uid 10001)で動作し、
      # seccompプロファイルはアプリケーションが必要としないシステムコールを遮断します。
      # ポリシーが有効なクラスタでは、これらのフィールドがないPodはそもそも起動しません。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Harborはログインとパスワードで閉じられており、クラスタは何らかの形で身元を示す必要があります。`harbor`
      # シークレットはレジストリのラボで用意したものです。この参照がないとイメージは取得されず、
      # Podは ImagePullBackOff 状態のままになります。
      imagePullSecrets:
        - name: harbor
      containers:
        - name: hr
          # Podレベルと同じですが、特定のコンテナ向けです: 権限昇格を禁止し、
          # すべてのカーネル権限を剥奪します。Goのアプリケーションには
          # そのどれも必要ありません。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # イメージは名簿と「ゲストパス」サービス本体とで同じものです。
          # 実際にどのプロセスが起動するかは、下の MODE 変数が決めます。
          image: HARBOR-HOST/passes/passes-api:v2
          # ポートには番号だけでなく名前があります: レディネスプローブと下の Service は
          # 名前を参照します。番号が変わっても、修正は1か所で済みます。
          ports:
            - containerPort: 8080
              name: http
          # 環境変数はこのアプリケーションを設定する唯一の方法です。
          # 挙動を変えるためにイメージを再ビルドする必要はありません。
          env:
            # MODE=hr — このインスタンスは人事システムのふりをします: 待機して応答します。
            - name: MODE
              value: "hr"
            # 本物の名簿が示すのとまさに同じ遅延です。
            # これを変えると「どれだけ状況が悪いか」が変わります — あとで 2s を試してみてください。
            - name: HR_DELAY
              value: "800ms"
            # Podは自分の名前を事前には知りません — クラスタが作成時に割り当てます。
            # fieldRef はその名前を起動時に変数へ差し込み、それが
            # サービスの応答に含まれます: どのコピーが応答したかが分かります。
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # requests — ノードを選ぶ際にコンテナ向けに予約されるリソース量、
          # limits — それを超えることが許されない上限です。vSphereの reservation と
          # limit に似ていますが、仮想マシンごとではなくコンテナごとに設定されます。
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # レディネスプローブ。/healthz が応答するまで、Service はこのコピーへ
          # リクエストを1つも送りません。プローブがないと、トラフィックはまだ起動していないプロセスへ流れ、
          # 何もないところでエラーが見えます — しかも「すべてデプロイされた」のに。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — Podの集合に対する恒久的な名前と恒久的なアドレスです。Podは再作成され、
# そのたびに新しいIPを得ますが、hr-legacy という名前は同じままです。ロードバランサの
# VIPに似ていますが、4行で用意でき、クラスタ内部で動きます。
apiVersion: v1
kind: Service
metadata:
  name: hr-legacy
spec:
  # このラベルによって Service は生きているコピーの一覧を集めます。上のPodと同じラベルです:
  # 一致しないと、Service は存在するもののどこにも導きません。
  selector:
    app: hr-legacy
  ports:
    # リクエストは80番ポートに来て、Pod内部では http という名前のポート(8080)へ向かいます。
    - port: 80
      targetPort: http
