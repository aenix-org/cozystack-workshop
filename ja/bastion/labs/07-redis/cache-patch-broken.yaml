---
# ラボ7 · このパッチは意図的に不完全です。「キャッシュを有効にしたつもりなのに、
# 速くならなかった」状態がどう見えるかを体験するためのものです。動作する版は cache-patch.yaml にあります。
#
# あなたの `lab` クラスタに適用します（export KUBECONFIG=~/lab.kubeconfig）:
#   kubectl patch deployment passes-api --patch-file cache-patch-broken.yaml
#
# 答えを覗き見してはいけません。適用して、リクエストを数回送り、アプリケーションの
# ログを見てください: kubectl logs -l app=passes-api。アプリケーションが何が問題かを教えてくれます。
# ——ポイントは、そのメッセージを読み、このファイルに何が足りないのかを突き止めることです。
#
# REDIS-ADDR の代わりに自分の Redis のアドレスを入れてください（アドレスの探し方のステップを参照）。
# プレースホルダーを残してはいけません。そうすると、この演習の狙いとは違うエラーが出てしまいます。
spec:
  template:
    spec:
      containers:
        # コンテナ名は、クラスタが修正すべき場所を見つけるためのアドレスです。
        - name: api
          env:
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
