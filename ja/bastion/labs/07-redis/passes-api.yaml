---
# ラボ7 · 「パス」サービス、バージョン v2 — キャッシュと連携できる版。
# ここではキャッシュはまだ有効になっていません。まずはキャッシュなしでどれほど遅いかを計測します。有効化は後で、
# 同じフォルダにある cache-patch.yaml パッチで行います。
#
# 適用先: あなたの `lab` クラスタ（export KUBECONFIG=~/lab.kubeconfig）。
# コマンド: kubectl apply -f passes-api.yaml
#
# HARBOR-HOST はアドレスではなくプレースホルダーです。自分の Harbor のアドレスに置き換えてください（hr-legacy.yaml 参照。
# そこには全ファイルを一括置換する sed コマンドもあります）。
#
# このファイルには `---` で区切られた 2 つのオブジェクトがあります: Deployment（アプリケーションのコピー）と Service（それらのための
# 安定した名前）。apiVersion、kind、metadata.name についてはこれ以降のファイル内では説明しません。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # 1 つではなく 2 つのコピーにするのは、後でキャッシュの主要な性質が見えるようにするためです: キャッシュは共有されます。
  # あるポッドが答えを Redis に入れ、別のポッドがそこから取り出します。自分自身は一度も台帳へ問い合わせていないのに。
  replicas: 2
  # このラベルで Deployment は自分のポッドと他人のポッドを区別します。下の template にあるラベルと
  # 一致していなければなりません。そうでないと、オブジェクトは自分が作成したものを見つけられません。
  selector:
    matchLabels:
      app: passes-api
  # template — ポッドのテンプレート: 各コピーを何から組み立てるか。
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # ポッドレベルのセキュリティ要件: root では実行しない、システムコールを制限する。
      # ポリシーが有効なクラスタでは、これらのフィールドがないポッドは受け入れられません。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # イメージ取得時に、クラスタが閉じた Harbor に対して何を名乗るか。このシークレットへの参照が
      # ないと、ポッドは ImagePullBackOff で止まります。
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # コンテナの権限は最小限に削減されています: 昇格は禁止、カーネル権限なし。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 台帳と同じイメージです。両者を分けるのは下の MODE だけです。
          image: HARBOR-HOST/passes/passes-api:v2
          # ポート名が必要なのは、プローブと Service が数値ではなく名前で参照できるようにするためです。
          ports:
            - containerPort: 8080
              name: http
          # アプリケーションのすべての振る舞いはここで設定されます。注意: 変数
          # REDIS_ADDR と REDIS_PASSWORD がリストにありません — まさにそれがキャッシュを無効にしている理由であり、
          # すべてのリクエストは正直に遅い台帳へ向かいます。
          env:
            # MODE=api — このインスタンスは「パス」サービスそのものとして動作します。
            - name: MODE
              value: "api"
            # バージョンとレジストリは動作にアプリケーションには不要です — それらは「/」への応答に表示され、
            # あなたがたった今ビルドしたものが確かに動いていることを確認できます。
            - name: APP_VERSION
              value: "v2"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # データを取りに行く先。アドレスではなくサービス名です: 台帳のコピーは
            # 何度でも再作成され得ますが、名前は変わりません。
            - name: HR_URL
              value: "http://hr-legacy.default.svc.cluster.local"
            # 誰がどこでリクエストを実行するか。クラスタがこの 3 つの値を自ら埋め込みます:
            # 事前には誰も知りません。これらはサービスの応答に含まれ、それによって
            # どのコピーがどのノードで応答したかが分かります — 計測時に役立ちます。
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — ノード選択時に予約される量、limits — 上限。ここでの 1 コアという
          # 上限は欲張りではありません: 負荷がかかるとアプリケーションはノード全体を食い尽くすのではなく
          # ここで頭打ちになり、計測は CPU の奪い合いではなく台帳のレイテンシを示します。
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # /healthz が応答するまで、Service はこのコピーへリクエストを 1 つも送りません。
          # 更新時にはこの同じフィールドが障害からあなたを守ります: 新しいコピーが準備完了を
          # 報告するまで、古いコピーは削除されません。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — 両方のコピーに対する 1 つの安定した名前と、それらの間でのリクエスト分散。
# ポッドは再作成され IP が変わりますが、passes-api という名前は残ります。この名前で Fortio も
# チェックスクリプトもサービスへアクセスします。
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # Service が生きているコピーのリストを集めるためのラベル。ポッドのラベルと一致しなければ —
  # Service は存在はするが、どこにもつながりません。
  selector:
    app: passes-api
  ports:
    # 外部からは 80 に接続し、ポッド内へは http という名前のポート（8080）へ向かいます。
    - port: 80
      targetPort: http
