---
# ラボ7 · Web UI 付きの負荷生成ツール。
# スケーリングのラボと同じもの。ブラウザのボタンで負荷をかけ、
# 遅延のヒストグラムもその場で確認できる。すでにデプロイ済みなら、この
# ファイルを適用する必要はなく、kubectl は「unchanged」と応答する。
#
# 適用先: あなたの `lab` クラスタ（export KUBECONFIG=~/lab.kubeconfig）。
# コマンド: kubectl apply -f fortio.yaml
#
# `---` で区切られた2つのオブジェクト: Deployment（生成ツール本体）と Service（それに
# 到達するための名前）。apiVersion、kind、metadata.name はこれ以降コメントしない。
#
# イメージは自分の Harbor ではなく公開 Docker Hub から取得する。Fortio は「Propusk」
# サービスの一部ではなく、クラスタに一時的に住む計測器だからだ。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # 1コピーのみ。負荷生成ツールはスケールする必要はない。必要なのは、それ1つが
  # 正直に遅延を計測することだ。2コピーあれば統合されない2つのヒストグラムになる。
  replicas: 1
  # Deployment が自分の Pod を認識するためのラベル。下の template のラベルと一致する。
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # 他のすべてと同じセキュリティ要件: プロセスは root では実行されず、
      # システムコールは seccomp プロファイルで制限される。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # ここでの `latest` タグはワークショップ向けの簡略化であり、プライベートレジストリ
          # のラボが教える内容と矛盾する。このタグのイメージは2回の apply の間に
          # 気づかぬうちに変わりうるため、昨日の計測が再現不能になる。学習用スタンドの
          # 負荷生成ツールにはこれで許容されるが、本番システムには許容されない。
          image: fortio/fortio:latest
          # `server` は Fortio が Web インターフェースを立ち上げ、あなたがボタンを押すまで
          # 待機するモード。この引数がないと、イメージは1回限りのコマンドを実行して終了する。
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # 生成ツールには CPU の余裕が必要。さもないと自分自身の上限に
              # ぶつかり、アプリケーションではなく Fortio に負荷をかけることになる。
              cpu: "1"
              memory: 256Mi
---
# Service は Web インターフェースを開くために必要。生成ツールには名前を通じてポート
# フォワードで到達し — kubectl port-forward svc/fortio 8081:8080 — localhost:8081 で
# アクセスする。Service なしでも kubectl exec deploy/fortio コマンドでサービスを叩けるが、
# ブラウザでヒストグラムを得られるのはこの経路だけだ。
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  # ここでは Service の番号とコンテナのポートが一致する — 外側が80、内側が8080である
  # ラボの他のサービスとは異なる。違いは利便性だけだ。
  ports:
    - port: 8080
      targetPort: http
