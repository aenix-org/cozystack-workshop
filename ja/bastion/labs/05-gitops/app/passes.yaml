---
# ラボ5 · Git 上のインフラ。「Pass」サービス本体: 1つのファイルに4つのオブジェクト。
#
# クラスターへ手動で apply はしない。ファイルは GitHub 上の専用リポジトリの apps/ フォルダ、
# namespace.yaml の隣に置かれ、`lab` クラスターへは Flux が自分で運び込む:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# --- の行がオブジェクトを区切る: 1ファイル、4つの独立したオブジェクト。ファイル内の順序は
# 作成順序に影響しない — クラスターが自分で解決する。
#
# 各オブジェクトで: apiVersion — 記述スキーマのバージョン、kind — 何を作るか、
# metadata.name — オブジェクトの名前、metadata.namespace — クラスターのどの仕切りの中に
# それが住むか。以降、これらのフィールドは個別には説明しない。
#
# 4つのオブジェクトのいずれにもパスワードも鍵もトークンも入っていない。それは偶然ではない:
# Git に入ったものは永遠にそこに残る — 履歴は書き換えられるが、クローンし終えた全員の手元に
# 古いコピーが残る。シークレットはここに置く場所ではない。

# --- 1 / 4。Web サーバーの設定 --------------------------------------------------
# ConfigMap はテキストファイルをアプリケーションとは別にクラスターへ置き、下（volumes セクション）で
# このファイルがコンテナ内部に差し込まれる。狙いは、イメージを再ビルドせずに設定を変えること:
# ここを直してコミットすれば、1分でクラスターに新しいバージョンが入る。
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-conf
  namespace: passes
# data 内のキーがコンテナ内のファイル名になる: default.conf は nginx が起動時に読むフォルダに
# 置かれる。名前のあとの縦棒は、YAML で複数行テキストを改行を保ったまま、そのまま書くための
# 書き方。
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      # 準備完了チェック用のアドレス。クラスターはここをノックし、応答を得るまで
      # そのコピーへトラフィックを流さない。
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        # 返すページの中で __POD__ を、nginx が動いているマシンの名前に置き換える。
        # ポッドの中では、マシンの名前はそのポッド自身の名前。
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
    }
---
# --- 2 / 4。サービスが返すページ ----------------------------------------
# このラボではページはスタブ: 本物のアプリケーションは後で登場する。今大事なのは
# サービスが何を表示するかではなく、それがどこからクラスターへ来たか。マークアップ中の __POD__ は
# 置換用のマーカー: nginx はそれをページを返したポッドの名前に置き換え、その名前によって
# あとでコピーが1つより多くなったことが見える。
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-page
  namespace: passes
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Пропуск</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 40rem;
               color: #222; }
        h1 { font-weight: 600; }
        .v { display: inline-block; padding: .2rem .6rem; border-radius: .3rem;
             background: #eef; font-family: ui-monospace, monospace; }
        .pod { margin-top: 2rem; color: #666; font-size: .9rem; }
        b { font-family: ui-monospace, monospace; color: #222; }
      </style>
    </head>
    <body>
      <h1>Сервис «Пропуск»</h1>
      <p>Заказ пропуска для гостя. Версия <span class="v">v1</span></p>
      <p>Развёрнуто из Git. Руками сюда никто не ходил.</p>
      <div class="pod">вас обслужил под <b>__POD__</b></div>
    </body>
    </html>
---
# --- 3 / 4。アプリケーション本体の記述 ---------------------------------------------
# Deployment は「コンテナを起動せよ」ではなく「これこれのコンテナのコピーをこれだけ起動したまま
# 保て」だ。違いはコピーが死んだときに見える: クラスターは、尋ねも通知もせずに新しいものを作る。
# vSphere で一番近いのは HA だが、あちらでは再起動されるのはマシンで、ここでは再作成されるのは
# アプリケーションのコピーであり、しかも障害時だけでなく常に行われる。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes
  namespace: passes
  labels:
    app: passes
spec:
  # いくつコピーを起動したまま保つか。言い回しが大事だ: 「1つ起動せよ」ではなく「1つ保て」。
  # これが、あなたが Git を通して変更し、何が起こるかを見る数値。
  replicas: 1
  # Deployment がどの目印で自分のコピーを見分けるか。これはポッド名のリストではなく —
  # 名前は再作成のたびに変わる — 「app: passes ラベルを持つすべてのポッド」という条件だ。
  # 下の template.metadata.labels のラベルはこの条件と一致していなければならない: ずれれば
  # クラスターはマニフェストの受け入れを拒む、コピーが誰のものでもなくなるから。
  selector:
    matchLabels:
      app: passes
  # template — コピーを打ち出す型。中のすべてが1つのポッドを記述する。型を直すことは
  # 新しいバージョンの展開を意味する: 古いコピーが新しいものに置き換わる。
  template:
    metadata:
      labels:
        app: passes
    spec:
      # ポッド全体レベルのセキュリティ制限。vSphere に相当物はない: あちらでは
      # 隔離はハイパーバイザーが与えるが、コンテナはノードとカーネルを共有するので、権限は
      # 明示的に削らなければならない。
      #   runAsNonRoot   イメージが root で動こうとするなら起動しない
      #   runAsUser      どの数値ユーザーで動くか; 65532 は最小イメージで採用される
      #                  「非特権」識別子
      #   seccompProfile どのシステムコールが許可されるか; RuntimeDefault は
      #                  明らかに危険なものを切り落とし、何も壊さないセット
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # 同じ制限だが、もう具体的なコンテナに対して。
          #   allowPrivilegeEscalation: false  プロセスは自分に追加の権限を得られない
          #   capabilities.drop: ["ALL"]       カーネルの特別な権限をすべて取り上げる
          #                                    （ネットワークの変更、マウント、時刻の変更）;
          #                                    Web サーバーにはそのどれも要らない
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # イメージは公開レジストリから取る — 次のラボで情報セキュリティがこれを禁じ、
          # アドレスは自前の Harbor に変わる。unprivileged 版を選んだのは見栄えのためではない:
          # 通常の nginx イメージはポート 80 を待ち受け、そのために root 権限を欲しがるので、
          # 上の runAsNonRoot ではそもそも起動しない。
          # バージョンは固定してある（1.27-alpine）、latest ではない: さもないと同じ
          # マニフェストが明日は別のアプリケーションを展開し、あなたはそれに気づかない。
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # アプリケーションが待ち受けるポート。`http` という名前は飾りではない: それを
          # 下の準備完了チェックとファイル末尾の Service が参照する。ポート番号を変えるなら、
          # 3か所ではなく1か所だけ変えれば済む。
          ports:
            - containerPort: 8080
              name: http
          # requests — 確実に予約されるリソース量; この数値でスケジューラーがノードを選ぶ。
          # limits — それより上には通さない上限。requests を低く見積もると、ノードには
          # 支えられる以上に詰め込まれる; limits をメモリで超えると — コンテナは kill され、
          # CPU で超えると — スロットルされる。
          # 20m = 1コアの千分の二十、Mi = メガバイト。ここの値が小さいのは、
          # ラボではノードが1つで、しかも小さいから。
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # 準備完了チェック: クラスターはこのアドレスをノックし、応答を得るまで
          # そのコピーへトラフィックを流さない。これがないと Service はまだ立ち上がっていない
          # nginx へリクエストを送り、ユーザーは展開のたびにエラーを見ることになる。
          # これは Flux も待つ — kustomization.yaml で wait: true を頼んだ。
          #   initialDelaySeconds  最初のノックの前に待ち、プロセスに起動する時間を与える
          #   periodSeconds        その後どのくらいの頻度でノックするか
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # ファイル冒頭の2つの ConfigMap の中身をコンテナ内のどこに差し込むか。
          # /etc/nginx/conf.d — nginx が起動時に設定を読むフォルダ、
          # /usr/share/nginx/html — ファイルを返すフォルダ。
          # このときイメージ自体は変わらない: ファイルは起動の瞬間にその中に現れる。
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: page
              mountPath: /usr/share/nginx/html
      # 何を差し込むか。conf と page という名前は内部的なもので、このブロックを上の
      # volumeMounts と結びつける; configMap 内の name は、もうクラスター内の実在オブジェクトの
      # 名前だ。ここを間違えると、ポッドは存在しない ConfigMap を待って宙づりになる。
      volumes:
        - name: conf
          configMap:
            name: passes-conf
        - name: page
          configMap:
            name: passes-page
---
# --- 4 / 4。すべてのコピーの背後に立つ不変の名前 -----------------------------
# ポッドは再作成され、そのアドレスは毎回新しい。Service は不変の名前を与える —
# passes.passes.svc.cluster.local — その名前でクラスター内から生きたコピーへ常に到達できる。
# これは内部の負荷分散で、クラスターの外からここへはまだ入れない。
apiVersion: v1
kind: Service
metadata:
  name: passes
  namespace: passes
spec:
  # Service とポッドの結びつきはアドレスのリストではなく、「app: passes ラベルを持つすべての
  # ポッド」という条件。そのラベルを持つ新しいコピーが現れれば — それ自身が負荷分散の対象に入り、
  # 登録は何も要らない。消えれば — 振り分け先から外される。
  selector:
    app: passes
  # port — Service 自身が応答するポート、targetPort — コンテナ内部のどこへ転送するか。
  # ここで targetPort は上の ports ブロックの `http` という名前を参照していて、番号ではない:
  # 番号は1か所で変えられ、結びつきは切れない。
  ports:
    - port: 80
      targetPort: http
