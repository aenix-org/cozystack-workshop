---
# ラボ 5 · Git によるインフラ管理。「Пропуск」サービス用の名前空間。
#
# このファイルは手動でクラスタに適用しません。GitHub 上の自分のリポジトリの apps/
# フォルダに置くと、Flux がスケジュールに従って自動で `lab` クラスタへ反映します。
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# あらゆるマニフェストの読み方: apiVersion — 記述スキーマのバージョン（これにより
# クラスタはオブジェクトの解釈方法を判断します）、kind — 何を作るか、metadata.name — 後で
# オブジェクトを探すための名前。この 3 つのフィールドはどのオブジェクトにも存在し、以下では
# 個別に説明しません。
#
# 名前空間（namespace）は 1 つのクラスタ内部の論理的な仕切りです。独自の名前スコープ、独自の
# 権限、独自のクォータを持ちます。vSphere で最も近いのは vCenter ツリーのフォルダ、または
# リソースプールです。
#
# なぜアプリケーションと一緒に Git に置き、手動で作成しないのか: サービスがリポジトリから
# 消えると、Flux が名前空間も削除します。半年後に誰も理由を思い出せない空の仕切りが
# 残ることはありません。
apiVersion: v1
kind: Namespace
metadata:
  name: passes
  # このラベルはサービスの動作には影響しません。「Пропуск」に関連するすべてを 1 つの
  # コマンドで探すために必要です: kubectl get all -A -l app.kubernetes.io/part-of=passes。
  # part-of という名前は私たちが考案したものではなく、Kubernetes の共通ラベルセットから
  # 取ったものです: 外部ツール（監視、エクスポート）はまさにこれを探します。
  labels:
    app.kubernetes.io/part-of: passes
