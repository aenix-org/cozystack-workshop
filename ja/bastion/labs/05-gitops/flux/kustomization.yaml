---
# ラボ5 · Git 上のインフラ。課題: リポジトリから具体的に何をクラスターへ適用するか。
#
# 隣の gitrepository.yaml と一緒に、あなたの `lab` クラスターへ適用します:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# 各オブジェクトにおいて: apiVersion — 記述スキーマのバージョン、kind — 何を作るか、
# metadata.name — オブジェクトの名前。以下では個別には説明しません。
#
# 責務の分離: GitRepository はリポジトリをダウンロードするだけで何も適用せず、
# このオブジェクトがダウンロードされたものを受け取ってクラスターをそれに合わせます。Kustomization という名前は
# kustomize ユーティリティの名前と一致しますが、これらは別物です — ここではクラスター内のオブジェクトを指します。
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passes
  # Flux のサービスと同じ場所に置きます — さもないと kustomize-controller が拾ってくれません。
  namespace: flux-system
spec:
  # クラスターの実際の状態を Git に記述された状態とどのくらいの頻度で照合するか。
  # これは「1分ごとにもう一度適用する」ではなく、「1分ごとに比較して
  # 差分を修正する」です。Git 側で何も変わっていなくても、kubectl edit で
  # 手作業で行った変更は黙って元に戻されます。この違いは、あなた自身が Git を経由せずに
  # クラスター内の何かを変更したとき、ラボの少し先で目にすることになります。
  interval: 1m
  # リポジトリ内のフォルダー。その中にあるものはすべてクラスターへ入りますが、その隣にある
  # ファイル — 例えばルートの README.md — は触られません。`apps` という名前は私たちが選んだものですが、
  # あなたのリポジトリでマニフェストを置くフォルダーと一致していなければなりません。
  path: ./apps
  # Git から消えたオブジェクトをクラスターから削除します。
  # これがないと Git は完全な記述ではなくなります: リポジトリから削除されたものが
  # クラスター内で動き続け、誰もそれに気づかない状態になります。
  prune: true
  # どのソースを見るか。`passes` という名前は gitrepository.yaml の metadata.name であって、
  # GitHub 上のリポジトリ名ではありません。あちらで改名したら、こちらも直してください。さもないと Flux は
  # 存在しないソースを待ち続け、Kustomization は ready になりません。
  sourceRef:
    kind: GitRepository
    name: passes
  # apply の直後に成功を報告するのではなく、適用されたリソースが ready になるのを待ちます。
  # その違いは「申請を送った」と「申請が完了した」の違いとまったく同じです: wait がないと
  # Flux は、その後にポッドが立ち上がらなくても成功を報告します。
  wait: true
  # 適用を失敗と判断するまで、その ready 状態をどれだけ待つか。
  # 3分 — 空のノードでイメージを取得する分の余裕を持たせています。値が小さすぎると
  # 遅いネットワークで誤った失敗が出ますし、大きすぎると、明確なエラーの代わりに
  # 「進行中」を長時間眺めることになります。
  timeout: 3m
