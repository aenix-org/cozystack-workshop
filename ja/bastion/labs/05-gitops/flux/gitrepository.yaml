---
# ラボ5 · Git によるインフラ管理。ソース: Flux が望ましい状態を取得する場所。
#
# 隣接する kustomization.yaml とともに、あなたの `lab` クラスタに適用します:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# 注意: 適用する前に、url を「あなた自身の」リポジトリのアドレスに置き換えてください。
# ЗАМЕНИТЕ-МЕНЯ という文字列はプレースホルダーで、そのままだと Flux は存在しないアドレスへ
# アクセスし、エラーで停止します。ブランチも確認を: GitHub は新規リポジトリを main ブランチで作成します。
#
# 各オブジェクトにおいて: apiVersion は記述スキーマのバージョン、kind は何を作成するか、
# metadata.name はこのオブジェクトを後で参照するための名前です。以降では繰り返しません。
#
# このオブジェクトの唯一の役割は、リポジトリの最新コピーをクラスタ内に保持することです。
# 何も適用せず、ダウンロードするだけです。適用するのは隣接する Kustomization で、
# それは `passes` という名前でここを参照するため、名前を単独で変更することはできません。
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: passes
  # flux-system は flux install コマンドが作成した名前空間で、Flux のサービス自体が
  # ここに存在します。設定オブジェクトもここに置きます。そうしないとサービスが認識しません。
  namespace: flux-system
spec:
  # Git へ新しい状態を取りに行く頻度。1分はラボ用です。
  # 本番では通常1〜5分で、即時反応は GitHub からの webhook で実現します。
  interval: 1m
  # リポジトリのアドレス。公開リポジトリなので、ここにはログインもキーもありません —
  # これは学習用スタンドの簡略化です。本番ではリポジトリは非公開で、その隣に
  # deploy キーを持つシークレットへの参照(secretRef フィールド)が現れます。
  url: https://github.com/ЗАМЕНИТЕ-МЕНЯ/passes-gitops
  # どのブランチを信頼できる情報源とみなすか。main にマージされたものがクラスタへ反映され、
  # 他のブランチにあるものは反映されません。ここからレビューが生まれます: 変更はまず自分の
  # ブランチで生き、そこで確認でき、main へのマージだけがそれを有効にします。
  # リポジトリが古い master ブランチで作成されている場合はここで修正してください。
  # そうしないと Flux は読むべきものを見つけられません。
  ref:
    branch: main
