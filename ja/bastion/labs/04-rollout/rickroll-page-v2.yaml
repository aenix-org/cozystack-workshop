---
# ラボ4。ページの第2バージョン — 負荷をかけながらロールアウトするもの。
# 目に見えて違っていなければならない。参加者が見るのはブラウザであって、diff ではない。
#
# オブジェクトは1つ。管理クラスタ上のテナントではなく、あなたの `lab` 学習クラスタに
# 適用する:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll-page-v2.yaml
# ここには tenant-workshopXX のようなプレースホルダはない — 自分の番号をどこかに差し込む必要はない。
#
# ここで最もつまずくポイント: この apply それ自体は何もロールアウトしない。
# 設定ファイルをもう1つ、最初のものの隣にクラスタへ置くだけだ。Deployment の `page`
# ボリュームが rickroll-page-v1 を参照している間は、ユーザーには第1バージョンが見える。
# ロールアウトになるのはラボの次のステップ — ボリュームをこの ConfigMap に切り替えることだ。
# 2つのオブジェクトからなるこの構成の理由もそこにある。第1バージョンはクラスタ内に
# 手つかずのまま残り、ロールバックはそれを丸ごと戻す。記憶から復元するのではない。
#
# もし代わりに ConfigMap rickroll-page-v1 をその場で編集していたら、ロールバックする
# 先がなくなり、ポッドはコピーの置き換えもリビジョン履歴への記録もないまま新しい内容を
# 受け取ることになる — つまり、ラボが作られている目的そのものが失われる。
#
# オブジェクト名は変更してはならない: README のパッチと check.sh のチェックが
# rickroll-page-v2 を参照している。
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v2
data:
  # `|` の後のインデントより下にあるものはすべて、コンテナ内部に置かれることになる
  # index.html ファイルの一字一句そのままの内容だ。これはもはや YAML ではない: ここには
  # コメントは無いし、あり得ない。ハッシュ記号はただのテキストとしてページに現れてしまう。
  #
  # マークアップの中で check.sh が見る2つのものが重要だ: 「バージョン2」というラベル —
  # これによってチェックは第2バージョンを第1バージョンと区別する。そしてプレースホルダ __POD__ —
  # これは ConfigMap rickroll-conf のルール(ラボ1)によって nginx ポッド名に置き換えられる。
  # どちらか一方でも消すと、ロールアウトは成功してもラボのチェックは通らない。
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>We're No Strangers To Love</title>
    <style>
      body{background:#07131a;color:#e8f6ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      .tag{display:inline-block;margin-bottom:1.5em;padding:.35em 1em;border-radius:999px;
           background:#00e0ff;color:#052; font-weight:700;letter-spacing:.08em;font-size:13px}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#00ffa3,#00e0ff,#7a5cff,#00ffa3);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#7f96a3;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#5d7380}
      .pod b{display:block;margin-top:.4em;color:#00ffa3;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#3f5561;font-size:14px}
    </style>
    <div class="tag">バージョン2</div>
    <h1>We're No Strangers To Love</h1>
    <p class="lyr">You know the rules &middot; And so do I</p>
    <div class="pod">対応したPod<b>__POD__</b></div>
    <p class="hint">更新は負荷をかけたままロールアウトされました。Fortio を確認してください: エラーはゼロです。</p>
    </html>
