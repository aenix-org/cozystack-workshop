# ラボ9 · 入退場ログの分析用に ClickHouse データベースを注文する。
# 何を得たいかの記述であり、サービスの組み立てと設定はプラットフォームが行う。
# ダッシュボードでマウスを使って注文するのと同じもの — ただしテキストで。
# ラボクラスタではなく、管理クラスタ上のテナントに適用する:
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f clickhouse.yaml
#
# 適用する前に: tenant-workshopXX を自分の namespace に、
# ЗдесьВашПароль を自分で考えたパスワードに置き換えること。
apiVersion: apps.cozystack.io/v1alpha1
kind: ClickHouse
metadata:
  name: analytics
  namespace: tenant-workshopXX
spec:
  # コピー1つ、シャード1つ。本番では最低でも2つのコピーを保持する。そうしないとノードの喪失が
  # データの利用不能を意味するからだ。しかし我々に必要なのは100万行であって耐障害
  # 性ではなく、余分なコピーはスタンドのリソースをただ食い潰すだけだろう。
  replicas: 1
  shards: 1
  # テーブルデータ用のディスク。このラボの100万行は数十メガバイトを占める:
  # 辞書を用いた列指向ストレージはこうしたログを非常に強く圧縮する。
  size: 5Gi
  # クエリログを含む、サーバのシステムログ用の別ディスク。
  logStorageSize: 2Gi
  # クエリログを何日後に破棄するか。我々はこれを見ることになる。
  logTTL: 15
  # replicated — クラスタの別ノードにコピーを持つボリューム: ノードが脱落しても
  # データは残る。
  storageClass: replicated
  # CPU 1つ、4 GB。ClickHouse はメモリ上で計算するので、100万行を超える
  # グルーピングではこれが顕著になる。
  resourcesPreset: u1.small
  # データベースのユーザとそのパスワード。パスワードは自分で考えて覚えておくこと: それは
  # ワーカーポッド(CH_AUTH 変数)とチェックスクリプト(CH_PASSWORD 変数)に必要になる。
  # 作成後はダッシュボードの clickhouse-analytics-credentials シークレットで見える。
  users:
    analyst:
      password: ЗдесьВашПароль
  # オブジェクトストレージへのバックアップ。ここのデータは生成されたもので、
  # 復元するものは何もない — 学習用スタンドでは無効にしている。
  backup:
    enabled: false
  # Keeper はコピー間の整合を取るために必要。コピーは1つ — 整合を取る
  # 相手がいないし、Keeper ポッド3つはリソースを無駄に占有するだろう。
  clickhouseKeeper:
    enabled: false
