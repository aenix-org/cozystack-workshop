# 適用する前に、tenant-workshopXX を自分の namespace に置き換えてください。
# すべてのファイルをまとめて置き換える方が簡単です。README の番号置換に関するセクションを参照してください。
# さらに: 下の url フィールドに、convert.sh（ステップ 2）で得た presigned リンクを挿入してください。
#
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  source:
    http:
      url: "ВСТАВЬТЕ_PRESIGNED_URL"  # convert.sh より（Share: の行）
  storage: 10Gi
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  instanceType: u1.medium
  instanceProfile: centos.7
  runStrategy: Always
  disks:
    - name: app-1
# アプリケーションへの外部アクセスは、ドメイン名 app.<tenant>.workshop.aenix.io で行います
# （Ingress はオペレーターが作成します。このパスでは port-forward は不要です。README を参照）。
# このスタンド（Cilium + robotlb）では external LoadBalancer は VM に対して動作しません。
# そのため、ここでは external を有効に「しません」。
