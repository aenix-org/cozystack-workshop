# ラボ 9 · 入退場ログの分析用に ClickHouse データベースを注文する。
# 何を得たいかの記述。サービスの組み立てと設定はプラットフォームが行う。
# ダッシュボードでマウスを使って注文するのと同じこと — ただしテキストで。
# ラボクラスタではなく、管理クラスタ上のテナントに適用する:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f clickhouse.yaml
#
# 適用する前に: tenant-workshopXX を自分の namespace に、
# ЗдесьВашПароль を自分で考えたパスワードに置き換えること。
apiVersion: apps.cozystack.io/v1alpha1
kind: ClickHouse
metadata:
  name: analytics
  namespace: tenant-workshopXX
spec:
  # レプリカ 1 つ、シャード 1 つ。本番では最低 2 つのレプリカを保持する。そうしないとノードの喪失が
  # データの利用不能を意味するからだ。— しかし我々に必要なのは 100 万行であって耐障害
  # 性ではなく、余分なレプリカはスタンドのリソースをただ食いつぶすだけだ。
  replicas: 1
  shards: 1
  # テーブルデータ用のディスク。このラボの 100 万行は数十メガバイトを占める:
  # 辞書付きの列指向ストレージはこのようなログを非常に強く圧縮する。
  size: 5Gi
  # クエリログを含むサーバのシステムログ用の別ディスク。
  logStorageSize: 2Gi
  # 何日後にクエリログを破棄するか。我々はこれを覗くことになる。
  logTTL: 15
  # replicated — クラスタの別ノードにコピーを持つボリューム: ノードが落ちても
  # データは残る。
  storageClass: replicated
  # プロセッサ 1 つ、4 GB。ClickHouse はメモリ内で計算し、100 万行にわたる
  # グループ化ではそれが顕著になる。
  resourcesPreset: u1.small
  # データベースのユーザとそのパスワード。パスワードは自分で考えて覚えておくこと: これは
  # ワーカー Pod(変数 CH_AUTH)と検証スクリプト(変数 CH_PASSWORD)が必要とする。
  # 作成後はダッシュボードの secret clickhouse-analytics-credentials で見られる。
  users:
    analyst:
      password: ЗдесьВашПароль
  # オブジェクトストレージへのバックアップ。ここのデータは生成されたもので、
  # 復元するものは何もない — 学習用スタンドでは無効化。
  backup:
    enabled: false
  # Keeper はレプリカ間の調整に必要。レプリカは 1 つ — 調整する相手が
  # おらず、Keeper Pod を 3 つ持つとリソースを無駄に消費する。
  clickhouseKeeper:
    enabled: false
