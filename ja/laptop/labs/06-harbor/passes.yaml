---
# ラボ6 · 自分専用のプライベートイメージレジストリ。マニフェストの「動作する」版。
#
# これは passes-broken.yaml と同じファイルに、そこで欠けていた一箇所を加えたものです —
# その箇所は下の「これが欠けていた」という言葉で示してあります。壊れた版で失敗を
# 目にし、なぜそれが起きたのかを理解してから、これを適用してください。
#
# あなたの `lab` クラスタで適用します（Cozystack の管理クラスタではありません — そこには
# Harbor 本体だけが居ます）、デフォルトの名前空間で:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl delete -f passes-broken.yaml
#     kubectl apply -f passes.yaml
#
# 注意: HARBOR-HOST はプレースホルダであり、実際に動くアドレスではありません。適用する前に、
# 自分の Harbor のアドレスに差し替えてください。文字列 HARBOR-HOST はファイル内に2回現れ、sed は両方を置換します:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # macOS
#
# 以下のオブジェクトにおいて: apiVersion は記述スキーマのバージョン、kind は何を作るか、
# metadata.name はオブジェクトの名前です。これ以降は個別には説明しません。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # 1つではなく2つのコピー: こうすることで、サービスの応答から、リクエストが異なるポッドで
  # 処理されていること、そしてイメージはノードに1回ダウンロードされたが2回起動されたことが分かります。
  replicas: 2
  # 「私のコピーとは、ラベル app: passes-api を持つポッドである」という条件。下のポッドの雛形にあるラベルは
  # これと一致していなければならず、そうでなければクラスタはマニフェストを拒否します。
  selector:
    matchLabels:
      app: passes-api
  # コピーを打ち出すための雛形。内側にあるものすべてが1つのポッドを記述します。
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # ポッド全体に対するセキュリティ制約: root で実行しない、非特権ユーザー 10001 として
      # 動作する、システムコールの集合を標準プロファイルに制限する。イメージはまさにこれに合わせて
      # ビルドされています（app/Dockerfile の USER 行を参照）。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # これが passes-broken.yaml に欠けていたものです — この2行だけで、それ以外は何もありません。
      #
      # 閉じたレジストリは誰にでもイメージを渡すわけではありません: まず名乗る必要があります。シークレット `harbor`
      # （kubernetes.io/dockerconfigjson 型）はレジストリのアドレス、ログイン、パスワードを保持します。あなたは
      # kubectl create secret docker-registry コマンドでそれを作成しました。ここでシークレットは名前で
      # 参照されるだけです — そして、それを取り出すのはアプリケーションではなく、ノード上の kubelet であり、
      # イメージをダウンロードしに行くその瞬間に取り出します。だからこそシークレットはポッドと同じ
      # 名前空間に置かれていなければなりません: kubelet はまさにそこを探し、他のどこも探しません。
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # コンテナレベルの権限: 自分に余分な特権を付け足さず、すべての特別な
          # カーネル権限（capability）を手放す。アプリケーションには1つのネットワークポートが必要で、残りは不要です。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # イメージ名の最初の部分はレジストリのアドレスであり、まさにこのために自分専用の
          # レジストリへの移行はマニフェストを変えます: イメージ名が別のものになります。もし先頭にアドレスが
          # 無ければ、クラスタはイメージを Docker Hub へ取りに行き、それこそセキュリティが禁じたことです。
          image: HARBOR-HOST/passes/passes-api:v1
          # アプリケーションのポート。名前 `http` は以降でレディネスチェックと Service が使うので、
          # ポート番号は3箇所ではなく1箇所で指定されています。
          ports:
            - containerPort: 8080
              name: http
          # 環境変数。ここからアプリケーションは、自分が誰でどこから来たのかを知ります。
          # まさにそれを応答に出力します（app/main.go の identity 構造体を参照）。
          # APP_VERSION と IMAGE_REGISTRY はテキストで指定されています — これらは私たち自身が書き込みます。
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # 次は Downward API: クラスタ自身が、ポッドについて知っていることを変数に入れてくれます。
            # アプリケーションは自分の名前を推測する必要も、それをクラスタの API に取りに行く必要も、
            # そのようなリクエストのための権限を持ち歩く必要もありません。値はコピーの起動の
            # 瞬間に差し込まれるので、各コピーがそれぞれ固有の値を持ちます。
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — コピーのために何を確保するか: この数値によってスケジューラはノードを選びます。
          # limits —上限: メモリが上限を超えるとコンテナは kill され、CPU については
          # スロットルされます。16Mi で足りるのは、アプリケーションが依存関係のない Go 製で、メモリに
          # ほとんど何も保持しないからです。JVM なら2桁多く必要でしょう。20m は CPU コアの
          # 千分の二十です。
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # レディネスチェック: アプリケーションが /healthz に応答するまで、Service は
          # このコピーにトラフィックを流しません。新しいバージョンのロールアウト時には、古いコピーは
          # 新しいものが応答した後で初めて負荷分散から外されます — だからリクエストは
          # まだ立ち上がっていないプロセスに当たって落ちることがありません。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# 両方のコピーの背後に立つ恒久的な名前。ポッドは作り直され、アドレスを変えますが、
# 名前 passes-api.default.svc.cluster.local は変わりません。このオブジェクトが無ければアプリケーションは
# 動きますが、クラスタ内でそこに到達する手立てがありません — そして check.sh のチェックは
# ポッドではなく、まさにここに来ます。
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # ポッドとの結びつきは、アドレスのリストではなくラベルによる条件です。ラベル app: passes-api を持つ
  # 新しいコピーは自分で負荷分散の対象になり、登録する必要はありません。
  selector:
    app: passes-api
  # port — Service 自身がどのポートで応答するか; targetPort は上の ports ブロックにある名前 `http`
  # を参照し、番号を参照しないので、番号が変わっても結びつきは壊れません。
  ports:
    - port: 80
      targetPort: http
