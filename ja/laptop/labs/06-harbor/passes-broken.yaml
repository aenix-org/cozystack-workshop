---
# ラボ6 · 自分専用のプライベートイメージレジストリ。このファイルは意図的に不完全です。
#
# これは動きませんが、それが狙いです。あなた自身の目で失敗を確認し、クラスターに何が
# 足りなかったのかを自分で理解する必要があります。ここで足りないのはただ一つ——イメージを
# 取りに行くとき、閉じたレジストリに対してクラスターが自分を名乗るためのものです。レジストリは
# 誰にでもイメージを渡すわけではなく、この記述の中にはクラスターがその権利を証明するのに
# 役立つものが何もありません。どの行がこれを直すのか——それはラボを進める中で解き明かします。
# 動く版は隣の passes.yaml にありますが、考え抜く前に開いても意味はありません。
#
# ここには Deployment だけがあり、Service はありません。サービスに恒久的な名前はまだ不要です——
# イメージがダウンロードされない以上、応答するポッドにはどのみち到達しないからです。
#
# あなたの `lab` クラスター上、デフォルトの名前空間に適用します:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f passes-broken.yaml
#     kubectl get pods -l app=passes-api -w
#
# 注意: HARBOR-HOST はプレースホルダーであり、動作するアドレスではありません。自分の Harbor の
# アドレスを差し込んでください。さもないと、このファイルが書かれた目的のエラーとは別のエラーが
# 出ます(プレースホルダーのある行は2つあります):
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # macOS
#
# 以下のオブジェクトで: apiVersion — 記述スキーマのバージョン、kind — 何を作るか、
# metadata.name — オブジェクトの名前。これ以降で個別には説明しません。
#
# Deployment は「コンテナを実行せよ」ではなく「これこれのコンテナのコピーを、これだけの数だけ
# 動かし続けよ」です。コピーが消えれば、クラスターは何も聞かずに新しいものを作ります。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # コピーは1つ: 失敗を掘り下げるには1つで十分ですし、ログや
  # kubectl describe の出力もノイズが少なくなります。
  replicas: 1
  # 「私のコピーとは app: passes-api ラベルの付いたポッドである」という条件。下のポッドのテンプレート内の
  # ラベルはこれと一致していなければならず、さもないとクラスターはマニフェストを拒否します。
  selector:
    matchLabels:
      app: passes-api
  # コピーを打ち出すための型。この中にあるものすべてが一つのポッドを記述します。
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # ポッド全体へのセキュリティ制約: root で実行しない、非特権ユーザー 10001 で動かす、
      # システムコールの集合を標準プロファイルに制限する。イメージも同じ前提で
      # ビルドされています(app/Dockerfile の USER 行を参照)。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # コンテナレベルの権限: 自分で特権を上乗せせず、カーネルの特別な権限をすべて
          # 手放す。アプリケーションに必要なのはネットワークポート1つで、残りは余計です。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # イメージ名の最初の部分がレジストリのアドレスです。だからこそ自分のレジストリへの
          # 移行はマニフェストを変えます: イメージ名が別のものになるのです。アドレスがなければ、
          # クラスターは Docker Hub にイメージを取りに行きます——つまり、情報セキュリティが禁じた先へ。
          image: HARBOR-HOST/passes/passes-api:v1
          # アプリケーションのポート。`http` という名前はこの先でレディネスプローブに使われるので、
          # ポート番号は2箇所ではなく1箇所で指定されています。
          ports:
            - containerPort: 8080
              name: http
          # 環境変数。アプリケーションはこれらから自分が何者で、どこから来たのかを知ります。
          # まさにそれを応答に出力します(app/main.go の identity 構造体を参照)。
          # APP_VERSION と IMAGE_REGISTRY はテキストで指定されています——これらは私たち自身が書きます。
          # 続く3つはコピーの起動時にクラスター自身が埋めるもので、アプリケーションには知りようがありません。
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — コピーのために予約するもの: この数値をもとにスケジューラがノードを選びます。
          # limits — 上限: メモリが上限を超えるとコンテナは kill され、CPU は
          # スロットリングされます。16Mi で足りるのは、アプリケーションが依存関係のない
          # Go 製だからです。20m は CPU コアの2万分の1です。
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # レディネスプローブ: アプリケーションが /healthz に応答するまで、トラフィックはコピーへ
          # 流れません。今日はそこまで到達しません——これは既に起動したプロセスを確認するものであり、
          # 私たちの場合はより早い段階、イメージのダウンロードで詰まるからです。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
