# ラボ8 · ステップ2/3: パスワードを Deployment から切り出し、独立した Secret オブジェクトに移す。
# 「素朴な修正」: アプリケーションの記述にパスワードはもう見えなくなり、開発者は満足するが、
# 監査担当者は満足しない。なぜか — コマンド一つで確かめる。
#
# このステップが最初のステップより優れている点: 値がアプリケーションの記述の一部ではなくなり、
# 名前で参照されるようになった。第三のステップより劣っている点 — 値は結局
# どこかに書き留めなければならず、そしてまさにこのファイルの中に書かれている。
#
#   secrets-demo-naive.yaml      ファイルを開いた誰もがパスワードを目にする
#   secrets-demo-secret.yaml  <- あなたはここ: パスワードは Secret オブジェクトの中にある
#   secrets-demo.yaml            マニフェストにパスワードはまったく存在しない
#
# 適用先: あなたの `lab` クラスタ (export KUBECONFIG=~/lab.kubeconfig)。
# コマンド: kubectl apply -f secrets-demo-secret.yaml
#
# このファイルのパスワードは学習用の架空のもの。ファイルには
# `---` 行で区切られた2つのオブジェクトがある: Secret と、それを参照する Deployment。apiVersion、kind、
# metadata.name についてはこの先のファイル内では説明しない。
#
# Secret はアプリケーションの記述に置いてはならないもののための独立した種類のオブジェクト。
# クラスタは通常の設定より少し丁寧に扱う: 値は
# kubectl describe に表示されず、読み取り権限は別途付与される。
apiVersion: v1
kind: Secret
metadata:
  name: passes-db
# Opaque は「任意のキー・バリューの集合」を意味する。特別な型もある —
# イメージレジストリへのアクセス用、TLS 証明書用 — が、ここでは特別なものは
# 何も必要ない。
type: Opaque
data:
  # これは暗号化では「ない」。これは base64 — バイト列を印字可能な文字で書き表す方法。
  # 鍵はなく、復号用のパスワードもなく、逆変換は誰にでもできる。
  password: UHJvcHVzazIwMTkh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # 下の Deployment は最初のステップとまったく同じもの。変わったのはちょうど一箇所だけ:
  # DB_PASSWORD がどのようにポッドに入るか。
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # root ではなく、システムコールも限定された集合。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 再び busybox とシェルの数行: アプリケーションの動作ではなく、
          # パスワードの経路を見る。
          image: busybox:1.36
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # これが最初のステップとの違いのすべて。value ではなく valueFrom は
            # 「値をそこから取る」ことを意味する: secretKeyRef.name — どのオブジェクトか、key — その中の
            # どのフィールドか。置換はポッドの起動時に行われ、アプリケーションの記述には
            # 名前だけが残る。
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: passes-db
                  key: password
          # 最初のステップと同じループ: パスワードそのものではなく、パスワードのフィンガープリントを
          # 表示する。フィンガープリントはまさにステップ間の比較に便利 — もし変わっていなければ、
          # 以前と同じ値がポッドに届いたということ。
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s %s に %s として接続中、パスワードのフィンガープリント sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
