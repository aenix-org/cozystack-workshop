# ラボ 8 · ステップ 3/3: マニフェストにパスワードは存在しない — 平文でも base64 でもない。
# 最終版。このファイルは Git にコミットしても、業者に見せても、Tシャツに印刷しても
# 構わない。
#
# このステップが 2 番目とどう違うか: あちらでは値がやはり書き込まれていた — ファイルに、
# そしてクラスタのオブジェクトに。ここでは記述の中にまったく存在しない。アプリケーションは
# 起動時に自分でパスワードを OpenBao ストアから取得する。
#
#   secrets-demo-naive.yaml      ファイルを開いた者は誰でもパスワードを見られる
#   secrets-demo-secret.yaml     パスワードは Secret オブジェクトに移されている
#   secrets-demo.yaml         <- 今ここ: パスワードは起動時にストアから届く
#
# 適用する前に: tenant-workshopXX を自分の namespace に置き換えること — これは下のストアの
# アドレスの一部である。XX はプレースホルダであり、名前の一部ではない。
# 適用先: 自分の `lab` クラスタ (export KUBECONFIG=~/lab.kubeconfig)。
# コマンド: kubectl apply -f secrets-demo.yaml
#
# アプリケーションがストアに対して自身を証明するトークンは passes-bao-token シークレットにある。
# これはファイルではなくコマンドで作成する: このマニフェストにはオブジェクトの名前しか含まれず、
# 名前はシークレットではない。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # すべて非 root で動く。fsGroup が必要なのは、ここにコンテナが 2 つあるからだ: 一方は
      # パスワードのファイルを書き、もう一方はそれを読む。共有グループがなければ init コンテナが
      # 書いたファイルをメインのコンテナが開けず、どこを間違えたのか 30 分は悩むことになる。
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # 一方のコンテナがパスワードを置き、もう一方がそれを読む場所。
      # medium: Memory はこの「ディスク」がノードの RAM 上にあることを意味し、
      # 本物のディスクには決して届かない: バックアップにも、ボリュームダンプにも、サーバから
      # ディスクを抜き取った者の手にも。Pod が消えれば、その中身も消える。
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      # init コンテナはメインより前に実行され、正常に完了しなければならない。
      # パスワードを取得できなければアプリケーションはまったく起動しない。そしてそれが正しい
      # 挙動だ: データベースのパスワードがないサービスはどのみち使い物にならない。起動して
      # ログにエラーを吐き続けるより、起動しないほうが誠実だ。
      initContainers:
        - name: fetch-secret
          # OpenBao 自身のイメージを、たった一つのユーティリティ `bao` — そのクライアント — のために使う。
          # 自前のコードを書く必要はない。
          image: openbao/openbao:2.5.1
          # bao kv get -field=password — シークレット全体ではなく、1 つのパスから 1 つのフィールドだけを
          # 取得する。tr -d '\n' は、さもなければパスワードの中に紛れ込む改行を取り除く:
          # 末尾の余分な 1 文字はデータベースが受け付けず、そういう不具合を探すのは厄介だ。
          # chmod 0400 — ファイルを読めるのは所有者だけ。
          # set -e は最初のエラーでスクリプトを止める: さもなければコンテナは空のファイルのまま
          # 正常終了してしまい、原因究明はアプリケーション側でやる羽目になる。
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              bao kv get -field=password secret/passes/db \
                | tr -d '\n' > /secrets/db_password
              chmod 0400 /secrets/db_password
              echo "пароль получен из OpenBao, в манифесте его нет"
          # ストアのアドレスと、アプリケーションが読み取り権限を証明するためのトークン。
          # トークンはコマンドで作成したオブジェクトへの参照で渡される。ここ、ファイルの中には入らない。
          # アドレスの中の tenant-workshopXX が、置き換えるべき例のプレースホルダだ。
          env:
            - name: BAO_ADDR
              value: http://openbao-secrets.tenant-workshopXX.svc.cozy.local:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: passes-bao-token
                  key: token
          # 共有フォルダ。このコンテナには書き込み権限が与えられている — ここに書き込む。
          volumeMounts:
            - name: secrets
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # リミットがメインコンテナより高い: OpenBao のユーティリティは busybox より重いが、
          # 数秒しか生きないので、これは恒常的なコストではない。
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      # メインコンテナは init コンテナが完了した後にのみ起動する。
      containers:
        - name: app
          image: busybox:1.36
          # 前のステップと同じループだが、パスワードは今や環境変数ではなくファイルの中にある:
          # 指紋は /secrets/db_password から直接読み取られる。
          # 環境変数は kubectl describe pod の出力に見え、プロセスダンプにも入り込む。
          # Pod のメモリ上のファイルはそうならない。
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(sha256sum /secrets/db_password | cut -c1-12)"
                sleep 10
              done
          # ここに残っているのは非機密の設定だけ — アドレスとログイン。
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
          # 同じフォルダだが読み取り専用: アプリケーションはたとえどれほど望んでも、
          # パスワードを壊したり差し替えたりできない。
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
