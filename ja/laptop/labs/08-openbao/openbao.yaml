# ラボ8 · OpenBao シークレットストアの注文。
# ダッシュボードでマウス操作して注文するのと同じもの — ただしテキストで。
# ラボクラスタではなく、管理クラスタ上のテナントに適用します：
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f openbao.yaml
#
# 適用する前に：tenant-workshopXX を自分の namespace に置き換えてください。XX はプレースホルダーで
# あって名前の一部ではありません。自分の番号はパスワードと一緒に受け取っています。他人のテナントに
# 入ってしまうと、アクセス拒否になります — そしてそれが起こりうる最善の結果です。
#
# kind: OpenBAO は Kubernetes の組み込みオブジェクトではなく、Cozystack が追加する
# タイプです。必要なものを記述すると、プラットフォーム自身がポッド、ディスク、
# サービスを展開し、その後も自動で更新し続けます。手渡された仮想マシンにソフトを
# インストールするというより、カタログからサービスを注文するのに近いものです。
apiVersion: apps.cozystack.io/v1alpha1
kind: OpenBAO
metadata:
  # 名前が影響するのはダッシュボードのカードだけではありません：ストアの内部アドレスも
  # これから組み立てられます — openbao-secrets.<namespace>.svc.cozy.local。名前を変えたら、
  # secrets-demo.yaml と check.sh 用の BAO_APP 変数のアドレスも直してください。
  name: secrets
  namespace: tenant-workshopXX
spec:
  # 1コピー。本番では3つ立てて Raft レプリケーションを得ます：チャートは
  # replicas > 1 になるとそれを自動で有効にします。行き来の切り替えには
  # データの移行が必要なので、判断は後ではなく前に行います。
  replicas: 1
  # ストアのデータ用ディスク。2ギガバイトは十分すぎるほど：シークレットはバイト単位の重さで、
  # 容量はバージョン履歴と監査ログに使われます。ボリュームは作成後に縮小
  # できませんが、通常は拡大できるので、ここでケチる意味はありません。
  size: 2Gi
  # ストレージクラス replicated は、データが複数のコピーとして
  # 別々のノードに置かれることを意味します。ノード障害があなたのパスワードを全部持ち去ることは
  # ありません — そしてシークレットストアをバックアップから復元するのは、それはそれで不快な作業です。
  storageClass: replicated
  # 「CPU とメモリをどれだけ」という出来合いのセット。プラットフォームがリストで提示するのは、
  # 誰もが requests と limits を手計算しなくて済むようにするためです。
  resourcesPreset: t1.small
  # Web インターフェースはクラスタ内部で立ち上がります。外部には公開しません：
  # external: true なら LoadBalancer を付けますが、ラボでは不要です。
  ui: true
  external: false
