# ラボ8 · ステップ1/3: パスワードがマニフェストに平文で書かれている。
# 「ゲストパス」サービスの現状はこうなっており、監査が見つけたのはまさにこのファイルだ。
# 問題を自分の目で確かめるため、これを一度だけ適用する。
#
# 迷わないための、ラボの3つのステップ:
#   secrets-demo-naive.yaml   <- 現在地: ファイルを開いた人は誰でもパスワードを見られる
#   secrets-demo-secret.yaml     パスワードを別の Secret オブジェクトに切り出した
#   secrets-demo.yaml            マニフェストにパスワードは一切ない
#
# 適用先: あなたの `lab` クラスタ (export KUBECONFIG=~/lab.kubeconfig)。
# コマンド: kubectl apply -f secrets-demo-naive.yaml
#
# このファイルのパスワードは学習用の架空のもので、本物はここにはない。オブジェクトは1つ —
# Deployment。apiVersion、kind、metadata.name についてはこれ以降コメントしない。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # 1コピーで十分: ここで見るのは耐障害性ではなく、
  # アプリケーションがどこからパスワードを取得するかだ。
  replicas: 1
  # このラベルで Deployment は自分のポッドを識別する。下の template のラベルと一致する。
  selector:
    matchLabels:
      app: secrets-demo
  # template — ポッドのテンプレート: コピーを何から組み立てるか。
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # セキュリティ要件: root では動かさず、システムコールを限定する。
      # ギャップに注目: ポッドはあらゆるセキュリティルールに沿って設定されているが、それは
      # 10行下でパスワードがファイルに書かれていることを何ら妨げない。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 本物のアプリケーションはここにはない — busybox とシェル数行だけだ。
          # このラボで重要なのは1つだけ: パスワードがどこから来るかであって、その後
          # それをどうするかではない。
          image: busybox:1.36
          env:
            # データベースのアドレスとユーザー名は秘密ではない: データベースが
            # passes-db と呼ばれていると知っても、それ自体ではアクセスは得られない。
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # 監査が見つけたのはまさにこの行だ。
            # ファイルは Git にあり、つまりパスワードはリポジトリにアクセスできる人全員と、
            # かつてクローンしたことのある人全員に知られている。
            - name: DB_PASSWORD
              value: "Propusk2019!"
          # 無限ループ: 10秒ごとにログへ1行出力する。ログに出るのはパスワード
          # そのものではなく、その sha256 フィンガープリント — 先頭の12文字だ。フィンガープリントから
          # パスワードが変わったことは分かるが、そこから値を復元することはできない。
          # 本物のサービスではログはまさにこのように書かれる。
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s %s に %s として接続中、パスワードのフィンガープリント sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          # リソース要求はごくわずか: これはデモであって、実負荷ではない。
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
