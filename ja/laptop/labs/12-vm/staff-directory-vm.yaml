---
# ラボ12。レガシーな従業員名簿を載せる仮想マシン: ディスクとマシン本体という
# 2つのオブジェクトを1つのファイルにまとめ、`---` 行で区切っています。
#
# これらはテナントのオブジェクトです: `lab` クラスタではなく、管理クラスタ上の
# あなたの namespace に置かれます。テナント用の kubeconfig が必要です。
#
# 適用する前に tenant-workshopXX を自分の namespace に置き換えてください。さもないと
# 注文があなたのテナントではなく別のテナントに送られてしまいます。
#
#     export KUBECONFIG=~/.kube/workshop
#     kubectl apply -f staff-directory-vm.yaml
#
# 同じことはテナントのダッシュボードでマウス操作でもできます(アプリケーションを作成 -> VM Disk、
# 続いて VM Instance) — 結果は同じです。
#
# 注意: 以降でマシンを呼び出すときの名前は metadata.name と一致しません。これはラボの
# 誤記ではありません。名前 X の VMInstance オブジェクトを、プラットフォームは
# `vm-instance` チャートでデプロイし、チャート名はリリース名と連結されます: 起動した
# インスタンスは vm-instance-X という名前になります。加えて、ターゲットはタイプの接頭辞を
# 付けて指定します。テナント権限はインスタンス(virtualmachineinstances、別名 vmi)に対して
# 付与されており、virtualmachines には付与されていないためです — 裸の名前は forbidden を
# 返します。そこからコンソールへのログインコマンドは次のとおりです:
#     virtctl console --namespace=tenant-workshopXX vmi/vm-instance-spravochnik
# 起動中のインスタンス一覧: kubectl get vmi -n tenant-workshopXX
# 一方 `kubectl get vminstance spravochnik` はインスタンスではなく、それに対するあなたの注文を
# 表示します — まさに以下で記述されているオブジェクトです。
#
# ディスクとマシンは2つの異なるオブジェクトであり、これは官僚主義ではありません: ディスクは
# マシンより長く存続します。マシンは削除して作り直し、同じディスクを接続できます。
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  source:
    image:
      # URL ではなく、プラットフォームの共有イメージコレクションからの名前です。
      # 一覧はディスク作成時にダッシュボードで確認できます。
      name: ubuntu-22.04
  # ディスクサイズ。ソースイメージより小さくはできません: ubuntu-22.04 は 20Gi に
  # 展開され、10Gi のディスクをプラットフォームは満たすのを拒否します。ディスクは後で拡張
  # できますが縮小はできないので、ここで少なく見積もる方が多く見積もるより高くつきます。
  storage: 20Gi
  # ストレージクラス。`replicated` — データはプラットフォームの複数の異なるノードに複数コピー
  # 書き込まれます: コピーを持つノードが死んでもマシンは動き続けます。要はミラーで、ただし
  # ネットワーク越しに組まれたものです。同じクラスを近隣のラボのデータベースも使っています。
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  # 1 CPU、4 GB。Kubernetes のノードサイズを取ってくるのと同じカタログの参照です:
  # ここではマシンとノードは同じ物差しで測られます。
  instanceType: u1.medium
  # ゲスト OS のプロファイル: どのドライバとデバイスをマシンに与えるか。
  instanceProfile: ubuntu
  # Always は「起動したままにする」という意味です: 自分で止まっても再び起動されます。
  # Halted — 停止、Manual — 残したまま。
  runStrategy: Always
  # どのディスクをマシンに接続するか。参照は上の VMDisk オブジェクトの名前で行います — まさに
  # このマシンより長く存続するものです。
  disks:
    - name: spravochnik
  # 注意: ここには replicas フィールドはありませんし、今後もありません。
  # 仮想マシンは1つのオブジェクトです。マシンが2台必要なら、異なる名前の2つの
  # オブジェクトです。これは Deployment との根本的な違いであり、
  # この違いがどこで痛むかについては README のセクションを参照してください。
  # ゲスト OS の初期設定。cloud-init は Linux クラウドイメージの標準的な仕組みです:
  # 初回起動時にマシンはこのテキストを読み、自分自身に適用します。役割としては
  # vSphere のゲストカスタマイズ — パスワード、ファイル、サービス — ですが、ウィザードではなく
  # 記述によるものです。`|` の後のインデントより下はすべてゲストへ字義どおり渡され、
  # Kubernetes ではなくそこで解釈されます。
  #
  # ここで cloud-init は名簿をサーバーにします: HTML ページを置き、ポート 8080 で HTTP 経由で
  # それを配信するサービスを立てます。python3 は ubuntu イメージに既に入っています — このために
  # インターネットは不要です。ポート 8080 は偶然ではありません: 進行役があなたのテナントに
  # あらかじめ Service `spravochnik-http` (80 -> 8080) と Ingress `spravochnik` を作成しており、
  # マシン内のサービスが立ち上がるとすぐ、名簿はテナントのドメインで公開されます。
  cloudInit: |
    #cloud-config
    # このパスワードはダッシュボードからコンソールにログインするために必要です。本番マシンでは
    # このようにしてはいけません — そこでは sshKeys を使います。
    password: ubuntu
    chpasswd: { expire: false }
    ssh_pwauth: true
    write_files:
      - path: /opt/directory/index.html
        content: |
          <!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Справочник</title></head><body><h1>Справочник сотрудников</h1><ul><li>Иванов И. — 101</li><li>Петров П. — 102</li></ul></body></html>
      - path: /etc/systemd/system/directory.service
        content: |
          [Unit]
          Description=Staff directory
          After=network.target
          [Service]
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0 --directory /opt/directory
          Restart=always
          [Install]
          WantedBy=multi-user.target
    runcmd: [ "systemctl daemon-reload", "systemctl enable --now directory" ]
