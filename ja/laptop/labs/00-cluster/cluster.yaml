# ラボ 1〜14 用の学習用 Kubernetes クラスタ。
# 適用する前に、tenant-workshopXX を自分の namespace に置き換えてください。
#
# 管理クラスタ上で、テナントと一緒に発行されたアクセス権を使って適用します。
# このクラスタ自体の kubeconfig はまだ存在しません。クラスタが起動して
# 初めて生成されます。
#
#   kubectl apply -f cluster.yaml
#
apiVersion: apps.cozystack.io/v1alpha1
kind: Kubernetes
metadata:
  name: lab
  namespace: tenant-workshopXX
spec:
  version: v1.35
  storageClass: replicated
  controlPlane:
    # 管理層のコピーは 1 つだけ。これは学習用スタンドなので、耐障害性よりも
    # リソースの節約を優先します。
    replicas: 1
  addons:
    monitoringAgents:
      # すぐに有効にしてください。メトリクス収集は後からさかのぼって有効に
      # できません。チェックを入れる前に起きたことはすべて失われます。ラボ 14 はこのデータに依存しています。
      enabled: true
  nodeGroups:
    md0:
      # このグループは、コピーの空き容量が足りなくなると自分でノードを追加できます。
      # スケーリングのラボではそこまでは至りません。そこで増えるのはコピーであってノードではありません。
      minReplicas: 1
      maxReplicas: 3
      instanceType: u1.medium
      diskSize: 20Gi
      storageClass: replicated
