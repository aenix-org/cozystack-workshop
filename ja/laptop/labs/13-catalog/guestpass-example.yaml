---
# ラボ13。管理者が applicationdefinition.yaml を適用した後、あなたのアプリケーションの
# 注文がどのように見えるかを示したものです。あなたのテナントで適用します:
#   kubectl apply -f guestpass-example.yaml
#
# 注意: tenant-workshopXX はプレースホルダーであり、namespace 名ではありません。適用する前に
# XX を自分のテナント番号に置き換えてください。さもないと kubectl は拒否します: そのような
# namespace は存在せず、他人のテナントには入れてもらえません。
#
# 注目: apps.cozystack.io グループは Bucket、VMInstance、その他のカタログアプリケーションが
# 使うものと同じです。あなたのアプリケーションは、脇に外れることなく、それらと同じ列に
# 並びます。
#
# 管理者が定義を登録する前にこのファイルを適用することはできません:
# kubectl は `no matches for kind "GuestPass"` と返します。
apiVersion: apps.cozystack.io/v1alpha1
kind: GuestPass
metadata:
  name: main
  namespace: tenant-workshopXX
# spec のフィールドは、chart/values.yaml に記述され、ダッシュボードの注文フォームに表示される
# パラメータそのものです。ここではそれらをテキストとして書き出しています: ダッシュボードで
# ボタンを押すのと同じことですが、このようなファイルはレビューでき、Git に入れてロールバック
# できます。
spec:
  replicas: 2
  greeting: "Order a pass for your guest"
  external: false
  resources:
    cpu: 100m
    memory: 128Mi
