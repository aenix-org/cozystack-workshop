---
# ラボ13. Cozystackカタログ向けのアプリケーション定義 — まさに「カタログの項目」。
#
# このオブジェクト自体は何もデプロイしません。3つのものを結び付けます: あなたのチャート
# （何をデプロイするか）、APIにおける新しいオブジェクトの種類（アプリケーションをどう注文するか）、
# そしてダッシュボードのカード（その際に人が目にするもの）。これが存在しない間、チャートはファイルの入った
# フォルダのままで、プラットフォームはそれを知らず、PostgresやRedisの隣のアプリケーション一覧は空です。
#
# 1つのコマンドで、namespaceなしで適用します:
#   kubectl apply -f applicationdefinition.yaml
#
# 重要: このオブジェクトはCLUSTER-SCOPED（クラスタスコープ）です — namespaceを持たず、クラスタ全体で
# 1つだけ存在します。テナントはこれを適用できません、これは検証済みです:
#   kubectl auth can-i create applicationdefinitions   ->   no
# あなたの作業は、ファイルを書き、ローカルで確認したところで終わります。
# 適用するのはプラットフォーム管理者です。READMEの「あなたの権限が
# どこで終わるか」の節を参照してください。
apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: guest-pass
spec:
  # --- APIではこう見える ----------------------------------------------
  application:
    # 新しいオブジェクト型のKind。適用後、クラスタには kind: GuestPass が現れ、
    # 通常のkubectlで扱えるようになります。
    kind: GuestPass
    plural: guestpasses
    singular: guestpass
    # 値のスキーマ — チャート内に values.schema.json ファイルとして置かれているものと同じで、
    # 1行にまとめて書いただけです。これによってAPIは不正な値を拒否し、
    # ダッシュボードは作成フォームを描画します。
    openAPISchema: |-
      {"title":"Chart Values","type":"object","properties":{"replicas":{"description":"Number of application replicas.","type":"integer","default":2},"greeting":{"description":"Text shown on the main page.","type":"string","default":"Order a pass for your guest"},"external":{"description":"Enable external access from outside the cluster.","type":"boolean","default":false},"resources":{"description":"Explicit CPU and memory configuration.","type":"object","default":{},"properties":{"cpu":{"description":"CPU available to each replica.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true},"memory":{"description":"Memory (RAM) available to each replica.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true}}}}}

  # --- 何をデプロイするか ----------------------------------------------
  release:
    # リリース名 = prefix + オブジェクト名。`main` という名前のGuestPassオブジェクトは
    # `guest-pass-main` というリリースとしてデプロイされます。prefixは必須で、
    # 異なるアプリケーションのリリースが名前で衝突しないようにするために存在します。
    prefix: guest-pass-
    labels:
      # 同じキーで、CozystackはテナントのリリースをFluxのシャードに振り分けます。
      # これがないと、リリースを世話する担当がいなくなります。
      sharding.fluxcd.io/key: tenants
    chartRef:
      # チャートをどこから取得するか。許可されるkind: OCIRepository、HelmChart、
      # ExternalArtifact。外部カタログは通常 GitRepository -> HelmChart 経由で届き、
      # そのnamespaceは cozy-public です。
      kind: HelmChart
      name: cozystack-guest-pass
      namespace: cozy-public

  # --- ダッシュボードではこう見える ------------------------------------------
  dashboard:
    # カタログのセクション。使えるもの: PaaS、IaaS、NaaS、Administration、
    # Networking — 自分で考え出すのではなく、既存のものを使ってください。
    # さもないと、アプリケーションは項目が1つだけのセクションに入ってしまいます。
    category: PaaS
    singular: Guest Pass
    plural: Guest Passes
    description: Internal guest pass service for employees and reception
    tags:
      - internal
      - web
    # アイコン — base64のSVG。パスでもURLでもなく、まさにbase64です: ダッシュボードは
    # 何かをダウンロードしにどこかへ行ったりしません。ソースは隣の icon.svg にあります。
    icon: 
    # オブジェクトのYAML表現におけるフィールドの順序。装飾的ですが、これがないと
    # フィールドがばらばらに並び、フォームが読みにくくなります。
    keysOrder: [["apiVersion"], ["kind"], ["metadata"], ["metadata", "name"], ["spec", "replicas"], ["spec", "greeting"], ["spec", "external"], ["spec", "resources"]]
