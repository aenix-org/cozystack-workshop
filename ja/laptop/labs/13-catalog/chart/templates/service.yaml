# ラボ13。Serviceテンプレート: アプリケーションの安定したアドレス。
#
# アプリケーションのコピーは現れては消え、そのアドレスは毎回新しくなります。Serviceは変わらない名前を
# 与え、リクエストを稼働中のコピーへ振り分けます。隣のPodからは
# リリース名でアプリケーションにアクセスします。
#
# 二重波括弧内の置換と、オブジェクト名がどこから来るかについては
# templates/deployment.yaml に書かれています。ここでもすべて同じ仕組みです。
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # values内の1つのフラグで、アプリケーションがクラスター外のアドレスを得るかどうかが決まります。
  # Cozystackの標準アプリケーションも同じ仕組みです: external フィールド。
  # if/else 構文はレンダリング時に2つの値のうち1つを選びます。完成したマニフェストには
  # LoadBalancer か ClusterIP のどちらかが入り、分岐はもう残りません。
  type: {{ if .Values.external }}LoadBalancer{{ else }}ClusterIP{{ end }}
  # どこにトラフィックを送るか。Serviceは名前ではなくラベルでPodを選びます。だから
  # コピーがいくつあるか、何という名前かは問いません。ラベルはDeploymentが
  # コピーに付けるものと同じです。
  selector:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
  # port はService自身がリッスンするポート、targetPort はPod内部のどこへ接続するか。
  # targetPort は名前で記述されます: http という名前のポートはDeploymentテンプレートで宣言されています。
  # そこで番号が変わっても、ここを直す必要はありません。
  ports:
    - name: http
      port: 80
      targetPort: http
