# ラボ 13。Deployment テンプレート: 何を、いくつのコピーで動かすか。
#
# templates/ 内のファイルは完成したマニフェストではなく雛形です。Helm はそこに値を差し込み、
# 結果をクラスターに渡します: `helm template main chart` は何も適用せずに完成したテキストを
# 表示し、`helm install main chart` はそれを適用します。
#
# 二重波括弧は差し込みの箇所です。その中には次のものが現れます:
#   .Values.name  — パラメータの値: 顧客が触っていなければ values.yaml から、
#                   自分で選んだなら、ダッシュボードの注文フォームから。
#   .Release.Name — リリース名、つまりチャートの具体的な展開の名前。
# 波括弧の外のテキストはそのままマニフェストに入ります。
apiVersion: apps/v1
kind: Deployment
metadata:
  # オブジェクト名はハードコードせず、リリース名から組み立てます。同じチャートを
  # 一つの namespace に一度ならず展開することがあり、固定名では二つ目の注文が
  # 一つ目を上書きしてしまいます。リリース `main` は名前が `main` の Deployment、Service、
  # ConfigMap を生み、名前を見ればそれらが一つのグループだと一目でわかります。
  name: {{ .Release.Name }}
  # ラベル: name はこのアプリケーションの全注文で同じ、instance は注文を区別します。
  # これらでオブジェクトは互いを見つけ合い、`kubectl get` の出力もこれらで絞り込まれます。
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # いくつのコピーを起動し続けるか。コピーが消えると、クラスターは尋ねずに新しいものを
  # 作ります — ここから当直管理者なしの自己修復が生まれます。
  replicas: {{ .Values.replicas }}
  # selector は Deployment にどのポッドを自分のものとみなすかを伝えます — 名前ではなくラベルで。
  # ここのラベルと template.metadata.labels のラベルは一致していなければなりません。ずれると
  # Deployment は自分のコピーを見つけられず、何度も何度も打ち出し続けます。
  selector:
    matchLabels:
      app.kubernetes.io/name: guest-pass
      app.kubernetes.io/instance: {{ .Release.Name }}
  # template はポッドの雛形です。以下すべては Deployment 自体ではなく、それがこの雛形から
  # 作るアプリケーションのコピーを記述します。
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guest-pass
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # ポッドのアノテーションに入れる設定のハッシュ。これがないと ConfigMap を編集しても
        # ポッドは再起動されず、誰かが手で削除するまで新しいテキストは現れません。
        # これはチャート全般に対する最もよくある不満です。
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # アプリケーションは root ではなく、削られた権限で動きます。カタログのチャートは
      # 他のテナントが自分の namespace に展開するもので、コンテナの権限はアプリケーションと
      # 一緒にあなたが彼らに約束するものの一部です。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # イメージはテンプレートに書かれ、意図的にパラメータに出していません: 顧客は
          # サイズとテキストを選びますが、アプリケーション自体を任意のものに差し替えることはできません。
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # この変数がないと nginx はノードのコアごとにワーカープロセスを一つ立ち上げます。
          # 数十コアのノードでは数十個になり、メモリ制限が百メガバイトのポッドは最初のリクエストの
          # 前に OOMKilled で死にます。チャートは他のテナントに渡り、そこのノードはどんなものでも
          # あり得るので、ここではこれは必須です。
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # コンテナ内のポート。名前 http はこの先プローブと Service で使われ、ポート番号を
          # 三箇所ではなく一箇所に書いておくためです。
          ports:
            - containerPort: 8080
              name: http
          # requests — 保証して割り当てる量。この数値でスケジューラはノードを選びます。
          # ここの limits はメモリのみ: 超えるとコンテナは kill され、再び起動されます。
          # CPU 制限は意図的にありません。さもないとアプリケーションは遅く動く代わりに
          # 天井にぶつかります。
          # フィルタ `| quote` は差し込まれた値を引用符で包みます: ユーザーは 1 と
          # 入力するかもしれず、引用符がないと "1" や "100m" のような記述が期待される場所に
          # 数値がマニフェストへ入ってしまいます。
          resources:
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
            limits:
              memory: {{ .Values.resources.memory | quote }}
          # readinessProbe —「リクエストを受け付ける準備はできたか?」という問い。/healthz が
          # 答えるまで、Service はこのコピーにトラフィックを送りません。ここから中断なしの更新が
          # 生まれます: 古いコピーは、新しいものが答えた後にバランシングから外されます。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          # ページと nginx の設定は ConfigMap からファイルとして接続されます。subPath は
          # ちょうど一つのファイルだけを差し込みます: これがないとマウントされたディレクトリが
          # /etc/nginx/conf.d 全体を置き換え、イメージの標準設定は消えてしまいます。
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      # ConfigMap の名前はリリース名から組み立てられるので、ポッドは常に隣の注文ではなく
      # 自分の注文の設定をマウントします。
      volumes:
        - name: page
          configMap:
            name: {{ .Release.Name }}
        - name: conf
          configMap:
            name: {{ .Release.Name }}
