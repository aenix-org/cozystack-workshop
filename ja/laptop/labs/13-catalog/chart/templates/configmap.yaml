# ラボ13. ConfigMap テンプレート: 「入館証」ページと nginx 設定。
#
# ConfigMap はテキストファイルを保持し、Pod に配信する。ページはイメージの中ではなく
# ここに置く。再ビルドせずにテキストを変更できるようにするためで、greeting の値はレンダー時に
# 差し込まれ、リリースを更新するだけで済む。
#
# 差し込みは `|` ブロックの内側でも動作する。Helm はテンプレートファイルを単なる
# テキストとして扱い、YAML の構造については何も知らない。詳細は templates/deployment.yaml を参照。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
# data のキーはファイル名であり、`|` の下にあるものはその内容全体である。
# 各キーは別々のファイルとしてコンテナにマウントされる。Deployment の volumeMounts を参照。
data:
  # 従業員が目にするページ。ここには2つの値が入る。注文フォームからの greeting と
  # リリース名で、開いたページを見れば誰の注文かが分かるようにするためである。
  index.html: |
    <!doctype html>
    <html lang="en">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Guest Pass</title>
    <style>
      body{background:#0d1117;color:#e6edf3;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:12vh 5vw;margin:0}
      h1{font-size:clamp(26px,6vw,56px);margin:0 0 .3em;color:#2f6fed}
      .pod{font-family:ui-monospace,Menlo,monospace;color:#7d8590;margin-top:3em}
    </style>
    <h1>{{ .Values.greeting }}</h1>
    <p>Guest Pass service, release <b>{{ .Release.Name }}</b></p>
    <div class="pod">served by __POD__</div>
    </html>
  # nginx の設定。sub_filter はページを配信する瞬間に __POD__ というマーカーを Pod 名に
  # 置き換える。こうすることでどのコピーが応答したかがブラウザで分かる。/healthz への個別の応答は
  # Deployment の readinessProbe に必要で、それはまさにこのアドレスに問い合わせる。
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location / {
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
