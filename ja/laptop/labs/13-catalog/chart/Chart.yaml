# ラボ 13。「入館証」チャートのパスポート。
#
# チャートとはフォルダのこと: マニフェストのテンプレートは templates/、デフォルト値は values.yaml、
# パラメータのスキーマは values.schema.json に置かれます。ラボのフォルダから
# `helm install <リリース名> chart` コマンドでデプロイされ、Cozystack のカタログでは
# 誰かがダッシュボードからアプリケーションを注文したときにプラットフォーム自身によってデプロイされます。
#
# Chart.yaml はパッケージの表紙: これによって Helm はパッケージの名前とバージョンを把握します。
apiVersion: v2
name: guest-pass
description: Internal guest pass service — order a pass for a visitor
type: application

# 続いて二つのバージョンが登場しますが、これらは Helm の中で何よりも混同されがちです。両者は別物です。
#
# version — パッケージングのバージョン。テンプレート、値、スキーマを編集したときに変わります。
# たとえ中のアプリケーションがそのままでも変わります。Helm がリリースの更新時に比較するのはまさにこれで、
# リポジトリにアップロードされたパッケージを区別するのもこれです。これを上げなければ
# プラットフォームはパッケージが変わっていないとみなし、新しいバージョンが見過ごされることがあります。
version: 0.1.0
# appVersion — パッケージの中にあるアプリケーション自体のバージョンで、ここでは nginx です。独自の
# ライフサイクルを持ちます: アプリケーションはテンプレートを一度も編集せずに十回更新されることもあれば、逆に
# テンプレートを書き換えてもアプリケーションは同じということもあります。オブジェクト名には現れず、
# `helm list` の出力とカタログのカードに表示されます。
appVersion: "1.0"
