# ラボ 13。「入館証」チャートのデフォルト値。
#
# これらは、チャートがデプロイ時に尋ねる質問への回答です。レプリカをいくつにするか、
# ページにどんなテキストを載せるか、外部アドレスが必要か。ここには「何も選ばなかった」
# 場合に備えて記録されています。アプリケーションを注文する人がこれらを上書きします。
# ダッシュボードではフォームのフィールドで、ターミナルでは `--set replicas=5` キーや
# 自分のファイル `helm install ... -f my.yaml` で。このファイルを編集すると、今後の注文の
# デフォルトが変わり、すでにデプロイ済みのものは変わりません。
#
# ここの値がどのようにダッシュボードの注文フォームになるか：
#   型         — どのフィールドを表示するか：{int} 数値、{bool} トグル、
#                {string} 入力欄、{struct} 入れ子のフィールドグループ；
#   説明       — フィールドのラベルとその下のヒント；
#   =値        — フォームを開いたときにフィールドにすでに入っている値；
#   必須性     — スキーマの required リストで指定します。ここにはありません：どのパラメータ
#                にもデフォルト値があるので、どのフィールドも省略できます。
# だからこそ説明は英語で書かれています：チャートの作者だけでなく、ダッシュボードで
# アプリケーションを注文する誰もがそれを読むからです。

## `## @param` のようなコメントは飾りではありません。これらをもとに Cozystack のジェネレータ
## (cozyvalues-gen) が values.schema.json と README のパラメータ表を生成します。
## 書式：## @param {型} 名前=デフォルト値 - 説明。

# アプリケーションのレプリカをいくつ起動したままにするか。レプリカが 1 つだと、
# ノードの再起動中はダウンタイムになります。2 つならどちらか一方を失っても生き残ります。
## @param {int} replicas=2 - Number of application replicas.
replicas: 2

# メインページのテキスト。パラメータとして公開しています。子会社ごとに独自の文言があり、
# そのためだけに別のイメージをビルドする人はいないからです。
## @param {string} greeting=Order a pass for your guest - Text shown on the main page.
greeting: "Order a pass for your guest"

# アプリケーションにクラスタ外のアドレスが必要かどうか。Cozystack カタログの慣例：
# external という名前のフィールドは、すべてのアプリケーションで同じ意味 — 外部アクセス — を表します。
## @param {bool} external=false - Enable external access from outside the cluster.
external: false

# 1 レプリカのサイズ。別のフィールドグループとして公開しています。注文フォームで、
# 関連のない 2 つのフィールドではなく、1 つの「リソース」ブロックとして見えるようにするためです。
## @typedef {struct} Resources - CPU and memory for each replica.
## @field {quantity} cpu - CPU available to each replica.
## @field {quantity} memory - Memory (RAM) available to each replica.

## @param {Resources} resources - Explicit CPU and memory configuration.
resources:
  cpu: 100m
  memory: 128Mi
