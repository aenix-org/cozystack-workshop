---
# Lab 7 · キャッシュを本番用に有効化する。すでにデプロイ済みの passes-api の上に適用します。
# `lab` クラスタで（export KUBECONFIG=~/lab.kubeconfig）:
#   kubectl patch deployment passes-api --patch-file cache-patch.yaml
#
# これはパッチであって完全なマニフェストではありません。変更する箇所だけを記述します。それ以外のすべて —
# イメージ、ラベル、プローブ、リソース — は passes-api.yaml のまま手つかずで残ります。だからこそこの
# ファイルは spec からいきなり始まります。コンテナまでのパスは Deployment の構造をなぞっており、
# クラスタが編集をどこに適用すべきかを正確に理解できるようにしています。
#
# コンテナ名 `api` は飾りではなくアドレスです。クラスタはこれを使ってリスト内の正しいコンテナを見つけます。
# 名前を間違えると、編集ではなく 2 つ目のコンテナができてしまいます。
#
# REDIS-ADDR の代わりに自分の Redis のアドレスを入れてください — これはプレースホルダーであり、ホスト名ではありません。
# アドレスはダッシュボードの、自分のマネージド Redis アプリケーションのカードから取得します。
spec:
  template:
    spec:
      containers:
        - name: api
          # Kubernetes の env リストは name フィールドでマージされるため、下の 3 つのエントリは
          # Deployment にすでにあるものを置き換えるのではなく、それらに追加されます。
          env:
            # この変数が現れることこそが「キャッシュを有効にする」という意味です。アプリケーションは起動時に
            # これをチェックし、設定されていれば最初に Redis を参照します。空、または
            # 存在しなければ、以前どおりリクエストごとに名簿を参照して動作します。
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
            # パスワードはテキストで書きません。別のコマンドで作成するシークレットから渡されます。
            # Git に置かれるマニフェストに、
            # パスワードの居場所はありません。
            #
            # secretKeyRef は参照です。name は同じクラスタ内のシークレットオブジェクトの名前、
            # key はその中のどのフィールドを取るかです。値はポッドの起動時に差し込まれ、
            # ファイルには決して現れません。
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
            # レコードがキャッシュ内で何秒生きるか。60 という値なのは、
            # 従業員名簿が 1 秒に 1 回ではなく 1 日に 1 回しか変わらないからです。
            #
            # 期間が長いほど名簿を参照する回数は減りますが、古い姓を長く返し続けます。
            # 短いほどデータは新鮮ですが、得られる効果は小さくなります。これはトレードオフであり、
            # 正しい値が決まっている設定ではありません。
            - name: CACHE_TTL
              value: "60"
