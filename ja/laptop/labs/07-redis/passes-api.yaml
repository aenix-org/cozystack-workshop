---
# ラボ7 · 「パス」サービス、バージョン v2 — キャッシュを扱えるほう。
# ここではキャッシュはまだ有効に「なっていません」。まずはキャッシュなしでどれだけ悪いかを計測します。
# キャッシュは後で、同じフォルダ内の cache-patch.yaml パッチで有効になります。
#
# 適用先: あなたの `lab` クラスタ (export KUBECONFIG=~/lab.kubeconfig)。
# コマンド: kubectl apply -f passes-api.yaml
#
# HARBOR-HOST はアドレスではなくプレースホルダです。自分の Harbor のアドレスを差し込んでください
# (hr-legacy.yaml を参照。そこには全ファイルを一度に置換する sed コマンドもあります)。
#
# このファイルには `---` で区切られた2つのオブジェクトがあります: Deployment (アプリケーションのコピー) と
# Service (それらのための安定した名前)。apiVersion、kind、metadata.name は以降ではコメントしません。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # 1つではなく2つのコピー。後でキャッシュの重要な性質が見えるようにするためです: キャッシュは共有されます。
  # あるポッドが応答を Redis に入れ、別のポッドがそこから取り出す。後者は自分では一度も台帳に行っていないのに、です。
  replicas: 2
  # このラベルで Deployment は自分のポッドを他と区別します。下の template のラベルと
  # 一致していなければなりません。さもないとオブジェクトは自分で作ったものを見つけられません。
  selector:
    matchLabels:
      app: passes-api
  # template はポッドのテンプレート: 各コピーを何から組み立てるか。
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # ポッドレベルのセキュリティ要件: root ではなく、限定されたシステムコールのセット。
      # ポリシーが有効なクラスタでは、これらのフィールドがないポッドは受け入れられません。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # イメージを取得するとき、クラスタが閉じた Harbor に何を提示するか。このシークレットへの参照が
      # なければ、ポッドは ImagePullBackOff で止まってしまいます。
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # コンテナの権限は最小限に切り詰められています: 昇格は不可、カーネル特権もなし。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 台帳と同じイメージ。両者を分けているのは下の MODE だけです。
          image: HARBOR-HOST/passes/passes-api:v2
          # ポート名が必要なのは、プローブと Service が数値ではなく名前を参照できるようにするためです。
          ports:
            - containerPort: 8080
              name: http
          # アプリケーションの挙動はすべてここで設定されます。注意: REDIS_ADDR と REDIS_PASSWORD の
          # 変数はリストにありません。まさにそれが理由でキャッシュはオフになっており、
          # 各リクエストは正直に遅い台帳へ行きます。
          env:
            # MODE=api — このインスタンスは「パス」サービスそのものとして動作します。
            - name: MODE
              value: "api"
            # バージョンとレジストリはアプリケーションの動作には不要です — それらは「/」への応答に表示され、
            # まさに今あなたがビルドしたものが動いていることを確認できます。
            - name: APP_VERSION
              value: "v2"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # データを取りに行く先。アドレスではなくサービス名: 台帳のコピーは
            # 何度でも再作成される可能性がありますが、名前は変わりません。
            - name: HR_URL
              value: "http://hr-legacy.default.svc.cluster.local"
            # 誰がどこでリクエストを実行するか。クラスタがこの3つの値を自分で埋めます:
            # 事前には誰も知りません。これらはサービスの応答に入り、それによって
            # どのコピーがどのノードで応答したかが見えます — 計測のときに役立ちます。
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests はノードを選ぶときに予約されるもの、limits は上限です。ここでの1コアの上限は
          # 欲張りではありません: 負荷がかかるとアプリケーションはノード全体を食い尽くすのではなく上限に当たり、
          # 計測は CPU の奪い合いではなく台帳のレイテンシを示します。
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # /healthz が応答するまで、Service はこのコピーに1つもリクエストを送りません。
          # 更新のときにも、この同じフィールドが障害からあなたを守ります: 古いコピーは、
          # 新しいコピーが準備完了を報告するまで取り除かれません。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — 両方のコピーに対する1つの安定した名前と、それらの間でのリクエストの分配。
# ポッドは再作成され IP が変わりますが、passes-api という名前は残ります。この名前で
# Fortio も検証スクリプトもサービスにアクセスします。
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # Service が生きているコピーのリストを集めるためのラベル。ポッドのラベルと一致しなければ、
  # Service は存在はしても、どこにもつながりません。
  selector:
    app: passes-api
  ports:
    # 外部からは 80 にアクセスし、ポッド内部では http という名前のポート (8080) へ行きます。
    - port: 80
      targetPort: http
