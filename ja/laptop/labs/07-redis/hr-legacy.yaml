---
# ラボ 7 · レガシーな従業員ディレクトリのスタブ。
# 現実にはこれは他人のシステムで、書き換えを任されることはありません。応答に 800 ミリ秒かかり、
# それと何とか付き合っていくしかありません。ここでは、測定できるように同じ挙動を持つスタブを用意します。
#
# 適用先: あなたの `lab` クラスタ (export KUBECONFIG=~/lab.kubeconfig)、Cozystack の
# 管理クラスタではありません。コマンド: kubectl apply -f hr-legacy.yaml
#
# HARBOR-HOST はアドレスではなくプレースホルダです。自分の Harbor のアドレスに置き換えてください。さもないとクラスタは
# 存在しないホストからイメージを取得しようとします:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # macOS
#
# このファイルには `---` 行で区切られた 2 つのオブジェクトがあります: Deployment (何が、いくつの
# コピーで動くか) と Service (それらのコピーに到達するための恒久的な名前)。各オブジェクトの
# apiVersion と kind はそれがどんな種類のオブジェクトかを示し、metadata.name はその名前です。
# これより下では、この 3 つのフィールドにはコメントを付けません。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-legacy
  labels:
    app: hr-legacy
spec:
  # いくつのコピーを起動したままにするか。コピーが消えると、クラスタは尋ねることなく
  # 新しいものを作ります。ディレクトリには 1 つで十分です。ここにあるのは負荷のためではなく、測定のためです。
  replicas: 1
  # このラベルによって、Deployment はクラスタ内の他のすべての中から自分のポッドを見分けます。
  # selector 内のラベルと下の template 内のラベルは一致していなければならず、さもないとオブジェクトは
  # 自分自身が作ったものを見つけられません。
  selector:
    matchLabels:
      app: hr-legacy
  # template はポッドのテンプレートです。以下のすべてが 1 つのコピーを記述します: 何から組み立てるか、
  # どんな権限で起動するか、そしてリクエストを受け付ける準備ができたことをどう判断するか。
  template:
    metadata:
      labels:
        app: hr-legacy
    spec:
      # ポッドレベルのセキュリティ要件。プロセスは root ではなく (uid 10001) 動作し、
      # seccomp プロファイルはアプリケーションが必要としないシステムコールを遮断します。
      # ポリシーが有効なクラスタでは、これらのフィールドがないポッドはそもそも起動しません。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Harbor はログインとパスワードで閉じられており、クラスタは何かで自分を名乗る必要があります。
      # `harbor` シークレットはレジストリのラボで用意したものです。この参照がないとイメージは取得されず、
      # ポッドは ImagePullBackOff の状態のままになります。
      imagePullSecrets:
        - name: harbor
      containers:
        - name: hr
          # ポッドレベルと同じですが、特定のコンテナに対するものです: 権限昇格を禁止し、
          # すべてのカーネル権限を剥奪します。Go アプリケーションには
          # そのどれも必要ありません。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # イメージはディレクトリと「ゲストパス」サービス本体で同じものです。
          # どのプロセスが実際に起動するかは、下の MODE 変数が決めます。
          image: HARBOR-HOST/passes/passes-api:v2
          # ポートには番号だけでなく名前があります: レディネスプローブと下の Service は
          # 名前を参照します。番号が変わっても、修正するのは 1 か所だけで済みます。
          ports:
            - containerPort: 8080
              name: http
          # 環境変数はこのアプリケーションを設定する唯一の方法です。
          # 挙動を変えるためにイメージを再ビルドする必要はありません。
          env:
            # MODE=hr — このインスタンスは人事システムのふりをします: 待ってから応答します。
            - name: MODE
              value: "hr"
            # 本物のディレクトリが示すのとまったく同じ遅延です。
            # これを変えると「どれだけ悪い状況か」が変わります — あとで 2s を試してみてください。
            - name: HR_DELAY
              value: "800ms"
            # ポッドは自分の名前を事前には知りません — クラスタが作成時に割り当てます。
            # fieldRef が起動時にこの名前を変数へ差し込み、それが
            # サービスの応答に含まれます: どのコピーが応答したかが分かります。
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # requests — ノードを選ぶ際にコンテナのために予約されるリソース量、
          # limits — それを超えることが許されない上限。vSphere の reservation と
          # limit に似ていますが、仮想マシンごとではなくコンテナごとに設定します。
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # レディネスプローブ。/healthz が応答するまで、Service はこのコピーに
          # 1 つのリクエストも送りません。プローブがないと、トラフィックはまだ起動していないプロセスに向かい、
          # 何もないところでエラーが見えます — 「すべてがロールアウトされた」にもかかわらず。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — 一連のポッドのための恒久的な名前と恒久的なアドレス。ポッドは再作成され、
# そのたびに新しい IP を受け取りますが、hr-legacy という名前は同じままです。ロードバランサの
# VIP に似ていますが、4 行で用意でき、クラスタ内部で生きています。
apiVersion: v1
kind: Service
metadata:
  name: hr-legacy
spec:
  # このラベルによって、Service は生きているコピーのリストを集めます。上のポッドと同じラベルです:
  # 一致しなければ、Service は存在してもどこにもつながりません。
  selector:
    app: hr-legacy
  ports:
    # リクエストは 80 番ポートで受け付け、ポッド内部では http という名前のポート (8080) に送られます。
    - port: 80
      targetPort: http
