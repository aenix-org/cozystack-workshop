---
# ラボ7 · このパッチは意図的に不完全です。「キャッシュを一応オンにしたのに、
# 全然速くならない」状態がどう見えるかを体験してもらうためのものです。動作する版は cache-patch.yaml にあります。
#
# あなたの `lab` クラスタに適用します（export KUBECONFIG=~/lab.kubeconfig）:
#   kubectl patch deployment passes-api --patch-file cache-patch-broken.yaml
#
# 答えを覗く必要はありません。適用して、リクエストを何回か送り、アプリケーションの
# ログを見てください: kubectl logs -l app=passes-api。アプリケーションが何が問題かを教えてくれます。
# 大事なのは、そのメッセージを読んで、このファイルに何が足りないのかを見抜くことです。
#
# REDIS-ADDR の代わりに自分の Redis のアドレスを入れてください（アドレスを探す手順を参照）。
# プレースホルダーを残してはいけません。そうすると、この演習で狙っているものとは別のエラーになってしまいます。
spec:
  template:
    spec:
      containers:
        # コンテナ名は、クラスタが修正すべき場所を見つけるためのアドレスです。
        - name: api
          env:
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
