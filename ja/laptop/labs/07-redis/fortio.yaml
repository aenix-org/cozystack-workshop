---
# ラボ7 · Web UI 付きの負荷生成ツール。
# スケーリングのラボで使ったものと同じ。負荷はブラウザのボタンで開始し、
# 遅延ヒストグラムはその場で確認できる。すでにデプロイ済みなら、この
# ファイルを適用する必要はなく、kubectl は「unchanged」と返す。
#
# 適用先: あなたの `lab` クラスタ（export KUBECONFIG=~/lab.kubeconfig）。
# コマンド: kubectl apply -f fortio.yaml
#
# `---` で区切られた2つのオブジェクト: Deployment（生成ツール本体）と Service（それに
# 到達するための名前）。apiVersion、kind、metadata.name は以降コメントしない。
#
# イメージはあなたの Harbor ではなく公開 Docker Hub から取得される: Fortio は「ゲストパス」
# サービスの一部ではなく、クラスタに一時的に住む計測器だからだ。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # 1コピーだけ。負荷生成ツールはスケールする必要がない — 1つが遅延を正直に
  # 数えてくれることが必要だ。2コピーあれば、まとまらない2つのヒストグラムになる。
  replicas: 1
  # Deployment が自分の Pod を認識するためのラベル。下の template のラベルと一致する。
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # 他のすべてと同じセキュリティ要件: プロセスは root では動かず、
      # システムコールは seccomp プロファイルで制限される。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # ここでの `latest` タグはワークショップ向けの簡略化であり、自前のレジストリを
          # 扱うラボが教えることと矛盾する: このタグのイメージは2回の apply の間に気づかぬうちに
          # 入れ替わることがあり、昨日の計測は再現不能になる。学習用スタンドの負荷生成ツール
          # なら許容できるが、本番システムでは許容できない。
          image: fortio/fortio:latest
          # `server` は Fortio が Web インターフェイスを立ち上げ、あなたがボタンを押すのを
          # 待つモード。この引数がないと、イメージは1回限りのコマンドを実行して終了する。
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # 生成ツールには CPU の余裕が必要だ。さもないと自分自身が
              # ボトルネックになり、アプリではなく Fortio に負荷をかけることになる。
              cpu: "1"
              memory: 256Mi
---
# Web インターフェイスを開くには Service が必要だ: 生成ツールには名前を通じてポート
# フォワーディングで到達する — kubectl port-forward svc/fortio 8081:8080 — そして
# localhost:8081 にアクセスする。Service なしでも kubectl exec deploy/fortio で
# サービスを叩けるが、ブラウザでヒストグラムを見られるのはこの経路だけだ。
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  # ここでは Service の番号とコンテナのポートが一致している — 外側が80、内側が8080
  # というラボの他のサービスとは異なる。違いは利便性だけだ。
  ports:
    - port: 8080
      targetPort: http
