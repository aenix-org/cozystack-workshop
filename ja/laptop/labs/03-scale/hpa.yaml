---
# ラボ3。CPU負荷に応じてレプリカを増やす。
# 目標は requests.cpu（20m）の50%、つまりしきい値はPodあたり10m。
# あえて低く設定している：負荷は数秒で発動しなければならない、
# ラボに使えるのは半日ではなく30分だ。
#
# オブジェクトは1つ。テナントではなく、あなたの学習用クラスタ `lab` に適用する
# （管理クラスタ上のテナントではない）：
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f hpa.yaml
# ここには tenant-workshopXX のようなプレースホルダはない — 自分の番号をどこかに差し込む必要はない。
#
# オブジェクトは作成されるが動作しない、という2つの条件：
#   1. rickroll コンテナに requests.cpu が設定されていること — さもないとパーセンテージを計算する対象がなく、
#      `kubectl get hpa` の TARGETS 列には永遠に <unknown> が表示される。
#   2. クラスタで metrics-server が動いていること — Podの現在の消費量のソースだ。
# どちらの条件も、このフォルダの check.sh が確認する。
#
# HPAが存在する限り、Deployment の replicas フィールドはHPAのものだ。`kubectl scale` で手動で
# コピー数を変えることはできるが、HPAは数秒のうちに自分の値へ戻す。
# だからラボ4ではロールアウト前にこのオブジェクトを削除する：1つのフィールドに2つの仕組み —
# 何が起きたのか理解できなくなる確実な方法だ。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # HPAの名前はアプリケーション名と一致する必要はない — ここで一致させているのは便宜のためだ。
  # 何を管理するかは、この名前ではなく下の scaleTargetRef が決める。
  name: rickroll
spec:
  # 誰を監視し、誰の replicas フィールドを変えるか。3つのフィールドをまとめて指定するのは、型のない
  # 名前だけでは曖昧だからだ：Deployment と StatefulSet が同じ名前を持ちうる。
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rickroll
  # どんな負荷でもHPAが越えない範囲。下限はラボが始まったときと同じ
  # 1コピー。上限は6：limits.cpu 300m で学習用ノードに収まる数であり、
  # かつPod一覧でひと目で分かる程度の数だ。
  # maxReplicas: 1 にすると、オブジェクトは作成されるが何もしない。
  minReplicas: 1
  maxReplicas: 6
  # 何を基準に判断するか。メトリクスは複数あってもよく、その場合HPAはより多くの
  # コピーを必要とするものを採用する。ここでは1つだけ — CPUだ。
  metrics:
    - type: Resource
      resource:
        name: cpu
        # Utilization — ノードの容量ではなく、コンテナの requests.cpu に対する割合だ。
        # ここから直感に反する帰結が生まれる：値が平然と600%になることがあり、これは
        # エラーではない：Podは予約した6倍を消費している。
        # 代替は AverageValue で、そこではしきい値をミリコアで直接指定する。
        target:
          type: Utilization
          averageUtilization: 50
  # どれだけ機敏に反応するか。このブロックは任意：なければデフォルト値が使われ、
  # それはデモではなく本番運用向けに設計されている。
  behavior:
    scaleUp:
      # デフォルトでは Kubernetes は安定化を待ち、ゆっくり増える。
      # ラボではこれが「何も起きていない」ように見えるので、加速させる。
      stabilizationWindowSeconds: 0
      # 15秒ごとに新しいコピーは2つまで。このステップは経験的に選んだ：
      # 増加が増加として見え、1から一気に6への瞬間的なジャンプにはならない、
      # そうなると参加者には観察するものが何もない。
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      # だが下げるときは逆に — 瞬間的ではない、さもないと参加者が観察しきる前に
      # Podが消えてしまう。
      # デフォルトの5分ではなく1分：ラボは30分で進む、縮小を5分も待っても
      # その時間を埋めるものがない。本番クラスタでは長い窓がむしろ役に立つ —
      # 不均一な負荷でのシーソーを鎮めてくれる。
      stabilizationWindowSeconds: 60
