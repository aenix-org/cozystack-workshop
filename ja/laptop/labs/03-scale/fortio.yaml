# ラボ3。Fortio 負荷生成ツール: 生成ツール本体と、そのウェブインターフェースへの
# 安定したアドレス。`---` で区切られた 2 つのオブジェクト。
#
# 管理クラスタ上のテナントではなく、あなたの学習用クラスタ `lab` に適用します:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f fortio.yaml
# ここには tenant-workshopXX のようなプレースホルダはありません — 自分の番号をどこかに差し込む必要はありません。
# この同じファイルはラボ4でも必要になります: `kubectl apply -f ../03-scale/fortio.yaml`。
#
# マニフェスト共通のフィールド (apiVersion, kind, metadata.name, selector, template,
# securityContext) は ../01-deploy/rickroll.yaml で一行ずつ解説しており、ここでは
# 繰り返しません。負荷生成ツールに固有の部分だけをコメントします。
---
# ウェブインターフェース付きの負荷生成ツール。
# hey/ab ではなくこれを意図的に選びました: 負荷はブラウザのボタンで起動し、
# 遅延ヒストグラムもその場で見られます。過去のワークショップでは、まさに
# コンソールツールのところで参加者を取りこぼしてきました。
#
# Fortio は通常のアプリケーションとしてクラスタ内に存在し、内側から rickroll のアドレスを叩きます。
# ノートパソコンから外側で負荷をかけるほうがトラフィックの点では公平ですが、クラスタまでの
# 回線に引っかかってしまい、アプリケーションではなく自分の Wi-Fi を測ることになります。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # 生成ツールは 1 コピーで十分です: それ自体が多数のスレッドで負荷をかけます。
  # ここで 2 コピー目を置いても、絵をぼかすだけです — ウェブインターフェースの
  # カウンタはコピーごとに別々で、リクエストの半分しか見えなくなります。
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # rickroll と同じセキュリティプロファイル: root ではなく特定の UID で動作し、
      # 標準の seccomp を使います。意図的に残しています — `restricted` プロファイルが
      # 有効なクラスタでも適用できるようにするためで、そうでないと Pod が起動しません。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # latest タグはワークショップ向けの意図的な簡略化で、バージョンを突き合わせないためです。
          # 本番クラスタではこうしません: このタグの下のイメージは 2 回の apply の間に
          # 気付かないうちに変わることがあり、昨日の結果を再現できなくなります。
          image: fortio/fortio:latest
          # `server` モードはウェブインターフェースを立ち上げて動かし続けます。この引数がないと
          # Fortio はコマンドラインから 1 回だけ実行して終了し、クラスタはコンテナを
          # ループで再起動し続けます。
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            # リクエスト値は rickroll 自身 (20m) より高くしています: 生成ツールにはあらかじめ
            # ノード上の場所が必要で、そうしないとスケジューラがぎりぎりに詰め込み、立ち上がりがムラになります。
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # 生成ツールには CPU の余裕が必要です。さもないと自分自身の上限に
              # ぶつかり、アプリケーションではなく Fortio に負荷をかけることになります。
              cpu: "1"
              memory: 256Mi
---
# クラスタ内での生成ツールの安定したアドレス。`kubectl port-forward svc/fortio 8081:8080`
# 経由でノートパソコンからウェブインターフェースを開くために必要です — 外側に向けてクラスタは
# 何も公開しておらず、Fortio への他の扉はありません。
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  ports:
    # 両側とも 8080: サービスもコンテナも。番号は Pod 内の rickroll と同じですが、
    # 衝突はありません — 各 Pod は独自のネットワークスタックを持ちます。
    - port: 8080
      targetPort: http
