# ラボ1。rickroll 学習アプリ全体を1ファイルにまとめたもの: nginx の設定、ページ、
# 発行 (Deployment) 本体、そしてそこへの恒久アドレス。4 つのオブジェクトを `---` で区切っている。
#
# 適用先は管理クラスタ上のテナントではなく、あなたの学習クラスタ `lab`:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll.yaml
# tenant-workshopXX のようなプレースホルダはここにはない — 自分の番号をどこにも差し込む必要はない。
#
# 4 つのオブジェクトすべてに共通で繰り返し現れるフィールドは、ここで一度だけ解説する:
#   apiVersion — このオブジェクト型が属する API のセクション;
#   kind       — オブジェクト型そのもの;
#   metadata.name — 後で `kubectl get` で objects を探すときの名前。
# 名前は同じ型の中で一意なので、下の Deployment と Service はどちらも
# rickroll という名前だが衝突しない。
---
# nginx の設定。ページのバージョン間で変わらないので、別に切り出してある。
# ConfigMap — クラスタ内に単体で存在し、起動時にコンテナの中へ差し込まれる設定ファイル。
# 目的は、イメージを再ビルドせずに設定を変えられるようにすること。
# `default.conf` キーが、ボリュームをマウントしたディレクトリ内のファイル名になる。
#
# `|` の後のインデントより下はすべて YAML ではなく、ファイルの内容そのままだ。このブロック内で
# ハッシュ (#) の付いた行は、解析時に消えるのではなく、そのまま nginx の設定に入る。
# 同じ理由で、下のページのブロックにはコメントを付けていない:
# あそこは HTML で、ハッシュがあると画面上でユーザーに見えてしまうからだ。
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-conf
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      location / {
        # このラボの肝: nginx が自分の pod 名を HTML に直接差し込む。
        # pod 内の $hostname は、まさにその pod 名だ。
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
---
# ページ、バージョン1。設定とは別オブジェクトにしてある — ラボ4で nginx の設定に触れず、
# イメージを再ビルドせずに、アプリを第2バージョンへ切り替えられるようにするため。
# 名前の -v1 サフィックスは飾りではない: 隣に rickroll-page-v2 が現れ、両者の間で
# ボリュームを切り替えることが、まさに新バージョンのロールアウトになる。
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v1
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Never Gonna Give You Up</title>
    <style>
      body{background:#0d0d12;color:#e8e8ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#ff0057,#ffb800,#00e0ff,#ff0057);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#9aa0b5;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#6f7690}
      .pod b{display:block;margin-top:.4em;color:#00e0ff;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#4d5366;font-size:14px}
    </style>
    <h1>Never Gonna Give You Up</h1>
    <p class="lyr">Never gonna let you down &middot; Never gonna run around and desert you</p>
    <div class="pod">вас обслужил под<b>__POD__</b></div>
    <p class="hint">Обновите страницу. Когда реплик станет больше — имя начнёт меняться.</p>
    </html>
---
# アプリ本体。Deployment は望ましい状態を記述する — どのイメージを起動するか、
# コピーを何個保つか、更新時にどう置き換えるか。そこから先はクラスタ自身が現実を
# この記述に合わせ、作成時に一度だけでなく、継続的に監視し続ける。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rickroll
  labels:
    app: rickroll
spec:
  # 何個のコピーを起動したまま保つか。表現はまさにこうだ:「1個起動せよ」ではなく
  #「1個保て」。コピーが消えれば、クラスタは尋ねずに新しいものを作る。ラボ3では
  # この同じフィールドをオートスケーリングが変え始めるので、手で触ることはもうなくなる。
  replicas: 1
  # Deployment がどのラベルで pod を自分のものと見なすか。ここのラベルと下の template の
  # ラベルは必ず一致していなければならない: 食い違うとオブジェクトはまったく作成されない。
  selector:
    matchLabels:
      app: rickroll
  # pod のテンプレート — 各コピーはこれから型抜きされる。template 内のどのフィールドを編集しても
  # アプリの新しいリビジョンになり、コピーが順番に置き換えられる(これがまさにラボ4)。
  # template の外のフィールド(たとえば replicas)を編集してもリビジョンは作られない。
  template:
    metadata:
      labels:
        # 同じラベルは pod 自身にも付く: ファイル末尾の Service はこれで pod を見つける。
        app: rickroll
    spec:
      # pod 全体レベルでのセキュリティプロファイル `restricted` の要件: root ではなく動作すること、
      # 特定の UID、そして標準の seccomp プロファイル。`restricted` を有効にした企業クラスタでは、
      # これらのフィールドがない pod は起動を許可されず、しかも拒否はマニフェストの apply 時ではなく
      # pod の作成時にやってくる。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # 同じ厳しさだが、コンテナレベルで: 内部のプロセスは自分の権限を昇格することを禁じられ、
          # linux のすべての capability を取り上げられている。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 非特権版: 8080 を待ち受け、root ではなく動作する。
          # これだけで `baseline` プロファイルには十分だが、`restricted` には足りない — あちらは
          # pod とコンテナに明示的な securityContext が必要で、それは上で設定してある。
          # 企業クラスタでは通常、まさにこの `restricted` が有効になっている。
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # デフォルトで nginx はノードのコアあたり1つのワーカープロセスを立ち上げる。1コアの学習
          # マシンなら1プロセスだが、64コアの本番ノードでは64になり、メモリ制限の小さい pod は
          # 最初のリクエストが来る前に OOMKilled で落ちる。
          # オートチューンは CPU 制限からワーカー数を数える: 300m なら1プロセスだ。
          # -g ではなく環境変数経由で: このディレクティブはイメージのベース設定に既にあり、
          # 二重宣言すると nginx が「duplicate」エラーで落ちる。
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # ポートには番号だけでなく名前を与えている: 下の readinessProbe と Service の targetPort が
          # `http` を参照する。番号が変わっても、修正は1箇所で済む。
          ports:
            - containerPort: 8080
              name: http
          # 常に混同される2つの別物。requests — リソースをどれだけ保証して予約するか;
          # スケジューラはこれでノードを選び、ラボ3のオートスケーリングもこれを基準に
          # 負荷をパーセントで計算する。
          # limits — それ以上には上がることを許されない上限: CPU では上限にぶつかると絞られ、
          # メモリではコンテナが kill される。
          resources:
            # 意図的にごく小さく: ワークショップではこうしたアプリが大量に立つ。
            # 20m はコアの100分の2だ。値を低くしたのは意図的で、requests が小さいほど
            # 負荷が速くしきい値を超え、ラボ3でのコピーの増加が30分ではなく数秒で見える。
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          # 準備完了チェック。このアドレスに応答が来るまで、クラスタはコピーへトラフィックを
          # 流さない。そのために nginx の設定には「ok」を返す別の location /healthz が用意されている。
          # このフィールドがラボ4の無停止ロールアウトの対価だ: 新しいコピーが応答してから
          # 初めて古いコピーを落とす。
          # これを外せば、更新はリクエストを取りこぼし始める。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            # 最初のノックまで2秒 — 経験から選んだ値だ。これより少なくても意味はなく、
            # nginx の起動にそれだけかかる; 多くすれば各ロールアウトを無駄に引き延ばすだけだ。
            initialDelaySeconds: 2
          # ConfigMap の内容をコンテナ内のどこに差し込むか。ディレクトリは適当に選んだのではない:
          # 1つ目から nginx はファイルを配信し、2つ目から設定を読む。
          # この2行がなければ、どちらの ConfigMap もクラスタに置かれたままになり、
          # nginx は自分の標準ページを表示してしまう。
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
      # どの ConfigMap を pod に接続するか。ここのボリューム名が、上の volumeMounts の
      # エントリと結びつける — 一致すべきはまさに名前で、結びつけには順序は関係ない。
      # だがラボ4では順序が効いてくる。下の警告を参照。
      volumes:
        # 注意: このボリュームは先頭 (volumes[0]) でなければならない。
        # ラボ4はインデックス指定のパッチでページのバージョンを切り替える。
        # JSON Patch はリストの要素を名前ではなく番号で指す。ボリュームを入れ替えると —
        # パッチは黙ってページの代わりに nginx の設定を差し替え、アプリは壊れ、
        # エラーメッセージはまったく別のことについて語ることになる。
        - name: page
          configMap:
            name: rickroll-page-v1
        - name: conf
          configMap:
            name: rickroll-conf
---
# アプリの恒久アドレス。コピーは生まれては死に、そのアドレスは変わるが、クラスタ内の
# `rickroll` という名前はそのまま残る — 隣人たちはこの名前でアプリを呼ぶ。
# この名前の背後にある生きたコピーの一覧は、クラスタ自身がラベルによって管理する。
apiVersion: v1
kind: Service
metadata:
  name: rickroll
spec:
  # このアドレスの背後に誰を置くか: そのラベルを持つすべての pod を、誰が作ったものであれ。
  # ここから典型的な厄介事が生じる — app: rickroll のラベルを持つ無関係な pod が
  # 黙って負荷分散に入り込み、あなたのユーザーに応答し始める。このフォルダの check.sh
  # スクリプトが、そうした偽者がいないことを別途チェックする。
  selector:
    app: rickroll
  ports:
    # port — サービス自身がどのポートで応答するか、targetPort — pod の内側のどこへノックするか。
    # ここでは targetPort を数字ではなくコンテナのポート名で指定している: コンテナ内の
    # 番号が変わっても、このファイルを修正する必要はない。
    - port: 80
      targetPort: http
