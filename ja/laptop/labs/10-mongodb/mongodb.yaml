# ラボ 10 · さまざまな種類の通行証を格納する MongoDB データベースを注文する。
# 何を得たいかの記述。サービスの組み立てと設定はプラットフォームが行う。
# ダッシュボードでマウスを使って注文するのと同じもの — ただしテキストで。
# 適用先はラボ用クラスターではなく、管理クラスター上のテナント:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f mongodb.yaml
#
# 適用する前に: tenant-workshopXX を自分の namespace に、
# ЗдесьВашПароль を自分で考えたパスワードに置き換えてください。
apiVersion: apps.cozystack.io/v1alpha1
kind: MongoDB
metadata:
  name: passes
  namespace: tenant-workshopXX
spec:
  # コピーは 1 つ。MongoDB は 3 つのレプリカセットを想定して設計されている:
  # それらはどれがプライマリかを投票で決め、1 つの喪失に耐える。コピーが 1 つだと
  # 一緒に投票する相手がいないため、チャートはそのための別の「安全でない」モードを有効にする。
  # ラボには十分だが、本番には向かない。
  replicas: 1
  # データ用のディスク。4 つの学習用ドキュメントには 1 メガバイトで足りるが、
  # ボリュームは後で拡張するより最初から余裕をもって確保するほうが楽。
  size: 5Gi
  # replicated — クラスターの別ノードにコピーを持つボリューム: ノードが脱落しても
  # データは残る。
  storageClass: replicated
  # データベースの pod に割り当てる CPU とメモリ。4 つのドキュメントには十分すぎる。
  resourcesPreset: s1.small
  # MongoDB のブランチ。稼働中のデータベースで後から変更するにはアップグレードが必要。
  version: v8
  # false — データベースはクラスター内部からのみアクセス可能で、外部にポートは公開されない。
  # アクセスは、隣で起動される作業用 pod から行う。
  external: false
  # シャーディングはデータを複数のサーバーセットに分割する。データが 1 台のサーバーに
  # 収まらない場合に必要; 4 つの通行証は収まる。
  sharding: false
  # データベースのユーザーとそのパスワード。自分でパスワードを考えて覚えておくこと:
  # それは作業用 pod(接続文字列 MONGO_URI の中)とチェックスクリプト
  # (変数 MONGO_PASSWORD)で必要になる。アカウントはサービス用データベース admin に作成される —
  # そのため接続文字列では authSource=admin が必須。
  users:
    passapp:
      password: ЗдесьВашПароль
  # passes データベースとその中の権限: passapp ユーザーにはこのデータベースの admin ロールが付与され、
  # つまり読み取り、書き込み、インデックス作成、コレクション設定の変更ができる。
  # これは他のデータベースへの権限は与えない。
  databases:
    passes:
      roles:
        admin:
          - passapp
  # オブジェクトストレージへのバックアップ。学習用スタンドでは無効。
  backup:
    enabled: false
