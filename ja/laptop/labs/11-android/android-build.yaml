---
# ラボ 11。ビルドそのもの: ConfigMap に置いたスクリプトと、それを実行する Job。
# 1 つのファイルに 2 つのオブジェクトを `---` の行で区切って記述する。
#
# 管理クラスタ上のテナントではなく、あなたの学習用クラスタ `lab` に適用する:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f android-build.yaml
# ここには tenant-workshopXX のようなプレースホルダはない — 自分の番号をどこかに差し込む必要はない。
#
# 適用する前に、2 つのオブジェクトがクラスタ内に既に存在していなければならない。さもないとビルド用 Pod は起動しない:
# クラスタは存在しないものをマウントできず、Pod は待ち続ける。
#     configmap/propusk-src   ソース: kubectl apply -f propusk-src.yaml
#     secret/bucket-creds     バケットへのアクセスキー 4 つ、手で入力する
#
# Deployment ではなく Job にする: ビルドには終わりがある。Deployment は終了したプロセスを
# 失敗とみなして新しいコピーを立ち上げる — ビルドが延々とループして止まらなくなる。
#
# なぜビルドスクリプトを Job の command フィールドに書いた文字列ではなく別オブジェクトとして置くのか:
#   - YAML フィールドの中の 60 行の shell は読むことも検査することもできない。ここでは
#     エディタがハイライトし、`bash -n` を通せる普通のファイルになっている;
#   - 1 つのコマンドで全体を見られる: kubectl get configmap android-build-script -o yaml;
#   - タスクの定義に触れずにビルドを直せるし、その逆もできる。
# 便利さの代償: スクリプトは Job とは別に存在する。ConfigMap を変更しても、既に走っている
# ビルドはそれに気づかない。新しいテキストを見るのは次の実行だけ。
apiVersion: v1
kind: ConfigMap
metadata:
  name: android-build-script
data:
  # ビルドの 5 ステップ — ビルドサーバ上で手で打ち込むのとまったく同じコマンド。
  # コンテナはほぼ空の状態で起動する: Java と Gradle はイメージから来て、残りはスクリプトが
  # 自分で持ち込む。
  #   1/5  command-line tools を取得する — Android SDK 自体をインストールするためのユーティリティ(1〜2 分)
  #   2/5  ライセンスを承認して SDK、platform 34、build-tools をインストールする。最も長いステップで
  #        5〜15 分、その間ずっとログは静かだ: sdkmanager は非対話モードでは進捗を出力しない。
  #        ここでの静けさはハングではない
  #   3/5  gradle :app:assembleDebug — /src のソースを APK にコンパイルする(3〜8 分)
  #   4/5  mc、オブジェクトストレージ用のコンソールクライアントをインストールする
  #   5/5  APK をバケットに 2 つの名前で置く: 日付入りのものと propusk-latest(数秒)
  #
  # どのビルドも同じくらい時間がかかる: キャッシュはなく、/work ディスクは使い捨て(ファイル末尾の
  # emptyDir を参照)。実際のビルドサーバなら代わりに永続ボリュームがあり、2 回目の
  # ビルドは数分で終わる。
  #
  # 以下は build.sh ファイルの逐語的な内容であって YAML ではない。その中のハッシュ記号の行は
  # そのままスクリプトに入る: これらは shell のコメントであり、消す必要はない。
  build.sh: |
    #!/usr/bin/env bash
    # ここでは set -e が適切だ: これは検査ではなくビルドだ。ステップが失敗したら —
    # 続ける意味はなく、Job はエラーで終了してログとともに
    # クラスタに残るべきだ。
    set -euo pipefail

    WORK=/work
    export HOME="$WORK"
    export ANDROID_SDK_ROOT="$WORK/android-sdk"
    export ANDROID_HOME="$ANDROID_SDK_ROOT"
    export GRADLE_USER_HOME="$WORK/gradle-home"
    # 使い捨てコンテナに Gradle デーモンは要らない: それは次の
    # ビルドのために生きるものだが、このコンテナに次のビルドはない。
    # -Duser.home は必須で、上の export HOME の重複ではない。Java はホーム
    # ディレクトリを環境変数からではなくシステムのユーザレコードから取得するが、
    # 非特権 uid にはそれがない — Gradle は "?" を代入して APK のパッケージングで
    # 失敗する: 署名鍵を /work/project/app/?/.android/ のようなパスに探すからだ。
    export GRADLE_OPTS="-Xmx3g -Dorg.gradle.daemon=false -Duser.home=$WORK"

    CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
    MC_URL="https://dl.min.io/client/mc/release/linux-amd64/mc"

    echo "== 1/5 Android command-line tools をインストール中 =="
    mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    cd "$ANDROID_SDK_ROOT/cmdline-tools"
    curl -fsSL -o tools.zip "$CMDLINE_TOOLS_URL"
    # unzip はどのベースイメージにもあるわけではないが、JDK の jar は zip を展開できる。
    unzip -q tools.zip 2>/dev/null || jar xf tools.zip
    rm -f tools.zip
    mv cmdline-tools latest
    export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

    echo "== 2/5 ライセンスに同意して SDK をダウンロード中（最も時間のかかるステップ） =="
    # `yes` は sdkmanager が入力を閉じると SIGPIPE を受け取り、非ゼロの
    # コードを返す。set -o pipefail があると、これがわけもなくビルドを落としかねないので、
    # ここでは戻り値を意図的に握りつぶしている。ライセンスが実際に
    # 承認されていなければ — 次のコマンドがそれを伝えてくれる。
    yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
    sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
      "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    echo "== 3/5 APK をビルド中 =="
    # ConfigMap は読み取り専用でマウントされ、Gradle はソースの隣に書き込むので、
    # ツリーをまずディスクにコピーする。
    # -L はシンボリックリンクを解決する: ConfigMap はファイルとしてではなく、
    # 内部の ..data ディレクトリへのリンクとしてマウントされ、-L がないとリンクがプロジェクトに入り込む。
    # /src/. の代わりにグロブを使うのは、この内部ディレクトリ自体がコピーされないようにするため。
    mkdir -p "$WORK/project"
    cp -rL /src/* "$WORK/project/"
    cd "$WORK/project"
    gradle --no-daemon :app:assembleDebug

    APK="$WORK/project/app/build/outputs/apk/debug/app-debug.apk"
    ls -l "$APK"

    echo "== 4/5 S3 クライアントをインストール中 =="
    # クライアントは /usr/local/bin ではなく作業ディレクトリに置く。Pod は
    # 非特権ユーザで動き、イメージのシステムディレクトリは root のもの:
    # そこへの書き込みは Permission denied で終わる — しかもここ、4 番目のステップで、
    # つまり 30 分ビルドした後で。/work ディレクトリは我々のもので、書き込める。
    mkdir -p "$WORK/bin"
    curl -fsSL -o "$WORK/bin/mc" "$MC_URL"
    chmod +x "$WORK/bin/mc"
    # PATH はシェルがコマンドを探すディレクトリのリスト。自分のものを追記して、この先
    # フルパスではなく単に `mc` と書けるようにする。
    export PATH="$WORK/bin:$PATH"

    echo "== 5/5 APK をバケットにアップロード中 =="
    # accessKey/secretKey/endpoint/bucketName の変数は envFrom 経由で Secret から
    # 来る。alias set の出力は握りつぶす: ログに何かを出力する必要はない。
    # 同じ理由でスクリプトに set -x はない — それはキーを出力してしまう。
    # エイリアスは lab ではなく builds と名付ける: `lab` という語はすべてのラボで学習用
    # クラスタを指すので、この 2 つを混同してはいけない。
    mc alias set builds "https://${endpoint}" "${accessKey}" "${secretKey}" >/dev/null
    STAMP="$(date -u +%Y%m%d-%H%M%S)"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-${STAMP}.apk"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-latest.apk"
    # マーカー行: これで check.sh は「Job が動いた」と「APK が届いた」を区別する。
    echo "APK-UPLOADED ${bucketName}/propusk/propusk-${STAMP}.apk"
    mc ls --recursive "builds/${bucketName}/propusk/"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: propusk-build
spec:
  # ビルドが失敗したときに Pod を何回作り直すか。ゼロのほうが正直だが、
  # SDK のダウンロード中にネットワークが時々まばたきするので、2 回目の試行のほうが
  # 「なぜ自分のは落ちたのか」を説明するより安い。
  backoffLimit: 1
  # ビルド全体の上限。これがないと詰まったビルドが夕方までノードを占有してしまう。
  # カウントはコンテナの起動時ではなく Job の作成時から始まる: Pending にいる時間や
  # ラボの少し先にあるノードの再作成もこれを消費する。1 時間では足りなかった —
  # 人が待ちきったあとにビルドが DeadlineExceeded で死んだ。
  activeDeadlineSeconds: 7200
  # Pod テンプレート: Job はこれからビルドを実行する Pod を刻印する。Pod 自身の名前は
  # ない — Job は自分の名前にランダムな接尾辞を追記するので、Pod は名前ではなく
  # job-name ラベルで探すことになる。
  template:
    spec:
      # ビルドはインターネットから他人のコードを引いてきて、すぐに実行する。そのために root
      # 権限は要らない: 書き込むのは /work だけ — S3 クライアントも含めて、それはそこに
      # ダウンロードする。非特権ユーザはイメージのシステムディレクトリへの書き込みを
      # 許されないからだ。同じ 3 つのフィールドは最初のラボのアプリケーションにもあり、
      # 同じ理由からだ: これらがないと、`restricted` セキュリティプロファイルが有効な
      # クラスタに Pod は受け入れられない。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # Job にとってこれは必須フィールドだ。Never は、失敗した Pod をその場で
      # 再起動せず、決定を Job に委ねる — Job が新しいものを作る、という意味。
      restartPolicy: Never
      containers:
        - name: build
          # コンテナレベルでも同じ厳格さ: 自分の権限を昇格させることは禁止、
          # linux ケーパビリティは一つ残らず取り上げる。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Gradle と JDK 17 を含む出来合いのイメージ。JDK のバージョンは恣意的に選んだのではない:
          # app-build.gradle.kts の jvmTarget = "17" と一致しなければならない。さもないとビルドは
          # バイトコードのバージョン不一致で失敗する。イメージに Android SDK はない — スクリプトの
          # 最初のステップがそれをダウンロードする。SDK を内蔵したイメージは数十
          # ギガバイトあり、SDK 自体より引くのに時間がかかるからだ。
          image: gradle:8.9-jdk17
          # イメージがデフォルトで実行するものではなく、/scripts にマウントした ConfigMap の
          # 自前のスクリプトを実行する。
          command: ["bash", "/scripts/build.sh"]
          envFrom:
            # Secret の 4 つのキーはすべて同じ名前の環境変数になる:
            # accessKey, secretKey, endpoint, bucketName。
            - secretRef:
                name: bucket-creds
          # 経験的に求めた、Android ビルドの正直なコスト。requests はどれだけ
          # 予約するか: スケジューラは実際の消費量ではなくこの数値でノードを選ぶ。
          # Kotlin コンパイラは 4 ギガバイト未満では生き残れない。
          # limits は上限: CPU では、ぶつかるとスロットルされ、メモリでは
          # コンテナが kill される(OOMKilled)。比較すると、最初のラボのアプリケーションは
          # CPU 20m とメモリ 32Mi で足りた。まさにこれらの数値のために、学習用
          # クラスタのノードを大きくしなければならない: ラボ 0 で注文したものにはビルドが収まらない。
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 6Gi
          # ボリュームは 3 つ。ソースとスクリプトは読み取り専用: ConfigMap はどのみち
          # 読み取り専用でマウントされるが、明示的な readOnly はビルドがそこに書き込まないことをすぐに伝える。
          # ビルドが書き込むのは /work で、そこが唯一書き込みを許された場所だ。
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: src
          configMap:
            name: propusk-src
            # ConfigMap のキーはスラッシュを含められないが、マウント時のパスは
            # 含められる。こうしてフラットなマップが、Gradle が期待する
            # ディレクトリツリーに展開される。
            items:
              - key: settings.gradle.kts
                path: settings.gradle.kts
              - key: build.gradle.kts
                path: build.gradle.kts
              - key: app-build.gradle.kts
                path: app/build.gradle.kts
              - key: AndroidManifest.xml
                path: app/src/main/AndroidManifest.xml
              - key: MainActivity.kt
                path: app/src/main/kotlin/io/aenix/propusk/MainActivity.kt
              - key: strings.xml
                path: app/src/main/res/values/strings.xml
        - name: scripts
          configMap:
            name: android-build-script
            # ボリュームのファイル権限: 読み取りと実行。スクリプトは
            # `bash /scripts/build.sh` として呼び出されるので、ここの実行ビットは保険だ — それは
            # いつかファイルを直接実行する誰かに必要になる。
            defaultMode: 0755
        - name: work
          # ノード上の一時ディスク、Pod とまったく同じだけ生きる。
          # ここに SDK、Gradle の依存関係、ビルド結果が置かれる。
          emptyDir:
            # 余裕をもって 12 ギガバイト: SDK、Gradle キャッシュ、ビルド結果で
            # 6〜8。上限が必要なのは、膨れ上がったビルドがノードのディスクを丸ごと
            # 食い尽くして隣の Pod を道連れにしないようにするため。
            sizeLimit: 12Gi
