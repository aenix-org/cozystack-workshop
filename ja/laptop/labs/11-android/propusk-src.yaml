---
# ラボ 11. モバイルアプリ「ゲストパス（通行証）」のソース — ビルドに入力として渡されるもの。
#
# テナント内（管理クラスタ上）ではなく、あなたの学習用クラスタ `lab` に適用します:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f propusk-src.yaml
# tenant-workshopXX のようなプレースホルダはここにはありません — 自分の番号をどこかに差し込む必要はありません。
# Namespace も指定されていません: オブジェクトは kubeconfig に設定されたものに配置されます。
#
# アプリはあえて極小です: アクティビティ 1 つ、画面上のテキスト 1 行のみ。
# このラボの主眼は Android ではなく、ビルドがクラスタへ渡っていくという事実にあります。
#
# これらのファイルが何なのか、モバイルアプリを一度もビルドしたことがない場合のために。
# Android プロジェクトはコードの入った 1 つのファイルではなく、3 種類のファイルからなるツリーです:
#   *.gradle.kts  ビルドの記述: ライブラリをどこから取得するか、何でコンパイルするか、どの
#                 Android バージョン向けにビルドするか。役割としては makefile で、ただし Kotlin 言語で書かれたもの;
#   *.kt          アプリ本体のコード;
#   *.xml         リソース: テキストと、アイコンをタップしたときにどの画面を開くかの
#                 記述。
# ビルダーの Gradle はこのツリーを読んで APK を出力します — 電話機用のインストーラファイル 1 つで、
# 役割としては Windows の .msi と同じです。Android SDK を自分でインストールして手作業でビルドする
# 必要はありません: それは android-build.yaml の Job が担い、ここに置かれているのはその入力だけです。
#
# ソースはイメージではなく ConfigMap に置かれています。理由は、最初のアプリのラボで
# nginx のページを ConfigMap に置いたのとまったく同じで、
# 何も再ビルドせずに変更できるようにするためです。ConfigMap はクラスタのオブジェクトで、その中に
# テキストファイルが入っています; コンテナ起動時に、クラスタがそれらを
# 通常のディスク上のファイルとしてコンテナ内部に配置します。
#
# `data` の中のキーはファイル名で、`|` の後のインデントより下にあるものはすべて、
# YAML ではなくファイルそのままの中身です。そのようなブロックの内側に置いたコメントは
# ファイル自体の 1 行になってしまうため、以下の説明はすべて外側、
# キーの前に置いてあります。
#
# 6 つのキーからなるフラットなマップがディレクトリツリーに展開されるのはここではなく、
# マウント時です: 「キー -> パス」の対応は android-build.yaml の
# volumes.items ブロックで指定されています。ConfigMap のキーにはスラッシュを含められないため、フラットな名前
# app-build.gradle.kts になっており、プロジェクト内では app/build.gradle.kts になります。
apiVersion: v1
kind: ConfigMap
metadata:
  name: propusk-src
data:
  # プロジェクトの最上位ファイル: Gradle がプラグインとライブラリをどこから取得するか、どの
  # モジュールがプロジェクトに含まれるか（ここでは 1 つ — app）を列挙します。3 つのリポジトリはすべて公開で、インターネット上にあります:
  # ビルドコンテナは空の状態で起動し、そこからすべてを取得します。ビルド時間が長いのはこのためです。
  # ここは、情報セキュリティが外向き通信を閉じたときに最初に直す場所でもあります — ここに
  # 内部プロキシリポジトリを書き込むことになります。Docker Hub を Harbor に置き換えたのとまったく同じように。
  settings.gradle.kts: |
    pluginManagement {
      repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
      }
    }
    dependencyResolutionManagement {
      repositories {
        google()
        mavenCentral()
      }
    }
    rootProject.name = "propusk"
    include(":app")

  # ルートのビルドファイル: 2 つのプラグイン — Android ビルダーと Kotlin コンパイラ — のバージョンを固定します。
  # `apply false` は「バージョンは宣言するが、ルートプロジェクトでは有効化しない」という意味です:
  # 有効化するのは app モジュールです。バージョンはあえて釘で打ち付けてあります。
  # 「最新」を取得するビルドは、1 か月後には今日とは別物としてビルドされ、それを解明するのはあなた自身です。
  build.gradle.kts: |
    plugins {
      id("com.android.application") version "8.5.2" apply false
      id("org.jetbrains.kotlin.android") version "1.9.24" apply false
    }

  # アプリモジュールそのものの記述。ここには 3 つの数字があり、ビルドが何をダウンロードするかも、
  # アプリがそもそもどこで動くかも、これらに依存します:
  #   compileSdk 34   コンパイルに使う Android SDK のバージョン。SDK インストールのステップが
  #                   ダウンロードするのがこれ — 約 1.5 ギガバイトで、ビルドで最も長いステップ;
  #   minSdk 24       アプリが動く最も古い Android（これは Android 7）。
  #                   上げれば古い電話機を切り捨て、下げれば互換性
  #                   ライブラリを引き込む羽目になります;
  #   jvmTarget 17    Kotlin は Java のバイトコードにコンパイルされ、この数字は
  #                   ビルドイメージの JDK バージョン（android-build.yaml の gradle:8.9-jdk17）と一致しなければなりません。
  #                   食い違えば — バイトコードのバージョン不一致でビルドが落ちます。
  app-build.gradle.kts: |
    plugins {
      id("com.android.application")
      id("org.jetbrains.kotlin.android")
    }

    android {
      namespace = "io.aenix.propusk"
      compileSdk = 34

      defaultConfig {
        applicationId = "io.aenix.propusk"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
      }

      compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
      }

      kotlinOptions {
        jvmTarget = "17"
      }

      sourceSets {
        getByName("main") {
          java.srcDirs("src/main/kotlin")
        }
      }
    }

  # 電話機向けのアプリの「身分証」: どんな画面があり、そのうちどれがアイコンのタップで
  # 開くか。それをまさに担うのが MAIN と LAUNCHER を持つ intent-filter ブロックです —
  # これがなければアプリはインストールされますが、メニューにアイコンは現れません。
  AndroidManifest.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <manifest xmlns:android="http://schemas.android.com/apk/res/android">
      <application android:label="@string/app_name">
        <activity
            android:name=".MainActivity"
            android:exported="true">
          <intent-filter>
            <action android:name="android.intent.action.MAIN" />
            <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
        </activity>
      </application>
    </manifest>

  # アプリの唯一の画面 — そしてプロジェクトに存在するコードのすべて。
  # 互換性ライブラリではなく素の android.app.Activity を使っています: プロジェクトの外部依存はゼロで、
  # これがビルドのたびにダウンロードを数分節約します。
  # R.string.greeting — strings.xml のテキストへの参照。R クラスはソースには入っておらず、
  # ビルドが生成します。したがって「unresolved reference: R」というエラーは、コードのタイプミスではなく、
  # リソース生成ステップが落ちたことを意味します。
  MainActivity.kt: |
    package io.aenix.propusk

    import android.app.Activity
    import android.os.Bundle
    import android.widget.TextView

    class MainActivity : Activity() {
      override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val view = TextView(this)
        view.textSize = 22f
        view.setPadding(48, 96, 48, 48)
        view.text = getString(R.string.greeting)
        setContentView(view)
      }
    }

  # コードから切り出したテキスト: こうしておくとプログラマに触れずに編集・翻訳できます。
  # app_name は電話機のアイコンの下に見え、greeting は画面そのものに見えます。
  strings.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <resources>
      <string name="app_name">ゲストパス</string>
      <string name="greeting">ゲストパスを申請する</string>
    </resources>
