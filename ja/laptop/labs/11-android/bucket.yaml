---
# ラボ 11。ビルドされた APK 用のバケット。
#
# バケットはオブジェクトストレージ内の名前付き領域である。ファイルは HTTP 経由で
# 丸ごと格納・取得され、どこにもマウントされない。内部にディレクトリは存在せず、
# オブジェクト名のスラッシュはインターフェイス上でのみツリーとして描画される。
#
# これはテナントオブジェクトである。`lab` クラスターにではなく、管理クラスター上の
# あなたの namespace に存在する。そのため、ここで必要な kubeconfig はテナント用のものであり、
# `lab` クラスターの操作に使うものではない。これは意図的な設計である。ビルド成果物は
# ビルドされたクラスターより長く存続しなければならない。
#
# 適用する前に、tenant-workshopXX を自分の namespace に置き換えること。そうしないと注文が
# 間違ったテナントに送られ、おそらく権限チェックを通過しない。
#
#     export KUBECONFIG=~/.kube/workshop
#     kubectl apply -f bucket.yaml
#
# 同じことはテナントダッシュボードでマウス操作でも行える(アプリケーションを作成 -> Bucket)。
# 結果は同一である。違いは、テキストはレビューして Git に置けるという点にある。
#
# 適用後に何が起こるか:プラットフォームは数秒でバケットを立ち上げ、
# アクセスキーを発行し、それらを同じ namespace の bucket-builds-ci-credentials シークレットに
# 格納する。そこにある 4 つの値(endpoint、bucketName、accessKey、secretKey)は
# 手作業で `lab` クラスターへ持ち込む。クラスターは別々であり、何も自動では移動しない。
apiVersion: apps.cozystack.io/v1alpha1
kind: Bucket
metadata:
  # Cozystack オブジェクトの名前であり、それだけである。ストレージ内の実際のバケット名は
  # プラットフォーム自身が発行する。bucket-a9209f83-... のような長い名前である。それは発行された
  # シークレットの bucketName フィールドに入り、ビルドに差し込むべきなのはまさにそれであって、
  # `builds` ではない。
  name: builds
  namespace: tenant-workshopXX
spec:
  users:
    # このマップの各キーは、独自のキーペアを持つ個別の S3 ユーザーである。
    # 空のオブジェクトは「読み書きのフルアクセス」を意味する。
    # このようにして、ビルダーには書き込みを、モバイルチームには読み取り専用を付与できる:
    #   ci: {}
    #   mobile:
    #     readonly: true
    ci: {}
