---
# ラボ5 · Git 上のインフラ。課題: リポジトリの中から具体的に何をクラスターへ適用するか。
#
# 隣の gitrepository.yaml と一緒に、あなたの `lab` クラスターへ適用します:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# 各オブジェクトにおいて: apiVersion — 記述スキーマのバージョン、kind — 何を作るか、
# metadata.name — オブジェクトの名前。これらは以下では個別に説明しません。
#
# 責務の分離: GitRepository はリポジトリをダウンロードするだけで何も適用せず、
# このオブジェクトがダウンロードされたものを取り、クラスターをそれに合わせます。名前 Kustomization は
# kustomize ユーティリティの名前と一致しますが、別物です — ここではクラスター内のオブジェクトです。
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passes
  # Flux のサービスと同じ場所に置きます — そうしないと kustomize-controller が拾ってくれません。
  namespace: flux-system
spec:
  # クラスターの実際の状態を Git に記述された状態とどのくらいの頻度で照合するか。
  # これは「1分ごとに適用し直す」ではなく、「1分ごとに比較して
  # 差分を修正する」です。Git 側で何も変わっていなくても、kubectl edit で
  # 手作業で加えた変更は黙って元に戻されます。この違いは、Git を経由せずに
  # 自分でクラスター内の何かを変えたときに、ラボの少し先で目にすることになります。
  interval: 1m
  # リポジトリ内のフォルダ。その中にあるものはすべてクラスターへ入ります。その隣にある
  # ファイル — 例えばルートの README.md — は触られません。名前 `apps` は我々が選んだものですが、
  # 自分のリポジトリでマニフェストを置くフォルダと一致していなければなりません。
  path: ./apps
  # Git から消えたオブジェクトをクラスターから削除する。
  # これがないと Git は完全な記述ではなくなります: リポジトリから削除したものが
  # クラスター内で動き続け、誰もそれに気づかない、という状態になります。
  prune: true
  # どのソースを見るか。名前 `passes` は gitrepository.yaml の metadata.name であり、
  # GitHub 上のリポジトリ名ではありません。あちらで名前を変えたらここも直してください。さもないと Flux は
  # 存在しないソースを待ち続け、Kustomization は ready になりません。
  sourceRef:
    kind: GitRepository
    name: passes
  # apply の直後にすぐ報告するのではなく、適用したリソースが ready になるのを待つ。
  # 違いはまさに「申請を送った」と「申請が完了した」の差です: wait がないと
  # その後にポッドが立ち上がらなくても Flux は成功を報告してしまいます。
  wait: true
  # 適用を失敗と見なす前に、その ready 状態をどのくらい待つか。
  # 3分 — 空のノードでイメージを取得する分の余裕を持たせています。値が小さすぎると
  # 遅いネットワークで誤った失敗が出ますし、大きすぎると、明快なエラーの代わりに
  # 「進行中」を長いこと眺めることになります。
  timeout: 3m
