---
# ラボ5 · Git 上のインフラ。ソース: Flux が望ましい状態をどこから取得するか。
#
# 隣接する kustomization.yaml と一緒に、あなたの `lab` クラスターに適用します:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# 注意: 適用する前に、url を自分のリポジトリのアドレスに置き換えてください。文字列
# ЗАМЕНИТЕ-МЕНЯ はプレースホルダーで、このままだと Flux は存在しないアドレスへアクセスし、
# エラーで停止します。ブランチも確認してください: GitHub は新しいリポジトリを main ブランチで作成します。
#
# 各オブジェクトにおいて: apiVersion — 記述スキーマのバージョン、kind — 何を作成するか、
# metadata.name — 以降そのオブジェクトを参照するための名前。以下では繰り返しません。
#
# このオブジェクトの唯一の役割は、リポジトリの最新のコピーをクラスター内に保持することです。
# 何も適用しません: ダウンロードするだけです。適用するのは隣接する Kustomization で、
# それは `passes` という名前でここを参照するため、名前だけを単独で変更することはできません。
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: passes
  # flux-system — flux install コマンドが用意した名前空間で、Flux のサービス自体が
  # そこに存在します。設定オブジェクトも同じ場所に置きます。そうしないとサービスが認識できません。
  namespace: flux-system
spec:
  # どのくらいの頻度で Git へ新しい状態を取りに行くか。1分はラボ用です。
  # 本番では通常1〜5分で、即時の反応は GitHub からの webhook で行います。
  interval: 1m
  # リポジトリのアドレス。公開されているので、ここにはログインもキーもありません —
  # これは学習用スタンドの簡略化です。本番ではリポジトリは非公開で、その隣に
  # deploy キーを持つシークレットへの参照が現れます(secretRef フィールド)。
  url: https://github.com/ЗАМЕНИТЕ-МЕНЯ/passes-gitops
  # どのブランチを信頼できる情報源とみなすか。クラスターへ行くのは main にマージされたものです。
  # 他のブランチにあるものは行きません。ここからレビューが生まれます: 変更はまず自分の
  # ブランチに存在し、そこで確認でき、main へのマージだけがそれを有効にします。
  # リポジトリが古い master ブランチで作成された場合は — ここを修正してください。
  # そうしないと Flux は読むべきものを見つけられません。
  ref:
    branch: main
