---
# ラボ 5 · Git の中のインフラ。「ゲストパス」サービスそのもの: 1 つのファイルに 4 つのオブジェクト。
#
# クラスタには手作業では適用しない。ファイルは GitHub 上の専用リポジトリの apps/ フォルダに、
# namespace.yaml のとなりに置かれ、Flux が `lab` クラスタへ運び込む — 自分で:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# --- の行はオブジェクトを分ける: 1 ファイル、4 つの独立したオブジェクト。ファイル内の順序は
# 作成順に影響しない — クラスタが自分で整理する。
#
# 各オブジェクトで: apiVersion — 記述スキーマのバージョン、kind — 何を作るか、
# metadata.name — オブジェクトの名前、metadata.namespace — クラスタのどの仕切りに
# 存在するか。これ以降、これらのフィールドは個別には説明しない。
#
# 4 つのオブジェクトのどれにもパスワードも鍵もトークンも含まれておらず、それは
# 偶然ではない: Git に入ったものは永遠にそこに残る — 履歴は書き換えられるが、
# すでにクローンした全員の手元には古いコピーが残る。シークレットの居場所はここではない。

# --- 4 の 1。Web サーバの設定 --------------------------------------------------
# ConfigMap はテキストファイルをアプリケーションとは別にクラスタへ置き、下の(volumes の
# セクションで)このファイルがコンテナの内部に差し込まれる。狙いは、イメージを再ビルドせずに
# 設定を変えること: ここを直してコミットすれば、1 分後にはクラスタに新しいバージョンが入る。
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-conf
  namespace: passes
# data の中のキーはコンテナ内のファイル名になる: default.conf は nginx が起動時に読む
# フォルダに置かれる。名前のあとの縦棒は、YAML の中で複数行のテキストを改行を保ったまま
# そのまま書くための方法。
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      # 準備完了チェック用のアドレス。クラスタはここをノックし、応答が返るまで
      # そのコピーにトラフィックを流さない。
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        # 返すページの中で __POD__ を nginx が動いているマシンの名前に置き換える。
        # ポッドの内部では、マシンの名前はそのポッド自身の名前になる。
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
    }
---
# --- 4 の 2。サービスが返すページ ----------------------------------------
# このラボではページはスタブ: 本物のアプリケーションはあとで登場する。いま大事なのは
# サービスが何を表示するかではなく、どこからクラスタに現れたか。マークアップ中の __POD__ という文字は
# 置換用のマーカー: nginx はそれをページを返したポッドの名前に置き換え、その
# 名前を手がかりに、あとでコピーが 1 つより多くなったことが分かる。
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-page
  namespace: passes
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>ゲストパス</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 40rem;
               color: #222; }
        h1 { font-weight: 600; }
        .v { display: inline-block; padding: .2rem .6rem; border-radius: .3rem;
             background: #eef; font-family: ui-monospace, monospace; }
        .pod { margin-top: 2rem; color: #666; font-size: .9rem; }
        b { font-family: ui-monospace, monospace; color: #222; }
      </style>
    </head>
    <body>
      <h1>「ゲストパス」サービス</h1>
      <p>ゲストパスの申請. バージョン <span class="v">v1</span></p>
      <p>Git からデプロイ済み. ここは誰も手作業では触っていない.</p>
      <div class="pod">対応したPod <b>__POD__</b></div>
    </body>
    </html>
---
# --- 4 の 3。アプリケーションそのものの記述 ---------------------------------------
# Deployment は「コンテナを起動しろ」ではなく「こういうコンテナのコピーを何個か起動した
# 状態に保て」だ。違いはコピーが死んだときに見える: クラスタは尋ねも通知もせずに
# 新しいものを作る。vSphere で最も近いのは HA だが、あちらはマシンが再起動するのに対し、
# こちらはアプリケーションのコピーが作り直され、それが障害時だけでなく常に行われる。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes
  namespace: passes
  labels:
    app: passes
spec:
  # 何個のコピーを起動した状態に保つか。言い回しが重要: 「1 つ起動しろ」ではなく
  # 「1 つを保て」。この数を Git 経由で変えて、何が起こるかを見ることになる。
  replicas: 1
  # Deployment がどの基準で自分のコピーを見分けるか。これはポッド名のリストではなく —
  # 名前は作り直しのたびに変わる — 「app: passes ラベルを持つすべてのポッド」という条件だ。
  # 下の template.metadata.labels のラベルはこの条件と一致していなければならない: ずれると
  # クラスタはマニフェストの受け入れを拒否する。コピーが誰のものでもなくなるからだ。
  selector:
    matchLabels:
      app: passes
  # template — コピーが型抜きされる原型。内部にあるものすべてが 1 つのポッドを記述する。
  # 原型を直すことは新バージョンのロールアウトを意味する: 古いコピーが新しいものに置き換わる。
  template:
    metadata:
      labels:
        app: passes
    spec:
      # ポッド全体レベルでのセキュリティ制限。vSphere には相当物がない: あちらでは
      # 隔離はハイパーバイザが与えるが、コンテナはノードとカーネルを共有するので、権限を
      # 明示的に削らなければならない。
      #   runAsNonRoot   イメージが root で動こうとするなら起動しない
      #   runAsUser      どの数値ユーザで動くか; 65532 — 最小イメージで一般的に受け入れられている
      #                  「非特権」の識別子
      #   seccompProfile どのシステムコールが許されるか; RuntimeDefault — 明らかに危険なものを
      #                  切り落とし、何も壊さないセット
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # 同じ制限だが、今度は具体的なコンテナに対して。
          #   allowPrivilegeEscalation: false  プロセスは自分に権限を追加できなくなる
          #   capabilities.drop: ["ALL"]       カーネルの特別な権限をすべて取り上げる
          #                                    (ネットワークを変える、マウントする、時刻を変える);
          #                                    Web サーバにはそのどれも必要ない
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # イメージはパブリックレジストリから取る — 次のラボでは情報セキュリティがこれを禁じ、
          # アドレスは自前の Harbor に変わる。unprivileged の選択は見栄えのためではない:
          # 通常の nginx イメージはポート 80 で待ち受け、そのために root 権限を欲しがるので、
          # 上の runAsNonRoot ではそもそも起動しない。
          # バージョンは固定されている(1.27-alpine)、latest ではない: さもないと同じ
          # マニフェストが明日は別のアプリケーションを展開し、それにあなたは気づかない。
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # アプリケーションが待ち受けるポート。名前 `http` は飾りではない: 下の準備完了
          # チェックとファイル末尾の Service がそれを参照する。ポート番号を変えれば、
          # 3 か所ではなく 1 か所で変えれば済む。
          ports:
            - containerPort: 8080
              name: http
          # requests — 確実に予約されるリソース量; この数値でスケジューラはノードを選ぶ。
          # limits — それを超えて通さない上限。
          # requests を低く見積もると、ノードが処理できる以上のものが載ることになる;
          # メモリの limits 超過ではコンテナが kill され、CPU の超過ではスロットルされる。
          # 20m = 1 コアの 20/1000、Mi = メガバイト。ここの値が小さいのは、
          # ラボのノードが 1 つで、しかも小さいからだ。
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # 準備完了チェック: クラスタはこのアドレスをノックし、応答が返るまでコピーに
          # トラフィックを流さない。これがないと Service はまだ立ち上がっていない nginx に
          # リクエストを送り、ユーザはロールアウトのたびにエラーを目にすることになる。
          # Flux もこれを待つ — kustomization.yaml で wait: true を頼んだ。
          #   initialDelaySeconds  最初のノックの前に待ち、プロセスに起動する時間を与える
          #   periodSeconds        そのあとどれくらいの頻度でノックするか
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # ファイル冒頭の 2 つの ConfigMap の中身をコンテナ内のどこに差し込むか。
          # /etc/nginx/conf.d — nginx が起動時に設定を読むフォルダ、
          # /usr/share/nginx/html — ファイルを配信するフォルダ。
          # このときイメージ自体は変わらない: ファイルは起動の瞬間にその中に現れる。
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: page
              mountPath: /usr/share/nginx/html
      # 具体的に何を差し込むか。名前 conf と page は内部的なもので、このブロックを上の
      # volumeMounts と結び付ける; configMap の中の name はすでにクラスタ内の実在オブジェクトの
      # 名前だ。そこを間違えると、ポッドは存在しない ConfigMap を待ってぶら下がり続ける。
      volumes:
        - name: conf
          configMap:
            name: passes-conf
        - name: page
          configMap:
            name: passes-page
---
# --- 4 の 4。すべてのコピーの背後に立つ恒久的な名前 -----------------------------
# ポッドは作り直され、そのアドレスは毎回新しい。Service は不変の名前を与える —
# passes.passes.svc.cluster.local — それによってクラスタの内部からは生きているコピーに
# いつでも到達できる。これは内部のロードバランシングで、クラスタの外からはまだここに入れない。
apiVersion: v1
kind: Service
metadata:
  name: passes
  namespace: passes
spec:
  # Service とポッドの結び付きはアドレスのリストではなく、「app: passes ラベルを持つすべてのポッド」という条件だ。
  # そのラベルを持つ新しいコピーが現れると — それは自らロードバランシングの対象になり、何も
  # 登録する必要はない。消えると — 配信先から外される。
  selector:
    app: passes
  # port — Service 自身がどのポートで応答するか、targetPort — それをコンテナ内のどこへ
  # 転送するか。ここで targetPort は上の ports ブロックの名前 `http` を参照しており、
  # 番号ではない: 番号は 1 か所で変えられ、結び付きは切れない。
  ports:
    - port: 80
      targetPort: http
