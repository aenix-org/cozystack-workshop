---
# ラボ5 · Git によるインフラ管理。「Passes（パス）」サービス用の名前空間。
#
# このファイルは手動でクラスターに適用しません。GitHub 上の自分のリポジトリの
# apps/ フォルダに置き、Flux が `lab` クラスターへ運び込みます — 自動的に、スケジュールに従って:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# あらゆるマニフェストの読み方: apiVersion — 記述スキーマのバージョン（これによってクラスターは
# どう解釈するかを知ります）、kind — 何を作成するか、metadata.name — 後でオブジェクトを
# 探すための名前。これら3つのフィールドはすべてのオブジェクトに存在し、以降は個別に説明しません。
#
# 名前空間（namespace）とは、単一クラスター内部の論理的な仕切りです:
# 独自の名前スコープ、独自の権限、独自のクォータを持ちます。vSphere で最も近いのは
# vCenter ツリー内のフォルダ、あるいはリソースプールです。
#
# なぜ手動で作成するのではなく、アプリケーションと一緒に Git に置くのか: サービスがリポジトリから
# 去るとき、Flux は名前空間も撤去します。空っぽの仕切りが残ることはなく、
# 半年後に誰もなぜ作ったのか思い出せない、といった事態になりません。
apiVersion: v1
kind: Namespace
metadata:
  name: passes
  # このラベルはサービスの動作には影響しません — 「Passes」に関連するものすべてを
  # 一つのコマンドで探せるようにするために必要です: kubectl get all -A -l app.kubernetes.io/part-of=passes。
  # part-of という名前は私たちが考案したものではなく、Kubernetes の一般的なラベルセットから取られています:
  # 外部のツール（監視、エクスポート）はまさにこの名前を探します。
  labels:
    app.kubernetes.io/part-of: passes
