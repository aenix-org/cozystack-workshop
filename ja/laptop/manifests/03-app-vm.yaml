# 適用する前に tenant-workshopXX を自分の namespace に置き換えてください。
# 全ファイルまとめて行うほうが簡単です: README の番号の置換に関するセクションを参照。
# さらに: 下の url フィールドに convert.sh からの presigned リンクを挿入してください (ステップ 2)。
#
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  source:
    http:
      url: "ВСТАВЬТЕ_PRESIGNED_URL"  # convert.sh より (Share: の行)
  storage: 10Gi
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  instanceType: u1.medium
  instanceProfile: centos.7
  runStrategy: Always
  disks:
    - name: app-1
# アプリへの外部からのアクセスは `virtctl port-forward` 経由です (README を参照)。
# このスタンド (Cilium + robotlb) の external LoadBalancer は VM に対して機能しないため、
# ここでは external を有効に「しません」。
