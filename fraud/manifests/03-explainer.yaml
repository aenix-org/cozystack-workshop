# Lab 3. A small language model inside your cluster explains every blocked payment.
# Qwen2.5 0.5B Instruct (Apache 2.0), served by llama.cpp on the CPU. No GPU, and no
# card data leaves your cluster: the model weights come in, nothing goes out.
# Apply with:  kubectl --context fraud apply -f manifests/03-explainer.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: explainer
  namespace: fraud
spec:
  replicas: 1
  selector: {matchLabels: {app: explainer}}
  template:
    metadata: {labels: {app: explainer}}
    spec:
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - --hf-repo
            - Qwen/Qwen2.5-0.5B-Instruct-GGUF
            - --hf-file
            - qwen2.5-0.5b-instruct-q4_k_m.gguf
            - --alias
            - local
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ctx-size
            - "2048"
            - --threads
            - "2"
          env: [{name: LLAMA_CACHE, value: /models}]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
          volumeMounts: [{name: models, mountPath: /models}]
          resources:
            requests: {cpu: 200m, memory: 768Mi}
            limits: {cpu: "2", memory: 1536Mi}
      volumes: [{name: models, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: explainer
  namespace: fraud
spec:
  selector: {app: explainer}
  ports: [{name: http, port: 8080}]
