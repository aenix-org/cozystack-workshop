# Command-line access for the participant on the bastion: a service account with the
# usual tenant roles, plus the right to live-migrate VMs, which Step 7 needs.
apiVersion: v1
kind: ServiceAccount
metadata: {name: dallasXX, namespace: tenant-dallasXX}
---
apiVersion: v1
kind: Secret
metadata: {name: dallasXX-token, namespace: tenant-dallasXX, annotations: {kubernetes.io/service-account.name: dallasXX}}
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: dallasXX-cli-admin, namespace: tenant-dallasXX}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: 'cozy:tenant:admin'}
subjects: [{kind: ServiceAccount, name: dallasXX, namespace: tenant-dallasXX}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: dallasXX-cli-use, namespace: tenant-dallasXX}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: 'cozy:tenant:use'}
subjects: [{kind: ServiceAccount, name: dallasXX, namespace: tenant-dallasXX}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: dallasXX-cli-view, namespace: tenant-dallasXX}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: 'cozy:tenant:view'}
subjects: [{kind: ServiceAccount, name: dallasXX, namespace: tenant-dallasXX}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: workshop-live-migration, namespace: tenant-dallasXX}
rules:
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstancemigrations]
    verbs: [get, list, watch, create]
  - apiGroups: [subresources.kubevirt.io]
    resources: [virtualmachines/migrate]
    verbs: [update]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstances]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: dallasXX-live-migration, namespace: tenant-dallasXX}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: workshop-live-migration}
subjects: [{kind: ServiceAccount, name: dallasXX, namespace: tenant-dallasXX}]
---
# Alert rules as code: the tenant roles of Cozystack 1.6 do not let a tenant user create
# alerting rules, although the monitoring docs describe putting them in the tenant namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: workshop-alert-rules, namespace: tenant-dallasXX}
rules:
  - apiGroups: [operator.victoriametrics.com]
    resources: [vmrules]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheusrules]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: dallasXX-alert-rules, namespace: tenant-dallasXX}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: workshop-alert-rules}
subjects: [{kind: ServiceAccount, name: dallasXX, namespace: tenant-dallasXX}]
