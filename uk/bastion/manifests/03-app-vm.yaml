# Перед застосуванням замініть tenant-workshopXX на свій namespace.
# Простіше одразу для всіх файлів: див. README, розділ про підстановку номера.
# І ще: у поле url нижче вставте presigned-посилання з convert.sh (крок 2).
#
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  source:
    http:
      url: "ВСТАВЬТЕ_PRESIGNED_URL"  # з convert.sh (рядок Share:)
  storage: 10Gi
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  instanceType: u1.medium
  instanceProfile: centos.7
  runStrategy: Always
  disks:
    - name: app-1
# Доступ до застосунку ззовні — за доменним іменем app.<tenant>.workshop.aenix.io
# (Ingress створює оператор; port-forward на цьому шляху не потрібен, див. README).
# external LoadBalancer у цьому тестовому середовищі (Cilium + robotlb) для VM не працює,
# тому external тут НЕ вмикаємо.