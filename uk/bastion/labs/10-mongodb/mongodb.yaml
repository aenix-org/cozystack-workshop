# Лаба 10 · замовлення бази MongoDB під перепустки різного виду.
# Опис того, що ви хочете отримати; збирає та налаштовує сервіс платформа.
# Те саме, що ви замовите мишкою в дашборді — тільки текстом.
# Застосовується НЕ в лабораторний кластер, а в тенант на кластері керування:
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f mongodb.yaml
#
# ПЕРЕД ЗАСТОСУВАННЯМ: замініть tenant-workshopXX на свій namespace,
# а ЗдесьВашПароль — на пароль, який ви вигадаєте.
apiVersion: apps.cozystack.io/v1alpha1
kind: MongoDB
metadata:
  name: passes
  namespace: tenant-workshopXX
spec:
  # Одна копія. MongoDB розрахована на набір реплік із трьох: вони голосують, хто
  # головний, і переживають втрату однієї. З однією копією голосувати немає з ким,
  # і чарт вмикає для цього окремий «небезпечний» режим. Для лаби годиться,
  # для проду — ні.
  replicas: 1
  # Диск під дані. Чотирьом навчальним документам вистачить і мегабайта, але том потім
  # простіше взяти із запасом, ніж розширювати.
  size: 5Gi
  # replicated — томи, у яких є копія на іншому вузлі кластера: вузол випав,
  # дані залишилися.
  storageClass: replicated
  # Процесор і пам'ять, виділені Pod бази. Для чотирьох документів з надлишком.
  resourcesPreset: s1.small
  # Гілка MongoDB. Міняти її заднім числом на живій базі не можна без оновлення.
  version: v8
  # false — база доступна лише зсередини кластера, назовні порт не виставляється.
  # Ходити в неї ви будете з робочого Pod, запущеного поруч.
  external: false
  # Шардування розрізає дані між кількома наборами серверів. Потрібне, коли
  # дані не вміщаються на один сервер; чотири перепустки вміщаються.
  sharding: false
  # Користувач бази та його пароль. Пароль вигадайте свій і запам'ятайте: він потрібен
  # робочому Pod (у рядку підключення MONGO_URI) і скрипту перевірки
  # (змінна MONGO_PASSWORD). Обліковий запис заводиться у службовій базі admin —
  # тому в рядку підключення обов'язковий authSource=admin.
  users:
    passapp:
      password: ЗдесьВашПароль
  # База passes і права в ній: користувачу passapp видана роль admin цієї бази,
  # тобто він може читати, писати, будувати індекси та міняти налаштування колекцій.
  # Прав на інші бази це не дає.
  databases:
    passes:
      roles:
        admin:
          - passapp
  # Резервні копії в об'єктне сховище. У тестовому середовищі вимкнені.
  backup:
    enabled: false
