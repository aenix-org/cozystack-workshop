---
# Лаба 5 · Інфраструктура в Git. Сам сервіс «Перепустка»: чотири об'єкти в одному файлі.
#
# Руками в кластер не застосовується. Файл кладеться у власний репозиторій на GitHub, у теку
# apps/, поряд із namespace.yaml, а в кластер `lab` його переносить Flux — сам:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# Рядок --- розділяє об'єкти: один файл, чотири незалежних об'єкти. Порядок у файлі
# на порядок створення не впливає — кластер розбереться сам.
#
# У кожному об'єкті: apiVersion — версія схеми опису, kind — що створюємо,
# metadata.name — ім'я об'єкта, metadata.namespace — у якій перегородці кластера він
# живе. Далі ці поля окремо не пояснюються.
#
# У жодному з чотирьох об'єктів немає ні пароля, ні ключа, ні токена, і це не
# випадковість: те, що потрапило в Git, залишається там назавжди — історію можна переписати, але
# у всіх, хто встиг склонувати, стара копія збережеться. Секретам тут не місце.

# --- 1 з 4. Налаштування веб-сервера --------------------------------------------------
# ConfigMap кладе в кластер текстовий файл окремо від застосунку, а нижче (у розділі
# volumes) цей файл підкладається всередину контейнера. Сенс — міняти налаштування, не
# перезбираючи образ: правите тут, комітите, і за хвилину в кластері нова версія.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-conf
  namespace: passes
# Ключ усередині data стає ім'ям файлу в контейнері: default.conf ляже в теку,
# яку nginx читає при старті. Вертикальна риска після імені — спосіб записати
# у YAML багаторядковий текст як є, зі збереженням переносів.
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      # Адреса для перевірки готовності. Кластер стукає сюди і не пускає
      # трафік на копію, поки не отримає відповідь.
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        # У сторінці, що віддається, підмінюємо __POD__ на ім'я машини, де працює
        # nginx. Усередині Pod ім'я машини — це ім'я самого Pod.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
    }
---
# --- 2 з 4. Сторінка, яку сервіс віддає ----------------------------------------
# У цій лабі сторінка — заглушка: справжній застосунок з'явиться пізніше. Зараз важливо
# не що показує сервіс, а звідки він узявся в кластері. Текст __POD__ у розмітці —
# мітка для підстановки: nginx замінить її на ім'я Pod, що віддав сторінку, і за цим
# ім'ям ви далі побачите, що копій стало більше однієї.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-page
  namespace: passes
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Перепустка</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 40rem;
               color: #222; }
        h1 { font-weight: 600; }
        .v { display: inline-block; padding: .2rem .6rem; border-radius: .3rem;
             background: #eef; font-family: ui-monospace, monospace; }
        .pod { margin-top: 2rem; color: #666; font-size: .9rem; }
        b { font-family: ui-monospace, monospace; color: #222; }
      </style>
    </head>
    <body>
      <h1>Сервіс «Перепустка»</h1>
      <p>Замовлення перепустки для гостя. Версія <span class="v">v1</span></p>
      <p>Розгорнуто з Git. Руками сюди ніхто не заходив.</p>
      <div class="pod">вас обслужив Pod <b>__POD__</b></div>
    </body>
    </html>
---
# --- 3 з 4. Опис самого застосунку ---------------------------------------------------
# Deployment — це не «запусти контейнер», а «тримай запущеною стільки-то копій ось
# такого контейнера». Різниця видна, коли копія вмирає: кластер створює нову, не
# питаючи і не повідомляючи. У vSphere найближче HA, але там перезапускається машина,
# а тут перестворюється копія застосунку, і робиться це постійно, а не при аварії.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes
  namespace: passes
  labels:
    app: passes
spec:
  # Скільки копій тримати запущеними. Формулювання важливе: не «запусти одну», а
  # «тримай одну». Це число ви поміняєте через Git і подивитеся, що станеться.
  replicas: 1
  # За якою ознакою Deployment пізнає свої копії. Це не список імен Pod —
  # імена міняються при кожному перестворенні, — а умова «усі Pod з міткою app: passes».
  # Мітка нижче, в template.metadata.labels, має збігатися з цією умовою: розійдуться
  # — кластер відмовиться приймати маніфест, тому що копії опиняться нічиїми.
  selector:
    matchLabels:
      app: passes
  # template — зразок, за яким штампуються копії. Усе, що всередині, описує один
  # Pod. Правка зразка означає викатку нової версії: старі копії замінюються новими.
  template:
    metadata:
      labels:
        app: passes
    spec:
      # Обмеження безпеки на рівні всього Pod. У vSphere аналога немає: там
      # ізоляція дається гіпервізором, а контейнери ділять ядро з вузлом, тому права
      # доводиться урізати явно.
      #   runAsNonRoot   не запускати, якщо образ хоче працювати від root
      #   runAsUser      під яким числовим користувачем працювати; 65532 — прийнятий
      #                  «непривілейований» ідентифікатор у мінімальних образах
      #   seccompProfile які системні виклики дозволені; RuntimeDefault — набір,
      #                  який відсікає завідомо небезпечне і нічого не ламає
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Ті самі обмеження, але вже на конкретний контейнер.
          #   allowPrivilegeEscalation: false  процес не зможе добрати собі прав
          #   capabilities.drop: ["ALL"]       відібрати всі особливі повноваження ядра
          #                                    (міняти мережу, монтувати, міняти час);
          #                                    веб-серверу вони не потрібні жодне
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Образ береться з публічного реєстру — у наступній лабі ІБ це заборонить, і
          # адреса зміниться на свій Harbor. Варіант unprivileged обраний не для краси:
          # звичайний образ nginx слухає порт 80 і хоче для цього права root, а з
          # runAsNonRoot вище він би не стартував зовсім.
          # Версія зафіксована (1.27-alpine), а не latest: інакше той самий
          # маніфест завтра розгорне інший застосунок, і ви про це не дізнаєтеся.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # Порт, який слухає застосунок. Ім'я `http` — не прикраса: на нього
          # посилаються перевірка готовності нижче і Service наприкінці файлу. Поміняєте
          # номер порту — міняти його доведеться в одному місці, а не в трьох.
          ports:
            - containerPort: 8080
              name: http
          # requests — скільки ресурсів гарантовано зарезервувати; за цим числом
          # планувальник обирає вузол. limits — стеля, вище якої не пустять.
          # Заниження requests означає, що на вузол влізе більше, ніж він потягне;
          # перевищення limits за пам'яттю — контейнер убивають, за процесором — пригальмовують.
          # 20m = двадцять тисячних ядра, Mi = мегабайти. Значення тут маленькі,
          # тому що вузол у лабі один і він невеликий.
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Перевірка готовності: кластер стукає за цією адресою і не пускає трафік
          # на копію, поки не отримає відповідь. Без неї Service відправив би запити в
          # ще не піднятий nginx, і користувач побачив би помилку при кожній викатці.
          # Її ж чекає Flux — у kustomization.yaml ми просили wait: true.
          #   initialDelaySeconds  почекати перед першим стуком, дати процесу стартувати
          #   periodSeconds        як часто стукати далі
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # Куди всередині контейнера підкласти вміст двох ConfigMap з початку файлу.
          # /etc/nginx/conf.d — тека, звідки nginx читає налаштування при старті,
          # /usr/share/nginx/html — тека, з якої він віддає файли.
          # Образ при цьому не міняється: файли з'являються в ньому в момент запуску.
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: page
              mountPath: /usr/share/nginx/html
      # Що саме підкладати. Імена conf і page — внутрішні, вони зв'язують цей
      # блок з volumeMounts вище; name всередині configMap — уже ім'я реального об'єкта
      # в кластері. Помилитеся в ньому — Pod буде висіти і чекати неіснуючий ConfigMap.
      volumes:
        - name: conf
          configMap:
            name: passes-conf
        - name: page
          configMap:
            name: passes-page
---
# --- 4 з 4. Постійне ім'я, за яким стоять усі копії -----------------------------
# Pod перестворюються, і адреси у них щоразу нові. Service дає незмінне ім'я —
# passes.passes.svc.cluster.local, — за яким усередині кластера завжди можна достукатися
# до живих копій. Це внутрішня балансування, ззовні кластера сюди поки не потрапити.
apiVersion: v1
kind: Service
metadata:
  name: passes
  namespace: passes
spec:
  # Зв'язок Service з Pod — не список адрес, а умова «усі Pod з міткою app: passes».
  # З'явилася нова копія з такою міткою — вона сама потрапила під балансування, нічого
  # реєструвати не потрібно. Зникла — її прибрали з видачі.
  selector:
    app: passes
  # port — на якому порту відповідає сам Service, targetPort — куди він перенаправляє
  # всередину контейнера. Тут targetPort посилається на ім'я `http` з блоку ports вище,
  # а не на номер: номер можна поміняти в одному місці, і зв'язок не порветься.
  ports:
    - port: 80
      targetPort: http
