---
# Лаба 5 · Інфраструктура в Git. Завдання: що саме з репозиторію застосовувати в кластер.
#
# Застосовується на вашому кластері `lab` разом із сусіднім gitrepository.yaml:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# У кожному об'єкті: apiVersion — версія схеми опису, kind — що створюємо,
# metadata.name — ім'я об'єкта. Нижче окремо не пояснюються.
#
# Розподіл обов'язків: GitRepository завантажує репозиторій і нічого не застосовує,
# цей об'єкт бере завантажене і приводить до нього кластер. Ім'я Kustomization збігається
# з ім'ям утиліти kustomize, але це різні речі — тут це об'єкт у кластері.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passes
  # Живе там само, де служби Flux, — інакше kustomize-controller його не підхопить.
  namespace: flux-system
spec:
  # Як часто звіряти фактичний стан кластера з описаним у Git.
  # Це не «раз на хвилину застосувати заново» — це «раз на хвилину порівняти і
  # виправити розбіжності». Навіть якщо в Git нічого не змінювалося, правка, зроблена
  # руками через kubectl edit, буде мовчки відкочена назад. Різницю ви побачите
  # трохи далі по лабі, коли самі зміните щось у кластері повз Git.
  interval: 1m
  # Папка всередині репозиторію. Усе, що лежить у ній, потрапить у кластер; файли поруч
  # з нею — наприклад README.md у корені — не зачепляться. Ім'я `apps` вибране нами, але воно
  # має збігатися з папкою, у яку ви кладете маніфести у своєму репозиторії.
  path: ./apps
  # Видаляти з кластера об'єкти, які зникли з Git.
  # Без цього Git перестає бути повним описом: видалене з репозиторію
  # продовжувало б працювати в кластері, і ніхто б про це не знав.
  prune: true
  # На яке джерело дивитися. Ім'я `passes` — це metadata.name з gitrepository.yaml,
  # а не ім'я репозиторію на GitHub. Перейменуєте там — виправте і тут, інакше Flux
  # буде чекати на джерело, якого немає, і Kustomization не стане готовим.
  sourceRef:
    kind: GitRepository
    name: passes
  # Дочекатися готовності застосованого, а не звітувати одразу після apply.
  # Різниця рівно та сама, що між «заявку надіслав» і «заявка виконана»: без wait
  # Flux повідомить про успіх, навіть якщо Pod після цього не піднімуться.
  wait: true
  # Скільки чекати на цю готовність, перш ніж визнати застосування неуспішним.
  # Три хвилини — із запасом на завантаження образу на порожньому вузлі. Занадто мале
  # значення дасть хибні відмови на повільній мережі, занадто велике — ви будете
  # довго дивитися на «у процесі» замість зрозумілої помилки.
  timeout: 3m
