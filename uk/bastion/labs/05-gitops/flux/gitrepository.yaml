---
# Лаба 5 · Інфраструктура в Git. Джерело: звідки Flux бере бажаний стан.
#
# Застосовується на вашому кластері `lab` разом із сусіднім kustomization.yaml:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# УВАГА: ЗАМІНІТЬ url на адресу СВОГО репозиторію, перш ніж застосовувати: рядок
# ЗАМЕНИТЕ-МЕНЯ — заглушка, з нею Flux піде на неіснуючу адресу і зупиниться
# з помилкою. Гілку теж перевірте: GitHub створює нові репозиторії з гілкою main.
#
# У кожному об'єкті: apiVersion — версія схеми опису, kind — що створюємо,
# metadata.name — ім'я, за яким на об'єкт посилаються далі. Нижче не повторюється.
#
# Єдине завдання цього об'єкта — тримати в кластері свіжу копію репозиторію.
# Він нічого не застосовує: лише завантажує. Застосовує сусідній Kustomization,
# і він посилається сюди за іменем `passes`, тому ім'я не можна міняти поодинці.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: passes
  # flux-system — namespace, який завела команда flux install; у ньому живуть
  # самі служби Flux. Об'єкти-налаштування кладуть туди ж, інакше служби їх не побачать.
  namespace: flux-system
spec:
  # Як часто ходити в Git за новим станом. Одна хвилина — для лаби;
  # у бою зазвичай 1–5 хвилин, а миттєву реакцію роблять вебхуком із GitHub.
  interval: 1m
  # Адреса репозиторію. Він публічний, тому ні логіна, ні ключа тут немає —
  # це спрощення тестового середовища. У бою репозиторій приватний, і поруч з'являється
  # посилання на секрет із deploy-ключем (поле secretRef).
  url: https://github.com/ЗАМЕНИТЕ-МЕНЯ/passes-gitops
  # Яку гілку вважати джерелом істини. У кластер поїде те, що влито в main;
  # те, що лежить в інших гілках, не поїде. Звідси й береться рев'ю: зміна
  # спершу живе у своїй гілці, де її можна подивитися, і лише злиття в main
  # робить її чинною. Якщо репозиторій створено зі старою гілкою master —
  # виправте тут, інакше Flux не знайде, що читати.
  ref:
    branch: main
