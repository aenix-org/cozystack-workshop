---
# Лаба 7 · ЦЕЙ ПАТЧ НАВМИСНО НЕПОВНИЙ. Він потрібен, щоб ви побачили, як виглядає
# «кеш начебто увімкнули, а швидше не стало». Робочий варіант — у cache-patch.yaml.
#
# Застосовується у вашому кластері `lab` (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch-broken.yaml
#
# Підглядати відповідь не треба. Застосуйте, зробіть кілька запитів і подивіться логи
# застосунку: kubectl logs -l app=passes-api. Застосунок каже, що з ним не так,
# — питання в тому, щоб прочитати повідомлення і зрозуміти, чого в цьому файлі не вистачає.
#
# Підставте адресу свого Redis замість REDIS-ADDR (див. крок про пошук адреси).
# Заглушку залишати не можна: тоді ви отримаєте не ту помилку, заради якої все затівалося.
spec:
  template:
    spec:
      containers:
        # Ім'я контейнера — адреса, за якою кластер знаходить місце для правки.
        - name: api
          env:
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
