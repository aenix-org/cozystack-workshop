# Лаба 8 · ступінь 2 з 3: пароль винесено з Deployment в окремий об'єкт Secret.
# «Наївна лагодка»: в описі застосунку пароля більше не видно, розробник задоволений,
# аудитор — ні. Чому — побачимо через одну команду.
#
# Чим цей ступінь кращий за перший: значення перестало бути частиною опису застосунку,
# на нього тепер посилаються за іменем. Чим він гірший за третій — тим, що значення все
# одно доводиться десь написати, і написане воно прямо тут.
#
#   secrets-demo-naive.yaml      пароль бачить кожен, хто відкрив файл
#   secrets-demo-secret.yaml  <- ви тут: пароль в об'єкті Secret
#   secrets-demo.yaml            пароля в маніфесті немає взагалі
#
# Де застосовується: ваш кластер `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Команда: kubectl apply -f secrets-demo-secret.yaml
#
# Пароль у цьому файлі навчальний і вигаданий. У файлі два об'єкти, розділені рядком
# `---`: Secret і Deployment, який на нього посилається. apiVersion, kind
# і metadata.name далі за файлом не коментуються.
#
# Secret — окремий вид об'єкта для того, що не повинно лежати в описі застосунку.
# Кластер поводиться з ним трохи акуратніше, ніж зі звичайними налаштуваннями: значення
# не показуються в kubectl describe, права на читання роздаються окремо.
apiVersion: v1
kind: Secret
metadata:
  name: passes-db
# Opaque означає «довільний набір ключ-значення». Бувають спеціальні типи —
# для доступу до реєстру образів, для TLS-сертифікатів, — але тут нічого
# спеціального не потрібно.
type: Opaque
data:
  # Це НЕ шифрування. Це base64 — спосіб записати байти друкованими символами.
  # Ключа немає, пароля на розшифрування немає, зворотне перетворення робить будь-хто.
  password: UHJvcHVzazIwMTkh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # Deployment нижче — той самий, що і на першому ступені. Змінилося рівно одне
  # місце: як у Pod потрапляє DB_PASSWORD.
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # Не від root, обмежений набір системних викликів.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Знову busybox і кілька рядків на shell: дивимося на шлях пароля,
          # а не на роботу застосунку.
          image: busybox:1.36
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # Ось уся різниця з першим ступенем. valueFrom замість value означає
            # «взяти значення звідти»: secretKeyRef.name — який об'єкт, key — яке
            # поле всередині нього. Підстановка відбувається під час запуску Pod, в описі
            # застосунку залишається тільки ім'я.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: passes-db
                  key: password
          # Той самий цикл, що і на першому ступені: друкує відбиток пароля, а не сам
          # пароль. Відбиток зручний саме для порівняння ступенів — якщо він не
          # змінився, значить у Pod приїхало те саме значення, що і раніше.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s підключаюся до %s як %s, відбиток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
