# Лаба 1. Увесь навчальний застосунок rickroll одним файлом: налаштування nginx, сторінка,
# саме розгортання та постійна адреса до нього. Чотири об'єкти, розділені `---`.
#
# Застосовується на вашому навчальному кластері `lab`, а не в тенанті на керівному кластері:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll.yaml
# Заглушок на кшталт tenant-workshopXX тут немає — підставляти свій номер нікуди не потрібно.
#
# Поля, які повторюються в усіх чотирьох об'єктів, розбираємо один раз тут:
#   apiVersion — розділ API, у якому живе цей тип об'єкта;
#   kind       — сам тип об'єкта;
#   metadata.name — ім'я, за яким об'єкт потім шукають через `kubectl get`.
# Ім'я унікальне всередині свого типу, тому Deployment і Service нижче обидва звуться
# rickroll і не конфліктують.
---
# Налаштування nginx. Між версіями сторінки не змінюються, тому винесені окремо.
# ConfigMap — файл налаштувань, який лежить у кластері сам по собі й підкладається
# всередину контейнера під час запуску. Сенс у тому, щоб змінювати налаштування, не перезбираючи
# образ. Ключ `default.conf` стане ім'ям файлу в каталозі, куди змонтовано том.
#
# Усе, що нижче відступу після `|`, — не YAML, а дослівний вміст файлу. Рядки
# з решіткою всередині цього блоку потраплять у конфіг nginx як є, а не зникнуть під час
# розбору. З тієї ж причини в блок зі сторінкою нижче коментарі не додані:
# там HTML, і решітка в ньому була б видна користувачеві на екрані.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-conf
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      location / {
        # Уся сіль лаби: nginx підставляє ім'я свого Pod прямо в HTML.
        # $hostname всередині Pod — це і є ім'я Pod.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
---
# Сторінка, версія 1. Окремим об'єктом від налаштувань — щоб у лабі 4 перемкнути
# застосунок на другу версію, не чіпаючи конфіг nginx і не перезбираючи образ.
# Суфікс -v1 в імені не прикраса: поруч з'явиться rickroll-page-v2, і перемикання
# тому між ними й буде викочуванням нової версії.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v1
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Never Gonna Give You Up</title>
    <style>
      body{background:#0d0d12;color:#e8e8ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#ff0057,#ffb800,#00e0ff,#ff0057);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#9aa0b5;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#6f7690}
      .pod b{display:block;margin-top:.4em;color:#00e0ff;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#4d5366;font-size:14px}
    </style>
    <h1>Never Gonna Give You Up</h1>
    <p class="lyr">Never gonna let you down &middot; Never gonna run around and desert you</p>
    <div class="pod">вас обслужив Pod<b>__POD__</b></div>
    <p class="hint">Оновіть сторінку. Коли реплік стане більше — ім'я почне змінюватися.</p>
    </html>
---
# Сам застосунок. Deployment описує бажаний стан — який образ запускати,
# скільки копій тримати, як їх замінювати під час оновлення. Далі кластер сам приводить
# реальність до цього опису й стежить за нею постійно, а не один раз під час створення.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rickroll
  labels:
    app: rickroll
spec:
  # Скільки копій тримати запущеними. Формулювання саме таке: не «запусти одну»,
  # а «тримай одну». Зникне копія — кластер створить нову, не питаючи. У лабі 3
  # це ж поле почне змінювати автомасштабування, тому руками його більше не чіпають.
  replicas: 1
  # За якою міткою Deployment вважає Pod своїми. Мітка тут і мітка в template
  # нижче зобов'язані збігатися: за розбіжності об'єкт не створиться зовсім.
  selector:
    matchLabels:
      app: rickroll
  # Шаблон Pod — з нього штампується кожна копія. Правка будь-якого поля всередині template
  # означає нову ревізію застосунку та заміну копій по черзі (це і є лаба 4).
  # Правка полів поза template (наприклад, replicas) ревізію не створює.
  template:
    metadata:
      labels:
        # Та сама мітка висить і на самих Pod: за нею їх знаходить Service у кінці файлу.
        app: rickroll
    spec:
      # Вимоги профілю безпеки `restricted` на рівні всього Pod: робота
      # не від root, конкретний UID і стандартний профіль seccomp. У корпоративному
      # кластері з увімкненим `restricted` Pod без цих полів не допустять до запуску,
      # причому відмова прийде в момент створення Pod, а не під час apply маніфесту.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Та сама строгість, але на рівні контейнера: процесу всередині заборонено
          # підвищувати свої права, і в нього відібрані всі linux-можливості.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Непривілейований варіант: слухає 8080 і працює не від root.
          # Одного цього вистачає профілю `baseline`, але не `restricted` — тому потрібні
          # явні securityContext у Pod й у контейнера, вони задані вище. У
          # корпоративному кластері зазвичай увімкнено саме `restricted`.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # За замовчуванням nginx піднімає по робочому процесу на ядро вузла. На навчальній
          # машині з одним ядром це один процес, а на бойовому вузлі з 64 ядрами — 64,
          # і Pod з маленьким лімітом пам'яті падає з OOMKilled ще до першого запиту.
          # Автотюн рахує воркери за лімітом CPU: за 300m це один процес.
          # Через змінну оточення, а не через -g: директива вже є в базовому
          # конфізі образу, і друге оголошення роняє nginx з помилкою «duplicate».
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # Порту дано ім'я, а не тільки номер: на `http` посилаються readinessProbe
          # нижче й targetPort у Service. Зміниться номер — правити треба в одному місці.
          ports:
            - containerPort: 8080
              name: http
          # Дві різні речі, які постійно плутають. requests — скільки ресурсу
          # зарезервувати гарантовано; за ним планувальник вибирає вузол, і від
          # нього ж автомасштабування в лабі 3 рахує завантаження у відсотках.
          # limits — стеля, вище якої не дають піднятися: за процесором за
          # упору сповільнюють, за пам'яттю вбивають контейнер.
          resources:
            # Навмисно мізерні: на воркшопі таких застосунків буде багато.
            # 20m — це дві сотих ядра. Значення низьке свідомо: чим менше
            # requests, тим швидше навантаження перебиває поріг і зростання копій у лабі 3
            # видно за секунди, а не за півгодини.
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          # Перевірка готовності. Поки за цією адресою не прийшла відповідь, кластер не
          # пускає на копію трафік. Заради неї в конфізі nginx заведено окремий
          # location /healthz з відповіддю «ok». Цим полем оплачено викочування без простою
          # у лабі 4: стару копію гасять тільки після того, як нова відповіла.
          # Приберіть його — і оновлення почне роняти запити.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            # Дві секунди до першого стуку — підібрано дослідним шляхом. Менше не має
            # сенсу, nginx стільки стартує; більше — розтягне кожне викочування марно.
            initialDelaySeconds: 2
          # Куди підкласти вміст ConfigMap всередині контейнера. Каталоги вибрані
          # не довільно: з першого nginx віддає файли, з другого читає налаштування.
          # Без цих двох рядків обидва ConfigMap так і залишилися б лежати в кластері,
          # а nginx показав би свою стандартну сторінку.
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
      # Які ConfigMap підключити до Pod. Ім'я тому тут пов'язує його із записом
      # у volumeMounts вище — збігатися повинні саме імена, порядок для зв'язки ролі
      # не грає. А от для лаби 4 грає, див. попередження нижче.
      volumes:
        # УВАГА: цей том має бути першим (volumes[0]).
        # Лаба 4 перемикає версію сторінки патчем за індексом.
        # JSON Patch адресує елемент списку номером, а не ім'ям. Переставите томи
        # місцями — патч мовчки підмінить налаштування nginx замість сторінки, застосунок
        # зламається, а повідомлення про помилку говоритиме зовсім про інше.
        - name: page
          configMap:
            name: rickroll-page-v1
        - name: conf
          configMap:
            name: rickroll-conf
---
# Постійна адреса застосунку. Копії народжуються й помирають, їхні адреси змінюються, а ім'я
# `rickroll` всередині кластера залишається тим самим — за ним застосунок і звуть сусіди.
# Список живих копій за цим ім'ям кластер веде сам, за мітками.
apiVersion: v1
kind: Service
metadata:
  name: rickroll
spec:
  # Кого поставити за цю адресу: усі Pod з такою міткою, ким би вони не були
  # створені. Звідси типова неприємність — сторонній Pod з міткою app: rickroll
  # мовчки потрапить у балансування й почне відповідати вашим користувачам. Скрипт
  # check.sh у цій папці окремо перевіряє, що таких самозванців немає.
  selector:
    app: rickroll
  ports:
    # port — на якому порту відповідає сам сервіс, targetPort — куди він стукається всередину
    # Pod. Тут targetPort задано ім'ям порту з контейнера, а не числом: зміниться
    # номер у контейнері — цей файл правити не доведеться.
    - port: 80
      targetPort: http
