# Лаба 13. Паспорт чарта «Перепустки».
#
# Чарт — це тека: шаблони маніфестів у templates/, значення за замовчуванням у values.yaml
# і схема параметрів у values.schema.json. Розгортається командою
# `helm install <ім'я-релізу> chart` з теки лаби, а в каталозі Cozystack — самою
# платформою, коли хтось замовляє застосунок через дашборд.
#
# Chart.yaml — обкладинка пакета: за нею Helm розуміє, як пакет називається і якої він версії.
apiVersion: v2
name: guest-pass
description: Internal guest pass service — order a pass for a visitor
type: application

# Далі дві версії, і їх плутають найчастіше за все інше в Helm. Це різні речі.
#
# version — версія пакування. Змінюється, коли ви правите шаблони, значення або схему,
# навіть якщо застосунок усередині лишився попереднім. Саме її Helm порівнює під час оновлення
# релізу, за нею ж різняться завантажені до репозиторію пакети. Без її підвищення
# платформа вважає, що пакет не змінювався, і нову версію можна не помітити.
version: 0.1.0
# appVersion — версія самого застосунку всередині пакета, тут це nginx. Живе своїм
# життям: застосунок може оновитися десять разів без жодної правки шаблонів, і навпаки —
# ви переписали шаблони, а застосунок той самий. В імена об'єктів не потрапляє, показується
# у виводі `helm list` і в картці каталогу.
appVersion: "1.0"
