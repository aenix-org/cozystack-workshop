---
# Лаба 3. Нарощуємо репліки за навантаженням процесора.
# Ціль 50% від requests.cpu (20m), тобто поріг — 10m на Pod.
# Взято низьким навмисно: навантаження має спрацьовувати за секунди,
# у нас на лабу півгодини, а не півдня.
#
# Один об'єкт. Застосовується на вашому навчальному кластері `lab`, а не в тенанті
# на кластері керування:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f hpa.yaml
# Заглушок на кшталт tenant-workshopXX тут немає — підставляти свій номер нікуди не потрібно.
#
# Дві умови, без яких об'єкт створиться, але працювати не буде:
#   1. У контейнера rickroll задано requests.cpu — інакше відсотки нема від чого рахувати,
#      і в колонці TARGETS у `kubectl get hpa` назавжди залишиться <unknown>.
#   2. У кластері працює metrics-server — джерело поточного споживання Pod.
# Обидві умови перевіряє check.sh у цій папці.
#
# Поки HPA існує, поле replicas у Deployment належить йому. Змінити кількість
# копій руками через `kubectl scale` можна, але HPA поверне своє за найближчі секунди.
# Тому в лабі 4 перед викаткою цей об'єкт видаляють: два механізми на одне поле —
# гарантований спосіб не зрозуміти, що сталося.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # Ім'я HPA не зобов'язане збігатися з іменем застосунку — збіг тут заради зручності.
  # Ким керувати, визначає scaleTargetRef нижче, а не це ім'я.
  name: rickroll
spec:
  # На кого дивитися і чиє поле replicas міняти. Три поля разом, бо ім'я
  # без типу неоднозначне: Deployment і StatefulSet можуть зватися однаково.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rickroll
  # Коридор, за який HPA не вийде за жодного навантаження. Нижня межа — та сама
  # одна копія, з якої лаба починалася. Верхня — шість: стільки вміщується
  # на навчальний вузол при limits.cpu 300m і при цьому помітно на око в списку Pod.
  # Поставите maxReplicas: 1 — об'єкт створиться і не зробить нічого.
  minReplicas: 1
  maxReplicas: 6
  # За чим ухвалювати рішення. Метрик може бути декілька, тоді HPA бере ту,
  # яка вимагає більшої кількості копій. Тут вона одна — процесор.
  metrics:
    - type: Resource
      resource:
        name: cpu
        # Utilization — частка від requests.cpu контейнера, а не від потужності вузла.
        # Звідси неінтуїтивний наслідок: значення спокійно буває 600%, і це
        # не помилка: Pod їсть у шість разів більше, ніж зарезервував.
        # Альтернатива — AverageValue, де поріг задають у міліядрах напряму.
        target:
          type: Utilization
          averageUtilization: 50
  # Наскільки жваво реагувати. Блок необов'язковий: без нього беруться значення
  # за замовчуванням, розраховані на бойову експлуатацію, а не на демонстрацію.
  behavior:
    scaleUp:
      # За замовчуванням Kubernetes чекає стабілізації і росте повільно.
      # На лабі це виглядає як «нічого не відбувається», тому прискорюємо.
      stabilizationWindowSeconds: 0
      # Не більше двох нових копій за кожні п'ятнадцять секунд. Крок підібрано дослідним
      # шляхом: зростання видно як зростання, а не як миттєвий стрибок з однієї одразу до шести,
      # у якому учаснику нема чого розглядати.
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      # А от вниз навпаки — не миттєво, інакше Pod зникнуть
      # раніше, ніж учасник встигне їх розглянути.
      # Хвилина замість п'яти за замовчуванням: лаба йде півгодини, чекати стиснення
      # п'ять із них нема чим зайняти. У робочому кластері довге вікно якраз корисне —
      # воно гасить гойдалку на нерівному навантаженні.
      stabilizationWindowSeconds: 60
