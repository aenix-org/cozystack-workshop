# Лаба 3. Генератор навантаження Fortio: сам генератор і стала адреса до його
# веб-інтерфейсу. Два об'єкти, розділені `---`.
#
# Застосовується на вашому навчальному кластері `lab`, а не в тенанті на кластері керування:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f fortio.yaml
# Заглушок на кшталт tenant-workshopXX тут немає — підставляти свій номер нікуди не потрібно.
# Цей самий файл знадобиться в лабі 4: `kubectl apply -f ../03-scale/fortio.yaml`.
#
# Загальні поля маніфесту (apiVersion, kind, metadata.name, selector, template,
# securityContext) порядково розібрані в ../01-deploy/rickroll.yaml і тут
# не повторюються. Коментуємо лише те, що властиве саме генератору навантаження.
---
# Генератор навантаження з веб-мордою.
# Взятий замість hey/ab навмисно: навантаження запускають кнопкою в браузері,
# а гістограму затримок видно там само. На минулих воркшопах ми втрачали
# людей саме на консольних інструментах.
#
# Fortio живе в кластері як звичайний застосунок і б'є по адресі rickroll зсередини.
# Навантажувати ззовні, з ноутбука, було б чесніше за трафіком, але впиралося б у канал
# до кластера, і ви вимірювали б свій Wi-Fi, а не застосунок.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # Однієї копії генератора вистачає: навантаження вона дає в багато потоків сама.
  # Друга копія тут лише розмила б картину — лічильники у веб-інтерфейсі
  # у кожної копії свої, і ви бачили б половину запитів.
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # Той самий профіль безпеки, що й у rickroll: робота не від root, конкретний
      # UID, стандартний seccomp. Залишено навмисно — щоб файл можна було застосувати
      # і в кластері з увімкненим профілем `restricted`, де інакше Pod не запуститься.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Тег latest — свідоме спрощення для воркшопу, щоб не звіряти версії.
          # У робочому кластері так не роблять: образ під цим тегом може непомітно
          # змінитися між двома apply, і ви не зможете повторити вчорашній результат.
          image: fortio/fortio:latest
          # Режим `server` піднімає веб-інтерфейс і тримає його. Без цього аргументу
          # Fortio відпрацював би один прогін з командного рядка і завершився б, а кластер
          # перезапускав би контейнер по колу.
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            # Запит вищий, ніж у самого rickroll (20m): генератору потрібне місце на вузлі
            # заздалегідь, інакше планувальник поставить його впритул і розгін буде нерівним.
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # Генератору потрібен запас за процесором, інакше він упреться
              # в себе і ви будете навантажувати не застосунок, а Fortio.
              cpu: "1"
              memory: 256Mi
---
# Стала адреса генератора всередині кластера. Потрібна, щоб відкрити веб-інтерфейс
# з ноутбука через `kubectl port-forward svc/fortio 8081:8080` — ззовні кластер
# нічого не публікує, і інших дверей до Fortio немає.
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  ports:
    # 8080 з обох боків: і сервіс, і контейнер. Номер той самий, що й у rickroll
    # всередині Pod, але перетину немає — у кожного Pod свій мережевий стек.
    - port: 8080
      targetPort: http
