---
# Лаба 4. Друга версія сторінки — те, що ми викочуємо під навантаженням.
# Відрізнятися має помітно: учасник дивиться на браузер, а не в diff.
#
# Один об'єкт. Застосовується на вашому навчальному кластері `lab`, а не в тенанті
# на кластері керування:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll-page-v2.yaml
# Заглушок на кшталт tenant-workshopXX тут немає — підставляти свій номер нікуди не потрібно.
#
# Головне, на чому тут спотикаються: цей apply сам по собі нічого не викочує.
# Він кладе в кластер ще один файл з налаштуваннями поруч із першим. Поки том `page`
# у Deployment посилається на rickroll-page-v1, користувачі бачать першу версію.
# Викоткою стає наступний крок лаби — перемикання тому на цей ConfigMap.
# Звідси і вся конструкція з двома об'єктами: перша версія залишається в кластері
# недоторканою, і відкат повертає її цілком, а не відновлює по пам'яті.
#
# Правь ми натомість цей ConfigMap rickroll-page-v1 на місці, відкочуватися було б
# нікуди, а Pod отримали б новий вміст без заміни копій і без запису
# в історії ревізій — тобто без усього, заради чого лаба і робиться.
#
# Ім'я об'єкта міняти не можна: на rickroll-page-v2 посилається патч із README
# і перевірка в check.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v2
data:
  # Усе, що нижче відступу після `|`, — дослівний вміст файлу index.html,
  # який опиниться всередині контейнера. Це вже не YAML: коментарів тут немає
  # і бути не може, решітка потрапила б на сторінку як звичайний текст.
  #
  # У розмітці важливі дві речі, на які дивиться check.sh: напис «ВЕРСІЯ 2» —
  # за ним перевірка відрізняє другу версію від першої, і заглушка __POD__ — її
  # підмінює на ім'я Pod nginx за правилом із ConfigMap rickroll-conf (лаба 1).
  # Приберете будь-яку з них — перевірка лаби не пройде, хоча викатка буде успішною.
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>We're No Strangers To Love</title>
    <style>
      body{background:#07131a;color:#e8f6ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      .tag{display:inline-block;margin-bottom:1.5em;padding:.35em 1em;border-radius:999px;
           background:#00e0ff;color:#052; font-weight:700;letter-spacing:.08em;font-size:13px}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#00ffa3,#00e0ff,#7a5cff,#00ffa3);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#7f96a3;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#5d7380}
      .pod b{display:block;margin-top:.4em;color:#00ffa3;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#3f5561;font-size:14px}
    </style>
    <div class="tag">ВЕРСІЯ 2</div>
    <h1>We're No Strangers To Love</h1>
    <p class="lyr">You know the rules &middot; And so do I</p>
    <div class="pod">вас обслужив Pod<b>__POD__</b></div>
    <p class="hint">Оновлення пройшло Pod навантаженням. Погляньте у Fortio: помилок нуль.</p>
    </html>
