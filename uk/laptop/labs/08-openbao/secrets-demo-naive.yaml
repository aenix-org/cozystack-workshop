# Лаб 8 · крок 1 з 3: пароль лежить у маніфесті відкритим текстом.
# Так сервіс «Перепустка» виглядає сьогодні — і саме цей файл знайшов аудит.
# Застосовувати його ми будемо рівно один раз, щоб побачити проблему на власні очі.
#
# Три кроки лаби, щоб не загубитися:
#   secrets-demo-naive.yaml   <- ви тут: пароль бачить кожен, хто відкрив файл
#   secrets-demo-secret.yaml     пароль винесений в окремий об'єкт Secret
#   secrets-demo.yaml            пароля в маніфесті немає взагалі
#
# Де застосовується: ваш кластер `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Команда: kubectl apply -f secrets-demo-naive.yaml
#
# Пароль у цьому файлі навчальний і вигаданий, справжніх тут немає. Один об'єкт —
# Deployment; apiVersion, kind та metadata.name далі не коментуються.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # Однієї копії достатньо: ми дивимося не на відмовостійкість, а на те,
  # звідки застосунок бере пароль.
  replicas: 1
  # За цією міткою Deployment впізнає свої Pod. Збігається з міткою в template нижче.
  selector:
    matchLabels:
      app: secrets-demo
  # template — шаблон Pod: з чого збирати копію.
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # Вимоги безпеки: не від root, обмежений набір системних викликів.
      # Зверніть увагу на розрив: Pod налаштований за всіма правилами ІБ, і це ніяк
      # не заважає паролю лежати у файлі десятьма рядками нижче.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Справжнього застосунку тут немає — busybox і кілька рядків на shell.
          # Для цієї лаби важливо лише одне: звідки береться пароль, а не що з ним
          # роблять далі.
          image: busybox:1.36
          env:
            # Адреса бази та ім'я користувача секретами не є: знання того, що
            # база називається passes-db, саме по собі доступу не дає.
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # ОСЬ ЦЕЙ РЯДОК І ЗНАЙШОВ АУДИТ.
            # Файл лежить у Git, отже пароль знає кожен, у кого є доступ
            # до репозиторію, і кожен, хто коли-небудь його клонував.
            - name: DB_PASSWORD
              value: "Propusk2019!"
          # Вічний цикл: раз на десять секунд друкує рядок у лог. У лог іде не сам
          # пароль, а його відбиток sha256 — перші дванадцять символів. За відбитком
          # видно, що пароль змінився, але відновити з нього значення не можна.
          # У справжніх сервісах логи пишуть саме так.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s підключаюся до %s як %s, відбиток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          # Апетити крихітні: це демонстрація, а не навантаження.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
