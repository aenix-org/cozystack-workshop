# Лаба 8 · щабель 3 із 3: пароля в маніфесті немає — ні відкритим текстом, ні в base64.
# Фінальний варіант. Цей файл можна класти в Git, показувати підряднику й друкувати
# на футболці.
#
# Чим цей щабель відрізняється від другого: там значення все ж було записане — у файлі
# і потім в об'єкті кластера. Тут його в описі немає зовсім; застосунок забирає
# пароль сам, у момент запуску, зі сховища OpenBao.
#
#   secrets-demo-naive.yaml      пароль бачить кожен, хто відкрив файл
#   secrets-demo-secret.yaml     пароль винесено в об'єкт Secret
#   secrets-demo.yaml         <- ви тут: пароль приїжджає зі сховища під час запуску
#
# ПЕРЕД ЗАСТОСУВАННЯМ: замініть tenant-workshopXX на свій namespace — він входить в адресу
# сховища нижче. XX — заглушка, а не частина імені.
# Де застосовується: ваш кластер `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Команда: kubectl apply -f secrets-demo.yaml
#
# Токен, яким застосунок представляється сховищу, лежить у секреті passes-bao-token.
# Ви створюєте його командою, а не файлом: у цьому маніфесті є лише ім'я об'єкта,
# а ім'я секретом не є.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # Усе працює не від root. fsGroup потрібен тому, що контейнерів тут два: один
      # пише файл із паролем, інший його читає. Без спільної групи init-контейнер
      # напише файл, який основний не зможе відкрити, і ви півгодини будете думати,
      # де помилилися.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Місце, куди один контейнер покладе пароль, а інший його прочитає.
      # medium: Memory означає, що цей «диск» перебуває в оперативній пам'яті вузла
      # і на справжній диск не потрапляє ніколи: ні в бекап, ні в дамп тому, ні до того,
      # хто забере диск із сервера. Зник Pod — зник і вміст.
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      # init-контейнер відпрацьовує ДО основного і зобов'язаний завершитися успішно.
      # Не зможе забрати пароль — застосунок не запуститься зовсім, і це правильна
      # поведінка: сервіс без пароля до бази все одно неробочий, чесніше не піднятися,
      # ніж піднятися й сипати помилками в лог.
      initContainers:
        - name: fetch-secret
          # Беремо образ самого OpenBao заради однієї утиліти `bao` — його клієнта.
          # Свого коду писати не потрібно.
          image: openbao/openbao:2.5.1
          # bao kv get -field=password — забрати одне поле за одним шляхом, не весь
          # секрет. tr -d '\n' прибирає перенесення рядка, яке інакше потрапило б усередину
          # пароля: зайвий символ у кінці база не прийме, а шукати таке неприємно.
          # chmod 0400 — читати файл може лише власник.
          # set -e зупиняє скрипт на першій же помилці: інакше контейнер завершився
          # би успішно з порожнім файлом, і розбиратися довелося б уже в застосунку.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              bao kv get -field=password secret/passes/db \
                | tr -d '\n' > /secrets/db_password
              chmod 0400 /secrets/db_password
              echo "пароль отримано зі сховища OpenBao, у маніфесті його немає"
          # Адреса сховища й токен, яким застосунок доводить своє право читати.
          # Токен — за посиланням на об'єкт, створений командою; сюди, у файл, він не потрапляє.
          # В адресі tenant-workshopXX — та сама заглушка, яку треба замінити.
          env:
            - name: BAO_ADDR
              value: http://openbao-secrets.tenant-workshopXX.svc.cozy.local:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: passes-bao-token
                  key: token
          # Спільна папка. Цьому контейнеру її віддано на запис — він у неї пише.
          volumeMounts:
            - name: secrets
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Ліміти вищі, ніж у основного контейнера: утиліта OpenBao важча за busybox,
          # але живе вона кілька секунд, тож це не постійна плата.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      # Основний контейнер запускається лише після того, як init-контейнер закінчив.
      containers:
        - name: app
          image: busybox:1.36
          # Той самий цикл, що й на попередніх щаблях, але пароль тепер не в змінній
          # оточення, а у файлі: відбиток зчитується прямо з /secrets/db_password.
          # Змінні оточення видно у виводі kubectl describe pod і вони потрапляють у дампи
          # процесів; файл у пам'яті Pod — ні.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s підключаюся до %s як %s, відбиток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(sha256sum /secrets/db_password | cut -c1-12)"
                sleep 10
              done
          # Тут залишилися лише несекретні налаштування — адреса й логін.
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
          # Та сама папка, але лише на читання: зіпсувати чи підмінити пароль
          # застосунок не може, навіть якщо дуже захоче.
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
