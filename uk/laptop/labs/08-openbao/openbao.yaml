# Лаба 8 · замовлення сховища секретів OpenBao.
# Те саме, що ви замовите мишкою в дашборді — тільки текстом.
# Застосовується НЕ до лабораторного кластера, а до тенанта на кластері керування:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f openbao.yaml
#
# ПЕРЕД ЗАСТОСУВАННЯМ: замініть tenant-workshopXX на свій namespace. XX — заглушка,
# а не частина імені; свій номер ви отримали разом із паролем. Піде в чужий тенант —
# отримаєте відмову в доступі, і це найкращий з можливих результатів.
#
# kind: OpenBAO — це не вбудований об'єкт Kubernetes, а тип, який додає
# Cozystack. Ви описуєте, що вам потрібно, платформа сама розгортає Pod, диски
# й сервіси і далі сама їх оновлює. Найближче до замовлення послуги за каталогом,
# а не до встановлення софту на видану віртуалку.
apiVersion: apps.cozystack.io/v1alpha1
kind: OpenBAO
metadata:
  # Ім'я впливає не тільки на картку в дашборді: внутрішня адреса сховища
  # збирається з нього — openbao-secrets.<namespace>.svc.cozy.local. Перейменуєте —
  # правте адресу в secrets-demo.yaml і в змінній BAO_APP для check.sh.
  name: secrets
  namespace: tenant-workshopXX
spec:
  # Одна копія. У проді ставлять три й отримують Raft-реплікацію: чарт вмикає
  # її сам, щойно replicas > 1. Перемикання туди-назад вимагає
  # перенесення даних, тому рішення приймають до, а не після.
  replicas: 1
  # Диск під дані сховища. Два гігабайти — із запасом: секрети важать байти,
  # місце йде на історію версій і журнал аудиту. Зменшити том після створення
  # не можна, збільшити зазвичай можна, тому дрібнитися тут ні до чого.
  size: 2Gi
  # Клас сховища replicated означає, що дані лежать у кількох копіях на
  # різних вузлах. Відмова вузла не забирає з собою всі ваші паролі — а відновлювати
  # сховище секретів з бекапу захід окремо неприємний.
  storageClass: replicated
  # Готовий набір «скільки процесора й пам'яті». Платформа пропонує їх списком,
  # щоб не змушувати кожного рахувати запити й ліміти вручну.
  resourcesPreset: t1.small
  # Веб-інтерфейс піднімається всередині кластера. Назовні ми його не виставляємо:
  # external: true повісив би LoadBalancer, а нам він у лабі не потрібен.
  ui: true
  external: false
