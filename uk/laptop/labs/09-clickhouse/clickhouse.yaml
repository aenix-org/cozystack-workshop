# Лаба 9 · замовлення бази ClickHouse для аналітики за журналом проходів.
# Опис того, що ви хочете отримати; збирає та налаштовує сервіс платформа.
# Те саме, що ви замовите мишкою в дашборді — тільки текстом.
# Застосовується НЕ в лабораторний кластер, а в тенант на кластері керування:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f clickhouse.yaml
#
# ПЕРЕД ЗАСТОСУВАННЯМ: замініть tenant-workshopXX на свій namespace,
# а ЗдесьВашПароль — на пароль, який ви вигадаєте.
apiVersion: apps.cozystack.io/v1alpha1
kind: ClickHouse
metadata:
  name: analytics
  namespace: tenant-workshopXX
spec:
  # Одна копія та один шард. У проді тримають мінімум дві копії, інакше втрата вузла
  # означає недоступність даних, — але нам потрібен мільйон рядків, а не відмово-
  # стійкість, і зайва копія просто з'їла б ресурси тестового середовища.
  replicas: 1
  shards: 1
  # Диск під дані таблиць. Мільйон рядків із цієї лаби займе десятки мегабайт:
  # колонкове зберігання зі словниками стискає такий журнал дуже сильно.
  size: 5Gi
  # Окремий диск під системні журнали сервера, включно з журналом запитів.
  logStorageSize: 2Gi
  # Через скільки днів викидати журнал запитів. Ми будемо в нього дивитися.
  logTTL: 15
  # replicated — томи, у яких є копія на іншому вузлі кластера: вузол випав,
  # дані залишилися.
  storageClass: replicated
  # 1 процесор, 4 ГБ. ClickHouse рахує в пам'яті, і на групуваннях за
  # мільйоном рядків це помітно.
  resourcesPreset: u1.small
  # Користувач бази та його пароль. Пароль вигадайте свій і запам'ятайте: він потрібен
  # робочому Pod (змінна CH_AUTH) і скрипту перевірки (змінна CH_PASSWORD).
  # Після створення його видно в дашборді, у секреті clickhouse-analytics-credentials.
  users:
    analyst:
      password: ЗдесьВашПароль
  # Резервні копії в об'єктне сховище. Дані тут згенеровані,
  # відновлювати нічого — у тестовому середовищі вимкнено.
  backup:
    enabled: false
  # Keeper потрібен для узгодження між копіями. Копія одна — узгоджувати
  # нема з ким, а три Pod Keeper зайняли б ресурси марно.
  clickhouseKeeper:
    enabled: false
