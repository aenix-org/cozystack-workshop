---
# Лаба 7 · заглушка легасі-довідника співробітників.
# У житті це чужа система, яку вам не віддадуть переписувати: вона відповідає 800 мс,
# і з цим доводиться якось жити. Тут — заглушка з тією ж поведінкою, щоб було що вимірювати.
#
# Де застосовується: ваш кластер `lab` (export KUBECONFIG=~/lab.kubeconfig), не керуючий
# кластер Cozystack. Команда: kubectl apply -f hr-legacy.yaml
#
# HARBOR-HOST — заглушка, а не адреса. Підставте адресу свого Harbor, інакше кластер піде
# завантажувати образ з неіснуючого хоста:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # macOS
#
# У файлі два об'єкти, розділені рядком `---`: Deployment (хто запускається і в скількох
# копіях) і Service (постійне ім'я, за яким у ці копії ходять). У кожного об'єкта
# apiVersion і kind кажуть, що це за об'єкт, а metadata.name — як він називається;
# далі по файлу ці три поля не коментуються.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-legacy
  labels:
    app: hr-legacy
spec:
  # Скільки копій тримати запущеними. Зникне копія — кластер створить нову, не
  # питаючи. Довіднику вистачає однієї: він тут не для навантаження, а для заміру.
  replicas: 1
  # За цією міткою Deployment впізнає свої Pod серед усіх інших у кластері.
  # Мітка в selector і мітка в template нижче зобов'язані збігатися, інакше об'єкт
  # не знайде те, що сам же і створив.
  selector:
    matchLabels:
      app: hr-legacy
  # template — шаблон Pod. Все, що нижче, описує одну копію: з чого її збирати,
  # з якими правами запускати і як зрозуміти, що вона готова приймати запити.
  template:
    metadata:
      labels:
        app: hr-legacy
    spec:
      # Вимоги безпеки рівня Pod. Процес працює не від root (uid 10001),
      # профіль seccomp відсікає системні виклики, які застосунку не потрібні.
      # У кластері з увімкненими політиками Pod без цих полів не запуститься зовсім.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Harbor закритий логіном і паролем, і кластеру потрібно чимось представитися. Секрет
      # `harbor` ви завели в лабі про реєстр. Без цього посилання образ не завантажиться,
      # і Pod залишиться в стані ImagePullBackOff.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: hr
          # Те саме, що й на рівні Pod, але для конкретного контейнера: забороняємо
          # підвищення прав і відбираємо всі ядрові привілеї. Застосунку на Go
          # жодна з них не потрібна.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Образ один і той самий для довідника і для самого сервісу «Перепустка».
          # Ким саме запуститься процес, вирішує змінна MODE нижче.
          image: HARBOR-HOST/passes/passes-api:v2
          # У порту є ім'я, а не тільки номер: проба готовності і Service нижче
          # посилаються на ім'я. Зміниться номер — правити доведеться в одному місці.
          ports:
            - containerPort: 8080
              name: http
          # Змінні оточення — єдиний спосіб налаштувати цей застосунок.
          # Перезбирати образ заради зміни поведінки не потрібно.
          env:
            # MODE=hr — екземпляр вдає кадрову систему: чекає і відповідає.
            - name: MODE
              value: "hr"
            # Рівно та затримка, яку показує справжній довідник.
            # Змінюючи її, ви змінюєте «наскільки все погано» — спробуйте потім 2s.
            - name: HR_DELAY
              value: "800ms"
            # Своє ім'я Pod заздалегідь не знає — його призначає кластер при створенні.
            # fieldRef підставляє це ім'я у змінну вже на старті, і воно
            # потрапляє у відповідь сервісу: видно, яка саме копія відповіла.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # requests — скільки ресурсів резервується під контейнер при виборі вузла,
          # limits — стеля, вище якої його не пустять. Схоже на reservation
          # і limit у vSphere, але задається на контейнер, а не на віртуальну машину.
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # Проба готовності. Поки /healthz не відповість, Service не надішле в цю копію
          # жодного запиту. Без проби трафік піде в ще не запущений процес,
          # і ви побачите помилки на рівному місці — при тому що «все розгорнулося».
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — постійне ім'я і постійна адреса для набору Pod. Pod перестворюються
# і щоразу отримують новий IP, а ім'я hr-legacy залишається тим самим. Схоже на VIP
# балансувальника, але заводиться чотирма рядками і живе всередині кластера.
apiVersion: v1
kind: Service
metadata:
  name: hr-legacy
spec:
  # За цією міткою Service набирає список живих копій. Та сама мітка, що у Pod вище:
  # не збіжиться — Service буде існувати і не вести нікуди.
  selector:
    app: hr-legacy
  ports:
    # Звертаються за 80-м портом, усередину Pod це йде на порт з ім'ям http (8080).
    - port: 80
      targetPort: http
