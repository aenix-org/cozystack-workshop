---
# Лаба 7 · робоче ввімкнення кешу. Застосовується поверх уже розгорнутого passes-api
# у вашому кластері `lab` (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch.yaml
#
# Це патч, а не повний маніфест: тут описано лише те, що змінюється. Усе інше —
# образ, мітки, проби, ресурси — залишається з passes-api.yaml незмінним. Саме тому файл
# і починається одразу зі spec: шлях до контейнера повторює структуру Deployment, щоб
# кластер зрозумів, куди саме вносити правку.
#
# Ім'я контейнера `api` — не прикраса, а адреса: за ним кластер знаходить потрібний контейнер
# у списку. Помилитеся в імені — замість правки отримаєте другий контейнер.
#
# Підставте адресу свого Redis замість REDIS-ADDR — це заглушка, а не ім'я хоста.
# Адресу ви берете в дашборді, у картці свого managed-застосунку Redis.
spec:
  template:
    spec:
      containers:
        - name: api
          # Списки env у Kubernetes зливаються за полем name, тому три записи нижче
          # додадуться до тих, що вже є в Deployment, а не замінять їх собою.
          env:
            # Поява цієї змінної і є «ввімкнути кеш»: застосунок перевіряє її
            # на старті і, якщо вона задана, ходить спочатку в Redis. Порожня або
            # відсутня — працює як раніше, через довідник на кожен запит.
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
            # Пароль не пишемо текстом: він приїжджає із секрету, який ви
            # створите окремою командою. У маніфесті, що лежить у Git,
            # паролю не місце.
            #
            # secretKeyRef — це посилання: name — ім'я об'єкта-секрету в тому самому кластері,
            # key — яке поле всередині нього взяти. Значення підставляється при запуску
            # Pod і у файлі не з'являється ніколи.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
            # Скільки секунд запис живе в кеші. Шістдесят — тому що
            # довідник співробітників змінюється раз на день, а не раз на секунду.
            #
            # Більший строк — рідше ходимо в довідник, але довше віддаємо застаріле
            # прізвище. Менший — дані свіжіші, виграш менший. Це компроміс,
            # а не налаштування з правильним значенням.
            - name: CACHE_TTL
              value: "60"
