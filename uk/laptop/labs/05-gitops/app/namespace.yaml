---
# Лабораторна 5 · Інфраструктура в Git. namespace для сервісу «Перепустка».
#
# Вручну цей файл у кластер не застосовується. Ви кладете його у свій репозиторій на
# GitHub, у папку apps/, а в кластер `lab` його переносить Flux — сам, за розкладом:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# Як читати будь-який маніфест: apiVersion — версія схеми опису (за нею кластер знає,
# як його розбирати), kind — що створюємо, metadata.name — ім'я, за яким об'єкт потім
# шукати. Ці три поля є в кожному об'єкті й нижче окремо не пояснюються.
#
# namespace (namespace) — логічна перегородка всередині одного кластера:
# своя область видимості імен, свої права, свої квоти. Найближче у vSphere — папка
# у дереві vCenter або resource pool.
#
# Навіщо він лежить у Git разом із застосунком, а не створений вручну: коли сервіс поїде
# з репозиторію, Flux прибере і namespace. Не залишиться порожньої перегородки,
# про яку за півроку ніхто не згадає, навіщо її заводили.
apiVersion: v1
kind: Namespace
metadata:
  name: passes
  # Мітка на роботу сервісу не впливає — вона потрібна, щоб однією командою знайти все,
  # що стосується «Перепустки»: kubectl get all -A -l app.kubernetes.io/part-of=passes.
  # Ім'я part-of узято із загальноприйнятого набору міток Kubernetes, а не вигадане нами:
  # чужі інструменти (моніторинг, вивантаження) шукають саме його.
  labels:
    app.kubernetes.io/part-of: passes
