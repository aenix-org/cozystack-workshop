# Лаба 13. Значення за замовчуванням для чарта «Перепусткаи».
#
# Це відповіді на запитання, які чарт ставить під час розгортання: скільки копій, який
# текст на сторінці, чи потрібна зовнішня адреса. Тут вони записані на випадок «нічого не
# обирали». Той, хто замовляє застосунок, їх перевизначає: у дашборді — полями форми,
# у терміналі — ключем `--set replicas=5` або власним файлом `helm install ... -f my.yaml`.
# Редагування цього файлу змінює умовчання для майбутніх замовлень, а не для вже розгорнутих.
#
# Як значення звідси перетворюються на форму замовлення в дашборді:
#   тип        — яке поле показати: {int} число, {bool} перемикач,
#                {string} рядок вводу, {struct} вкладена група полів;
#   Опис       — підпис поля та підказка під ним;
#   =значення  — що вже стоїть у полі, коли форму відкрили;
#   обов'язковість — задається списком required у схемі. Тут його немає: у кожного
#                параметра є значення за замовчуванням, тому пропустити можна будь-яке поле.
# Тому описи пишуться англійською: їх читає не лише автор чарта, а й будь-хто,
# хто замовляє застосунок у дашборді.

## Коментарі виду `## @param` — не прикраса. За ними генератор Cozystack
## (cozyvalues-gen) збирає values.schema.json і таблицю параметрів у README.
## Формат: ## @param {тип} ім'я=значення-за-замовчуванням - Опис.

# Скільки копій застосунку тримати запущеними. Одна копія — простій під час
# перезапуску вузла, дві переживають втрату будь-якої з них.
## @param {int} replicas=2 - Number of application replicas.
replicas: 2

# Текст на головній сторінці. Винесений у параметри, тому що в кожної дочірньої компанії
# він свій, а збирати заради цього окремий образ ніхто не стане.
## @param {string} greeting=Order a pass for your guest - Text shown on the main page.
greeting: "Order a pass for your guest"

# Чи потрібна застосунку адреса за межами кластера. Угода каталогу Cozystack:
# поле з іменем external означає для всіх застосунків одне й те саме — зовнішній доступ.
## @param {bool} external=false - Enable external access from outside the cluster.
external: false

# Розмір однієї копії. Винесений окремою групою полів, щоб у формі замовлення це
# виглядало як один блок «ресурси», а не як два непов'язані поля.
## @typedef {struct} Resources - CPU and memory for each replica.
## @field {quantity} cpu - CPU available to each replica.
## @field {quantity} memory - Memory (RAM) available to each replica.

## @param {Resources} resources - Explicit CPU and memory configuration.
resources:
  cpu: 100m
  memory: 128Mi
