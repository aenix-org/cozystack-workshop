---
# Лаба 6 · Свій приватний реєстр образів. ЦЕЙ ФАЙЛ НАВМИСНО НЕПОВНИЙ.
#
# Він не запрацює, і це задумано: ви маєте побачити відмову на власні очі й самі
# зрозуміти, чого кластеру не вистачило. Не вистачає тут одного — того, чим кластер
# називається закритому реєстру, коли приходить по образ. Реєстр не віддає образи
# будь-кому, а в цьому описі немає нічого, що допомогло б кластеру довести своє
# право. Який саме рядок це лагодить — розберете по ходу лаби; робочий варіант
# лежить поруч, у passes.yaml, і відкривати його до розбору сенсу немає.
#
# Тут лише Deployment, без Service: постійне ім'я сервісу поки не потрібне —
# до Pod, що відповідає, ми все одно не дістанемося, раз образ не завантажується.
#
# Застосовується на вашому кластері `lab`, у namespace за замовчуванням:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f passes-broken.yaml
#     kubectl get pods -l app=passes-api -w
#
# УВАГА: HARBOR-HOST — заглушка, а не робоча адреса. Підставте адресу свого Harbor,
# інакше отримаєте не ту помилку, заради якої файл написано (рядків із заглушкою два):
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # macOS
#
# В об'єкті нижче: apiVersion — версія схеми опису, kind — що створюємо,
# metadata.name — ім'я об'єкта. Окремо далі не пояснюються.
#
# Deployment — це не «запусти контейнер», а «тримай запущеними стільки-то копій ось
# такого контейнера». Копія зникне — кластер створить нову, не питаючи.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Одна копія: щоб розбирати відмову, вистачить і однієї, а в логах і у виводі
  # kubectl describe буде менше шуму.
  replicas: 1
  # Умова «мої копії — це Pod з міткою app: passes-api». Мітка у зразку Pod нижче
  # має збігатися з цією, інакше кластер відхилить маніфест.
  selector:
    matchLabels:
      app: passes-api
  # Зразок, за яким штампуються копії. Все, що всередині, описує один Pod.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Обмеження безпеки на весь Pod: не запускати від root, працювати під
      # непривілейованим користувачем 10001, обмежити набір системних викликів
      # стандартним профілем. Образ зібрано під це саме (див. app/Dockerfile, рядок USER).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Права на рівні контейнера: не додавати собі привілеїв і віддати всі особливі
          # повноваження ядра. Застосунку потрібен один мережевий порт, решта зайва.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Перша частина імені образу — адреса реєстру. Саме тому переїзд на свій
          # реєстр змінює маніфести: ім'я образу стає іншим. Не будь адреси,
          # кластер пішов би по образ у Docker Hub — тобто туди, куди ІБ заборонила.
          image: HARBOR-HOST/passes/passes-api:v1
          # Порт застосунку. Ім'я `http` далі використовується перевіркою готовності,
          # тож номер порту задано в одному місці, а не у двох.
          ports:
            - containerPort: 8080
              name: http
          # Змінні оточення, з яких застосунок дізнається, хто він і звідки приїхав.
          # Рівно їх він і друкує у відповіді (див. app/main.go, структура identity).
          # APP_VERSION і IMAGE_REGISTRY задані текстом — їх пишемо ми самі; три наступні
          # заповнює сам кластер у момент запуску копії, застосунку їх знати нізвідки.
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — що зарезервувати під копію: за цими числами планувальник обирає
          # вузол. limits — стеля: за пам'ять вище стелі контейнер убивають, за
          # процесор — пригальмовують. 16Mi вистачає тому, що застосунок на Go без
          # залежностей. 20m — двадцять тисячних процесорного ядра.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Перевірка готовності: доки застосунок не відповість на /healthz, трафік на копію
          # не піде. Сьогодні до неї справа не дійде — вона перевіряє вже запущений
          # процес, а в нас застрягне більш ранній крок, завантаження образу.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
