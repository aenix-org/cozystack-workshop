---
# Лаба 11. Бакет для зібраних APK.
#
# Бакет — іменована область в об'єктному сховищі: файли кладуть і забирають цілком,
# по HTTP, і нікуди не монтують. Каталогів усередині немає, слеш в імені об'єкта малюється
# деревом лише в інтерфейсі.
#
# Це тенантний об'єкт: він живе НЕ в кластері `lab`, а у вашому namespace
# на кластері керування. Тому kubeconfig тут потрібен тенантний,
# а не той, яким ви працюєте з кластером `lab`. Так і задумано: артефакти збірки
# мають пережити кластер, у якому збиралися.
#
# Перед застосуванням замініть tenant-workshopXX на свій namespace, інакше замовлення поїде
# не у ваш тенант і, найімовірніше, не пройде за правами.
#
#     export KUBECONFIG=~/.kube/workshop
#     kubectl apply -f bucket.yaml
#
# Те саме робиться мишкою в дашборді тенанта (Створити застосунок -> Bucket).
# Результат однаковий; різниця в тому, що текст можна відрев'юїти і покласти в Git.
#
# Що станеться після застосування: платформа підніме бакет за кілька секунд
# і випустить ключі доступу, склавши їх у секрет bucket-builds-ci-credentials у тому ж
# namespace. Чотири значення звідти (endpoint, bucketName, accessKey, secretKey)
# переносяться в кластер `lab` руками — кластери різні, само нічого не переїде.
apiVersion: apps.cozystack.io/v1alpha1
kind: Bucket
metadata:
  # Ім'я об'єкта Cozystack, і тільки його. Справжнє ім'я бакета в сховищі платформа
  # видає сама — довге, виду bucket-a9209f83-... Воно потрапить у поле bucketName
  # випущеного секрета, і в збірку підставляти треба саме його, а не `builds`.
  name: builds
  namespace: tenant-workshopXX
spec:
  users:
    # Кожен ключ цієї карти — окремий користувач S3 зі своєю парою ключів.
    # Порожній об'єкт означає «повний доступ на читання і запис».
    # Так можна видати збирачеві запис, а мобільній команді — тільки читання:
    #   ci: {}
    #   mobile:
    #     readonly: true
    ci: {}
