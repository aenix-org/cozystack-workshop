# Antes de aplicar, reemplace tenant-workshopXX por su namespace.
# Es más fácil hacerlo en todos los archivos a la vez: consulte el README, la sección sobre la sustitución del número.
# Además: en el campo url de abajo, inserte el enlace presigned de convert.sh (paso 2).
#
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  source:
    http:
      url: "ВСТАВЬТЕ_PRESIGNED_URL"  # de convert.sh (línea Share:)
  storage: 10Gi
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  instanceType: u1.medium
  instanceProfile: centos.7
  runStrategy: Always
  disks:
    - name: app-1
# El acceso a la aplicación desde el exterior es mediante `virtctl port-forward` (consulte el README).
# el LoadBalancer external en este entorno (Cilium + robotlb) no funciona para las VM,
# por eso NO habilitamos external aquí.