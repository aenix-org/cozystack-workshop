---
# Lab 11. La compilación en sí: un script en un ConfigMap y un Job que lo ejecuta.
# Dos objetos en un mismo archivo, separados por una línea `---`.
#
# Se aplica en tu clúster de formación `lab`, no en el tenant del clúster de gestión:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f android-build.yaml
# Aquí no hay marcadores como tenant-workshopXX — no necesitas sustituir tu número en ningún sitio.
#
# Antes de aplicar, en el clúster ya deben existir dos objetos, de lo contrario el pod de compilación no arrancará:
# el clúster no monta lo que no existe, y el pod se queda esperando.
#     configmap/propusk-src   fuentes: kubectl apply -f propusk-src.yaml
#     secret/bucket-creds     cuatro claves de acceso al bucket, se introducen a mano
#
# Job, no Deployment: una compilación tiene un final. Un Deployment interpreta un proceso terminado
# como un fallo y levanta una copia nueva — la compilación entraría en bucle y nunca se detendría.
#
# POR QUÉ EL SCRIPT DE COMPILACIÓN VIVE COMO UN OBJETO SEPARADO en lugar de como una cadena en el propio campo command del Job:
#   - sesenta líneas de shell dentro de un campo YAML no se pueden leer ni comprobar: aquí es
#     un archivo normal que el editor resalta y que acepta `bash -n`;
#   - se ve completo con un solo comando: kubectl get configmap android-build-script -o yaml;
#   - puedes corregir la compilación sin tocar la definición de la tarea, y viceversa.
# El precio de la comodidad: el script vive separado del Job. Cambia el ConfigMap — una
# compilación ya en marcha no lo notará; solo la siguiente ejecución verá el texto nuevo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: android-build-script
data:
  # Cinco pasos de compilación — exactamente los comandos que escribirías a mano en un servidor de compilación.
  # El contenedor arranca casi vacío: Java y Gradle vienen de la imagen, el resto lo trae
  # consigo el script.
  #   1/5  descarga las command-line tools — las utilidades con las que se instala el propio Android SDK (1-2 min)
  #   2/5  acepta las licencias e instala el SDK, la plataforma 34 y las build-tools. El paso más largo,
  #        5-15 minutos, y todo ese tiempo el log está en silencio: sdkmanager no imprime progreso
  #        en modo no interactivo. El silencio aquí no es un cuelgue
  #   3/5  gradle :app:assembleDebug — compila las fuentes de /src en un APK (3-8 minutos)
  #   4/5  instala mc, el cliente de consola para el almacenamiento de objetos
  #   5/5  coloca el APK en el bucket con dos nombres: uno con fecha y propusk-latest (segundos)
  #
  # Cada compilación tarda lo mismo: no hay caché, el disco /work es desechable (ver emptyDir
  # al final del archivo). En un servidor de compilación real habría en su lugar un volumen persistente, y una segunda
  # compilación se completaría en minutos.
  #
  # A continuación está el contenido literal del archivo build.sh, no YAML. Las líneas con almohadilla dentro de él
  # entran en el script tal cual: son comentarios de shell, y no hace falta quitarlos.
  build.sh: |
    #!/usr/bin/env bash
    # Aquí set -e es apropiado: esto no es una comprobación, es una compilación. Si un paso falla —
    # continuar no tiene sentido, el Job debe terminar con un error y quedarse
    # en el clúster con sus logs.
    set -euo pipefail

    WORK=/work
    export HOME="$WORK"
    export ANDROID_SDK_ROOT="$WORK/android-sdk"
    export ANDROID_HOME="$ANDROID_SDK_ROOT"
    export GRADLE_USER_HOME="$WORK/gradle-home"
    # El demonio de Gradle no hace falta en un contenedor desechable: vive para la siguiente
    # compilación, y no habrá siguiente compilación en este contenedor.
    # -Duser.home es obligatorio, y no es un duplicado del export HOME de arriba. Java toma el directorio
    # home no de la variable de entorno, sino del registro de usuario del sistema, y un
    # uid sin privilegios no tiene ninguno — Gradle sustituye "?" y falla al empaquetar el
    # APK: busca la clave de firma en una ruta del tipo /work/project/app/?/.android/.
    export GRADLE_OPTS="-Xmx3g -Dorg.gradle.daemon=false -Duser.home=$WORK"

    CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
    MC_URL="https://dl.min.io/client/mc/release/linux-amd64/mc"

    echo "== 1/5 ставлю Android command-line tools =="
    mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    cd "$ANDROID_SDK_ROOT/cmdline-tools"
    curl -fsSL -o tools.zip "$CMDLINE_TOOLS_URL"
    # unzip no está en todas las imágenes base, pero jar del JDK sabe descomprimir zip.
    unzip -q tools.zip 2>/dev/null || jar xf tools.zip
    rm -f tools.zip
    mv cmdline-tools latest
    export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

    echo "== 2/5 принимаю лицензии и качаю SDK (самый долгий шаг) =="
    # `yes` recibe SIGPIPE cuando sdkmanager cierra su entrada, y devuelve
    # un código distinto de cero. Con set -o pipefail eso haría fallar la compilación sin motivo,
    # así que el código de retorno se suprime aquí a propósito. Si las licencias realmente
    # no se aceptaron — el siguiente comando lo dirá.
    yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
    sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
      "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    echo "== 3/5 собираю APK =="
    # El ConfigMap se monta solo de lectura, y Gradle escribe junto a las fuentes,
    # por eso el árbol se copia primero al disco.
    # -L resuelve los enlaces simbólicos: un ConfigMap no se monta como archivos,
    # sino como enlaces al directorio interno ..data, y sin -L los enlaces acabarían en el proyecto.
    # Un glob en lugar de /src/. — para que ese propio directorio interno no se copie.
    mkdir -p "$WORK/project"
    cp -rL /src/* "$WORK/project/"
    cd "$WORK/project"
    gradle --no-daemon :app:assembleDebug

    APK="$WORK/project/app/build/outputs/apk/debug/app-debug.apk"
    ls -l "$APK"

    echo "== 4/5 ставлю клиент S3 =="
    # Ponemos el cliente en el directorio de trabajo, NO en /usr/local/bin. El pod corre como
    # un usuario sin privilegios, y los directorios de sistema de la imagen pertenecen a root:
    # escribir ahí terminaría en Permission denied — y precisamente aquí, en el cuarto paso,
    # es decir, tras media hora de compilación. El directorio /work nos pertenece, se puede escribir en él.
    mkdir -p "$WORK/bin"
    curl -fsSL -o "$WORK/bin/mc" "$MC_URL"
    chmod +x "$WORK/bin/mc"
    # PATH es la lista de directorios donde el shell busca comandos. Añadimos el nuestro para que más adelante
    # se pueda escribir simplemente `mc` en lugar de la ruta completa.
    export PATH="$WORK/bin:$PATH"

    echo "== 5/5 кладу APK в бакет =="
    # Las variables accessKey/secretKey/endpoint/bucketName vienen del Secret
    # a través de envFrom. Suprimimos la salida de alias set: no hace falta que imprima nada en el log.
    # Por el mismo motivo en el script no hay set -x — imprimiría las claves.
    # El alias se llama builds, no lab: la palabra `lab` designa el clúster de formación en todas las labs,
    # y no hay que confundir una cosa con la otra.
    mc alias set builds "https://${endpoint}" "${accessKey}" "${secretKey}" >/dev/null
    STAMP="$(date -u +%Y%m%d-%H%M%S)"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-${STAMP}.apk"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-latest.apk"
    # Línea marcadora: por ella check.sh distingue «el Job funcionó» de «el APK llegó».
    echo "APK-UPLOADED ${bucketName}/propusk/propusk-${STAMP}.apk"
    mc ls --recursive "builds/${bucketName}/propusk/"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: propusk-build
spec:
  # Cuántas veces recrear el pod si la compilación falla. Cero sería más honesto,
  # pero la red a veces parpadea al descargar el SDK, y un segundo intento es más barato
  # que la explicación «por qué me falló a mí».
  backoffLimit: 1
  # Un techo para toda la compilación. Sin él una compilación colgada mantendría el nodo hasta la noche.
  # La cuenta empieza desde la CREACIÓN del Job, no desde el arranque del contenedor: el tiempo en Pending y
  # la recreación del nodo un poco más adelante en la lab también lo consumen. Una hora no bastaba —
  # la compilación moría con DeadlineExceeded justo después de que la persona la hubiera esperado.
  activeDeadlineSeconds: 7200
  # La plantilla del pod: a partir de ella el Job estampa el pod en el que irá la compilación. El pod no tiene nombre
  # propio — el Job añade un sufijo aleatorio a su propio nombre, por eso hay que buscar el pod
  # por la etiqueta job-name, no por el nombre.
  template:
    spec:
      # La compilación descarga código ajeno de internet y lo ejecuta acto seguido. No necesita permisos de root
      # para eso: escribe solo en /work — incluido el cliente S3, que se descarga
      # ahí mismo, porque a un usuario sin privilegios no se le permitirá escribir en los directorios
      # de sistema de la imagen. Los mismos tres campos estaban en la aplicación
      # de la primera lab y por el mismo motivo: sin ellos el pod no se admite en un clúster donde
      # está habilitado el perfil de seguridad `restricted`.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # Para un Job este es un campo obligatorio. Never significa: no reiniciar un pod caído
      # en el sitio, sino entregar la decisión al Job — él creará uno nuevo.
      restartPolicy: Never
      containers:
        - name: build
          # La misma severidad a nivel de contenedor: elevarse los privilegios está prohibido,
          # se retiran todas las capabilities de linux, una por una.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Una imagen lista con Gradle y JDK 17. La versión del JDK no se elige de forma arbitraria: debe
          # coincidir con jvmTarget = "17" en app-build.gradle.kts, de lo contrario la compilación
          # fallará por un desajuste de versión de bytecode. En la imagen no hay Android SDK — lo
          # descarga el primer paso del script, porque las imágenes con el SDK dentro pesan decenas de
          # gigabytes y tardarían más en descargarse que el propio SDK.
          image: gradle:8.9-jdk17
          # Ejecutamos no lo que la imagen hace por defecto, sino nuestro propio script del ConfigMap,
          # montado en /scripts.
          command: ["bash", "/scripts/build.sh"]
          envFrom:
            # Las cuatro claves del secret se convierten en variables de entorno
            # con los mismos nombres: accessKey, secretKey, endpoint, bucketName.
            - secretRef:
                name: bucket-creds
          # El coste honesto de una compilación de Android, hallado de forma experimental. requests es cuánto
          # reservar: el planificador elige el nodo por este número, no por el consumo
          # real. El compilador de Kotlin no sobrevive con menos de cuatro gigabytes.
          # limits es el techo: por CPU, al toparse con él se ralentiza; por memoria, el
          # contenedor se mata (OOMKilled). Para comparar, a la aplicación de la primera lab
          # le bastaban 20m de CPU y 32Mi de memoria. Es precisamente por estos números que el nodo del clúster
          # de formación hay que agrandarlo: la compilación no cabe en el que se pidió en la lab 0.
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 6Gi
          # Tres volúmenes. Fuentes y script — solo de lectura: un ConfigMap se monta
          # read-only de todas formas, pero un readOnly explícito dice de inmediato que la compilación no escribe ahí.
          # Escribe en /work, y ese es el único sitio donde se le permite.
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: src
          configMap:
            name: propusk-src
            # Una clave de ConfigMap no puede contener una barra, pero la ruta de montaje
            # sí. Así es como un mapa plano se despliega en el árbol de directorios
            # que Gradle espera.
            items:
              - key: settings.gradle.kts
                path: settings.gradle.kts
              - key: build.gradle.kts
                path: build.gradle.kts
              - key: app-build.gradle.kts
                path: app/build.gradle.kts
              - key: AndroidManifest.xml
                path: app/src/main/AndroidManifest.xml
              - key: MainActivity.kt
                path: app/src/main/kotlin/io/aenix/propusk/MainActivity.kt
              - key: strings.xml
                path: app/src/main/res/values/strings.xml
        - name: scripts
          configMap:
            name: android-build-script
            # Permisos de los archivos del volumen: leer y ejecutar. El script se invoca como
            # `bash /scripts/build.sh`, por eso el bit de ejecución aquí es una red de seguridad — le
            # hará falta a quien un día ejecute el archivo directamente.
            defaultMode: 0755
        - name: work
          # Un disco temporal en el nodo, vive exactamente lo mismo que el pod.
          # Aquí caerán el SDK, las dependencias de Gradle y el resultado de la compilación.
          emptyDir:
            # Doce gigabytes con margen: el SDK, la caché de Gradle y el resultado de la compilación son
            # seis a ocho. El techo hace falta para que una compilación desmesurada no se coma el disco del nodo
            # por completo y no arrastre consigo a los pods vecinos.
            sizeLimit: 12Gi
