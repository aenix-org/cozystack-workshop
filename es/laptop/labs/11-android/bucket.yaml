---
# Lab 11. Un bucket para los APK compilados.
#
# Un bucket es un area con nombre en el almacenamiento de objetos: los archivos se suben y
# se descargan enteros, por HTTP, y nunca se montan en ningun sitio. No hay directorios dentro;
# la barra en el nombre de un objeto se dibuja como un arbol solo en la interfaz.
#
# Este es un objeto de tenant: vive NO en el cluster `lab`, sino en tu namespace
# en el cluster de gestion. Por eso el kubeconfig aqui debe ser el del tenant,
# no el que usas para trabajar con el cluster `lab`. Es asi a proposito: los artefactos de build
# deben sobrevivir al cluster en el que se compilaron.
#
# Antes de aplicar, reemplaza tenant-workshopXX por tu propio namespace, de lo contrario el pedido
# ira al tenant equivocado y lo mas probable es que no pase las comprobaciones de permisos.
#
#     export KUBECONFIG=~/.kube/workshop
#     kubectl apply -f bucket.yaml
#
# Lo mismo se hace con el raton en el dashboard del tenant (Crear aplicacion -> Bucket).
# El resultado es identico; la diferencia es que el texto se puede revisar y poner en Git.
#
# Que ocurre despues de aplicar: la plataforma levanta el bucket en pocos segundos
# y emite claves de acceso, guardandolas en el secreto bucket-builds-ci-credentials en el mismo
# namespace. Cuatro valores de ahi (endpoint, bucketName, accessKey, secretKey)
# se llevan al cluster `lab` a mano — los clusters son distintos, nada se mueve por si solo.
apiVersion: apps.cozystack.io/v1alpha1
kind: Bucket
metadata:
  # El nombre del objeto Cozystack, y solo eso. El nombre real del bucket en el almacenamiento lo
  # emite la propia plataforma — uno largo, del tipo bucket-a9209f83-... Aterrizara en el
  # campo bucketName del secreto emitido, y es exactamente ese el que debe sustituirse en
  # el build, no `builds`.
  name: builds
  namespace: tenant-workshopXX
spec:
  users:
    # Cada clave de este mapa es un usuario S3 independiente con su propio par de claves.
    # Un objeto vacio significa "acceso completo de lectura y escritura".
    # Asi puedes dar al compilador acceso de escritura, y al equipo movil — solo lectura:
    #   ci: {}
    #   mobile:
    #     readonly: true
    ci: {}
