---
# Lab 3. Escalamos réplicas según la carga del procesador.
# El objetivo es 50% de requests.cpu (20m), es decir, el umbral es 10m por pod.
# Elegido deliberadamente bajo: la carga debe dispararse en segundos,
# tenemos media hora para el lab, no medio día.
#
# Un solo objeto. Se aplica en tu clúster de prácticas `lab`, no en un tenant
# del clúster de gestión:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f hpa.yaml
# Aquí no hay marcadores como tenant-workshopXX — no hace falta sustituir tu número en ninguna parte.
#
# Dos condiciones sin las cuales el objeto se creará pero no funcionará:
#   1. El contenedor rickroll tiene requests.cpu definido — de lo contrario no hay nada de lo que calcular porcentajes,
#      y en la columna TARGETS de `kubectl get hpa` quedará para siempre <unknown>.
#   2. En el clúster funciona metrics-server — la fuente del consumo actual de los pods.
# Ambas condiciones las verifica check.sh en esta carpeta.
#
# Mientras el HPA exista, el campo replicas del Deployment le pertenece a él. Puedes cambiar el número
# de copias a mano con `kubectl scale`, pero el HPA restaurará el suyo en los próximos segundos.
# Por eso en el lab 4 este objeto se elimina antes del despliegue: dos mecanismos sobre un mismo campo —
# una forma garantizada de no entender qué pasó.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # El nombre del HPA no tiene por qué coincidir con el nombre de la aplicación — la coincidencia aquí es por comodidad.
  # A quién gestiona lo determina scaleTargetRef más abajo, no este nombre.
  name: rickroll
spec:
  # A quién mirar y qué campo replicas cambiar. Los tres campos juntos, porque un nombre
  # sin un tipo es ambiguo: un Deployment y un StatefulSet pueden llamarse igual.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rickroll
  # El corredor que el HPA no abandonará bajo ninguna carga. El límite inferior es la misma
  # copia única con la que empezó el lab. El superior es seis: es cuántas caben
  # en el nodo de prácticas con limits.cpu 300m y a la vez se nota a simple vista en la lista de pods.
  # Si pones maxReplicas: 1 el objeto se creará y no hará nada.
  minReplicas: 1
  maxReplicas: 6
  # En qué basar la decisión. Puede haber varias métricas, entonces el HPA toma la
  # que requiere más copias. Aquí hay solo una — el procesador.
  metrics:
    - type: Resource
      resource:
        name: cpu
        # Utilization — una fracción del requests.cpu del contenedor, no de la capacidad del nodo.
        # De ahí una consecuencia contraintuitiva: el valor tranquilamente llega al 600%, y eso
        # no es un error: el pod consume seis veces más de lo que reservó.
        # La alternativa es AverageValue, donde el umbral se fija en milinúcleos directamente.
        target:
          type: Utilization
          averageUtilization: 50
  # Con qué rapidez reaccionar. El bloque es opcional: sin él se usan los valores
  # por defecto, pensados para la operación en producción, no para una demostración.
  behavior:
    scaleUp:
      # Por defecto Kubernetes espera la estabilización y crece despacio.
      # En un lab esto parece que «no pasa nada», así que lo aceleramos.
      stabilizationWindowSeconds: 0
      # No más de dos copias nuevas cada quince segundos. El paso se eligió de forma
      # empírica: el crecimiento se ve como crecimiento, no como un salto instantáneo de una directamente a seis,
      # en el que el participante no tiene nada que observar.
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      # Pero hacia abajo es al revés — no instantáneo, de lo contrario los pods desaparecerían
      # antes de que el participante alcance a verlos.
      # Un minuto en lugar de los cinco por defecto: el lab dura media hora, esperar cinco de ellos
      # para la reducción no hay con qué llenarlos. En un clúster de producción una ventana larga sí es útil —
      # amortigua el vaivén en una carga irregular.
      stabilizationWindowSeconds: 60
