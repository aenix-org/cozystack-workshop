# Lab 3. Generador de carga Fortio: el generador en sí y una dirección estable para su
# interfaz web. Dos objetos, separados por `---`.
#
# Se aplica en tu clúster de práctica `lab`, no en un tenant del clúster de gestión:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f fortio.yaml
# Aquí no hay marcadores como tenant-workshopXX — no necesitas sustituir tu número en ninguna parte.
# Este mismo archivo hará falta en la lab 4: `kubectl apply -f ../03-scale/fortio.yaml`.
#
# Los campos comunes del manifiesto (apiVersion, kind, metadata.name, selector, template,
# securityContext) están explicados línea por línea en ../01-deploy/rickroll.yaml y aquí
# no se repiten. Comentamos solo lo que es propio del generador de carga.
---
# Generador de carga con interfaz web.
# Elegido en lugar de hey/ab a propósito: la carga se lanza con un botón en el navegador,
# y el histograma de latencias se ve ahí mismo. En talleres anteriores perdíamos
# gente justamente con las herramientas de consola.
#
# Fortio vive en el clúster como una aplicación normal y golpea la dirección de rickroll desde dentro.
# Cargarlo desde fuera, desde un portátil, sería más honesto en cuanto al tráfico, pero chocaría con el canal
# hasta el clúster, y estarías midiendo tu Wi-Fi en lugar de la aplicación.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # Con una sola copia del generador basta: produce carga en muchos hilos por sí misma.
  # Una segunda copia aquí solo difuminaría la imagen — los contadores de la interfaz web
  # son por copia, y verías la mitad de las peticiones.
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # El mismo perfil de seguridad que rickroll: se ejecuta sin root, un UID
      # concreto, seccomp estándar. Dejado a propósito — para que el archivo también pueda aplicarse
      # en un clúster con el perfil `restricted` activado, donde de otro modo el pod no arrancaría.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # El tag latest es una simplificación deliberada para el taller, para no cotejar versiones.
          # En un clúster de producción no se hace así: la imagen bajo este tag puede cambiar
          # sin avisar entre dos apply, y no podrás reproducir el resultado de ayer.
          image: fortio/fortio:latest
          # El modo `server` levanta la interfaz web y la mantiene en marcha. Sin este argumento
          # Fortio ejecutaría una única pasada desde la línea de comandos y saldría, y el clúster
          # reiniciaría el contenedor en bucle.
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            # La request es mayor que la del propio rickroll (20m): el generador necesita sitio en el nodo
            # de antemano, si no el planificador lo encajará muy justo y el arranque será irregular.
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # El generador necesita margen de CPU, si no chocará
              # con su propio límite y estarás cargando Fortio, no la aplicación.
              cpu: "1"
              memory: 256Mi
---
# Una dirección estable para el generador dentro del clúster. Necesaria para abrir la interfaz web
# desde un portátil vía `kubectl port-forward svc/fortio 8081:8080` — desde fuera el clúster
# no publica nada, y no hay otras puertas hacia Fortio.
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  ports:
    # 8080 en ambos lados: tanto el servicio como el contenedor. El número es el mismo que el de rickroll
    # dentro del pod, pero no hay colisión — cada pod tiene su propia pila de red.
    - port: 8080
      targetPort: http
