# Lab 10 · pedido de una base de datos MongoDB para pases de distinta forma.
# Descripción de lo que quieres obtener; la plataforma ensambla y configura el servicio.
# Lo mismo que pedirías con el ratón en el panel — solo que como texto.
# Se aplica NO al clúster de laboratorio, sino a un tenant en el clúster de gestión:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f mongodb.yaml
#
# ANTES DE APLICAR: reemplaza tenant-workshopXX por tu namespace,
# y ЗдесьВашПароль por una contraseña que se te ocurra.
apiVersion: apps.cozystack.io/v1alpha1
kind: MongoDB
metadata:
  name: passes
  namespace: tenant-workshopXX
spec:
  # Una sola copia. MongoDB está diseñada para un conjunto de réplicas de tres: votan quién
  # es el primario y sobreviven a la pérdida de uno. Con una sola copia no hay con quién votar,
  # y el chart activa para ello un modo «inseguro» aparte. Sirve para un laboratorio,
  # no para producción.
  replicas: 1
  # Disco para los datos. Un megabyte bastaría para cuatro documentos de aprendizaje, pero
  # luego es más fácil dimensionar el volumen con holgura que ampliarlo después.
  size: 5Gi
  # replicated — volúmenes que tienen una copia en otro nodo del clúster: un nodo se cae,
  # los datos permanecen.
  storageClass: replicated
  # CPU y memoria asignadas al pod de la base de datos. De sobra para cuatro documentos.
  resourcesPreset: s1.small
  # Rama de MongoDB. Cambiarla a posteriori en una base de datos viva no es posible sin una actualización.
  version: v8
  # false — la base de datos es accesible solo desde dentro del clúster, no se expone ningún puerto hacia afuera.
  # Accederás a ella desde un pod de trabajo iniciado a su lado.
  external: false
  # El sharding reparte los datos entre varios conjuntos de servidores. Se necesita cuando
  # los datos no caben en un solo servidor; cuatro pases sí caben.
  sharding: false
  # El usuario de la base de datos y su contraseña. Inventa tu propia contraseña y recuérdala: la necesita
  # el pod de trabajo (en la cadena de conexión MONGO_URI) y el script de comprobación
  # (la variable MONGO_PASSWORD). La cuenta se crea en la base de datos de servicio admin —
  # por eso authSource=admin es obligatorio en la cadena de conexión.
  users:
    passapp:
      password: ЗдесьВашПароль
  # La base de datos passes y los permisos en ella: al usuario passapp se le concede el rol admin de esta base de datos,
  # es decir, puede leer, escribir, construir índices y cambiar la configuración de las colecciones.
  # Esto no otorga derechos sobre otras bases de datos.
  databases:
    passes:
      roles:
        admin:
          - passapp
  # Copias de seguridad al almacenamiento de objetos. Desactivadas en el banco de aprendizaje.
  backup:
    enabled: false
