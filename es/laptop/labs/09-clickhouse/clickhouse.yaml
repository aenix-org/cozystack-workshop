# Lab 9 · pedido de una base de datos ClickHouse para analítica sobre el registro de accesos.
# Una descripción de lo que quieres obtener; la plataforma ensambla y configura el servicio.
# Lo mismo que pedirías con el ratón en el dashboard — solo que como texto.
# Se aplica NO al clúster de laboratorio, sino a un tenant en el clúster de gestión:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f clickhouse.yaml
#
# ANTES DE APLICAR: reemplaza tenant-workshopXX por tu namespace,
# y ЗдесьВашПароль por una contraseña que se te ocurra.
apiVersion: apps.cozystack.io/v1alpha1
kind: ClickHouse
metadata:
  name: analytics
  namespace: tenant-workshopXX
spec:
  # Una réplica y un shard. En producción mantienes al menos dos réplicas, de lo contrario perder un nodo
  # significa indisponibilidad de datos, — pero necesitamos un millón de filas, no tolerancia
  # a fallos, y una réplica extra simplemente devoraría los recursos del banco de pruebas.
  replicas: 1
  shards: 1
  # Disco para los datos de las tablas. Un millón de filas de esta lab ocupará decenas de megabytes:
  # el almacenamiento columnar con diccionarios comprime muy fuertemente un registro así.
  size: 5Gi
  # Un disco separado para los registros del sistema del servidor, incluido el registro de consultas.
  logStorageSize: 2Gi
  # Tras cuántos días descartar el registro de consultas. Vamos a mirarlo.
  logTTL: 15
  # replicated — volúmenes que tienen una copia en otro nodo del clúster: un nodo se cayó,
  # los datos permanecieron.
  storageClass: replicated
  # 1 procesador, 4 GB. ClickHouse calcula en memoria, y en los group-by sobre un
  # millón de filas esto se nota.
  resourcesPreset: u1.small
  # El usuario de la base de datos y su contraseña. Piensa tu propia contraseña y recuérdala: la necesita
  # el pod de trabajo (variable CH_AUTH) y el script de verificación (variable CH_PASSWORD).
  # Tras la creación es visible en el dashboard, en el secreto clickhouse-analytics-credentials.
  users:
    analyst:
      password: ЗдесьВашПароль
  # Copias de seguridad al almacenamiento de objetos. Los datos aquí están generados,
  # no hay nada que restaurar — desactivado en el banco de pruebas de entrenamiento.
  backup:
    enabled: false
  # Keeper es necesario para la coordinación entre réplicas. Hay una sola réplica — no hay nada
  # con qué coordinar, y tres pods de Keeper desperdiciarían recursos para nada.
  clickhouseKeeper:
    enabled: false
