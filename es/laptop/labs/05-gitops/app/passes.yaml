---
# Lab 5 · Infraestructura en Git. El propio servicio «Pase»: cuatro objetos en un archivo.
#
# No se aplica al clúster a mano. El archivo se coloca en su propio repositorio en GitHub, en la carpeta
# apps/, junto a namespace.yaml, y al clúster `lab` lo traslada Flux — por sí solo:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# La línea --- separa los objetos: un archivo, cuatro objetos independientes. El orden en el archivo
# no influye en el orden de creación — el clúster lo resolverá por sí solo.
#
# En cada objeto: apiVersion — la versión del esquema de descripción, kind — qué creamos,
# metadata.name — el nombre del objeto, metadata.namespace — en qué compartimento del clúster
# vive. Más adelante estos campos no se explican por separado.
#
# En ninguno de los cuatro objetos hay contraseña, ni clave, ni token, y esto no es
# casualidad: lo que llega a Git se queda allí para siempre — la historia puede reescribirse, pero
# todos los que alcanzaron a clonarlo conservan la copia antigua. Los secretos no tienen lugar aquí.

# --- 1 de 4. Configuración del servidor web ----------------------------------------
# Un ConfigMap coloca en el clúster un archivo de texto aparte de la aplicación, y más abajo (en la
# sección volumes) ese archivo se monta dentro del contenedor. La idea es cambiar la configuración sin
# reconstruir la imagen: editas aquí, haces commit, y un minuto después el clúster tiene la nueva versión.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-conf
  namespace: passes
# La clave dentro de data se convierte en el nombre del archivo en el contenedor: default.conf caerá en la carpeta
# que nginx lee al arrancar. La barra vertical después del nombre es la forma de escribir
# texto de varias líneas tal cual en YAML, conservando los saltos de línea.
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      # La dirección para la comprobación de disponibilidad. El clúster llama aquí y no envía
      # tráfico a una copia hasta recibir respuesta.
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        # En la página servida sustituimos __POD__ por el nombre de la máquina donde funciona
        # nginx. Dentro del pod el nombre de la máquina es el nombre del propio pod.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
    }
---
# --- 2 de 4. La página que sirve el servicio ---------------------------------------
# En esta lab la página es un marcador de posición: la aplicación real aparecerá más tarde. Ahora importa
# no qué muestra el servicio, sino de dónde salió en el clúster. El texto __POD__ en el marcado es
# una marca de sustitución: nginx la reemplazará por el nombre del pod que sirvió la página, y por ese
# nombre verás más adelante que las copias pasaron a ser más de una.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-page
  namespace: passes
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Pase de invitado</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 40rem;
               color: #222; }
        h1 { font-weight: 600; }
        .v { display: inline-block; padding: .2rem .6rem; border-radius: .3rem;
             background: #eef; font-family: ui-monospace, monospace; }
        .pod { margin-top: 2rem; color: #666; font-size: .9rem; }
        b { font-family: ui-monospace, monospace; color: #222; }
      </style>
    </head>
    <body>
      <h1>Servicio «Pase de invitado»</h1>
      <p>Solicitud de pase de invitado. Versión <span class="v">v1</span></p>
      <p>Desplegado desde Git. Nadie tocó esto a mano.</p>
      <div class="pod">te atendió el Pod <b>__POD__</b></div>
    </body>
    </html>
---
# --- 3 de 4. La descripción de la propia aplicación --------------------------------
# Un Deployment no es «ejecuta un contenedor», sino «mantén ejecutándose tantas copias de tal
# contenedor». La diferencia se ve cuando una copia muere: el clúster crea una nueva sin
# preguntar y sin avisar. En vSphere lo más parecido es HA, pero allí se reinicia una máquina,
# mientras que aquí se recrea una copia de la aplicación, y esto se hace constantemente, no solo ante un fallo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes
  namespace: passes
  labels:
    app: passes
spec:
  # Cuántas copias mantener ejecutándose. La formulación importa: no «ejecuta una», sino
  # «mantén una». Este número lo cambiarás a través de Git y verás qué ocurre.
  replicas: 1
  # Por qué señal el Deployment reconoce sus copias. No es una lista de nombres de pods —
  # los nombres cambian en cada recreación — sino la condición «todos los pods con la etiqueta app: passes».
  # La etiqueta de abajo, en template.metadata.labels, debe coincidir con esta condición: si divergen
  # el clúster se negará a aceptar el manifiesto, porque las copias no serían de nadie.
  selector:
    matchLabels:
      app: passes
  # template — el patrón a partir del cual se estampan las copias. Todo lo que hay dentro describe un
  # pod. Editar el patrón significa desplegar una nueva versión: las copias antiguas se reemplazan por nuevas.
  template:
    metadata:
      labels:
        app: passes
    spec:
      # Restricciones de seguridad a nivel de todo el pod. En vSphere no hay análogo: allí la
      # aislación la da el hipervisor, mientras que los contenedores comparten el núcleo con el nodo, por eso
      # los permisos hay que recortarlos de forma explícita.
      #   runAsNonRoot   no arrancar si la imagen quiere funcionar como root
      #   runAsUser      bajo qué usuario numérico funcionar; 65532 — el identificador
      #                  «no privilegiado» aceptado en las imágenes mínimas
      #   seccompProfile qué llamadas al sistema están permitidas; RuntimeDefault — un conjunto
      #                  que corta lo evidentemente peligroso y no rompe nada
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Las mismas restricciones, pero ya sobre un contenedor concreto.
          #   allowPrivilegeEscalation: false  el proceso no podrá conseguir más permisos
          #   capabilities.drop: ["ALL"]       quitar todas las facultades especiales del núcleo
          #                                    (cambiar la red, montar, cambiar la hora);
          #                                    el servidor web no necesita ninguna
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # La imagen se toma de un registro público — en la siguiente lab seguridad lo prohibirá, y
          # la dirección cambiará a nuestro propio Harbor. La variante unprivileged se eligió no por estética:
          # la imagen nginx normal escucha en el puerto 80 y quiere para eso permisos de root, y con
          # runAsNonRoot arriba no arrancaría en absoluto.
          # La versión está fijada (1.27-alpine), no latest: de lo contrario el mismo
          # manifiesto mañana desplegaría una aplicación distinta, y no te enterarías.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # El puerto que escucha la aplicación. El nombre `http` no es un adorno: a él se
          # refieren la comprobación de disponibilidad de abajo y el Service al final del archivo. Si cambias
          # el número del puerto, tendrás que cambiarlo en un solo lugar, no en tres.
          ports:
            - containerPort: 8080
              name: http
          # requests — cuántos recursos se reservan de forma garantizada; por este número
          # el planificador elige el nodo. limits — el techo por encima del cual no se permite.
          # Subestimar requests significa que en el nodo cabrá más de lo que puede aguantar;
          # superar limits de memoria — el contenedor se mata, de procesador — se ralentiza.
          # 20m = veinte milésimas de núcleo, Mi = megabytes. Los valores aquí son pequeños,
          # porque el nodo en la lab es uno solo y no es grande.
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Comprobación de disponibilidad: el clúster llama a esta dirección y no envía tráfico
          # a una copia hasta recibir respuesta. Sin ella el Service enviaría solicitudes a un
          # nginx que aún no ha arrancado, y el usuario vería un error en cada despliegue.
          # También la espera Flux — en kustomization.yaml pedimos wait: true.
          #   initialDelaySeconds  esperar antes de la primera llamada, dar al proceso tiempo de arrancar
          #   periodSeconds        con qué frecuencia llamar después
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # Dónde dentro del contenedor colocar el contenido de los dos ConfigMap del inicio del archivo.
          # /etc/nginx/conf.d — la carpeta de la que nginx lee la configuración al arrancar,
          # /usr/share/nginx/html — la carpeta desde la que sirve los archivos.
          # La imagen no cambia por ello: los archivos aparecen en ella en el momento del arranque.
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: page
              mountPath: /usr/share/nginx/html
      # Qué exactamente montar. Los nombres conf y page son internos, enlazan este
      # bloque con los volumeMounts de arriba; name dentro de configMap es ya el nombre de un objeto real
      # en el clúster. Equivócate en él y el pod quedará colgado esperando un ConfigMap inexistente.
      volumes:
        - name: conf
          configMap:
            name: passes-conf
        - name: page
          configMap:
            name: passes-page
---
# --- 4 de 4. Un nombre permanente detrás del cual están todas las copias ------------
# Los pods se recrean, y sus direcciones son nuevas cada vez. El Service da un nombre invariable —
# passes.passes.svc.cluster.local — por el que dentro del clúster siempre se puede alcanzar
# las copias vivas. Es un balanceo interno; desde fuera del clúster aquí aún no se llega.
apiVersion: v1
kind: Service
metadata:
  name: passes
  namespace: passes
spec:
  # El enlace del Service con los pods no es una lista de direcciones, sino la condición «todos los pods con la etiqueta app: passes».
  # Apareció una copia nueva con esa etiqueta — entró en el balanceo por sí misma, no hay nada
  # que registrar. Desapareció — la quitaron del reparto.
  selector:
    app: passes
  # port — en qué puerto responde el propio Service, targetPort — a dónde reenvía
  # dentro del contenedor. Aquí targetPort se refiere al nombre `http` del bloque ports de arriba,
  # no al número: el número se puede cambiar en un solo lugar, y el enlace no se romperá.
  ports:
    - port: 80
      targetPort: http
