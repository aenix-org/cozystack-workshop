---
# Lab 5 · Infraestructura en Git. Tarea: qué exactamente del repositorio aplicar al clúster.
#
# Se aplica en tu clúster `lab` junto con el gitrepository.yaml contiguo:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# En cada objeto: apiVersion — la versión del esquema de descripción, kind — qué creamos,
# metadata.name — el nombre del objeto. Estos no se explican por separado más abajo.
#
# Separación de responsabilidades: GitRepository descarga el repositorio y no aplica nada,
# este objeto toma lo descargado y ajusta el clúster a ello. El nombre Kustomization coincide
# con el nombre de la utilidad kustomize, pero son cosas diferentes — aquí es un objeto en el clúster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passes
  # Vive en el mismo lugar que los servicios de Flux — de lo contrario el kustomize-controller no lo recogerá.
  namespace: flux-system
spec:
  # Con qué frecuencia reconciliar el estado real del clúster con el descrito en Git.
  # Esto no es «volver a aplicar una vez por minuto» — es «comparar una vez por minuto y
  # corregir las diferencias». Aunque nada haya cambiado en Git, un cambio hecho
  # a mano mediante kubectl edit se revertirá silenciosamente. Verás la diferencia
  # un poco más adelante en la lab, cuando tú mismo cambies algo en el clúster por fuera de Git.
  interval: 1m
  # La carpeta dentro del repositorio. Todo lo que hay en ella va al clúster; los archivos junto
  # a ella — por ejemplo README.md en la raíz — no se tocan. El nombre `apps` lo elegimos nosotros, pero
  # debe coincidir con la carpeta en la que colocas los manifiestos en tu propio repositorio.
  path: ./apps
  # Eliminar del clúster los objetos que han desaparecido de Git.
  # Sin esto, Git deja de ser la descripción completa: algo eliminado del repositorio
  # seguiría ejecutándose en el clúster, y nadie lo sabría.
  prune: true
  # Qué fuente observar. El nombre `passes` es metadata.name de gitrepository.yaml,
  # no el nombre del repositorio en GitHub. Si lo renombras allí — corrígelo aquí también, de lo contrario Flux
  # esperará una fuente que no existe, y la Kustomization no quedará lista.
  sourceRef:
    kind: GitRepository
    name: passes
  # Esperar a que los recursos aplicados estén listos, en vez de informar de inmediato tras el apply.
  # La diferencia es exactamente la que hay entre «la solicitud se envió» y «la solicitud se completó»: sin wait
  # Flux informará éxito aunque los pods no lleguen a levantarse después.
  wait: true
  # Cuánto esperar esa preparación antes de declarar el apply como fallido.
  # Tres minutos — con margen para descargar la imagen en un nodo vacío. Un valor demasiado
  # pequeño da falsos fallos en una red lenta, uno demasiado grande — estarás
  # mirando «en progreso» durante mucho tiempo en lugar de un error claro.
  timeout: 3m
