# Clúster de Kubernetes de formación para los labs 1-14.
# Antes de aplicar, reemplaza tenant-workshopXX con tu propio namespace.
#
# Se aplica en el clúster de GESTIÓN — con el acceso que se entregó junto
# con el tenant. El kubeconfig de este clúster todavía no existe: aparece
# solo después de que el clúster se levante.
#
#   kubectl apply -f cluster.yaml
#
apiVersion: apps.cozystack.io/v1alpha1
kind: Kubernetes
metadata:
  name: lab
  namespace: tenant-workshopXX
spec:
  version: v1.35
  storageClass: replicated
  controlPlane:
    # Una sola copia del plano de control: esto es un banco de formación,
    # ahorrar recursos importa más que la tolerancia a fallos.
    replicas: 1
  addons:
    monitoringAgents:
      # Actívalo de inmediato. La recolección de métricas no se puede activar
      # de forma retroactiva: todo lo que ocurrió antes de marcar la casilla se pierde. El lab 14 depende de estos datos.
      enabled: true
  nodeGroups:
    md0:
      # El grupo puede añadir nodos por sí mismo si las copias empiezan a quedarse sin espacio.
      # En el lab de escalado no llegará tan lejos: allí crecen las copias, no los nodos.
      minReplicas: 1
      maxReplicas: 3
      instanceType: u1.medium
      diskSize: 20Gi
      storageClass: replicated
