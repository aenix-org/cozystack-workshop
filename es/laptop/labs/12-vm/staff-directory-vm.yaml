---
# Lab 12. Una máquina virtual para un directorio heredado de empleados: el disco y la propia
# máquina, dos objetos en un mismo archivo, separados por la línea `---`.
#
# Estos son objetos de tenant: viven NO en el clúster `lab`, sino en tu namespace
# en el clúster de gestión. Necesitas el kubeconfig del tenant.
#
# Antes de aplicar, reemplaza tenant-workshopXX por tu namespace, de lo contrario el pedido irá
# al tenant equivocado, no al tuyo.
#
#     export KUBECONFIG=~/.kube/workshop
#     kubectl apply -f staff-directory-vm.yaml
#
# Lo mismo se puede hacer con el ratón en el dashboard del tenant (Crear aplicación -> VM Disk,
# luego VM Instance) — el resultado es idéntico.
#
# ATENCIÓN: el nombre con el que se llama a la máquina más adelante NO coincide con metadata.name, y esto no
# es un error tipográfico en la lab. La plataforma despliega un objeto VMInstance llamado X con el
# chart `vm-instance`, y el nombre del chart se pega al nombre del release: la instancia en ejecución
# se llama vm-instance-X. Además, el objetivo se especifica con un prefijo de tipo, porque
# los permisos del tenant se otorgan sobre instancias (virtualmachineinstances, alias vmi), no sobre
# virtualmachines — un nombre pelado devolverá forbidden. De ahí el comando de acceso a la consola:
#     virtctl console --namespace=tenant-workshopXX vmi/vm-instance-spravochnik
# Lista de instancias en ejecución: kubectl get vmi -n tenant-workshopXX
# Y `kubectl get vminstance spravochnik` no muestra la instancia, sino tu pedido de ella —
# el mismísimo objeto descrito a continuación.
#
# El disco y la máquina son DOS OBJETOS DIFERENTES, y esto no es burocracia: el disco
# sobrevive a la máquina. La máquina se puede eliminar y recrear, adjuntando el mismo disco.
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  source:
    image:
      # Un nombre de la colección compartida de imágenes de la plataforma, no una URL.
      # La lista es visible en el dashboard al crear un disco.
      name: ubuntu-22.04
  # Tamaño del disco. No puede ser menor que la imagen de origen: ubuntu-22.04 se expande
  # a 20Gi, y la plataforma se negaría a llenar un disco de 10Gi. El disco luego se puede expandir,
  # pero no reducir, por lo que subestimar aquí cuesta más que sobrestimar.
  storage: 20Gi
  # Clase de almacenamiento. `replicated` — los datos se escriben en varias copias en distintos nodos
  # de la plataforma: un nodo con una copia puede morir, y la máquina sigue funcionando. En esencia es un
  # espejo, solo que ensamblado a través de la red. La misma clase la usan las bases de datos en labs vecinas.
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  # 1 CPU, 4 GB. La misma referencia de catálogo de la que se toman los
  # tamaños de nodos de Kubernetes: máquinas y nodos se miden de la misma manera aquí.
  instanceType: u1.medium
  # Perfil del SO invitado: qué controladores y dispositivos darle a la máquina.
  instanceProfile: ubuntu
  # Always significa «mantenerla encendida»: si se apaga por sí sola, se vuelve a encender.
  # Halted — apagada, Manual — como se dejó.
  runStrategy: Always
  # Qué discos adjuntar a la máquina. La referencia es por el nombre del objeto VMDisk de arriba — el
  # mismísimo que sobrevivirá a esta máquina.
  disks:
    - name: spravochnik
  # Nota: aquí NO hay campo replicas y no lo habrá.
  # Una máquina virtual es un único objeto. Si necesitas dos máquinas — dos objetos
  # con nombres distintos. Esta es una diferencia fundamental respecto a Deployment,
  # ver la sección del README sobre dónde duele esta diferencia.
  # Configuración inicial del SO invitado. cloud-init es el mecanismo estándar de las imágenes
  # cloud de Linux: en el primer arranque la máquina lee este texto y se lo aplica a sí misma. Por su rol
  # es la personalización del invitado en vSphere — contraseñas, archivos, servicios — solo que mediante descripción, no
  # un asistente. Todo lo que está debajo de la indentación tras `|` va al invitado literalmente y se procesa
  # allí, no por Kubernetes.
  #
  # Aquí cloud-init convierte el directorio en un servidor: coloca una página HTML y configura un servicio
  # que la sirve por HTTP en el puerto 8080. python3 ya está en la imagen ubuntu — no se necesita internet
  # para esto. El puerto 8080 no es aleatorio: el instructor ya creó de antemano en tu tenant
  # un Service `spravochnik-http` (80 -> 8080) y un Ingress `spravochnik`, y en cuanto el servicio
  # dentro de la máquina se levante, el directorio se publicará en el dominio del tenant.
  cloudInit: |
    #cloud-config
    # La contraseña es necesaria para entrar en la consola desde el dashboard. En una máquina de producción
    # no se debe hacer así — allí se usan sshKeys.
    password: ubuntu
    chpasswd: { expire: false }
    ssh_pwauth: true
    write_files:
      - path: /opt/directory/index.html
        content: |
          <!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Справочник</title></head><body><h1>Справочник сотрудников</h1><ul><li>Иванов И. — 101</li><li>Петров П. — 102</li></ul></body></html>
      - path: /etc/systemd/system/directory.service
        content: |
          [Unit]
          Description=Staff directory
          After=network.target
          [Service]
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0 --directory /opt/directory
          Restart=always
          [Install]
          WantedBy=multi-user.target
    runcmd: [ "systemctl daemon-reload", "systemctl enable --now directory" ]
