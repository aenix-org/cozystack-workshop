---
# Lab 6 · Tu propio registro privado de imágenes. La versión FUNCIONAL del manifiesto.
#
# Es el mismo archivo que passes-broken.yaml, más un único lugar que allí faltaba —
# está marcado abajo con las palabras «ESTO ES LO QUE FALTABA». Aplícalo después de que
# hayas visto el fallo en la versión rota y hayas entendido por qué ocurrió.
#
# Se aplica en tu clúster `lab` (no en el clúster de gestión de Cozystack — allí
# vive solo el propio Harbor), en el espacio de nombres por defecto:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl delete -f passes-broken.yaml
#     kubectl apply -f passes.yaml
#
# ATENCIÓN: HARBOR-HOST es un marcador de posición, no una dirección funcional. Antes de aplicar, sustituye la dirección
# de tu propio Harbor; la cadena HARBOR-HOST aparece dos veces en el archivo, sed reemplazará ambas:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # macOS
#
# En los objetos de abajo: apiVersion es la versión del esquema de descripción, kind es lo que creamos,
# metadata.name es el nombre del objeto. No se explican por separado más adelante.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Dos copias, no una: así en la respuesta del servicio se verá que las peticiones las atienden
  # pods distintos, y que la imagen se descargó al nodo una vez pero se inició dos veces.
  replicas: 2
  # La condición «mis copias son pods con la etiqueta app: passes-api». La etiqueta en la plantilla del pod de abajo
  # debe coincidir con esta, de lo contrario el clúster rechazará el manifiesto.
  selector:
    matchLabels:
      app: passes-api
  # La plantilla a partir de la cual se estampan las copias. Todo lo que hay dentro describe un único pod.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Restricciones de seguridad para todo el pod: no ejecutar como root, trabajar como
      # usuario no privilegiado 10001, restringir el conjunto de llamadas al sistema al
      # perfil estándar. La imagen está construida exactamente para esto (ver app/Dockerfile, la línea USER).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # ESTO ES LO QUE FALTABA en passes-broken.yaml — estas dos líneas, y nada más.
      #
      # Un registro cerrado no entrega la imagen a cualquiera: primero hay que identificarse. El secreto `harbor`
      # (de tipo kubernetes.io/dockerconfigjson) guarda la dirección del registro, el usuario y la contraseña; lo
      # creaste con el comando kubectl create secret docker-registry. Aquí el secreto solo
      # se REFERENCIA por su nombre — y lo toma de allí no la aplicación sino el kubelet del nodo, en el
      # momento en que va a descargar la imagen. Por eso el secreto debe estar en el mismo
      # espacio de nombres que el pod: el kubelet lo busca precisamente ahí y en ningún otro sitio.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # Permisos a nivel del contenedor: no obtener privilegios adicionales y ceder todas las
          # capacidades especiales del kernel. La aplicación necesita un único puerto de red, el resto sobra.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # La primera parte del nombre de la imagen es la dirección del registro, y precisamente por eso el traslado a tu propio
          # registro cambia los manifiestos: el nombre de la imagen se vuelve distinto. Si no hubiera dirección al
          # principio, el clúster iría a por la imagen a Docker Hub, y eso es justo lo que la seguridad prohibió.
          image: HARBOR-HOST/passes/passes-api:v1
          # El puerto de la aplicación. El nombre `http` se usa más adelante en la sonda de disponibilidad y el Service,
          # así que el número de puerto se define en un solo lugar, no en tres.
          ports:
            - containerPort: 8080
              name: http
          # Variables de entorno de las que la aplicación aprende quién es y de dónde vino.
          # Es exactamente eso lo que imprime en la respuesta (ver app/main.go, la estructura identity).
          # APP_VERSION e IMAGE_REGISTRY se definen como texto — las escribimos nosotros mismos.
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # A continuación — la Downward API: el propio clúster pone en las variables lo que sabe sobre el pod.
            # La aplicación no necesita adivinar su propio nombre, ni ir a por él a la API del clúster,
            # ni llevar consigo los derechos para tal petición. Los valores se sustituyen en el momento
            # en que se inicia una copia, por eso cada copia tiene los suyos.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — qué reservar para una copia: por estos números el planificador elige el
          # nodo. limits — el techo: por memoria por encima del techo el contenedor se mata, por
          # CPU se frena. 16Mi basta porque la aplicación está escrita en Go sin
          # dependencias y casi no retiene nada en memoria; una JVM necesitaría dos órdenes de magnitud
          # más. 20m son veinte milésimas de un núcleo de CPU.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Sonda de disponibilidad: hasta que la aplicación no responda en /healthz, el Service no
          # enviará tráfico a esta copia. Durante el despliegue de una nueva versión la copia antigua se retira
          # del balanceo de carga solo después de que la nueva haya respondido — por eso las peticiones
          # no fallan en un proceso que aún no ha arrancado.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Un nombre permanente detrás del cual están ambas copias. Los pods se recrean y cambian de direcciones,
# el nombre passes-api.default.svc.cluster.local no cambia. Sin este objeto la aplicación
# funciona, pero no hay por dónde alcanzarla dentro del clúster — y la comprobación en check.sh
# va precisamente aquí, no al pod.
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # El enlace con los pods no es una lista de direcciones sino una condición sobre una etiqueta. Una nueva copia con la etiqueta
  # app: passes-api entra en el balanceo de carga por sí sola, no hace falta registrarla.
  selector:
    app: passes-api
  # port — en qué puerto responde el propio Service; targetPort se refiere al nombre `http`
  # del bloque ports de arriba, no al número, por eso el enlace no se romperá al cambiar el número.
  ports:
    - port: 80
      targetPort: http
