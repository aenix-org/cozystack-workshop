---
# Lab 6 · Tu propio registro privado de imágenes. ESTE ARCHIVO ESTÁ DELIBERADAMENTE INCOMPLETO.
#
# No va a funcionar, y es intencionado: debes ver el fallo con tus propios ojos y
# comprender por ti mismo qué le faltó al clúster. Aquí falta una sola cosa — aquello con lo
# que el clúster se identifica ante un registro cerrado cuando va a por una imagen. El
# registro no entrega imágenes a cualquiera, y en esta descripción no hay nada que ayude al
# clúster a demostrar su derecho a ellas. Qué línea exactamente lo arregla — lo averiguarás
# a lo largo de la lab; la versión que funciona está al lado, en passes.yaml, y no tiene
# sentido abrirla antes de haberlo razonado.
#
# Aquí solo hay un Deployment, sin Service: un nombre permanente para el servicio aún no hace
# falta — de todos modos no llegaremos a un pod que responda, ya que la imagen no se descarga.
#
# Se aplica en tu clúster `lab`, en el espacio de nombres por defecto:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f passes-broken.yaml
#     kubectl get pods -l app=passes-api -w
#
# ATENCIÓN: HARBOR-HOST es un marcador de posición, no una dirección real. Sustituye la dirección
# de tu propio Harbor, de lo contrario obtendrás un error distinto al que este archivo persigue
# (hay dos líneas con el marcador):
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # macOS
#
# En el objeto de abajo: apiVersion — la versión del esquema de descripción, kind — qué creamos,
# metadata.name — el nombre del objeto. No se explican por separado más adelante.
#
# Un Deployment no es «ejecuta un contenedor», sino «mantén en ejecución tantas copias de tal
# contenedor». Una copia desaparece — el clúster crea una nueva, sin preguntar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Una sola copia: para analizar el fallo basta con una, y en los logs y en la salida de
  # kubectl describe habrá menos ruido.
  replicas: 1
  # La condición «mis copias son los pods con la etiqueta app: passes-api». La etiqueta en la
  # plantilla del pod de abajo debe coincidir con esta, de lo contrario el clúster rechazará el manifiesto.
  selector:
    matchLabels:
      app: passes-api
  # La plantilla a partir de la cual se estampan las copias. Todo lo de dentro describe un solo pod.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Restricciones de seguridad para todo el pod: no ejecutar como root, trabajar bajo el
      # usuario no privilegiado 10001, limitar el conjunto de llamadas al sistema al perfil
      # estándar. La imagen está construida para lo mismo (ver app/Dockerfile, la línea USER).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Permisos a nivel de contenedor: no obtener privilegios adicionales y ceder todas las
          # capacidades especiales del kernel. La aplicación necesita un puerto de red, lo demás sobra.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # La primera parte del nombre de la imagen es la dirección del registro. Justo por eso el
          # traslado a tu propio registro cambia los manifiestos: el nombre de la imagen pasa a ser
          # otro. Sin la dirección, el clúster iría a por la imagen a Docker Hub — es decir, adonde
          # el equipo de seguridad lo prohibió.
          image: HARBOR-HOST/passes/passes-api:v1
          # El puerto de la aplicación. El nombre `http` se usa más abajo por la sonda de disponibilidad,
          # así que el número de puerto se fija en un solo lugar, no en dos.
          ports:
            - containerPort: 8080
              name: http
          # Variables de entorno de las que la aplicación aprende quién es y de dónde llegó.
          # Exactamente eso es lo que imprime en su respuesta (ver app/main.go, la estructura identity).
          # APP_VERSION e IMAGE_REGISTRY se fijan como texto — esas las escribimos nosotros mismos; las
          # tres siguientes las rellena el propio clúster en el momento de arrancar la copia, la
          # aplicación no tiene forma de conocerlas.
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — qué reservar para una copia: por estos números el planificador elige el
          # nodo. limits — el tope: por memoria por encima del tope el contenedor se mata, por
          # CPU se ralentiza. 16Mi basta porque la aplicación está en Go sin dependencias. 20m es
          # veinte milésimas de un núcleo de CPU.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Sonda de disponibilidad: mientras la aplicación no responda en /healthz, el tráfico a la
          # copia no irá. Hoy no llegaremos a ella — comprueba un proceso ya en ejecución, y en nuestro
          # caso se atascará un paso anterior, la descarga de la imagen.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
