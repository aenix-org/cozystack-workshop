# Lab 13. Plantilla Service: una dirección estable para la aplicación.
#
# Las copias de la aplicación aparecen y desaparecen, y sus direcciones son nuevas cada vez. Service da un nombre
# que no cambia y reparte las peticiones entre las copias vivas. Desde un pod vecino
# se accede a la aplicación por el nombre del release.
#
# La sustitución dentro de las llaves dobles y de dónde salen los nombres de los objetos está
# descrita en templates/deployment.yaml — aquí todo funciona de la misma manera.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Un solo flag en values decide si la aplicación obtiene una dirección fuera del clúster o no.
  # Las aplicaciones integradas de Cozystack funcionan igual: el campo external.
  # La construcción if/else elige uno de los dos valores al renderizar — el manifiesto terminado
  # recibe LoadBalancer o ClusterIP, sin que quede ninguna ramificación en él.
  type: {{ if .Values.external }}LoadBalancer{{ else }}ClusterIP{{ end }}
  # A quién enviar el tráfico. Service selecciona los pods por etiquetas, no por nombres, así que
  # no le importa cuántas copias hay ni cómo se llaman. Las etiquetas son las mismas que el Deployment
  # pone en sus copias.
  selector:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
  # port — en qué puerto escucha el propio Service, targetPort — a dónde llama dentro del pod.
  # targetPort está escrito como un nombre: el puerto llamado http se declara en la plantilla Deployment.
  # Si el número cambia allí, aquí no hay que arreglar nada.
  ports:
    - name: http
      port: 80
      targetPort: http
