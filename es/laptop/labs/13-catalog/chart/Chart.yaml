# Lab 13. Pasaporte del chart «Pases».
#
# Un chart es una carpeta: plantillas de manifiestos en templates/, valores por defecto en values.yaml
# y el esquema de parámetros en values.schema.json. Se despliega con el comando
# `helm install <nombre-de-release> chart` desde la carpeta de la lab, y en el catálogo de Cozystack — por la
# propia plataforma, cuando alguien solicita una aplicación a través del dashboard.
#
# Chart.yaml es la portada del paquete: a partir de él Helm sabe cómo se llama el paquete y qué versión tiene.
apiVersion: v2
name: guest-pass
description: Internal guest pass service — order a pass for a visitor
type: application

# A continuación vienen dos versiones, y se confunden más a menudo que cualquier otra cosa en Helm. Son cosas distintas.
#
# version — la versión del empaquetado. Cambia cuando editas las plantillas, los valores o el esquema,
# aunque la aplicación de dentro haya quedado igual. Es precisamente la que Helm compara al actualizar un
# release, y es también la que distingue los paquetes subidos al repositorio. Sin incrementarla, la
# plataforma considera que el paquete no ha cambiado, y la nueva versión puede pasar desapercibida.
version: 0.1.0
# appVersion — la versión de la propia aplicación dentro del paquete, aquí es nginx. Vive su propia
# vida: la aplicación puede actualizarse diez veces sin una sola edición de las plantillas, y viceversa —
# reescribiste las plantillas, pero la aplicación es la misma. No aparece en los nombres de los objetos, se muestra
# en la salida de `helm list` y en la tarjeta del catálogo.
appVersion: "1.0"
