# Lab 13. Valores por defecto para el chart «Pases».
#
# Son las respuestas a las preguntas que el chart plantea al momento del despliegue: cuántas
# réplicas, qué texto va en la página, si hace falta una dirección externa. Se registran aquí para
# el caso «no se seleccionó nada». Quien pide la aplicación los sobrescribe: en el panel — con
# campos del formulario, en la terminal — con la clave `--set replicas=5` o su propio archivo `helm install ... -f my.yaml`.
# Editar este archivo cambia los valores por defecto de los pedidos futuros, no de los ya desplegados.
#
# Cómo los valores de aquí se convierten en el formulario de pedido del panel:
#   tipo       — qué campo mostrar: {int} un número, {bool} un interruptor,
#                {string} un campo de texto, {struct} un grupo anidado de campos;
#   Descripción — la etiqueta del campo y la pista debajo de ella;
#   =valor     — lo que ya está en el campo cuando se abre el formulario;
#   obligatoriedad — se define con la lista required en el esquema. Aquí no la hay: cada
#                parámetro tiene un valor por defecto, así que cualquier campo se puede omitir.
# Por eso las descripciones se escriben en inglés: las lee no solo el autor del chart, sino cualquiera
# que pida la aplicación en el panel.

## Los comentarios del tipo `## @param` no son adorno. A partir de ellos el generador de Cozystack
## (cozyvalues-gen) arma values.schema.json y la tabla de parámetros en el README.
## Formato: ## @param {tipo} nombre=valor-por-defecto - Descripción.

# Cuántas réplicas de la aplicación mantener en ejecución. Una réplica significa inactividad mientras
# se reinicia un nodo; dos sobreviven a la pérdida de cualquiera de ellas.
## @param {int} replicas=2 - Number of application replicas.
replicas: 2

# Texto de la página principal. Expuesto como parámetro porque cada filial tiene el suyo,
# y nadie va a construir una imagen aparte solo para eso.
## @param {string} greeting=Order a pass for your guest - Text shown on the main page.
greeting: "Order a pass for your guest"

# Si la aplicación necesita una dirección fuera del clúster. Convención del catálogo de Cozystack:
# un campo llamado external significa lo mismo para todas las aplicaciones — acceso externo.
## @param {bool} external=false - Enable external access from outside the cluster.
external: false

# Tamaño de una sola réplica. Expuesto como un grupo de campos aparte para que en el formulario de pedido
# se vea como un único bloque «recursos» en lugar de dos campos sin relación.
## @typedef {struct} Resources - CPU and memory for each replica.
## @field {quantity} cpu - CPU available to each replica.
## @field {quantity} memory - Memory (RAM) available to each replica.

## @param {Resources} resources - Explicit CPU and memory configuration.
resources:
  cpu: 100m
  memory: 128Mi
