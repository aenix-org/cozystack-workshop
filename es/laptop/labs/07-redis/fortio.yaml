---
# Lab 7 · generador de carga con interfaz web.
# El mismo que en la lab sobre escalado: la carga se lanza con un botón en el navegador,
# y el histograma de latencias se ve ahí mismo. Si ya lo tienen desplegado, no hace
# falta aplicar este archivo — kubectl responderá «unchanged».
#
# Dónde se aplica: su clúster `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Comando: kubectl apply -f fortio.yaml
#
# Dos objetos separados por `---`: un Deployment (el generador en sí) y un Service (el nombre
# por el que se llega a él). apiVersion, kind y metadata.name no se comentan más adelante.
#
# La imagen se obtiene del Docker Hub público, no de su Harbor: Fortio no es parte
# del servicio «Pase de invitado», sino un instrumento de medición que vive temporalmente en el clúster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # Una sola copia. Un generador de carga no necesita escalarse — se necesita que sea el único
  # que cuente las latencias con honestidad. Dos copias darían dos histogramas sin fusionar.
  replicas: 1
  # La etiqueta por la que el Deployment reconoce su pod. Coincide con la etiqueta del template de abajo.
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # Los mismos requisitos de seguridad que el resto: el proceso no se ejecuta como root,
      # y las llamadas al sistema están restringidas por un perfil seccomp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # La etiqueta `latest` aquí es una simplificación para el taller, y contradice lo que
          # enseña la lab sobre su propio registro: la imagen bajo esta etiqueta puede cambiar en silencio
          # entre dos aplicaciones, y la medición de ayer se vuelve no reproducible. Para un
          # generador de carga en un banco de pruebas educativo esto es aceptable, para un sistema de producción no.
          image: fortio/fortio:latest
          # `server` es el modo en el que Fortio levanta la interfaz web y espera a que
          # pulsen el botón. Sin este argumento la imagen ejecuta un comando único y termina.
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # El generador necesita margen de CPU, de lo contrario se atascará
              # en sí mismo y estarán cargando a Fortio en lugar de a la aplicación.
              cpu: "1"
              memory: 256Mi
---
# El Service es necesario para abrir la interfaz web: se llega al generador por nombre
# mediante reenvío de puerto — kubectl port-forward svc/fortio 8081:8080 — y se entra
# a localhost:8081. También se puede bombardear el servicio sin un Service, con
# kubectl exec deploy/fortio, pero solo este camino da el histograma en el navegador.
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  # Aquí el número del Service y el puerto del contenedor coinciden — a diferencia de los otros
  # servicios de la lab, donde es 80 por fuera y 8080 por dentro. La diferencia es solo de comodidad.
  ports:
    - port: 8080
      targetPort: http
