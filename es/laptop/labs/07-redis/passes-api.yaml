---
# Lab 7 · servicio «Pase», versión v2 — la que sabe trabajar con caché.
# Aquí la caché AÚN NO está activada: primero medimos lo mal que va sin ella. Se activa más tarde,
# con el parche cache-patch.yaml de esta misma carpeta.
#
# Dónde se aplica: tu clúster `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Comando: kubectl apply -f passes-api.yaml
#
# HARBOR-HOST es un marcador de posición, no una dirección. Sustitúyelo por la dirección de tu propio Harbor (véase hr-legacy.yaml,
# donde también está el comando sed para reemplazarlo en todos los archivos a la vez).
#
# El archivo tiene dos objetos separados por `---`: un Deployment (copias de la aplicación) y un Service (un nombre
# estable para ellas). apiVersion, kind y metadata.name no se comentan más adelante en el archivo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Dos copias, no una, para que más tarde se vea la propiedad clave de la caché: es compartida.
  # Un pod puso una respuesta en Redis, otro la tomó de allí, aunque él nunca fue al directorio.
  replicas: 2
  # Por esta etiqueta el Deployment distingue sus propios pods de los ajenos. Debe coincidir con la etiqueta
  # de la template de abajo, de lo contrario el objeto no encontrará lo que él mismo creó.
  selector:
    matchLabels:
      app: passes-api
  # template es la plantilla del pod: a partir de qué se ensambla cada copia.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Requisitos de seguridad a nivel de pod: no como root, un conjunto restringido de llamadas
      # al sistema. En un clúster con las políticas activadas, un pod sin estos campos no será admitido.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Con qué se presenta el clúster ante el Harbor cerrado al descargar la imagen. Sin una referencia
      # a este secreto el pod se quedará atascado en ImagePullBackOff.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # Los privilegios del contenedor están recortados al mínimo: no se puede escalar, sin privilegios de kernel.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # La misma imagen que el directorio. Solo el MODE de abajo los separa.
          image: HARBOR-HOST/passes/passes-api:v2
          # El nombre del puerto hace falta para que la sonda y el Service se refieran a un nombre, no a un número.
          ports:
            - containerPort: 8080
              name: http
          # Todo el comportamiento de la aplicación se define aquí. Fíjate: las variables
          # REDIS_ADDR y REDIS_PASSWORD no están en la lista — y precisamente por eso la caché está apagada,
          # y cada petición va honestamente al directorio lento.
          env:
            # MODE=api — esta instancia funciona como el propio servicio «Pase».
            - name: MODE
              value: "api"
            # La versión y el registro no le hacen falta a la aplicación para funcionar — se ven en la respuesta a «/»
            # y permiten confirmar que se está ejecutando exactamente lo que acabas de construir.
            - name: APP_VERSION
              value: "v2"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # A dónde ir a por los datos. Un nombre de servicio, no una dirección: las copias del directorio
            # pueden recrearse cualquier número de veces, el nombre no cambia.
            - name: HR_URL
              value: "http://hr-legacy.default.svc.cluster.local"
            # Quién ejecuta la petición y dónde. El clúster rellena estos tres valores por sí mismo:
            # nadie los conoce de antemano. Acaban en la respuesta del servicio, y por ellos se ve
            # qué copia y en qué nodo respondió — esto vendrá bien durante las mediciones.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests es lo que se reserva al elegir un nodo, limits es el techo. Un techo de un
          # núcleo aquí no es avaricia: bajo carga la aplicación choca contra él en vez de comerse
          # el nodo entero, y la medición muestra la latencia del directorio, no una pelea por la CPU.
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # Hasta que /healthz no responda, el Service no enviará ni una sola petición a esta copia.
          # Durante una actualización este mismo campo te salva de una caída: las copias viejas no se retiran
          # hasta que las nuevas informen de que están listas.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — un único nombre estable para ambas copias y la distribución de peticiones entre ellas.
# Los pods se recrean y cambian de IP, el nombre passes-api permanece. Tanto Fortio como el script
# de comprobación llegan al servicio por este nombre.
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # La etiqueta por la que el Service reúne la lista de copias vivas. Si no coincide con la etiqueta de los pods,
  # el Service existirá y llevará a ninguna parte.
  selector:
    app: passes-api
  ports:
    # Desde fuera se llega al puerto 80, dentro del pod va al puerto llamado http (8080).
    - port: 80
      targetPort: http
