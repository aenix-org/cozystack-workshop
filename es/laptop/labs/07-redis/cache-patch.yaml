---
# Lab 7 · activación real de la caché. Se aplica sobre el passes-api ya desplegado
# en vuestro clúster `lab` (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch.yaml
#
# Esto es un patch, no un manifiesto completo: aquí solo se describe lo que cambia. Todo lo demás —
# la imagen, las etiquetas, las probes, los recursos — permanece intacto desde passes-api.yaml. Por eso el
# archivo empieza directamente en spec: la ruta hasta el contenedor reproduce la estructura del Deployment,
# para que el clúster entienda dónde exactamente aplicar la edición.
#
# El nombre del contenedor `api` no es un adorno, sino una dirección: por él el clúster encuentra el
# contenedor correcto en la lista. Si os equivocáis en el nombre, en lugar de una edición obtendréis un segundo contenedor.
#
# Sustituid la dirección de vuestro propio Redis en lugar de REDIS-ADDR — es un marcador de posición, no un nombre de host.
# La dirección la tomáis del panel, en la tarjeta de vuestra aplicación gestionada de Redis.
spec:
  template:
    spec:
      containers:
        - name: api
          # Las listas env en Kubernetes se fusionan por el campo name, por eso las tres entradas de abajo
          # se añaden a las que ya existen en el Deployment, en lugar de reemplazarlas.
          env:
            # La aparición de esta variable es lo que significa «activar la caché»: la aplicación la comprueba
            # al arrancar y, si está definida, va primero a Redis. Vacía o
            # ausente — funciona como antes, consultando el directorio en cada petición.
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
            # La contraseña no la escribimos como texto: llega desde un secreto que vosotros
            # crearéis con un comando aparte. En un manifiesto que vive en Git,
            # una contraseña no tiene sitio.
            #
            # secretKeyRef es una referencia: name — el nombre del objeto-secreto en el mismo clúster,
            # key — qué campo dentro de él tomar. El valor se sustituye al arrancar
            # el pod y nunca aparece en el archivo.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
            # Cuántos segundos vive un registro en la caché. Sesenta — porque el
            # directorio de empleados cambia una vez al día, no una vez por segundo.
            #
            # Un plazo mayor — consultamos el directorio con menos frecuencia, pero servimos un apellido
            # obsoleto durante más tiempo. Uno menor — los datos son más frescos, la ganancia es menor. Es un compromiso,
            # no un ajuste con un valor correcto.
            - name: CACHE_TTL
              value: "60"
