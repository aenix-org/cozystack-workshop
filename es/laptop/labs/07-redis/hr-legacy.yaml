---
# Lab 7 · un stub para el directorio legacy de empleados.
# En la vida real este es el sistema de otra persona que no te permitirán reescribir: responde en 800 ms,
# y de algún modo tienes que vivir con eso. Aquí hay un stub con el mismo comportamiento, para que haya algo que medir.
#
# Dónde aplica: tu clúster `lab` (export KUBECONFIG=~/lab.kubeconfig), no el clúster de gestión
# de Cozystack. Comando: kubectl apply -f hr-legacy.yaml
#
# HARBOR-HOST es un marcador de posición, no una dirección. Sustituye la dirección de tu propio Harbor, de lo contrario el clúster
# intentará descargar la imagen desde un host inexistente:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # macOS
#
# El archivo tiene dos objetos separados por una línea `---`: un Deployment (qué se ejecuta y en cuántas
# copias) y un Service (un nombre permanente que se usa para alcanzar esas copias). Para cada objeto
# apiVersion y kind dicen qué tipo de objeto es, y metadata.name es cómo se llama;
# más abajo estos tres campos no se comentan.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-legacy
  labels:
    app: hr-legacy
spec:
  # Cuántas copias mantener en ejecución. Si una copia desaparece, el clúster creará una nueva sin
  # preguntar. Con una basta para el directorio: no está aquí para carga, sino para medición.
  replicas: 1
  # Por esta etiqueta el Deployment reconoce sus pods entre todos los demás en el clúster.
  # La etiqueta en selector y la etiqueta en template de abajo deben coincidir, de lo contrario el objeto
  # no encontrará lo que él mismo creó.
  selector:
    matchLabels:
      app: hr-legacy
  # template es la plantilla del pod. Todo lo que está debajo describe una copia: de qué construirla,
  # con qué privilegios ejecutarla, y cómo saber que está lista para aceptar solicitudes.
  template:
    metadata:
      labels:
        app: hr-legacy
    spec:
      # Requisitos de seguridad a nivel de pod. El proceso no se ejecuta como root (uid 10001),
      # el perfil seccomp corta las llamadas al sistema que la aplicación no necesita.
      # En un clúster con políticas habilitadas, un pod sin estos campos no arrancará en absoluto.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Harbor está cerrado con un login y una contraseña, y el clúster necesita algo con que identificarse. El
      # secreto `harbor` lo configuraste en la lab del registro. Sin esta referencia la imagen no se descargará,
      # y el pod quedará en el estado ImagePullBackOff.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: hr
          # Lo mismo que a nivel de pod, pero para un contenedor específico: prohibimos
          # la escalada de privilegios y quitamos todas las capacidades del kernel. La aplicación en Go
          # no necesita ninguna de ellas.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # La imagen es la misma para el directorio y para el propio servicio «Пропуск».
          # Qué proceso arranca realmente lo decide la variable MODE de abajo.
          image: HARBOR-HOST/passes/passes-api:v2
          # El puerto tiene un nombre, no solo un número: la sonda de readiness y el Service de abajo
          # referencian el nombre. Si el número cambia, lo editarás en un solo lugar.
          ports:
            - containerPort: 8080
              name: http
          # Las variables de entorno son la única manera de configurar esta aplicación.
          # No hace falta reconstruir la imagen para cambiar el comportamiento.
          env:
            # MODE=hr — la instancia finge ser un sistema de RRHH: espera y responde.
            - name: MODE
              value: "hr"
            # Exactamente el retardo que muestra el directorio real.
            # Al cambiarlo, cambias «qué tan mal están las cosas» — prueba 2s después.
            - name: HR_DELAY
              value: "800ms"
            # Un pod no conoce su propio nombre de antemano — el clúster se lo asigna al crearlo.
            # fieldRef sustituye este nombre en la variable al arrancar, y este
            # acaba en la respuesta del servicio: puedes ver qué copia respondió.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # requests — cuántos recursos se reservan para el contenedor al elegir un nodo,
          # limits — el techo que no se le permitirá superar. Similar a reservation
          # y limit en vSphere, pero se establece por contenedor, no por máquina virtual.
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # Sonda de readiness. Hasta que /healthz responda, el Service no enviará ni una sola solicitud
          # a esta copia. Sin la sonda, el tráfico iría a un proceso que aún no ha arrancado,
          # y verías errores de la nada — aunque «todo se desplegó».
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — un nombre permanente y una dirección permanente para un conjunto de pods. Los pods se recrean
# y cada vez reciben una nueva IP, pero el nombre hr-legacy permanece igual. Similar a una VIP de
# balanceador de carga, pero se configura en cuatro líneas y vive dentro del clúster.
apiVersion: v1
kind: Service
metadata:
  name: hr-legacy
spec:
  # Por esta etiqueta el Service reúne la lista de copias vivas. La misma etiqueta que en los pods de arriba:
  # si no coincide, el Service existirá y no llevará a ninguna parte.
  selector:
    app: hr-legacy
  ports:
    # Las solicitudes llegan por el puerto 80, dentro del pod esto va al puerto llamado http (8080).
    - port: 80
      targetPort: http
