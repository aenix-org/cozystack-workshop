# Lab 8 · paso 1 de 3: la contraseña está en el manifiesto en texto plano.
# Así es como se ve hoy el servicio «Propusk» — y este es exactamente el archivo que encontró la auditoría.
# Lo aplicaremos exactamente una vez, para ver el problema con nuestros propios ojos.
#
# Los tres pasos de la lab, para que no te pierdas:
#   secrets-demo-naive.yaml   <- estás aquí: cualquiera que abra el archivo ve la contraseña
#   secrets-demo-secret.yaml     la contraseña se traslada a un objeto Secret aparte
#   secrets-demo.yaml            la contraseña no está en el manifiesto en absoluto
#
# Dónde se aplica: tu clúster `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Comando: kubectl apply -f secrets-demo-naive.yaml
#
# La contraseña de este archivo es de práctica e inventada, aquí no hay ninguna real. Un solo objeto —
# Deployment; apiVersion, kind y metadata.name no se comentan más adelante.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # Una sola copia es suficiente: no miramos la tolerancia a fallos, sino
  # de dónde saca la contraseña la aplicación.
  replicas: 1
  # Por esta etiqueta el Deployment reconoce sus pods. Coincide con la etiqueta en template más abajo.
  selector:
    matchLabels:
      app: secrets-demo
  # template — la plantilla del pod: a partir de qué construir una copia.
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # Requisitos de seguridad: no desde root, un conjunto restringido de llamadas al sistema.
      # Fíjate en la brecha: el pod está configurado según todas las reglas de seguridad, y eso en absoluto
      # impide que la contraseña esté en el archivo diez líneas más abajo.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Aquí no hay una aplicación real — busybox y unas pocas líneas de shell.
          # Para esta lab solo importa una cosa: de dónde viene la contraseña, no qué se hace con ella
          # después.
          image: busybox:1.36
          env:
            # La dirección de la base de datos y el nombre de usuario no son secretos: saber que la
            # base de datos se llama passes-db no da acceso por sí mismo.
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # ESTA ES LA LÍNEA QUE ENCONTRÓ LA AUDITORÍA.
            # El archivo está en Git, así que la contraseña la conoce todo el que tiene acceso
            # al repositorio, y todo el que alguna vez lo ha clonado.
            - name: DB_PASSWORD
              value: "Propusk2019!"
          # Un bucle eterno: cada diez segundos imprime una línea en el log. Al log no va la
          # contraseña en sí, sino su huella sha256 — los primeros doce caracteres. Por la huella
          # se ve que la contraseña cambió, pero no se puede reconstruir su valor a partir de ella.
          # En los servicios reales los logs se escriben exactamente así.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          # Los apetitos son minúsculos: esto es una demostración, no una carga de trabajo.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
