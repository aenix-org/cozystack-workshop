# Lab 8 · pedido de un almacén de secretos OpenBao.
# Lo mismo que pedirías con el ratón en el panel — solo que como texto.
# Se aplica NO al clúster de laboratorio, sino a un tenant en el clúster de gestión:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f openbao.yaml
#
# ANTES DE APLICAR: reemplaza tenant-workshopXX por tu propio namespace. XX es un marcador,
# no parte del nombre; recibiste tu propio número junto con la contraseña. Si va a parar
# al tenant de otra persona, obtendrás un acceso denegado, y ese es el mejor resultado posible.
#
# kind: OpenBAO no es un objeto integrado de Kubernetes, sino un tipo que añade
# Cozystack. Describes lo que necesitas, y la propia plataforma despliega los pods, discos
# y servicios y luego los mantiene actualizados por su cuenta. Se parece más a pedir un servicio
# de un catálogo que a instalar software en una máquina virtual que te entregaron.
apiVersion: apps.cozystack.io/v1alpha1
kind: OpenBAO
metadata:
  # El nombre afecta a más que la tarjeta en el panel: la dirección interna del almacén
  # se construye a partir de él — openbao-secrets.<namespace>.svc.cozy.local. Si lo renombras,
  # corrige la dirección en secrets-demo.yaml y en la variable BAO_APP para check.sh.
  name: secrets
  namespace: tenant-workshopXX
spec:
  # Una copia. En producción se usan tres, lo que da replicación Raft: el chart la habilita
  # por sí mismo en cuanto replicas > 1. Cambiar de una a otra requiere
  # migrar los datos, así que la decisión se toma antes, no después.
  replicas: 1
  # Disco para los datos del almacén. Dos gigabytes es de sobra: los secretos pesan bytes,
  # el espacio se va en el historial de versiones y el registro de auditoría. No puedes reducir el volumen tras
  # su creación, pero normalmente sí puedes ampliarlo, así que no tiene sentido escatimar aquí.
  size: 2Gi
  # La clase de almacenamiento replicated significa que los datos se guardan en varias copias en
  # nodos diferentes. El fallo de un nodo no se lleva consigo todas tus contraseñas — y restaurar
  # un almacén de secretos desde una copia de seguridad es un asunto aparte desagradable.
  storageClass: replicated
  # Un conjunto listo de «cuánta CPU y memoria». La plataforma los ofrece como una lista,
  # para no obligar a cada uno a calcular las requests y los limits a mano.
  resourcesPreset: t1.small
  # La interfaz web se levanta dentro del clúster. No la exponemos hacia fuera:
  # external: true colgaría un LoadBalancer, y en el laboratorio no lo necesitamos.
  ui: true
  external: false
