---
# Lab 11. La compilación en sí: un script en un ConfigMap y un Job que lo ejecuta.
# Dos objetos en un mismo archivo, separados por la línea `---`.
#
# Se aplica en tu clúster de práctica `lab`, no en el tenant del clúster de gestión:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f android-build.yaml
# Aquí no hay marcadores como tenant-workshopXX — no hace falta sustituir tu número en ningún sitio.
#
# Antes de aplicar, ya deben existir dos objetos en el clúster, de lo contrario el pod de compilación no arrancará:
# el clúster no monta lo que no está, y el pod se queda esperando.
#     configmap/propusk-src   fuentes: kubectl apply -f propusk-src.yaml
#     secret/bucket-creds     cuatro claves de acceso al bucket, se introducen a mano
#
# Un Job, no un Deployment: una compilación tiene un final. Un Deployment interpreta un proceso terminado
# como un fallo y levanta una copia de nuevo — la compilación entraría en bucle y no se detendría nunca.
#
# POR QUÉ EL SCRIPT DE COMPILACIÓN VIVE COMO OBJETO SEPARADO en lugar de como cadena en el campo command del propio Job:
#   - sesenta líneas de shell dentro de un campo YAML no se pueden leer ni comprobar: aquí es
#     un archivo corriente que el editor resalta y que acepta `bash -n`;
#   - se ve entero con un solo comando: kubectl get configmap android-build-script -o yaml;
#   - puedes arreglar la compilación sin tocar la descripción de la tarea, y viceversa.
# El precio de la comodidad: el script vive aparte del Job. Cambia el ConfigMap y una compilación ya en marcha
# no se enterará — solo la siguiente ejecución verá el texto nuevo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: android-build-script
data:
  # Cinco pasos de compilación — exactamente los comandos que teclearías a mano en un servidor de compilación.
  # El contenedor arranca casi vacío: Java y Gradle vienen de la imagen, el resto lo trae el script
  # consigo.
  #   1/5  descarga las command-line tools — las utilidades con las que se instala el propio Android SDK (1-2 min)
  #   2/5  acepta las licencias e instala el SDK, la plataforma 34 y las build-tools. El paso más largo,
  #        5-15 minutos, y todo ese tiempo el log está en silencio: sdkmanager no imprime progreso
  #        en modo no interactivo. El silencio aquí no es un cuelgue
  #   3/5  gradle :app:assembleDebug — compila las fuentes de /src en un APK (3-8 minutos)
  #   4/5  instala mc, el cliente de consola para el almacén de objetos
  #   5/5  pone el APK en el bucket con dos nombres: uno con fecha y propusk-latest (segundos)
  #
  # Cada compilación tarda lo mismo: no hay caché, el disco /work es desechable (ver emptyDir
  # al final del archivo). En un servidor de compilación real habría en su lugar un volumen persistente, y la segunda
  # compilación terminaría en minutos.
  #
  # Abajo está el contenido literal del archivo build.sh, no YAML. Las líneas con almohadilla dentro de él
  # van al script tal cual: son comentarios de shell, y no hay que quitarlos.
  build.sh: |
    #!/usr/bin/env bash
    # Aquí set -e es apropiado: esto no es una comprobación, es una compilación. Si un paso falla —
    # continuar no tiene sentido, el Job debe terminar con error y permanecer
    # en el clúster con sus logs.
    set -euo pipefail

    WORK=/work
    export HOME="$WORK"
    export ANDROID_SDK_ROOT="$WORK/android-sdk"
    export ANDROID_HOME="$ANDROID_SDK_ROOT"
    export GRADLE_USER_HOME="$WORK/gradle-home"
    # El demonio de Gradle no hace falta en un contenedor desechable: vive por el bien de la siguiente
    # compilación, y no habrá una siguiente compilación en este contenedor.
    # -Duser.home es obligatorio, y no es un duplicado del export HOME de arriba. Java toma el directorio
    # de inicio no de la variable de entorno, sino del registro de usuario del sistema, y un
    # uid sin privilegios no tiene uno — Gradle sustituye "?" y falla al empaquetar el
    # APK: busca la clave de firma en una ruta del tipo /work/project/app/?/.android/.
    export GRADLE_OPTS="-Xmx3g -Dorg.gradle.daemon=false -Duser.home=$WORK"

    CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
    MC_URL="https://dl.min.io/client/mc/release/linux-amd64/mc"

    echo "== 1/5 ставлю Android command-line tools =="
    mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    cd "$ANDROID_SDK_ROOT/cmdline-tools"
    curl -fsSL -o tools.zip "$CMDLINE_TOOLS_URL"
    # unzip no está en toda imagen base, y jar del JDK sabe descomprimir zip.
    unzip -q tools.zip 2>/dev/null || jar xf tools.zip
    rm -f tools.zip
    mv cmdline-tools latest
    export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

    echo "== 2/5 принимаю лицензии и качаю SDK (самый долгий шаг) =="
    # `yes` recibe SIGPIPE cuando sdkmanager cierra su entrada, y devuelve
    # un código distinto de cero. Con set -o pipefail esto tumbaría la compilación sin motivo,
    # así que el código de retorno se suprime deliberadamente. Si las licencias de verdad
    # no se aceptaron — el siguiente comando lo dirá.
    yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
    sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
      "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    echo "== 3/5 собираю APK =="
    # El ConfigMap se monta solo para lectura, y Gradle escribe junto a las fuentes,
    # por eso el árbol se copia primero al disco.
    # -L desreferencia los enlaces simbólicos: el ConfigMap se monta no como archivos
    # sino como enlaces al directorio interno ..data, y sin -L los enlaces acabarían en el proyecto.
    # Un glob en lugar de /src/. — para que ese propio directorio interno no se copie.
    mkdir -p "$WORK/project"
    cp -rL /src/* "$WORK/project/"
    cd "$WORK/project"
    gradle --no-daemon :app:assembleDebug

    APK="$WORK/project/app/build/outputs/apk/debug/app-debug.apk"
    ls -l "$APK"

    echo "== 4/5 ставлю клиент S3 =="
    # Ponemos el cliente en la carpeta de trabajo, NO en /usr/local/bin. El pod corre como
    # usuario sin privilegios, y las carpetas de sistema de la imagen pertenecen a root:
    # escribir ahí terminaría en Permission denied — y justo aquí, en el cuarto paso,
    # es decir, tras media hora de compilación. La carpeta /work nos pertenece, podemos escribir en ella.
    mkdir -p "$WORK/bin"
    curl -fsSL -o "$WORK/bin/mc" "$MC_URL"
    chmod +x "$WORK/bin/mc"
    # PATH es la lista de carpetas donde el shell busca los comandos. Añadimos la nuestra para que luego
    # podamos escribir simplemente `mc` en vez de la ruta completa.
    export PATH="$WORK/bin:$PATH"

    echo "== 5/5 кладу APK в бакет =="
    # Las variables accessKey/secretKey/endpoint/bucketName vienen del Secret
    # a través de envFrom. Suprimimos la salida de alias set: no hace falta que imprima nada en el log.
    # Por la misma razón no hay set -x en el script — imprimiría las claves.
    # El alias se llama builds, no lab: la palabra `lab` se usa en todas las labs para el clúster
    # de práctica, y no conviene confundir uno con otro.
    mc alias set builds "https://${endpoint}" "${accessKey}" "${secretKey}" >/dev/null
    STAMP="$(date -u +%Y%m%d-%H%M%S)"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-${STAMP}.apk"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-latest.apk"
    # Línea marcadora: check.sh la usa para distinguir «el Job se ejecutó» de «el APK llegó».
    echo "APK-UPLOADED ${bucketName}/propusk/propusk-${STAMP}.apk"
    mc ls --recursive "builds/${bucketName}/propusk/"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: propusk-build
spec:
  # Cuántas veces recrear el pod si la compilación falló. Cero sería más honesto,
  # pero la red a veces parpadea al descargar el SDK, y un segundo intento es más barato
  # que explicar «por qué falló lo mío».
  backoffLimit: 1
  # Un techo para toda la compilación. Sin él, una compilación colgada retendría el nodo hasta la tarde.
  # La cuenta atrás corre desde la CREACIÓN del Job, no desde el arranque del contenedor: el tiempo en Pending y
  # la recreación del nodo un poco más adelante en la lab también lo consumen. Una hora no bastaba —
  # la compilación moría con DeadlineExceeded justo después de que la persona la hubiera esperado.
  activeDeadlineSeconds: 7200
  # La plantilla del pod: el Job estampa a partir de ella el pod en el que correrá la compilación. El pod no tiene nombre
  # propio — el Job añade una cola aleatoria a su propio nombre, así que hay que buscar el pod
  # por la etiqueta job-name, no por nombre.
  template:
    spec:
      # La compilación descarga código ajeno de internet y lo ejecuta al momento. Para esto no necesita
      # derechos de root: escribe solo en /work — incluido el cliente S3, que descarga
      # ahí también, porque a un usuario sin privilegios no le dejarán escribir en las carpetas de sistema
      # de la imagen. Los mismos tres campos estaban en la app de la primera lab y por la misma razón:
      # sin ellos el pod no será admitido en un clúster donde
      # el perfil de seguridad `restricted` está activado.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # Para un Job este es un campo obligatorio. Never significa: no reiniciar en el sitio un pod
      # fallido, sino ceder la decisión al Job — él creará uno nuevo.
      restartPolicy: Never
      containers:
        - name: build
          # La misma severidad a nivel de contenedor: escalar los propios privilegios está prohibido,
          # las capabilities de linux se retiran todas hasta la última.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Una imagen ya lista con Gradle y JDK 17. La versión del JDK no se elige al azar: debe
          # coincidir con jvmTarget = "17" en app-build.gradle.kts, de lo contrario la compilación
          # falla por una discrepancia de versión de bytecode. En la imagen no hay Android SDK — lo
          # descarga el primer paso del script, porque las imágenes con el SDK dentro pesan decenas
          # de gigabytes y tardarían más en descargarse que el propio SDK.
          image: gradle:8.9-jdk17
          # Ejecutamos no lo que la imagen hace por defecto, sino nuestro propio script del ConfigMap
          # montado en /scripts.
          command: ["bash", "/scripts/build.sh"]
          envFrom:
            # Las cuatro claves del secret se convierten en variables de entorno
            # con los mismos nombres: accessKey, secretKey, endpoint, bucketName.
            - secretRef:
                name: bucket-creds
          # El coste honesto de una compilación Android, hallado empíricamente. requests — cuánto
          # reservar: el planificador elige el nodo por este número, no por el consumo
          # real. El compilador de Kotlin no sobrevive con menos de cuatro gigabytes.
          # limits — el techo: en CPU, al topar con él se produce throttling; en memoria, el
          # contenedor se mata (OOMKilled). Para comparar, a la app de la primera lab
          # le bastaban 20m de CPU y 32Mi de memoria. Es precisamente por estos números que el nodo del
          # clúster de práctica habrá que agrandarlo: la compilación no cabe en el pedido en la lab 0.
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 6Gi
          # Tres volúmenes. Las fuentes y el script — solo lectura: el ConfigMap se monta
          # read-only de todos modos, pero un readOnly explícito dice enseguida que la compilación no escribe ahí.
          # Escribe en /work, y es el único sitio donde se le permite.
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: src
          configMap:
            name: propusk-src
            # Una clave de ConfigMap no puede contener una barra, pero una ruta de montaje
            # sí. Así es como un mapa plano se despliega en el árbol de directorios
            # que Gradle espera.
            items:
              - key: settings.gradle.kts
                path: settings.gradle.kts
              - key: build.gradle.kts
                path: build.gradle.kts
              - key: app-build.gradle.kts
                path: app/build.gradle.kts
              - key: AndroidManifest.xml
                path: app/src/main/AndroidManifest.xml
              - key: MainActivity.kt
                path: app/src/main/kotlin/io/aenix/propusk/MainActivity.kt
              - key: strings.xml
                path: app/src/main/res/values/strings.xml
        - name: scripts
          configMap:
            name: android-build-script
            # Permisos de archivo para el volumen: leer y ejecutar. El script se invoca como
            # `bash /scripts/build.sh`, así que el bit de ejecución aquí es una red de seguridad — lo
            # necesitará quien algún día ejecute el archivo directamente.
            defaultMode: 0755
        - name: work
          # Un disco temporal en el nodo, vive exactamente lo que vive el pod.
          # Aquí caerán el SDK, las dependencias de Gradle y el resultado de la compilación.
          emptyDir:
            # Doce gigabytes con margen: el SDK, la caché de Gradle y el resultado de la compilación son
            # seis-ocho. El techo hace falta para que una compilación desbocada no se coma el disco del nodo
            # por completo y arrastre consigo a los pods vecinos.
            sizeLimit: 12Gi
