---
# Lab 11. Fuentes de la app móvil «Pase de invitado» — lo que se entrega a la compilación como entrada.
#
# Se aplica en tu clúster de formación `lab`, no en el tenant del clúster de gestión:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f propusk-src.yaml
# Aquí no hay marcadores como tenant-workshopXX — no necesitas sustituir tu número en ningún sitio.
# El namespace tampoco se especifica: el objeto caerá en el que esté fijado en tu kubeconfig.
#
# La app es deliberadamente diminuta: una sola actividad, una línea de texto en la pantalla.
# El sentido de la lab no es Android, sino el hecho de que una compilación viaja al clúster.
#
# QUÉ SON ESTOS ARCHIVOS, si nunca has compilado una app móvil.
# Un proyecto Android no es un único archivo con código, sino un árbol de tres tipos de archivos:
#   *.gradle.kts  la descripción de la compilación: de dónde tomar las bibliotecas, con qué compilar, para qué
#                 versiones de Android compilar. Por su rol es un makefile, solo que en el lenguaje Kotlin;
#   *.kt          el código propiamente dicho de la aplicación;
#   *.xml         recursos: los textos y la descripción de qué pantalla abrir al pulsar
#                 el icono.
# El compilador Gradle lee este árbol y produce un APK — un único archivo instalador para el teléfono,
# por su rol lo mismo que un .msi para Windows. No necesitas instalar el Android SDK ni compilar
# a mano: de eso se encargará un Job de android-build.yaml, y aquí yace solo su entrada.
#
# Las fuentes viven en un ConfigMap y no en la imagen, exactamente por la misma razón
# por la que en la lab con la primera app la página de nginx vivía en un ConfigMap:
# para cambiarlas sin recompilar nada. Un ConfigMap es un objeto del clúster dentro del
# cual viven archivos de texto; al arrancar el contenedor el clúster los desliza
# dentro de él como archivos corrientes en disco.
#
# Las claves dentro de `data` son nombres de archivo, y todo lo que va debajo de la sangría tras `|` es el
# contenido literal del archivo, no YAML. Un comentario puesto dentro de tal
# bloque se convertiría en una línea del propio archivo, por eso todas las explicaciones de abajo están fuera,
# antes de la clave.
#
# El mapa plano de seis claves se despliega en un árbol de directorios no aquí, sino en el
# momento del montaje: la correspondencia «clave -> ruta» está definida en android-build.yaml, en el
# bloque volumes.items. Una clave de ConfigMap no puede contener una barra — de ahí el nombre plano
# app-build.gradle.kts, que en el proyecto se convierte en app/build.gradle.kts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: propusk-src
data:
  # El archivo superior del proyecto: enumera de dónde saca Gradle los plugins y bibliotecas y qué
  # módulos forman parte del proyecto (aquí hay uno — app). Los tres repositorios son públicos, en internet:
  # el contenedor de compilación arranca vacío y saca todo de ahí, de ahí la duración de la compilación.
  # Este es también el primer sitio que editarás cuando seguridad cierre el acceso saliente — aquí se
  # escribirá un repositorio proxy interno, exactamente como Docker Hub se cambió por Harbor.
  settings.gradle.kts: |
    pluginManagement {
      repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
      }
    }
    dependencyResolutionManagement {
      repositories {
        google()
        mavenCentral()
      }
    }
    rootProject.name = "propusk"
    include(":app")

  # El archivo raíz de compilación: fija las versiones de dos plugins — el compilador de Android y el compilador
  # de Kotlin. `apply false` significa «declarar la versión, pero no habilitarla en el proyecto raíz»:
  # los habilitará el módulo app. Las versiones están clavadas a propósito. Una compilación que saca
  # «lo último» se compila distinto dentro de un mes que hoy, y serás tú quien tenga que averiguarlo.
  build.gradle.kts: |
    plugins {
      id("com.android.application") version "8.5.2" apply false
      id("org.jetbrains.kotlin.android") version "1.9.24" apply false
    }

  # Descripción del propio módulo de la aplicación. Aquí hay tres números de los que dependen tanto lo que
  # descarga la compilación como dónde llegará siquiera a ejecutarse la app:
  #   compileSdk 34   la versión del Android SDK con la que compilamos. Es la que descarga el paso de instalación
  #                   del SDK — alrededor de un gigabyte y medio, el paso de compilación más lento;
  #   minSdk 24       el Android más antiguo en el que la app funcionará (eso es Android 7).
  #                   Súbelo — cortas los teléfonos viejos, bájalo — tendrás que arrastrar
  #                   bibliotecas de compatibilidad;
  #   jvmTarget 17    Kotlin se compila a bytecode de Java, y este número debe coincidir
  #                   con la versión del JDK en la imagen de compilación (gradle:8.9-jdk17 en android-build.yaml).
  #                   Si divergen, la compilación falla por un desajuste de versión de bytecode.
  app-build.gradle.kts: |
    plugins {
      id("com.android.application")
      id("org.jetbrains.kotlin.android")
    }

    android {
      namespace = "io.aenix.propusk"
      compileSdk = 34

      defaultConfig {
        applicationId = "io.aenix.propusk"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
      }

      compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
      }

      kotlinOptions {
        jvmTarget = "17"
      }

      sourceSets {
        getByName("main") {
          java.srcDirs("src/main/kotlin")
        }
      }
    }

  # El pasaporte de la app para el teléfono: qué pantallas tiene y cuál de ellas se abre
  # al pulsar el icono. De eso se encarga exactamente el bloque intent-filter con MAIN y LAUNCHER —
  # sin él la app se instalará, pero no aparecerá ningún icono en el menú.
  AndroidManifest.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <manifest xmlns:android="http://schemas.android.com/apk/res/android">
      <application android:label="@string/app_name">
        <activity
            android:name=".MainActivity"
            android:exported="true">
          <intent-filter>
            <action android:name="android.intent.action.MAIN" />
            <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
        </activity>
      </application>
    </manifest>

  # La única pantalla de la app — y todo el código que el proyecto tiene en total.
  # Se usa android.app.Activity a secas, no una biblioteca de compatibilidad: el proyecto tiene cero
  # dependencias externas, y eso ahorra un par de minutos de descarga en cada compilación.
  # R.string.greeting — una referencia a un texto de strings.xml. La clase R no está en las fuentes, la
  # genera la compilación. Por eso el error «unresolved reference: R» significa un paso de generación
  # de recursos fallido, no una errata en el código.
  MainActivity.kt: |
    package io.aenix.propusk

    import android.app.Activity
    import android.os.Bundle
    import android.widget.TextView

    class MainActivity : Activity() {
      override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val view = TextView(this)
        view.textSize = 22f
        view.setPadding(48, 96, 48, 48)
        view.text = getString(R.string.greeting)
        setContentView(view)
      }
    }

  # Textos extraídos del código: así se editan y traducen sin tocar al programador.
  # app_name se ve bajo el icono en el teléfono, greeting — en la propia pantalla.
  strings.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <resources>
      <string name="app_name">Pase de invitado</string>
      <string name="greeting">Solicitar un pase de invitado</string>
    </resources>
