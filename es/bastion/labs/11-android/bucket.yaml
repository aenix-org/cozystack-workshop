---
# Lab 11. Bucket para los APK compilados.
#
# Un bucket es un área con nombre en el almacenamiento de objetos: los archivos se suben y
# se descargan como objetos completos, por HTTP, y nunca se montan en ningún sitio. No hay
# directorios dentro; una barra en el nombre de un objeto se dibuja como árbol solo en la interfaz.
#
# Este es un objeto de tenant: vive NO en el clúster `lab`, sino en tu namespace
# del clúster de gestión. Por eso el kubeconfig aquí debe ser el del tenant,
# no el que usas para trabajar con el clúster `lab`. Está pensado así: los artefactos de compilación
# deben sobrevivir al clúster en el que se compilaron.
#
# Antes de aplicar, reemplaza tenant-workshopXX por tu propio namespace, de lo contrario el pedido
# irá al tenant equivocado y lo más probable es que no pase las comprobaciones de permisos.
#
#     export KUBECONFIG=~/.kube/config
#     kubectl apply -f bucket.yaml
#
# Lo mismo se puede hacer con el ratón en el dashboard del tenant (Crear aplicación -> Bucket).
# El resultado es idéntico; la diferencia es que el texto se puede revisar y poner en Git.
#
# Qué ocurre tras aplicar: la plataforma levantará el bucket en unos segundos
# y emitirá claves de acceso, guardándolas en el secreto bucket-builds-ci-credentials en el mismo
# namespace. Cuatro valores de ahí (endpoint, bucketName, accessKey, secretKey)
# se transfieren al clúster `lab` a mano — los clústeres son distintos, nada se traslada por sí solo.
apiVersion: apps.cozystack.io/v1alpha1
kind: Bucket
metadata:
  # El nombre del objeto Cozystack, y solo eso. El nombre real del bucket en el almacenamiento lo
  # emite la propia plataforma — largo, de la forma bucket-a9209f83-... Acabará en el campo
  # bucketName del secreto emitido, y eso es exactamente lo que hay que poner en la compilación, no `builds`.
  name: builds
  namespace: tenant-workshopXX
spec:
  users:
    # Cada clave de este mapa es un usuario S3 independiente con su propio par de claves.
    # Un objeto vacío significa «acceso completo de lectura y escritura».
    # Así puedes conceder al compilador acceso de escritura, y al equipo móvil — solo lectura:
    #   ci: {}
    #   mobile:
    #     readonly: true
    ci: {}
