---
# Lab 5 · Infraestructura en Git. Espacio de nombres para el servicio «Pases».
#
# Este archivo no se aplica al clúster a mano. Lo colocas en tu repositorio en
# GitHub, en la carpeta apps/, y Flux lo lleva al clúster `lab` por sí mismo, según su programación:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# Cómo leer cualquier manifiesto: apiVersion — la versión del esquema de descripción (el clúster
# la usa para saber cómo analizar el objeto), kind — qué creamos, metadata.name — el
# nombre por el que luego se busca el objeto. Estos tres campos están presentes en cada objeto y
# no se explican por separado más abajo.
#
# Un espacio de nombres (namespace) es una partición lógica dentro de un mismo clúster:
# su propio ámbito de nombres, sus propios permisos, sus propias cuotas. Lo más parecido en vSphere
# es una carpeta en el árbol de vCenter o un resource pool.
#
# Por qué vive en Git junto con la aplicación en lugar de crearse a mano: cuando el servicio salga
# del repositorio, Flux eliminará también el espacio de nombres. No quedará una partición vacía
# que dentro de seis meses nadie recuerde por qué se creó.
apiVersion: v1
kind: Namespace
metadata:
  name: passes
  # La etiqueta no afecta al funcionamiento del servicio — se necesita para que con un solo comando
  # se pueda encontrar todo lo relacionado con «Pases»: kubectl get all -A -l app.kubernetes.io/part-of=passes.
  # El nombre part-of está tomado del conjunto común de etiquetas de Kubernetes, no lo inventamos nosotros:
  # herramientas externas (monitorización, exportaciones) buscan exactamente esta.
  labels:
    app.kubernetes.io/part-of: passes
