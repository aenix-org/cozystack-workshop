---
# Laboratorio 5 · Infraestructura en Git. El propio servicio «Pase»: cuatro objetos en un solo archivo.
#
# No se aplica al clúster a mano. El archivo se coloca en su propio repositorio en GitHub, en la
# carpeta apps/, junto a namespace.yaml, y Flux lo lleva al clúster `lab` por sí mismo:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# La línea --- separa los objetos: un archivo, cuatro objetos independientes. El orden en el
# archivo no afecta al orden de creación: el clúster se las arregla por sí mismo.
#
# En cada objeto: apiVersion — la versión del esquema de descripción, kind — qué creamos,
# metadata.name — el nombre del objeto, metadata.namespace — en qué partición del clúster
# vive. Más adelante estos campos no se explican por separado.
#
# Ninguno de los cuatro objetos contiene una contraseña, una clave ni un token, y no es
# casualidad: lo que llega a Git permanece allí para siempre — la historia se puede reescribir,
# pero todos los que alcanzaron a clonarlo conservan la copia antigua. Los secretos no tienen lugar aquí.

# --- 1 de 4. Configuración del servidor web -----------------------------------------
# Un ConfigMap coloca en el clúster un archivo de texto aparte de la aplicación, y más abajo
# (en la sección volumes) ese archivo se monta dentro del contenedor. La idea es cambiar la
# configuración sin reconstruir la imagen: editas aquí, haces commit y en un minuto el clúster tiene la nueva versión.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-conf
  namespace: passes
# Una clave dentro de data se convierte en el nombre del archivo en el contenedor: default.conf
# cae en la carpeta que nginx lee al arrancar. La barra vertical tras el nombre es la forma de
# escribir en YAML texto multilínea tal cual, conservando los saltos de línea.
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      # Dirección para la comprobación de disponibilidad. El clúster llama aquí y no deja
      # pasar tráfico a una copia hasta que recibe respuesta.
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        # En la página que se sirve reemplazamos __POD__ por el nombre de la máquina donde
        # se ejecuta nginx. Dentro del pod, el nombre de la máquina es el nombre del propio pod.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
    }
---
# --- 2 de 4. La página que el servicio sirve ----------------------------------------
# En este laboratorio la página es un marcador de posición: la aplicación real aparece más tarde.
# Ahora lo que importa no es lo que muestra el servicio, sino de dónde salió en el clúster. El texto
# __POD__ en el marcado es un marcador para sustitución: nginx lo reemplaza por el nombre del pod
# que sirvió la página, y por ese nombre verás más adelante que hay más de una copia.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-page
  namespace: passes
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Pase de invitado</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 40rem;
               color: #222; }
        h1 { font-weight: 600; }
        .v { display: inline-block; padding: .2rem .6rem; border-radius: .3rem;
             background: #eef; font-family: ui-monospace, monospace; }
        .pod { margin-top: 2rem; color: #666; font-size: .9rem; }
        b { font-family: ui-monospace, monospace; color: #222; }
      </style>
    </head>
    <body>
      <h1>Servicio «Pase de invitado»</h1>
      <p>Solicitud de pase de invitado. Versión <span class="v">v1</span></p>
      <p>Desplegado desde Git. Nadie lo tocó a mano.</p>
      <div class="pod">te atendió el Pod <b>__POD__</b></div>
    </body>
    </html>
---
# --- 3 de 4. Descripción de la propia aplicación ------------------------------------
# Un Deployment no es «ejecuta un contenedor», sino «mantén en ejecución tantas copias de tal
# contenedor». La diferencia se ve cuando una copia muere: el clúster crea una nueva, sin
# preguntar y sin avisar. En vSphere lo más parecido es HA, pero allí se reinicia una máquina,
# y aquí se recrea una copia de la aplicación, y se hace constantemente, no solo ante un fallo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes
  namespace: passes
  labels:
    app: passes
spec:
  # Cuántas copias mantener en ejecución. La formulación importa: no «ejecuta una», sino
  # «mantén una». Este es el número que cambiarás a través de Git para ver qué ocurre.
  replicas: 1
  # Por qué señal reconoce el Deployment sus copias. No es una lista de nombres de pods —
  # los nombres cambian en cada recreación — sino la condición «todos los pods con la etiqueta app: passes».
  # La etiqueta de abajo, en template.metadata.labels, debe coincidir con esta condición: si divergen,
  # el clúster se negará a aceptar el manifiesto, porque las copias no serían de nadie.
  selector:
    matchLabels:
      app: passes
  # template — el molde con el que se estampan las copias. Todo lo que hay dentro describe un
  # pod. Editar el molde significa desplegar una nueva versión: las copias antiguas se reemplazan por nuevas.
  template:
    metadata:
      labels:
        app: passes
    spec:
      # Restricciones de seguridad a nivel de todo el pod. En vSphere no hay equivalente: allí
      # el aislamiento lo da el hipervisor, mientras que los contenedores comparten el núcleo con
      # el nodo, así que hay que recortar los privilegios de forma explícita.
      #   runAsNonRoot   no ejecutar si la imagen quiere trabajar como root
      #   runAsUser      con qué usuario numérico ejecutar; 65532 es el identificador
      #                  «no privilegiado» aceptado en las imágenes mínimas
      #   seccompProfile qué llamadas al sistema están permitidas; RuntimeDefault es un conjunto
      #                  que descarta lo manifiestamente peligroso y no rompe nada
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Las mismas restricciones, pero ahora para un contenedor concreto.
          #   allowPrivilegeEscalation: false  el proceso no podrá obtener más privilegios
          #   capabilities.drop: ["ALL"]       quitar todas las capacidades especiales del núcleo
          #                                    (cambiar la red, montar, cambiar la hora);
          #                                    un servidor web no necesita ninguna
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # La imagen se toma de un registro público — en el próximo laboratorio Seguridad lo
          # prohibirá y la dirección cambiará a nuestro propio Harbor. La variante unprivileged no
          # se eligió por estética: la imagen ordinaria de nginx escucha en el puerto 80 y para eso
          # quiere privilegios de root, y con runAsNonRoot de arriba no arrancaría en absoluto.
          # La versión está fijada (1.27-alpine), no latest: de lo contrario el mismo manifiesto
          # desplegaría mañana una aplicación distinta, y no te enterarías.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # El puerto en el que escucha la aplicación. El nombre `http` no es adorno: a él se
          # refieren la comprobación de disponibilidad de abajo y el Service al final del archivo.
          # Cambia el número de puerto y lo cambiarás en un solo lugar, no en tres.
          ports:
            - containerPort: 8080
              name: http
          # requests — cuántos recursos se reservan de forma garantizada; por este número el
          # planificador elige un nodo. limits — el techo por encima del cual no se deja pasar.
          # Subestimar requests significa que en un nodo cabrá más de lo que puede soportar;
          # superar limits en memoria — matan el contenedor, en CPU — lo frenan.
          # 20m = veinte milésimas de un núcleo, Mi = megabytes. Los valores aquí son pequeños,
          # porque en el laboratorio hay un solo nodo y no es grande.
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Comprobación de disponibilidad: el clúster llama a esta dirección y no deja pasar tráfico
          # a una copia hasta que recibe respuesta. Sin ella el Service enviaría solicitudes a un
          # nginx que aún no se ha levantado, y el usuario vería un error en cada despliegue.
          # Flux también la espera — en kustomization.yaml pedimos wait: true.
          #   initialDelaySeconds  esperar antes del primer intento, dar tiempo al proceso a arrancar
          #   periodSeconds        con qué frecuencia llamar después
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # Dónde colocar dentro del contenedor el contenido de los dos ConfigMap del inicio del archivo.
          # /etc/nginx/conf.d — la carpeta de la que nginx lee la configuración al arrancar,
          # /usr/share/nginx/html — la carpeta desde la que sirve los archivos.
          # La imagen no cambia por ello: los archivos aparecen en ella en el momento del arranque.
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: page
              mountPath: /usr/share/nginx/html
      # Qué montar exactamente. Los nombres conf y page son internos, enlazan este bloque
      # con los volumeMounts de arriba; name dentro de configMap ya es el nombre del objeto real
      # en el clúster. Si te equivocas en él, el pod quedará colgado esperando un ConfigMap inexistente.
      volumes:
        - name: conf
          configMap:
            name: passes-conf
        - name: page
          configMap:
            name: passes-page
---
# --- 4 de 4. Un nombre permanente detrás del cual están todas las copias ------------
# Los pods se recrean, y sus direcciones son nuevas cada vez. El Service da un nombre invariable —
# passes.passes.svc.cluster.local — por el que dentro del clúster siempre se puede alcanzar
# las copias vivas. Es un balanceo interno; desde fuera del clúster aún no se puede llegar aquí.
apiVersion: v1
kind: Service
metadata:
  name: passes
  namespace: passes
spec:
  # El vínculo del Service con los pods no es una lista de direcciones, sino la condición «todos los pods con la etiqueta app: passes».
  # Apareció una copia nueva con esa etiqueta — entró en el balanceo por sí misma, no hay
  # nada que registrar. Desapareció — se la quitó del reparto.
  selector:
    app: passes
  # port — en qué puerto responde el propio Service, targetPort — hacia dónde reenvía
  # dentro del contenedor. Aquí targetPort se refiere al nombre `http` del bloque ports de arriba,
  # y no a un número: el número se puede cambiar en un solo lugar y el vínculo no se romperá.
  ports:
    - port: 80
      targetPort: http
