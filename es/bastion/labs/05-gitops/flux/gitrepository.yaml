---
# Lab 5 · Infraestructura en Git. Fuente: de dónde toma Flux el estado deseado.
#
# Se aplica en tu clúster `lab` junto con el kustomization.yaml vecino:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# ATENCIÓN: REEMPLAZA url por la dirección de TU repositorio antes de aplicar: la cadena
# ЗАМЕНИТЕ-МЕНЯ es un marcador de posición; con ella Flux irá a una dirección inexistente y se detendrá
# con un error. Comprueba también la rama: GitHub crea los nuevos repositorios con la rama main.
#
# En cada objeto: apiVersion es la versión del esquema de la descripción, kind es lo que creamos,
# metadata.name es el nombre por el que se referencia el objeto más adelante. No se repite abajo.
#
# La única tarea de este objeto es mantener en el clúster una copia fresca del repositorio.
# No aplica nada: solo descarga. Lo aplica el Kustomization vecino,
# y este lo referencia por el nombre `passes`, por eso el nombre no se puede cambiar por sí solo.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: passes
  # flux-system es el espacio de nombres que creó el comando flux install; en él viven
  # los propios servicios de Flux. Los objetos de configuración van también allí, si no los servicios no los verán.
  namespace: flux-system
spec:
  # Con qué frecuencia ir a Git a por el nuevo estado. Un minuto es para la lab;
  # en producción suele ser 1–5 minutos, y la reacción instantánea se hace con un webhook desde GitHub.
  interval: 1m
  # La dirección del repositorio. Es público, por eso aquí no hay ni login ni clave —
  # es una simplificación del banco de pruebas de aprendizaje. En producción el repositorio es privado, y junto a él aparece
  # una referencia a un secreto con una clave de despliegue (el campo secretRef).
  url: https://github.com/ЗАМЕНИТЕ-МЕНЯ/passes-gitops
  # Qué rama tratar como fuente de la verdad. Al clúster irá lo que se fusiona en main;
  # lo que está en otras ramas no irá. De ahí viene la revisión: un cambio
  # primero vive en su propia rama, donde se puede ver, y solo la fusión en main
  # lo hace efectivo. Si el repositorio se creó con la vieja rama master —
  # corrígelo aquí, si no Flux no encontrará qué leer.
  ref:
    branch: main
