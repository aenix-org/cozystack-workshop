---
# Lab 5 · Infraestructura en Git. Tarea: qué exactamente del repositorio aplicar al clúster.
#
# Se aplica en tu clúster `lab` junto con el archivo vecino gitrepository.yaml:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# En cada objeto: apiVersion — la versión del esquema de descripción, kind — qué creamos,
# metadata.name — el nombre del objeto. No se explican por separado más abajo.
#
# Separación de responsabilidades: GitRepository descarga el repositorio y no aplica nada,
# este objeto toma lo descargado y alinea el clúster con ello. El nombre Kustomization coincide
# con el nombre de la utilidad kustomize, pero son cosas distintas — aquí es un objeto en el clúster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passes
  # Vive en el mismo lugar que los servicios de Flux — de lo contrario kustomize-controller no lo detectará.
  namespace: flux-system
spec:
  # Con qué frecuencia reconciliar el estado real del clúster con el descrito en Git.
  # Esto no es «volver a aplicar una vez por minuto» — es «comparar y corregir
  # las discrepancias una vez por minuto». Aunque nada haya cambiado en Git, una edición hecha
  # a mano mediante kubectl edit se revertirá en silencio. Verás la diferencia
  # un poco más adelante en la lab, cuando tú mismo cambies algo en el clúster saltándote Git.
  interval: 1m
  # Una carpeta dentro del repositorio. Todo lo que hay en ella acabará en el clúster; los archivos junto
  # a ella — por ejemplo README.md en la raíz — no se tocarán. El nombre `apps` lo elegimos nosotros, pero
  # debe coincidir con la carpeta en la que colocas los manifiestos en tu repositorio.
  path: ./apps
  # Eliminar del clúster los objetos que han desaparecido de Git.
  # Sin esto Git deja de ser una descripción completa: lo eliminado del repositorio
  # seguiría funcionando en el clúster, y nadie lo sabría.
  prune: true
  # Qué fuente mirar. El nombre `passes` es el metadata.name de gitrepository.yaml,
  # no el nombre del repositorio en GitHub. Si lo renombras allí — corrígelo aquí también, de lo contrario Flux
  # esperará una fuente que no existe, y el Kustomization no llegará a estar listo.
  sourceRef:
    kind: GitRepository
    name: passes
  # Esperar a que los recursos aplicados estén listos, en lugar de reportar éxito justo después del apply.
  # La diferencia es exactamente la misma que entre «solicitud enviada» y «solicitud completada»: sin wait
  # Flux reportará éxito aunque los pods no lleguen a levantarse después.
  wait: true
  # Cuánto esperar esa disponibilidad antes de declarar el apply como fallido.
  # Tres minutos — con margen para descargar la imagen en un nodo vacío. Un valor demasiado
  # pequeño dará fallos falsos en una red lenta, uno demasiado grande — te quedarás
  # mirando «en progreso» durante mucho tiempo en lugar de un error claro.
  timeout: 3m
