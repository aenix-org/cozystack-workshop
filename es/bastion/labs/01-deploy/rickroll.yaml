# Lab 1. Toda la aplicación de entrenamiento rickroll en un solo archivo: ajustes de nginx, la página,
# el propio despliegue y una dirección permanente para acceder a él. Cuatro objetos separados por `---`.
#
# Se aplica en tu clúster de entrenamiento `lab`, no en un tenant del clúster de gestión:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll.yaml
# Aquí no hay marcadores como tenant-workshopXX — no necesitas sustituir tu número en ninguna parte.
#
# Los campos que se repiten en los cuatro objetos los repasamos una sola vez aquí:
#   apiVersion — la sección de la API en la que vive este tipo de objeto;
#   kind       — el tipo de objeto en sí;
#   metadata.name — el nombre por el que luego se busca el objeto mediante `kubectl get`.
# El nombre es único dentro de su propio tipo, por eso el Deployment y el Service de abajo se llaman ambos
# rickroll y no entran en conflicto.
---
# Ajustes de nginx. No cambian entre versiones de la página, por eso se mantienen aparte.
# ConfigMap — un archivo de ajustes que vive en el clúster por su cuenta y se monta
# dentro del contenedor al arrancar. La idea es cambiar los ajustes sin reconstruir la
# imagen. La clave `default.conf` se convierte en el nombre del archivo en el directorio donde se monta el volumen.
#
# Todo lo que está por debajo de la sangría tras `|` no es YAML, sino el contenido literal del archivo. Las líneas
# con almohadilla dentro de este bloque van a la config de nginx tal cual, en lugar de desaparecer durante
# el análisis. Por la misma razón no se añadieron comentarios al bloque de la página de abajo:
# es HTML, y una almohadilla en él sería visible para el usuario en la pantalla.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-conf
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      location / {
        # La esencia entera de la lab: nginx sustituye el nombre de su propio pod directamente en el HTML.
        # $hostname dentro del pod es exactamente el nombre del pod.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
---
# La página, versión 1. Un objeto separado de los ajustes — para que en la lab 4 la aplicación
# pueda cambiarse a la segunda versión sin tocar la config de nginx ni reconstruir la imagen.
# El sufijo -v1 en el nombre no es decoración: rickroll-page-v2 aparecerá junto a ella, y cambiar
# el volumen entre ambas es exactamente lo que es desplegar una nueva versión.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v1
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Never Gonna Give You Up</title>
    <style>
      body{background:#0d0d12;color:#e8e8ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#ff0057,#ffb800,#00e0ff,#ff0057);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#9aa0b5;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#6f7690}
      .pod b{display:block;margin-top:.4em;color:#00e0ff;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#4d5366;font-size:14px}
    </style>
    <h1>Never Gonna Give You Up</h1>
    <p class="lyr">Never gonna let you down &middot; Never gonna run around and desert you</p>
    <div class="pod">te atendió el Pod<b>__POD__</b></div>
    <p class="hint">Actualiza la página. Cuando haya más réplicas, el nombre empezará a cambiar.</p>
    </html>
---
# La aplicación en sí. Un Deployment describe el estado deseado — qué imagen ejecutar,
# cuántas copias mantener, cómo reemplazarlas durante una actualización. El clúster luego alinea
# la realidad con esta descripción y la vigila de forma continua, no solo una vez al crearla.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rickroll
  labels:
    app: rickroll
spec:
  # Cuántas copias mantener en ejecución. La formulación es deliberada: no «ejecuta una»,
  # sino «mantén una». Una copia desaparece — el clúster crea una nueva sin preguntar. En la lab 3
  # este mismo campo empieza a cambiarlo el autoescalado, por eso ya no lo tocas a mano.
  replicas: 1
  # Por qué etiqueta el Deployment considera propios los pods. La etiqueta de aquí y la etiqueta de la template
  # de abajo deben coincidir: si difieren, el objeto no se creará en absoluto.
  selector:
    matchLabels:
      app: rickroll
  # La template del pod — cada copia se estampa a partir de ella. Editar cualquier campo dentro de template
  # significa una nueva revisión de la aplicación y reemplazar las copias una a una (eso es exactamente la lab 4).
  # Editar campos fuera de template (por ejemplo, replicas) no crea una revisión.
  template:
    metadata:
      labels:
        # La misma etiqueta está en los propios pods: por ella los encuentra el Service al final del archivo.
        app: rickroll
    spec:
      # Requisitos del perfil de seguridad `restricted` a nivel de todo el pod: ejecución
      # no como root, un UID concreto y el perfil seccomp estándar. En un clúster corporativo
      # con `restricted` habilitado, un pod sin estos campos no se admitirá para ejecutarse,
      # y el rechazo llega en el momento en que se crea el pod, no cuando se aplica el manifiesto.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # La misma rigurosidad, pero a nivel de contenedor: al proceso de dentro se le prohíbe
          # escalar sus privilegios, y se le retiran todas las capacidades de linux.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Una variante no privilegiada: escucha en 8080 y se ejecuta no como root.
          # Esto solo basta para el perfil `baseline`, pero no para `restricted` — ese necesita
          # securityContext explícito en el pod y en el contenedor, que están fijados arriba. En un
          # clúster corporativo lo que suele estar habilitado es `restricted`.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # Por defecto nginx levanta un proceso de trabajo por núcleo del nodo. En una máquina
          # de entrenamiento con un solo núcleo eso es un proceso, pero en un nodo de producción con 64 núcleos son 64,
          # y un pod con un límite de memoria pequeño se cae con OOMKilled antes de la primera petición.
          # El autotune cuenta los workers por el límite de CPU: con 300m eso es un proceso.
          # A través de una variable de entorno, no vía -g: la directiva ya está en la config base
          # de la imagen, y una segunda declaración cae nginx con un error «duplicate».
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # Al puerto se le da un nombre, no solo un número: a `http` lo referencian el readinessProbe
          # de abajo y el targetPort del Service. Cambia el número — lo editas en un solo sitio.
          ports:
            - containerPort: 8080
              name: http
          # Dos cosas diferentes que se confunden constantemente. requests — cuánto de un recurso
          # reservar de forma garantizada; por él el planificador elige un nodo, y a partir de él
          # el autoescalado de la lab 3 también calcula la carga en porcentaje.
          # limits — el techo por encima del cual no se te permite subir: en la CPU cuando aprietas
          # te frenan, en la memoria matan el contenedor.
          resources:
            # Deliberadamente diminutos: en el workshop habrá muchas aplicaciones así.
            # 20m son dos centésimas de un núcleo. El valor es bajo a propósito: cuanto menores sean los
            # requests, más rápido la carga sobrepasa el umbral y el crecimiento de copias en la lab 3
            # se ve en segundos, no en media hora.
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          # Comprobación de disponibilidad. Hasta que llegue una respuesta de esta dirección, el clúster no
          # enruta tráfico a la copia. Para ella se configura un location /healthz aparte con una respuesta «ok»
          # en la config de nginx. Este campo es lo que paga el despliegue sin tiempo de inactividad
          # en la lab 4: la copia vieja se apaga solo después de que la nueva haya respondido.
          # Quítalo — y la actualización empezará a tirar peticiones.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            # Dos segundos antes del primer toque — alcanzado con la experiencia. Menos no tiene
            # sentido, nginx tarda eso en arrancar; más estiraría cada despliegue en balde.
            initialDelaySeconds: 2
          # Dónde colocar el contenido del ConfigMap dentro del contenedor. Los directorios se eligen
          # no arbitrariamente: del primero nginx sirve archivos, del segundo lee ajustes.
          # Sin estas dos líneas ambos ConfigMap simplemente estarían en el clúster,
          # y nginx mostraría su página por defecto.
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
      # Qué ConfigMap conectar al pod. El nombre del volumen de aquí lo ata a la entrada
      # en volumeMounts de arriba — son los nombres los que deben coincidir, el orden no importa para la atadura.
      # Pero para la lab 4 sí importa, ver la advertencia de abajo.
      volumes:
        # ATENCIÓN: este volumen debe ser el primero (volumes[0]).
        # La lab 4 cambia la versión de la página con un patch por índice.
        # JSON Patch direcciona un elemento de la lista por número, no por nombre. Intercambia los volúmenes
        # y el patch reemplazará silenciosamente los ajustes de nginx en lugar de la página, la aplicación
        # se romperá, y el mensaje de error hablará de algo completamente distinto.
        - name: page
          configMap:
            name: rickroll-page-v1
        - name: conf
          configMap:
            name: rickroll-conf
---
# La dirección permanente de la aplicación. Las copias nacen y mueren, sus direcciones cambian, pero el nombre
# `rickroll` dentro del clúster permanece igual — por él la llaman los vecinos a la aplicación.
# La lista de copias vivas detrás de este nombre la mantiene el propio clúster, por etiquetas.
apiVersion: v1
kind: Service
metadata:
  name: rickroll
spec:
  # A quién poner detrás de esta dirección: todos los pods con tal etiqueta, quienquiera que los haya
  # creado. De ahí una molestia típica — un pod ajeno con la etiqueta app: rickroll
  # entrará silenciosamente en el balanceo y empezará a responder a tus usuarios. El script
  # check.sh de esta carpeta verifica aparte que no haya tales impostores.
  selector:
    app: rickroll
  ports:
    # port — en qué puerto responde el propio servicio, targetPort — a dónde llama dentro
    # del pod. Aquí targetPort se fija por el nombre del puerto del contenedor, no por un número: cambia
    # el número en el contenedor — y no tendrás que editar este archivo.
    - port: 80
      targetPort: http
