# Lab 10 · pedido de una base MongoDB para pases de distinta forma.
# Descripción de lo que quieres obtener; la plataforma monta y configura el servicio.
# Lo mismo que pedirías con el ratón en el panel, pero en texto.
# Se aplica NO en el clúster de laboratorio, sino en el tenant del clúster de gestión:
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f mongodb.yaml
#
# ANTES DE APLICAR: reemplaza tenant-workshopXX por tu namespace,
# y ЗдесьВашПароль por la contraseña que elijas.
apiVersion: apps.cozystack.io/v1alpha1
kind: MongoDB
metadata:
  name: passes
  namespace: tenant-workshopXX
spec:
  # Una sola copia. MongoDB está pensada para un conjunto de réplicas de tres: votan
  # cuál es la principal y sobreviven a la pérdida de una. Con una sola copia no hay
  # con quién votar, y el chart activa para ello un modo «inseguro» aparte. Para el
  # laboratorio sirve; para producción, no.
  replicas: 1
  # Disco para los datos. A cuatro documentos de ejemplo les basta un megabyte, pero
  # luego es más fácil coger el volumen con holgura que ampliarlo.
  size: 5Gi
  # replicated — volúmenes que tienen una copia en otro nodo del clúster: si un nodo
  # se cae, los datos permanecen.
  storageClass: replicated
  # Procesador y memoria asignados al Pod de la base. Para cuatro documentos, de sobra.
  resourcesPreset: s1.small
  # Rama de MongoDB. No se puede cambiar a posteriori en una base viva sin una actualización.
  version: v8
  # false — la base solo es accesible desde dentro del clúster; el puerto no se expone
  # hacia fuera. Accederás a ella desde un Pod de trabajo levantado al lado.
  external: false
  # El sharding reparte los datos entre varios conjuntos de servidores. Hace falta
  # cuando los datos no caben en un solo servidor; cuatro pases sí caben.
  sharding: false
  # Usuario de la base y su contraseña. Elige la tuya y recuérdala: la necesitan el
  # Pod de trabajo (en la cadena de conexión MONGO_URI) y el script de comprobación
  # (variable MONGO_PASSWORD). La cuenta se crea en la base de servicio admin, por eso
  # en la cadena de conexión es obligatorio authSource=admin.
  users:
    passapp:
      password: ЗдесьВашПароль
  # La base passes y los permisos en ella: al usuario passapp se le concede el rol admin
  # de esta base, es decir, puede leer, escribir, construir índices y cambiar la
  # configuración de las colecciones. Esto no otorga permisos sobre otras bases.
  databases:
    passes:
      roles:
        admin:
          - passapp
  # Copias de seguridad en almacenamiento de objetos. En el entorno de pruebas, desactivadas.
  backup:
    enabled: false
