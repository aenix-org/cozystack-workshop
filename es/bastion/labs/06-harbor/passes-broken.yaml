---
# Lab 6 · Tu propio registro de imágenes privado. ESTE ARCHIVO ESTÁ DELIBERADAMENTE INCOMPLETO.
#
# No va a funcionar, y es intencionado: debes ver el fallo con tus propios ojos y
# averiguar por ti mismo qué le faltaba al clúster. Aquí falta una sola cosa: aquello con lo
# que el clúster se identifica ante el registro cerrado cuando viene a por una imagen. El registro
# no reparte imágenes a cualquiera, y en esta descripción no hay nada que ayude al clúster a probar
# su derecho. Qué línea exacta lo arregla — lo descubrirás a lo largo de la lab; la versión que
# funciona está al lado, en passes.yaml, y no tiene sentido abrirla antes del recorrido guiado.
#
# Aquí solo hay un Deployment, sin Service: un nombre estable para el servicio aún no hace falta —
# de todos modos no llegaremos hasta un pod que responda, ya que la imagen no se descargará.
#
# Se aplica en tu clúster `lab`, en el espacio de nombres por defecto:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f passes-broken.yaml
#     kubectl get pods -l app=passes-api -w
#
# ATENCIÓN: HARBOR-HOST es un marcador de posición, no una dirección que funcione. Sustituye la dirección de tu Harbor,
# de lo contrario obtendrás un error distinto del que se escribió este archivo (hay dos líneas con el marcador):
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # macOS
#
# En el objeto de abajo: apiVersion — la versión del esquema de la descripción, kind — qué creamos,
# metadata.name — el nombre del objeto. No se explican por separado más adelante.
#
# Un Deployment no es «ejecuta un contenedor» sino «mantén ejecutándose tantas copias de este contenedor».
# Una copia desaparece — el clúster crea una nueva sin preguntar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Una copia: para recorrer el fallo, con una basta, y habrá menos ruido en los logs
  # y en la salida de kubectl describe.
  replicas: 1
  # La condición «mis copias son pods con la etiqueta app: passes-api». La etiqueta en la plantilla del pod de abajo
  # debe coincidir con esta, de lo contrario el clúster rechazará el manifiesto.
  selector:
    matchLabels:
      app: passes-api
  # La plantilla a partir de la cual se estampan las copias. Todo lo que hay dentro describe un único pod.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Restricciones de seguridad para todo el pod: no ejecutar como root, trabajar como el
      # usuario no privilegiado 10001, restringir el conjunto de llamadas al sistema al
      # perfil estándar. La imagen está construida también para esto (ver app/Dockerfile, la línea USER).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Derechos a nivel de contenedor: no concederse privilegios extra y descartar todas las
          # capacidades especiales del kernel. La aplicación necesita un único puerto de red, el resto sobra.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # La primera parte del nombre de la imagen es la dirección del registro. Por eso exactamente mudarse a tu propio
          # registro cambia los manifiestos: el nombre de la imagen pasa a ser distinto. Si no hubiera dirección,
          # el clúster iría a por la imagen a Docker Hub — es decir, a donde el equipo de seguridad lo prohibió.
          image: HARBOR-HOST/passes/passes-api:v1
          # El puerto de la aplicación. El nombre `http` se usa más abajo en la sonda de readiness,
          # así que el número de puerto se define en un solo sitio, no en dos.
          ports:
            - containerPort: 8080
              name: http
          # Variables de entorno de las que la aplicación aprende quién es y de dónde vino.
          # Imprime exactamente estas en la respuesta (ver app/main.go, la estructura identity).
          # APP_VERSION e IMAGE_REGISTRY se definen como texto — las escribimos nosotros mismos; las tres siguientes
          # las rellena el propio clúster en el momento en que una copia arranca, la aplicación no tiene forma de conocerlas.
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — qué reservar para una copia: el planificador elige un nodo por estos números.
          # limits — el techo: por memoria por encima del techo el contenedor se mata, por
          # CPU se estrangula. 16Mi basta porque la aplicación está en Go sin
          # dependencias. 20m son veinte milésimas de un núcleo de CPU.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Sonda de readiness: hasta que la aplicación responda en /healthz, el tráfico a la copia
          # no fluirá. Hoy no se llegará a esto — comprueba un proceso ya en ejecución,
          # y en nuestro caso un paso anterior se atascará, la descarga de la imagen.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
