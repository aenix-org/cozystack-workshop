---
# Lab 6 · Tu propio registro privado de imágenes. Versión QUE FUNCIONA del manifiesto.
#
# Este es el mismo archivo que passes-broken.yaml, más el único lugar que allí faltaba —
# está marcado más abajo con las palabras «ESTO ES LO QUE FALTABA». Aplícalo después de que
# hayas visto el fallo en la versión rota y hayas entendido por qué ocurrió.
#
# Se aplica en tu clúster `lab` (no en el clúster de gestión de Cozystack — allí
# vive únicamente el propio Harbor), en el espacio de nombres por defecto:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl delete -f passes-broken.yaml
#     kubectl apply -f passes.yaml
#
# ATENCIÓN: HARBOR-HOST es un marcador de posición, no una dirección que funcione. Antes de aplicar, sustituye
# la dirección de tu propio Harbor; la cadena HARBOR-HOST aparece en el archivo dos veces, sed reemplaza ambas:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # macOS
#
# En los objetos de abajo: apiVersion es la versión del esquema de descripción, kind es lo que creamos,
# metadata.name es el nombre del objeto. No se explican por separado más adelante.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Dos copias, no una: así en la respuesta del servicio se verá que las peticiones las atienden
  # pods distintos, y que la imagen se descargó al nodo una vez pero se arrancó dos veces.
  replicas: 2
  # La condición «mis copias son pods con la etiqueta app: passes-api». La etiqueta en la plantilla de pod de abajo
  # debe coincidir con esta, de lo contrario el clúster rechazará el manifiesto.
  selector:
    matchLabels:
      app: passes-api
  # La plantilla a partir de la cual se estampan las copias. Todo lo que hay dentro describe un único pod.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Restricciones de seguridad para todo el pod: no ejecutar como root, trabajar como
      # un usuario sin privilegios 10001, restringir el conjunto de llamadas al sistema al
      # perfil estándar. La imagen está construida para ajustarse a esto (véase app/Dockerfile, la línea USER).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # ESTO ES LO QUE FALTABA en passes-broken.yaml — estas dos líneas, y nada más.
      #
      # Un registro privado no le entrega la imagen a cualquiera: primero hay que identificarse. El secreto `harbor`
      # (tipo kubernetes.io/dockerconfigjson) almacena la dirección del registro, el usuario y la contraseña; lo
      # creaste con el comando kubectl create secret docker-registry. Aquí el secreto solo se
      # REFERENCIA por su nombre — no es la aplicación quien lo toma de allí, sino el kubelet en el nodo, en el
      # momento en que va a descargar la imagen. Por eso el secreto debe estar en el mismo
      # espacio de nombres que el pod: el kubelet lo busca exactamente allí y en ningún otro lugar.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # Permisos a nivel de contenedor: no obtener privilegios adicionales y descartar todas las
          # capacidades especiales del núcleo. La aplicación necesita un puerto de red, lo demás es innecesario.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # La primera parte del nombre de la imagen es la dirección del registro, y precisamente por eso mudarse a tu propio
          # registro cambia los manifiestos: el nombre de la imagen se vuelve distinto. Si la dirección no estuviera al
          # principio, el clúster iría a por la imagen a Docker Hub, y eso es lo que la seguridad prohibió.
          image: HARBOR-HOST/passes/passes-api:v1
          # El puerto de la aplicación. El nombre `http` lo usan más adelante la sonda de disponibilidad y el Service,
          # así que el número de puerto se define en un solo lugar, no en tres.
          ports:
            - containerPort: 8080
              name: http
          # Variables de entorno de las que la aplicación averigua quién es y de dónde vino.
          # Justamente eso imprime en la respuesta (véase app/main.go, la estructura identity).
          # APP_VERSION e IMAGE_REGISTRY están definidas como texto — las escribimos nosotros mismos.
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # A continuación — la Downward API: el clúster mismo coloca en las variables lo que sabe sobre el pod.
            # La aplicación no necesita adivinar su propio nombre, ni ir a por él a la API del clúster,
            # ni llevar consigo los permisos para tal petición. Los valores se sustituyen en el momento
            # en que una copia arranca, por eso cada copia tiene los suyos.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — qué reservar para una copia: por estos números el planificador elige el
          # nodo. limits — el techo: por memoria por encima del techo al contenedor lo matan, por
          # CPU lo frenan. 16Mi basta porque la aplicación está en Go sin
          # dependencias y casi no retiene nada en memoria; una JVM necesitaría dos órdenes de magnitud
          # más. 20m son veinte milésimas de un núcleo de CPU.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Sonda de disponibilidad: hasta que la aplicación no responda en /healthz, el Service no
          # enviará tráfico a esta copia. Durante el despliegue de una nueva versión, la copia vieja se retira
          # del balanceo solo después de que la nueva haya respondido — por eso las peticiones
          # no fallan sobre un proceso que aún no ha arrancado.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Un nombre permanente tras el cual están ambas copias. Los pods se recrean y cambian de dirección,
# el nombre passes-api.default.svc.cluster.local no cambia. Sin este objeto la aplicación
# funciona, pero no hay nada por lo que alcanzarla dentro del clúster — y la comprobación en check.sh
# va exactamente aquí, no al pod.
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # El vínculo con los pods no es una lista de direcciones, sino una condición por etiqueta. Una copia nueva con la etiqueta
  # app: passes-api entra en el balanceo por sí sola, no hace falta registrarla.
  selector:
    app: passes-api
  # port — en qué puerto responde el propio Service; targetPort referencia el nombre `http`
  # del bloque ports de arriba, no el número, así que el vínculo no se romperá cuando el número cambie.
  ports:
    - port: 80
      targetPort: http
