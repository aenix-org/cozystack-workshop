# Lab 3. Generador de carga Fortio: el generador en sí y una dirección estable para su
# interfaz web. Dos objetos, separados por `---`.
#
# Se aplica en tu clúster de entrenamiento `lab`, no en un tenant del clúster de gestión:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f fortio.yaml
# Aquí no hay marcadores como tenant-workshopXX — no necesitas sustituir tu número en ningún lado.
# Este mismo archivo se necesitará en la lab 4: `kubectl apply -f ../03-scale/fortio.yaml`.
#
# Los campos comunes del manifiesto (apiVersion, kind, metadata.name, selector, template,
# securityContext) se desglosan línea por línea en ../01-deploy/rickroll.yaml y aquí
# no se repiten. Comentamos solo lo que es propio del generador de carga.
---
# Generador de carga con interfaz web.
# Elegido en lugar de hey/ab a propósito: la carga se lanza con un botón en el navegador,
# y el histograma de latencias se ve ahí mismo. En workshops anteriores perdíamos
# gente precisamente con las herramientas de consola.
#
# Fortio vive en el clúster como una aplicación normal y golpea la dirección de rickroll desde dentro.
# Cargarlo desde fuera, desde la VM, sería más honesto en cuanto al tráfico, pero chocaría con el canal
# hacia el clúster, y estarías midiendo tu Wi-Fi en vez de la aplicación.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # Con una sola copia del generador basta: produce carga en muchos hilos por sí misma.
  # Una segunda copia aquí solo difuminaría la imagen — cada copia tiene sus propios contadores en la
  # interfaz web, y verías la mitad de las peticiones.
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # El mismo perfil de seguridad que rickroll: se ejecuta como no-root, un
      # UID concreto, seccomp estándar. Se deja a propósito — para que el archivo se pueda aplicar
      # incluso en un clúster con el perfil `restricted` habilitado, donde si no el pod no arrancaría.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # El tag latest es una simplificación deliberada para el workshop, para no comparar versiones.
          # En un clúster de producción esto no se hace: la imagen bajo este tag puede cambiar
          # de forma silenciosa entre dos apply, y no podrás reproducir el resultado de ayer.
          image: fortio/fortio:latest
          # El modo `server` levanta la interfaz web y la mantiene. Sin este argumento
          # Fortio haría una única ejecución desde la línea de comandos y terminaría, y el clúster
          # reiniciaría el contenedor en un bucle.
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            # El request es más alto que el del propio rickroll (20m): el generador necesita espacio en el nodo
            # de antemano, si no el planificador lo colocará justo y el ramp-up será irregular.
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # El generador necesita margen de CPU, si no chocará
              # contra sí mismo y estarás cargando Fortio en vez de la aplicación.
              cpu: "1"
              memory: 256Mi
---
# Dirección estable del generador dentro del clúster. Necesaria para abrir la interfaz web
# desde la VM mediante `kubectl port-forward svc/fortio 8081:8080` — desde fuera el clúster
# no publica nada, y no hay otras puertas hacia Fortio.
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  ports:
    # 8080 en ambos lados: tanto el servicio como el contenedor. El número es el mismo que el de rickroll
    # dentro del pod, pero no hay colisión — cada pod tiene su propia pila de red.
    - port: 8080
      targetPort: http
