---
# Lab 3. Escalamos réplicas según la carga del procesador.
# El objetivo es el 50% de requests.cpu (20m), es decir, el umbral es 10m por pod.
# Elegido bajo a propósito: la carga debe activarse en segundos,
# tenemos media hora para el lab, no medio día.
#
# Un único objeto. Se aplica en tu clúster de entrenamiento `lab`, no en el tenant
# del clúster de gestión:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f hpa.yaml
# Aquí no hay marcadores como tenant-workshopXX — no hace falta sustituir tu número en ninguna parte.
#
# Dos condiciones sin las cuales el objeto se creará, pero no funcionará:
#   1. El contenedor rickroll tiene requests.cpu definido — de lo contrario no hay nada de lo que calcular el porcentaje,
#      y en la columna TARGETS de `kubectl get hpa` quedará para siempre <unknown>.
#   2. En el clúster está corriendo metrics-server — la fuente del consumo actual de los pods.
# Ambas condiciones las verifica check.sh en esta carpeta.
#
# Mientras el HPA exista, el campo replicas del Deployment le pertenece. Puedes cambiar el número
# de copias a mano con `kubectl scale`, pero el HPA restaurará su valor en los próximos segundos.
# Por eso en el lab 4, antes del despliegue, este objeto se elimina: dos mecanismos sobre un mismo campo —
# una forma garantizada de no entender qué pasó.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # El nombre del HPA no tiene por qué coincidir con el nombre de la aplicación — la coincidencia aquí es por comodidad.
  # Qué gestionar lo determina scaleTargetRef más abajo, no este nombre.
  name: rickroll
spec:
  # A quién observar y cuyo campo replicas cambiar. Tres campos juntos, porque un nombre
  # sin tipo es ambiguo: un Deployment y un StatefulSet pueden llamarse igual.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rickroll
  # El corredor del que el HPA no saldrá bajo ninguna carga. El límite inferior es la misma
  # única copia con la que empezó el lab. El superior es seis: esa cantidad cabe
  # en un nodo de entrenamiento con limits.cpu 300m y aun así se aprecia a simple vista en la lista de pods.
  # Pon maxReplicas: 1 y el objeto se creará y no hará nada.
  minReplicas: 1
  maxReplicas: 6
  # En qué basar la decisión. Puede haber varias métricas, entonces el HPA toma la
  # que requiere el mayor número de copias. Aquí hay una — el procesador.
  metrics:
    - type: Resource
      resource:
        name: cpu
        # Utilization es la fracción de requests.cpu del contenedor, no de la capacidad del nodo.
        # De ahí una consecuencia poco intuitiva: el valor puede ser tranquilamente 600%, y eso
        # no es un error: el pod consume seis veces más de lo que reservó.
        # Una alternativa es AverageValue, donde el umbral se fija en milinúcleos directamente.
        target:
          type: Utilization
          averageUtilization: 50
  # Con qué agilidad reaccionar. El bloque es opcional: sin él se usan los valores
  # por defecto, pensados para la operación en producción, no para una demostración.
  behavior:
    scaleUp:
      # Por defecto Kubernetes espera la estabilización y crece despacio.
      # En un lab esto parece «no pasa nada», por eso lo aceleramos.
      stabilizationWindowSeconds: 0
      # No más de dos copias nuevas cada quince segundos. El paso se eligió de forma
      # empírica: el crecimiento se ve como crecimiento, y no como un salto instantáneo de una directamente a seis,
      # en el que el participante no tiene nada que observar.
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      # Y hacia abajo, al contrario — no de forma instantánea, de lo contrario los pods desaparecerán
      # antes de que el participante alcance a observarlos.
      # Un minuto en lugar de los cinco por defecto: el lab dura media hora, no hay con qué llenar
      # cinco de ellos esperando la reducción. En un clúster de producción una ventana larga sí es útil —
      # amortigua los vaivenes en una carga irregular.
      stabilizationWindowSeconds: 60
