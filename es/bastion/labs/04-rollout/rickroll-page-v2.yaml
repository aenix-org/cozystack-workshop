---
# Lab 4. La segunda versión de la página — la que desplegamos bajo carga.
# Debe diferir notablemente: el participante mira el navegador, no un diff.
#
# Un solo objeto. Se aplica en tu clúster de práctica `lab`, no en el tenant
# del clúster de gestión:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll-page-v2.yaml
# Aquí no hay marcadores como tenant-workshopXX — no hace falta sustituir tu número en ningún sitio.
#
# Lo principal con lo que la gente tropieza aquí: este apply por sí solo no despliega nada.
# Solo coloca en el clúster otro archivo de configuración junto al primero. Mientras el volumen `page`
# del Deployment apunte a rickroll-page-v1, los usuarios ven la primera versión.
# El despliegue pasa a ser el siguiente paso de la lab — cambiar el volumen a este ConfigMap.
# De ahí toda la construcción con dos objetos: la primera versión permanece en el clúster
# intacta, y el rollback la devuelve entera en lugar de reconstruirla de memoria.
#
# Si en cambio editáramos el ConfigMap rickroll-page-v1 en su sitio, no habría
# adónde revertir, y los pods recibirían contenido nuevo sin reemplazar copias y sin dejar registro
# en el historial de revisiones — es decir, sin todo aquello para lo que se hace la lab.
#
# El nombre del objeto no debe cambiarse: el parche del README referencia rickroll-page-v2,
# igual que la comprobación en check.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v2
data:
  # Todo lo que está por debajo de la sangría tras `|` es el contenido literal del archivo index.html
  # que acabará dentro del contenedor. Esto ya no es YAML: aquí no hay comentarios
  # ni puede haberlos — una almohadilla aterrizaría en la página como texto normal.
  #
  # Dos cosas del marcado le importan a check.sh: el rótulo «ВЕРСИЯ 2» —
  # por él la comprobación distingue la segunda versión de la primera, y el marcador __POD__ — se
  # sustituye por el nombre del pod de nginx según la regla del ConfigMap rickroll-conf (lab 1).
  # Quita cualquiera de los dos y la comprobación de la lab no pasará, aunque el despliegue tenga éxito.
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>We're No Strangers To Love</title>
    <style>
      body{background:#07131a;color:#e8f6ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      .tag{display:inline-block;margin-bottom:1.5em;padding:.35em 1em;border-radius:999px;
           background:#00e0ff;color:#052; font-weight:700;letter-spacing:.08em;font-size:13px}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#00ffa3,#00e0ff,#7a5cff,#00ffa3);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#7f96a3;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#5d7380}
      .pod b{display:block;margin-top:.4em;color:#00ffa3;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#3f5561;font-size:14px}
    </style>
    <div class="tag">ВЕРСИЯ 2</div>
    <h1>We're No Strangers To Love</h1>
    <p class="lyr">You know the rules &middot; And so do I</p>
    <div class="pod">вас обслужил под<b>__POD__</b></div>
    <p class="hint">Обновление прошло под нагрузкой. Посмотрите в Fortio: ошибок ноль.</p>
    </html>
