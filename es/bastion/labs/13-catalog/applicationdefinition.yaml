---
# Lab 13. Definición de aplicación para el catálogo de Cozystack — esa misma «entrada del catálogo».
#
# Por sí solo este objeto no despliega nada. Enlaza tres cosas: tu chart
# (qué desplegar), un nuevo tipo de objetos en la API (cómo se pide la aplicación) y una tarjeta
# en el dashboard (lo que ve la persona por el camino). Mientras no exista, el chart sigue siendo una carpeta
# de archivos de la que la plataforma no sabe nada, y en la lista de aplicaciones, junto a Postgres y Redis,
# no hay nada.
#
# Se aplica con un solo comando, sin namespace:
#   kubectl apply -f applicationdefinition.yaml
#
# IMPORTANTE: este objeto es CLUSTER-SCOPED — no tiene namespace, hay uno solo para todo el
# clúster. Un tenant NO PUEDE aplicarlo, esto está comprobado:
#   kubectl auth can-i create applicationdefinitions   ->   no
# Tu trabajo termina cuando el archivo está escrito y verificado localmente.
# Lo aplica el administrador de la plataforma. Ver README, sección «Dónde terminan
# tus permisos».
apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: guest-pass
spec:
  # --- CÓMO SE VE EN LA API ----------------------------------------------
  application:
    # Kind del nuevo tipo de objetos. Tras aplicarlo, en el clúster aparecerá
    # kind: GuestPass, y podrás trabajar con él usando el kubectl habitual.
    kind: GuestPass
    plural: guestpasses
    singular: guestpass
    # El esquema de valores — el mismo que está en el chart como archivo values.schema.json,
    # solo que escrito en una sola línea. Con él la API rechaza valores
    # inválidos, y el dashboard dibuja el formulario de creación.
    openAPISchema: |-
      {"title":"Chart Values","type":"object","properties":{"replicas":{"description":"Number of application replicas.","type":"integer","default":2},"greeting":{"description":"Text shown on the main page.","type":"string","default":"Order a pass for your guest"},"external":{"description":"Enable external access from outside the cluster.","type":"boolean","default":false},"resources":{"description":"Explicit CPU and memory configuration.","type":"object","default":{},"properties":{"cpu":{"description":"CPU available to each replica.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true},"memory":{"description":"Memory (RAM) available to each replica.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true}}}}}

  # --- QUÉ DESPLEGAR ----------------------------------------------
  release:
    # Nombre del release = prefix + nombre del objeto. Un objeto GuestPass llamado `main`
    # se despliega como release `guest-pass-main`. El prefijo es obligatorio y sirve
    # para que los releases de aplicaciones distintas no colisionen por nombre.
    prefix: guest-pass-
    labels:
      # Con la misma clave Cozystack distribuye los releases de los tenants entre los shards de Flux.
      # Sin ella no habría quién reconciliara el release.
      sharding.fluxcd.io/key: tenants
    chartRef:
      # De dónde tomar el chart. Kinds permitidos: OCIRepository, HelmChart,
      # ExternalArtifact. Los catálogos externos suelen llegar vía
      # GitRepository -> HelmChart, y su namespace es cozy-public.
      kind: HelmChart
      name: cozystack-guest-pass
      namespace: cozy-public

  # --- CÓMO SE VE EN EL DASHBOARD ------------------------------------------
  dashboard:
    # Sección del catálogo. Los valores usados son PaaS, IaaS, NaaS, Administration,
    # Networking — toma uno existente en vez de inventar el tuyo,
    # de lo contrario la aplicación acabará en una sección con un solo elemento.
    category: PaaS
    singular: Guest Pass
    plural: Guest Passes
    description: Internal guest pass service for employees and reception
    tags:
      - internal
      - web
    # Icono — SVG en base64. Exactamente base64, no una ruta ni una URL: el dashboard
    # no va a ningún sitio a descargar nada. El original está al lado, en icon.svg.
    icon: 
    # Orden de los campos en la representación YAML del objeto. Es cosmético, pero sin él
    # los campos se alinean de cualquier manera y el formulario se lee peor.
    keysOrder: [["apiVersion"], ["kind"], ["metadata"], ["metadata", "name"], ["spec", "replicas"], ["spec", "greeting"], ["spec", "external"], ["spec", "resources"]]
