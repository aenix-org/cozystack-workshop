---
# Lab 13. Así se verá el pedido de tu aplicación DESPUÉS de que
# el admin aplique applicationdefinition.yaml. Se aplica en tu tenant:
#   kubectl apply -f guestpass-example.yaml
#
# ATENCIÓN: tenant-workshopXX es un marcador de posición, no un nombre de namespace. Reemplaza XX por el número
# de tu tenant antes de aplicar, de lo contrario kubectl se negará: no existe tal namespace,
# y a uno ajeno no te dejarán entrar.
#
# Ten en cuenta: el grupo apps.cozystack.io es el mismo que el de Bucket,
# VMInstance y las demás aplicaciones del catálogo. Tu aplicación se pondrá
# en la misma fila que ellas, y no en algún lugar aparte.
#
# No se puede aplicar este archivo antes de que el admin haya registrado la definición:
# kubectl responderá `no matches for kind "GuestPass"`.
apiVersion: apps.cozystack.io/v1alpha1
kind: GuestPass
metadata:
  name: main
  namespace: tenant-workshopXX
# Los campos en spec son exactamente los parámetros descritos en chart/values.yaml y mostrados
# por el formulario de pedido en el dashboard. Aquí están escritos como texto: lo mismo que pulsar
# un botón en el dashboard, pero un archivo así se puede revisar, poner en Git y revertir.
spec:
  replicas: 2
  greeting: "Order a pass for your guest"
  external: false
  resources:
    cpu: 100m
    memory: 128Mi
