# Lab 13. Plantilla de Deployment: qué ejecutar y en cuántas copias.
#
# Los archivos en templates/ son plantillas, no manifiestos listos. Helm sustituye valores en ellos
# y entrega el resultado al clúster: `helm template main chart` muestra el texto renderizado sin
# aplicar nada, `helm install main chart` lo aplica.
#
# Las llaves dobles son un punto de sustitución. Dentro de ellas encontrarás:
#   .Values.nombre — el valor de un parámetro: de values.yaml si el cliente no lo tocó,
#                   o del formulario de pedido en el panel si eligió el suyo;
#   .Release.Name — el nombre del release, es decir, el nombre de un despliegue concreto del chart.
# El texto fuera de las llaves va al manifiesto tal cual.
apiVersion: apps/v1
kind: Deployment
metadata:
  # Los nombres de los objetos se arman a partir del nombre del release, no se escriben fijos. El mismo chart
  # se despliega en un namespace más de una vez, y un nombre fijo significaría que el
  # segundo pedido sobrescribe el primero. El release `main` produce un Deployment, un Service y un ConfigMap
  # llamados `main` — el nombre deja claro a simple vista que forman un solo grupo.
  name: {{ .Release.Name }}
  # Etiquetas: name es igual para cada pedido de esta aplicación, instance distingue los pedidos.
  # Por ellas los objetos se encuentran entre sí, y por ellas también se filtra la salida de `kubectl get`.
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Cuántas copias mantener en ejecución. Si una copia desaparece, el clúster crea una nueva
  # sin preguntar — de ahí la autorreparación sin un administrador de guardia.
  replicas: {{ .Values.replicas }}
  # selector le dice al Deployment qué pods considerar suyos — por etiquetas, no por nombres.
  # Las etiquetas de aquí y las de template.metadata.labels deben coincidir. Si divergen,
  # el Deployment no encuentra sus propias copias y las estampa una y otra vez.
  selector:
    matchLabels:
      app.kubernetes.io/name: guest-pass
      app.kubernetes.io/instance: {{ .Release.Name }}
  # template es la plantilla del pod. Todo lo que sigue describe no el Deployment en sí, sino las
  # copias de la aplicación que crea a partir de esta plantilla.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guest-pass
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Hash de la configuración en una anotación del pod. Sin él, editar el ConfigMap no reinicia
        # los pods, y el nuevo texto no aparece hasta que alguien los borra a mano.
        # Esta es la queja más común sobre los charts en general.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # La aplicación se ejecuta no como root y con privilegios reducidos. Un chart del catálogo
      # lo despliegan otros tenants en sus namespaces, y los privilegios del contenedor son parte de
      # lo que les prometes junto con la aplicación.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # La imagen está escrita en la plantilla y deliberadamente no se expone como parámetro: el cliente
          # elige el tamaño y el texto, pero no cambia la aplicación en sí por una arbitraria.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # Sin esta variable nginx arranca un proceso de trabajo por cada núcleo del nodo.
          # En un nodo con varias decenas de núcleos habrá decenas de ellos, y un pod con un límite
          # de memoria de cien megabytes morirá con OOMKilled antes de la primera petición. El chart se envía
          # a otros tenants, donde los nodos pueden ser cualquiera, así que aquí esto es obligatorio.
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # El puerto dentro del contenedor. El nombre http se usa más adelante en la sonda y en el Service,
          # para que el número de puerto quede registrado en un solo lugar, no en tres.
          ports:
            - containerPort: 8080
              name: http
          # requests — cuánto asignar de forma garantizada; el planificador elige un nodo por estos números.
          # limits aquí son solo de memoria: si la excedes, el contenedor se mata y se vuelve a levantar.
          # No hay límite de CPU deliberadamente, de lo contrario la aplicación choca contra un techo en vez
          # de simplemente correr más lento.
          # El filtro `| quote` envuelve el valor sustituido entre comillas: el usuario
          # puede introducir 1, y sin comillas iría un número al manifiesto donde se espera una cadena
          # como "1" o "100m".
          resources:
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
            limits:
              memory: {{ .Values.resources.memory | quote }}
          # readinessProbe — la pregunta «¿listo para aceptar peticiones?». Hasta que /healthz responda,
          # el Service no envía tráfico a esta copia. De ahí las actualizaciones sin interrupción: la vieja
          # copia se saca del balanceo después de que la nueva haya respondido.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          # La página y la configuración de nginx se montan como archivos desde el ConfigMap. subPath sustituye
          # exactamente un archivo: sin él el directorio montado reemplazaría todo el /etc/nginx/
          # conf.d y los ajustes de fábrica de la imagen desaparecerían.
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      # El nombre del ConfigMap se arma a partir del nombre del release, por eso el pod siempre monta la configuración
      # de su propio pedido, no la del vecino.
      volumes:
        - name: page
          configMap:
            name: {{ .Release.Name }}
        - name: conf
          configMap:
            name: {{ .Release.Name }}
