# Lab 13. Plantilla Service: una dirección estable para la aplicación.
#
# Las copias de la aplicación aparecen y desaparecen, con direcciones nuevas cada vez. Un Service da un nombre
# que no cambia, y reparte las solicitudes entre las copias vivas. Desde un pod vecino
# se accede a la aplicación por el nombre del release.
#
# La sustitución entre dobles llaves y de dónde salen los nombres de los objetos está
# descrita en templates/deployment.yaml — aquí todo funciona igual.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Un solo flag en values decide si la aplicación obtiene o no una dirección fuera del clúster.
  # Las aplicaciones integradas de Cozystack funcionan igual: el campo external.
  # La construcción if/else elige uno de dos valores durante el render — al manifiesto final
  # va o LoadBalancer o ClusterIP, y en él ya no queda ninguna ramificación.
  type: {{ if .Values.external }}LoadBalancer{{ else }}ClusterIP{{ end }}
  # A quién enviar el tráfico. El Service selecciona los pods por etiquetas, no por nombres, por eso
  # le da igual cuántas copias haya y cómo se llamen. Las etiquetas son las mismas que
  # el Deployment pone a sus copias.
  selector:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
  # port — en qué puerto escucha el propio Service, targetPort — a dónde llama dentro del pod.
  # targetPort está escrito por nombre: el puerto con nombre http está declarado en la plantilla del Deployment.
  # Si el número cambia allí, aquí no hará falta corregir nada.
  ports:
    - name: http
      port: 80
      targetPort: http
