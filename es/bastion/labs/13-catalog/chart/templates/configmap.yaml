# Lab 13. Plantilla ConfigMap: la página «Pases» y la configuración de nginx.
#
# El ConfigMap almacena archivos de texto y los sirve a los pods. La página vive aquí y no
# dentro de la imagen, para poder cambiar el texto sin reconstruir: el valor greeting se sustituye
# al renderizar, y basta con actualizar el release.
#
# La sustitución también funciona dentro de los bloques `|`: Helm procesa el archivo de plantilla como
# texto plano y no sabe nada sobre la estructura YAML. Más detalles en templates/deployment.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
# Las claves en data son nombres de archivos, y lo que está bajo `|` es su contenido completo.
# Cada clave se monta en el contenedor como un archivo separado, ver volumeMounts en el Deployment.
data:
  # La página que verá el empleado. Aquí llegan dos valores: greeting del formulario
  # de pedido y el nombre del release — para que por la página abierta se vea de quién es el pedido.
  index.html: |
    <!doctype html>
    <html lang="en">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Guest Pass</title>
    <style>
      body{background:#0d1117;color:#e6edf3;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:12vh 5vw;margin:0}
      h1{font-size:clamp(26px,6vw,56px);margin:0 0 .3em;color:#2f6fed}
      .pod{font-family:ui-monospace,Menlo,monospace;color:#7d8590;margin-top:3em}
    </style>
    <h1>{{ .Values.greeting }}</h1>
    <p>Guest Pass service, release <b>{{ .Release.Name }}</b></p>
    <div class="pod">served by __POD__</div>
    </html>
  # Configuración de nginx. sub_filter reemplaza la marca __POD__ por el nombre del pod en el momento en que
  # se sirve la página: así por el navegador se ve cuál de las copias respondió. Una respuesta separada en /healthz
  # la necesita el readinessProbe del Deployment — consulta exactamente esta dirección.
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location / {
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
