# Lab 13. Valores por defecto para el chart «Pases».
#
# Estas son las respuestas a las preguntas que el chart hace al desplegar: cuántas copias, qué
# texto en la página, si se necesita una dirección externa. Están escritas aquí para el caso de «no se
# seleccionó nada». Quien pide la aplicación las sobrescribe: en el panel — con campos del
# formulario, en la terminal — con la opción `--set replicas=5` o con su propio archivo `helm install ... -f my.yaml`.
# Editar este archivo cambia los valores por defecto para futuros pedidos, no para los ya desplegados.
#
# Cómo los valores de aquí se convierten en un formulario de pedido en el panel:
#   tipo        — qué campo mostrar: {int} número, {bool} interruptor,
#                {string} línea de entrada, {struct} grupo anidado de campos;
#   Descripción — la etiqueta del campo y la ayuda debajo;
#   =valor      — lo que ya está en el campo cuando se abre el formulario;
#   obligatoriedad — se define con la lista required en el esquema. Aquí no hay ninguna: cada
#                parámetro tiene un valor por defecto, así que cualquier campo se puede omitir.
# Por eso las descripciones se escriben en inglés: las lee no solo el autor del chart, sino cualquiera
# que pida la aplicación en el panel.

## Los comentarios del tipo `## @param` no son decoración. A partir de ellos el generador de Cozystack
## (cozyvalues-gen) construye values.schema.json y la tabla de parámetros en el README.
## Formato: ## @param {tipo} nombre=valor-por-defecto - Descripción.

# Cuántas copias de la aplicación mantener en ejecución. Una copia significa tiempo de inactividad durante el
# reinicio de un nodo; dos sobreviven a la pérdida de cualquiera de ellas.
## @param {int} replicas=2 - Number of application replicas.
replicas: 2

# Texto en la página principal. Expuesto como parámetro porque cada filial tiene
# el suyo, y nadie va a construir una imagen aparte solo para eso.
## @param {string} greeting=Order a pass for your guest - Text shown on the main page.
greeting: "Order a pass for your guest"

# Si la aplicación necesita una dirección fuera del clúster. La convención del catálogo de Cozystack:
# un campo llamado external significa lo mismo en todas las aplicaciones — acceso externo.
## @param {bool} external=false - Enable external access from outside the cluster.
external: false

# El tamaño de una copia. Agrupado como un conjunto de campos aparte para que en el formulario de pedido
# se vea como un único bloque «recursos» en lugar de dos campos sin relación.
## @typedef {struct} Resources - CPU and memory for each replica.
## @field {quantity} cpu - CPU available to each replica.
## @field {quantity} memory - Memory (RAM) available to each replica.

## @param {Resources} resources - Explicit CPU and memory configuration.
resources:
  cpu: 100m
  memory: 128Mi
