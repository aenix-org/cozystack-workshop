---
# Lab 7 · generador de carga con interfaz web.
# El mismo que en la lab de escalado: la carga se lanza con un botón en el navegador,
# y el histograma de latencias se ve ahí mismo. Si ya está desplegado en tu
# instalación, no hace falta aplicar este archivo — kubectl responderá «unchanged».
#
# Dónde se aplica: tu clúster `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Comando: kubectl apply -f fortio.yaml
#
# Dos objetos separados por `---`: Deployment (el generador en sí) y Service (el nombre
# por el que se llega a él). apiVersion, kind y metadata.name no se comentan más abajo.
#
# La imagen se descarga del Docker Hub público, no de tu Harbor: Fortio no es parte
# del servicio «Pase de invitado», sino un instrumento de medición que vive en el clúster temporalmente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # Una sola copia. El generador de carga no necesita escalarse — lo que hace falta es que él solo
  # cuente las latencias con honestidad. Dos copias darían dos histogramas sin unir.
  replicas: 1
  # La etiqueta por la que el Deployment reconoce su pod. Coincide con la etiqueta en el template de abajo.
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # Los mismos requisitos de seguridad que todo lo demás: el proceso no se ejecuta como root,
      # y las llamadas al sistema están restringidas por un perfil seccomp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # La etiqueta `latest` aquí es una simplificación para el taller, y contradice lo que
          # enseña la lab del registro propio: la imagen bajo esta etiqueta puede cambiar sin avisar
          # entre dos apply, y la medición de ayer se volverá irreproducible. Para
          # un generador de carga en un banco de pruebas esto es aceptable, para un sistema en producción no.
          image: fortio/fortio:latest
          # `server` es el modo en el que Fortio levanta la interfaz web y espera hasta que
          # pulses un botón. Sin este argumento la imagen ejecuta un comando único y sale.
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # El generador necesita algo de margen de CPU, de lo contrario chocará
              # contra su propio límite y estarás cargando Fortio en vez de la aplicación.
              cpu: "1"
              memory: 256Mi
---
# El Service hace falta para abrir la interfaz web: al generador se llega por nombre mediante
# el reenvío de puerto — kubectl port-forward svc/fortio 8081:8080 — y se accede en
# localhost:8081. Puedes bombardear el servicio sin Service también, con el comando
# kubectl exec deploy/fortio, pero solo este camino te da el histograma en el navegador.
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  # Aquí el número del Service y el puerto del contenedor coinciden — a diferencia de los otros
  # servicios de la lab, donde fuera es 80 y dentro 8080. La diferencia es solo de comodidad.
  ports:
    - port: 8080
      targetPort: http
