---
# Lab 7 · ESTE PARCHE ESTÁ INTENCIONADAMENTE INCOMPLETO. Existe para que puedas ver cómo se ve
# «como que activamos la caché, pero no se volvió más rápido». La versión funcional está en cache-patch.yaml.
#
# Se aplica en tu clúster `lab` (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch-broken.yaml
#
# No mires la respuesta a escondidas. Aplícalo, haz un par de peticiones y mira los logs
# de la aplicación: kubectl logs -l app=passes-api. La aplicación te dice qué le pasa,
# — el objetivo es leer el mensaje y averiguar qué le falta a este archivo.
#
# Sustituye la dirección de tu propio Redis en lugar de REDIS-ADDR (mira el paso sobre cómo encontrar la dirección).
# No puedes dejar el marcador de posición: entonces obtendrás el error equivocado, no el que motivó todo esto.
spec:
  template:
    spec:
      containers:
        # El nombre del contenedor es la dirección por la que el clúster encuentra el lugar a editar.
        - name: api
          env:
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
