---
# Lab 7 · el servicio «Pase», versión v2 — la que sabe trabajar con caché.
# Aquí el caché todavía NO está activado: primero medimos lo malo que es sin él. Se activa más tarde,
# con el parche cache-patch.yaml de esta misma carpeta.
#
# Dónde se aplica: tu clúster `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Comando: kubectl apply -f passes-api.yaml
#
# HARBOR-HOST es un marcador de posición, no una dirección. Sustituye la dirección de tu propio Harbor (ver hr-legacy.yaml,
# que también tiene el comando sed para reemplazarla en todos los archivos de una vez).
#
# El archivo tiene dos objetos separados por `---`: Deployment (copias de la aplicación) y Service (un nombre estable
# para ellas). apiVersion, kind y metadata.name no se comentan más adelante en el archivo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Dos copias, no una, para que después se vea la propiedad principal del caché: es compartido.
  # Un pod puso la respuesta en Redis, otro la tomó de ahí, aunque él mismo nunca fue al directorio.
  replicas: 2
  # Por esta etiqueta el Deployment distingue sus propios pods de los ajenos. Debe coincidir con la etiqueta
  # en el template de abajo, de lo contrario el objeto no encontrará lo que él mismo creó.
  selector:
    matchLabels:
      app: passes-api
  # template — la plantilla del pod: a partir de qué ensamblar cada copia.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Requisitos de seguridad a nivel de pod: no desde root, un conjunto restringido de llamadas
      # al sistema. En un clúster con políticas activadas, un pod sin estos campos no será aceptado.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Con qué se identificará el clúster ante el Harbor cerrado al descargar la imagen. Sin una referencia
      # a este secreto el pod se quedará atascado en ImagePullBackOff.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # Los privilegios del contenedor están recortados al mínimo: no se puede escalar, no hay privilegios de núcleo.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # La misma imagen que la del directorio. Solo los separa el MODE de abajo.
          image: HARBOR-HOST/passes/passes-api:v2
          # El nombre del puerto hace falta para que la sonda y el Service referencien un nombre, no un número.
          ports:
            - containerPort: 8080
              name: http
          # Todo el comportamiento de la aplicación se define aquí. Fíjate: las variables
          # REDIS_ADDR y REDIS_PASSWORD no están en la lista — y precisamente por eso el caché está apagado,
          # y cada petición va honestamente al directorio lento.
          env:
            # MODE=api — esta instancia funciona como el propio servicio «Pase».
            - name: MODE
              value: "api"
            # La aplicación no necesita la versión ni el registro para funcionar — se ven en la respuesta a «/»
            # y permiten confirmar que se está ejecutando exactamente lo que acabas de construir.
            - name: APP_VERSION
              value: "v2"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # Adónde ir a por los datos. Un nombre de servicio, no una dirección: las copias del directorio
            # pueden recrearse cuantas veces sea, el nombre no cambia.
            - name: HR_URL
              value: "http://hr-legacy.default.svc.cluster.local"
            # Quién ejecuta la petición y dónde. El clúster sustituye estos tres valores por sí mismo:
            # nadie los conoce de antemano. Terminan en la respuesta del servicio, y por ellos se ve
            # qué copia y en qué nodo respondió — esto será útil durante las mediciones.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — lo que se reserva al elegir un nodo, limits — el techo. Un techo de un solo
          # núcleo aquí no es avaricia: bajo carga la aplicación chocará contra él en vez de comerse
          # todo el nodo, y la medición mostrará la latencia del directorio, no una pelea por la CPU.
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # Hasta que /healthz no responda, el Service no enviará ni una sola petición a esta copia.
          # Durante una actualización este mismo campo te salva de una caída: las copias viejas no se retiran
          # hasta que las nuevas informen de que están listas.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — un nombre estable para ambas copias y la distribución de peticiones entre ellas.
# Los pods se recrean y cambian de IP, el nombre passes-api permanece. Por este nombre acceden al servicio
# tanto Fortio como el script de comprobación.
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # La etiqueta por la que el Service reúne la lista de copias vivas. Si no coincide con la etiqueta de los pods —
  # el Service existirá y llevará a la nada.
  selector:
    app: passes-api
  ports:
    # Desde fuera se conectan al 80, hacia dentro del pod va al puerto llamado http (8080).
    - port: 80
      targetPort: http
