---
# Lab 7 · stub del directorio de empleados legado.
# En la vida real este es el sistema de otra persona que no le dejarán reescribir: responde en 800 ms,
# y de algún modo hay que vivir con ello. Aquí hay un stub con el mismo comportamiento, para que haya algo que medir.
#
# Dónde aplica: su clúster `lab` (export KUBECONFIG=~/lab.kubeconfig), no el clúster de gestión
# de Cozystack. Comando: kubectl apply -f hr-legacy.yaml
#
# HARBOR-HOST es un marcador de posición, no una dirección. Sustituya la dirección de su propio Harbor; de lo contrario el clúster
# intentará descargar la imagen de un host inexistente:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # macOS
#
# El archivo tiene dos objetos separados por una línea `---`: un Deployment (qué se ejecuta y en cuántas
# copias) y un Service (un nombre permanente por el que se alcanzan esas copias). Para cada objeto
# apiVersion y kind dicen qué tipo de objeto es, y metadata.name es cómo se llama;
# más abajo estos tres campos no se comentan.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-legacy
  labels:
    app: hr-legacy
spec:
  # Cuántas copias mantener en ejecución. Si una copia desaparece, el clúster crea una nueva sin
  # preguntar. Con una basta para el directorio: está aquí no para la carga, sino para la medición.
  replicas: 1
  # Por esta etiqueta el Deployment reconoce sus propios pods entre todos los demás del clúster.
  # La etiqueta en selector y la etiqueta en template de abajo deben coincidir, de lo contrario el objeto
  # no encontrará lo que él mismo creó.
  selector:
    matchLabels:
      app: hr-legacy
  # template es la plantilla del pod. Todo lo de abajo describe una copia: de qué ensamblarla,
  # con qué privilegios ejecutarla y cómo saber que está lista para aceptar peticiones.
  template:
    metadata:
      labels:
        app: hr-legacy
    spec:
      # Requisitos de seguridad a nivel de pod. El proceso se ejecuta no como root (uid 10001),
      # el perfil seccomp corta las llamadas al sistema que la aplicación no necesita.
      # En un clúster con políticas habilitadas un pod sin estos campos no arrancará en absoluto.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Harbor está cerrado con un usuario y contraseña, y el clúster necesita identificarse de algún modo. El secreto
      # `harbor` que configuró en la lab del registro. Sin esta referencia la imagen no se descargará,
      # y el pod permanecerá en el estado ImagePullBackOff.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: hr
          # Lo mismo que a nivel de pod, pero para un contenedor específico: prohibimos
          # la escalada de privilegios y quitamos todas las capacidades del kernel. La aplicación en Go
          # no necesita ninguna de ellas.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # La imagen es la misma para el directorio y para el propio servicio «Пропуск».
          # Qué proceso arranca realmente lo decide la variable MODE de abajo.
          image: HARBOR-HOST/passes/passes-api:v2
          # El puerto tiene un nombre, no solo un número: la sonda de readiness y el Service de abajo
          # referencian el nombre. Si el número cambia, lo corrige en un solo lugar.
          ports:
            - containerPort: 8080
              name: http
          # Las variables de entorno son la única forma de configurar esta aplicación.
          # No hace falta reconstruir la imagen solo para cambiar el comportamiento.
          env:
            # MODE=hr — la instancia finge ser el sistema de RR. HH.: espera y responde.
            - name: MODE
              value: "hr"
            # Exactamente el retardo que muestra el directorio real.
            # Al cambiarlo, cambia «qué tan mal está todo» — pruebe 2s más tarde.
            - name: HR_DELAY
              value: "800ms"
            # El pod no conoce su propio nombre de antemano — el clúster se lo asigna al crearlo.
            # fieldRef inyecta ese nombre en la variable al arrancar, y
            # acaba en la respuesta del servicio: se puede ver qué copia respondió.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # requests — cuántos recursos se reservan para el contenedor al elegir un nodo,
          # limits — el techo por encima del cual no se le permitirá. Similar a reservation
          # y limit en vSphere, pero se define por contenedor, no por máquina virtual.
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # Sonda de readiness. Hasta que /healthz responda, el Service no enviará ni una sola
          # petición a esta copia. Sin la sonda el tráfico va a un proceso que aún no ha arrancado,
          # y verá errores de la nada — aunque «todo se desplegó».
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — un nombre permanente y una dirección permanente para un conjunto de pods. Los pods se recrean
# y cada vez obtienen una nueva IP, pero el nombre hr-legacy sigue siendo el mismo. Similar a la VIP
# de un balanceador de carga, pero se configura en cuatro líneas y vive dentro del clúster.
apiVersion: v1
kind: Service
metadata:
  name: hr-legacy
spec:
  # Por esta etiqueta el Service arma la lista de copias vivas. La misma etiqueta que en los pods de arriba:
  # si no coincide, el Service existirá y no llevará a ninguna parte.
  selector:
    app: hr-legacy
  ports:
    # Las peticiones llegan por el puerto 80, dentro del pod esto va al puerto llamado http (8080).
    - port: 80
      targetPort: http
