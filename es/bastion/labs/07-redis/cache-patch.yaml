---
# Lab 7 · activación real de la caché. Se aplica sobre el passes-api ya desplegado
# en tu clúster `lab` (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch.yaml
#
# Esto es un patch, no un manifiesto completo: aquí se describe solo lo que cambia. Todo lo demás —
# la imagen, las etiquetas, las sondas, los recursos — permanece intacto desde passes-api.yaml. Por eso el archivo
# empieza directamente en spec: la ruta hasta el contenedor reproduce la estructura del Deployment, para que
# el clúster entienda exactamente dónde aplicar la modificación.
#
# El nombre del contenedor `api` no es adorno, sino una dirección: por él el clúster encuentra el contenedor correcto
# en la lista. Equivócate en el nombre y, en lugar de una modificación, obtendrás un segundo contenedor.
#
# Sustituye la dirección de tu propio Redis en lugar de REDIS-ADDR — es un marcador de posición, no un nombre de host.
# La dirección la tomas del panel, en la tarjeta de tu aplicación gestionada Redis.
spec:
  template:
    spec:
      containers:
        - name: api
          # Las listas de env en Kubernetes se fusionan por el campo name, por eso las tres entradas de abajo
          # se añaden a las que ya existen en el Deployment, en lugar de reemplazarlas.
          env:
            # La aparición de esta variable es precisamente lo que significa «activar la caché»: la aplicación la comprueba
            # al arrancar y, si está definida, va primero a Redis. Vacía o
            # ausente — funciona como antes, consultando el directorio en cada petición.
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
            # La contraseña no se escribe en texto plano: llega desde un secreto que
            # crearás con un comando aparte. En un manifiesto que vive en Git,
            # la contraseña no tiene sitio.
            #
            # secretKeyRef es una referencia: name — el nombre del objeto-secreto en el mismo clúster,
            # key — qué campo dentro de él tomar. El valor se sustituye al arrancar
            # el pod y nunca aparece en el archivo.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
            # Cuántos segundos vive una entrada en la caché. Sesenta — porque
            # el directorio de empleados cambia una vez al día, no una vez por segundo.
            #
            # Un plazo mayor — vamos al directorio con menos frecuencia, pero servimos un apellido
            # obsoleto durante más tiempo. Menor — los datos son más frescos, la ganancia es menor. Es un compromiso,
            # no un ajuste con un valor correcto.
            - name: CACHE_TTL
              value: "60"
