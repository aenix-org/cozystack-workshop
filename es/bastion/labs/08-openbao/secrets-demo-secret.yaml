# Lab 8 · paso 2 de 3: la contraseña se saca del Deployment a un objeto Secret aparte.
# «Arreglo ingenuo»: en la descripción de la aplicación la contraseña ya no se ve, el desarrollador está contento,
# el auditor no. Por qué — lo veremos con un solo comando.
#
# En qué este paso es mejor que el primero: el valor dejó de ser parte de la descripción de la aplicación,
# ahora se lo referencia por nombre. En qué es peor que el tercero — en que el valor de todos
# modos hay que escribirlo en algún sitio, y está escrito justo aquí.
#
#   secrets-demo-naive.yaml      la contraseña la ve todo el que abre el archivo
#   secrets-demo-secret.yaml  <- estás aquí: la contraseña está en un objeto Secret
#   secrets-demo.yaml            no hay ninguna contraseña en el manifiesto
#
# Dónde se usa: tu clúster `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Comando: kubectl apply -f secrets-demo-secret.yaml
#
# La contraseña de este archivo es de entrenamiento e inventada. El archivo tiene dos objetos separados por una
# línea `---`: un Secret y un Deployment que lo referencia. apiVersion, kind
# y metadata.name no se comentan más abajo en el archivo.
#
# Un Secret es un tipo de objeto aparte para lo que no debe estar en la descripción de la aplicación.
# El clúster lo trata con un poco más de cuidado que a los ajustes normales: los valores
# no se muestran en kubectl describe, los permisos de lectura se conceden por separado.
apiVersion: v1
kind: Secret
metadata:
  name: passes-db
# Opaque significa «un conjunto arbitrario de pares clave-valor». Hay tipos especiales —
# para acceder a un registro de imágenes, para certificados TLS, — pero aquí no hace falta
# nada especial.
type: Opaque
data:
  # Esto NO es cifrado. Es base64 — una forma de escribir bytes con caracteres imprimibles.
  # No hay clave, no hay contraseña para descifrar, la conversión inversa la hace cualquiera.
  password: UHJvcHVzazIwMTkh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # El Deployment de abajo es el mismo que en el primer paso. Cambió exactamente un
  # lugar: cómo llega DB_PASSWORD al pod.
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # No como root, un conjunto restringido de llamadas al sistema.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # De nuevo busybox y unas pocas líneas de shell: miramos el camino de la contraseña,
          # no el trabajo de la aplicación.
          image: busybox:1.36
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # Esta es toda la diferencia con el primer paso. valueFrom en vez de value significa
            # «tomar el valor de allí»: secretKeyRef.name — qué objeto, key — qué
            # campo dentro de él. La sustitución ocurre cuando arranca el pod, en la descripción
            # de la aplicación solo queda el nombre.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: passes-db
                  key: password
          # El mismo bucle que en el primer paso: imprime la huella de la contraseña, no la
          # contraseña en sí. La huella es cómoda precisamente para comparar pasos — si no ha
          # cambiado, entonces al pod llegó el mismo valor que antes.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
