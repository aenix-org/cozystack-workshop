# Lab 8 · etapa 3 de 3: no hay contraseña en el manifiesto — ni en texto plano ni en base64.
# La versión final. Este archivo se puede subir a Git, mostrar a un contratista e imprimir
# en una camiseta.
#
# En qué se diferencia esta etapa de la segunda: allí el valor sí se escribía — en un archivo
# y luego en un objeto del clúster. Aquí no está en la descripción en absoluto; la aplicación toma
# la contraseña ella misma, en el momento del arranque, del almacén OpenBao.
#
#   secrets-demo-naive.yaml      la contraseña la ve cualquiera que abra el archivo
#   secrets-demo-secret.yaml     la contraseña se traslada a un objeto Secret
#   secrets-demo.yaml         <- estás aquí: la contraseña llega del almacén al arrancar
#
# ANTES DE APLICAR: reemplaza tenant-workshopXX por tu propio namespace — forma parte de la dirección
# del almacén de abajo. XX es un marcador de posición, no parte del nombre.
# Dónde se aplica: tu clúster `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Comando: kubectl apply -f secrets-demo.yaml
#
# El token con el que la aplicación se identifica ante el almacén está en el secreto passes-bao-token.
# Lo creas con un comando, no con un archivo: este manifiesto solo contiene el nombre del objeto,
# y un nombre no es un secreto.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # Todo se ejecuta sin root. fsGroup hace falta porque aquí hay dos contenedores: uno
      # escribe el archivo con la contraseña, el otro lo lee. Sin un grupo compartido el init-contenedor
      # escribiría un archivo que el principal no podría abrir, y pasarías media hora pensando
      # dónde te equivocaste.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # El lugar donde un contenedor deja la contraseña y el otro la lee.
      # medium: Memory significa que este «disco» está en la memoria RAM del nodo
      # y nunca llega a un disco real: ni a un backup, ni a un volcado de volumen, ni a quien
      # se lleve el disco del servidor. Desapareció el pod — desapareció también su contenido.
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      # El init-contenedor se ejecuta ANTES del principal y debe terminar con éxito.
      # Si no consigue obtener la contraseña, la aplicación no arrancará en absoluto, y ese es el
      # comportamiento correcto: un servicio sin contraseña de la base de datos es inservible de todos modos,
      # es más honesto no levantarse que levantarse y llenar el log de errores.
      initContainers:
        - name: fetch-secret
          # Tomamos la propia imagen de OpenBao por una sola utilidad `bao` — su cliente.
          # No hace falta escribir código propio.
          image: openbao/openbao:2.5.1
          # bao kv get -field=password — obtener un solo campo por una sola ruta, no todo el
          # secreto. tr -d '\n' quita el salto de línea que de otro modo acabaría dentro de la
          # contraseña: un carácter extra al final la base de datos no lo aceptará, y encontrar algo así es desagradable.
          # chmod 0400 — solo el propietario puede leer el archivo.
          # set -e detiene el script en el primer error: de lo contrario el contenedor terminaría
          # con éxito con un archivo vacío, y habría que depurarlo ya en la aplicación.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              bao kv get -field=password secret/passes/db \
                | tr -d '\n' > /secrets/db_password
              chmod 0400 /secrets/db_password
              echo "contraseña obtenida de OpenBao, no está en el manifiesto"
          # La dirección del almacén y el token con el que la aplicación demuestra su derecho a leer.
          # El token se referencia a un objeto creado por un comando; aquí, al archivo, no llega.
          # En la dirección, tenant-workshopXX es ese mismo marcador de posición que hay que reemplazar.
          env:
            - name: BAO_ADDR
              value: http://openbao-secrets.tenant-workshopXX.svc.cozy.local:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: passes-bao-token
                  key: token
          # La carpeta compartida. A este contenedor se le concede para escritura — escribe en ella.
          volumeMounts:
            - name: secrets
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Límites más altos que los del contenedor principal: la utilidad de OpenBao es más pesada que busybox,
          # pero vive unos segundos, así que no es un coste permanente.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      # El contenedor principal arranca solo después de que el init-contenedor haya terminado.
      containers:
        - name: app
          image: busybox:1.36
          # El mismo bucle que en las etapas anteriores, pero la contraseña ahora no está en una variable
          # de entorno, sino en un archivo: la huella se calcula directamente desde /secrets/db_password.
          # Las variables de entorno se ven en la salida de kubectl describe pod y acaban en los volcados
          # de procesos; un archivo en la memoria del pod, no.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s conectando a %s como %s, huella de la contraseña sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(sha256sum /secrets/db_password | cut -c1-12)"
                sleep 10
              done
          # Aquí solo quedan ajustes no secretos — la dirección y el usuario.
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
          # La misma carpeta, pero solo de lectura: la aplicación no puede estropear ni sustituir la contraseña,
          # por mucho que quiera.
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
