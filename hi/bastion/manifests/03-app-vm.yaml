# लागू करने से पहले tenant-workshopXX को अपने namespace से बदलें।
# सभी फ़ाइलों में एक साथ करना आसान है: देखें README, नंबर प्रतिस्थापन वाला भाग।
# और एक बात: नीचे url फ़ील्ड में convert.sh से presigned-लिंक डालें (चरण 2)।
#
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  source:
    http:
      url: "ВСТАВЬТЕ_PRESIGNED_URL"  # convert.sh से (Share: पंक्ति)
  storage: 10Gi
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  instanceType: u1.medium
  instanceProfile: centos.7
  runStrategy: Always
  disks:
    - name: app-1
# एप्लिकेशन तक बाहर से पहुँच डोमेन नाम app.<tenant>.workshop.aenix.io द्वारा होती है
# (Ingress ऑपरेटर द्वारा बनाया जाता है; इस पथ पर port-forward की आवश्यकता नहीं है, देखें README)।
# इस स्टैंड पर external LoadBalancer (Cilium + robotlb) VM के लिए काम नहीं करता,
# इसलिए यहाँ external चालू नहीं करते।
