# लैब 10 · विभिन्न प्रकार के पास के लिए एक MongoDB डेटाबेस का ऑर्डर देना।
# आप क्या पाना चाहते हैं इसका विवरण; सेवा को प्लेटफ़ॉर्म असेंबल और कॉन्फ़िगर करता है।
# वही चीज़ जो आप डैशबोर्ड में माउस से ऑर्डर करेंगे — बस टेक्स्ट के रूप में।
# लैब क्लस्टर पर नहीं, बल्कि मैनेजमेंट क्लस्टर के एक टेनेंट पर लागू होता है:
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f mongodb.yaml
#
# लागू करने से पहले: tenant-workshopXX को अपने namespace से बदलें,
# और ЗдесьВашПароль को अपनी पसंद के पासवर्ड से बदलें।
apiVersion: apps.cozystack.io/v1alpha1
kind: MongoDB
metadata:
  name: passes
  namespace: tenant-workshopXX
spec:
  # एक ही कॉपी। MongoDB तीन की एक रेप्लिका सेट के लिए डिज़ाइन किया गया है: वे मतदान करते हैं कि
  # कौन प्राइमरी है और एक के खोने पर भी टिके रहते हैं। एक ही कॉपी के साथ मतदान करने वाला कोई नहीं होता,
  # और इसके लिए चार्ट एक अलग "असुरक्षित" मोड चालू करता है। लैब के लिए ठीक है,
  # प्रोडक्शन के लिए नहीं।
  replicas: 1
  # डेटा के लिए डिस्क। चार प्रशिक्षण दस्तावेज़ों के लिए एक मेगाबाइट ही काफ़ी होगा, लेकिन बाद में
  # वॉल्यूम को बढ़ाने की बजाय कुछ अतिरिक्त जगह के साथ लेना आसान है।
  size: 5Gi
  # replicated — ऐसे वॉल्यूम जिनकी एक कॉपी क्लस्टर के दूसरे नोड पर होती है: नोड बाहर हो जाए,
  # डेटा बना रहता है।
  storageClass: replicated
  # डेटाबेस पॉड को आवंटित CPU और मेमोरी। चार दस्तावेज़ों के लिए ज़रूरत से ज़्यादा।
  resourcesPreset: s1.small
  # MongoDB शाखा। इसे लाइव डेटाबेस पर बाद में बदलना अपग्रेड के बिना संभव नहीं है।
  version: v8
  # false — डेटाबेस केवल क्लस्टर के अंदर से ही पहुँच योग्य है, बाहर की ओर कोई पोर्ट नहीं खोला जाता।
  # आप इसे इसके पास चल रहे एक वर्क पॉड से एक्सेस करेंगे।
  external: false
  # शार्डिंग डेटा को कई सर्वर सेटों के बीच बाँट देती है। तब ज़रूरी होती है जब
  # डेटा एक ही सर्वर पर नहीं समाता; चार पास तो समा जाते हैं।
  sharding: false
  # डेटाबेस उपयोगकर्ता और उसका पासवर्ड। अपना पासवर्ड खुद चुनें और याद रखें: यह
  # वर्क पॉड (MONGO_URI कनेक्शन स्ट्रिंग में) और चेक स्क्रिप्ट
  # (MONGO_PASSWORD वैरिएबल) को चाहिए। अकाउंट सेवा डेटाबेस admin में बनाया जाता है —
  # इसीलिए कनेक्शन स्ट्रिंग में authSource=admin अनिवार्य है।
  users:
    passapp:
      password: ЗдесьВашПароль
  # passes डेटाबेस और उसमें अनुमतियाँ: passapp उपयोगकर्ता को इस डेटाबेस की admin भूमिका दी गई है,
  # यानी वह पढ़, लिख, इंडेक्स बना और कलेक्शन सेटिंग्स बदल सकता है।
  # इससे अन्य डेटाबेस पर कोई अनुमति नहीं मिलती।
  databases:
    passes:
      roles:
        admin:
          - passapp
  # ऑब्जेक्ट स्टोरेज में बैकअप। प्रशिक्षण स्टैंड पर बंद।
  backup:
    enabled: false
