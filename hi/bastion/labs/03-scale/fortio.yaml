# लैब 3. Fortio लोड जनरेटर: जनरेटर स्वयं और उसके वेब इंटरफ़ेस के लिए एक स्थिर पता।
# `---` से अलग किए गए दो ऑब्जेक्ट।
#
# इसे आपके `lab` प्रशिक्षण क्लस्टर पर लागू किया जाता है, न कि प्रबंधन क्लस्टर पर किसी टेनेंट में:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f fortio.yaml
# यहाँ tenant-workshopXX जैसे कोई प्लेसहोल्डर नहीं हैं — आपको अपना नंबर कहीं भी डालने की ज़रूरत नहीं है।
# यही फ़ाइल लैब 4 में भी चाहिए होगी: `kubectl apply -f ../03-scale/fortio.yaml`।
#
# मैनिफ़ेस्ट के सामान्य फ़ील्ड (apiVersion, kind, metadata.name, selector, template,
# securityContext) ../01-deploy/rickroll.yaml में लाइन-दर-लाइन समझाए गए हैं और यहाँ
# दोहराए नहीं जाते। हम केवल उसी पर टिप्पणी करते हैं जो लोड जनरेटर के लिए विशिष्ट है।
---
# वेब UI वाला लोड जनरेटर।
# hey/ab के बजाय इसे जानबूझकर चुना गया: लोड आप ब्राउज़र में एक बटन से शुरू करते हैं,
# और लेटेंसी हिस्टोग्राम वहीं दिखता है। पिछले वर्कशॉप में हम ठीक कंसोल
# टूल्स पर ही लोगों को खो देते थे।
#
# Fortio क्लस्टर में एक सामान्य ऐप्लिकेशन की तरह रहता है और अंदर से rickroll के पते पर हिट करता है।
# इसे बाहर से, VM से लोड करना ट्रैफ़िक के लिहाज़ से अधिक ईमानदार होता, लेकिन यह क्लस्टर तक के
# चैनल में अटक जाता, और आप ऐप्लिकेशन के बजाय अपना Wi-Fi माप रहे होते।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # जनरेटर की एक प्रति पर्याप्त है: यह स्वयं कई थ्रेड्स में लोड उत्पन्न करती है।
  # यहाँ दूसरी प्रति केवल तस्वीर को धुंधला करती — वेब इंटरफ़ेस में हर प्रति के
  # अपने काउंटर होते हैं, और आप आधे रिक्वेस्ट ही देखते।
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # वही सुरक्षा प्रोफ़ाइल जो rickroll की है: non-root के रूप में चलता है, एक विशिष्ट
      # UID, मानक seccomp। इसे जानबूझकर रखा गया — ताकि फ़ाइल को `restricted` प्रोफ़ाइल
      # सक्षम क्लस्टर में भी लागू किया जा सके, जहाँ अन्यथा पॉड शुरू ही नहीं होता।
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # latest टैग वर्कशॉप के लिए एक जानबूझकर किया गया सरलीकरण है, ताकि वर्ज़न मिलाने न पड़ें।
          # प्रोडक्शन क्लस्टर में ऐसा नहीं करते: इस टैग के अंतर्गत इमेज दो apply के बीच चुपचाप
          # बदल सकती है, और आप कल का परिणाम दोबारा नहीं दोहरा पाएँगे।
          image: fortio/fortio:latest
          # `server` मोड वेब इंटरफ़ेस को उठाता है और उसे चालू रखता है। इस आर्ग्युमेंट के बिना
          # Fortio कमांड लाइन से एक ही रन करके बाहर निकल जाता, और क्लस्टर
          # कंटेनर को बार-बार लूप में रीस्टार्ट करता रहता।
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            # यह रिक्वेस्ट rickroll की अपनी (20m) से अधिक है: जनरेटर को नोड पर जगह पहले से
            # चाहिए, वरना शेड्यूलर उसे तंगी से रखेगा और रैंप-अप असमान होगा।
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # जनरेटर को CPU में गुंजाइश चाहिए, वरना यह अपने आप में उलझ
              # जाएगा और आप ऐप्लिकेशन के बजाय Fortio को लोड कर रहे होंगे।
              cpu: "1"
              memory: 256Mi
---
# क्लस्टर के अंदर जनरेटर का स्थिर पता। इसकी ज़रूरत VM से `kubectl port-forward svc/fortio 8081:8080`
# के माध्यम से वेब इंटरफ़ेस खोलने के लिए है — बाहर से क्लस्टर कुछ भी
# प्रकाशित नहीं करता, और Fortio तक कोई अन्य दरवाज़ा नहीं है।
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  ports:
    # दोनों ओर 8080: सर्विस और कंटेनर दोनों। यह नंबर पॉड के अंदर rickroll के नंबर के
    # समान है, पर कोई टकराव नहीं — हर पॉड का अपना नेटवर्क स्टैक होता है।
    - port: 8080
      targetPort: http
