---
# लैब 4. पेज का दूसरा संस्करण — वही जिसे हम लोड के तहत रोलआउट करते हैं।
# इसमें साफ़ अंतर दिखना चाहिए: प्रतिभागी ब्राउज़र देख रहा है, diff नहीं।
#
# एक ऑब्जेक्ट। इसे आपके `lab` प्रशिक्षण क्लस्टर पर लागू किया जाता है, प्रबंधन
# क्लस्टर के टेनेंट पर नहीं:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll-page-v2.yaml
# यहाँ tenant-workshopXX जैसे कोई प्लेसहोल्डर नहीं हैं — आपको कहीं भी अपना नंबर डालने की ज़रूरत नहीं।
#
# यहाँ लोग सबसे ज़्यादा जिस बात पर अटकते हैं: यह apply अपने आप कुछ भी रोलआउट नहीं करता।
# यह क्लस्टर में पहले वाले के बगल में एक और सेटिंग्स फ़ाइल रख देता है। जब तक Deployment का `page`
# वॉल्यूम rickroll-page-v1 की ओर इशारा करता है, उपयोगकर्ता पहला संस्करण देखते हैं।
# रोलआउट लैब का अगला चरण बनता है — वॉल्यूम को इस ConfigMap पर स्विच करना।
# इसीलिए दो ऑब्जेक्ट वाली पूरी संरचना है: पहला संस्करण क्लस्टर में
# अछूता रहता है, और रोलबैक उसे स्मृति से पुनर्निर्मित करने के बजाय पूरा का पूरा वापस ले आता है।
#
# इसके बजाय अगर हम ConfigMap rickroll-page-v1 को उसी जगह संपादित करते, तो रोलबैक करने के लिए
# कहीं जगह न होती, और पॉड्स को प्रतियाँ बदले बिना और रिवीज़न इतिहास में रिकॉर्ड
# दर्ज हुए बिना नई सामग्री मिल जाती — यानी उस सब के बिना जिसके लिए यह लैब बनाई गई है।
#
# ऑब्जेक्ट का नाम बदला नहीं जा सकता: README का पैच rickroll-page-v2 की ओर इशारा करता है,
# और check.sh की जाँच भी वैसा ही करती है।
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v2
data:
  # `|` के बाद इंडेंटेशन के नीचे जो कुछ भी है, वह index.html फ़ाइल की अक्षरशः सामग्री है
  # जो कंटेनर के अंदर जाएगी। यह अब YAML नहीं है: यहाँ कोई टिप्पणी नहीं है
  # और हो भी नहीं सकती — हैश चिह्न पेज पर सामान्य टेक्स्ट की तरह आ जाता।
  #
  # मार्कअप में दो चीज़ें check.sh के लिए मायने रखती हैं: लेबल «ВЕРСИЯ 2» —
  # इसी से जाँच दूसरे संस्करण को पहले से अलग पहचानती है, और प्लेसहोल्डर __POD__ — इसे
  # ConfigMap rickroll-conf (लैब 1) के नियम के अनुसार nginx पॉड के नाम से बदला जाता है।
  # इनमें से किसी एक को हटा देंगे तो लैब की जाँच पास नहीं होगी, भले ही रोलआउट सफल हो जाए।
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>We're No Strangers To Love</title>
    <style>
      body{background:#07131a;color:#e8f6ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      .tag{display:inline-block;margin-bottom:1.5em;padding:.35em 1em;border-radius:999px;
           background:#00e0ff;color:#052; font-weight:700;letter-spacing:.08em;font-size:13px}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#00ffa3,#00e0ff,#7a5cff,#00ffa3);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#7f96a3;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#5d7380}
      .pod b{display:block;margin-top:.4em;color:#00ffa3;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#3f5561;font-size:14px}
    </style>
    <div class="tag">ВЕРСИЯ 2</div>
    <h1>We're No Strangers To Love</h1>
    <p class="lyr">You know the rules &middot; And so do I</p>
    <div class="pod">вас обслужил под<b>__POD__</b></div>
    <p class="hint">Обновление прошло под нагрузкой. Посмотрите в Fortio: ошибок ноль.</p>
    </html>
