# लैब 1. पूरा rickroll प्रशिक्षण एप्लिकेशन एक ही फ़ाइल में: nginx सेटिंग्स, पेज,
# स्वयं डिप्लॉयमेंट, और उस तक पहुँचने का स्थायी पता। `---` से अलग किए गए चार ऑब्जेक्ट।
#
# आपके प्रशिक्षण क्लस्टर `lab` पर लागू किया जाता है, न कि प्रबंधन क्लस्टर के किसी टेनेंट में:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll.yaml
# tenant-workshopXX जैसे कोई प्लेसहोल्डर यहाँ नहीं हैं — अपना नंबर कहीं भी डालने की ज़रूरत नहीं।
#
# सभी चार ऑब्जेक्ट में दोहराए जाने वाले फ़ील्ड यहाँ एक बार समझ लेते हैं:
#   apiVersion — वह API अनुभाग जिसमें यह ऑब्जेक्ट प्रकार रहता है;
#   kind       — स्वयं ऑब्जेक्ट प्रकार;
#   metadata.name — वह नाम जिससे ऑब्जेक्ट को बाद में `kubectl get` के ज़रिए खोजा जाता है।
# नाम अपने प्रकार के भीतर अद्वितीय होता है, इसलिए नीचे दिए Deployment और Service दोनों
# rickroll कहलाते हैं और टकराते नहीं।
---
# nginx सेटिंग्स। पेज संस्करणों के बीच ये नहीं बदलतीं, इसलिए इन्हें अलग रखा गया है।
# ConfigMap — एक सेटिंग्स फ़ाइल जो क्लस्टर में स्वयं अपने आप रहती है और शुरुआत के समय
# कंटेनर के भीतर माउंट कर दी जाती है। मकसद यह है कि इमेज को दोबारा बनाए बिना सेटिंग्स
# बदली जा सकें। `default.conf` कुंजी उस निर्देशिका में फ़ाइल का नाम बन जाती है जहाँ वॉल्यूम माउंट होता है।
#
# `|` के बाद इंडेंट के नीचे जो कुछ भी है वह YAML नहीं बल्कि फ़ाइल की अक्षरशः सामग्री है। इस
# ब्लॉक के भीतर हैश वाली पंक्तियाँ पार्सिंग के दौरान गायब होने के बजाय nginx कॉन्फ़िग में ज्यों की
# त्यों चली जाती हैं। इसी कारण नीचे दिए पेज ब्लॉक में कोई टिप्पणी नहीं जोड़ी गई:
# वह HTML है, और उसमें हैश उपयोगकर्ता को स्क्रीन पर दिखाई देता।
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-conf
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      location / {
        # लैब का पूरा सार: nginx अपने ही पॉड का नाम सीधे HTML में डाल देता है।
        # पॉड के भीतर $hostname यही पॉड का नाम होता है।
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
---
# पेज, संस्करण 1. सेटिंग्स से अलग एक ऑब्जेक्ट — ताकि लैब 4 में एप्लिकेशन को nginx कॉन्फ़िग
# छुए या इमेज को दोबारा बनाए बिना दूसरे संस्करण पर स्विच किया जा सके।
# नाम में -v1 प्रत्यय सजावट नहीं है: इसके बगल में rickroll-page-v2 आएगा, और उनके बीच
# वॉल्यूम को स्विच करना ही नया संस्करण रोल आउट करना है।
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v1
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Never Gonna Give You Up</title>
    <style>
      body{background:#0d0d12;color:#e8e8ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#ff0057,#ffb800,#00e0ff,#ff0057);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#9aa0b5;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#6f7690}
      .pod b{display:block;margin-top:.4em;color:#00e0ff;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#4d5366;font-size:14px}
    </style>
    <h1>Never Gonna Give You Up</h1>
    <p class="lyr">Never gonna let you down &middot; Never gonna run around and desert you</p>
    <div class="pod">सेवा प्रदान करने वाला Pod<b>__POD__</b></div>
    <p class="hint">पेज रीफ़्रेश करें। जब रेप्लिका ज़्यादा हो जाएँगी, तब नाम बदलना शुरू हो जाएगा।</p>
    </html>
---
# स्वयं एप्लिकेशन। Deployment वांछित स्थिति का वर्णन करता है — कौन सी इमेज चलानी है,
# कितनी प्रतियाँ रखनी हैं, अपडेट के दौरान उन्हें कैसे बदलना है। इसके बाद क्लस्टर स्वयं
# वास्तविकता को इस वर्णन के अनुरूप लाता है और लगातार उस पर नज़र रखता है, न कि केवल एक बार बनाते समय।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rickroll
  labels:
    app: rickroll
spec:
  # कितनी प्रतियाँ चालू रखनी हैं। शब्दावली जानबूझकर ऐसी है: «एक चलाओ» नहीं,
  # बल्कि «एक बनाए रखो»। कोई प्रति गायब होगी — क्लस्टर बिना पूछे नई बना देगा। लैब 3 में
  # यही फ़ील्ड ऑटोस्केलिंग बदलना शुरू कर देती है, इसलिए इसे हाथ से और नहीं छूते।
  replicas: 1
  # वह लेबल जिससे Deployment पॉड्स को अपना मानता है। यहाँ का लेबल और नीचे template में
  # लेबल का मिलना ज़रूरी है: बेमेल होने पर ऑब्जेक्ट बिलकुल नहीं बनेगा।
  selector:
    matchLabels:
      app: rickroll
  # पॉड टेम्पलेट — इसी से हर प्रति की छाप बनती है। template के भीतर किसी भी फ़ील्ड को बदलना
  # एप्लिकेशन के नए संशोधन और प्रतियों को बारी-बारी बदलने का मतलब है (यही लैब 4 है)।
  # template के बाहर के फ़ील्ड (उदाहरण के लिए, replicas) बदलने से संशोधन नहीं बनता।
  template:
    metadata:
      labels:
        # वही लेबल स्वयं पॉड्स पर भी लगा है: इसी से फ़ाइल के अंत में Service उन्हें ढूँढता है।
        app: rickroll
    spec:
      # पूरे पॉड के स्तर पर `restricted` सुरक्षा प्रोफ़ाइल की आवश्यकताएँ: root के रूप में
      # नहीं चलना, एक विशिष्ट UID, और मानक seccomp प्रोफ़ाइल। `restricted` सक्षम किए गए
      # कॉर्पोरेट क्लस्टर में इन फ़ील्ड्स के बिना पॉड को चलने की अनुमति नहीं मिलेगी,
      # और अस्वीकृति पॉड बनने के क्षण पर आती है, न कि मैनिफ़ेस्ट apply करते समय।
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # वही सख्ती, पर कंटेनर के स्तर पर: भीतर की प्रक्रिया को अपने अधिकार बढ़ाने से
          # मना किया गया है, और उससे सभी linux क्षमताएँ छीन ली गई हैं।
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # एक अविशेषाधिकृत रूप: 8080 पर सुनता है और root के रूप में नहीं चलता।
          # अकेले यही `baseline` प्रोफ़ाइल के लिए पर्याप्त है, पर `restricted` के लिए नहीं — उसे
          # पॉड और कंटेनर पर स्पष्ट securityContext चाहिए, जो ऊपर सेट हैं। कॉर्पोरेट
          # क्लस्टर में आमतौर पर `restricted` ही सक्षम होता है।
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # डिफ़ॉल्ट रूप से nginx नोड के प्रति कोर एक वर्कर प्रक्रिया चालू करता है। एक कोर वाली
          # प्रशिक्षण मशीन पर यह एक प्रक्रिया है, पर 64 कोर वाले प्रोडक्शन नोड पर 64,
          # और छोटी मेमोरी लिमिट वाला पॉड पहले अनुरोध से पहले ही OOMKilled के साथ क्रैश हो जाता है।
          # ऑटोट्यून वर्कर्स की गिनती CPU लिमिट से करता है: 300m पर यह एक प्रक्रिया है।
          # एनवायरनमेंट वेरिएबल के ज़रिए, न कि -g के ज़रिए: यह निर्देश पहले से ही इमेज के बेस
          # कॉन्फ़िग में है, और दूसरी घोषणा nginx को «duplicate» त्रुटि के साथ गिरा देती है।
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # पोर्ट को केवल नंबर नहीं, बल्कि एक नाम दिया गया है: `http` का संदर्भ नीचे readinessProbe
          # और Service का targetPort लेते हैं। नंबर बदलेगा — तो एक ही जगह ठीक करना होगा।
          ports:
            - containerPort: 8080
              name: http
          # दो अलग चीज़ें जिन्हें लगातार भ्रमित किया जाता है। requests — कितना संसाधन
          # गारंटी के साथ आरक्षित करना है; इसी से शेड्यूलर नोड चुनता है, और इसी से
          # लैब 3 में ऑटोस्केलिंग प्रतिशत में लोड की गणना करती है।
          # limits — वह छत जिससे ऊपर उठने नहीं देते: प्रोसेसर पर दबाव में
          # धीमा कर देते हैं, मेमोरी पर कंटेनर को मार देते हैं।
          resources:
            # जानबूझकर बहुत छोटे: वर्कशॉप में ऐसे एप्लिकेशन बहुत होंगे।
            # 20m यानी कोर का दो सौवाँ हिस्सा। मान जानबूझकर कम है: requests जितने कम होंगे,
            # लोड उतनी ही तेज़ी से सीमा पार करता है और लैब 3 में प्रतियों की वृद्धि
            # घंटे भर में नहीं, बल्कि सेकंडों में दिखती है।
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          # तैयारी की जाँच। जब तक इस पते से जवाब नहीं आता, क्लस्टर प्रति पर
          # ट्रैफ़िक नहीं भेजता। इसी के लिए nginx कॉन्फ़िग में «ok» जवाब वाला अलग
          # location /healthz बनाया गया है। इसी फ़ील्ड से लैब 4 में बिना डाउनटाइम की रोलआउट
          # की क़ीमत चुकती है: पुरानी प्रति तभी बंद होती है जब नई जवाब दे देती है।
          # इसे हटा दें — और अपडेट अनुरोध गिराना शुरू कर देगा।
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            # पहले दस्तक तक दो सेकंड — अनुभव से तय किया गया। इससे कम का कोई
            # मतलब नहीं, nginx इतना समय शुरू होने में लेता है; ज़्यादा — हर रोलआउट को व्यर्थ खींचेगा।
            initialDelaySeconds: 2
          # ConfigMap की सामग्री कंटेनर के भीतर कहाँ रखनी है। निर्देशिकाएँ मनमाने ढंग से
          # नहीं चुनी गईं: पहली से nginx फ़ाइलें देता है, दूसरी से सेटिंग्स पढ़ता है।
          # इन दो पंक्तियों के बिना दोनों ConfigMap क्लस्टर में यूँ ही पड़े रहते,
          # और nginx अपना डिफ़ॉल्ट पेज दिखाता।
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
      # पॉड से कौन से ConfigMap जोड़ने हैं। यहाँ वॉल्यूम का नाम इसे ऊपर volumeMounts की
      # प्रविष्टि से जोड़ता है — नामों का ही मिलना ज़रूरी है, जोड़ के लिए क्रम मायने नहीं रखता।
      # पर लैब 4 के लिए मायने रखता है, नीचे चेतावनी देखें।
      volumes:
        # ध्यान दें: यह वॉल्यूम पहला होना चाहिए (volumes[0])।
        # लैब 4 पेज संस्करण को इंडेक्स द्वारा पैच से स्विच करती है।
        # JSON Patch सूची तत्व को नाम से नहीं, बल्कि नंबर से संबोधित करता है। वॉल्यूम को आपस में
        # बदल दें — तो पैच चुपचाप पेज के बजाय nginx सेटिंग्स बदल देगा, एप्लिकेशन
        # टूट जाएगा, और त्रुटि संदेश बिलकुल किसी और चीज़ की बात करेगा।
        - name: page
          configMap:
            name: rickroll-page-v1
        - name: conf
          configMap:
            name: rickroll-conf
---
# एप्लिकेशन का स्थायी पता। प्रतियाँ जन्म लेती और मरती हैं, उनके पते बदलते हैं, पर क्लस्टर के
# भीतर नाम `rickroll` वही रहता है — इसी से पड़ोसी एप्लिकेशन को बुलाते हैं।
# इस नाम के पीछे जीवित प्रतियों की सूची क्लस्टर स्वयं, लेबल के अनुसार, बनाए रखता है।
apiVersion: v1
kind: Service
metadata:
  name: rickroll
spec:
  # इस पते के पीछे किसे रखना है: ऐसे लेबल वाले सभी पॉड, चाहे उन्हें किसी ने भी
  # बनाया हो। इसी से एक आम परेशानी — app: rickroll लेबल वाला कोई बाहरी पॉड
  # चुपचाप बैलेंसिंग में शामिल हो जाएगा और आपके उपयोगकर्ताओं को जवाब देने लगेगा। इस फ़ोल्डर में
  # check.sh स्क्रिप्ट अलग से जाँचती है कि ऐसे कोई नकली मौजूद न हों।
  selector:
    app: rickroll
  ports:
    # port — किस पोर्ट पर स्वयं सर्विस जवाब देती है, targetPort — वह कहाँ पॉड के भीतर
    # दस्तक देती है। यहाँ targetPort कंटेनर के पोर्ट के नाम से सेट है, नंबर से नहीं: कंटेनर में
    # नंबर बदलेगा — तो इस फ़ाइल को ठीक नहीं करना पड़ेगा।
    - port: 80
      targetPort: http
