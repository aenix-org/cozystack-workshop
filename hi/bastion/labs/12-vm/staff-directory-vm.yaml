---
# लैब 12. लेगेसी स्टाफ डायरेक्टरी के लिए एक वर्चुअल मशीन: डिस्क और स्वयं मशीन,
# एक ही फ़ाइल में दो ऑब्जेक्ट, एक `---` लाइन से अलग किए गए।
#
# ये टेनेंट ऑब्जेक्ट हैं: ये `lab` क्लस्टर में नहीं, बल्कि प्रबंधन क्लस्टर पर आपके
# namespace में रहते हैं। आपको टेनेंट kubeconfig की ज़रूरत है।
#
# लागू करने से पहले, tenant-workshopXX को अपने namespace से बदलें, वरना ऑर्डर आपके बजाय
# गलत टेनेंट में चला जाएगा।
#
#     export KUBECONFIG=~/.kube/config
#     kubectl apply -f staff-directory-vm.yaml
#
# यही काम टेनेंट डैशबोर्ड में माउस से किया जा सकता है (Create application -> VM Disk,
# फिर VM Instance) — परिणाम एक जैसा होता है।
#
# ध्यान दें: जिस नाम से मशीन को आगे बुलाया जाता है वह metadata.name से मेल नहीं खाता, और यह
# लैब में कोई टाइपो नहीं है। प्लेटफ़ॉर्म X नाम वाले VMInstance ऑब्जेक्ट को
# `vm-instance` चार्ट से तैनात करता है, और चार्ट का नाम रिलीज़ के नाम से जुड़ जाता है: चल रहा इंस्टेंस
# vm-instance-X कहलाता है। इसके अलावा, लक्ष्य को टाइप उपसर्ग के साथ निर्दिष्ट किया जाता है, क्योंकि
# टेनेंट अनुमतियाँ इंस्टेंस (virtualmachineinstances, यानी vmi) पर दी जाती हैं, न कि
# virtualmachines पर — नंगा नाम forbidden लौटाएगा। इसलिए कंसोल में लॉगिन का कमांड:
#     virtctl console --namespace=tenant-workshopXX vmi/vm-instance-spravochnik
# चल रहे इंस्टेंस की सूची: kubectl get vmi -n tenant-workshopXX
# और `kubectl get vminstance spravochnik` इंस्टेंस नहीं, बल्कि उसके लिए आपका ऑर्डर दिखाता है —
# वही ऑब्जेक्ट जो नीचे वर्णित है।
#
# डिस्क और मशीन — दो अलग-अलग ऑब्जेक्ट हैं, और यह नौकरशाही नहीं है: डिस्क मशीन से
# ज़्यादा जीवित रहती है। मशीन को हटाकर फिर से बनाया जा सकता है, उसी डिस्क को जोड़ते हुए।
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  source:
    image:
      # प्लेटफ़ॉर्म के साझा इमेज संग्रह से एक नाम, URL नहीं।
      # डिस्क बनाते समय यह सूची डैशबोर्ड में दिखती है।
      name: ubuntu-22.04
  # डिस्क का आकार। यह स्रोत इमेज से छोटा नहीं हो सकता: ubuntu-22.04 विस्तृत होकर
  # 20Gi बनता है, और प्लेटफ़ॉर्म 10Gi डिस्क को भरने से इनकार कर देगा। डिस्क को बाद में बढ़ाया जा सकता है,
  # पर घटाया नहीं जा सकता, इसलिए यहाँ कम आँकना ज़्यादा आँकने से महँगा पड़ता है।
  storage: 20Gi
  # स्टोरेज क्लास। `replicated` — डेटा को कई प्रतियों में अलग-अलग प्लेटफ़ॉर्म नोड्स पर
  # लिखा जाता है: प्रति रखने वाला नोड मर सकता है, और मशीन काम करती रहती है। मूल रूप में यह
  # एक मिरर है, बस नेटवर्क पर बना हुआ। पड़ोसी लैब में डेटाबेस भी वही क्लास लेते हैं।
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  # 1 CPU, 4 GB. वही कैटलॉग संदर्भ जिससे Kubernetes नोड्स के आकार
  # लिए जाते हैं: मशीनें और नोड्स यहाँ एक ही तरह से मापे जाते हैं।
  instanceType: u1.medium
  # गेस्ट OS प्रोफ़ाइल: मशीन को कौन से ड्राइवर और डिवाइस सौंपने हैं।
  instanceProfile: ubuntu
  # Always का मतलब «चालू रखो»: अगर यह अपने आप बंद हो जाए — तो इसे फिर से चालू किया जाएगा।
  # Halted — बंद, Manual — जैसा छोड़ा गया था।
  runStrategy: Always
  # मशीन से कौन सी डिस्क जोड़नी हैं। संदर्भ ऊपर वाले VMDisk ऑब्जेक्ट के नाम से जाता है — वही
  # जो इस मशीन से ज़्यादा जीवित रहेगा।
  disks:
    - name: spravochnik
  # ध्यान दें: यहाँ replicas फ़ील्ड नहीं है और न ही होगा।
  # एक वर्चुअल मशीन एक ही ऑब्जेक्ट है। दो मशीनें चाहिए — तो दो ऑब्जेक्ट
  # अलग-अलग नामों के साथ। यह Deployment से एक मूलभूत अंतर है,
  # देखें README का वह खंड जहाँ यह अंतर चुभता है।
  # गेस्ट OS की प्रारंभिक सेटअप। cloud-init Linux क्लाउड इमेज का मानक तंत्र है:
  # पहले बूट पर मशीन इस टेक्स्ट को पढ़ती है और इसे स्वयं पर लागू करती है। अपनी भूमिका में
  # यह vSphere में गेस्ट कस्टमाइज़ेशन है — पासवर्ड, फ़ाइलें, सेवाएँ, — बस विवरण से, न कि
  # किसी विज़ार्ड से। `|` के बाद के इंडेंट से नीचे का सब कुछ गेस्ट में शब्दशः जाता है और वहीं
  # पार्स होता है, Kubernetes द्वारा नहीं।
  #
  # यहाँ cloud-init डायरेक्टरी को एक सर्वर में बदल देता है: यह एक HTML पेज रखता है और एक सेवा शुरू करता है
  # जो इसे HTTP पर पोर्ट 8080 पर परोसती है। python3 पहले से ही ubuntu इमेज में है — इसके लिए इंटरनेट
  # की ज़रूरत नहीं। पोर्ट 8080 यादृच्छिक नहीं है: प्रस्तुतकर्ता ने पहले से ही आपके टेनेंट में
  # Service `spravochnik-http` (80 -> 8080) और Ingress `spravochnik` बना दिया है, और जैसे ही मशीन के अंदर
  # सेवा ऊपर आती है, डायरेक्टरी टेनेंट डोमेन पर प्रकाशित हो जाएगी।
  cloudInit: |
    #cloud-config
    # पासवर्ड डैशबोर्ड से कंसोल में लॉगिन करने के लिए चाहिए। प्रोडक्शन मशीन पर
    # ऐसा नहीं करना चाहिए — वहाँ sshKeys।
    password: ubuntu
    chpasswd: { expire: false }
    ssh_pwauth: true
    write_files:
      - path: /opt/directory/index.html
        content: |
          <!doctype html><html lang="hi"><head><meta charset="utf-8"><title>निर्देशिका</title></head><body><h1>कर्मचारी निर्देशिका</h1><ul><li>शर्मा आर. — 101</li><li>पाण्डेय प. — 102</li></ul></body></html>
      - path: /etc/systemd/system/directory.service
        content: |
          [Unit]
          Description=Staff directory
          After=network.target
          [Service]
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0 --directory /opt/directory
          Restart=always
          [Install]
          WantedBy=multi-user.target
    runcmd: [ "systemctl daemon-reload", "systemctl enable --now directory" ]
