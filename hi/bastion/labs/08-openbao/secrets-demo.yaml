# लैब 8 · चरण 3 का 3: मैनिफ़ेस्ट में पासवर्ड नहीं है — न सादे टेक्स्ट में, न base64 में।
# अंतिम संस्करण। इस फ़ाइल को Git में रखा जा सकता है, ठेकेदार को दिखाया जा सकता है और
# टी-शर्ट पर छापा जा सकता है।
#
# यह चरण दूसरे से कैसे अलग है: वहाँ मान फिर भी लिखा जाता था — एक फ़ाइल में और फिर एक
# क्लस्टर ऑब्जेक्ट में। यहाँ वह विवरण में बिल्कुल भी मौजूद नहीं है; एप्लिकेशन पासवर्ड
# स्वयं, स्टार्टअप के समय, OpenBao स्टोर से ले लेता है।
#
#   secrets-demo-naive.yaml      पासवर्ड हर उस व्यक्ति को दिखता है जो फ़ाइल खोलता है
#   secrets-demo-secret.yaml     पासवर्ड को Secret ऑब्जेक्ट में निकाल दिया गया है
#   secrets-demo.yaml         <- आप यहाँ हैं: पासवर्ड स्टार्टअप पर स्टोर से आता है
#
# लागू करने से पहले: tenant-workshopXX को अपने namespace से बदलें — यह नीचे स्टोर के
# पते का हिस्सा है। XX एक प्लेसहोल्डर है, नाम का हिस्सा नहीं।
# कहाँ लागू होता है: आपका `lab` क्लस्टर (export KUBECONFIG=~/lab.kubeconfig)।
# कमांड: kubectl apply -f secrets-demo.yaml
#
# जिस टोकन से एप्लिकेशन स्टोर के सामने अपनी पहचान बताता है वह passes-bao-token सीक्रेट में रहता है।
# आप इसे किसी कमांड से बनाते हैं, फ़ाइल से नहीं: इस मैनिफ़ेस्ट में केवल ऑब्जेक्ट का नाम है,
# और नाम कोई सीक्रेट नहीं है।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # सब कुछ non-root के रूप में चलता है। fsGroup इसलिए ज़रूरी है क्योंकि यहाँ दो कंटेनर हैं: एक
      # पासवर्ड वाली फ़ाइल लिखता है, दूसरा उसे पढ़ता है। साझा समूह के बिना init-कंटेनर एक ऐसी
      # फ़ाइल लिखेगा जिसे मुख्य कंटेनर नहीं खोल पाएगा, और आप आधा घंटा यह सोचते रहेंगे कि
      # गलती कहाँ हुई।
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # वह जगह जहाँ एक कंटेनर पासवर्ड रखता है और दूसरा उसे पढ़ता है।
      # medium: Memory का मतलब है कि यह «डिस्क» नोड की रैम में रहता है
      # और कभी किसी असली डिस्क तक नहीं पहुँचता: न बैकअप में, न वॉल्यूम डंप में, न उस व्यक्ति तक
      # जो सर्वर से डिस्क निकाल लेता है। पॉड गया — उसकी सामग्री भी गई।
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      # init-कंटेनर मुख्य कंटेनर से पहले चलता है और उसे सफलतापूर्वक समाप्त होना ही चाहिए।
      # अगर वह पासवर्ड नहीं ला पाया तो एप्लिकेशन बिल्कुल भी शुरू नहीं होगा, और यह सही
      # व्यवहार है: डेटाबेस पासवर्ड के बिना सेवा वैसे भी बेकार है, ऊपर आकर लॉग में एरर उगलने
      # से बेहतर यही है कि ईमानदारी से ऊपर ही न आए।
      initContainers:
        - name: fetch-secret
          # हम खुद OpenBao की इमेज लेते हैं सिर्फ़ एक टूल `bao` के लिए — उसके क्लाइंट के लिए।
          # अपना कोड लिखने की ज़रूरत नहीं।
          image: openbao/openbao:2.5.1
          # bao kv get -field=password — एक ही पथ से एक ही फ़ील्ड लाना, पूरा सीक्रेट नहीं।
          # tr -d '\n' उस न्यूलाइन को हटाता है जो अन्यथा पासवर्ड के भीतर चली जाती:
          # अंत में एक अतिरिक्त वर्ण को डेटाबेस स्वीकार नहीं करेगा, और ऐसी चीज़ ढूँढना अप्रिय है।
          # chmod 0400 — फ़ाइल को केवल मालिक ही पढ़ सकता है।
          # set -e स्क्रिप्ट को पहली ही एरर पर रोक देता है: अन्यथा कंटेनर एक खाली फ़ाइल के साथ
          # सफलतापूर्वक समाप्त हो जाता, और फिर यह सब एप्लिकेशन में डिबग करना पड़ता।
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              bao kv get -field=password secret/passes/db \
                | tr -d '\n' > /secrets/db_password
              chmod 0400 /secrets/db_password
              echo "пароль получен из OpenBao, в манифесте его нет"
          # स्टोर का पता और वह टोकन जिससे एप्लिकेशन पढ़ने का अपना अधिकार साबित करता है।
          # टोकन एक कमांड से बनाए गए ऑब्जेक्ट के संदर्भ से आता है; वह यहाँ, फ़ाइल में, कभी नहीं आता।
          # पते में tenant-workshopXX वही प्लेसहोल्डर है जिसे बदलना ज़रूरी है।
          env:
            - name: BAO_ADDR
              value: http://openbao-secrets.tenant-workshopXX.svc.cozy.local:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: passes-bao-token
                  key: token
          # साझा फ़ोल्डर। इस कंटेनर को यह लिखने के लिए दिया गया है — यह इसमें लिखता है।
          volumeMounts:
            - name: secrets
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # लिमिट मुख्य कंटेनर से अधिक हैं: OpenBao टूल busybox से भारी है,
          # लेकिन यह कुछ ही सेकंड जीता है, इसलिए यह कोई स्थायी कीमत नहीं है।
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      # मुख्य कंटेनर तभी शुरू होता है जब init-कंटेनर समाप्त हो चुका हो।
      containers:
        - name: app
          image: busybox:1.36
          # पिछले चरणों जैसा ही लूप, लेकिन पासवर्ड अब किसी एनवायरनमेंट वेरिएबल में नहीं
          # बल्कि एक फ़ाइल में है: फ़िंगरप्रिंट सीधे /secrets/db_password से गणना किया जाता है।
          # एनवायरनमेंट वेरिएबल kubectl describe pod के आउटपुट में दिखते हैं और प्रोसेस डंप में
          # चले जाते हैं; पॉड की मेमोरी में मौजूद फ़ाइल नहीं दिखती।
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(sha256sum /secrets/db_password | cut -c1-12)"
                sleep 10
              done
          # यहाँ केवल गैर-गुप्त सेटिंग्स बची हैं — पता और लॉगिन।
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
          # वही फ़ोल्डर, लेकिन केवल पढ़ने के लिए: एप्लिकेशन पासवर्ड को बिगाड़ या बदल नहीं
          # सकता, भले ही वह बहुत चाहे।
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
