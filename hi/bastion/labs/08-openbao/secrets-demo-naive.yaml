# लैब 8 · चरण 3 में से 1: पासवर्ड मैनिफ़ेस्ट में सादे टेक्स्ट में पड़ा है।
# सेवा «गेस्ट पास» आज इसी तरह दिखती है — और यही वह फ़ाइल है जिसे ऑडिट ने पकड़ा।
# हम इसे ठीक एक बार लागू करेंगे, ताकि समस्या को अपनी आँखों से देख सकें।
#
# लैब के तीन चरण, ताकि आप भटक न जाएँ:
#   secrets-demo-naive.yaml   <- आप यहाँ हैं: जो कोई फ़ाइल खोलता है, उसे पासवर्ड दिख जाता है
#   secrets-demo-secret.yaml     पासवर्ड को अलग Secret ऑब्जेक्ट में निकाल दिया गया है
#   secrets-demo.yaml            मैनिफ़ेस्ट में पासवर्ड बिल्कुल नहीं है
#
# कहाँ लागू होता है: आपका `lab` क्लस्टर (export KUBECONFIG=~/lab.kubeconfig)।
# कमांड: kubectl apply -f secrets-demo-naive.yaml
#
# इस फ़ाइल का पासवर्ड प्रशिक्षण के लिए बनाया हुआ है, असली कोई नहीं है। एक ही ऑब्जेक्ट —
# Deployment; apiVersion, kind और metadata.name पर आगे टिप्पणी नहीं की गई है।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # एक ही कॉपी काफ़ी है: हम फ़ॉल्ट टॉलरेंस पर नहीं, बल्कि इस पर देख रहे हैं कि
  # ऐप्लिकेशन पासवर्ड कहाँ से लेता है।
  replicas: 1
  # इस लेबल से Deployment अपने पॉड्स को पहचानता है। यह नीचे template में मौजूद लेबल से मेल खाता है।
  selector:
    matchLabels:
      app: secrets-demo
  # template — पॉड का टेम्पलेट: कॉपी किससे बनानी है।
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # सुरक्षा आवश्यकताएँ: root से नहीं, सिस्टम कॉल्स का सीमित सेट।
      # इस विसंगति पर ध्यान दें: पॉड सभी सुरक्षा नियमों के अनुसार कॉन्फ़िगर किया गया है, और यह किसी भी तरह
      # पासवर्ड को दस पंक्तियाँ नीचे फ़ाइल में पड़े रहने से नहीं रोकता।
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # यहाँ कोई असली ऐप्लिकेशन नहीं है — busybox और shell की कुछ पंक्तियाँ।
          # इस लैब के लिए सिर्फ़ एक बात मायने रखती है: पासवर्ड कहाँ से आता है, न कि उसके साथ आगे
          # क्या किया जाता है।
          image: busybox:1.36
          env:
            # डेटाबेस का पता और यूज़र का नाम रहस्य नहीं हैं: यह जानना कि
            # डेटाबेस का नाम passes-db है, अपने आप में एक्सेस नहीं देता।
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # यही वह पंक्ति है जिसे ऑडिट ने पकड़ा।
            # फ़ाइल Git में पड़ी है, यानी पासवर्ड हर उस व्यक्ति को पता है जिसके पास रिपॉज़िटरी तक
            # एक्सेस है, और हर उस व्यक्ति को भी जिसने इसे कभी क्लोन किया।
            - name: DB_PASSWORD
              value: "Propusk2019!"
          # अनंत लूप: हर दस सेकंड में लॉग में एक पंक्ति छापता है। लॉग में जाता है पासवर्ड खुद नहीं,
          # बल्कि उसका sha256 फ़िंगरप्रिंट — पहले बारह अक्षर। फ़िंगरप्रिंट से यह
          # दिखता है कि पासवर्ड बदल गया, लेकिन उससे मूल मान वापस नहीं निकाला जा सकता।
          # असली सेवाओं में लॉग बिल्कुल इसी तरह लिखे जाते हैं।
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s %s से %s के रूप में कनेक्ट कर रहा हूँ, पासवर्ड फ़िंगरप्रिंट sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          # भूख बहुत छोटी है: यह एक प्रदर्शन है, कोई वर्कलोड नहीं।
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
