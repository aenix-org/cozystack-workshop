# लैब 8 · चरण 3 में से 2: पासवर्ड को Deployment से बाहर निकालकर एक अलग Secret ऑब्जेक्ट में रखा गया है।
# «भोली-भाली मरम्मत»: एप्लिकेशन के विवरण में अब पासवर्ड दिखाई नहीं देता, डेवलपर खुश है,
# लेकिन ऑडिटर नहीं। क्यों — यह हम एक ही कमांड से देखेंगे।
#
# यह चरण पहले से बेहतर कैसे है: मान अब एप्लिकेशन के विवरण का हिस्सा नहीं रहा,
# अब उसका संदर्भ नाम से दिया जाता है। यह तीसरे से बदतर इसलिए है कि मान को फिर भी
# कहीं न कहीं लिखना ही पड़ता है, और यहाँ वह ठीक इसी फ़ाइल में लिखा हुआ है।
#
#   secrets-demo-naive.yaml      पासवर्ड हर वह व्यक्ति देखता है जिसने फ़ाइल खोली
#   secrets-demo-secret.yaml  <- आप यहाँ हैं: पासवर्ड एक Secret ऑब्जेक्ट में है
#   secrets-demo.yaml            मैनिफ़ेस्ट में पासवर्ड बिल्कुल नहीं है
#
# कहाँ लागू होता है: आपका `lab` क्लस्टर (export KUBECONFIG=~/lab.kubeconfig)।
# कमांड: kubectl apply -f secrets-demo-secret.yaml
#
# इस फ़ाइल का पासवर्ड शैक्षिक और काल्पनिक है। फ़ाइल में `---` पंक्ति से अलग किए गए
# दो ऑब्जेक्ट हैं: Secret और उसका संदर्भ देने वाला Deployment। apiVersion, kind
# और metadata.name पर आगे फ़ाइल में टिप्पणी नहीं की गई है।
#
# Secret — एक अलग प्रकार का ऑब्जेक्ट है, उस चीज़ के लिए जो एप्लिकेशन के विवरण में नहीं होनी चाहिए।
# क्लस्टर इसके साथ सामान्य सेटिंग्स की तुलना में थोड़ा अधिक सावधानी से पेश आता है: मान
# kubectl describe में नहीं दिखाए जाते, और पढ़ने की अनुमतियाँ अलग से दी जाती हैं।
apiVersion: v1
kind: Secret
metadata:
  name: passes-db
# Opaque का अर्थ है «कुंजी-मान का एक मनमाना समूह»। विशेष प्रकार भी होते हैं —
# इमेज रजिस्ट्री तक पहुँच के लिए, TLS प्रमाणपत्रों के लिए, — लेकिन यहाँ कुछ भी
# विशेष की आवश्यकता नहीं है।
type: Opaque
data:
  # यह एन्क्रिप्शन नहीं है। यह base64 है — बाइट्स को प्रिंट होने योग्य वर्णों में लिखने का एक तरीका।
  # कोई कुंजी नहीं है, डिक्रिप्शन के लिए कोई पासवर्ड नहीं है, उलटा रूपांतरण कोई भी कर सकता है।
  password: UHJvcHVzazIwMTkh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # नीचे दिया गया Deployment वही है जो पहले चरण में था। ठीक एक ही
  # जगह बदली है: पॉड में DB_PASSWORD कैसे पहुँचता है।
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # root के रूप में नहीं, सिस्टम कॉल का एक सीमित समूह।
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # फिर से busybox और shell की कुछ पंक्तियाँ: हम पासवर्ड के रास्ते को देखते हैं,
          # एप्लिकेशन के काम को नहीं।
          image: busybox:1.36
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # पहले चरण से बस यही पूरा अंतर है। value के बजाय valueFrom का अर्थ है
            # «मान को वहाँ से लो»: secretKeyRef.name — कौन सा ऑब्जेक्ट, key — उसके भीतर
            # कौन सा फ़ील्ड। प्रतिस्थापन पॉड के शुरू होने पर होता है, एप्लिकेशन के
            # विवरण में केवल नाम रह जाता है।
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: passes-db
                  key: password
          # वही लूप जो पहले चरण में था: यह पासवर्ड का फ़िंगरप्रिंट छापता है, स्वयं पासवर्ड
          # नहीं। फ़िंगरप्रिंट ठीक चरणों की तुलना के लिए सुविधाजनक है — यदि वह नहीं
          # बदला, तो पॉड में वही मान पहुँचा है जो पहले था।
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
