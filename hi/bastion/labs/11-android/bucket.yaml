---
# लैब 11. बनाई गई APK के लिए बकेट।
#
# बकेट ऑब्जेक्ट स्टोरेज में एक नामित क्षेत्र है: फ़ाइलों को पूरी तरह से,
# HTTP के ज़रिए रखा और लिया जाता है, और कहीं माउंट नहीं किया जाता। अंदर कोई डायरेक्टरी नहीं होती, ऑब्जेक्ट के नाम में स्लैश केवल
# इंटरफ़ेस में ही एक ट्री की तरह दिखाया जाता है।
#
# यह एक टेनेंट ऑब्जेक्ट है: यह `lab` क्लस्टर में नहीं, बल्कि प्रबंधन क्लस्टर पर आपके namespace
# में रहता है। इसीलिए यहाँ kubeconfig टेनेंट वाला होना चाहिए,
# न कि वह जिससे आप `lab` क्लस्टर के साथ काम करते हैं। यह जानबूझकर ऐसा है: बिल्ड आर्टिफ़ैक्ट्स
# को उस क्लस्टर से अधिक समय तक जीवित रहना चाहिए जिसमें उन्हें बनाया गया था।
#
# लागू करने से पहले, tenant-workshopXX को अपने namespace से बदलें, अन्यथा ऑर्डर
# आपके टेनेंट में नहीं जाएगा और सबसे अधिक संभावना है कि अनुमति जाँच में पास नहीं होगा।
#
#     export KUBECONFIG=~/.kube/config
#     kubectl apply -f bucket.yaml
#
# यही काम टेनेंट डैशबोर्ड में माउस से किया जा सकता है (Create application -> Bucket)।
# परिणाम एक जैसा होता है; अंतर यह है कि टेक्स्ट को रिव्यू करके Git में रखा जा सकता है।
#
# लागू करने के बाद क्या होगा: प्लेटफ़ॉर्म कुछ ही सेकंड में बकेट को खड़ा कर देगा
# और एक्सेस कीज़ जारी करेगा, उन्हें उसी namespace में bucket-builds-ci-credentials सीक्रेट में
# रख देगा। वहाँ से चार मान (endpoint, bucketName, accessKey, secretKey)
# को `lab` क्लस्टर में हाथ से स्थानांतरित किया जाता है — क्लस्टर अलग हैं, अपने आप कुछ नहीं जाता।
apiVersion: apps.cozystack.io/v1alpha1
kind: Bucket
metadata:
  # Cozystack ऑब्जेक्ट का नाम, और केवल वही। स्टोरेज में बकेट का असली नाम प्लेटफ़ॉर्म
  # खुद जारी करता है — लंबा, bucket-a9209f83-... जैसा। यह जारी किए गए सीक्रेट के bucketName
  # फ़ील्ड में आएगा, और बिल्ड में ठीक वही डालना होगा, न कि `builds`।
  name: builds
  namespace: tenant-workshopXX
spec:
  users:
    # इस मैप की हर की एक अलग S3 यूज़र है जिसके पास अपनी की-पेयर होती है।
    # खाली ऑब्जेक्ट का अर्थ है «पढ़ने और लिखने का पूरा एक्सेस»।
    # इस तरह आप बिल्डर को लिखने का एक्सेस दे सकते हैं, और मोबाइल टीम को — केवल पढ़ने का:
    #   ci: {}
    #   mobile:
    #     readonly: true
    ci: {}
