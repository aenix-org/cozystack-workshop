---
# लैब 11. मोबाइल ऐप «गेस्ट पास» के सोर्स — वह जो बिल्ड को इनपुट के रूप में दिया जाता है।
#
# यह आपके प्रशिक्षण क्लस्टर `lab` पर लागू होता है, प्रबंधन क्लस्टर के टेनेंट पर नहीं:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f propusk-src.yaml
# यहाँ tenant-workshopXX जैसे प्लेसहोल्डर नहीं हैं — अपना नंबर कहीं भी डालने की ज़रूरत नहीं।
# Namespace भी निर्दिष्ट नहीं है: ऑब्जेक्ट उसी में जाएगा जो आपके kubeconfig में लिखा है।
#
# ऐप जानबूझकर बहुत छोटा है: एक activity, स्क्रीन पर एक ही पंक्ति का टेक्स्ट।
# लैब का मतलब Android नहीं है, बल्कि यह है कि बिल्ड क्लस्टर में जाता है।
#
# ये फ़ाइलें क्या हैं, अगर आपने कभी मोबाइल ऐप नहीं बनाई।
# Android प्रोजेक्ट कोड वाली एक फ़ाइल नहीं है, बल्कि तीन प्रकार की फ़ाइलों का पेड़ है:
#   *.gradle.kts  बिल्ड का विवरण: लाइब्रेरी कहाँ से लेनी हैं, किससे कंपाइल करना है, किन
#                 Android संस्करणों के लिए बनाना है। भूमिका के हिसाब से यह makefile है, बस Kotlin भाषा में;
#   *.kt          असल में ऐप का कोड;
#   *.xml         संसाधन: टेक्स्ट और यह विवरण कि आइकन पर टैप करने पर कौन-सी स्क्रीन खोलनी है।
# Gradle बिल्डर इस पेड़ को पढ़ता है और APK देता है — फ़ोन के लिए एक इंस्टॉलर फ़ाइल,
# भूमिका के हिसाब से Windows के .msi जैसी। खुद Android SDK इंस्टॉल करके हाथ से बनाने की ज़रूरत
# नहीं: यह काम android-build.yaml का Job करेगा, और यहाँ केवल उसका इनपुट पड़ा है।
#
# सोर्स इमेज में नहीं, बल्कि ConfigMap में पड़े हैं, ठीक उसी कारण से जिस
# कारण से पहले ऐप वाली लैब में nginx का पेज ConfigMap में पड़ा था:
# ताकि कुछ भी दोबारा बनाए बिना उन्हें बदला जा सके। ConfigMap एक क्लस्टर ऑब्जेक्ट है, जिसके अंदर
# टेक्स्ट फ़ाइलें पड़ी होती हैं; कंटेनर शुरू होने पर क्लस्टर उन्हें
# उसके अंदर डिस्क पर सामान्य फ़ाइलों की तरह रख देता है।
#
# `data` के अंदर की कुंजियाँ फ़ाइलों के नाम हैं, और `|` के बाद इंडेंट से नीचे जो कुछ भी है, वह
# फ़ाइल की शब्दशः सामग्री है, YAML नहीं। ऐसे ब्लॉक के अंदर रखी गई टिप्पणी खुद
# फ़ाइल की एक पंक्ति बन जाती, इसलिए नीचे के सभी स्पष्टीकरण बाहर,
# कुंजी से पहले खड़े हैं।
#
# छह कुंजियों का सपाट नक्शा यहाँ नहीं, बल्कि माउंट के समय डायरेक्टरी के पेड़ में
# खुलता है: «कुंजी -> पथ» का मेल android-build.yaml में, volumes.items ब्लॉक में
# दिया गया है। ConfigMap कुंजी में स्लैश नहीं हो सकता — इसलिए सपाट नाम
# app-build.gradle.kts, जो प्रोजेक्ट में app/build.gradle.kts बन जाएगा।
apiVersion: v1
kind: ConfigMap
metadata:
  name: propusk-src
data:
  # प्रोजेक्ट की शीर्ष फ़ाइल: बताती है कि Gradle प्लगइन और लाइब्रेरी कहाँ से खींचता है और कौन-से
  # मॉड्यूल प्रोजेक्ट का हिस्सा हैं (यहाँ एक ही है — app)। तीनों रिपॉज़िटरी सार्वजनिक हैं, इंटरनेट पर:
  # बिल्ड कंटेनर खाली शुरू होता है और वहाँ से सब कुछ खींचता है, इसीलिए बिल्ड में समय लगता है।
  # यही वह पहली जगह है जिसे आप तब संपादित करेंगे जब सूचना सुरक्षा बाहरी पहुँच बंद कर देगी — यहाँ
  # एक आंतरिक प्रॉक्सी-रिपॉज़िटरी लिखी जाएगी, ठीक वैसे ही जैसे Docker Hub को Harbor से बदला गया था।
  settings.gradle.kts: |
    pluginManagement {
      repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
      }
    }
    dependencyResolutionManagement {
      repositories {
        google()
        mavenCentral()
      }
    }
    rootProject.name = "propusk"
    include(":app")

  # मूल बिल्ड फ़ाइल: दो प्लगइनों के संस्करण तय करती है — Android बिल्डर और Kotlin
  # कंपाइलर। `apply false` का अर्थ है «संस्करण घोषित करो, पर मूल प्रोजेक्ट में इसे चालू मत करो»:
  # इन्हें app मॉड्यूल चालू करेगा। संस्करण जानबूझकर कीलों से जड़े गए हैं। जो बिल्ड
  # «नवीनतम» खींचती है, वह एक महीने में आज से अलग बनती है, और इसे सुलझाना आपको ही पड़ेगा।
  build.gradle.kts: |
    plugins {
      id("com.android.application") version "8.5.2" apply false
      id("org.jetbrains.kotlin.android") version "1.9.24" apply false
    }

  # खुद ऐप मॉड्यूल का विवरण। यहाँ तीन संख्याएँ हैं जिन पर यह भी निर्भर करता है कि बिल्ड क्या
  # डाउनलोड करेगी, और यह भी कि ऐप कहाँ चलेगा:
  #   compileSdk 34   Android SDK का संस्करण जिससे हम कंपाइल करते हैं। इसी को SDK इंस्टॉल चरण
  #                   डाउनलोड करता है — करीब डेढ़ गीगाबाइट, बिल्ड का सबसे लंबा चरण;
  #   minSdk 24       सबसे पुराना Android जिस पर ऐप चलेगा (यह Android 7 है)।
  #                   बढ़ाओगे — पुराने फ़ोन कट जाएँगे, घटाओगे — संगतता
  #                   लाइब्रेरी घसीटनी पड़ेंगी;
  #   jvmTarget 17    Kotlin, Java बाइटकोड में कंपाइल होता है, और यह संख्या बिल्ड इमेज में
  #                   JDK के संस्करण से मेल खानी चाहिए (android-build.yaml में gradle:8.9-jdk17)।
  #                   अगर ये अलग हो गईं, तो बिल्ड बाइटकोड संस्करण के बेमेल पर गिर जाएगी।
  app-build.gradle.kts: |
    plugins {
      id("com.android.application")
      id("org.jetbrains.kotlin.android")
    }

    android {
      namespace = "io.aenix.propusk"
      compileSdk = 34

      defaultConfig {
        applicationId = "io.aenix.propusk"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
      }

      compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
      }

      kotlinOptions {
        jvmTarget = "17"
      }

      sourceSets {
        getByName("main") {
          java.srcDirs("src/main/kotlin")
        }
      }
    }

  # फ़ोन के लिए ऐप का पासपोर्ट: उसमें कौन-सी स्क्रीनें हैं और आइकन पर टैप करने पर
  # उनमें से कौन-सी खुलती है। ठीक यही काम MAIN और LAUNCHER वाला intent-filter ब्लॉक करता है —
  # उसके बिना ऐप इंस्टॉल तो हो जाएगा, पर मेन्यू में कोई आइकन नहीं आएगा।
  AndroidManifest.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <manifest xmlns:android="http://schemas.android.com/apk/res/android">
      <application android:label="@string/app_name">
        <activity
            android:name=".MainActivity"
            android:exported="true">
          <intent-filter>
            <action android:name="android.intent.action.MAIN" />
            <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
        </activity>
      </application>
    </manifest>

  # ऐप की एकमात्र स्क्रीन — और प्रोजेक्ट में मौजूद पूरा कोड।
  # नंगा android.app.Activity लिया गया है, संगतता लाइब्रेरी नहीं: प्रोजेक्ट में शून्य बाहरी
  # निर्भरताएँ हैं, और इससे हर बिल्ड पर डाउनलोड के कुछ मिनट बचते हैं।
  # R.string.greeting — strings.xml के टेक्स्ट का संदर्भ। R क्लास सोर्स में नहीं होता, उसे
  # बिल्ड जनरेट करती है। इसलिए «unresolved reference: R» गलती का मतलब संसाधन जनरेशन चरण का
  # गिरना है, कोड में टाइपो नहीं।
  MainActivity.kt: |
    package io.aenix.propusk

    import android.app.Activity
    import android.os.Bundle
    import android.widget.TextView

    class MainActivity : Activity() {
      override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val view = TextView(this)
        view.textSize = 22f
        view.setPadding(48, 96, 48, 48)
        view.text = getString(R.string.greeting)
        setContentView(view)
      }
    }

  # कोड से बाहर निकाले गए टेक्स्ट: इस तरह प्रोग्रामर को छुए बिना उन्हें संपादित और अनुवादित किया जाता है।
  # app_name फ़ोन पर आइकन के नीचे दिखता है, greeting — खुद स्क्रीन पर।
  strings.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <resources>
      <string name="app_name">गेस्ट पास</string>
      <string name="greeting">अतिथि के लिए पास का अनुरोध करें</string>
    </resources>
