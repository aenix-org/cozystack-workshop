---
# लैब 11. स्वयं बिल्ड: ConfigMap में एक स्क्रिप्ट और एक Job जो उसे चलाता है।
# एक ही फ़ाइल में दो ऑब्जेक्ट, `---` लाइन से अलग किए गए।
#
# आपके `lab` ट्रेनिंग क्लस्टर पर लागू होता है, न कि मैनेजमेंट क्लस्टर के टेनेंट पर:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f android-build.yaml
# यहाँ tenant-workshopXX जैसे कोई प्लेसहोल्डर नहीं हैं — अपना नंबर कहीं भी डालने की ज़रूरत नहीं है।
#
# लागू करने से पहले क्लस्टर में दो ऑब्जेक्ट पहले से मौजूद होने चाहिए, वरना बिल्ड पॉड शुरू नहीं होगा:
# क्लस्टर उसे माउंट नहीं करता जो मौजूद नहीं है, और पॉड इंतज़ार करता रहता है।
#     configmap/propusk-src   सोर्स: kubectl apply -f propusk-src.yaml
#     secret/bucket-creds     बकेट तक पहुँच की चार कुंजियाँ, हाथ से भरी जाती हैं
#
# Job, न कि Deployment: बिल्ड का एक अंत होता है। Deployment एक समाप्त हुई प्रक्रिया को
# विफलता मानता है और एक नई कॉपी उठा देता है — बिल्ड चक्र में घूमता रहेगा और कभी नहीं रुकेगा।
#
# बिल्ड स्क्रिप्ट एक अलग ऑब्जेक्ट के रूप में क्यों रहती है, न कि Job के अपने command फ़ील्ड में एक स्ट्रिंग के रूप में:
#   - YAML फ़ील्ड के भीतर साठ लाइनों की shell को न पढ़ा जा सकता है न जाँचा जा सकता है: यहाँ यह
#     एक सामान्य फ़ाइल है जिसे एडिटर हाइलाइट करता है और जो `bash -n` को स्वीकार करती है;
#   - इसे एक ही कमांड से पूरा देखा जा सकता है: kubectl get configmap android-build-script -o yaml;
#   - आप कार्य के विवरण को छुए बिना बिल्ड को ठीक कर सकते हैं, और इसके विपरीत भी।
# सुविधा की कीमत: स्क्रिप्ट Job से अलग रहती है। ConfigMap बदलें तो पहले से चल रहा
# बिल्ड इसे नहीं देखेगा — नया टेक्स्ट केवल अगला रन ही देखेगा।
apiVersion: v1
kind: ConfigMap
metadata:
  name: android-build-script
data:
  # बिल्ड के पाँच चरण — ठीक वही कमांड जो आप बिल्ड सर्वर पर हाथ से टाइप करते।
  # कंटेनर लगभग खाली शुरू होता है: Java और Gradle इमेज से आते हैं, बाकी स्क्रिप्ट
  # अपने साथ लाती है।
  #   1/5  command-line tools डाउनलोड करता है — वे उपयोगिताएँ जो स्वयं Android SDK इंस्टॉल करती हैं (1-2 मिनट)
  #   2/5  लाइसेंस स्वीकार करता है और SDK, प्लेटफ़ॉर्म 34 और build-tools इंस्टॉल करता है। सबसे लंबा चरण,
  #        5-15 मिनट, और इस पूरे समय लॉग में सन्नाटा रहता है: sdkmanager नॉन-इंटरैक्टिव मोड में
  #        कोई प्रगति नहीं छापता। यहाँ का सन्नाटा हैंग होना नहीं है
  #   3/5  gradle :app:assembleDebug — /src के सोर्स को APK में कंपाइल करता है (3-8 मिनट)
  #   4/5  mc इंस्टॉल करता है, ऑब्जेक्ट स्टोर का कंसोल क्लाइंट
  #   5/5  APK को बकेट में दो नामों से रखता है: एक तारीख़ वाला और propusk-latest (सेकंड)
  #
  # हर बिल्ड समान रूप से लंबा होता है: कोई कैश नहीं, /work डिस्क डिस्पोज़ेबल है (फ़ाइल के अंत में
  # emptyDir देखें)। एक असली बिल्ड सर्वर पर इसकी जगह एक स्थायी वॉल्यूम होता, और दूसरा
  # बिल्ड मिनटों में पूरा हो जाता।
  #
  # नीचे build.sh फ़ाइल की शब्दशः सामग्री है, YAML नहीं। इसके भीतर हैश से शुरू होने वाली लाइनें
  # स्क्रिप्ट में जैसी हैं वैसी ही जाती हैं: ये shell कमेंट हैं, और इन्हें हटाने की ज़रूरत नहीं।
  build.sh: |
    #!/usr/bin/env bash
    # यहाँ set -e उपयुक्त है: यह कोई जाँच नहीं, बल्कि एक बिल्ड है। अगर कोई चरण विफल हो —
    # आगे बढ़ना निरर्थक है, Job को त्रुटि के साथ समाप्त होना चाहिए और अपने लॉग के साथ
    # क्लस्टर में बना रहना चाहिए।
    set -euo pipefail

    WORK=/work
    export HOME="$WORK"
    export ANDROID_SDK_ROOT="$WORK/android-sdk"
    export ANDROID_HOME="$ANDROID_SDK_ROOT"
    export GRADLE_USER_HOME="$WORK/gradle-home"
    # डिस्पोज़ेबल कंटेनर में Gradle डेमन की ज़रूरत नहीं: यह अगले बिल्ड की ख़ातिर जीता है,
    # और इस कंटेनर में अगला बिल्ड होगा ही नहीं।
    # -Duser.home अनिवार्य है, और यह ऊपर के export HOME की डुप्लिकेट नहीं है। Java होम
    # डायरेक्टरी को एनवायरनमेंट वेरिएबल से नहीं, बल्कि सिस्टम यूज़र रिकॉर्ड से लेता है, और एक
    # अप्रिविलेज्ड uid के पास वह नहीं होती — Gradle "?" डाल देता है और APK पैकेजिंग पर विफल
    # हो जाता है: वह साइनिंग कुंजी को /work/project/app/?/.android/ जैसे पथ पर ढूँढता है।
    export GRADLE_OPTS="-Xmx3g -Dorg.gradle.daemon=false -Duser.home=$WORK"

    CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
    MC_URL="https://dl.min.io/client/mc/release/linux-amd64/mc"

    echo "== 1/5 Android command-line tools इंस्टॉल कर रहा हूँ =="
    mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    cd "$ANDROID_SDK_ROOT/cmdline-tools"
    curl -fsSL -o tools.zip "$CMDLINE_TOOLS_URL"
    # unzip हर बेस इमेज में नहीं होता, और JDK का jar zip को अनपैक कर सकता है।
    unzip -q tools.zip 2>/dev/null || jar xf tools.zip
    rm -f tools.zip
    mv cmdline-tools latest
    export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

    echo "== 2/5 लाइसेंस स्वीकार कर रहा हूँ और SDK डाउनलोड कर रहा हूँ (सबसे लंबा चरण) =="
    # `yes` को SIGPIPE मिलता है जब sdkmanager अपना इनपुट बंद करता है, और यह
    # एक नॉन-ज़ीरो कोड लौटाता है। set -o pipefail के साथ यह बिल्ड को बेवजह विफल कर देता,
    # इसलिए रिटर्न कोड को जानबूझकर दबाया गया है। अगर लाइसेंस वास्तव में
    # स्वीकार नहीं हुए — तो अगली कमांड यह बता देगी।
    yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
    sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
      "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    echo "== 3/5 APK बना रहा हूँ =="
    # ConfigMap केवल-पढ़ने के लिए माउंट होता है, और Gradle सोर्स के बगल में लिखता है,
    # इसलिए ट्री को पहले डिस्क पर कॉपी किया जाता है।
    # -L सिंबॉलिक लिंक को डिरेफ़रेंस करता है: ConfigMap फ़ाइलों के रूप में नहीं, बल्कि
    # आंतरिक ..data डायरेक्टरी के लिंक के रूप में माउंट होता है, और -L के बिना ये लिंक प्रोजेक्ट में चले जाते।
    # /src/. के बजाय एक ग्लोब — ताकि यह आंतरिक डायरेक्टरी स्वयं कॉपी न हो।
    mkdir -p "$WORK/project"
    cp -rL /src/* "$WORK/project/"
    cd "$WORK/project"
    gradle --no-daemon :app:assembleDebug

    APK="$WORK/project/app/build/outputs/apk/debug/app-debug.apk"
    ls -l "$APK"

    echo "== 4/5 S3 क्लाइंट इंस्टॉल कर रहा हूँ =="
    # हम क्लाइंट को वर्किंग फ़ोल्डर में रखते हैं, /usr/local/bin में नहीं। पॉड एक
    # अप्रिविलेज्ड यूज़र के रूप में चलता है, और इमेज के सिस्टम फ़ोल्डर root के होते हैं:
    # वहाँ लिखना Permission denied में समाप्त होगा — और ठीक यहीं, चौथे चरण पर,
    # यानी आधे घंटे की बिल्ड के बाद। /work फ़ोल्डर हमारा है, उसमें लिखा जा सकता है।
    mkdir -p "$WORK/bin"
    curl -fsSL -o "$WORK/bin/mc" "$MC_URL"
    chmod +x "$WORK/bin/mc"
    # PATH उन फ़ोल्डरों की सूची है जहाँ shell कमांड ढूँढता है। हम अपना जोड़ते हैं ताकि आगे
    # पूरे पथ के बजाय बस `mc` लिखा जा सके।
    export PATH="$WORK/bin:$PATH"

    echo "== 5/5 APK को bucket में अपलोड कर रहा हूँ =="
    # वेरिएबल accessKey/secretKey/endpoint/bucketName Secret से envFrom के ज़रिए
    # आते हैं। हम alias set का आउटपुट दबाते हैं: उसे लॉग में कुछ छापने की ज़रूरत नहीं।
    # इसी कारण स्क्रिप्ट में set -x नहीं है — वह कुंजियाँ छाप देता।
    # एलियास का नाम builds है, lab नहीं: सभी लैब में `lab` शब्द ट्रेनिंग क्लस्टर के लिए
    # इस्तेमाल होता है, और एक को दूसरे से भ्रमित नहीं करना चाहिए।
    mc alias set builds "https://${endpoint}" "${accessKey}" "${secretKey}" >/dev/null
    STAMP="$(date -u +%Y%m%d-%H%M%S)"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-${STAMP}.apk"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-latest.apk"
    # एक मार्कर लाइन: इससे check.sh "Job चला" को "APK पहुँचा" से अलग पहचानता है।
    echo "APK-UPLOADED ${bucketName}/propusk/propusk-${STAMP}.apk"
    mc ls --recursive "builds/${bucketName}/propusk/"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: propusk-build
spec:
  # बिल्ड विफल होने पर पॉड को कितनी बार दोबारा बनाना है। शून्य अधिक ईमानदार होता,
  # लेकिन SDK डाउनलोड करते समय नेटवर्क कभी-कभी झपकता है, और दूसरा प्रयास इस
  # स्पष्टीकरण से सस्ता है कि "मेरा क्यों विफल हुआ"।
  backoffLimit: 1
  # पूरे बिल्ड पर एक सीमा। इसके बिना एक हैंग हुआ बिल्ड नोड को शाम तक रोके रखता।
  # गिनती Job के निर्माण से शुरू होती है, कंटेनर शुरू होने से नहीं: Pending में बिताया समय और
  # लैब में थोड़ा आगे नोड का पुनर्निर्माण भी इसे खर्च करते हैं। एक घंटा काफ़ी नहीं था —
  # बिल्ड DeadlineExceeded के साथ ठीक तब मर जाता था जब कोई व्यक्ति उसका इंतज़ार कर चुका होता।
  activeDeadlineSeconds: 7200
  # पॉड टेम्पलेट: इससे Job वह पॉड ढालता है जिसमें बिल्ड चलेगा। पॉड का अपना कोई नाम
  # नहीं होता — Job अपने नाम में एक यादृच्छिक पूँछ जोड़ता है, इसलिए पॉड को नाम से नहीं,
  # बल्कि job-name लेबल से ढूँढना पड़ता है।
  template:
    spec:
      # बिल्ड इंटरनेट से किसी और का कोड खींचता है और उसे तुरंत चलाता है। इसके लिए इसे root
      # अधिकारों की ज़रूरत नहीं: यह केवल /work में लिखता है — जिसमें S3 क्लाइंट भी शामिल है, जिसे यह
      # वहीं डाउनलोड करता है, क्योंकि एक अप्रिविलेज्ड यूज़र को इमेज के सिस्टम फ़ोल्डरों में लिखने
      # की अनुमति नहीं दी जाएगी। वही तीन फ़ील्ड पहली लैब के एप्लिकेशन पर थे और उसी कारण से:
      # इनके बिना पॉड को उस क्लस्टर में प्रवेश नहीं मिलेगा जहाँ
      # `restricted` सुरक्षा प्रोफ़ाइल सक्षम है।
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # Job के लिए यह एक अनिवार्य फ़ील्ड है। Never का अर्थ है: विफल हुए पॉड को उसी जगह
      # पुनरारंभ न करें, बल्कि निर्णय Job को सौंप दें — वह एक नया बनाएगा।
      restartPolicy: Never
      containers:
        - name: build
          # कंटेनर स्तर पर वही सख़्ती: अपने अधिकार बढ़ाना निषिद्ध है,
          # linux क्षमताएँ एक-एक करके सारी छीन ली गई हैं।
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Gradle और JDK 17 के साथ एक तैयार इमेज। JDK संस्करण मनमाने ढंग से नहीं चुना गया: इसे
          # app-build.gradle.kts में jvmTarget = "17" से मेल खाना ही चाहिए, वरना बिल्ड
          # बाइटकोड-संस्करण के बेमेल पर विफल हो जाएगा। इमेज में Android SDK नहीं है — इसे
          # स्क्रिप्ट का पहला चरण डाउनलोड करता है, क्योंकि SDK अंदर वाली इमेज दसियों
          # गीगाबाइट की होती हैं और स्वयं SDK से अधिक समय में खिंचतीं।
          image: gradle:8.9-jdk17
          # हम वह नहीं चलाते जो इमेज डिफ़ॉल्ट रूप से करती है, बल्कि /scripts में माउंट किए गए
          # ConfigMap से अपनी स्क्रिप्ट चलाते हैं।
          command: ["bash", "/scripts/build.sh"]
          envFrom:
            # सीक्रेट की चारों कुंजियाँ उन्हीं नामों के साथ एनवायरनमेंट वेरिएबल बन जाती हैं:
            # accessKey, secretKey, endpoint, bucketName।
            - secretRef:
                name: bucket-creds
          # Android बिल्ड की ईमानदार लागत, अनुभव से निकाली गई। requests — कितना
          # आरक्षित करना है: शेड्यूलर नोड को इसी संख्या से चुनता है, वास्तविक
          # खपत से नहीं। चार गीगाबाइट से कम में Kotlin कंपाइलर जीवित नहीं रहता।
          # limits — सीमा: CPU पर, इससे टकराने पर थ्रॉटल होता है; मेमोरी पर,
          # कंटेनर मार दिया जाता है (OOMKilled)। तुलना के लिए, पहली लैब के एप्लिकेशन को
          # 20m CPU और 32Mi मेमोरी में गुज़ारा हो जाता था। इन्हीं संख्याओं की वजह से ट्रेनिंग
          # क्लस्टर के नोड को बड़ा करना पड़ेगा: लैब 0 में ऑर्डर किए गए नोड में बिल्ड नहीं समाता।
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 6Gi
          # तीन वॉल्यूम। सोर्स और स्क्रिप्ट — केवल-पढ़ने के लिए: ConfigMap वैसे भी
          # read-only माउंट होता है, लेकिन स्पष्ट readOnly तुरंत बता देता है कि बिल्ड वहाँ नहीं लिखता।
          # यह /work में लिखता है, और यही एकमात्र जगह है जहाँ इसे अनुमति है।
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: src
          configMap:
            name: propusk-src
            # ConfigMap कुंजी में स्लैश नहीं हो सकता, लेकिन माउंट के समय पथ में —
            # हो सकता है। इस तरह एक सपाट मैप उस डायरेक्टरी ट्री में खुलता है
            # जिसकी Gradle अपेक्षा करता है।
            items:
              - key: settings.gradle.kts
                path: settings.gradle.kts
              - key: build.gradle.kts
                path: build.gradle.kts
              - key: app-build.gradle.kts
                path: app/build.gradle.kts
              - key: AndroidManifest.xml
                path: app/src/main/AndroidManifest.xml
              - key: MainActivity.kt
                path: app/src/main/kotlin/io/aenix/propusk/MainActivity.kt
              - key: strings.xml
                path: app/src/main/res/values/strings.xml
        - name: scripts
          configMap:
            name: android-build-script
            # वॉल्यूम की फ़ाइलों पर अनुमतियाँ: पढ़ना और निष्पादित करना। स्क्रिप्ट को
            # `bash /scripts/build.sh` के रूप में बुलाया जाता है, इसलिए यहाँ निष्पादन बिट एक सुरक्षा है — यह
            # उसके काम आएगा जो कभी फ़ाइल को सीधे चलाएगा।
            defaultMode: 0755
        - name: work
          # नोड पर एक अस्थायी डिस्क, ठीक उतनी ही देर जीती है जितना पॉड।
          # यहाँ SDK, Gradle की निर्भरताएँ और बिल्ड का परिणाम रखा जाएगा।
          emptyDir:
            # बारह गीगाबाइट गुंजाइश के साथ: SDK, Gradle कैश और बिल्ड का परिणाम मिलाकर
            # छह-से-आठ हैं। सीमा इसलिए ज़रूरी है ताकि बेकाबू बिल्ड नोड की डिस्क को पूरी
            # तरह न खा जाए और अपने साथ पड़ोसी पॉड को भी न घसीट ले।
            sizeLimit: 12Gi
