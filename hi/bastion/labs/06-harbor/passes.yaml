---
# लैब 6 · आपकी अपनी निजी इमेज रजिस्ट्री। मैनिफ़ेस्ट का काम करने वाला (WORKING) संस्करण।
#
# यह वही फ़ाइल है जो passes-broken.yaml है, साथ में वह एक जगह जो वहाँ नहीं थी —
# इसे नीचे «यही चीज़ नहीं थी» शब्दों से चिह्नित किया गया है। इसे तब लागू करें जब आप
# सूटे हुए संस्करण पर विफलता देख चुके हों और समझ चुके हों कि यह क्यों हुई।
#
# आपके `lab` क्लस्टर पर लागू होता है (Cozystack प्रबंधन क्लस्टर पर नहीं — वहाँ
# केवल Harbor स्वयं रहता है), डिफ़ॉल्ट नेमस्पेस में:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl delete -f passes-broken.yaml
#     kubectl apply -f passes.yaml
#
# ध्यान दें: HARBOR-HOST एक प्लेसहोल्डर है, कोई काम करने वाला पता नहीं। लागू करने से पहले अपने
# Harbor का पता डालें; फ़ाइल में HARBOR-HOST स्ट्रिंग दो बार आती है, sed दोनों को बदल देगा:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # macOS
#
# नीचे दिए गए ऑब्जेक्ट्स में: apiVersion — विवरण स्कीमा का संस्करण, kind — हम क्या बना रहे हैं,
# metadata.name — ऑब्जेक्ट का नाम। इन्हें आगे अलग से नहीं समझाया गया है।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # दो प्रतियाँ, एक नहीं: इस तरह सेवा के उत्तर में दिखेगा कि अनुरोधों को
  # अलग-अलग पॉड्स संभाल रहे हैं, और कि इमेज नोड पर एक बार डाउनलोड हुई पर दो बार चली।
  replicas: 2
  # शर्त «मेरी प्रतियाँ — वे पॉड्स हैं जिनका लेबल app: passes-api है»। नीचे पॉड टेम्पलेट में लेबल
  # इससे मेल खाना चाहिए, वरना क्लस्टर मैनिफ़ेस्ट को अस्वीकार कर देगा।
  selector:
    matchLabels:
      app: passes-api
  # वह टेम्पलेट जिससे प्रतियाँ ठप्पे की तरह बनती हैं। इसके अंदर की हर चीज़ एक पॉड का वर्णन करती है।
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # पूरे पॉड पर सुरक्षा प्रतिबंध: root के रूप में न चलाएँ, अनविशेषाधिकृत
      # उपयोगकर्ता 10001 के रूप में काम करें, सिस्टम कॉल के समूह को मानक प्रोफ़ाइल तक
      # सीमित करें। इमेज इसी के अनुरूप बनाई गई है (देखें app/Dockerfile, USER पंक्ति)।
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # passes-broken.yaml में «यही चीज़ नहीं थी» — ये दो पंक्तियाँ, और कुछ नहीं।
      #
      # निजी रजिस्ट्री इमेज किसी को भी नहीं देती: पहले अपना परिचय देना पड़ता है। सीक्रेट `harbor`
      # (प्रकार kubernetes.io/dockerconfigjson) रजिस्ट्री का पता, लॉगिन और पासवर्ड रखता है; आपने
      # इसे kubectl create secret docker-registry कमांड से बनाया था। यहाँ सीक्रेट को केवल
      # नाम से संदर्भित किया गया है — इसे वहाँ से एप्लिकेशन नहीं, बल्कि नोड पर kubelet उस
      # क्षण लेता है जब वह इमेज डाउनलोड करने जाता है। इसीलिए सीक्रेट उसी
      # नेमस्पेस में होना चाहिए जिसमें पॉड है: kubelet उसे ठीक वहीं ढूँढता है और कहीं नहीं।
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # कंटेनर स्तर के अधिकार: अतिरिक्त विशेषाधिकार न लें और सभी विशेष
          # कर्नेल क्षमताएँ छोड़ दें। एप्लिकेशन को एक नेटवर्क पोर्ट चाहिए, बाकी अनावश्यक है।
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # इमेज नाम का पहला भाग — रजिस्ट्री का पता, और ठीक इसीलिए अपनी रजिस्ट्री पर
          # जाने से मैनिफ़ेस्ट बदलते हैं: इमेज का नाम अलग हो जाता है। यदि पता शुरू में
          # न होता, तो क्लस्टर इमेज के लिए Docker Hub जाता, और सुरक्षा ने यही मना किया था।
          image: HARBOR-HOST/passes/passes-api:v1
          # एप्लिकेशन पोर्ट। नाम `http` आगे रेडीनेस जाँच और Service द्वारा उपयोग होता है,
          # इसलिए पोर्ट नंबर एक ही जगह तय है, तीन जगह नहीं।
          ports:
            - containerPort: 8080
              name: http
          # पर्यावरण चर, जिनसे एप्लिकेशन जानता है कि वह कौन है और कहाँ से आया।
          # वह उत्तर में ठीक इन्हीं को छापता है (देखें app/main.go, identity स्ट्रक्चर)।
          # APP_VERSION और IMAGE_REGISTRY पाठ के रूप में तय हैं — इन्हें हम खुद लिखते हैं।
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # आगे — Downward API: क्लस्टर स्वयं चरों में वह डालता है जो वह पॉड के बारे में जानता है।
            # एप्लिकेशन को न अपना नाम अनुमान लगाना पड़ता है, न उसके लिए क्लस्टर API जाना पड़ता है,
            # न ऐसे अनुरोध के अधिकार अपने साथ रखने पड़ते हैं। मान प्रति के
            # शुरू होने के क्षण में डाले जाते हैं, इसलिए हर प्रति के अपने होते हैं।
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — प्रति के लिए क्या आरक्षित करना है: इन्हीं संख्याओं से शेड्यूलर नोड चुनता है।
          # limits — छत: छत से ऊपर मेमोरी के लिए कंटेनर मार दिया जाता है, प्रोसेसर के
          # लिए धीमा किया जाता है। 16Mi इसलिए काफी है क्योंकि एप्लिकेशन Go में बिना
          # निर्भरताओं के है और मेमोरी में लगभग कुछ नहीं रखता; JVM को इससे दो कोटि
          # अधिक चाहिए होता। 20m — प्रोसेसर कोर का बीस हज़ारवाँ हिस्सा।
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # रेडीनेस जाँच: जब तक एप्लिकेशन /healthz पर उत्तर नहीं देता, Service इस
          # प्रति पर ट्रैफ़िक नहीं भेजेगा। नए संस्करण की रोलआउट के समय पुरानी प्रति
          # संतुलन से केवल तब हटती है जब नई ने उत्तर दे दिया हो, — इसलिए अनुरोध
          # अभी न उठे प्रोसेस पर विफल नहीं होते।
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# एक स्थायी नाम जिसके पीछे दोनों प्रतियाँ खड़ी हैं। पॉड्स फिर से बनते हैं और पते बदलते हैं,
# नाम passes-api.default.svc.cluster.local नहीं बदलता। इस ऑब्जेक्ट के बिना एप्लिकेशन
# काम करता है, पर क्लस्टर के भीतर उस तक पहुँचने का कोई ज़रिया नहीं — और check.sh में जाँच
# ठीक यहीं आती है, पॉड में नहीं।
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # पॉड्स से जुड़ाव — पतों की सूची नहीं, बल्कि लेबल द्वारा शर्त। लेबल
  # app: passes-api वाली नई प्रति स्वयं संतुलन के दायरे में आ जाती है, उसे पंजीकृत करना ज़रूरी नहीं।
  selector:
    app: passes-api
  # port — किस पोर्ट पर स्वयं Service उत्तर देता है; targetPort ऊपर ports ब्लॉक के नाम `http`
  # को संदर्भित करता है, नंबर को नहीं, इसलिए नंबर बदलने पर जुड़ाव नहीं टूटेगा।
  ports:
    - port: 80
      targetPort: http
