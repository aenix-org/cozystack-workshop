---
# लैब 6 · आपका अपना निजी इमेज रजिस्ट्री। यह फ़ाइल जानबूझकर अधूरी है।
#
# यह काम नहीं करेगी, और यह इरादतन है: आपको विफलता अपनी आँखों से देखनी चाहिए और
# खुद समझना चाहिए कि क्लस्टर के पास किस चीज़ की कमी थी। यहाँ केवल एक चीज़ की कमी है — वह
# जिससे क्लस्टर बंद रजिस्ट्री के सामने खुद को पहचानाता है जब वह इमेज लेने आता है। रजिस्ट्री
# किसी को भी इमेज नहीं सौंपती, और इस विवरण में ऐसा कुछ नहीं है जो क्लस्टर को अपना
# अधिकार साबित करने में मदद करे। कौन-सी सटीक लाइन इसे ठीक करती है — यह आप लैब के दौरान
# समझ लेंगे; काम करने वाला संस्करण इसके बगल में, passes.yaml में है, और उसे समझने से पहले
# खोलने का कोई मतलब नहीं है।
#
# यहाँ केवल एक Deployment है, कोई Service नहीं: सेवा के लिए स्थिर नाम अभी ज़रूरी नहीं —
# हम वैसे भी जवाब देने वाले पॉड तक नहीं पहुँचेंगे, क्योंकि इमेज डाउनलोड नहीं होगी।
#
# आपके `lab` क्लस्टर पर, डिफ़ॉल्ट नेमस्पेस में लागू किया जाता है:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f passes-broken.yaml
#     kubectl get pods -l app=passes-api -w
#
# ध्यान दें: HARBOR-HOST एक प्लेसहोल्डर है, कोई काम करने वाला पता नहीं। अपने Harbor का पता डालें,
# वरना आपको वह त्रुटि नहीं मिलेगी जिसके लिए यह फ़ाइल लिखी गई है (प्लेसहोल्डर वाली दो लाइनें हैं):
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # macOS
#
# नीचे दिए ऑब्जेक्ट में: apiVersion — विवरण स्कीमा का संस्करण, kind — हम क्या बना रहे हैं,
# metadata.name — ऑब्जेक्ट का नाम। आगे अलग से नहीं समझाए जाते।
#
# Deployment का मतलब «एक कंटेनर चलाओ» नहीं, बल्कि «इस कंटेनर की इतनी कॉपियाँ चलती रखो» है।
# कोई कॉपी गायब होगी — क्लस्टर बिना पूछे नई बना देगा।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # एक कॉपी: विफलता को समझने के लिए एक ही काफ़ी है, और लॉग में तथा
  # kubectl describe के आउटपुट में कम शोर होगा।
  replicas: 1
  # शर्त «मेरी कॉपियाँ वे पॉड हैं जिन पर लेबल app: passes-api है»। नीचे पॉड टेम्पलेट का लेबल
  # इससे मेल खाना चाहिए, वरना क्लस्टर मैनिफ़ेस्ट को अस्वीकार कर देगा।
  selector:
    matchLabels:
      app: passes-api
  # वह टेम्पलेट जिससे कॉपियाँ ढाली जाती हैं। इसके भीतर की हर चीज़ एक पॉड का वर्णन करती है।
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # पूरे पॉड पर सुरक्षा प्रतिबंध: root के रूप में न चलाएँ, अविशेषाधिकार-प्राप्त
      # उपयोगकर्ता 10001 के रूप में काम करें, सिस्टम कॉल के सेट को मानक प्रोफ़ाइल तक
      # सीमित करें। इमेज इसी के लिए बनाई गई है (देखें app/Dockerfile, USER लाइन)।
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # कंटेनर स्तर के अधिकार: खुद को अतिरिक्त विशेषाधिकार न दे और कर्नेल की सभी विशेष
          # क्षमताएँ छोड़ दे। एप्लिकेशन को एक ही नेटवर्क पोर्ट चाहिए, बाकी सब अनावश्यक है।
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # इमेज नाम का पहला भाग रजिस्ट्री का पता है। ठीक इसीलिए अपने खुद के रजिस्ट्री पर
          # जाने से मैनिफ़ेस्ट बदलते हैं: इमेज का नाम अलग हो जाता है। यदि पता न होता,
          # तो क्लस्टर इमेज के लिए Docker Hub जाता — यानी वहीं जहाँ सुरक्षा टीम ने मना किया।
          image: HARBOR-HOST/passes/passes-api:v1
          # एप्लिकेशन का पोर्ट। नाम `http` आगे रेडीनेस प्रोब द्वारा उपयोग किया जाता है,
          # इसलिए पोर्ट नंबर एक ही जगह सेट है, दो जगह नहीं।
          ports:
            - containerPort: 8080
              name: http
          # एनवायरनमेंट वेरिएबल्स, जिनसे एप्लिकेशन जानता है कि वह कौन है और कहाँ से आया।
          # वह जवाब में ठीक इन्हें ही छापता है (देखें app/main.go, identity स्ट्रक्ट)।
          # APP_VERSION और IMAGE_REGISTRY टेक्स्ट के रूप में सेट हैं — इन्हें हम खुद लिखते हैं; अगले तीन
          # क्लस्टर खुद कॉपी शुरू होने के समय भरता है, एप्लिकेशन को इन्हें जानने का कोई तरीका नहीं।
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — कॉपी के लिए क्या आरक्षित करना है: इन संख्याओं से शेड्यूलर नोड चुनता है।
          # limits — छत: छत से ऊपर मेमोरी के लिए कंटेनर मार दिया जाता है, प्रोसेसर के
          # लिए धीमा कर दिया जाता है। 16Mi इसलिए काफ़ी है क्योंकि एप्लिकेशन बिना निर्भरता
          # वाला Go में लिखा है। 20m यानी एक प्रोसेसर कोर का बीस हज़ारवाँ हिस्सा।
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # रेडीनेस प्रोब: जब तक एप्लिकेशन /healthz पर जवाब न दे, कॉपी पर ट्रैफ़िक नहीं
          # जाएगा। आज बात यहाँ तक नहीं पहुँचेगी — यह पहले से चल रही प्रक्रिया की जाँच करता
          # है, और हमारे यहाँ पहले वाला चरण, इमेज डाउनलोड, अटक जाएगा।
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
