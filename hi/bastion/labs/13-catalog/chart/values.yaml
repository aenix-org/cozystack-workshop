# लैब 13. «Passes» चार्ट के लिए डिफ़ॉल्ट मान।
#
# ये उन सवालों के जवाब हैं जो चार्ट डिप्लॉय के समय पूछता है: कितनी कॉपियाँ, पेज पर क्या
# टेक्स्ट, क्या बाहर से पता चाहिए। इन्हें यहाँ «कुछ नहीं चुना» वाली स्थिति के लिए लिखा
# गया है। जो एप्लिकेशन ऑर्डर करता है वह इन्हें ओवरराइड करता है: डैशबोर्ड में — फ़ॉर्म फ़ील्ड से,
# टर्मिनल में — `--set replicas=5` फ़्लैग से या अपनी फ़ाइल `helm install ... -f my.yaml` से।
# इस फ़ाइल को बदलने से भविष्य के ऑर्डर के डिफ़ॉल्ट बदलते हैं, पहले से डिप्लॉय किए गए के नहीं।
#
# यहाँ के मान डैशबोर्ड में ऑर्डर फ़ॉर्म में कैसे बदलते हैं:
#   प्रकार     — कौन-सा फ़ील्ड दिखाना है: {int} संख्या, {bool} टॉगल,
#                {string} इनपुट लाइन, {struct} फ़ील्ड्स का नेस्टेड समूह;
#   विवरण      — फ़ील्ड का लेबल और उसके नीचे दिखने वाला संकेत;
#   =मान       — फ़ॉर्म खुलने पर फ़ील्ड में पहले से क्या होता है;
#   अनिवार्यता  — स्कीमा में required सूची से तय होती है। यहाँ यह नहीं है: हर
#                पैरामीटर का एक डिफ़ॉल्ट मान है, इसलिए किसी भी फ़ील्ड को छोड़ा जा सकता है।
# इसीलिए विवरण अंग्रेज़ी में लिखे जाते हैं: इन्हें केवल चार्ट का लेखक ही नहीं, बल्कि हर वह
# व्यक्ति पढ़ता है जो डैशबोर्ड में एप्लिकेशन ऑर्डर करता है।

## `## @param` जैसे कमेंट सजावट नहीं हैं। इनसे Cozystack जनरेटर
## (cozyvalues-gen) values.schema.json और README में पैरामीटर तालिका बनाता है।
## प्रारूप: ## @param {प्रकार} नाम=डिफ़ॉल्ट-मान - विवरण।

# एप्लिकेशन की कितनी कॉपियाँ चालू रखनी हैं। एक कॉपी का मतलब है नोड के रीस्टार्ट के
# दौरान डाउनटाइम, दो में से किसी एक के खोने पर भी काम चलता रहता है।
## @param {int} replicas=2 - Number of application replicas.
replicas: 2

# मुख्य पेज पर टेक्स्ट। इसे पैरामीटर बनाया गया क्योंकि हर सहायक कंपनी का
# अपना टेक्स्ट होता है, और इसके लिए अलग इमेज कोई नहीं बनाएगा।
## @param {string} greeting=Order a pass for your guest - Text shown on the main page.
greeting: "Order a pass for your guest"

# क्या एप्लिकेशन को क्लस्टर के बाहर पता चाहिए। Cozystack कैटलॉग की परंपरा:
# external नाम वाला फ़ील्ड सभी एप्लिकेशन में एक ही चीज़ का मतलब रखता है — बाहरी पहुँच।
## @param {bool} external=false - Enable external access from outside the cluster.
external: false

# एक कॉपी का आकार। इसे अलग फ़ील्ड समूह के रूप में रखा गया ताकि ऑर्डर फ़ॉर्म में यह
# «संसाधन» के एक ब्लॉक जैसा दिखे, न कि दो असंबंधित फ़ील्ड जैसा।
## @typedef {struct} Resources - CPU and memory for each replica.
## @field {quantity} cpu - CPU available to each replica.
## @field {quantity} memory - Memory (RAM) available to each replica.

## @param {Resources} resources - Explicit CPU and memory configuration.
resources:
  cpu: 100m
  memory: 128Mi
