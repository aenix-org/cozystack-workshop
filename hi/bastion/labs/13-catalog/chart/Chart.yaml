# लैब 13. «पास» चार्ट का पासपोर्ट।
#
# चार्ट एक फ़ोल्डर है: templates/ में मैनिफ़ेस्ट टेम्पलेट, values.yaml में डिफ़ॉल्ट मान
# और values.schema.json में पैरामीटर स्कीमा। इसे लैब फ़ोल्डर से
# `helm install <रिलीज़-नाम> chart` कमांड द्वारा तैनात किया जाता है, और Cozystack कैटलॉग में — स्वयं
# प्लेटफ़ॉर्म द्वारा, जब कोई डैशबोर्ड के ज़रिए ऐप्लिकेशन ऑर्डर करता है।
#
# Chart.yaml पैकेज का कवर है: इसी से Helm समझता है कि पैकेज का नाम क्या है और उसका संस्करण कौन-सा है।
apiVersion: v2
name: guest-pass
description: Internal guest pass service — order a pass for a visitor
type: application

# आगे दो संस्करण आते हैं, और Helm में इन्हें बाकी सब चीज़ों से ज़्यादा उलझाया जाता है। ये अलग-अलग चीज़ें हैं।
#
# version — पैकेजिंग का संस्करण। यह तब बदलता है जब आप टेम्पलेट, मान या स्कीमा में बदलाव करते हैं,
# भले ही अंदर का ऐप्लिकेशन पहले जैसा ही रहे। ठीक इसी की Helm रिलीज़ अपग्रेड के समय तुलना करता है,
# और इसी से रिपॉज़िटरी में अपलोड किए गए पैकेज अलग पहचाने जाते हैं। इसे बढ़ाए बिना
# प्लेटफ़ॉर्म यह मान लेता है कि पैकेज नहीं बदला, और नया संस्करण नज़र से छूट सकता है।
version: 0.1.0
# appVersion — पैकेज के अंदर मौजूद ऐप्लिकेशन का अपना संस्करण, यहाँ यह nginx है। यह अपनी
# ज़िंदगी जीता है: ऐप्लिकेशन बिना टेम्पलेट में एक भी बदलाव किए दस बार अपडेट हो सकता है, और इसके उलट —
# आपने टेम्पलेट फिर से लिखे, पर ऐप्लिकेशन वही है। यह ऑब्जेक्ट के नामों में नहीं आता, यह
# `helm list` के आउटपुट में और कैटलॉग कार्ड में दिखता है।
appVersion: "1.0"
