# लैब 13. Deployment टेम्प्लेट: क्या चलाना है और कितनी प्रतियों में।
#
# templates/ में मौजूद फ़ाइलें ब्लूप्रिंट हैं, तैयार मैनिफ़ेस्ट नहीं। Helm उनमें वैल्यू प्रतिस्थापित करता है
# और परिणाम क्लस्टर को सौंपता है: `helm template main chart` बिना कुछ लागू किए रेंडर किया गया टेक्स्ट
# दिखाता है, `helm install main chart` — उसे लागू करता है।
#
# दोहरे घुँघराले कोष्ठक एक प्रतिस्थापन बिंदु हैं। उनके भीतर आपको मिलेगा:
#   .Values.नाम   — एक पैरामीटर की वैल्यू: अगर ग्राहक ने उसे नहीं छुआ तो values.yaml से,
#                   या अगर उसने अपनी वैल्यू चुनी तो डैशबोर्ड में ऑर्डर फ़ॉर्म से;
#   .Release.Name — रिलीज़ का नाम, यानी चार्ट के किसी विशिष्ट डिप्लॉयमेंट का नाम।
# कोष्ठकों के बाहर का टेक्स्ट मैनिफ़ेस्ट में ज्यों का त्यों जाता है।
apiVersion: apps/v1
kind: Deployment
metadata:
  # ऑब्जेक्ट के नाम रिलीज़ नाम से जोड़े जाते हैं, हार्डकोड नहीं किए जाते। वही चार्ट एक ही
  # namespace में एक से अधिक बार डिप्लॉय किया जाता है, और एक निश्चित नाम का मतलब होता कि
  # दूसरा ऑर्डर पहले को अधिलेखित कर दे। रिलीज़ `main` एक Deployment, Service और ConfigMap देता है
  # जिनका नाम `main` होता है — नाम से एक नज़र में साफ़ हो जाता है कि ये एक ही समूह हैं।
  name: {{ .Release.Name }}
  # लेबल: name इस एप्लिकेशन के हर ऑर्डर के लिए एक जैसा होता है, instance ऑर्डरों में अंतर करता है।
  # इनके ज़रिये ऑब्जेक्ट एक-दूसरे को खोजते हैं, और इन्हीं से `kubectl get` का आउटपुट फ़िल्टर होता है।
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # कितनी प्रतियाँ चालू रखनी हैं। अगर कोई प्रति गायब हो जाए, तो क्लस्टर बिना पूछे एक नई बना देता है —
  # इसी से बिना ड्यूटी पर तैनात एडमिनिस्ट्रेटर के स्व-उपचार होता है।
  replicas: {{ .Values.replicas }}
  # selector Deployment को बताता है कि किन पॉड्स को अपना मानना है — नामों से नहीं, लेबल से।
  # यहाँ के लेबल और template.metadata.labels के लेबल एक जैसे होने अनिवार्य हैं। अगर वे भिन्न हुए,
  # तो Deployment अपनी ही प्रतियाँ नहीं खोज पाता और उन्हें बार-बार गढ़ता रहता है।
  selector:
    matchLabels:
      app.kubernetes.io/name: guest-pass
      app.kubernetes.io/instance: {{ .Release.Name }}
  # template — पॉड का ब्लूप्रिंट है। नीचे जो कुछ है वह स्वयं Deployment का नहीं, बल्कि उन
  # एप्लिकेशन प्रतियों का वर्णन करता है जिन्हें वह इस ब्लूप्रिंट से बनाता है।
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guest-pass
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # पॉड की एनोटेशन में कॉन्फ़िगरेशन हैश। इसके बिना ConfigMap संपादित करने पर पॉड्स
        # पुनः-आरंभ नहीं होते, और नया टेक्स्ट तब तक प्रकट नहीं होता जब तक कोई उन्हें हाथ से न हटाए।
        # यह चार्ट्स पर सामान्यतः की जाने वाली सबसे आम शिकायत है।
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # एप्लिकेशन root के रूप में नहीं और घटे हुए विशेषाधिकारों के साथ चलता है। कैटलॉग से लिया गया चार्ट
      # दूसरे टेनेंट अपने namespace में डिप्लॉय करते हैं, और कंटेनर के विशेषाधिकार उसी का हिस्सा हैं
      # जो आप एप्लिकेशन के साथ उन्हें वचन देते हैं।
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # इमेज टेम्प्लेट में लिखी गई है और जानबूझकर पैरामीटर के रूप में उजागर नहीं की गई: ग्राहक
          # आकार और टेक्स्ट चुनता है, पर स्वयं एप्लिकेशन को किसी मनमाने से नहीं बदलता।
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # इस वेरिएबल के बिना nginx नोड के प्रत्येक कोर पर एक वर्कर प्रोसेस शुरू करता है।
          # कई दर्जन कोर वाले नोड पर उनकी संख्या दर्जनों हो जाएगी, और सौ मेगाबाइट की मेमोरी सीमा
          # वाला पॉड पहली रिक्वेस्ट से पहले ही OOMKilled होकर मर जाएगा। चार्ट दूसरे टेनेंट में
          # जाता है, जहाँ नोड कुछ भी हो सकते हैं, इसलिए यहाँ यह अनिवार्य है।
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # कंटेनर के भीतर का पोर्ट। http नाम आगे प्रोब और Service में उपयोग होता है,
          # ताकि पोर्ट नंबर तीन जगहों पर नहीं, एक ही जगह दर्ज हो।
          ports:
            - containerPort: 8080
              name: http
          # requests — गारंटीशुदा रूप से कितना आवंटित करना है; इन्हीं संख्याओं से शेड्यूलर नोड चुनता है।
          # limits यहाँ केवल मेमोरी पर हैं: सीमा पार की तो कंटेनर मार दिया जाता है और फिर से चालू किया जाता है।
          # CPU पर सीमा जानबूझकर नहीं है, वरना एप्लिकेशन धीरे चलने के बजाय एक छत से टकरा जाता है।
          # `| quote` फ़िल्टर प्रतिस्थापित वैल्यू को उद्धरण-चिह्नों में लपेटता है: उपयोगकर्ता
          # 1 दर्ज कर सकता है, और उद्धरण के बिना मैनिफ़ेस्ट में एक संख्या चली जाएगी वहाँ जहाँ "1"
          # या "100m" जैसी स्ट्रिंग अपेक्षित है।
          resources:
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
            limits:
              memory: {{ .Values.resources.memory | quote }}
          # readinessProbe — यह प्रश्न कि «रिक्वेस्ट स्वीकारने को तैयार?»। जब तक /healthz उत्तर नहीं देता,
          # Service इस प्रति पर ट्रैफ़िक नहीं भेजता। इसी से बिना रुकावट अपडेट होता है: पुरानी प्रति को
          # बैलेंसिंग से तब हटाया जाता है जब नई ने उत्तर दे दिया हो।
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          # nginx का पेज और कॉन्फ़िग ConfigMap से फ़ाइलों के रूप में माउंट होते हैं। subPath ठीक एक ही
          # फ़ाइल प्रतिस्थापित करता है: इसके बिना माउंट की गई डायरेक्टरी पूरे /etc/nginx/conf.d को बदल देती
          # और इमेज की मानक सेटिंग्स गायब हो जातीं।
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      # ConfigMap का नाम रिलीज़ नाम से जोड़ा गया है, इसलिए पॉड हमेशा अपने ही ऑर्डर की कॉन्फ़िगरेशन
      # माउंट करता है, पड़ोसी की नहीं।
      volumes:
        - name: page
          configMap:
            name: {{ .Release.Name }}
        - name: conf
          configMap:
            name: {{ .Release.Name }}
