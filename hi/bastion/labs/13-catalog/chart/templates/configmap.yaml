# लैब 13. ConfigMap टेम्पलेट: «पास» पेज और nginx कॉन्फ़िगरेशन।
#
# ConfigMap टेक्स्ट फ़ाइलें संग्रहीत करता है और उन्हें पॉड्स को देता है। पेज यहाँ रखा गया है, न कि
# इमेज के अंदर, ताकि टेक्स्ट को बिना पुनर्निर्माण के बदला जा सके: greeting मान रेंडर के समय प्रतिस्थापित होता है,
# और रिलीज़ को अपडेट करना ही पर्याप्त है।
#
# प्रतिस्थापन `|` ब्लॉक के अंदर भी काम करता है: Helm टेम्पलेट फ़ाइल को सादे
# टेक्स्ट के रूप में संसाधित करता है और YAML संरचना के बारे में कुछ नहीं जानता। विवरण — templates/deployment.yaml में।
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
# data में कुंजियाँ फ़ाइलों के नाम हैं, और जो `|` के नीचे है, वह उनकी संपूर्ण सामग्री है।
# प्रत्येक कुंजी कंटेनर में अलग फ़ाइल के रूप में माउंट होती है, Deployment में volumeMounts देखें।
data:
  # वह पेज जिसे कर्मचारी देखेगा। यहाँ दो मान आते हैं: ऑर्डर फ़ॉर्म से greeting
  # और रिलीज़ का नाम — ताकि खुले पेज से पता चले कि यह किसका ऑर्डर है।
  index.html: |
    <!doctype html>
    <html lang="en">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Guest Pass</title>
    <style>
      body{background:#0d1117;color:#e6edf3;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:12vh 5vw;margin:0}
      h1{font-size:clamp(26px,6vw,56px);margin:0 0 .3em;color:#2f6fed}
      .pod{font-family:ui-monospace,Menlo,monospace;color:#7d8590;margin-top:3em}
    </style>
    <h1>{{ .Values.greeting }}</h1>
    <p>Guest Pass service, release <b>{{ .Release.Name }}</b></p>
    <div class="pod">served by __POD__</div>
    </html>
  # nginx कॉन्फ़िगरेशन। sub_filter पेज परोसे जाने के समय __POD__ मार्कर को पॉड के नाम से
  # बदल देता है: इस तरह ब्राउज़र में दिखता है कि किस कॉपी ने जवाब दिया। /healthz पर अलग जवाब
  # Deployment के readinessProbe के लिए आवश्यक है — वह ठीक इसी पते को पूछती है।
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location / {
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
