---
# लैब 7 · यह पैच जानबूझकर अधूरा है। यह इसलिए है ताकि आप देख सकें कि
# «कैश जैसे चालू तो कर दिया, पर तेज़ी नहीं आई» कैसा दिखता है। काम करने वाला संस्करण cache-patch.yaml में है।
#
# इसे आपके `lab` क्लस्टर में लागू किया जाता है (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch-broken.yaml
#
# उत्तर में झाँकने की ज़रूरत नहीं। इसे लागू करें, कुछ अनुरोध करें और एप्लिकेशन के लॉग देखें:
# kubectl logs -l app=passes-api. एप्लिकेशन बताता है कि उसके साथ क्या गड़बड़ है,
# — बात बस इतनी है कि संदेश पढ़ें और समझें कि इस फ़ाइल में क्या कमी है।
#
# REDIS-ADDR की जगह अपने Redis का पता डालें (पता खोजने वाला चरण देखें)।
# प्लेसहोल्डर को छोड़ा नहीं जा सकता: तब आपको वह त्रुटि मिलेगी नहीं जिसके लिए यह सब किया गया था।
spec:
  template:
    spec:
      containers:
        # कंटेनर का नाम वह पता है जिससे क्लस्टर संपादन की जगह ढूँढ़ता है।
        - name: api
          env:
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
