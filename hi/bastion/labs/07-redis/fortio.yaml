---
# लैब 7 · वेब UI वाला लोड जनरेटर।
# वही जो स्केलिंग वाली लैब में था: लोड को ब्राउज़र में एक बटन से चलाया जाता है,
# और लेटेंसी हिस्टोग्राम वहीं दिखता है। अगर यह आपके सेटअप में पहले से डिप्लॉय है — तो इस
# फ़ाइल को अप्लाई करने की ज़रूरत नहीं, kubectl «unchanged» जवाब देगा।
#
# कहाँ अप्लाई होता है: आपका `lab` क्लस्टर (export KUBECONFIG=~/lab.kubeconfig)।
# कमांड: kubectl apply -f fortio.yaml
#
# `---` से अलग किए गए दो ऑब्जेक्ट: Deployment (खुद जनरेटर) और Service (वह नाम, जिससे
# उस तक पहुँचा जाता है)। apiVersion, kind और metadata.name पर आगे टिप्पणी नहीं की गई है।
#
# इमेज सार्वजनिक Docker Hub से खींची जाती है, आपके Harbor से नहीं: Fortio «Пропуск»
# सेवा का हिस्सा नहीं है, बल्कि एक मापक उपकरण है जो क्लस्टर में अस्थायी रूप से रहता है।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # एक ही कॉपी। लोड जनरेटर को स्केल करने की ज़रूरत नहीं — ज़रूरत यह है कि वह अकेले
  # ईमानदारी से लेटेंसी गिने। दो कॉपियाँ दो असंगठित हिस्टोग्राम देतीं।
  replicas: 1
  # वह लेबल जिससे Deployment अपने पॉड को पहचानता है। नीचे template में दिए लेबल से मेल खाता है।
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # वही सुरक्षा आवश्यकताएँ जो बाकी सबकी हैं: प्रक्रिया root के रूप में नहीं चलती,
      # और सिस्टम कॉल seccomp प्रोफ़ाइल द्वारा सीमित किए गए हैं।
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # यहाँ `latest` टैग वर्कशॉप के लिए एक सरलीकरण है, और यह उस बात के विपरीत है जो
          # निजी-रजिस्ट्री वाली लैब सिखाती है: इस टैग वाली इमेज दो अप्लाई के बीच चुपचाप बदल
          # सकती है, और कल का मापन अपुनरुत्पादनीय हो जाएगा। एक प्रशिक्षण स्टैंड पर लोड
          # जनरेटर के लिए यह स्वीकार्य है, प्रोडक्शन सिस्टम के लिए नहीं।
          image: fortio/fortio:latest
          # `server` वह मोड है जिसमें Fortio वेब इंटरफ़ेस चालू करता है और तब तक इंतज़ार करता है
          # जब तक आप बटन न दबाएँ। इस आर्गुमेंट के बिना इमेज एक बार वाली कमांड चलाकर बाहर निकल जाती है।
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # जनरेटर को कुछ CPU हेडरूम चाहिए, वरना वह अपनी ही
              # सीमा से टकराएगा और आप एप्लिकेशन के बजाय Fortio पर लोड डाल रहे होंगे।
              cpu: "1"
              memory: 256Mi
---
# वेब इंटरफ़ेस खोलने के लिए Service ज़रूरी है: जनरेटर तक नाम से पोर्ट फ़ॉरवर्डिंग के ज़रिए
# पहुँचा जाता है — kubectl port-forward svc/fortio 8081:8080 — और localhost:8081 पर
# एक्सेस किया जाता है। सेवा पर बिना Service के भी भार डाला जा सकता है, कमांड
# kubectl exec deploy/fortio से, लेकिन ब्राउज़र में हिस्टोग्राम केवल यही रास्ता देता है।
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  # यहाँ Service का नंबर और कंटेनर पोर्ट एक समान हैं — लैब की बाकी सेवाओं
  # के विपरीत, जहाँ बाहर 80 और अंदर 8080 है। अंतर केवल सुविधा का है।
  ports:
    - port: 8080
      targetPort: http
