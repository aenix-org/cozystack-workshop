---
# लैब 7 · सेवा «गेस्ट पास», संस्करण v2 — वह जो कैश के साथ काम कर सकता है।
# कैश यहाँ अभी चालू नहीं है: पहले हम मापते हैं कि इसके बिना कितना बुरा है। यह बाद में चालू होता है,
# इसी फ़ोल्डर के cache-patch.yaml पैच से।
#
# कहाँ लागू किया जाता है: आपका `lab` क्लस्टर (export KUBECONFIG=~/lab.kubeconfig).
# कमांड: kubectl apply -f passes-api.yaml
#
# HARBOR-HOST एक प्लेसहोल्डर है, पता नहीं। अपने Harbor का पता डालें (hr-legacy.yaml देखें,
# वहीं इसे सभी फ़ाइलों में एक साथ बदलने के लिए sed कमांड भी है)।
#
# फ़ाइल में `---` से अलग किए गए दो ऑब्जेक्ट हैं: Deployment (एप्लिकेशन की प्रतियाँ) और Service (उनके लिए
# एक स्थायी नाम)। apiVersion, kind और metadata.name पर आगे फ़ाइल में टिप्पणी नहीं की गई है।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # दो प्रतियाँ, एक नहीं, — ताकि बाद में कैश का मुख्य गुण दिखे: वह साझा है।
  # एक पॉड ने जवाब Redis में डाला, दूसरे ने उसे वहाँ से लिया, हालाँकि वह खुद डायरेक्टरी तक कभी नहीं गया।
  replicas: 2
  # इस लेबल से Deployment अपने पॉड को दूसरों से अलग पहचानता है। यह नीचे template में मौजूद लेबल से
  # मेल खाना चाहिए, अन्यथा ऑब्जेक्ट वही नहीं ढूँढ़ पाएगा जो उसने खुद बनाया था।
  selector:
    matchLabels:
      app: passes-api
  # template — पॉड का टेम्पलेट: हर प्रति किससे इकट्ठा करनी है।
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # पॉड-स्तर की सुरक्षा आवश्यकताएँ: root से नहीं, सिस्टम कॉल का सीमित सेट। नीतियाँ चालू वाले
      # क्लस्टर में इन फ़ील्ड के बिना पॉड स्वीकार नहीं किया जाएगा।
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # छवि खींचते समय क्लस्टर बंद Harbor के सामने खुद को कैसे प्रस्तुत करेगा। इस सीक्रेट के संदर्भ
      # के बिना पॉड ImagePullBackOff में अटक जाएगा।
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # कंटेनर के अधिकार न्यूनतम तक घटाए गए हैं: बढ़ाना मना है, कोई कर्नेल विशेषाधिकार नहीं।
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # वही छवि जो डायरेक्टरी की है। उन्हें केवल नीचे का MODE अलग करता है।
          image: HARBOR-HOST/passes/passes-api:v2
          # पोर्ट का नाम इसलिए ज़रूरी है ताकि प्रोब और Service संख्या नहीं, नाम का संदर्भ दें।
          ports:
            - containerPort: 8080
              name: http
          # एप्लिकेशन का पूरा व्यवहार यहीं तय होता है। ध्यान दें: चर
          # REDIS_ADDR और REDIS_PASSWORD सूची में नहीं हैं — और ठीक इसीलिए कैश बंद है,
          # और हर अनुरोध ईमानदारी से धीमी डायरेक्टरी तक जाता है।
          env:
            # MODE=api — यह इंस्टेंस स्वयं «गेस्ट पास» सेवा के रूप में काम करता है।
            - name: MODE
              value: "api"
            # संस्करण और रजिस्ट्री एप्लिकेशन को काम के लिए ज़रूरी नहीं — वे «/» के जवाब में दिखते हैं
            # और यह भरोसा दिलाते हैं कि ठीक वही चल रहा है जो आपने अभी बनाया।
            - name: APP_VERSION
              value: "v2"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # डेटा के लिए कहाँ जाना है। पता नहीं, सेवा का नाम: डायरेक्टरी की प्रतियाँ
            # जितनी बार चाहें फिर से बन सकती हैं, नाम नहीं बदलता।
            - name: HR_URL
              value: "http://hr-legacy.default.svc.cluster.local"
            # अनुरोध कौन और कहाँ निष्पादित करता है। ये तीन मान क्लस्टर खुद डालता है:
            # इन्हें पहले से कोई नहीं जानता। वे सेवा के जवाब में पहुँचते हैं, और उनसे दिखता है
            # कि किस नोड पर किस प्रति ने जवाब दिया — यह मापन के समय काम आएगा।
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — नोड चुनते समय जो आरक्षित होता है, limits — अधिकतम सीमा। यहाँ एक कोर की सीमा
          # लालच नहीं है: लोड में एप्लिकेशन इससे टकराएगा, न कि पूरे नोड को खा जाएगा,
          # और मापन डायरेक्टरी की देरी दिखाएगा, न कि प्रोसेसर के लिए संघर्ष।
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # जब तक /healthz जवाब न दे, Service इस प्रति को एक भी अनुरोध नहीं भेजेगा।
          # अपडेट के समय यही फ़ील्ड आपको ठप होने से बचाता है: पुरानी प्रतियाँ तब तक नहीं हटाई जातीं,
          # जब तक नई तैयार होने की सूचना न दें।
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — दोनों प्रतियों के लिए एक स्थायी नाम और उनके बीच अनुरोधों का वितरण।
# पॉड फिर से बनते हैं और IP बदलते हैं, नाम passes-api बना रहता है। इसी नाम से सेवा तक
# Fortio और जाँच स्क्रिप्ट दोनों पहुँचते हैं।
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # वह लेबल जिससे Service जीवित प्रतियों की सूची जुटाता है। पॉड के लेबल से मेल न खाए —
  # Service मौजूद तो रहेगा पर कहीं नहीं ले जाएगा।
  selector:
    app: passes-api
  ports:
    # बाहर से 80 पर जुड़ते हैं, पॉड के अंदर http नाम वाले पोर्ट (8080) पर जाता है।
    - port: 80
      targetPort: http
