---
# लैब 7 · लेगेसी कर्मचारी डायरेक्ट्री का स्टब।
# असल जिंदगी में यह किसी और की सिस्टम है जिसे दोबारा लिखने की अनुमति आपको नहीं मिलेगी: यह 800 ms में जवाब देती है,
# और इसके साथ किसी तरह जीना पड़ता है। यहाँ — वैसे ही व्यवहार वाला एक स्टब है, ताकि मापने के लिए कुछ हो।
#
# कहाँ लागू होता है: आपका `lab` क्लस्टर (export KUBECONFIG=~/lab.kubeconfig), Cozystack का प्रबंधन
# क्लस्टर नहीं। कमांड: kubectl apply -f hr-legacy.yaml
#
# HARBOR-HOST एक प्लेसहोल्डर है, पता नहीं। अपने Harbor का पता डालें, वरना क्लस्टर एक
# न मौजूद होस्ट से इमेज खींचने चला जाएगा:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # macOS
#
# फ़ाइल में `---` लाइन से अलग किए गए दो ऑब्जेक्ट हैं: एक Deployment (क्या चलता है और कितनी
# कॉपियों में) और एक Service (एक स्थायी नाम जिससे इन कॉपियों तक पहुँचा जाता है)। हर ऑब्जेक्ट के
# apiVersion और kind बताते हैं कि यह किस तरह का ऑब्जेक्ट है, और metadata.name यह कि इसे क्या कहते हैं;
# आगे फ़ाइल में इन तीन फ़ील्ड पर टिप्पणी नहीं की गई है।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-legacy
  labels:
    app: hr-legacy
spec:
  # कितनी कॉपियाँ चालू रखनी हैं। कोई कॉपी गायब हुई — क्लस्टर बिना पूछे एक नई बना
  # देगा। डायरेक्ट्री के लिए एक ही काफ़ी है: यह यहाँ लोड के लिए नहीं, मापने के लिए है।
  replicas: 1
  # इस लेबल से Deployment क्लस्टर के बाकी सभी पॉड्स के बीच अपने पॉड्स को पहचानता है।
  # selector में लेबल और नीचे template में लेबल का मेल होना अनिवार्य है, वरना ऑब्जेक्ट
  # उसी को नहीं खोज पाएगा जिसे उसने खुद बनाया था।
  selector:
    matchLabels:
      app: hr-legacy
  # template — पॉड का टेम्पलेट। नीचे जो कुछ है वह एक कॉपी का वर्णन करता है: इसे किससे जोड़ना है,
  # किन अधिकारों के साथ चलाना है और कैसे समझें कि यह अनुरोध स्वीकार करने के लिए तैयार है।
  template:
    metadata:
      labels:
        app: hr-legacy
    spec:
      # पॉड-स्तर की सुरक्षा आवश्यकताएँ। प्रक्रिया root के रूप में नहीं चलती (uid 10001),
      # seccomp प्रोफ़ाइल उन सिस्टम कॉल्स को काट देता है जिनकी एप्लिकेशन को ज़रूरत नहीं।
      # नीतियाँ चालू वाले क्लस्टर में इन फ़ील्ड के बिना पॉड बिल्कुल भी शुरू नहीं होगा।
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Harbor लॉगिन और पासवर्ड से बंद है, और क्लस्टर को किसी तरह अपना परिचय देना होता है। `harbor`
      # सीक्रेट आपने रजिस्ट्री वाली लैब में बनाया था। इस संदर्भ के बिना इमेज नहीं खींची जाएगी,
      # और पॉड ImagePullBackOff स्थिति में बना रहेगा।
      imagePullSecrets:
        - name: harbor
      containers:
        - name: hr
          # वही जो पॉड स्तर पर है, पर एक विशेष कंटेनर के लिए: हम प्रिविलेज
          # एस्केलेशन पर रोक लगाते हैं और सभी कर्नेल कैपेबिलिटीज़ छीन लेते हैं। Go वाले एप्लिकेशन को
          # इनमें से कोई भी नहीं चाहिए।
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # इमेज डायरेक्ट्री और «गेस्ट पास» सेवा दोनों के लिए एक ही है।
          # प्रक्रिया वास्तव में किस रूप में शुरू होगी, यह नीचे दिया MODE वेरिएबल तय करता है।
          image: HARBOR-HOST/passes/passes-api:v2
          # पोर्ट का एक नाम है, केवल नंबर नहीं: readiness प्रोब और नीचे Service
          # नाम का संदर्भ लेते हैं। नंबर बदला — तो सुधार एक ही जगह करना होगा।
          ports:
            - containerPort: 8080
              name: http
          # एनवायरनमेंट वेरिएबल इस एप्लिकेशन को कॉन्फ़िगर करने का एकमात्र तरीका है।
          # व्यवहार बदलने के लिए इमेज दोबारा बनाने की ज़रूरत नहीं।
          env:
            # MODE=hr — यह इंस्टेंस HR सिस्टम होने का नाटक करता है: प्रतीक्षा करता है और जवाब देता है।
            - name: MODE
              value: "hr"
            # ठीक वही देरी जो असली डायरेक्ट्री दिखाती है।
            # इसे बदलकर आप «हालात कितने खराब हैं» को बदलते हैं — बाद में 2s आज़माएँ।
            - name: HR_DELAY
              value: "800ms"
            # पॉड अपना नाम पहले से नहीं जानता — इसे बनाते समय क्लस्टर तय करता है।
            # fieldRef इस नाम को स्टार्ट पर ही वेरिएबल में डाल देता है, और यह
            # सेवा के जवाब में पहुँच जाता है: दिखता है कि वास्तव में किस कॉपी ने जवाब दिया।
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # requests — नोड चुनते समय कंटेनर के लिए कितने संसाधन आरक्षित होते हैं,
          # limits — वह सीमा जिससे ऊपर इसे नहीं जाने दिया जाएगा। vSphere के reservation
          # और limit जैसा, पर यह कंटेनर पर सेट होता है, वर्चुअल मशीन पर नहीं।
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # readiness प्रोब। जब तक /healthz जवाब न दे, Service इस कॉपी में
          # एक भी अनुरोध नहीं भेजेगा। प्रोब के बिना ट्रैफ़िक अभी शुरू न हुई प्रक्रिया में चला जाएगा,
          # और आप बेवजह त्रुटियाँ देखेंगे — जबकि «सब कुछ डिप्लॉय हो गया»।
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — पॉड्स के एक समूह के लिए स्थायी नाम और स्थायी पता। पॉड्स दोबारा बनते हैं
# और हर बार नया IP पाते हैं, पर hr-legacy नाम वही रहता है। लोड बैलेंसर के
# VIP जैसा, पर यह चार लाइनों में सेट होता है और क्लस्टर के भीतर रहता है।
apiVersion: v1
kind: Service
metadata:
  name: hr-legacy
spec:
  # इस लेबल से Service जीवित कॉपियों की सूची बनाता है। वही लेबल जो ऊपर पॉड्स पर है:
  # मेल न खाया — तो Service मौजूद रहेगा पर कहीं नहीं ले जाएगा।
  selector:
    app: hr-legacy
  ports:
    # अनुरोध पोर्ट 80 पर आते हैं, पॉड के भीतर यह http नाम वाले पोर्ट (8080) पर जाता है।
    - port: 80
      targetPort: http
