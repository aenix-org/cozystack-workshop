---
# लैब 7 · कैश को वास्तव में सक्षम करना। पहले से डिप्लॉय किए गए passes-api के ऊपर लागू किया जाता है
# आपके `lab` क्लस्टर में (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch.yaml
#
# यह एक पैच है, पूरा मैनिफ़ेस्ट नहीं: यहाँ केवल वही वर्णित है जो बदलता है। बाकी सब कुछ —
# इमेज, लेबल, प्रोब, संसाधन — passes-api.yaml से अछूता रहता है। इसीलिए फ़ाइल
# सीधे spec: से शुरू होती है: कंटेनर तक का रास्ता Deployment की संरचना को दोहराता है, ताकि
# क्लस्टर समझ सके कि संपादन ठीक कहाँ लागू करना है।
#
# कंटेनर का नाम `api` कोई सजावट नहीं, बल्कि एक पता है: इसी से क्लस्टर सूची में सही कंटेनर ढूँढता है।
# नाम गलत लिखेंगे — संपादन के बजाय आपको दूसरा कंटेनर मिल जाएगा।
#
# REDIS-ADDR के बजाय अपने Redis का पता डालें — यह एक प्लेसहोल्डर है, होस्टनेम नहीं।
# पता आप डैशबोर्ड में, अपने managed Redis एप्लिकेशन के कार्ड में से लेते हैं।
spec:
  template:
    spec:
      containers:
        - name: api
          # Kubernetes में env सूचियाँ name फ़ील्ड के अनुसार मर्ज होती हैं, इसलिए नीचे की तीन प्रविष्टियाँ
          # Deployment में पहले से मौजूद प्रविष्टियों को बदलने के बजाय उनमें जुड़ जाती हैं।
          env:
            # इस वेरिएबल का प्रकट होना ही ठीक-ठीक "कैश सक्षम करना" है: एप्लिकेशन इसे
            # स्टार्टअप पर जाँचता है और, अगर यह सेट है, तो पहले Redis में जाता है। खाली या
            # अनुपस्थित — तो पहले की तरह काम करता है, हर अनुरोध पर डायरेक्टरी के ज़रिए।
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
            # पासवर्ड हम सादे टेक्स्ट में नहीं लिखते: यह एक सीक्रेट से आता है जिसे आप
            # एक अलग कमांड से बनाएँगे। Git में रहने वाले मैनिफ़ेस्ट में
            # पासवर्ड की कोई जगह नहीं।
            #
            # secretKeyRef एक संदर्भ है: name — उसी क्लस्टर में सीक्रेट ऑब्जेक्ट का नाम,
            # key — उसके भीतर कौन सा फ़ील्ड लेना है। मान पॉड के शुरू होने पर प्रतिस्थापित
            # होता है और फ़ाइल में कभी प्रकट नहीं होता।
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
            # कोई प्रविष्टि कैश में कितने सेकंड जीवित रहती है। साठ — क्योंकि
            # कर्मचारी डायरेक्टरी दिन में एक बार बदलती है, हर सेकंड नहीं।
            #
            # लंबी अवधि — हम डायरेक्टरी में कम बार जाते हैं, पर पुराना उपनाम अधिक देर तक
            # परोसते हैं। छोटी — डेटा ताज़ा होता है, लाभ कम होता है। यह एक समझौता है,
            # एक सही मान वाली सेटिंग नहीं।
            - name: CACHE_TTL
              value: "60"
