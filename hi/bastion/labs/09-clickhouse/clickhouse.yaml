# लैब 9 · प्रवेश-पास लॉग पर एनालिटिक्स के लिए ClickHouse डेटाबेस ऑर्डर करें।
# आप क्या पाना चाहते हैं इसका विवरण; सेवा को प्लेटफ़ॉर्म असेंबल और कॉन्फ़िगर करता है।
# वही चीज़ जो आप डैशबोर्ड में माउस से ऑर्डर करते — बस टेक्स्ट के रूप में।
# लैब क्लस्टर में नहीं, बल्कि मैनेजमेंट क्लस्टर पर एक टेनेंट में लागू किया जाता है:
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f clickhouse.yaml
#
# लागू करने से पहले: tenant-workshopXX को अपने namespace से बदलें,
# और ЗдесьВашПароль को उस पासवर्ड से जो आप सोचेंगे।
apiVersion: apps.cozystack.io/v1alpha1
kind: ClickHouse
metadata:
  name: analytics
  namespace: tenant-workshopXX
spec:
  # एक कॉपी और एक शार्ड। प्रोडक्शन में कम से कम दो कॉपी रखी जाती हैं, वरना एक नोड का खोना
  # डेटा के अनुपलब्ध हो जाने का मतलब है — लेकिन हमें एक मिलियन पंक्तियाँ चाहिए, फ़ॉल्ट
  # टॉलरेंस नहीं, और एक अतिरिक्त कॉपी बस स्टैंड के संसाधन खा जाती।
  replicas: 1
  shards: 1
  # टेबल डेटा के लिए डिस्क। इस लैब की एक मिलियन पंक्तियाँ दसियों मेगाबाइट लेंगी:
  # शब्दकोशों के साथ कॉलमनार स्टोरेज ऐसे लॉग को बहुत ज़्यादा संपीड़ित करता है।
  size: 5Gi
  # सर्वर के सिस्टम लॉग के लिए अलग डिस्क, जिसमें क्वेरी लॉग भी शामिल है।
  logStorageSize: 2Gi
  # कितने दिनों बाद क्वेरी लॉग को हटाना है। हम इसमें देखने वाले हैं।
  logTTL: 15
  # replicated — वे वॉल्यूम जिनकी क्लस्टर के दूसरे नोड पर एक कॉपी होती है: नोड गिर गया,
  # डेटा बना रहा।
  storageClass: replicated
  # 1 CPU, 4 GB। ClickHouse मेमोरी में गणना करता है, और एक मिलियन पंक्तियों पर
  # ग्रुपिंग में यह ध्यान देने योग्य है।
  resourcesPreset: u1.small
  # डेटाबेस उपयोगकर्ता और उसका पासवर्ड। अपना खुद का पासवर्ड सोचें और याद रखें: यह
  # वर्कर पॉड (CH_AUTH वेरिएबल) और जाँच स्क्रिप्ट (CH_PASSWORD वेरिएबल) को चाहिए।
  # बनने के बाद यह डैशबोर्ड में, clickhouse-analytics-credentials सीक्रेट में दिखता है।
  users:
    analyst:
      password: ЗдесьВашПароль
  # ऑब्जेक्ट स्टोरेज में बैकअप। यहाँ का डेटा जनरेट किया गया है,
  # बहाल करने को कुछ नहीं है — ट्रेनिंग स्टैंड पर बंद किया गया है।
  backup:
    enabled: false
  # कॉपियों के बीच समन्वय के लिए Keeper चाहिए। कॉपी एक है — समन्वय के लिए
  # कोई नहीं है, और तीन Keeper पॉड व्यर्थ में संसाधन ले लेते।
  clickhouseKeeper:
    enabled: false
