---
# लैब 5 · Git में इंफ्रास्ट्रक्चर। «Пропуск» सेवा के लिए नेमस्पेस।
#
# इस फ़ाइल को क्लस्टर में हाथ से लागू नहीं किया जाता। आप इसे GitHub पर अपने रिपॉज़िटरी में,
# apps/ फ़ोल्डर में रखते हैं, और Flux इसे `lab` क्लस्टर में खुद, शेड्यूल के अनुसार ले जाता है:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# किसी भी मैनिफ़ेस्ट को कैसे पढ़ें: apiVersion — विवरण स्कीमा का संस्करण (इसके आधार पर क्लस्टर
# जानता है कि उसे कैसे पार्स करना है), kind — हम क्या बना रहे हैं, metadata.name — वह नाम जिससे
# ऑब्जेक्ट को बाद में खोजा जाता है। ये तीन फ़ील्ड हर ऑब्जेक्ट में मौजूद हैं और नीचे अलग से नहीं समझाए गए हैं।
#
# नेमस्पेस (namespace) — एक ही क्लस्टर के भीतर एक तार्किक विभाजन: अपना नाम-दायरा, अपने अधिकार,
# अपने कोटा। vSphere में इसके सबसे नज़दीक — vCenter ट्री में एक फ़ोल्डर या resource pool।
#
# यह ऐप्लिकेशन के साथ Git में क्यों रखा है, हाथ से क्यों नहीं बनाया गया: जब सेवा रिपॉज़िटरी से
# हट जाएगी, Flux नेमस्पेस को भी हटा देगा। कोई खाली विभाजन पीछे नहीं बचेगा, जिसके बारे में छह महीने
# बाद कोई याद नहीं रखेगा कि इसे क्यों बनाया गया था।
apiVersion: v1
kind: Namespace
metadata:
  name: passes
  # लेबल सेवा के काम पर असर नहीं डालता — यह इसलिए ज़रूरी है कि एक ही कमांड से «Пропуск» से जुड़ी
  # हर चीज़ को खोजा जा सके: kubectl get all -A -l app.kubernetes.io/part-of=passes.
  # part-of नाम Kubernetes के आम लेबल-सेट से लिया गया है, हमने नहीं बनाया:
  # बाहरी टूल (मॉनिटरिंग, एक्सपोर्ट) ठीक इसी को खोजते हैं।
  labels:
    app.kubernetes.io/part-of: passes
