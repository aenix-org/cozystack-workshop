---
# लैब 5 · Git में इंफ्रास्ट्रक्चर। कार्य: रिपॉज़िटरी से वास्तव में क्या क्लस्टर पर लागू करना है।
#
# आपके `lab` क्लस्टर पर पड़ोसी gitrepository.yaml के साथ लागू किया जाता है:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# प्रत्येक ऑब्जेक्ट में: apiVersion — विवरण स्कीमा का संस्करण, kind — हम क्या बनाते हैं,
# metadata.name — ऑब्जेक्ट का नाम। नीचे अलग से नहीं समझाया गया है।
#
# कर्तव्यों का विभाजन: GitRepository रिपॉज़िटरी डाउनलोड करता है और कुछ भी लागू नहीं करता,
# यह ऑब्जेक्ट डाउनलोड किए गए को लेता है और क्लस्टर को उसके अनुरूप लाता है। Kustomization नाम
# kustomize उपयोगिता के नाम से मेल खाता है, लेकिन ये अलग चीज़ें हैं — यहाँ यह क्लस्टर में एक ऑब्जेक्ट है।
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passes
  # वहीं रहता है जहाँ Flux सेवाएँ हैं — अन्यथा kustomize-controller इसे नहीं उठाएगा।
  namespace: flux-system
spec:
  # क्लस्टर की वास्तविक स्थिति को Git में वर्णित स्थिति से कितनी बार मिलाना है।
  # यह «हर मिनट फिर से लागू करना» नहीं है — यह «हर मिनट तुलना करना और
  # विसंगतियों को ठीक करना» है। भले ही Git में कुछ न बदला हो, kubectl edit के माध्यम से
  # हाथ से किया गया संपादन चुपचाप वापस लौटा दिया जाएगा। अंतर आप लैब में
  # थोड़ा आगे देखेंगे, जब आप स्वयं Git को दरकिनार करके क्लस्टर में कुछ बदलेंगे।
  interval: 1m
  # रिपॉज़िटरी के अंदर एक फ़ोल्डर। इसमें जो कुछ भी है वह क्लस्टर में पहुँचेगा; इसके पास वाली
  # फ़ाइलें — उदाहरण के लिए रूट में README.md — छुई नहीं जाएँगी। नाम `apps` हमने चुना है, लेकिन यह
  # उस फ़ोल्डर से मेल खाना चाहिए जिसमें आप अपनी रिपॉज़िटरी में मैनिफ़ेस्ट रखते हैं।
  path: ./apps
  # क्लस्टर से उन ऑब्जेक्ट्स को हटाना जो Git से गायब हो गए हैं।
  # इसके बिना Git पूर्ण विवरण नहीं रह जाता: रिपॉज़िटरी से हटाया गया
  # क्लस्टर में चलता रहता, और किसी को इसके बारे में पता नहीं चलता।
  prune: true
  # किस स्रोत को देखना है। नाम `passes` — यह gitrepository.yaml से metadata.name है,
  # न कि GitHub पर रिपॉज़िटरी का नाम। वहाँ नाम बदलें — यहाँ भी ठीक करें, अन्यथा Flux
  # ऐसे स्रोत की प्रतीक्षा करेगा जो मौजूद नहीं है, और Kustomization तैयार नहीं होगा।
  sourceRef:
    kind: GitRepository
    name: passes
  # लागू किए गए संसाधनों के तैयार होने की प्रतीक्षा करना, न कि apply के तुरंत बाद रिपोर्ट करना।
  # अंतर बिल्कुल वही है जो «अनुरोध भेजा» और «अनुरोध पूरा हुआ» के बीच है: wait के बिना
  # Flux सफलता की रिपोर्ट देगा, भले ही उसके बाद पॉड्स ऊपर न आएँ।
  wait: true
  # इस तैयारी की कितनी देर प्रतीक्षा करनी है, इससे पहले कि लागू करने को असफल माना जाए।
  # तीन मिनट — खाली नोड पर इमेज डाउनलोड करने के लिए गुंजाइश के साथ। बहुत छोटा
  # मान धीमे नेटवर्क पर झूठी विफलताएँ देगा, बहुत बड़ा — आप स्पष्ट त्रुटि के
  # बजाय लंबे समय तक «प्रगति में» देखते रहेंगे।
  timeout: 3m
