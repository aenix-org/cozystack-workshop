---
# लैब 13. आपके एप्लिकेशन का ऑर्डर इस तरह दिखेगा — इसके बाद जब
# एडमिन applicationdefinition.yaml लागू करेगा। इसे अपने टेनेंट में लागू करें:
#   kubectl apply -f guestpass-example.yaml
#
# ध्यान दें: tenant-workshopXX एक प्लेसहोल्डर है, namespace का नाम नहीं। लागू करने से पहले
# XX को अपने टेनेंट के नंबर से बदलें, वरना kubectl मना कर देगा: ऐसा कोई namespace नहीं है,
# और किसी और के namespace में आपको जाने नहीं दिया जाएगा।
#
# ध्यान दें: apps.cozystack.io ग्रुप वही है जो Bucket, VMInstance और
# कैटलॉग के बाकी एप्लिकेशन इस्तेमाल करते हैं। आपका एप्लिकेशन उन्हीं के
# साथ एक कतार में आएगा, कहीं किनारे नहीं।
#
# आप इस फ़ाइल को एडमिन द्वारा परिभाषा रजिस्टर करने से पहले लागू नहीं कर सकते:
# kubectl जवाब देगा `no matches for kind "GuestPass"`।
apiVersion: apps.cozystack.io/v1alpha1
kind: GuestPass
metadata:
  name: main
  namespace: tenant-workshopXX
# spec में मौजूद फ़ील्ड ठीक वही पैरामीटर हैं जो chart/values.yaml में वर्णित हैं और
# डैशबोर्ड में ऑर्डर फ़ॉर्म द्वारा दिखाए जाते हैं। यहाँ वे टेक्स्ट के रूप में लिखे गए हैं: वही जो
# डैशबोर्ड में बटन दबाना, लेकिन ऐसी फ़ाइल की समीक्षा की जा सकती है, Git में रखा जा सकता है और रोलबैक किया जा सकता है।
spec:
  replicas: 2
  greeting: "Order a pass for your guest"
  external: false
  resources:
    cpu: 100m
    memory: 128Mi
