---
# लैब 13. Cozystack कैटलॉग के लिए एप्लिकेशन परिभाषा — वही "कैटलॉग प्रविष्टि"।
#
# अपने आप में यह ऑब्जेक्ट कुछ भी डिप्लॉय नहीं करता। यह तीन चीज़ों को जोड़ता है: आपका चार्ट
# (क्या डिप्लॉय करना है), API में एक नया ऑब्जेक्ट प्रकार (एप्लिकेशन को कैसे ऑर्डर किया जाता है) और डैशबोर्ड
# में एक कार्ड (ऐसा करते समय व्यक्ति क्या देखता है)। जब तक यह मौजूद नहीं होता, चार्ट फ़ाइलों का एक फ़ोल्डर
# बना रहता है जिसके बारे में प्लेटफ़ॉर्म को कुछ पता नहीं, और Postgres और Redis के बगल में एप्लिकेशन सूची खाली रहती है।
#
# एक ही कमांड से लागू किया जाता है, बिना namespace के:
#   kubectl apply -f applicationdefinition.yaml
#
# महत्वपूर्ण: यह ऑब्जेक्ट CLUSTER-SCOPED है — इसका कोई namespace नहीं, यह पूरे
# क्लस्टर के लिए एक ही होता है। टेनेंट इसे लागू नहीं कर सकता, यह सत्यापित है:
#   kubectl auth can-i create applicationdefinitions   ->   no
# आपका काम वहीं समाप्त होता है जब फ़ाइल लिख दी जाए और स्थानीय रूप से जाँच ली जाए।
# इसे प्लेटफ़ॉर्म एडमिन लागू करता है। README देखें, अनुभाग "आपके
# अधिकार कहाँ समाप्त होते हैं"।
apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: guest-pass
spec:
  # --- यह API में कैसा दिखता है ----------------------------------------------
  application:
    # नए ऑब्जेक्ट प्रकार का Kind। लागू करने के बाद, क्लस्टर में एक kind: GuestPass
    # दिखाई देगा, और आप इसके साथ सामान्य kubectl से काम कर सकेंगे।
    kind: GuestPass
    plural: guestpasses
    singular: guestpass
    # Values स्कीमा — वही जो चार्ट में values.schema.json फ़ाइल के रूप में होती है,
    # बस एक ही पंक्ति में लिखी गई। API इसका उपयोग अमान्य मानों को अस्वीकार करने के लिए
    # करता है, और डैशबोर्ड इसका उपयोग निर्माण फ़ॉर्म रेंडर करने के लिए करता है।
    openAPISchema: |-
      {"title":"Chart Values","type":"object","properties":{"replicas":{"description":"Number of application replicas.","type":"integer","default":2},"greeting":{"description":"Text shown on the main page.","type":"string","default":"Order a pass for your guest"},"external":{"description":"Enable external access from outside the cluster.","type":"boolean","default":false},"resources":{"description":"Explicit CPU and memory configuration.","type":"object","default":{},"properties":{"cpu":{"description":"CPU available to each replica.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true},"memory":{"description":"Memory (RAM) available to each replica.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true}}}}}

  # --- क्या डिप्लॉय करना है ----------------------------------------------
  release:
    # रिलीज़ नाम = prefix + ऑब्जेक्ट नाम। `main` नामक एक GuestPass ऑब्जेक्ट
    # रिलीज़ `guest-pass-main` के रूप में डिप्लॉय होता है। प्रीफ़िक्स अनिवार्य है और इसलिए मौजूद है
    # ताकि विभिन्न एप्लिकेशनों की रिलीज़ें नाम से न टकराएँ।
    prefix: guest-pass-
    labels:
      # इसी की से Cozystack टेनेंट रिलीज़ों को Flux शार्ड्स में वितरित करता है।
      # इसके बिना रिलीज़ की सेवा करने वाला कोई नहीं होगा।
      sharding.fluxcd.io/key: tenants
    chartRef:
      # चार्ट कहाँ से लेना है। अनुमत kinds: OCIRepository, HelmChart,
      # ExternalArtifact। बाहरी कैटलॉग आमतौर पर
      # GitRepository -> HelmChart के माध्यम से आते हैं, और उनका namespace cozy-public होता है।
      kind: HelmChart
      name: cozystack-guest-pass
      namespace: cozy-public

  # --- यह डैशबोर्ड में कैसा दिखता है ------------------------------------------
  dashboard:
    # कैटलॉग अनुभाग। उपयोग किए जाते हैं: PaaS, IaaS, NaaS, Administration,
    # Networking — कोई मौजूदा चुनें, अपना खुद का न बनाएँ,
    # अन्यथा एप्लिकेशन एकल आइटम वाले अनुभाग में समाप्त हो जाता है।
    category: PaaS
    singular: Guest Pass
    plural: Guest Passes
    description: Internal guest pass service for employees and reception
    tags:
      - internal
      - web
    # आइकन — base64 में SVG। विशेष रूप से base64, कोई पथ नहीं और कोई URL नहीं: डैशबोर्ड
    # कुछ भी डाउनलोड करने कहीं नहीं जाता। स्रोत इसके बगल में icon.svg में होता है।
    icon: 
    # ऑब्जेक्ट के YAML प्रतिनिधित्व में फ़ील्ड क्रम। कॉस्मेटिक, लेकिन इसके बिना
    # फ़ील्ड बेतरतीब ढंग से पंक्तिबद्ध होते हैं और फ़ॉर्म कम पठनीय होता है।
    keysOrder: [["apiVersion"], ["kind"], ["metadata"], ["metadata", "name"], ["spec", "replicas"], ["spec", "greeting"], ["spec", "external"], ["spec", "resources"]]
