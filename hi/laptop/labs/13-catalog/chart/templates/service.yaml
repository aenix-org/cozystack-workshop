# लैब 13. Service टेम्पलेट: एप्लिकेशन के लिए एक स्थिर पता।
#
# एप्लिकेशन की प्रतियाँ आती-जाती रहती हैं, और हर बार उनके पते नए होते हैं। Service एक ऐसा नाम
# देता है जो नहीं बदलता, और अनुरोधों को जीवित प्रतियों में बाँट देता है। पड़ोसी पॉड से
# एप्लिकेशन तक रिलीज़ के नाम से पहुँचा जाता है।
#
# दोहरे घुँघराले कोष्ठकों के भीतर प्रतिस्थापन के बारे में और ऑब्जेक्ट के नाम कहाँ से आते हैं,
# इस बारे में templates/deployment.yaml में लिखा है — यहाँ सब कुछ उसी तरह काम करता है।
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # values में एक ही फ़्लैग यह तय करता है कि एप्लिकेशन को क्लस्टर के बाहर पता मिलेगा या नहीं।
  # Cozystack के अंतर्निहित एप्लिकेशन भी इसी तरह काम करते हैं: external फ़ील्ड।
  # if/else संरचना रेंडर के समय दो में से एक मान चुनती है — तैयार मैनिफ़ेस्ट में
  # या तो LoadBalancer जाता है या ClusterIP, और उसमें कोई शाखन नहीं बचता।
  type: {{ if .Values.external }}LoadBalancer{{ else }}ClusterIP{{ end }}
  # ट्रैफ़िक किसे भेजना है। Service पॉड को लेबल के आधार पर चुनता है, नाम के आधार पर नहीं, इसलिए
  # उसे इससे फ़र्क नहीं पड़ता कि कितनी प्रतियाँ हैं या उनके नाम क्या हैं। लेबल वही हैं जो Deployment
  # अपनी प्रतियों पर लगाता है।
  selector:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
  # port — Service खुद किस पोर्ट पर सुनता है, targetPort — वह पॉड के भीतर कहाँ दस्तक देता है।
  # targetPort नाम के रूप में लिखा गया है: http नाम वाला पोर्ट Deployment टेम्पलेट में घोषित है।
  # वहाँ नंबर बदलेगा तो यहाँ कुछ ठीक करने की ज़रूरत नहीं पड़ेगी।
  ports:
    - name: http
      port: 80
      targetPort: http
