# लैब 13. Deployment टेम्पलेट: क्या चलाना है और कितनी प्रतियों में।
#
# templates/ में मौजूद फाइलें ड्राफ्ट हैं, तैयार मैनिफेस्ट नहीं। Helm उनमें मान भरता है
# और परिणाम क्लस्टर को सौंपता है: `helm template main chart` कुछ भी लागू किए बिना तैयार टेक्स्ट
# दिखाता है, `helm install main chart` — उसे लागू करता है।
#
# दोहरे घुंघराले कोष्ठक प्रतिस्थापन के स्थान हैं। उनके भीतर मिलते हैं:
#   .Values.नाम   — किसी पैरामीटर का मान: values.yaml से, अगर ग्राहक ने उसे नहीं छुआ,
#                   या डैशबोर्ड के ऑर्डर फ़ॉर्म से, अगर उसने अपना चुना;
#   .Release.Name — रिलीज़ का नाम, यानी चार्ट के किसी विशिष्ट परिनियोजन का नाम।
# कोष्ठकों के बाहर का टेक्स्ट मैनिफेस्ट में जैसा है वैसा ही जाता है।
apiVersion: apps/v1
kind: Deployment
metadata:
  # ऑब्जेक्ट के नाम रिलीज़ के नाम से बनाए जाते हैं, हार्डकोड नहीं किए जाते। एक ही चार्ट को
  # एक namespace में एक से अधिक बार परिनियोजित किया जाता है, और एक स्थिर नाम का अर्थ होता कि
  # दूसरा ऑर्डर पहले को अधिलेखित कर देता। रिलीज़ `main` एक Deployment, Service और ConfigMap देता है
  # जिनका नाम `main` है — नाम से तुरंत साफ़ हो जाता है कि ये एक ही समूह हैं।
  name: {{ .Release.Name }}
  # लेबल: name इस एप्लिकेशन के सभी ऑर्डरों के लिए एक जैसा होता है, instance ऑर्डरों में अंतर करता है।
  # इनके ज़रिये ऑब्जेक्ट एक-दूसरे को ढूँढते हैं, और इन्हीं से `kubectl get` का आउटपुट छाना जाता है।
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # कितनी प्रतियाँ चालू रखनी हैं। अगर कोई प्रति गायब हो जाए, तो क्लस्टर बिना पूछे एक नई
  # बना देता है — इसीलिए बिना ड्यूटी पर तैनात एडमिनिस्ट्रेटर के स्व-उपचार।
  replicas: {{ .Values.replicas }}
  # selector Deployment को बताता है कि किन पॉड्स को अपना माने — लेबल से, नाम से नहीं।
  # यहाँ के लेबल और template.metadata.labels के लेबल का मेल होना ज़रूरी है। अगर वे भिन्न हुए —
  # Deployment अपनी ही प्रतियों को नहीं ढूँढ पाता और उन्हें बार-बार बनाता रहता है।
  selector:
    matchLabels:
      app.kubernetes.io/name: guest-pass
      app.kubernetes.io/instance: {{ .Release.Name }}
  # template — पॉड का खाका। नीचे जो कुछ है वह खुद Deployment का नहीं, बल्कि उन एप्लिकेशन प्रतियों
  # का वर्णन करता है जिन्हें वह इस खाके से बनाता है।
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guest-pass
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # पॉड की एनोटेशन में कॉन्फ़िगरेशन का हैश। इसके बिना ConfigMap में बदलाव पॉड्स को
        # पुनः आरंभ नहीं करता, और नया टेक्स्ट तब तक नहीं आता जब तक कोई उन्हें हाथ से न हटाए।
        # यह चार्ट्स के बारे में आम तौर पर सबसे लगातार आने वाली शिकायत है।
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # एप्लिकेशन root के रूप में नहीं और छँटे हुए विशेषाधिकारों के साथ चलता है। कैटलॉग से लिया गया चार्ट
      # दूसरे टेनेंट अपने namespace में परिनियोजित करते हैं, और कंटेनर के विशेषाधिकार उसका हिस्सा हैं
      # जो आप एप्लिकेशन के साथ उन्हें देने का वादा करते हैं।
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # इमेज टेम्पलेट में लिखी है और जानबूझकर पैरामीटर के रूप में बाहर नहीं निकाली गई: ग्राहक
          # आकार और टेक्स्ट चुनता है, पर खुद एप्लिकेशन को किसी मनमाने से नहीं बदलता।
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # इस वेरिएबल के बिना nginx नोड के हर कोर पर एक वर्कर प्रोसेस उठाता है।
          # कई दर्जन कोर वाले नोड पर उनकी संख्या दर्जनों हो जाएगी, और सौ मेगाबाइट मेमोरी लिमिट
          # वाला पॉड पहले अनुरोध से पहले ही OOMKilled के साथ मर जाएगा। चार्ट दूसरे टेनेंट में जाता है,
          # जहाँ नोड कुछ भी हो सकते हैं, इसलिए यहाँ यह अनिवार्य है।
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # कंटेनर के भीतर का पोर्ट। http नाम आगे प्रोब में और Service में इस्तेमाल होता है,
          # ताकि पोर्ट नंबर तीन जगह नहीं, एक जगह लिखा हो।
          ports:
            - containerPort: 8080
              name: http
          # requests — कितना गारंटीड आवंटित करना है, इन्हीं संख्याओं से शेड्यूलर नोड चुनता है।
          # limits यहाँ केवल मेमोरी पर हैं: पार किया — कंटेनर को मार दिया जाता है
          # और फिर से उठाया जाता है। CPU पर लिमिट जानबूझकर नहीं है, वरना एप्लिकेशन धीमे चलने के बजाय
          # छत से टकरा जाता है।
          # फ़िल्टर `| quote` प्रतिस्थापित मान को उद्धरण चिह्नों में लपेटता है: उपयोगकर्ता
          # 1 दर्ज कर सकता है, और उद्धरण चिह्नों के बिना मैनिफेस्ट में वहाँ संख्या चली जाती जहाँ
          # "1" या "100m" जैसी प्रविष्टि अपेक्षित होती है।
          resources:
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
            limits:
              memory: {{ .Values.resources.memory | quote }}
          # readinessProbe — प्रश्न «अनुरोध स्वीकार करने के लिए तैयार?»। जब तक /healthz उत्तर न दे,
          # Service इस प्रति पर ट्रैफ़िक नहीं भेजता। इसीलिए बिना व्यवधान के अपडेट: पुरानी
          # प्रति को बैलेंसिंग से तब हटाया जाता है जब नई प्रति उत्तर दे चुकी हो।
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          # पेज और nginx कॉन्फ़िग ConfigMap से फाइलों के रूप में जोड़े जाते हैं। subPath ठीक
          # एक फाइल प्रतिस्थापित करता है: इसके बिना माउंट की गई डायरेक्टरी पूरे /etc/nginx/
          # conf.d को बदल देती और इमेज की मानक सेटिंग्स गायब हो जातीं।
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      # ConfigMap का नाम रिलीज़ के नाम से बना है, इसलिए पॉड हमेशा अपने ही ऑर्डर की
      # कॉन्फ़िगरेशन माउंट करता है, पड़ोसी की नहीं।
      volumes:
        - name: page
          configMap:
            name: {{ .Release.Name }}
        - name: conf
          configMap:
            name: {{ .Release.Name }}
