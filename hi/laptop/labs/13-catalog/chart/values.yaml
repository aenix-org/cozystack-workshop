# लैब 13. «पास» चार्ट के लिए डिफ़ॉल्ट मान।
#
# ये उन सवालों के जवाब हैं जो चार्ट डिप्लॉयमेंट के समय पूछता है: कितनी रेप्लिका, पेज पर
# क्या टेक्स्ट रहेगा, बाहरी पते की ज़रूरत है या नहीं। इन्हें यहाँ «कुछ भी नहीं चुना गया» वाली
# स्थिति के लिए दर्ज किया गया है। जो कोई ऐप्लिकेशन ऑर्डर करता है वह इन्हें ओवरराइड करता है:
# डैशबोर्ड में — फ़ॉर्म फ़ील्ड से, टर्मिनल में — `--set replicas=5` फ़्लैग या अपनी फ़ाइल
# `helm install ... -f my.yaml` से। इस फ़ाइल में बदलाव भविष्य के ऑर्डरों के डिफ़ॉल्ट बदलता है,
# पहले से डिप्लॉय किए गए के लिए नहीं।
#
# यहाँ के मान डैशबोर्ड में ऑर्डर फ़ॉर्म में कैसे बदलते हैं:
#   प्रकार      — कौन-सा फ़ील्ड दिखाना है: {int} एक संख्या, {bool} एक टॉगल,
#                {string} एक टेक्स्ट इनपुट, {struct} फ़ील्ड्स का एक नेस्टेड समूह;
#   विवरण      — फ़ील्ड का लेबल और उसके नीचे का संकेत;
#   =मान       — फ़ॉर्म खुलने पर फ़ील्ड में पहले से क्या है;
#   आवश्यकता   — स्कीमा में required सूची से तय होती है। यहाँ ऐसी कोई सूची नहीं है: हर
#                पैरामीटर का एक डिफ़ॉल्ट मान है, इसलिए किसी भी फ़ील्ड को छोड़ा जा सकता है।
# इसीलिए विवरण अंग्रेज़ी में लिखे जाते हैं: इन्हें केवल चार्ट का लेखक ही नहीं, बल्कि हर वह व्यक्ति
# पढ़ता है जो डैशबोर्ड में ऐप्लिकेशन ऑर्डर करता है।

## `## @param` जैसे कमेंट सजावट नहीं हैं। इनके आधार पर Cozystack जनरेटर
## (cozyvalues-gen) values.schema.json और README में पैरामीटर तालिका बनाता है।
## प्रारूप: ## @param {प्रकार} नाम=डिफ़ॉल्ट-मान - विवरण।

# ऐप्लिकेशन की कितनी रेप्लिका चालू रखनी हैं। एक रेप्लिका का मतलब है नोड के रीस्टार्ट के
# दौरान डाउनटाइम; दो में से कोई एक खो जाए तो भी काम चलता रहता है।
## @param {int} replicas=2 - Number of application replicas.
replicas: 2

# मुख्य पेज पर टेक्स्ट। इसे पैरामीटर के रूप में रखा गया है क्योंकि हर सहायक कंपनी का अपना
# टेक्स्ट होता है, और इसके लिए कोई अलग इमेज नहीं बनाएगा।
## @param {string} greeting=Order a pass for your guest - Text shown on the main page.
greeting: "Order a pass for your guest"

# ऐप्लिकेशन को क्लस्टर के बाहर पते की ज़रूरत है या नहीं। Cozystack कैटलॉग की परिपाटी:
# external नाम वाला फ़ील्ड सभी ऐप्लिकेशनों के लिए एक ही बात का मतलब रखता है — बाहरी पहुँच।
## @param {bool} external=false - Enable external access from outside the cluster.
external: false

# एक रेप्लिका का आकार। इसे फ़ील्ड्स के अलग समूह के रूप में रखा गया है ताकि ऑर्डर फ़ॉर्म में
# यह दो असंबद्ध फ़ील्डों के बजाय एक «संसाधन» ब्लॉक जैसा दिखे।
## @typedef {struct} Resources - CPU and memory for each replica.
## @field {quantity} cpu - CPU available to each replica.
## @field {quantity} memory - Memory (RAM) available to each replica.

## @param {Resources} resources - Explicit CPU and memory configuration.
resources:
  cpu: 100m
  memory: 128Mi
