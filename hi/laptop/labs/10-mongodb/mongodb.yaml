# लैब 10 · अलग-अलग तरह के पास के लिए MongoDB डेटाबेस ऑर्डर करना।
# आप क्या पाना चाहते हैं इसका विवरण; प्लेटफ़ॉर्म सेवा को असेंबल और कॉन्फ़िगर करता है।
# वही चीज़ जो आप डैशबोर्ड में माउस से ऑर्डर करते — बस टेक्स्ट के रूप में।
# लैब क्लस्टर में नहीं, बल्कि मैनेजमेंट क्लस्टर पर एक टेनेंट में लागू किया जाता है:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f mongodb.yaml
#
# लागू करने से पहले: tenant-workshopXX को अपने namespace से बदलें,
# और ЗдесьВашПароль को उस पासवर्ड से जो आप सोचेंगे।
apiVersion: apps.cozystack.io/v1alpha1
kind: MongoDB
metadata:
  name: passes
  namespace: tenant-workshopXX
spec:
  # एक ही प्रति। MongoDB तीन की रेप्लिका सेट के लिए बनाया गया है: वे वोट करते हैं कि कौन
  # प्राइमरी है, और एक के खोने पर भी बचे रहते हैं। एक ही प्रति के साथ वोट करने के लिए कोई नहीं होता,
  # और चार्ट इसके लिए एक अलग «असुरक्षित» मोड चालू करता है। लैब के लिए ठीक है,
  # प्रोडक्शन के लिए नहीं।
  replicas: 1
  # डेटा के लिए डिस्क। चार शिक्षण दस्तावेज़ों के लिए एक मेगाबाइट भी काफ़ी होगा, पर वॉल्यूम को
  # बाद में बढ़ाने की तुलना में शुरू में उदारता से आकार देना आसान है।
  size: 5Gi
  # replicated — ऐसे वॉल्यूम जिनकी एक प्रति क्लस्टर के दूसरे नोड पर होती है: नोड बाहर हो जाए,
  # डेटा बना रहता है।
  storageClass: replicated
  # डेटाबेस पॉड को आवंटित CPU और मेमोरी। चार दस्तावेज़ों के लिए ज़रूरत से ज़्यादा।
  resourcesPreset: s1.small
  # MongoDB शाखा। लाइव डेटाबेस पर बाद में इसे बदलना अपग्रेड के बिना संभव नहीं है।
  version: v8
  # false — डेटाबेस केवल क्लस्टर के अंदर से पहुँचा जा सकता है, बाहर की ओर कोई पोर्ट नहीं खोला जाता।
  # आप इसे साथ में शुरू किए गए वर्किंग पॉड से एक्सेस करेंगे।
  external: false
  # शार्डिंग डेटा को कई सर्वरों के सेटों में बाँट देती है। तब ज़रूरी होती है जब
  # डेटा एक सर्वर पर न समाए; चार पास समा जाते हैं।
  sharding: false
  # डेटाबेस उपयोगकर्ता और उसका पासवर्ड। अपना पासवर्ड खुद सोचें और याद रखें: यह वर्किंग पॉड को
  # (MONGO_URI कनेक्शन स्ट्रिंग में) और जाँच स्क्रिप्ट को
  # (MONGO_PASSWORD वैरिएबल) चाहिए। खाता सेवा डेटाबेस admin में बनाया जाता है —
  # इसीलिए कनेक्शन स्ट्रिंग में authSource=admin अनिवार्य है।
  users:
    passapp:
      password: ЗдесьВашПароль
  # passes डेटाबेस और उसमें अनुमतियाँ: passapp उपयोगकर्ता को इस डेटाबेस की admin भूमिका दी गई है,
  # यानी वह पढ़ सकता है, लिख सकता है, इंडेक्स बना सकता है और कलेक्शन सेटिंग्स बदल सकता है।
  # यह अन्य डेटाबेस के अधिकार नहीं देता।
  databases:
    passes:
      roles:
        admin:
          - passapp
  # ऑब्जेक्ट स्टोरेज में बैकअप। शिक्षण स्टैंड पर बंद हैं।
  backup:
    enabled: false
