---
# लैब 5 · Git में इंफ्रास्ट्रक्चर। स्वयं «गेस्ट पास» सेवा: एक ही फ़ाइल में चार ऑब्जेक्ट।
#
# क्लस्टर में हाथ से लागू नहीं किया जाता। फ़ाइल को GitHub पर अपनी अलग रिपॉज़िटरी में, apps/
# फ़ोल्डर में, namespace.yaml के बगल में रखा जाता है, और Flux उसे `lab` क्लस्टर में स्वयं ले जाता है:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# --- रेखा ऑब्जेक्ट्स को अलग करती है: एक फ़ाइल, चार स्वतंत्र ऑब्जेक्ट। फ़ाइल में क्रम
# बनने के क्रम को प्रभावित नहीं करता — क्लस्टर स्वयं इसे संभाल लेगा।
#
# हर ऑब्जेक्ट में: apiVersion — विवरण स्कीमा का संस्करण, kind — हम क्या बना रहे हैं,
# metadata.name — ऑब्जेक्ट का नाम, metadata.namespace — क्लस्टर के किस विभाजन में वह
# रहता है। आगे इन फ़ील्ड्स की अलग से व्याख्या नहीं की जाती।
#
# चारों में से किसी भी ऑब्जेक्ट में न कोई पासवर्ड है, न कुंजी, न टोकन, और यह
# संयोग नहीं है: Git में जो पहुँच गया वह वहाँ हमेशा के लिए रहता है — इतिहास फिर से लिखा जा सकता है, पर
# जिन सबने पहले क्लोन कर लिया उनके पास पुरानी प्रति बनी रहती है। रहस्यों की यहाँ जगह नहीं।

# --- 4 में से 1. वेब सर्वर सेटिंग्स --------------------------------------------------
# ConfigMap एक टेक्स्ट फ़ाइल को एप्लिकेशन से अलग क्लस्टर में रखता है, और नीचे (volumes
# खंड में) यह फ़ाइल कंटेनर के भीतर माउंट की जाती है। मतलब — इमेज को दोबारा बनाए बिना
# सेटिंग्स बदलना: यहाँ संपादित करें, कमिट करें, और एक मिनट बाद क्लस्टर में नया संस्करण होता है।
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-conf
  namespace: passes
# data के भीतर की कुंजी कंटेनर में फ़ाइल का नाम बन जाती है: default.conf उस फ़ोल्डर में जाएगा
# जिसे nginx स्टार्टअप पर पढ़ता है। नाम के बाद की ऊर्ध्वाधर रेखा YAML में बहु-पंक्ति
# टेक्स्ट को ज्यों का त्यों, पंक्ति-विरामों को बनाए रखते हुए, लिखने का तरीका है।
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      # रेडीनेस जाँच के लिए पता। क्लस्टर यहाँ दस्तक देता है और जवाब मिलने तक किसी
      # प्रति पर ट्रैफ़िक नहीं भेजता।
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        # परोसे गए पृष्ठ में हम __POD__ को उस मशीन के नाम से बदल देते हैं जहाँ
        # nginx चलता है। पॉड के भीतर मशीन का नाम स्वयं पॉड का नाम होता है।
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
    }
---
# --- 4 में से 2. वह पृष्ठ जो सेवा परोसती है ----------------------------------------
# इस लैब में पृष्ठ एक स्टब है: असली एप्लिकेशन बाद में आएगा। अभी महत्वपूर्ण यह
# नहीं कि सेवा क्या दिखाती है, बल्कि यह कि वह क्लस्टर में कहाँ से आई। मार्कअप में __POD__ टेक्स्ट
# एक प्रतिस्थापन चिह्न है: nginx उसे उस पॉड के नाम से बदल देगा जिसने पृष्ठ परोसा, और उसी
# नाम से आप आगे देखेंगे कि अब एक से अधिक प्रति हो गई हैं।
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-page
  namespace: passes
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>गेस्ट पास</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 40rem;
               color: #222; }
        h1 { font-weight: 600; }
        .v { display: inline-block; padding: .2rem .6rem; border-radius: .3rem;
             background: #eef; font-family: ui-monospace, monospace; }
        .pod { margin-top: 2rem; color: #666; font-size: .9rem; }
        b { font-family: ui-monospace, monospace; color: #222; }
      </style>
    </head>
    <body>
      <h1>«गेस्ट पास» सेवा</h1>
      <p>अतिथि के लिए पास का अनुरोध. संस्करण <span class="v">v1</span></p>
      <p>Git से तैनात किया गया. किसी ने इसे हाथ से नहीं छुआ.</p>
      <div class="pod">सेवा प्रदान करने वाला Pod <b>__POD__</b></div>
    </body>
    </html>
---
# --- 4 में से 3. स्वयं एप्लिकेशन का विवरण -------------------------------------------
# Deployment «एक कंटेनर चलाओ» नहीं है, बल्कि «ऐसे कंटेनर की इतनी प्रतियाँ चलती हुई
# बनाए रखो» है। अंतर तब दिखता है जब कोई प्रति मरती है: क्लस्टर बिना पूछे और बिना सूचित किए
# नई बना देता है। vSphere में सबसे नज़दीकी चीज़ HA है, पर वहाँ मशीन फिर से चालू होती है,
# जबकि यहाँ एप्लिकेशन की प्रति फिर से बनाई जाती है, और यह लगातार होता है, केवल खराबी पर नहीं।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes
  namespace: passes
  labels:
    app: passes
spec:
  # कितनी प्रतियाँ चलती हुई बनाए रखनी हैं। शब्दावली मायने रखती है: «एक चलाओ» नहीं, बल्कि
  # «एक बनाए रखो»। आप इस संख्या को Git के माध्यम से बदलेंगे और देखेंगे कि क्या होता है।
  replicas: 1
  # Deployment अपनी प्रतियों को किस चिह्न से पहचानता है। यह पॉड नामों की सूची नहीं —
  # हर बार फिर से बनने पर नाम बदल जाते हैं — बल्कि शर्त «app: passes लेबल वाले सभी पॉड» है।
  # नीचे template.metadata.labels में लेबल इस शर्त से मेल खाना चाहिए: यदि वे भिन्न हुए
  # तो क्लस्टर मेनिफ़ेस्ट स्वीकार करने से मना कर देगा, क्योंकि प्रतियाँ किसी की नहीं रह जाएँगी।
  selector:
    matchLabels:
      app: passes
  # template — वह साँचा जिससे प्रतियाँ ढाली जाती हैं। भीतर की हर चीज़ एक पॉड का
  # वर्णन करती है। साँचे का संपादन नए संस्करण की तैनाती का अर्थ है: पुरानी प्रतियाँ नई से बदल दी जाती हैं।
  template:
    metadata:
      labels:
        app: passes
    spec:
      # पूरे पॉड के स्तर पर सुरक्षा प्रतिबंध। vSphere में कोई समकक्ष नहीं: वहाँ
      # अलगाव हाइपरवाइज़र देता है, जबकि कंटेनर नोड के साथ कर्नेल साझा करते हैं, इसलिए
      # अनुमतियों को स्पष्ट रूप से घटाना पड़ता है।
      #   runAsNonRoot   यदि इमेज root के रूप में चलना चाहे तो शुरू न करें
      #   runAsUser      किस संख्यात्मक उपयोगकर्ता के रूप में चलना है; 65532 — न्यूनतम इमेजों में
      #                  स्वीकृत «गैर-विशेषाधिकार प्राप्त» पहचानकर्ता
      #   seccompProfile कौन-से सिस्टम कॉल की अनुमति है; RuntimeDefault — एक समूह
      #                  जो स्पष्ट रूप से ख़तरनाक को काट देता है और कुछ नहीं तोड़ता
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # वही प्रतिबंध, पर अब एक विशिष्ट कंटेनर पर।
          #   allowPrivilegeEscalation: false  प्रक्रिया स्वयं को और अधिकार नहीं दिला पाएगी
          #   capabilities.drop: ["ALL"]       कर्नेल के सभी विशेष विशेषाधिकार छीन लें
          #                                    (नेटवर्क बदलना, माउंट करना, समय बदलना);
          #                                    वेब सर्वर को इनमें से कोई नहीं चाहिए
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # इमेज सार्वजनिक रजिस्ट्री से ली जाती है — अगली लैब में सुरक्षा इसे मना करेगी, और
          # पता बदलकर हमारे अपने Harbor का हो जाएगा। unprivileged प्रकार सुंदरता के लिए नहीं चुना गया:
          # सामान्य nginx इमेज पोर्ट 80 पर सुनती है और इसके लिए root अधिकार चाहती है, और ऊपर
          # runAsNonRoot के साथ वह बिल्कुल शुरू ही नहीं होती।
          # संस्करण स्थिर किया गया है (1.27-alpine), latest नहीं: अन्यथा वही
          # मेनिफ़ेस्ट कल कोई और एप्लिकेशन तैनात कर देगा, और आपको इसका पता नहीं चलेगा।
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # वह पोर्ट जिस पर एप्लिकेशन सुनता है। नाम `http` सजावट नहीं है: इसका संदर्भ
          # नीचे रेडीनेस जाँच और फ़ाइल के अंत में Service देते हैं। यदि आप पोर्ट
          # संख्या बदलें, तो उसे एक जगह बदलना होगा, तीन में नहीं।
          ports:
            - containerPort: 8080
              name: http
          # requests — कितने संसाधन निश्चित रूप से आरक्षित हैं; इसी संख्या से
          # शेड्यूलर नोड चुनता है। limits — वह सीमा जिसके ऊपर अनुमति नहीं दी जाएगी।
          # requests को कम आँकने का अर्थ है कि नोड पर उससे ज़्यादा समा जाएगा जितना वह झेल सकता है;
          # मेमोरी limit पार करने पर — कंटेनर मार दिया जाता है, CPU पार करने पर — उसे धीमा किया जाता है।
          # 20m = एक कोर का बीस हज़ारवाँ, Mi = मेगाबाइट। यहाँ मान छोटे हैं
          # क्योंकि लैब में एकमात्र, छोटा नोड है।
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # रेडीनेस जाँच: क्लस्टर इस पते पर दस्तक देता है और जवाब मिलने तक किसी प्रति पर
          # ट्रैफ़िक नहीं भेजता। इसके बिना Service उस nginx को अनुरोध भेज देता
          # जो अभी उठा ही नहीं, और उपयोगकर्ता हर तैनाती पर त्रुटि देखता।
          # Flux भी इसका इंतज़ार करता है — kustomization.yaml में हमने wait: true माँगा था।
          #   initialDelaySeconds  पहली दस्तक से पहले प्रतीक्षा, प्रक्रिया को शुरू होने का समय दें
          #   periodSeconds        उसके बाद कितनी बार दस्तक देनी है
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # फ़ाइल की शुरुआत के दो ConfigMap की सामग्री को कंटेनर के भीतर कहाँ रखना है।
          # /etc/nginx/conf.d — वह फ़ोल्डर जिससे nginx स्टार्टअप पर सेटिंग्स पढ़ता है,
          # /usr/share/nginx/html — वह फ़ोल्डर जिससे वह फ़ाइलें परोसता है।
          # इमेज स्वयं नहीं बदलती: फ़ाइलें उसमें शुरू होने के क्षण प्रकट होती हैं।
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: page
              mountPath: /usr/share/nginx/html
      # ठीक क्या माउंट करना है। नाम conf और page आंतरिक हैं, वे इस
      # ब्लॉक को ऊपर के volumeMounts से जोड़ते हैं; configMap के भीतर name पहले से ही क्लस्टर में एक असली
      # ऑब्जेक्ट का नाम है। इसमें गलती करें और पॉड एक अनुपस्थित ConfigMap की प्रतीक्षा में अटका रहेगा।
      volumes:
        - name: conf
          configMap:
            name: passes-conf
        - name: page
          configMap:
            name: passes-page
---
# --- 4 में से 4. एक स्थायी नाम जिसके पीछे सभी प्रतियाँ खड़ी हैं ----------------------
# पॉड फिर से बनाए जाते हैं, और उनके पते हर बार नए होते हैं। Service एक अपरिवर्तनीय नाम देता है —
# passes.passes.svc.cluster.local — जिससे क्लस्टर के भीतर आप हमेशा जीवित
# प्रतियों तक पहुँच सकते हैं। यह आंतरिक लोड बैलेंसिंग है; क्लस्टर के बाहर से यहाँ अभी नहीं पहुँचा जा सकता।
apiVersion: v1
kind: Service
metadata:
  name: passes
  namespace: passes
spec:
  # Service का पॉड से संबंध पतों की सूची नहीं, बल्कि शर्त «app: passes लेबल वाले सभी पॉड» है।
  # ऐसे लेबल वाली नई प्रति प्रकट हुई — वह स्वयं लोड बैलेंसिंग में आ गई, कुछ
  # पंजीकृत करने की ज़रूरत नहीं। लुप्त हुई — उसे पूल से हटा दिया गया।
  selector:
    app: passes
  # port — किस पोर्ट पर स्वयं Service जवाब देता है, targetPort — वह कहाँ कंटेनर के
  # भीतर अग्रेषित करता है। यहाँ targetPort ऊपर के ports ब्लॉक से नाम `http` का संदर्भ देता है,
  # संख्या का नहीं: संख्या एक जगह बदली जा सकती है, और संबंध नहीं टूटेगा।
  ports:
    - port: 80
      targetPort: http
