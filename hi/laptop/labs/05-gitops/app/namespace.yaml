---
# लैब 5 · Git में इंफ्रास्ट्रक्चर। «Пропуск» सेवा के लिए नेमस्पेस।
#
# यह फ़ाइल क्लस्टर पर हाथ से लागू नहीं की जाती। आप इसे GitHub पर अपनी रिपॉज़िटरी में,
# apps/ फ़ोल्डर में रखते हैं, और Flux इसे `lab` क्लस्टर में ले जाता है — खुद, एक शेड्यूल पर:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# किसी भी मैनिफ़ेस्ट को कैसे पढ़ें: apiVersion — विवरण स्कीमा का संस्करण (इससे क्लस्टर जानता है
# कि इसे कैसे पार्स करना है), kind — हम क्या बना रहे हैं, metadata.name — वह नाम जिससे ऑब्जेक्ट को बाद में
# खोजा जाता है। ये तीन फ़ील्ड हर ऑब्जेक्ट में मौजूद होते हैं और नीचे अलग से नहीं समझाए जाते।
#
# नेमस्पेस (namespace) — एक ही क्लस्टर के भीतर एक तार्किक विभाजन:
# अपना नाम-क्षेत्र, अपने अधिकार, अपने कोटा। vSphere में इसके सबसे निकट vCenter वृक्ष में एक फ़ोल्डर
# या एक resource pool है।
#
# यह एप्लिकेशन के साथ Git में क्यों रहता है, हाथ से क्यों नहीं बनाया जाता: जब सेवा
# रिपॉज़िटरी से चली जाएगी, Flux नेमस्पेस को भी हटा देगा। कोई खाली विभाजन पीछे नहीं बचेगा,
# जिसके बारे में आधे साल बाद कोई याद नहीं रखेगा कि इसे क्यों बनाया गया था।
apiVersion: v1
kind: Namespace
metadata:
  name: passes
  # यह लेबल सेवा के काम करने पर असर नहीं डालता — यह इसलिए ज़रूरी है कि एक ही कमांड से वह सब कुछ मिल जाए,
  # जो «Пропуск» से संबंधित है: kubectl get all -A -l app.kubernetes.io/part-of=passes.
  # part-of नाम Kubernetes के सर्वस्वीकृत लेबल-समूह से लिया गया है, हमारे द्वारा गढ़ा नहीं गया:
  # बाहरी उपकरण (मॉनिटरिंग, एक्सपोर्ट) ठीक इसी को खोजते हैं।
  labels:
    app.kubernetes.io/part-of: passes
