---
# लैब 5 · Git में इंफ्रास्ट्रक्चर। कार्य: रिपॉज़िटरी से वास्तव में क्या क्लस्टर पर लागू करना है।
#
# आपके `lab` क्लस्टर पर पड़ोसी gitrepository.yaml के साथ लागू किया जाता है:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# हर ऑब्जेक्ट में: apiVersion — विवरण स्कीमा का संस्करण, kind — हम क्या बनाते हैं,
# metadata.name — ऑब्जेक्ट का नाम। इन्हें नीचे अलग से नहीं समझाया गया है।
#
# ज़िम्मेदारियों का विभाजन: GitRepository रिपॉज़िटरी डाउनलोड करता है और कुछ भी लागू नहीं करता,
# यह ऑब्जेक्ट डाउनलोड की गई चीज़ लेता है और क्लस्टर को उसके अनुरूप लाता है। Kustomization नाम
# kustomize उपयोगिता के नाम से मेल खाता है, पर ये अलग चीज़ें हैं — यहाँ यह क्लस्टर में एक ऑब्जेक्ट है।
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passes
  # वहीं रहता है जहाँ Flux की सेवाएँ — वरना kustomize-controller इसे नहीं उठाएगा।
  namespace: flux-system
spec:
  # क्लस्टर की वास्तविक स्थिति की तुलना Git में वर्णित स्थिति से कितनी बार करनी है।
  # यह «हर मिनट फिर से लागू करना» नहीं है — यह «हर मिनट तुलना करना और
  # भिन्नताओं को ठीक करना» है। भले ही Git में कुछ न बदला हो, kubectl edit के ज़रिए हाथ से
  # की गई कोई तब्दीली चुपचाप वापस पलट दी जाएगी। यह अंतर आप लैब में थोड़ा आगे तब देखेंगे,
  # जब आप खुद Git को दरकिनार कर क्लस्टर में कुछ बदलेंगे।
  interval: 1m
  # रिपॉज़िटरी के अंदर का फ़ोल्डर। इसमें जो कुछ भी है वह क्लस्टर में जाएगा; इसके बगल की फ़ाइलें —
  # उदाहरण के लिए रूट में README.md — छुई नहीं जाएँगी। नाम `apps` हमने चुना है, पर यह
  # उस फ़ोल्डर से मेल खाना चाहिए जिसमें आप अपनी रिपॉज़िटरी में मैनिफ़ेस्ट रखते हैं।
  path: ./apps
  # क्लस्टर से उन ऑब्जेक्ट्स को हटाना जो Git से गायब हो चुके हैं।
  # इसके बिना Git पूर्ण विवरण नहीं रह जाता: रिपॉज़िटरी से हटाई गई चीज़
  # क्लस्टर में चलती रहती और किसी को इसका पता न चलता।
  prune: true
  # किस स्रोत को देखना है। नाम `passes` gitrepository.yaml का metadata.name है,
  # GitHub पर रिपॉज़िटरी का नाम नहीं। वहाँ नाम बदलें — यहाँ भी सुधारें, वरना Flux
  # एक ऐसे स्रोत का इंतज़ार करता रहेगा जो मौजूद ही नहीं, और Kustomization तैयार नहीं होगा।
  sourceRef:
    kind: GitRepository
    name: passes
  # apply के तुरंत बाद रिपोर्ट देने के बजाय लागू किए गए संसाधनों के तैयार होने का इंतज़ार करना।
  # अंतर ठीक वही है जो «आवेदन भेज दिया» और «आवेदन पूरा हुआ» के बीच होता है: wait के बिना
  # Flux सफलता की सूचना दे देगा, भले ही उसके बाद पॉड्स ऊपर न आएँ।
  wait: true
  # इस तैयारी के लिए कितनी देर इंतज़ार करना है, इससे पहले कि लागू करना असफल घोषित हो।
  # तीन मिनट — खाली नोड पर इमेज खींचने के लिए गुंजाइश समेत। बहुत छोटा
  # मान धीमे नेटवर्क पर झूठी असफलताएँ देगा, बहुत बड़ा — आप स्पष्ट त्रुटि के बजाय
  # देर तक «प्रक्रिया जारी है» देखते रहेंगे।
  timeout: 3m
