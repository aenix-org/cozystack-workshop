---
# लैब 6 · आपकी अपनी निजी इमेज रजिस्ट्री। मैनिफ़ेस्ट का कार्यशील (WORKING) संस्करण।
#
# यह वही फ़ाइल है जो passes-broken.yaml है, साथ में एक जगह जो वहाँ नहीं थी —
# उसे नीचे «यही चीज़ नहीं थी» शब्दों से चिह्नित किया गया है। इसे तब लागू करें जब आपने
# टूटे हुए संस्करण पर विफलता देख ली हो और समझ लिया हो कि वह क्यों हुई।
#
# इसे आपके `lab` क्लस्टर पर लागू किया जाता है (Cozystack प्रबंधन क्लस्टर पर नहीं — वहाँ
# केवल Harbor ही रहता है), डिफ़ॉल्ट नेमस्पेस में:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl delete -f passes-broken.yaml
#     kubectl apply -f passes.yaml
#
# ध्यान दें: HARBOR-HOST एक प्लेसहोल्डर है, कार्यशील पता नहीं। लागू करने से पहले अपने
# Harbor का पता डालें; स्ट्रिंग HARBOR-HOST फ़ाइल में दो बार आती है, sed दोनों को बदल देगा:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # macOS
#
# नीचे के ऑब्जेक्ट्स में: apiVersion — विवरण स्कीमा का संस्करण, kind — हम क्या बना रहे हैं,
# metadata.name — ऑब्जेक्ट का नाम। इन्हें आगे अलग से नहीं समझाया गया है।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # दो प्रतियाँ, एक नहीं: इस तरह सेवा के उत्तर में दिखेगा कि अनुरोधों को
  # अलग-अलग पॉड संभालते हैं, और कि इमेज नोड पर एक बार डाउनलोड हुई पर शुरू दो बार हुई।
  replicas: 2
  # शर्त «मेरी प्रतियाँ — app: passes-api लेबल वाले पॉड हैं»। नीचे पॉड टेम्पलेट में लेबल
  # इसके साथ मेल खाना चाहिए, वरना क्लस्टर मैनिफ़ेस्ट को अस्वीकार कर देगा।
  selector:
    matchLabels:
      app: passes-api
  # वह टेम्पलेट जिससे प्रतियाँ छापी जाती हैं। इसके भीतर का सब कुछ एक पॉड का वर्णन करता है।
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # पूरे पॉड पर सुरक्षा प्रतिबंध: root से न चलाएँ, अनविशेषाधिकृत (unprivileged)
      # उपयोगकर्ता 10001 के रूप में काम करें, सिस्टम कॉल के सेट को मानक प्रोफ़ाइल तक
      # सीमित करें। इमेज ठीक इसी के लिए बनाई गई है (देखें app/Dockerfile, USER लाइन)।
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # passes-broken.yaml में यही चीज़ नहीं थी — ये दो लाइनें, और कुछ नहीं।
      #
      # बंद रजिस्ट्री हर किसी को इमेज नहीं देती: पहले अपनी पहचान बतानी होती है। सीक्रेट `harbor`
      # (टाइप kubernetes.io/dockerconfigjson) रजिस्ट्री का पता, लॉगिन और पासवर्ड रखता है; आपने
      # इसे kubectl create secret docker-registry कमांड से बनाया। यहाँ सीक्रेट को केवल नाम से
      # संदर्भित किया गया है — इसे वहाँ से एप्लिकेशन नहीं बल्कि नोड पर kubelet उस
      # क्षण लेता है जब वह इमेज डाउनलोड करने जाता है। इसलिए सीक्रेट उसी
      # नेमस्पेस में होना चाहिए जिसमें पॉड है: kubelet इसे ठीक वहीं ढूँढता है और कहीं नहीं।
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # कंटेनर स्तर के अधिकार: अपने लिए अतिरिक्त विशेषाधिकार न लें और सभी विशेष
          # कर्नेल क्षमताएँ छोड़ दें। एप्लिकेशन को एक नेटवर्क पोर्ट चाहिए, बाकी अनावश्यक है।
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # इमेज नाम का पहला हिस्सा रजिस्ट्री का पता है, और ठीक इसीलिए अपनी रजिस्ट्री पर
          # जाने से मैनिफ़ेस्ट बदलते हैं: इमेज का नाम भिन्न हो जाता है। यदि शुरू में पता न
          # होता, तो क्लस्टर इमेज के लिए Docker Hub जाता, और सुरक्षा ने यही मना किया।
          image: HARBOR-HOST/passes/passes-api:v1
          # एप्लिकेशन पोर्ट। नाम `http` को आगे रेडीनेस प्रोब और Service उपयोग करते हैं,
          # इसलिए पोर्ट नंबर एक ही जगह तय है, तीन जगह नहीं।
          ports:
            - containerPort: 8080
              name: http
          # पर्यावरण चर, जिनसे एप्लिकेशन जानता है कि वह कौन है और कहाँ से आया।
          # ठीक इन्हीं को वह उत्तर में छापता है (देखें app/main.go, identity स्ट्रक्चर)।
          # APP_VERSION और IMAGE_REGISTRY टेक्स्ट के रूप में दिए गए हैं — इन्हें हम स्वयं लिखते हैं।
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # आगे — Downward API: क्लस्टर स्वयं चरों में वह डालता है जो वह पॉड के बारे में जानता है।
            # एप्लिकेशन को न अपना नाम अनुमान लगाना है, न इसके लिए क्लस्टर API जाना है,
            # न अपने साथ ऐसे अनुरोध के अधिकार ढोने हैं। मान प्रति के शुरू होने के
            # क्षण भरे जाते हैं, इसलिए हर प्रति के अपने होते हैं।
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — प्रति के लिए क्या आरक्षित करना है: इन संख्याओं से शेड्यूलर नोड चुनता
          # है। limits — छत: मेमोरी छत से ऊपर जाने पर कंटेनर को मार दिया जाता है, CPU के
          # लिए उसे धीमा किया जाता है। 16Mi इसलिए काफ़ी है क्योंकि एप्लिकेशन बिना निर्भरता
          # वाला Go में है और मेमोरी में लगभग कुछ नहीं रखता; JVM को दो गुना अधिक परिमाण
          # चाहिए होता। 20m — CPU कोर का बीस हज़ारवाँ हिस्सा।
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # रेडीनेस प्रोब: जब तक एप्लिकेशन /healthz पर उत्तर नहीं देता, Service इस प्रति पर
          # ट्रैफ़िक नहीं भेजेगा। नए संस्करण की रोलआउट पर पुरानी प्रति को लोड
          # बैलेंसिंग से केवल तभी हटाया जाता है जब नई ने उत्तर दे दिया हो, — इसलिए अनुरोध
          # ऐसे प्रोसेस पर विफल नहीं होते जो अभी शुरू नहीं हुआ।
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# एक स्थायी नाम जिसके पीछे दोनों प्रतियाँ खड़ी हैं। पॉड फिर से बनते हैं और पते बदलते हैं,
# नाम passes-api.default.svc.cluster.local नहीं बदलता। इस ऑब्जेक्ट के बिना एप्लिकेशन
# काम करता है, पर क्लस्टर के भीतर उस तक पहुँचने का कोई ज़रिया नहीं — और check.sh की जाँच
# ठीक यहीं आती है, पॉड में नहीं।
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # पॉड्स से संबंध — पतों की सूची नहीं, बल्कि लेबल पर एक शर्त है। app: passes-api लेबल
  # वाली नई प्रति स्वयं लोड बैलेंसिंग में आ जाती है, उसे पंजीकृत करना ज़रूरी नहीं।
  selector:
    app: passes-api
  # port — किस पोर्ट पर स्वयं Service उत्तर देता है; targetPort ऊपर ports ब्लॉक के
  # नाम `http` को संदर्भित करता है, नंबर को नहीं, इसलिए नंबर बदलने पर संबंध नहीं टूटेगा।
  ports:
    - port: 80
      targetPort: http
