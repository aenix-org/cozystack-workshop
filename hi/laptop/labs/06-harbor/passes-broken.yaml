---
# लैब 6 · आपका अपना निजी इमेज रजिस्ट्री। यह फ़ाइल जानबूझकर अधूरी है।
#
# यह काम नहीं करेगी, और यह जानबूझकर है: आपको विफलता अपनी आँखों से देखनी चाहिए और खुद
# समझना चाहिए कि क्लस्टर के पास क्या कमी थी। यहाँ एक ही चीज़ की कमी है — वह चीज़ जो
# क्लस्टर किसी बंद रजिस्ट्री को अपने बारे में बताता है जब वह इमेज लेने आता है। रजिस्ट्री
# किसी को भी इमेज नहीं देती, और इस विवरण में ऐसा कुछ नहीं है जो क्लस्टर को उन पर अपना
# हक़ साबित करने में मदद करे। ठीक कौन-सी पंक्ति इसे ठीक करती है — यह आप लैब के दौरान
# समझेंगे; काम करने वाला संस्करण इसके बगल में passes.yaml में पड़ा है, और समझने से पहले
# उसे खोलने का कोई मतलब नहीं है।
#
# यहाँ केवल Deployment है, कोई Service नहीं: सेवा को स्थायी नाम की अभी ज़रूरत नहीं है —
# हम जवाब देने वाले पॉड तक वैसे भी नहीं पहुँचेंगे, क्योंकि इमेज डाउनलोड नहीं होती।
#
# आपके `lab` क्लस्टर पर, डिफ़ॉल्ट नेमस्पेस में लागू होता है:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f passes-broken.yaml
#     kubectl get pods -l app=passes-api -w
#
# ध्यान दें: HARBOR-HOST एक प्लेसहोल्डर है, काम करने वाला पता नहीं। अपने Harbor का पता डालें,
# वरना आपको वह त्रुटि नहीं मिलेगी जिसके लिए फ़ाइल लिखी गई थी (प्लेसहोल्डर वाली दो पंक्तियाँ हैं):
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # macOS
#
# नीचे दिए ऑब्जेक्ट में: apiVersion — विवरण स्कीमा का संस्करण, kind — हम क्या बना रहे हैं,
# metadata.name — ऑब्जेक्ट का नाम। आगे इन्हें अलग से नहीं समझाया गया।
#
# Deployment «एक कंटेनर चलाओ» नहीं है, बल्कि «ऐसे कंटेनर की इतनी प्रतियाँ चलती रखो» है।
# कोई प्रति गायब होगी — क्लस्टर बिना पूछे नई बना देगा।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # एक प्रति: विफलता को समझने के लिए एक ही काफ़ी है, और लॉग में तथा
  # kubectl describe के आउटपुट में कम शोर होगा।
  replicas: 1
  # शर्त «मेरी प्रतियाँ app: passes-api लेबल वाले पॉड हैं»। नीचे पॉड टेम्पलेट में लेबल
  # इससे मेल खाना चाहिए, वरना क्लस्टर मैनिफ़ेस्ट अस्वीकार कर देगा।
  selector:
    matchLabels:
      app: passes-api
  # वह टेम्पलेट जिससे प्रतियाँ छापी जाती हैं। अंदर की हर चीज़ एक पॉड का वर्णन करती है।
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # पूरे पॉड पर सुरक्षा प्रतिबंध: root से न चलाना, अनप्रिविलेज्ड उपयोगकर्ता 10001 के
      # तहत काम करना, सिस्टम कॉल के सेट को मानक प्रोफ़ाइल तक सीमित करना। इमेज इसी के
      # लिए बनाई गई है (देखें app/Dockerfile, USER पंक्ति)।
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # कंटेनर स्तर पर अधिकार: अतिरिक्त विशेषाधिकार न लेना और कर्नेल की सभी विशेष
          # क्षमताएँ छोड़ देना। एप्लिकेशन को एक नेटवर्क पोर्ट चाहिए, बाकी अनावश्यक है।
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # इमेज नाम का पहला हिस्सा रजिस्ट्री का पता है। इसीलिए अपनी रजिस्ट्री पर जाने से
          # मैनिफ़ेस्ट बदलते हैं: इमेज का नाम अलग हो जाता है। पता न हो, तो क्लस्टर इमेज
          # के लिए Docker Hub जाता — यानी वहाँ, जहाँ सुरक्षा विभाग ने मना किया।
          image: HARBOR-HOST/passes/passes-api:v1
          # एप्लिकेशन का पोर्ट। नाम `http` आगे रेडीनेस प्रोब द्वारा उपयोग किया जाता है,
          # इसलिए पोर्ट नंबर एक ही जगह सेट है, दो में नहीं।
          ports:
            - containerPort: 8080
              name: http
          # पर्यावरण चर, जिनसे एप्लिकेशन जानता है कि वह कौन है और कहाँ से आया है।
          # ठीक इन्हीं को वह अपने जवाब में छापता है (देखें app/main.go, identity struct)।
          # APP_VERSION और IMAGE_REGISTRY टेक्स्ट के रूप में सेट हैं — इन्हें हम खुद लिखते हैं;
          # अगले तीन को क्लस्टर स्वयं प्रति शुरू होते समय भरता है, एप्लिकेशन के पास इन्हें
          # जानने का कोई ज़रिया नहीं।
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — प्रति के लिए क्या आरक्षित करना है: इन संख्याओं से शेड्यूलर नोड चुनता
          # है। limits — छत: छत से ऊपर मेमोरी के लिए कंटेनर मार दिया जाता है, प्रोसेसर के
          # लिए धीमा कर दिया जाता है। 16Mi इसलिए काफ़ी है क्योंकि एप्लिकेशन बिना निर्भरताओं
          # वाला Go में है। 20m — प्रोसेसर कोर का बीस हज़ारवाँ हिस्सा।
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # रेडीनेस प्रोब: जब तक एप्लिकेशन /healthz पर जवाब नहीं देता, ट्रैफ़िक प्रति पर
          # नहीं जाएगा। आज बात यहाँ तक नहीं पहुँचेगी — यह पहले से चल रही प्रक्रिया की जाँच
          # करती है, और हमारे यहाँ पहले वाला चरण, इमेज डाउनलोड करना, अटक जाएगा।
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
