# लैब 1-14 के लिए प्रशिक्षण Kubernetes क्लस्टर।
# लागू करने से पहले, tenant-workshopXX को अपने खुद के namespace से बदलें।
#
# प्रबंधन (MANAGEMENT) क्लस्टर पर लागू किया जाता है — उसी एक्सेस के साथ जो टेनेंट के
# साथ जारी किया गया था। इस क्लस्टर का खुद का kubeconfig अभी मौजूद नहीं है: यह
# क्लस्टर के ऊपर आने के बाद ही प्रकट होता है।
#
#   kubectl apply -f cluster.yaml
#
apiVersion: apps.cozystack.io/v1alpha1
kind: Kubernetes
metadata:
  name: lab
  namespace: tenant-workshopXX
spec:
  version: v1.35
  storageClass: replicated
  controlPlane:
    # कंट्रोल प्लेन की एक ही कॉपी: यह एक प्रशिक्षण स्टैंड है, संसाधन बचाना
    # फॉल्ट टॉलरेंस से अधिक महत्वपूर्ण है।
    replicas: 1
  addons:
    monitoringAgents:
      # तुरंत सक्षम करें। मेट्रिक्स संग्रह को पिछली तारीख से सक्षम नहीं किया जा सकता:
      # चेकबॉक्स सेट होने से पहले जो कुछ भी हुआ वह खो जाता है। लैब 14 इस डेटा पर निर्भर करती है।
      enabled: true
  nodeGroups:
    md0:
      # यदि कॉपियों के लिए जगह कम पड़ने लगे तो समूह खुद ही नोड्स जोड़ सकता है।
      # स्केलिंग लैब में बात यहाँ तक नहीं पहुँचेगी: वहाँ कॉपियाँ बढ़ती हैं, नोड्स नहीं।
      minReplicas: 1
      maxReplicas: 3
      instanceType: u1.medium
      diskSize: 20Gi
      storageClass: replicated
