---
# लैब 3. CPU लोड के अनुसार रेप्लिका बढ़ाना।
# लक्ष्य requests.cpu का 50% (20m) है, यानी थ्रेशहोल्ड प्रति पॉड 10m है।
# जानबूझकर कम रखा गया: लोड को सेकंडों में ट्रिगर होना चाहिए,
# हमारे पास लैब के लिए आधा घंटा है, आधा दिन नहीं।
#
# एक ही ऑब्जेक्ट। आपके प्रशिक्षण क्लस्टर `lab` पर लागू होता है, न कि प्रबंधन
# क्लस्टर के किसी टेनेंट में:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f hpa.yaml
# यहाँ tenant-workshopXX जैसे कोई प्लेसहोल्डर नहीं हैं — आपको अपना नंबर कहीं भी डालने की ज़रूरत नहीं।
#
# दो शर्तें जिनके बिना ऑब्जेक्ट बन तो जाएगा पर काम नहीं करेगा:
#   1. rickroll कंटेनर में requests.cpu सेट है — वरना प्रतिशत किस चीज़ से गिनें कुछ नहीं होगा,
#      और `kubectl get hpa` के TARGETS कॉलम में हमेशा के लिए <unknown> रहेगा।
#   2. क्लस्टर में metrics-server चल रहा है — पॉड की वर्तमान खपत का स्रोत।
# दोनों शर्तों की जाँच इस फ़ोल्डर का check.sh करता है।
#
# जब तक HPA मौजूद है, Deployment का replicas फ़ील्ड उसी का होता है। प्रतियों की संख्या
# `kubectl scale` से हाथ से बदली जा सकती है, पर HPA कुछ ही सेकंडों में अपना मान वापस कर देगा।
# इसीलिए लैब 4 में रोलआउट से पहले यह ऑब्जेक्ट हटा दिया जाता है: एक ही फ़ील्ड पर दो तंत्र —
# यह न समझ पाने का पक्का तरीका कि हुआ क्या।
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # HPA का नाम एप्लिकेशन के नाम से मेल खाना ज़रूरी नहीं — यहाँ मेल सुविधा के लिए है।
  # किसे प्रबंधित करना है यह नीचे scaleTargetRef तय करता है, न कि यह नाम।
  name: rickroll
spec:
  # किस पर नज़र रखनी है और किसका replicas फ़ील्ड बदलना है। तीन फ़ील्ड एक साथ, क्योंकि टाइप के
  # बिना नाम अस्पष्ट है: Deployment और StatefulSet का नाम एक जैसा हो सकता है।
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rickroll
  # वह दायरा जिससे HPA किसी भी लोड पर बाहर नहीं जाएगा। निचली सीमा वही एक प्रति है
  # जिससे लैब शुरू हुई थी। ऊपरी सीमा छह: limits.cpu 300m पर प्रशिक्षण नोड पर इतनी ही
  # समाती हैं और पॉड की सूची में एक नज़र में ध्यान भी देने योग्य होती हैं।
  # maxReplicas: 1 रखेंगे तो ऑब्जेक्ट बन जाएगा और कुछ नहीं करेगा।
  minReplicas: 1
  maxReplicas: 6
  # किस आधार पर निर्णय लेना है। मेट्रिक कई हो सकती हैं, तब HPA उसे लेता है
  # जो अधिक प्रतियों की माँग करती है। यहाँ यह एक ही है — CPU।
  metrics:
    - type: Resource
      resource:
        name: cpu
        # Utilization — कंटेनर के requests.cpu का अंश, न कि नोड की क्षमता का।
        # इसीलिए एक अंतर्ज्ञान-विरोधी परिणाम: मान आराम से 600% तक पहुँच जाता है, और यह
        # कोई त्रुटि नहीं: पॉड आरक्षित से छह गुना अधिक खाता है।
        # विकल्प AverageValue है, जहाँ थ्रेशहोल्ड सीधे मिलीकोर में दिया जाता है।
        target:
          type: Utilization
          averageUtilization: 50
  # कितनी फुर्ती से प्रतिक्रिया देनी है। यह ब्लॉक वैकल्पिक है: इसके बिना डिफ़ॉल्ट मान लिए जाते हैं,
  # जो असल संचालन के लिए बने हैं, न कि प्रदर्शन के लिए।
  behavior:
    scaleUp:
      # डिफ़ॉल्ट रूप से Kubernetes स्थिरीकरण का इंतज़ार करता है और धीरे बढ़ता है।
      # लैब में यह ऐसा दिखता है जैसे «कुछ नहीं हो रहा», इसलिए हम इसे तेज़ करते हैं।
      stabilizationWindowSeconds: 0
      # हर पंद्रह सेकंड में दो से अधिक नई प्रतियाँ नहीं। यह कदम अनुभव से चुना गया:
      # वृद्धि वृद्धि की तरह दिखे, न कि एक से सीधे छह तक तात्कालिक छलाँग की तरह,
      # जिसमें प्रतिभागी के देखने के लिए कुछ नहीं होता।
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      # पर नीचे की ओर उल्टा — तात्कालिक नहीं, वरना पॉड
      # प्रतिभागी के देख पाने से पहले ही गायब हो जाएँगे।
      # डिफ़ॉल्ट पाँच के बजाय एक मिनट: लैब आधा घंटा चलती है, उनमें से पाँच
      # सिकुड़न के इंतज़ार में लगाने को कुछ नहीं। असल क्लस्टर में लंबी विंडो वाकई उपयोगी है —
      # यह असमान लोड पर झूले को शांत करती है।
      stabilizationWindowSeconds: 60
