# लैब 3. Fortio लोड जनरेटर: जनरेटर स्वयं और उसके वेब-इंटरफ़ेस के लिए एक स्थायी पता।
# दो ऑब्जेक्ट, `---` से अलग किए गए।
#
# यह आपके `lab` प्रशिक्षण क्लस्टर पर लागू होता है, न कि प्रबंधन क्लस्टर के किसी टेनेंट पर:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f fortio.yaml
# यहाँ tenant-workshopXX जैसे कोई प्लेसहोल्डर नहीं हैं — अपना नंबर कहीं भी डालने की ज़रूरत नहीं।
# यही फ़ाइल लैब 4 में भी चाहिए होगी: `kubectl apply -f ../03-scale/fortio.yaml`.
#
# मैनिफ़ेस्ट के सामान्य फ़ील्ड (apiVersion, kind, metadata.name, selector, template,
# securityContext) ../01-deploy/rickroll.yaml में पंक्ति-दर-पंक्ति समझाए गए हैं और यहाँ
# दोहराए नहीं गए हैं। हम केवल उसी पर टिप्पणी करते हैं जो लोड जनरेटर के लिए विशिष्ट है।
---
# वेब-इंटरफ़ेस वाला लोड जनरेटर।
# hey/ab के बजाय जानबूझकर चुना गया: लोड ब्राउज़र में एक बटन से शुरू होता है,
# और लेटेंसी हिस्टोग्राम वहीं दिखता है। पिछले वर्कशॉप में हमने ठीक कंसोल
# टूल्स पर ही लोगों को खोया था।
#
# Fortio क्लस्टर में एक सामान्य एप्लिकेशन की तरह रहता है और अंदर से rickroll पते पर हिट करता है।
# बाहर से, लैपटॉप से, लोड डालना ट्रैफ़िक के लिहाज़ से अधिक ईमानदार होता, पर वह क्लस्टर तक के
# चैनल पर अटक जाता, और आप एप्लिकेशन के बजाय अपने Wi-Fi को मापते।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # जनरेटर की एक ही कॉपी काफ़ी है: यह स्वयं कई थ्रेड्स में लोड देती है।
  # दूसरी कॉपी यहाँ केवल तस्वीर को धुँधला करती — वेब-इंटरफ़ेस के काउंटर
  # हर कॉपी के अपने होते हैं, और आप आधे ही अनुरोध देखते।
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # वही सुरक्षा प्रोफ़ाइल जो rickroll की है: root के रूप में नहीं चलता, एक निश्चित
      # UID, मानक seccomp. जानबूझकर रखा गया — ताकि फ़ाइल को `restricted` प्रोफ़ाइल सक्षम
      # वाले क्लस्टर में भी लागू किया जा सके, जहाँ अन्यथा पॉड शुरू नहीं होगा।
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # latest टैग वर्कशॉप के लिए एक जानबूझकर किया गया सरलीकरण है, ताकि वर्शन मिलाने न पड़ें।
          # प्रोडक्शन क्लस्टर में ऐसा नहीं करते: इस टैग के तहत इमेज दो apply के बीच चुपचाप
          # बदल सकती है, और आप कल का परिणाम दोहरा नहीं पाएँगे।
          image: fortio/fortio:latest
          # `server` मोड वेब-इंटरफ़ेस को उठाता है और उसे चालू रखता है। इस आर्गुमेंट के बिना
          # Fortio कमांड लाइन से एक ही प्रोग्राम चलाकर बाहर हो जाता, और क्लस्टर
          # कंटेनर को बार-बार पुनः चालू करता रहता।
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            # अनुरोध rickroll के अपने (20m) से अधिक है: जनरेटर को नोड पर जगह पहले से
            # चाहिए, अन्यथा शेड्यूलर उसे तंगी में रख देगा और रैंप-अप असमान होगा।
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # जनरेटर को CPU की गुंजाइश चाहिए, अन्यथा वह अपनी ही सीमा से
              # टकराएगा और आप एप्लिकेशन नहीं, बल्कि Fortio को लोड करेंगे।
              cpu: "1"
              memory: 256Mi
---
# क्लस्टर के भीतर जनरेटर का एक स्थायी पता। वेब-इंटरफ़ेस को लैपटॉप से
# `kubectl port-forward svc/fortio 8081:8080` के ज़रिए खोलने के लिए चाहिए — बाहर से क्लस्टर
# कुछ भी प्रकाशित नहीं करता, और Fortio तक कोई और दरवाज़ा नहीं है।
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  ports:
    # दोनों ओर 8080: सर्विस भी और कंटेनर भी। नंबर वही है जो पॉड के भीतर rickroll का है,
    # पर कोई टकराव नहीं — हर पॉड का अपना नेटवर्क स्टैक होता है।
    - port: 8080
      targetPort: http
