# लैब 8 · चरण 3 का 3: मैनिफेस्ट में कोई पासवर्ड नहीं है — न सादे टेक्स्ट में, न base64 में।
# अंतिम संस्करण। इस फ़ाइल को Git में कमिट किया जा सकता है, ठेकेदार को दिखाया जा सकता है, और
# टी-शर्ट पर छापा जा सकता है।
#
# यह चरण दूसरे से कैसे अलग है: वहाँ मान फिर भी लिख लिया गया था — एक फ़ाइल में
# और फिर क्लस्टर ऑब्जेक्ट में। यहाँ यह विवरण में बिलकुल नहीं है; एप्लिकेशन
# पासवर्ड स्वयं, स्टार्टअप के समय, OpenBao स्टोर से लाता है।
#
#   secrets-demo-naive.yaml      फ़ाइल खोलने वाला हर कोई पासवर्ड देख लेता है
#   secrets-demo-secret.yaml     पासवर्ड को Secret ऑब्जेक्ट में स्थानांतरित कर दिया गया है
#   secrets-demo.yaml         <- आप यहाँ हैं: पासवर्ड स्टार्टअप के समय स्टोर से आता है
#
# लागू करने से पहले: tenant-workshopXX को अपने namespace से बदलें — यह नीचे दिए गए स्टोर
# पते का हिस्सा है। XX एक प्लेसहोल्डर है, नाम का हिस्सा नहीं।
# कहाँ लागू होता है: आपका `lab` क्लस्टर (export KUBECONFIG=~/lab.kubeconfig)।
# कमांड: kubectl apply -f secrets-demo.yaml
#
# एप्लिकेशन जिस टोकन से स्वयं को स्टोर के सामने पहचान कराता है वह passes-bao-token सीक्रेट में रहता है।
# आप इसे किसी कमांड से बनाते हैं, फ़ाइल से नहीं: इस मैनिफेस्ट में केवल ऑब्जेक्ट का नाम है,
# और नाम कोई सीक्रेट नहीं होता।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # सब कुछ non-root के रूप में चलता है। fsGroup इसलिए ज़रूरी है क्योंकि यहाँ दो कंटेनर हैं: एक
      # पासवर्ड वाली फ़ाइल लिखता है, दूसरा उसे पढ़ता है। साझा समूह के बिना init कंटेनर
      # ऐसी फ़ाइल लिखेगा जिसे मुख्य कंटेनर खोल नहीं पाएगा, और आप आधा घंटा यह पता लगाने में बिता देंगे
      # कि गलती कहाँ हुई।
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # वह जगह जहाँ एक कंटेनर पासवर्ड रखता है और दूसरा उसे पढ़ता है।
      # medium: Memory का अर्थ है कि यह «डिस्क» नोड की रैम में रहती है
      # और असली डिस्क तक कभी नहीं पहुँचती: न बैकअप में, न वॉल्यूम डंप में, न उस व्यक्ति तक
      # जो सर्वर से डिस्क निकाल ले। पॉड गया — उसके साथ उसकी सामग्री भी।
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      # init कंटेनर मुख्य कंटेनर से पहले चलता है और उसे सफलतापूर्वक समाप्त होना ही चाहिए।
      # यदि वह पासवर्ड नहीं ला पाता, तो एप्लिकेशन बिलकुल शुरू नहीं होगा, और यही सही
      # व्यवहार है: डेटाबेस पासवर्ड के बिना सेवा वैसे भी बेकार है, ऊपर आकर लॉग में त्रुटियाँ उगलने से
      # बेहतर है कि ऊपर ही न आया जाए।
      initContainers:
        - name: fetch-secret
          # हम केवल एक उपयोगिता, `bao` — इसके क्लाइंट — के लिए स्वयं OpenBao इमेज लेते हैं।
          # अपना कोड लिखने की ज़रूरत नहीं।
          image: openbao/openbao:2.5.1
          # bao kv get -field=password — एक पथ से एक फ़ील्ड लाना, पूरा
          # सीक्रेट नहीं। tr -d '\n' उस नई-पंक्ति को हटाता है जो अन्यथा पासवर्ड के
          # भीतर चली जाती: अंत में एक अतिरिक्त वर्ण डेटाबेस स्वीकार नहीं करेगा, और उसे ढूँढना अप्रिय होता है।
          # chmod 0400 — फ़ाइल को केवल मालिक ही पढ़ सकता है।
          # set -e स्क्रिप्ट को पहली ही त्रुटि पर रोक देता है: अन्यथा कंटेनर खाली फ़ाइल के साथ
          # सफलतापूर्वक समाप्त हो जाता, और फिर एप्लिकेशन में जाकर सुलझाना पड़ता।
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              bao kv get -field=password secret/passes/db \
                | tr -d '\n' > /secrets/db_password
              chmod 0400 /secrets/db_password
              echo "пароль получен из OpenBao, в манифесте его нет"
          # स्टोर का पता और वह टोकन जिससे एप्लिकेशन पढ़ने का अपना अधिकार साबित करता है।
          # टोकन किसी कमांड से बनाए गए ऑब्जेक्ट के संदर्भ द्वारा आता है; यह यहाँ, फ़ाइल में, नहीं पहुँचता।
          # पते में tenant-workshopXX वही प्लेसहोल्डर है जिसे बदला जाना चाहिए।
          env:
            - name: BAO_ADDR
              value: http://openbao-secrets.tenant-workshopXX.svc.cozy.local:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: passes-bao-token
                  key: token
          # साझा फ़ोल्डर। इस कंटेनर को इसमें लिखने की अनुमति दी गई है — यह इसमें लिखता है।
          volumeMounts:
            - name: secrets
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # सीमाएँ मुख्य कंटेनर से अधिक हैं: OpenBao उपयोगिता busybox से भारी है,
          # लेकिन यह कुछ ही सेकंड जीती है, इसलिए यह कोई स्थायी लागत नहीं है।
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      # मुख्य कंटेनर तभी शुरू होता है जब init कंटेनर समाप्त हो चुका होता है।
      containers:
        - name: app
          image: busybox:1.36
          # वही लूप जो पिछले चरणों में था, लेकिन पासवर्ड अब पर्यावरण चर में नहीं
          # बल्कि एक फ़ाइल में है: फ़िंगरप्रिंट सीधे /secrets/db_password से पढ़ा जाता है।
          # पर्यावरण चर kubectl describe pod के आउटपुट में दिखते हैं और प्रोसेस डंप में
          # चले जाते हैं; पॉड की मेमोरी में रखी फ़ाइल नहीं।
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(sha256sum /secrets/db_password | cut -c1-12)"
                sleep 10
              done
          # यहाँ केवल गैर-गोपनीय सेटिंग्स बची हैं — पता और लॉगिन।
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
          # वही फ़ोल्डर, लेकिन केवल पढ़ने के लिए: एप्लिकेशन पासवर्ड को बिगाड़ या बदल नहीं सकता,
          # भले ही वह बहुत चाहे।
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
