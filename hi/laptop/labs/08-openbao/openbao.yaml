# लैब 8 · OpenBao सीक्रेट स्टोर का ऑर्डर देना।
# वही चीज़ जो आप डैशबोर्ड में माउस से ऑर्डर करेंगे — बस टेक्स्ट के रूप में।
# इसे लैब क्लस्टर में नहीं, बल्कि मैनेजमेंट क्लस्टर के एक टेनेंट में लागू किया जाता है:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f openbao.yaml
#
# लागू करने से पहले: tenant-workshopXX को अपने namespace से बदलें। XX एक प्लेसहोल्डर है,
# नाम का हिस्सा नहीं; अपना नंबर आपको पासवर्ड के साथ मिला था। यदि यह किसी और के
# टेनेंट में चला गया, तो आपको access denied मिलेगा — और यही सबसे अच्छा संभावित परिणाम है।
#
# kind: OpenBAO कोई बिल्ट-इन Kubernetes ऑब्जेक्ट नहीं है, बल्कि एक टाइप है जिसे
# Cozystack जोड़ता है। आप बताते हैं कि आपको क्या चाहिए, और प्लेटफ़ॉर्म खुद पॉड्स, डिस्क
# और सर्विसेज़ को तैनात करता है और फिर खुद ही उन्हें अपडेट रखता है। यह किसी कैटलॉग से सेवा
# ऑर्डर करने के ज़्यादा करीब है, बजाय इसके कि आपको दी गई VM पर सॉफ़्टवेयर इंस्टॉल करें।
apiVersion: apps.cozystack.io/v1alpha1
kind: OpenBAO
metadata:
  # नाम सिर्फ़ डैशबोर्ड के कार्ड को ही प्रभावित नहीं करता: स्टोर का आंतरिक पता
  # इसी से बनता है — openbao-secrets.<namespace>.svc.cozy.local. अगर आप इसका नाम बदलते हैं,
  # तो secrets-demo.yaml में और check.sh के लिए BAO_APP वेरिएबल में पता ठीक करें।
  name: secrets
  namespace: tenant-workshopXX
spec:
  # एक कॉपी। प्रोडक्शन में तीन का उपयोग होता है, जिससे Raft रेप्लिकेशन मिलता है: चार्ट इसे
  # खुद ही चालू कर देता है जैसे ही replicas > 1 होता है। आगे-पीछे स्विच करने के लिए
  # डेटा को माइग्रेट करना पड़ता है, इसलिए यह निर्णय पहले लिया जाता है, बाद में नहीं।
  replicas: 1
  # स्टोर के डेटा के लिए डिस्क। दो गीगाबाइट काफ़ी है: सीक्रेट्स का वज़न बाइट्स में होता है,
  # जगह वर्ज़न हिस्ट्री और ऑडिट लॉग में जाती है। बनने के बाद आप वॉल्यूम को छोटा
  # नहीं कर सकते, लेकिन आमतौर पर बड़ा कर सकते हैं, इसलिए यहाँ कंजूसी करने का कोई मतलब नहीं।
  size: 2Gi
  # replicated स्टोरेज क्लास का मतलब है कि डेटा कई कॉपियों में अलग-अलग नोड्स पर
  # रखा जाता है। किसी नोड की विफलता आपके सारे पासवर्ड अपने साथ नहीं ले जाती — और बैकअप से
  # सीक्रेट स्टोर को रीस्टोर करना एक अलग ही अप्रिय मामला है।
  storageClass: replicated
  # एक तैयार "कितना CPU और मेमोरी" सेट। प्लेटफ़ॉर्म इन्हें एक सूची के रूप में पेश करता है,
  # ताकि हर किसी को रिक्वेस्ट्स और लिमिट्स हाथ से गिनने पर मजबूर न किया जाए।
  resourcesPreset: t1.small
  # वेब इंटरफ़ेस क्लस्टर के अंदर ही उठता है। हम इसे बाहर की ओर एक्सपोज़ नहीं करते:
  # external: true एक LoadBalancer लगा देता, और लैब में हमें इसकी ज़रूरत नहीं है।
  ui: true
  external: false
