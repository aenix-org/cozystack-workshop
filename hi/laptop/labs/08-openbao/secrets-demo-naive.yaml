# लैब 8 · चरण 1 का 3: पासवर्ड मैनिफ़ेस्ट में सादे टेक्स्ट में पड़ा है।
# सेवा «Пропуск» आज ऐसी दिखती है — और ऑडिट ने ठीक यही फ़ाइल पाई।
# हम इसे ठीक एक बार लागू करेंगे, ताकि समस्या को अपनी आँखों से देख सकें।
#
# लैब के तीन चरण, ताकि आप भटकें नहीं:
#   secrets-demo-naive.yaml   <- आप यहाँ हैं: फ़ाइल खोलने वाला हर कोई पासवर्ड देख लेता है
#   secrets-demo-secret.yaml     पासवर्ड अलग Secret ऑब्जेक्ट में निकाल दिया गया है
#   secrets-demo.yaml            मैनिफ़ेस्ट में पासवर्ड बिलकुल नहीं है
#
# कहाँ लागू होता है: आपका `lab` क्लस्टर (export KUBECONFIG=~/lab.kubeconfig)।
# कमांड: kubectl apply -f secrets-demo-naive.yaml
#
# इस फ़ाइल का पासवर्ड सीखने के लिए बनाया गया काल्पनिक है, यहाँ असली कोई नहीं है। एक ही ऑब्जेक्ट —
# Deployment; apiVersion, kind और metadata.name पर आगे टिप्पणी नहीं की गई है।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # एक ही कॉपी काफ़ी है: हम फ़ॉल्ट टॉलरेंस पर नहीं, बल्कि इस पर देख रहे हैं कि
  # ऐप्लिकेशन पासवर्ड कहाँ से लेता है।
  replicas: 1
  # इस लेबल से Deployment अपने पॉड्स को पहचानता है। नीचे template के लेबल से मेल खाता है।
  selector:
    matchLabels:
      app: secrets-demo
  # template — पॉड का टेम्पलेट: कॉपी किससे बनानी है।
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # सुरक्षा आवश्यकताएँ: root से नहीं, सिस्टम कॉल्स का सीमित सेट।
      # अंतर पर ध्यान दें: पॉड हर सुरक्षा नियम के अनुसार कॉन्फ़िगर किया गया है, और यह किसी भी तरह
      # पासवर्ड को दस पंक्ति नीचे फ़ाइल में पड़े रहने से नहीं रोकता।
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # यहाँ असली ऐप्लिकेशन नहीं है — busybox और shell की कुछ पंक्तियाँ।
          # इस लैब के लिए केवल एक बात मायने रखती है: पासवर्ड कहाँ से आता है, न कि आगे उसके साथ
          # क्या किया जाता है।
          image: busybox:1.36
          env:
            # डेटाबेस का पता और उपयोगकर्ता नाम रहस्य नहीं हैं: यह जानना कि
            # डेटाबेस का नाम passes-db है, अपने आप में एक्सेस नहीं देता।
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # ऑडिट ने ठीक यही पंक्ति पाई।
            # फ़ाइल Git में पड़ी है, यानी पासवर्ड हर उस व्यक्ति को पता है जिसके पास रिपॉज़िटरी तक
            # एक्सेस है, और हर उस व्यक्ति को जिसने कभी इसे क्लोन किया।
            - name: DB_PASSWORD
              value: "Propusk2019!"
          # अनंत लूप: हर दस सेकंड में लॉग में एक पंक्ति छापता है। लॉग में स्वयं
          # पासवर्ड नहीं जाता, बल्कि उसका sha256 फ़िंगरप्रिंट — पहले बारह अक्षर। फ़िंगरप्रिंट से
          # दिखता है कि पासवर्ड बदल गया, लेकिन उससे मान को पुनर्निर्मित नहीं किया जा सकता।
          # असली सेवाओं में लॉग ठीक इसी तरह लिखे जाते हैं।
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          # ज़रूरतें बहुत छोटी हैं: यह एक प्रदर्शन है, कोई वर्कलोड नहीं।
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
