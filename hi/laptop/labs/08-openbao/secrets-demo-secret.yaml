# लैब 8 · चरण 2 का 3: पासवर्ड को Deployment से निकालकर एक अलग Secret ऑब्जेक्ट में डाला गया है।
# «भोली मरम्मत»: एप्लिकेशन के विवरण में पासवर्ड अब दिखाई नहीं देता, डेवलपर खुश है,
# ऑडिटर नहीं। क्यों — एक ही कमांड से देख लेंगे।
#
# यह चरण पहले से बेहतर कैसे है: अब मान एप्लिकेशन के विवरण का हिस्सा नहीं रहा,
# अब उसका संदर्भ नाम से दिया जाता है। यह तीसरे से खराब कैसे है — इसमें कि मान को
# फिर भी कहीं न कहीं लिखना पड़ता है, और वह ठीक यहीं लिखा हुआ है।
#
#   secrets-demo-naive.yaml      पासवर्ड उस हर व्यक्ति को दिखता है जिसने फ़ाइल खोली
#   secrets-demo-secret.yaml  <- आप यहाँ हैं: पासवर्ड Secret ऑब्जेक्ट में है
#   secrets-demo.yaml            मेनिफ़ेस्ट में पासवर्ड बिल्कुल नहीं है
#
# कहाँ लागू होता है: आपका `lab` क्लस्टर (export KUBECONFIG=~/lab.kubeconfig)।
# कमांड: kubectl apply -f secrets-demo-secret.yaml
#
# इस फ़ाइल में पासवर्ड अभ्यास के लिए बनाया हुआ काल्पनिक है। फ़ाइल में दो ऑब्जेक्ट हैं, जो
# `---` लाइन से अलग किए गए हैं: Secret और उसका संदर्भ देने वाला Deployment। apiVersion, kind
# और metadata.name पर आगे फ़ाइल में टिप्पणी नहीं की गई है।
#
# Secret एक अलग तरह का ऑब्जेक्ट है उन चीज़ों के लिए जो एप्लिकेशन के विवरण में नहीं होनी चाहिए।
# क्लस्टर इसे सामान्य सेटिंग्स की तुलना में थोड़ा अधिक सावधानी से संभालता है: मान
# kubectl describe में नहीं दिखाए जाते, पढ़ने की अनुमति अलग से दी जाती है।
apiVersion: v1
kind: Secret
metadata:
  name: passes-db
# Opaque का अर्थ है «की-वैल्यू का एक स्वेच्छिक सेट»। विशेष प्रकार भी होते हैं —
# इमेज रजिस्ट्री तक पहुँच के लिए, TLS प्रमाणपत्रों के लिए, — पर यहाँ कुछ भी
# विशेष नहीं चाहिए।
type: Opaque
data:
  # यह एन्क्रिप्शन नहीं है। यह base64 है — बाइट्स को प्रिंट होने योग्य वर्णों से लिखने का तरीका।
  # न कोई की है, न डिक्रिप्शन का पासवर्ड, उल्टा रूपांतरण कोई भी कर सकता है।
  password: UHJvcHVzazIwMTkh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # नीचे का Deployment वही है जो पहले चरण में था। ठीक एक ही
  # जगह बदली है: DB_PASSWORD पॉड में कैसे पहुँचता है।
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # root के रूप में नहीं, सिस्टम कॉल का सीमित सेट।
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # फिर से busybox और shell की कुछ पंक्तियाँ: हम पासवर्ड के रास्ते को देख रहे हैं,
          # एप्लिकेशन के काम को नहीं।
          image: busybox:1.36
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # पहले चरण से पूरा अंतर यही है। value के बजाय valueFrom का अर्थ है
            # «मान को वहाँ से लो»: secretKeyRef.name — कौन सा ऑब्जेक्ट, key — उसके अंदर का
            # कौन सा फ़ील्ड। प्रतिस्थापन पॉड शुरू होने पर होता है, एप्लिकेशन के
            # विवरण में केवल नाम रह जाता है।
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: passes-db
                  key: password
          # वही लूप जो पहले चरण में था: यह पासवर्ड का फ़िंगरप्रिंट छापता है, स्वयं
          # पासवर्ड नहीं। फ़िंगरप्रिंट ठीक चरणों की तुलना के लिए सुविधाजनक है — अगर वह नहीं
          # बदला, तो इसका मतलब पॉड में वही मान आया जो पहले था।
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s %s से %s के रूप में जुड़ रहा हूँ, पासवर्ड फ़िंगरप्रिंट sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
