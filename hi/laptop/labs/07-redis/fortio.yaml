---
# लैब 7 · वेब UI वाला लोड जनरेटर।
# वही जो स्केलिंग वाली लैब में था: आप ब्राउज़र में एक बटन से लोड शुरू करते हैं,
# और लेटेंसी हिस्टोग्राम वहीं दिखता है। अगर यह आपके लिए पहले से डिप्लॉय है, तो इस
# फ़ाइल को अप्लाई करने की ज़रूरत नहीं — kubectl "unchanged" जवाब देगा।
#
# कहाँ अप्लाई होता है: आपका `lab` क्लस्टर (export KUBECONFIG=~/lab.kubeconfig)।
# कमांड: kubectl apply -f fortio.yaml
#
# `---` से अलग किए दो ऑब्जेक्ट: एक Deployment (जनरेटर स्वयं) और एक Service (वह नाम
# जिससे आप उस तक पहुँचते हैं)। apiVersion, kind और metadata.name पर आगे टिप्पणी नहीं की गई।
#
# इमेज सार्वजनिक Docker Hub से खींची जाती है, आपके Harbor से नहीं: Fortio "गेस्ट पास"
# सेवा का हिस्सा नहीं, बल्कि एक मापन उपकरण है जो क्लस्टर में अस्थायी रूप से रहता है।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # एक ही कॉपी। लोड जनरेटर को स्केल करने की ज़रूरत नहीं — आपको चाहिए कि वह एकमात्र हो
  # जो ईमानदारी से लेटेंसी गिने। दो कॉपियाँ दो अ-मिलाए हिस्टोग्राम देतीं।
  replicas: 1
  # वह लेबल जिससे Deployment अपने पॉड को पहचानता है। नीचे template में लेबल से मेल खाता है।
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # वही सुरक्षा आवश्यकताएँ जो बाकी सब की हैं: प्रोसेस root के रूप में नहीं चलता,
      # और सिस्टम कॉल seccomp प्रोफ़ाइल द्वारा सीमित हैं।
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # यहाँ `latest` टैग वर्कशॉप के लिए एक सरलीकरण है, और यह उस बात के विरुद्ध है जो
          # आपकी अपनी रजिस्ट्री वाली लैब सिखाती है: इस टैग के तहत इमेज दो अप्लाई के बीच
          # चुपचाप बदल सकती है, और कल का मापन अ-पुनरुत्पादनीय हो जाता है। प्रशिक्षण स्टैंड पर
          # लोड जनरेटर के लिए यह स्वीकार्य है, प्रोडक्शन सिस्टम के लिए नहीं।
          image: fortio/fortio:latest
          # `server` वह मोड है जिसमें Fortio वेब इंटरफ़ेस उठाता है और आपके बटन दबाने का
          # इंतज़ार करता है। इस आर्गुमेंट के बिना इमेज एक बार वाली कमांड चलाकर बाहर निकल जाती है।
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # जनरेटर को CPU हेडरूम चाहिए, वरना वह अपने ही ऊपर अटक जाएगा
              # और आप एप्लिकेशन की जगह Fortio को लोड कर रहे होंगे।
              cpu: "1"
              memory: 256Mi
---
# वेब इंटरफ़ेस खोलने के लिए Service चाहिए: आप जनरेटर तक नाम से पोर्ट फ़ॉरवर्डिंग के
# ज़रिए पहुँचते हैं — kubectl port-forward svc/fortio 8081:8080 — और localhost:8081
# पर जाते हैं। आप बिना Service के भी सेवा पर हमला कर सकते हैं,
# kubectl exec deploy/fortio से, पर हिस्टोग्राम ब्राउज़र में केवल यही रास्ता देता है।
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  # यहाँ Service का नंबर और कंटेनर पोर्ट मेल खाते हैं — लैब की बाकी सेवाओं के विपरीत,
  # जहाँ बाहर 80 और भीतर 8080 है। अंतर केवल सुविधा का है।
  ports:
    - port: 8080
      targetPort: http
