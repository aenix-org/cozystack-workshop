---
# लैब 7 · लेगेसी कर्मचारी निर्देशिका के लिए एक स्टब।
# असल जीवन में यह किसी और का सिस्टम है जिसे दोबारा लिखने की अनुमति आपको नहीं मिलेगी: यह 800 ms में जवाब देता है,
# और आपको किसी तरह इसके साथ रहना है। यहाँ उसी व्यवहार वाला एक स्टब है, ताकि मापने के लिए कुछ हो।
#
# कहाँ लागू होता है: आपका `lab` क्लस्टर (export KUBECONFIG=~/lab.kubeconfig), Cozystack का
# प्रबंधन क्लस्टर नहीं। कमांड: kubectl apply -f hr-legacy.yaml
#
# HARBOR-HOST एक प्लेसहोल्डर है, पता नहीं। अपने खुद के Harbor का पता डालें, वरना क्लस्टर
# किसी अस्तित्वहीन होस्ट से इमेज खींचने की कोशिश करेगा:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # macOS
#
# फ़ाइल में `---` पंक्ति से अलग किए गए दो ऑब्जेक्ट हैं: एक Deployment (क्या चलता है और कितनी
# प्रतियों में) और एक Service (उन प्रतियों तक पहुँचने के लिए एक स्थायी नाम)। प्रत्येक ऑब्जेक्ट के लिए
# apiVersion और kind बताते हैं कि यह किस तरह का ऑब्जेक्ट है, और metadata.name इसका नाम है;
# आगे नीचे इन तीन फ़ील्ड्स पर टिप्पणी नहीं की गई है।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-legacy
  labels:
    app: hr-legacy
spec:
  # कितनी प्रतियाँ चालू रखनी हैं। यदि कोई प्रति गायब हो जाती है, तो क्लस्टर बिना पूछे एक नई
  # बना देगा। निर्देशिका के लिए एक ही काफ़ी है: यह लोड के लिए नहीं, बल्कि मापन के लिए यहाँ है।
  replicas: 1
  # इस लेबल से Deployment क्लस्टर के बाकी सभी पॉड्स के बीच अपने पॉड्स को पहचानता है।
  # selector में लेबल और नीचे template में लेबल का मेल होना ज़रूरी है, वरना ऑब्जेक्ट
  # वही नहीं ढूँढ पाएगा जो उसने खुद बनाया था।
  selector:
    matchLabels:
      app: hr-legacy
  # template पॉड का टेम्पलेट है। नीचे जो कुछ है वह एक प्रति का वर्णन करता है: इसे किससे बनाना है,
  # किन विशेषाधिकारों के साथ चलाना है, और कैसे पता करें कि यह अनुरोध स्वीकार करने के लिए तैयार है।
  template:
    metadata:
      labels:
        app: hr-legacy
    spec:
      # पॉड-स्तर की सुरक्षा आवश्यकताएँ। प्रोसेस root के रूप में नहीं चलता (uid 10001),
      # seccomp प्रोफ़ाइल उन सिस्टम कॉल्स को काट देती है जिनकी एप्लिकेशन को ज़रूरत नहीं।
      # नीतियाँ सक्षम वाले क्लस्टर में, इन फ़ील्ड्स के बिना पॉड बिल्कुल शुरू नहीं होगा।
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Harbor लॉगिन और पासवर्ड से बंद है, और क्लस्टर को खुद को पहचानवाने के लिए कुछ चाहिए।
      # `harbor` सीक्रेट आपने रजिस्ट्री लैब में सेट किया था। इस संदर्भ के बिना इमेज नहीं खींची जाएगी,
      # और पॉड ImagePullBackOff स्थिति में रह जाएगा।
      imagePullSecrets:
        - name: harbor
      containers:
        - name: hr
          # पॉड स्तर जैसा ही, पर किसी विशिष्ट कंटेनर के लिए: हम विशेषाधिकार वृद्धि पर रोक
          # लगाते हैं और सभी कर्नेल क्षमताएँ हटा देते हैं। Go एप्लिकेशन को
          # इनमें से किसी की भी ज़रूरत नहीं।
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # इमेज निर्देशिका और खुद "गेस्ट पास" सेवा के लिए एक ही है।
          # असल में कौन-सी प्रोसेस शुरू होगी, यह नीचे दिए MODE वेरिएबल से तय होता है।
          image: HARBOR-HOST/passes/passes-api:v2
          # पोर्ट का सिर्फ़ नंबर नहीं, एक नाम भी है: नीचे readiness प्रोब और Service
          # नाम का संदर्भ देते हैं। नंबर बदलेगा तो एक ही जगह संपादन करना होगा।
          ports:
            - containerPort: 8080
              name: http
          # इस एप्लिकेशन को कॉन्फ़िगर करने का एकमात्र तरीका पर्यावरण चर हैं।
          # व्यवहार बदलने के लिए इमेज दोबारा बनाने की ज़रूरत नहीं।
          env:
            # MODE=hr — इंस्टेंस HR सिस्टम होने का नाटक करता है: इंतज़ार करता है और जवाब देता है।
            - name: MODE
              value: "hr"
            # ठीक वही देरी जो असली निर्देशिका दिखाती है।
            # इसे बदलकर आप बदलते हैं कि "हालात कितने बुरे हैं" — बाद में 2s आज़माएँ।
            - name: HR_DELAY
              value: "800ms"
            # पॉड अपना नाम पहले से नहीं जानता — क्लस्टर इसे बनते समय सौंपता है।
            # fieldRef इस नाम को शुरुआत में वेरिएबल में डाल देता है, और यह
            # सेवा के जवाब में पहुँचता है: दिखता है कि किस प्रति ने उत्तर दिया।
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # requests — नोड चुनते समय कंटेनर के लिए कितने संसाधन आरक्षित किए जाते हैं,
          # limits — वह सीमा जिसे पार करने की अनुमति नहीं। vSphere में reservation
          # और limit जैसा, पर प्रति कंटेनर सेट होता है, प्रति वर्चुअल मशीन नहीं।
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # Readiness प्रोब। जब तक /healthz जवाब नहीं देता, Service इस प्रति में एक भी अनुरोध
          # नहीं भेजेगा। प्रोब के बिना ट्रैफ़िक ऐसी प्रोसेस में जाएगा जो अभी शुरू नहीं हुई,
          # और आपको बेवजह त्रुटियाँ दिखेंगी — जबकि "सब कुछ रोल आउट हो गया"।
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — पॉड्स के एक समूह के लिए स्थायी नाम और स्थायी पता। पॉड्स दोबारा बनते हैं
# और हर बार नया IP पाते हैं, पर hr-legacy नाम वही रहता है। लोड बैलेंसर के VIP जैसा,
# पर चार पंक्तियों में सेट होता है और क्लस्टर के भीतर रहता है।
apiVersion: v1
kind: Service
metadata:
  name: hr-legacy
spec:
  # इस लेबल से Service जीवित प्रतियों की सूची जुटाता है। ऊपर पॉड्स जैसा ही लेबल:
  # यदि मेल नहीं खाया — Service अस्तित्व में रहेगा और कहीं नहीं ले जाएगा।
  selector:
    app: hr-legacy
  ports:
    # अनुरोध पोर्ट 80 पर आते हैं, पॉड के भीतर यह http नाम वाले पोर्ट (8080) पर जाता है।
    - port: 80
      targetPort: http
