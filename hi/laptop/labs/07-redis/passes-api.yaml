---
# लैब 7 · सेवा «Пропуск», संस्करण v2 — वही जो कैश के साथ काम कर सकती है।
# कैश यहाँ अभी चालू नहीं है: पहले हम मापते हैं कि इसके बिना हालात कितने खराब हैं। यह बाद में
# चालू होता है, इसी फ़ोल्डर के cache-patch.yaml पैच से।
#
# कहाँ लागू होता है: आपका क्लस्टर `lab` (export KUBECONFIG=~/lab.kubeconfig)।
# कमांड: kubectl apply -f passes-api.yaml
#
# HARBOR-HOST एक प्लेसहोल्डर है, पता नहीं। अपने खुद के Harbor का पता डालें (देखें hr-legacy.yaml,
# वहीं sed कमांड भी है जो इसे सभी फ़ाइलों में एक साथ बदल देती है)।
#
# फ़ाइल में `---` से अलग किए दो ऑब्जेक्ट हैं: Deployment (एप्लिकेशन की प्रतियाँ) और Service (उनके लिए एक
# स्थिर नाम)। apiVersion, kind और metadata.name पर आगे टिप्पणी नहीं की गई है।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # दो प्रतियाँ, एक नहीं, — ताकि बाद में कैश का मुख्य गुण दिखाई दे: वह साझा है।
  # एक पॉड ने जवाब Redis में रखा, दूसरे ने उसे वहीं से लिया, हालाँकि वह खुद कभी डायरेक्टरी तक नहीं गया।
  replicas: 2
  # इस लेबल से Deployment अपने पॉड्स को दूसरों से अलग पहचानता है। यह नीचे template के लेबल से
  # मेल खाना चाहिए, वरना ऑब्जेक्ट उसे नहीं ढूँढ पाएगा जो उसने खुद बनाया।
  selector:
    matchLabels:
      app: passes-api
  # template — पॉड का टेम्पलेट: हर प्रति किससे इकट्ठा की जाती है।
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # पॉड-स्तर की सुरक्षा आवश्यकताएँ: root के रूप में नहीं, सिस्टम कॉल्स का सीमित सेट। नीतियाँ चालू
      # किए गए क्लस्टर में इन फ़ील्ड्स के बिना पॉड को स्वीकार नहीं किया जाएगा।
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # इमेज खींचते समय क्लस्टर बंद Harbor के सामने खुद को कैसे पेश करेगा। इस सीक्रेट के संदर्भ
      # के बिना पॉड ImagePullBackOff में अटक जाएगा।
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # कंटेनर के अधिकार न्यूनतम तक घटा दिए गए हैं: बढ़ाना मना है, कर्नेल विशेषाधिकार नहीं हैं।
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # वही इमेज जो डायरेक्टरी की है। उन्हें केवल नीचे का MODE अलग करता है।
          image: HARBOR-HOST/passes/passes-api:v2
          # पोर्ट का नाम इसलिए ज़रूरी है ताकि प्रोब और Service नाम का संदर्भ दें, संख्या का नहीं।
          ports:
            - containerPort: 8080
              name: http
          # एप्लिकेशन का पूरा व्यवहार यहाँ तय होता है। ध्यान दें: सूची में REDIS_ADDR और REDIS_PASSWORD
          # वेरिएबल नहीं हैं — और ठीक इसीलिए कैश बंद है,
          # और हर अनुरोध ईमानदारी से धीमी डायरेक्टरी तक जाता है।
          env:
            # MODE=api — यह इंस्टेंस खुद «Пропуск» सेवा के रूप में काम करता है।
            - name: MODE
              value: "api"
            # संस्करण और रजिस्ट्री एप्लिकेशन को चलने के लिए ज़रूरी नहीं हैं — वे «/» के जवाब में दिखते हैं
            # और आपको यह पक्का करने देते हैं कि ठीक वही चल रहा है जो आपने अभी बनाया।
            - name: APP_VERSION
              value: "v2"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # डेटा के लिए कहाँ जाना है। सेवा का नाम, पता नहीं: डायरेक्टरी की प्रतियाँ
            # जितनी बार चाहें फिर से बन सकती हैं, नाम नहीं बदलता।
            - name: HR_URL
              value: "http://hr-legacy.default.svc.cluster.local"
            # कौन और कहाँ अनुरोध चलाता है। ये तीन मान क्लस्टर खुद भरता है:
            # इन्हें पहले से कोई नहीं जानता। ये सेवा के जवाब में आ जाते हैं, और इनसे दिखता है
            # कि किस प्रति ने और किस नोड पर जवाब दिया, — यह मापन के समय काम आएगा।
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — नोड चुनते समय जो आरक्षित होता है, limits — अधिकतम सीमा। यहाँ एक कोर की सीमा
          # लालच नहीं है: लोड के तहत एप्लिकेशन इसी से टकराएगा, न कि पूरा नोड खा जाएगा,
          # और मापन डायरेक्टरी की देरी दिखाएगा, न कि प्रोसेसर के लिए संघर्ष।
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # जब तक /healthz जवाब नहीं देता, Service इस प्रति में एक भी अनुरोध नहीं भेजेगा।
          # अपडेट के दौरान यही फ़ील्ड आपको विफलता से बचाता है: पुरानी प्रतियाँ तब तक नहीं हटाई जातीं,
          # जब तक नई प्रतियाँ तैयार होने की सूचना नहीं देतीं।
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — दोनों प्रतियों के लिए एक स्थिर नाम और उनके बीच अनुरोधों का वितरण।
# पॉड्स फिर से बनते हैं और IP बदलते हैं, नाम passes-api बना रहता है। इसी नाम से सेवा तक
# Fortio और जाँच स्क्रिप्ट दोनों पहुँचते हैं।
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # वह लेबल जिससे Service जीवित प्रतियों की सूची इकट्ठा करता है। पॉड्स के लेबल से मेल न खाए तो —
  # Service मौजूद रहेगा और कहीं नहीं ले जाएगा।
  selector:
    app: passes-api
  ports:
    # बाहर से 80 पर पहुँचते हैं, पॉड के अंदर http नाम वाले पोर्ट (8080) पर जाता है।
    - port: 80
      targetPort: http
