---
# लैब 7 · कैश को असल में चालू करना। यह पहले से डिप्लॉय किए गए passes-api के ऊपर लागू होता है
# आपके `lab` क्लस्टर में (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch.yaml
#
# यह एक पैच है, पूरा मैनिफ़ेस्ट नहीं: यहाँ केवल वही वर्णित है जो बदलता है। बाकी सब कुछ —
# इमेज, लेबल, प्रोब, रिसोर्स — passes-api.yaml से अछूता रहता है। इसीलिए फ़ाइल
# सीधे spec: से शुरू होती है: कंटेनर तक का रास्ता Deployment की संरचना को दोहराता है, ताकि
# क्लस्टर समझ सके कि संपादन ठीक कहाँ लागू करना है।
#
# कंटेनर का नाम `api` सजावट नहीं बल्कि एक पता है: क्लस्टर इसका उपयोग सूची में सही कंटेनर
# ढूँढने के लिए करता है। नाम गलत करेंगे तो संपादन के बजाय एक दूसरा कंटेनर मिलेगा।
#
# REDIS-ADDR के स्थान पर अपने Redis का पता डालें — यह एक प्लेसहोल्डर है, होस्टनेम नहीं।
# पता आप डैशबोर्ड में, अपने managed Redis एप्लिकेशन के कार्ड में से लेते हैं।
spec:
  template:
    spec:
      containers:
        - name: api
          # Kubernetes में env सूचियाँ name फ़ील्ड के आधार पर मर्ज होती हैं, इसलिए नीचे की तीन प्रविष्टियाँ
          # Deployment में पहले से मौजूद प्रविष्टियों को बदलने के बजाय उनमें जुड़ जाती हैं।
          env:
            # इस वेरिएबल का प्रकट होना ही «कैश चालू करना» है: एप्लिकेशन इसे स्टार्ट पर जाँचता है
            # और, यदि यह सेट है, तो पहले Redis में जाता है। खाली या
            # अनुपस्थित — तो पहले की तरह काम करता है, हर अनुरोध पर डायरेक्टरी में जाकर।
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
            # पासवर्ड को टेक्स्ट के रूप में नहीं लिखते: यह एक सीक्रेट से आता है, जिसे आप
            # एक अलग कमांड से बनाएँगे। Git में पड़े मैनिफ़ेस्ट में
            # पासवर्ड की कोई जगह नहीं।
            #
            # secretKeyRef एक संदर्भ है: name — उसी क्लस्टर में सीक्रेट ऑब्जेक्ट का नाम,
            # key — उसके अंदर से कौन-सा फ़ील्ड लेना है। मान पॉड के शुरू होने पर प्रतिस्थापित
            # होता है और फ़ाइल में कभी प्रकट नहीं होता।
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
            # कोई रिकॉर्ड कैश में कितने सेकंड जीवित रहता है। साठ — क्योंकि
            # कर्मचारी डायरेक्टरी दिन में एक बार बदलती है, हर सेकंड नहीं।
            #
            # अवधि जितनी लंबी — डायरेक्टरी में उतना कम जाते हैं, पर बासी उपनाम उतनी
            # देर तक देते हैं। जितनी छोटी — डेटा उतना ताज़ा, लाभ उतना कम। यह एक समझौता है,
            # सही मान वाली कोई सेटिंग नहीं।
            - name: CACHE_TTL
              value: "60"
