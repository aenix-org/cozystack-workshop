---
# लैब 7 · यह पैच जानबूझकर अधूरा है। यह इसलिए है कि आप देख सकें कि यह कैसा दिखता है जब
# «कैश जैसे चालू तो कर दिया, पर तेज़ कुछ नहीं हुआ»। काम करने वाला संस्करण cache-patch.yaml में है।
#
# आपके `lab` क्लस्टर में लागू होता है (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch-broken.yaml
#
# उत्तर में झाँकने की ज़रूरत नहीं है। इसे लागू करें, दो-चार अनुरोध करें और एप्लिकेशन के
# लॉग देखें: kubectl logs -l app=passes-api. एप्लिकेशन बताता है कि उसके साथ क्या गड़बड़ है,
# — बात बस इतनी है कि संदेश पढ़ें और समझें कि इस फ़ाइल में क्या कमी है।
#
# REDIS-ADDR की जगह अपने Redis का पता डालें (पता खोजने वाला चरण देखें)।
# प्लेसहोल्डर छोड़ना नहीं है: तब आपको वह त्रुटि नहीं, बल्कि दूसरी त्रुटि मिलेगी जिसके लिए यह सब किया गया था।
spec:
  template:
    spec:
      containers:
        # कंटेनर का नाम — वह पता है जिससे क्लस्टर संपादन की जगह ढूँढता है।
        - name: api
          env:
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
