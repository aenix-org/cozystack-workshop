# लैब 1. पूरा rickroll प्रशिक्षण ऐप एक ही फ़ाइल में: nginx सेटिंग्स, पेज,
# स्वयं डिप्लॉयमेंट, और उस तक पहुँचने का एक स्थायी पता। चार ऑब्जेक्ट, `---` से अलग किए गए।
#
# आपके प्रशिक्षण क्लस्टर `lab` पर लागू किया जाता है, न कि प्रबंधन क्लस्टर के टेनेंट में:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll.yaml
# यहाँ tenant-workshopXX जैसे कोई प्लेसहोल्डर नहीं हैं — आपको कहीं भी अपना नंबर डालने की ज़रूरत नहीं है।
#
# जो फ़ील्ड चारों ऑब्जेक्ट में दोहराई जाती हैं, उन्हें यहाँ एक बार समझा दिया गया है:
#   apiVersion — वह API समूह जिसमें यह ऑब्जेक्ट प्रकार रहता है;
#   kind       — स्वयं ऑब्जेक्ट का प्रकार;
#   metadata.name — वह नाम जिससे बाद में `kubectl get` के ज़रिए ऑब्जेक्ट को खोजा जाता है।
# नाम अपने प्रकार के भीतर अद्वितीय होता है, इसलिए नीचे Deployment और Service दोनों
# rickroll कहलाते हैं और टकराते नहीं।
---
# nginx सेटिंग्स। पेज के संस्करणों के बीच ये नहीं बदलतीं, इसलिए इन्हें अलग रखा गया है।
# ConfigMap — एक सेटिंग्स फ़ाइल जो क्लस्टर में स्वयं अलग से रहती है और शुरू होने पर
# कंटेनर के अंदर रख दी जाती है। मकसद यह है कि इमेज को दोबारा बनाए बिना सेटिंग्स बदली जा सकें।
# `default.conf` कुंजी उस डायरेक्टरी में फ़ाइल का नाम बन जाएगी जहाँ वॉल्यूम माउंट किया गया है।
#
# `|` के बाद इंडेंट के नीचे जो कुछ भी है, वह YAML नहीं बल्कि फ़ाइल की शब्दशः सामग्री है। इस ब्लॉक
# के अंदर हैश वाली पंक्तियाँ पार्सिंग के दौरान गायब होने के बजाय nginx कॉन्फ़िग में ज्यों-की-त्यों
# पहुँच जाती हैं। इसी कारण नीचे पेज वाले ब्लॉक में कोई टिप्पणी नहीं जोड़ी गई:
# वह HTML है, और वहाँ हैश उपयोगकर्ता को स्क्रीन पर दिखाई देता।
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-conf
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      location / {
        # लैब का पूरा मर्म: nginx अपने पॉड का नाम सीधे HTML में डाल देता है।
        # पॉड के अंदर $hostname ठीक वही पॉड का नाम है।
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
---
# पेज, संस्करण 1. सेटिंग्स से अलग एक ऑब्जेक्ट — ताकि लैब 4 में nginx कॉन्फ़िग को छुए बिना और
# इमेज को दोबारा बनाए बिना ऐप को दूसरे संस्करण पर स्विच किया जा सके।
# नाम में -v1 प्रत्यय सजावट नहीं है: उसके साथ rickroll-page-v2 आएगा, और उनके बीच
# वॉल्यूम को स्विच करना ही नए संस्करण की रोलआउट है।
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v1
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Never Gonna Give You Up</title>
    <style>
      body{background:#0d0d12;color:#e8e8ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#ff0057,#ffb800,#00e0ff,#ff0057);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#9aa0b5;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#6f7690}
      .pod b{display:block;margin-top:.4em;color:#00e0ff;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#4d5366;font-size:14px}
    </style>
    <h1>Never Gonna Give You Up</h1>
    <p class="lyr">Never gonna let you down &middot; Never gonna run around and desert you</p>
    <div class="pod">सेवा प्रदान करने वाला Pod<b>__POD__</b></div>
    <p class="hint">पेज को रिफ़्रेश करें। जब रेप्लिका ज़्यादा हो जाएँगी — नाम बदलने लगेगा।</p>
    </html>
---
# स्वयं ऐप। Deployment वांछित स्थिति का वर्णन करता है — कौन-सी इमेज चलानी है,
# कितनी प्रतियाँ रखनी हैं, अपडेट के समय उन्हें कैसे बदलना है। इसके आगे क्लस्टर स्वयं
# वास्तविकता को इस वर्णन के अनुरूप लाता है और उसे लगातार देखता रहता है, केवल बनाते समय एक बार नहीं।
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rickroll
  labels:
    app: rickroll
spec:
  # कितनी प्रतियाँ चालू रखनी हैं। शब्द ठीक ऐसे हैं: "एक चालू करो" नहीं,
  # बल्कि "एक बनाए रखो"। अगर कोई प्रति गायब हो जाए, तो क्लस्टर बिना पूछे नई बना देता है। लैब 3 में
  # ऑटोस्केलिंग इसी फ़ील्ड को बदलने लगेगी, इसलिए इसे हाथ से और नहीं छूते।
  replicas: 1
  # किस लेबल से Deployment पॉड्स को अपना मानता है। यहाँ का लेबल और नीचे टेम्पलेट में का लेबल
  # मेल खाने ही चाहिए: बेमेल होने पर ऑब्जेक्ट बिल्कुल नहीं बनेगा।
  selector:
    matchLabels:
      app: rickroll
  # पॉड टेम्पलेट — हर प्रति इसी से ढाली जाती है। template के अंदर किसी भी फ़ील्ड में बदलाव
  # का मतलब है ऐप का नया संस्करण और प्रतियों को एक-एक करके बदलना (यही ठीक लैब 4 है)।
  # template के बाहर फ़ील्ड (उदाहरण के लिए, replicas) बदलने से संस्करण नहीं बनता।
  template:
    metadata:
      labels:
        # वही लेबल स्वयं पॉड्स पर भी लगा है: फ़ाइल के अंत का Service इसी से उन्हें खोजता है।
        app: rickroll
    spec:
      # पूरे पॉड के स्तर पर `restricted` सुरक्षा प्रोफ़ाइल की आवश्यकताएँ: root के रूप में
      # न चलना, एक विशिष्ट UID, और मानक seccomp प्रोफ़ाइल। `restricted` चालू किए गए कॉर्पोरेट
      # क्लस्टर में इन फ़ील्ड के बिना पॉड को चलने की अनुमति नहीं मिलेगी,
      # और अस्वीकृति पॉड बनाते समय आती है, न कि मैनिफ़ेस्ट apply पर।
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # वही सख़्ती, पर कंटेनर के स्तर पर: अंदर की प्रक्रिया को अपने अधिकार बढ़ाने
          # की मनाही है, और उससे सभी linux क्षमताएँ छीन ली गई हैं।
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # अनप्रिविलेज्ड संस्करण: 8080 पर सुनता है और root के रूप में नहीं चलता।
          # यह अकेला `baseline` प्रोफ़ाइल के लिए काफ़ी है, पर `restricted` के लिए नहीं — उसे
          # पॉड और कंटेनर पर स्पष्ट securityContext चाहिए, जो ऊपर दिए गए हैं। कॉर्पोरेट
          # क्लस्टर में आमतौर पर `restricted` ही चालू होता है।
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # डिफ़ॉल्ट रूप से nginx नोड के प्रति कोर एक वर्कर प्रक्रिया शुरू करता है। एक कोर वाली
          # प्रशिक्षण मशीन पर यह एक प्रक्रिया है, पर 64 कोर वाले प्रोडक्शन नोड पर 64,
          # और छोटी मेमोरी लिमिट वाला पॉड पहली रिक्वेस्ट से पहले ही OOMKilled से मर जाता है।
          # ऑटोट्यून वर्कर्स को CPU लिमिट के हिसाब से गिनता है: 300m पर यह एक प्रक्रिया है।
          # एक एन्वायरनमेंट वेरिएबल के ज़रिए, न कि -g के ज़रिए: यह डायरेक्टिव पहले से ही इमेज के बेस
          # कॉन्फ़िग में है, और दूसरी घोषणा nginx को "duplicate" त्रुटि के साथ गिरा देती है।
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # पोर्ट को केवल नंबर नहीं, बल्कि नाम दिया गया है: `http` का संदर्भ नीचे readinessProbe
          # और Service के targetPort में है। अगर नंबर बदले, तो एक ही जगह संपादित करना होगा।
          ports:
            - containerPort: 8080
              name: http
          # दो अलग-अलग चीज़ें जिन्हें लगातार गड्ड-मड्ड किया जाता है। requests — संसाधन का कितना हिस्सा
          # गारंटी के साथ आरक्षित करना है; इसी से शेड्यूलर नोड चुनता है, और इसी से
          # लैब 3 में ऑटोस्केलिंग प्रतिशत में लोड गिनती है।
          # limits — वह छत जिससे ऊपर उठने नहीं दिया जाता: CPU पर सीमा पर पहुँचने पर
          # धीमा किया जाता है, मेमोरी पर कंटेनर को मार दिया जाता है।
          resources:
            # जान-बूझकर मामूली: वर्कशॉप पर ऐसे ऐप बहुत होंगे।
            # 20m एक कोर के दो सौवें हिस्से जितना है। मान जान-बूझकर कम है: requests जितना
            # छोटा होगा, लोड उतनी तेज़ी से सीमा पार करेगा और लैब 3 में प्रतियों की बढ़त
            # आधे घंटे में नहीं, बल्कि सेकंडों में दिखेगी।
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          # रेडीनेस जाँच। जब तक इस पते पर जवाब नहीं आता, क्लस्टर उस प्रति पर ट्रैफ़िक नहीं
          # भेजता। इसी के लिए nginx कॉन्फ़िग में "ok" जवाब वाला एक अलग location /healthz
          # बनाया गया है। इसी फ़ील्ड से लैब 4 में बिना डाउनटाइम रोलआउट का मोल चुकाया जाता है:
          # पुरानी प्रति को तभी बंद किया जाता है जब नई जवाब दे चुकी होती है।
          # इसे हटा दें — और अपडेट रिक्वेस्ट गिराने लगेगा।
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            # पहली दस्तक से पहले दो सेकंड — अनुभव से चुना गया। इससे कम का कोई मतलब
            # नहीं, nginx को शुरू होने में इतना समय लगता ही है; ज़्यादा — हर रोलआउट को व्यर्थ खींचेगा।
            initialDelaySeconds: 2
          # कंटेनर के अंदर ConfigMap की सामग्री कहाँ रखनी है। डायरेक्टरी मनमाने ढंग से नहीं
          # चुनी गईं: पहली से nginx फ़ाइलें परोसता है, दूसरी से सेटिंग्स पढ़ता है।
          # इन दो पंक्तियों के बिना दोनों ConfigMap यूँ ही क्लस्टर में पड़े रहते,
          # और nginx अपना डिफ़ॉल्ट पेज दिखाता।
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
      # पॉड में कौन-से ConfigMap जोड़ने हैं। यहाँ वॉल्यूम का नाम इसे ऊपर volumeMounts की
      # प्रविष्टि से जोड़ता है — मेल नामों को खाना चाहिए; बंधन के लिए क्रम मायने नहीं रखता।
      # पर लैब 4 के लिए मायने रखता है, नीचे की चेतावनी देखें।
      volumes:
        # ध्यान दें: यह वॉल्यूम पहला होना चाहिए (volumes[0])।
        # लैब 4 पेज संस्करण को इंडेक्स द्वारा पैच से स्विच करता है।
        # JSON Patch सूची के तत्व को नाम से नहीं, बल्कि नंबर से संबोधित करता है। वॉल्यूम को
        # आपस में बदल दें — और पैच चुपचाप पेज के बजाय nginx सेटिंग्स बदल देगा, ऐप
        # टूट जाएगा, और त्रुटि संदेश बिल्कुल किसी और चीज़ की बात कर रहा होगा।
        - name: page
          configMap:
            name: rickroll-page-v1
        - name: conf
          configMap:
            name: rickroll-conf
---
# ऐप का स्थायी पता। प्रतियाँ जन्म लेती और मरती हैं, उनके पते बदलते हैं, पर क्लस्टर के भीतर
# `rickroll` नाम वही रहता है — इसी से पड़ोसी ऐप को पुकारते हैं।
# इस नाम के पीछे जीवित प्रतियों की सूची क्लस्टर स्वयं, लेबल के अनुसार, रखता है।
apiVersion: v1
kind: Service
metadata:
  name: rickroll
spec:
  # इस पते के पीछे किसे रखना है: ऐसे लेबल वाले सभी पॉड, चाहे उन्हें किसी ने भी बनाया हो।
  # इसी से एक सामान्य परेशानी — app: rickroll लेबल वाला कोई बाहरी पॉड
  # चुपचाप लोड बैलेंसिंग में आ जाएगा और आपके उपयोगकर्ताओं को जवाब देने लगेगा। इस फ़ोल्डर की
  # check.sh स्क्रिप्ट अलग से जाँचती है कि ऐसे कोई नकली मौजूद न हों।
  selector:
    app: rickroll
  ports:
    # port — सर्विस स्वयं किस पोर्ट पर जवाब देती है, targetPort — वह पॉड के अंदर कहाँ दस्तक
    # देती है। यहाँ targetPort नंबर से नहीं, बल्कि कंटेनर के पोर्ट के नाम से दिया गया है: अगर
    # कंटेनर में नंबर बदले — इस फ़ाइल को संपादित नहीं करना पड़ेगा।
    - port: 80
      targetPort: http
