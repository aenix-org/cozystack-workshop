---
# लैब 12. लेगेसी स्टाफ डायरेक्टरी के लिए एक वर्चुअल मशीन: डिस्क और मशीन स्वयं,
# एक ही फाइल में दो ऑब्जेक्ट, `---` लाइन से अलग किए गए।
#
# ये टेनेंट ऑब्जेक्ट हैं: ये `lab` क्लस्टर में नहीं, बल्कि मैनेजमेंट क्लस्टर पर आपके
# namespace में रहते हैं। आपको टेनेंट kubeconfig चाहिए।
#
# लागू करने से पहले, tenant-workshopXX को अपने namespace से बदलें, अन्यथा ऑर्डर आपके नहीं
# बल्कि गलत टेनेंट में चला जाएगा।
#
#     export KUBECONFIG=~/.kube/workshop
#     kubectl apply -f staff-directory-vm.yaml
#
# वही काम टेनेंट डैशबोर्ड में माउस से किया जा सकता है (एप्लिकेशन बनाएँ -> VM Disk,
# फिर VM Instance) — परिणाम एक जैसा होता है।
#
# ध्यान दें: जिस नाम से मशीन को आगे बुलाया जाता है वह metadata.name से मेल नहीं खाता, और यह
# लैब में टाइपो नहीं है। प्लेटफॉर्म X नाम के VMInstance ऑब्जेक्ट को `vm-instance` चार्ट से
# डिप्लॉय करता है, और चार्ट का नाम रिलीज़ के नाम से जुड़ जाता है: चालू इंस्टेंस
# vm-instance-X कहलाता है। इसके अलावा, टारगेट को टाइप प्रीफिक्स के साथ निर्दिष्ट किया जाता है, क्योंकि
# टेनेंट अनुमतियाँ इंस्टेंस (virtualmachineinstances, यानी vmi) पर दी जाती हैं, न कि
# virtualmachines पर — केवल नाम forbidden लौटाएगा। इसलिए कंसोल लॉगिन कमांड:
#     virtctl console --namespace=tenant-workshopXX vmi/vm-instance-spravochnik
# चालू इंस्टेंस की सूची: kubectl get vmi -n tenant-workshopXX
# और `kubectl get vminstance spravochnik` इंस्टेंस नहीं दिखाता, बल्कि उसके लिए आपका ऑर्डर दिखाता है —
# वही ऑब्जेक्ट जो नीचे वर्णित है।
#
# डिस्क और मशीन दो अलग-अलग ऑब्जेक्ट हैं, और यह नौकरशाही नहीं है: डिस्क
# मशीन से अधिक समय तक जीवित रहती है। मशीन को हटाकर फिर से बनाया जा सकता है, वही डिस्क जोड़कर।
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  source:
    image:
      # URL नहीं, बल्कि प्लेटफॉर्म के साझा इमेज संग्रह से एक नाम।
      # डिस्क बनाते समय सूची डैशबोर्ड में दिखती है।
      name: ubuntu-22.04
  # डिस्क का आकार। यह स्रोत इमेज से छोटा नहीं हो सकता: ubuntu-22.04 का विस्तार
  # 20Gi तक होता है, और प्लेटफॉर्म 10Gi डिस्क को भरने से मना कर देगा। डिस्क को बाद में बढ़ाया जा सकता है,
  # लेकिन घटाया नहीं जा सकता, इसलिए यहाँ कम आँकना अधिक आँकने से महँगा पड़ता है।
  storage: 20Gi
  # स्टोरेज क्लास। `replicated` — डेटा को अलग-अलग प्लेटफॉर्म नोड्स पर कई प्रतियों में
  # लिखा जाता है: प्रति वाला नोड मर सकता है, और मशीन काम करती रहती है। मूल रूप से यह एक
  # मिरर है, बस नेटवर्क पर बनाया गया। वही क्लास पड़ोसी लैब्स में डेटाबेस उपयोग करते हैं।
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  # 1 CPU, 4 GB. वही कैटलॉग रेफरेंस जिससे Kubernetes
  # नोड आकार लिए जाते हैं: मशीनें और नोड्स यहाँ एक ही तरह मापे जाते हैं।
  instanceType: u1.medium
  # गेस्ट OS प्रोफाइल: मशीन को कौन से ड्राइवर और डिवाइस देने हैं।
  instanceProfile: ubuntu
  # Always का अर्थ है "इसे चालू रखें": अगर यह अपने आप बंद हो जाए, तो फिर से चालू किया जाता है।
  # Halted — बंद, Manual — जैसा छोड़ा गया।
  runStrategy: Always
  # मशीन से कौन सी डिस्क जोड़नी हैं। रेफरेंस ऊपर के VMDisk ऑब्जेक्ट के नाम से जाता है — वही
  # जो इस मशीन से अधिक समय तक जीवित रहेगा।
  disks:
    - name: spravochnik
  # ध्यान दें: यहाँ replicas फील्ड नहीं है और न होगा।
  # एक वर्चुअल मशीन एक अकेला ऑब्जेक्ट है। अगर आपको दो मशीनें चाहिए — तो अलग-अलग नामों वाले
  # दो ऑब्जेक्ट। यह Deployment से एक मौलिक अंतर है,
  # देखें README का वह सेक्शन जहाँ यह अंतर चुभता है।
  # गेस्ट OS की प्रारंभिक सेटअप। cloud-init लिनक्स क्लाउड इमेज का मानक तंत्र है:
  # पहली बूट पर मशीन इस टेक्स्ट को पढ़ती है और इसे खुद पर लागू करती है। भूमिका के अनुसार
  # यह vSphere में गेस्ट कस्टमाइज़ेशन है — पासवर्ड, फाइलें, सेवाएँ — बस विज़ार्ड से नहीं, वर्णन से।
  # `|` के बाद इंडेंटेशन के नीचे सब कुछ गेस्ट में शब्दशः जाता है और वहीं पार्स होता है,
  # Kubernetes द्वारा नहीं।
  #
  # यहाँ cloud-init डायरेक्टरी को सर्वर में बदल देता है: यह एक HTML पेज रखता है और एक सेवा सेट करता है
  # जो इसे पोर्ट 8080 पर HTTP के जरिए परोसती है। python3 पहले से ubuntu इमेज में है — इसके लिए इंटरनेट
  # की जरूरत नहीं। पोर्ट 8080 यादृच्छिक नहीं है: प्रशिक्षक ने आपके टेनेंट में पहले से
  # एक Service `spravochnik-http` (80 -> 8080) और एक Ingress `spravochnik` बनाया है, और जैसे ही मशीन के
  # अंदर सेवा चालू होती है, डायरेक्टरी टेनेंट डोमेन पर प्रकाशित हो जाएगी।
  cloudInit: |
    #cloud-config
    # पासवर्ड डैशबोर्ड से कंसोल में लॉग इन करने के लिए चाहिए। प्रोडक्शन मशीन पर
    # ऐसा नहीं करना चाहिए — वहाँ sshKeys का उपयोग करें।
    password: ubuntu
    chpasswd: { expire: false }
    ssh_pwauth: true
    write_files:
      - path: /opt/directory/index.html
        content: |
          <!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Справочник</title></head><body><h1>Справочник сотрудников</h1><ul><li>Иванов И. — 101</li><li>Петров П. — 102</li></ul></body></html>
      - path: /etc/systemd/system/directory.service
        content: |
          [Unit]
          Description=Staff directory
          After=network.target
          [Service]
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0 --directory /opt/directory
          Restart=always
          [Install]
          WantedBy=multi-user.target
    runcmd: [ "systemctl daemon-reload", "systemctl enable --now directory" ]
