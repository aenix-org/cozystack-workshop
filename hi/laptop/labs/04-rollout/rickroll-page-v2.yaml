---
# लैब 4. पेज का दूसरा संस्करण — वही जिसे हम लोड के अंतर्गत रोल आउट करते हैं।
# इसमें साफ़ अंतर दिखना चाहिए: प्रतिभागी ब्राउज़र देखता है, diff नहीं।
#
# एक ही ऑब्जेक्ट। इसे आपके प्रशिक्षण क्लस्टर `lab` पर लागू किया जाता है, न कि
# मैनेजमेंट क्लस्टर के टेनेंट पर:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll-page-v2.yaml
# यहाँ tenant-workshopXX जैसे कोई प्लेसहोल्डर नहीं हैं — कहीं भी अपना नंबर डालने की ज़रूरत नहीं।
#
# यहाँ लोग जिस मुख्य बात पर अटकते हैं: यह apply अपने आप कुछ भी रोल आउट नहीं करता।
# यह क्लस्टर में पहले वाले के बगल में एक और सेटिंग्स फ़ाइल रख देता है। जब तक Deployment का
# `page` वॉल्यूम rickroll-page-v1 को संदर्भित करता है, उपयोगकर्ता पहला संस्करण देखते हैं।
# रोलआउट लैब का अगला चरण बन जाता है — वॉल्यूम को इस ConfigMap पर स्विच करना।
# इसीलिए पूरी दो-ऑब्जेक्ट वाली संरचना है: पहला संस्करण क्लस्टर में
# अछूता बना रहता है, और रोलबैक उसे पूरी तरह वापस लाता है, न कि स्मृति से पुनर्निर्मित करता है।
#
# अगर इसके बजाय हम rickroll-page-v1 ConfigMap को उसी जगह संपादित करते, तो
# रोलबैक करने के लिए कोई जगह नहीं होती, और पॉड्स को नई सामग्री बिना प्रतियाँ बदले और बिना
# रिवीज़न इतिहास में रिकॉर्ड के मिल जाती — यानी उस सब के बिना जिसके लिए यह लैब की जाती है।
#
# ऑब्जेक्ट का नाम बदला नहीं जा सकता: rickroll-page-v2 को README के पैच
# और check.sh की जाँच द्वारा संदर्भित किया जाता है।
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v2
data:
  # `|` के बाद के इंडेंट से नीचे जो कुछ भी है, वह index.html फ़ाइल की शब्दशः सामग्री है,
  # जो कंटेनर के अंदर पहुँचेगी। यह अब YAML नहीं है: यहाँ कोई टिप्पणियाँ नहीं हैं
  # और हो भी नहीं सकतीं, हैश चिह्न पेज पर सामान्य टेक्स्ट की तरह दिख जाता।
  #
  # मार्कअप में दो चीज़ें महत्वपूर्ण हैं, जिन्हें check.sh देखता है: कैप्शन «ВЕРСИЯ 2» —
  # इसी से जाँच दूसरे संस्करण को पहले से अलग पहचानती है, और प्लेसहोल्डर __POD__ — इसे
  # rickroll-conf ConfigMap (लैब 1) के नियम के अनुसार nginx पॉड के नाम से बदल दिया जाता है।
  # इनमें से किसी को भी हटा दें तो लैब की जाँच पास नहीं होगी, हालाँकि रोलआउट सफल रहेगा।
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>We're No Strangers To Love</title>
    <style>
      body{background:#07131a;color:#e8f6ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      .tag{display:inline-block;margin-bottom:1.5em;padding:.35em 1em;border-radius:999px;
           background:#00e0ff;color:#052; font-weight:700;letter-spacing:.08em;font-size:13px}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#00ffa3,#00e0ff,#7a5cff,#00ffa3);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#7f96a3;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#5d7380}
      .pod b{display:block;margin-top:.4em;color:#00ffa3;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#3f5561;font-size:14px}
    </style>
    <div class="tag">ВЕРСИЯ 2</div>
    <h1>We're No Strangers To Love</h1>
    <p class="lyr">You know the rules &middot; And so do I</p>
    <div class="pod">вас обслужил под<b>__POD__</b></div>
    <p class="hint">Обновление прошло под нагрузкой. Посмотрите в Fortio: ошибок ноль.</p>
    </html>
