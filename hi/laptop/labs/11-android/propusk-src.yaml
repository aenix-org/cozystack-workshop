---
# लैब 11. मोबाइल एप्लिकेशन «Пропуск» के सोर्स — यही बिल्ड को इनपुट के रूप में दिया जाता है।
#
# यह आपके प्रशिक्षण क्लस्टर `lab` पर लागू किया जाता है, न कि प्रबंधन क्लस्टर के टेनेंट में:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f propusk-src.yaml
# यहाँ tenant-workshopXX जैसे कोई प्लेसहोल्डर नहीं हैं — अपना नंबर कहीं भी डालने की ज़रूरत नहीं।
# Namespace भी निर्दिष्ट नहीं है: ऑब्जेक्ट उसी में जाएगा जो आपके kubeconfig में लिखा है।
#
# एप्लिकेशन जानबूझकर बहुत छोटा है: एक activity, स्क्रीन पर टेक्स्ट की एक पंक्ति।
# लैब का मतलब Android नहीं है, बल्कि यह है कि बिल्ड क्लस्टर तक जाता है।
#
# ये फ़ाइलें क्या हैं, अगर आपने कभी मोबाइल एप्लिकेशन नहीं बनाए हैं।
# Android प्रोजेक्ट कोड वाली एक फ़ाइल नहीं है, बल्कि तीन प्रकार की फ़ाइलों का पेड़ है:
#   *.gradle.kts  बिल्ड का विवरण: लाइब्रेरी कहाँ से लें, किससे कंपाइल करें, किन
#                 Android संस्करणों के लिए बनाएँ। भूमिका के हिसाब से यह makefile है, बस Kotlin भाषा में;
#   *.kt          स्वयं एप्लिकेशन का कोड;
#   *.xml         रिसोर्स: टेक्स्ट और इसका विवरण कि आइकन पर टैप करने पर कौन-सी स्क्रीन
#                 खुले।
# Gradle बिल्डर इस पेड़ को पढ़ता है और APK बनाता है — फ़ोन के लिए एक इंस्टॉलर फ़ाइल,
# भूमिका के हिसाब से वही जो Windows के लिए .msi है। आपको Android SDK खुद इंस्टॉल करके हाथ से
# बनाने की ज़रूरत नहीं: यह काम android-build.yaml का Job करेगा, और यहाँ केवल उसका इनपुट पड़ा है।
#
# सोर्स ConfigMap में पड़े हैं, इमेज में नहीं, ठीक उसी कारण से जिसकी वजह
# से पहले एप्लिकेशन वाली लैब में nginx का पेज ConfigMap में पड़ा था:
# ताकि उन्हें बदलने के लिए कुछ भी दोबारा न बनाना पड़े। ConfigMap क्लस्टर का ऑब्जेक्ट है, जिसके
# अंदर टेक्स्ट फ़ाइलें पड़ी होती हैं; कंटेनर के शुरू होने पर क्लस्टर उन्हें
# उसके अंदर डिस्क की सामान्य फ़ाइलों की तरह रख देता है।
#
# `data` के अंदर की keys फ़ाइलों के नाम हैं, और `|` के बाद के इंडेंट से नीचे जो कुछ है, वह
# फ़ाइल की हूबहू सामग्री है, YAML नहीं। ऐसे ब्लॉक के अंदर रखी टिप्पणी
# स्वयं फ़ाइल की एक पंक्ति बन जाती, इसलिए नीचे के सभी स्पष्टीकरण बाहर,
# key से पहले हैं।
#
# छह keys का सपाट नक्शा डायरेक्टरी पेड़ में यहाँ नहीं, बल्कि माउंट के समय खुलता है:
# «key -> path» का मिलान android-build.yaml में, volumes.items ब्लॉक में
# तय किया गया है। ConfigMap की key में स्लैश नहीं हो सकता — इसीलिए सपाट नाम
# app-build.gradle.kts, जो प्रोजेक्ट में app/build.gradle.kts बन जाता है।
apiVersion: v1
kind: ConfigMap
metadata:
  name: propusk-src
data:
  # प्रोजेक्ट की शीर्ष-स्तरीय फ़ाइल: बताती है कि Gradle प्लगइन और लाइब्रेरी कहाँ से लेता है और कौन-से
  # मॉड्यूल प्रोजेक्ट का हिस्सा हैं (यहाँ एक है — app)। तीनों रिपॉज़िटरी सार्वजनिक हैं, इंटरनेट पर:
  # बिल्ड कंटेनर खाली शुरू होता है और वहाँ से सब कुछ खींचता है, इसीलिए बिल्ड में इतना समय लगता है।
  # यही वह जगह है जिसे आप सबसे पहले ठीक करेंगे जब सूचना सुरक्षा बाहरी पहुँच बंद कर देगी — यहाँ
  # एक आंतरिक प्रॉक्सी-रिपॉज़िटरी लिखी जाएगी, ठीक वैसे ही जैसे Docker Hub को Harbor से बदला गया था।
  settings.gradle.kts: |
    pluginManagement {
      repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
      }
    }
    dependencyResolutionManagement {
      repositories {
        google()
        mavenCentral()
      }
    }
    rootProject.name = "propusk"
    include(":app")

  # रूट बिल्ड फ़ाइल: दो प्लगइन के संस्करण तय करती है — Android बिल्डर और Kotlin
  # कंपाइलर। `apply false` का मतलब है «संस्करण घोषित करो, पर रूट प्रोजेक्ट में उसे चालू मत करो»:
  # उन्हें app मॉड्यूल चालू करेगा। संस्करण जानबूझकर कील की तरह ठोंके गए हैं। जो बिल्ड
  # «नवीनतम» खींचता है, वह एक महीने बाद आज से अलग तरह से बनता है, और उसे सुलझाना आपको ही पड़ेगा।
  build.gradle.kts: |
    plugins {
      id("com.android.application") version "8.5.2" apply false
      id("org.jetbrains.kotlin.android") version "1.9.24" apply false
    }

  # स्वयं एप्लिकेशन मॉड्यूल का विवरण। यहाँ तीन संख्याएँ हैं, जिन पर निर्भर करता है कि बिल्ड क्या
  # डाउनलोड करेगा और एप्लिकेशन कहाँ चलेगा भी:
  #   compileSdk 34   Android SDK का वह संस्करण जिससे हम कंपाइल करते हैं। यही SDK इंस्टॉल चरण
  #                   डाउनलोड करता है — लगभग डेढ़ गीगाबाइट, बिल्ड का सबसे लंबा चरण;
  #   minSdk 24       सबसे पुराना Android जिस पर एप्लिकेशन चलेगा (यह Android 7 है)।
  #                   बढ़ाएँगे — पुराने फ़ोन कट जाएँगे, घटाएँगे — संगतता
  #                   लाइब्रेरी ढोनी पड़ेंगी;
  #   jvmTarget 17    Kotlin, Java बाइटकोड में कंपाइल होता है, और यह संख्या बिल्ड इमेज में
  #                   JDK संस्करण से मेल खानी चाहिए (android-build.yaml में gradle:8.9-jdk17)।
  #                   अगर वे अलग हुए — बिल्ड बाइटकोड संस्करण की असंगति पर गिर जाएगा।
  app-build.gradle.kts: |
    plugins {
      id("com.android.application")
      id("org.jetbrains.kotlin.android")
    }

    android {
      namespace = "io.aenix.propusk"
      compileSdk = 34

      defaultConfig {
        applicationId = "io.aenix.propusk"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
      }

      compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
      }

      kotlinOptions {
        jvmTarget = "17"
      }

      sourceSets {
        getByName("main") {
          java.srcDirs("src/main/kotlin")
        }
      }
    }

  # फ़ोन के लिए एप्लिकेशन का पासपोर्ट: इसमें कौन-सी स्क्रीनें हैं और आइकन पर टैप करने पर
  # कौन-सी खुलती है। ठीक इसी के लिए MAIN और LAUNCHER वाला intent-filter ब्लॉक है —
  # उसके बिना एप्लिकेशन इंस्टॉल तो होगा, पर मेन्यू में उसका आइकन नहीं दिखेगा।
  AndroidManifest.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <manifest xmlns:android="http://schemas.android.com/apk/res/android">
      <application android:label="@string/app_name">
        <activity
            android:name=".MainActivity"
            android:exported="true">
          <intent-filter>
            <action android:name="android.intent.action.MAIN" />
            <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
        </activity>
      </application>
    </manifest>

  # एप्लिकेशन की एकमात्र स्क्रीन — और प्रोजेक्ट में जो भी कोड है वह पूरा।
  # संगतता लाइब्रेरी नहीं, बल्कि सादा android.app.Activity लिया गया है: प्रोजेक्ट की शून्य बाहरी
  # निर्भरताएँ हैं, और इससे हर बिल्ड पर डाउनलोड के कुछ मिनट बचते हैं।
  # R.string.greeting — strings.xml के एक टेक्स्ट का संदर्भ। R क्लास सोर्स में नहीं पड़ा, उसे
  # बिल्ड जनरेट करता है। इसलिए त्रुटि «unresolved reference: R» का मतलब है रिसोर्स जनरेशन चरण का
  # गिरना, कोड में टाइपो नहीं।
  MainActivity.kt: |
    package io.aenix.propusk

    import android.app.Activity
    import android.os.Bundle
    import android.widget.TextView

    class MainActivity : Activity() {
      override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val view = TextView(this)
        view.textSize = 22f
        view.setPadding(48, 96, 48, 48)
        view.text = getString(R.string.greeting)
        setContentView(view)
      }
    }

  # कोड से बाहर निकाले गए टेक्स्ट: इस तरह उन्हें प्रोग्रामर को छुए बिना संपादित और अनुवादित किया जाता है।
  # app_name फ़ोन पर आइकन के नीचे दिखता है, greeting — स्वयं स्क्रीन पर।
  strings.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <resources>
      <string name="app_name">Пропуск</string>
      <string name="greeting">Заказать пропуск для гостя</string>
    </resources>
