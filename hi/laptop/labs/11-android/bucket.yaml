---
# लैब 11. बनाई गई APK के लिए एक बकेट।
#
# बकेट ऑब्जेक्ट स्टोरेज में एक नामित क्षेत्र है: फ़ाइलें पूरी तरह से रखी और ली जाती हैं,
# HTTP के ज़रिए, और कभी कहीं माउंट नहीं की जातीं। अंदर कोई डायरेक्टरी नहीं होती; ऑब्जेक्ट नाम में
# स्लैश केवल इंटरफ़ेस में ही पेड़ (ट्री) के रूप में दिखाया जाता है।
#
# यह एक टेनेंट ऑब्जेक्ट है: यह `lab` क्लस्टर में नहीं, बल्कि प्रबंधन क्लस्टर पर आपके
# namespace में रहता है। इसीलिए यहाँ kubeconfig टेनेंट वाला होना चाहिए,
# वह नहीं जिससे आप `lab` क्लस्टर के साथ काम करते हैं। यह जानबूझकर ऐसा है: बिल्ड आर्टिफ़ैक्ट
# को उस क्लस्टर से अधिक समय तक जीवित रहना चाहिए जिसमें वे बनाए गए थे।
#
# लागू करने से पहले, tenant-workshopXX को अपने namespace से बदलें, अन्यथा ऑर्डर
# ग़लत टेनेंट में चला जाएगा और सबसे अधिक संभावना है कि अनुमति जाँच पास नहीं करेगा।
#
#     export KUBECONFIG=~/.kube/workshop
#     kubectl apply -f bucket.yaml
#
# वही काम टेनेंट डैशबोर्ड में माउस से किया जाता है (Create application -> Bucket)।
# परिणाम एक समान है; अंतर यह है कि टेक्स्ट की समीक्षा की जा सकती है और Git में रखा जा सकता है।
#
# लागू करने के बाद क्या होता है: प्लेटफ़ॉर्म कुछ ही सेकंड में बकेट खड़ा कर देता है
# और एक्सेस कुंजियाँ जारी करता है, उन्हें उसी namespace में सीक्रेट bucket-builds-ci-credentials में
# संग्रहीत करता है। वहाँ से चार मान (endpoint, bucketName, accessKey, secretKey)
# हाथ से `lab` क्लस्टर में ले जाए जाते हैं — क्लस्टर अलग-अलग हैं, कुछ भी अपने आप स्थानांतरित नहीं होता।
apiVersion: apps.cozystack.io/v1alpha1
kind: Bucket
metadata:
  # Cozystack ऑब्जेक्ट का नाम, और केवल वही। स्टोरेज में असली बकेट नाम
  # प्लेटफ़ॉर्म स्वयं जारी करता है — एक लंबा नाम, जैसे bucket-a9209f83-... यह जारी किए गए
  # सीक्रेट के bucketName फ़ील्ड में पहुँचेगा, और ठीक वही बिल्ड में प्रतिस्थापित किया जाना
  # चाहिए, न कि `builds`।
  name: builds
  namespace: tenant-workshopXX
spec:
  users:
    # इस मैप की प्रत्येक कुंजी अपनी ख़ुद की कुंजी जोड़ी वाला एक अलग S3 उपयोगकर्ता है।
    # एक खाली ऑब्जेक्ट का अर्थ है "पूर्ण पढ़ने और लिखने की पहुँच"।
    # इस तरह आप बिल्डर को लिखने की पहुँच दे सकते हैं, और मोबाइल टीम को — केवल पढ़ने की:
    #   ci: {}
    #   mobile:
    #     readonly: true
    ci: {}
