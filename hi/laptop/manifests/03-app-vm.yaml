# लागू करने से पहले tenant-workshopXX को अपने namespace से बदलें।
# एक साथ सभी फ़ाइलों में करना आसान है: README देखें, नंबर प्रतिस्थापन वाला अनुभाग।
# और एक बात: नीचे url फ़ील्ड में convert.sh से presigned लिंक डालें (चरण 2)।
#
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  source:
    http:
      url: "ВСТАВЬТЕ_PRESIGNED_URL"  # convert.sh से (Share: पंक्ति)
  storage: 10Gi
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  instanceType: u1.medium
  instanceProfile: centos.7
  runStrategy: Always
  disks:
    - name: app-1
# बाहर से ऐप्लिकेशन तक पहुँच `virtctl port-forward` के ज़रिए होती है (README देखें)।
# इस स्टैंड पर external LoadBalancer (Cilium + robotlb) VM के लिए काम नहीं करता,
# इसलिए यहाँ external को चालू नहीं करते।
