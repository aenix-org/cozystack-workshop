# 应用前，请将 tenant-workshopXX 替换为你自己的 namespace。
# 更简单的做法是一次性替换所有文件：参见 README 中关于替换编号的章节。
# 另外：在下面的 url 字段中，插入 convert.sh（步骤 2）生成的 presigned 链接。
#
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  source:
    http:
      url: "ВСТАВЬТЕ_PRESIGNED_URL"  # 来自 convert.sh（Share: 行）
  storage: 10Gi
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  instanceType: u1.medium
  instanceProfile: centos.7
  runStrategy: Always
  disks:
    - name: app-1
# 从外部访问应用是通过域名 app.<tenant>.workshop.aenix.io
#（Ingress 由 operator 创建；此路径无需 port-forward，参见 README）。
# 在此环境（Cilium + robotlb）上，external LoadBalancer 对 VM 不起作用，
# 因此这里我们不启用 external。
