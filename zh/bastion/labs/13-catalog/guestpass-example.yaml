---
# 实验 13。这就是在管理员应用 applicationdefinition.yaml 之后，
# 订购你的应用时的样子。在你的租户中应用它：
#   kubectl apply -f guestpass-example.yaml
#
# 注意：tenant-workshopXX 是占位符，不是命名空间的名字。在应用前把 XX 替换为
# 你自己租户的编号，否则 kubectl 会拒绝：不存在这样的命名空间，
# 而别人的命名空间也不会放你进去。
#
# 请注意：apps.cozystack.io 组与 Bucket、VMInstance 以及目录中其他应用
# 所用的是同一个组。你的应用会和它们并排排列，
# 而不是被放到某个角落。
#
# 在管理员注册定义之前，你无法应用这个文件：
# kubectl 会回复 `no matches for kind "GuestPass"`。
apiVersion: apps.cozystack.io/v1alpha1
kind: GuestPass
metadata:
  name: main
  namespace: tenant-workshopXX
# spec 中的字段正是 chart/values.yaml 中描述、并由仪表盘里的订购表单展示的那些参数。
# 这里它们以文本形式写出：效果和在仪表盘里点一下按钮一样，
# 但这样的文件可以被评审、放进 Git 并回滚。
spec:
  replicas: 2
  greeting: "Order a pass for your guest"
  external: false
  resources:
    cpu: 100m
    memory: 128Mi
