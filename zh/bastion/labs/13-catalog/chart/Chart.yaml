# 实验 13。「通行证」chart 的护照。
#
# chart 就是一个文件夹：清单模板放在 templates/，默认值放在 values.yaml，
# 参数 schema 放在 values.schema.json。它通过命令
# `helm install <发布名称> chart` 从实验文件夹部署，而在 Cozystack 目录中——则由
# 平台本身部署，当有人通过仪表盘订购应用时。
#
# Chart.yaml 是软件包的封面：Helm 从它了解软件包叫什么名字、是什么版本。
apiVersion: v2
name: guest-pass
description: Internal guest pass service — order a pass for a visitor
type: application

# 接下来是两个版本，它们在 Helm 中比其他任何东西都更容易被混淆。这是不同的两样东西。
#
# version —— 打包版本。当你修改模板、值或 schema 时它会变化，
# 即使内部的应用保持不变。Helm 在升级发布时正是比较它，
# 上传到仓库的软件包也是靠它来区分。不提升它，
# 平台就会认为软件包没有变化，新版本可能被忽略。
version: 0.1.0
# appVersion —— 软件包内部应用本身的版本，这里是 nginx。它过着自己的
# 生活：应用可以更新十次而模板一处都不改，反之亦然——
# 你重写了模板，而应用还是原来那个。它不会进入对象名称，而是显示
# 在 `helm list` 的输出中以及目录卡片上。
appVersion: "1.0"
