# 实验 13。ConfigMap 模板：「通行证」页面和 nginx 配置。
#
# ConfigMap 存储文本文件并将其提供给 Pod。页面放在这里而不是镜像内部，
# 是为了在不重新构建的情况下修改文本：greeting 值在渲染时被替换，
# 只需更新一次 release 即可。
#
# 替换在 `|` 块内部同样有效：Helm 将模板文件当作纯文本处理，
# 对 YAML 结构一无所知。详见 templates/deployment.yaml。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
# data 中的键是文件名，而 `|` 下面的内容则是它们的完整内容。
# 每个键都作为单独的文件挂载到容器中，参见 Deployment 中的 volumeMounts。
data:
  # 员工将看到的页面。这里会填入两个值：来自订单表单的 greeting，
  # 以及 release 名称——这样打开页面就能看出这是谁的订单。
  index.html: |
    <!doctype html>
    <html lang="en">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Guest Pass</title>
    <style>
      body{background:#0d1117;color:#e6edf3;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:12vh 5vw;margin:0}
      h1{font-size:clamp(26px,6vw,56px);margin:0 0 .3em;color:#2f6fed}
      .pod{font-family:ui-monospace,Menlo,monospace;color:#7d8590;margin-top:3em}
    </style>
    <h1>{{ .Values.greeting }}</h1>
    <p>Guest Pass service, release <b>{{ .Release.Name }}</b></p>
    <div class="pod">served by __POD__</div>
    </html>
  # nginx 配置。sub_filter 在提供页面时将 __POD__ 标记替换为 Pod 名称：
  # 这样浏览器就能显示是哪个副本作出了响应。Deployment 中的 readinessProbe
  # 需要对 /healthz 的单独响应——它查询的正是这个地址。
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location / {
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
