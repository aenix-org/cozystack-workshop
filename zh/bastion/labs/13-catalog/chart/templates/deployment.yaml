# 实验 13。Deployment 模板：运行什么，以及运行多少个副本。
#
# templates/ 中的文件是蓝图，而不是现成的清单。Helm 把值代入其中，
# 再把结果交给集群：`helm template main chart` 显示渲染后的文本而不实际应用，
# `helm install main chart` 则会应用它。
#
# 双大括号是替换点。在其中你会看到：
#   .Values.名称  — 参数值：如果客户没有改动，取自 values.yaml，
#                   如果客户在仪表盘的订购表单中选了自己的值，则取自那里；
#   .Release.Name — 发布名，也就是该 chart 某次具体部署的名称。
# 大括号之外的文本原样进入清单。
apiVersion: apps/v1
kind: Deployment
metadata:
  # 对象名由发布名拼装而成，而不是写死。同一个 chart 会在一个 namespace 中
  # 被部署不止一次，固定的名称就意味着第二个订单会覆盖第一个。发布 `main` 产生
  # 名为 `main` 的 Deployment、Service 和 ConfigMap —— 一看名字就知道它们是同一组。
  name: {{ .Release.Name }}
  # 标签：name 对该应用的每个订单都相同，instance 用来区分不同订单。
  # 对象之间靠它们互相找到彼此，`kubectl get` 的输出也靠它们来筛选。
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # 保持运行多少个副本。如果某个副本消失了，集群会不加询问地创建一个新的 ——
  # 这就是无需值班管理员的自愈能力。
  replicas: {{ .Values.replicas }}
  # selector 告诉 Deployment 该把哪些 pod 视为自己的 —— 靠标签，而不是靠名称。
  # 这里的标签和 template.metadata.labels 中的标签必须一致。一旦不一致，
  # Deployment 就找不到自己的副本，会一遍又一遍地不停生成。
  selector:
    matchLabels:
      app.kubernetes.io/name: guest-pass
      app.kubernetes.io/instance: {{ .Release.Name }}
  # template 是 pod 的蓝图。下面的一切描述的不是 Deployment 本身，而是它
  # 依照这个蓝图创建出来的应用副本。
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guest-pass
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # 写在 pod 注解里的配置哈希。没有它，编辑 ConfigMap 不会重启
        # pod，新文本也不会出现，直到有人手动把它们删掉。
        # 这是对 chart 最常见的抱怨之一。
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # 应用不是以 root 运行，且权限被削减。目录中的 chart
      # 会被其他租户部署在他们自己的 namespace 里，容器的权限是
      # 你随应用一起对他们所作承诺的一部分。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 镜像写在模板里，且故意不作为参数暴露：客户可以选择
          # 大小和文本，但不能把应用本身替换成任意的东西。
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # 没有这个变量，nginx 会按节点的每个核心各启动一个工作进程。
          # 在有几十个核心的节点上就会有几十个进程，而一个内存限制只有
          # 一百兆的 pod，会在第一个请求到来之前就以 OOMKilled 死掉。chart 会
          # 发到其他租户那里，那里的节点可能是任何配置，所以这里必须这样做。
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # 容器内部的端口。名称 http 在后面的探针和 Service 中会被用到，
          # 这样端口号只记录在一个地方，而不是三个。
          ports:
            - containerPort: 8080
              name: http
          # requests —— 保证分配多少，调度器按这些数字挑选节点。
          # 这里的 limits 只针对内存：一旦超出，容器就被杀掉并重新拉起。
          # 故意没有 CPU 限制，否则应用会撞上上限，而不是只是跑得慢一些。
          # `| quote` 过滤器会把代入的值用引号包起来：用户
          # 可能输入 1，没有引号的话，一个数字就会进入清单，而那里期望的是形如
          # "1" 或 "100m" 的字符串。
          resources:
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
            limits:
              memory: {{ .Values.resources.memory | quote }}
          # readinessProbe —— 那个「准备好接收请求了吗？」的问题。在 /healthz 应答之前，
          # Service 不会把流量发给这个副本。由此实现不中断的更新：旧
          # 副本会在新副本应答之后才从负载均衡中移出。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          # nginx 的页面和配置以文件形式从 ConfigMap 挂载进来。subPath 只代入
          # 恰好一个文件：没有它，挂载的目录就会替换掉整个 /etc/nginx/
          # conf.d，镜像自带的设置就会消失。
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      # ConfigMap 的名称由发布名拼装而成，所以 pod 总是挂载自己订单的配置，
      # 而不是邻居的。
      volumes:
        - name: page
          configMap:
            name: {{ .Release.Name }}
        - name: conf
          configMap:
            name: {{ .Release.Name }}
