# 实验 13。“通行证”chart 的默认值。
#
# 这些是 chart 在部署时提出的问题的答案：要多少副本、页面上显示什么
# 文本、是否需要外部地址。它们写在这里是为了应对“什么都没选”的情况。下单
# 部署应用的人会覆盖它们：在仪表盘里用表单字段，在终端里用
# `--set replicas=5` 参数或自己的文件 `helm install ... -f my.yaml`。
# 编辑此文件会改变未来订单的默认值，而不会影响已经部署好的实例。
#
# 这里的值如何变成仪表盘里的订单表单：
#   类型       — 显示哪种字段：{int} 数字、{bool} 开关、
#                {string} 输入行、{struct} 嵌套的字段组；
#   描述       — 字段标签以及下面的提示；
#   =值        — 打开表单时字段里已经填好的内容；
#   是否必填    — 由 schema 中的 required 列表设定。这里没有：每个
#                参数都有默认值，所以任何字段都可以跳过。
# 因此这些描述用英文书写：读它们的不只是 chart 作者，还有任何
# 在仪表盘里下单部署应用的人。

## 形如 `## @param` 的注释不是装饰。Cozystack 生成器
## （cozyvalues-gen）会据此生成 values.schema.json 和 README 里的参数表。
## 格式：## @param {类型} 名称=默认值 - 描述。

# 保持运行的应用副本数量。一个副本意味着在节点重启期间会停机；
# 两个副本则能在丢失其中任一个时继续存活。
## @param {int} replicas=2 - Number of application replicas.
replicas: 2

# 主页面上的文本。之所以提取为参数，是因为每个子公司都有
# 各自的文本，没有人会仅仅为此单独构建一个镜像。
## @param {string} greeting=Order a pass for your guest - Text shown on the main page.
greeting: "Order a pass for your guest"

# 应用是否需要集群外部的地址。Cozystack 目录的约定：
# 名为 external 的字段在所有应用中都表示同一件事——外部访问。
## @param {bool} external=false - Enable external access from outside the cluster.
external: false

# 单个副本的大小。之所以分组为一组独立字段，是为了在订单表单里
# 它看起来像一个单独的“资源”块，而不是两个不相关的字段。
## @typedef {struct} Resources - CPU and memory for each replica.
## @field {quantity} cpu - CPU available to each replica.
## @field {quantity} memory - Memory (RAM) available to each replica.

## @param {Resources} resources - Explicit CPU and memory configuration.
resources:
  cpu: 100m
  memory: 128Mi
