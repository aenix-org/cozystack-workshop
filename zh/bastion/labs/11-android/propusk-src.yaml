---
# 实验 11。移动应用「Пропуск」的源码——即提供给构建作为输入的内容。
#
# 应用到你的学习集群 `lab`，而不是管理集群上的租户里：
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f propusk-src.yaml
# 这里没有 tenant-workshopXX 之类的占位符——不需要在任何地方替换成你自己的编号。
# Namespace 也没有指定：对象会落到你 kubeconfig 中所设置的那个里。
#
# 应用刻意做得极其微小：一个 activity，屏幕上一行文本。
# 这个实验的意义不在于 Android，而在于构建会传输进集群这件事。
#
# 如果你从未构建过移动应用，这些文件是什么。
# Android 项目不是单个带代码的文件，而是由三类文件组成的一棵树：
#   *.gradle.kts  构建描述：从哪里获取库、用什么编译、为哪些
#                 Android 版本构建。就角色而言它是一个 makefile，只不过用 Kotlin 语言写；
#   *.kt          应用本身的代码；
#   *.xml         资源：文本以及关于点击图标时打开哪个屏幕
#                 的描述。
# Gradle 构建器读取这棵树并产出 APK——手机的单个安装文件，
# 就角色而言等同于 Windows 的 .msi。不需要自己安装 Android SDK 手动构建：
# 这由 android-build.yaml 里的一个 Job 来完成，而这里只放它的输入。
#
# 源码放在 ConfigMap 里而不是镜像里，原因和
# 第一个应用的实验中把 nginx 页面放进 ConfigMap 里完全一样：
# 为了在不重新构建任何东西的情况下修改它们。ConfigMap 是一个集群对象，里面
# 存放着文本文件；容器启动时，集群会把它们
# 作为磁盘上普通的文件塞进容器内部。
#
# `data` 里的键是文件名，而 `|` 之后缩进以下的一切
# 都是文件的逐字内容，而不是 YAML。放到这种块
# 内部的注释会变成文件本身的一行，因此下面所有的说明都放在外面、
# 键之前。
#
# 这份由六个键组成的扁平映射不是在这里、而是在挂载时展开成目录树：
# 「键 -> 路径」的对应关系定义在 android-build.yaml 的
# volumes.items 块里。ConfigMap 的键不能包含斜杠——因此有了扁平名
# app-build.gradle.kts，它在项目中会变成 app/build.gradle.kts。
apiVersion: v1
kind: ConfigMap
metadata:
  name: propusk-src
data:
  # 项目的顶层文件：它列出 Gradle 从哪里拉取插件和库，以及哪些
  # 模块属于本项目（这里只有一个——app）。三个仓库都是互联网上公开的：
  # 构建容器空着启动，从那里拉取所有东西，因此构建才要那么久。
  # 当信息安全部门关闭出站访问时，这也是你要修改的第一处地方——一个
  # 内部代理仓库会写到这里，就像当初把 Docker Hub 换成 Harbor 一样。
  settings.gradle.kts: |
    pluginManagement {
      repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
      }
    }
    dependencyResolutionManagement {
      repositories {
        google()
        mavenCentral()
      }
    }
    rootProject.name = "propusk"
    include(":app")

  # 根构建文件：固定两个插件的版本——Android 构建器和 Kotlin
  # 编译器。`apply false` 意思是「声明版本，但不在根项目中启用它」：
  # 由 app 模块来启用它们。版本是刻意钉死的。一个拉取
  # 「最新」的构建，一个月后的构建方式会和今天不同，而要弄清这一点的人就是你。
  build.gradle.kts: |
    plugins {
      id("com.android.application") version "8.5.2" apply false
      id("org.jetbrains.kotlin.android") version "1.9.24" apply false
    }

  # 应用模块本身的描述。这里有三个数字，构建下载什么、
  # 以及应用究竟能在哪里运行，都取决于它们：
  #   compileSdk 34   我们用来编译的 Android SDK 版本。SDK 安装步骤下载的正是它——
  #                   大约一个半吉字节，是最慢的构建步骤；
  #   minSdk 24       应用能运行的最老 Android（也就是 Android 7）。
  #                   调高它——你会砍掉旧手机，调低它——你就得拖入
  #                   兼容性库；
  #   jvmTarget 17    Kotlin 编译成 Java 字节码，这个数字必须和
  #                   构建镜像里的 JDK 版本一致（android-build.yaml 里的 gradle:8.9-jdk17）。
  #                   如果它们不一致，构建会因字节码版本不匹配而失败。
  app-build.gradle.kts: |
    plugins {
      id("com.android.application")
      id("org.jetbrains.kotlin.android")
    }

    android {
      namespace = "io.aenix.propusk"
      compileSdk = 34

      defaultConfig {
        applicationId = "io.aenix.propusk"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
      }

      compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
      }

      kotlinOptions {
        jvmTarget = "17"
      }

      sourceSets {
        getByName("main") {
          java.srcDirs("src/main/kotlin")
        }
      }
    }

  # 应用给手机看的「护照」：它有哪些屏幕，以及点击图标时
  # 打开其中哪一个。这正是带 MAIN 和 LAUNCHER 的 intent-filter 块所负责的——
  # 没有它，应用会安装，但菜单里不会出现图标。
  AndroidManifest.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <manifest xmlns:android="http://schemas.android.com/apk/res/android">
      <application android:label="@string/app_name">
        <activity
            android:name=".MainActivity"
            android:exported="true">
          <intent-filter>
            <action android:name="android.intent.action.MAIN" />
            <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
        </activity>
      </application>
    </manifest>

  # 应用唯一的屏幕——也是整个项目仅有的全部代码。
  # 用的是裸的 android.app.Activity，而不是兼容性库：项目有零个外部
  # 依赖，这在每次构建时都能省下几分钟的下载。
  # R.string.greeting——对 strings.xml 中文本的引用。R 类不在源码里，它由
  # 构建生成。因此「unresolved reference: R」这个错误意味着资源生成步骤失败，
  # 而不是代码里的拼写错误。
  MainActivity.kt: |
    package io.aenix.propusk

    import android.app.Activity
    import android.os.Bundle
    import android.widget.TextView

    class MainActivity : Activity() {
      override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val view = TextView(this)
        view.textSize = 22f
        view.setPadding(48, 96, 48, 48)
        view.text = getString(R.string.greeting)
        setContentView(view)
      }
    }

  # 从代码中抽出来的文本：这样修改和翻译它们就不必碰程序员。
  # app_name 显示在手机上图标的下方，greeting——显示在屏幕本身上。
  strings.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <resources>
      <string name="app_name">Пропуск</string>
      <string name="greeting">Заказать пропуск для гостя</string>
    </resources>
