# 实验 9 · 订购一个 ClickHouse 数据库，用于对通行记录日志进行分析。
# 描述你想要得到什么；由平台负责组装和配置服务。
# 与你在仪表盘里用鼠标下单的效果相同 —— 只不过这里是文本形式。
# 它不是应用到实验集群，而是应用到管理集群上的一个租户：
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f clickhouse.yaml
#
# 应用之前：把 tenant-workshopXX 替换成你自己的 namespace，
# 把 ЗдесьВашПароль 替换成你自己想好的密码。
apiVersion: apps.cozystack.io/v1alpha1
kind: ClickHouse
metadata:
  name: analytics
  namespace: tenant-workshopXX
spec:
  # 一个副本、一个分片。生产环境中至少保留两个副本，否则丢失一个节点
  # 就意味着数据不可用 —— 但我们要的是一百万行数据，而不是容错
  # 能力，多一个副本只会白白吃掉环境的资源。
  replicas: 1
  shards: 1
  # 存放表数据的磁盘。本实验的一百万行数据只会占用几十兆字节：
  # 带字典的列式存储对这样的日志压缩得非常厉害。
  size: 5Gi
  # 单独一块磁盘，用于服务器的系统日志，包括查询日志。
  logStorageSize: 2Gi
  # 查询日志保留多少天后丢弃。我们后面要查看它。
  logTTL: 15
  # replicated —— 在集群另一节点上有副本的卷：节点掉线，
  # 数据仍在。
  storageClass: replicated
  # 1 个 CPU，4 GB。ClickHouse 在内存中计算，在对
  # 一百万行做分组时这一点很明显。
  resourcesPreset: u1.small
  # 数据库用户及其密码。密码请自己想一个并记住：工作 pod
  # （CH_AUTH 变量）和检查脚本（CH_PASSWORD 变量）都需要它。
  # 创建之后可以在仪表盘的 clickhouse-analytics-credentials secret 中看到它。
  users:
    analyst:
      password: ЗдесьВашПароль
  # 备份到对象存储。这里的数据是生成的，
  # 没有什么需要恢复的 —— 在教学环境中已关闭。
  backup:
    enabled: false
  # Keeper 用于在多个副本之间进行协调。副本只有一个 —— 没有对象
  # 需要协调，而三个 Keeper pod 会白白占用资源。
  clickhouseKeeper:
    enabled: false
