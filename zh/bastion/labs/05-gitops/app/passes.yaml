---
# 实验 5 · Git 中的基础设施。「通行证」服务本体：一个文件里的四个对象。
#
# 它不会用手动方式应用到集群。文件被放进它自己在 GitHub 上的仓库，放到
# apps/ 目录、与 namespace.yaml 相邻，然后由 Flux 自己把它搬进 `lab` 集群：
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# --- 这一行分隔各个对象：一个文件，四个相互独立的对象。文件中的顺序
# 不影响创建顺序——集群会自己理清。
#
# 每个对象里：apiVersion——描述模式的版本，kind——我们要创建什么，
# metadata.name——对象的名字，metadata.namespace——它住在集群的哪个隔间里。
# 后文不再单独解释这些字段。
#
# 四个对象里没有任何一个包含密码、密钥或令牌，这并非偶然：一旦进入
# Git 就永远留在那里——历史可以改写，但每个已经克隆过的人都会保留旧副本。
# 秘密在这里没有位置。

# --- 4 之 1。Web 服务器设置 --------------------------------------------------
# ConfigMap 把一个文本文件与应用分开放进集群，而在下方（volumes 部分）
# 这个文件被挂载进容器内部。意义在于修改设置而不重新构建镜像：你在这里
# 编辑、提交，一分钟后集群就有了新版本。
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-conf
  namespace: passes
# data 里的键会成为容器中的文件名：default.conf 会落到 nginx 启动时读取的目录里。
# 名字后面的竖线是在 YAML 中原样书写多行文本、保留换行的写法。
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      # 就绪检查的地址。集群敲这里，在收到回应之前不会把
      # 流量放到某个副本上。
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        # 在返回的页面中把 __POD__ 替换成运行 nginx 的机器的名字。
        # 在 pod 内部，机器名就是 pod 本身的名字。
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
    }
---
# --- 4 之 2。服务返回的页面 ----------------------------------------
# 在本实验里页面是个占位：真正的应用稍后才出现。现在重要的不是服务显示什么，
# 而是它在集群里从何而来。标记里的 __POD__ 文本是一个替换占位符：nginx 会把它
# 替换成返回页面的那个 pod 的名字，凭这个名字你之后会看到副本不止一个。
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-page
  namespace: passes
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Пропуск</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 40rem;
               color: #222; }
        h1 { font-weight: 600; }
        .v { display: inline-block; padding: .2rem .6rem; border-radius: .3rem;
             background: #eef; font-family: ui-monospace, monospace; }
        .pod { margin-top: 2rem; color: #666; font-size: .9rem; }
        b { font-family: ui-monospace, monospace; color: #222; }
      </style>
    </head>
    <body>
      <h1>Сервис «Пропуск»</h1>
      <p>Заказ пропуска для гостя. Версия <span class="v">v1</span></p>
      <p>Развёрнуто из Git. Руками сюда никто не ходил.</p>
      <div class="pod">вас обслужил под <b>__POD__</b></div>
    </body>
    </html>
---
# --- 4 之 3。应用本身的描述 ---------------------------------------------
# Deployment 不是「运行一个容器」，而是「让这么多份这样的容器保持运行」。
# 差别在某个副本死掉时显现：集群会创建一个新的，既不询问也不通知。在 vSphere 里
# 最接近的是 HA，但那里重启的是一台机器，而这里重建的是应用的一个副本，而且是
# 持续进行的，不是只在故障时。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes
  namespace: passes
  labels:
    app: passes
spec:
  # 保持运行多少个副本。措辞很重要：不是「运行一个」，而是「保持一个」。
  # 这个数字你将通过 Git 修改，并观察会发生什么。
  replicas: 1
  # Deployment 靠什么标识认出属于自己的副本。这不是 pod 名字的清单——
  # 名字在每次重建时都会改变——而是条件「所有带标签 app: passes 的 pod」。
  # 下方 template.metadata.labels 里的标签必须与此条件一致：一旦不一致，
  # 集群会拒绝接受清单，因为那些副本将成为无主之物。
  selector:
    matchLabels:
      app: passes
  # template——用来批量印制副本的模板。里面的一切都描述一个 pod。
  # 修改模板意味着推出新版本：旧副本被新的替换。
  template:
    metadata:
      labels:
        app: passes
    spec:
      # 整个 pod 层面的安全限制。在 vSphere 里没有对应物：那里隔离由
      # 虚拟机管理程序提供，而容器与节点共享内核，所以权限必须显式收紧。
      #   runAsNonRoot   如果镜像想以 root 运行，就不要运行
      #   runAsUser      以哪个数字用户运行；65532 是极简镜像中公认的
      #                  「非特权」标识
      #   seccompProfile 允许哪些系统调用；RuntimeDefault 是一套
      #                  切断明显危险项、又不破坏任何东西的集合
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # 同样的限制，但现在针对具体的容器。
          #   allowPrivilegeEscalation: false  进程无法为自己获取更多权限
          #   capabilities.drop: ["ALL"]       剥夺所有特殊的内核能力
          #                                    （改网络、挂载、改时间）；
          #                                    Web 服务器一个都不需要
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 镜像取自公共仓库——下一个实验里信息安全会禁止这样做，地址会换成
          # 我们自己的 Harbor。选 unprivileged 变体不是为了好看：普通的 nginx
          # 镜像监听 80 端口、为此需要 root 权限，而在上面的 runAsNonRoot 下
          # 它根本不会启动。
          # 版本被固定（1.27-alpine），而不是 latest：否则同一个清单明天就会
          # 部署一个不同的应用，而你对此毫不知情。
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # 应用监听的端口。名字 `http` 不是装饰：下面的就绪检查和文件末尾的
          # Service 都引用它。改端口号时你只需在一处改，而不是三处。
          ports:
            - containerPort: 8080
              name: http
          # requests——保证预留多少资源；调度器按这个数字挑选节点。
          # limits——上限，超过就不放行。低报 requests 意味着节点上会塞进
          # 比它承受得起更多的东西；超过内存 limits——容器被杀，超过 CPU——被限速。
          # 20m = 千分之二十个核，Mi = 兆字节。这里的值很小，
          # 因为实验里只有一个节点，而且它不大。
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # 就绪检查：集群敲这个地址，在收到回应之前不会把流量放到某个副本上。
          # 没有它，Service 会把请求发给还没起来的 nginx，用户在每次推出时
          # 都会看到错误。Flux 也在等它——在 kustomization.yaml 里我们请求了 wait: true。
          #   initialDelaySeconds  第一次敲之前等待，给进程启动的时间
          #   periodSeconds        之后多久敲一次
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # 把文件开头那两个 ConfigMap 的内容放到容器内部的哪里。
          # /etc/nginx/conf.d——nginx 启动时读取设置的目录，
          # /usr/share/nginx/html——它对外提供文件的目录。
          # 镜像本身并不改变：文件在启动的那一刻出现在其中。
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: page
              mountPath: /usr/share/nginx/html
      # 究竟挂载什么。名字 conf 和 page 是内部的，它们把这个块与上面的
      # volumeMounts 关联起来；configMap 里的 name 才是集群中真实对象的名字。
      # 在它上面写错，pod 就会挂起，等待一个不存在的 ConfigMap。
      volumes:
        - name: conf
          configMap:
            name: passes-conf
        - name: page
          configMap:
            name: passes-page
---
# --- 4 之 4。一个固定的名字，背后站着所有副本 -----------------------------
# pod 会被重建，它们的地址每次都是新的。Service 给出一个不变的名字——
# passes.passes.svc.cluster.local——凭它在集群内部总能触达存活的副本。
# 这是内部的负载均衡，从集群外部暂时还进不来。
apiVersion: v1
kind: Service
metadata:
  name: passes
  namespace: passes
spec:
  # Service 与 pod 之间的关联不是地址清单，而是条件「所有带标签 app: passes 的 pod」。
  # 出现了带这种标签的新副本——它自己就纳入了负载均衡，无需注册任何东西。
  # 消失了——它就从分发中被移除。
  selector:
    app: passes
  # port——Service 自身响应的端口，targetPort——它转发到容器内部的哪里。
  # 这里 targetPort 引用上面 ports 块里的名字 `http`，而不是号码：号码可以
  # 在一处修改，关联也不会断。
  ports:
    - port: 80
      targetPort: http
