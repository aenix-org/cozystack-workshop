---
# 实验 5 · 基础设施即 Git。任务：明确要把仓库中的哪些内容应用到集群。
#
# 与相邻的 gitrepository.yaml 一起应用到你的 `lab` 集群：
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# 每个对象中：apiVersion — 描述模式的版本，kind — 我们创建的东西，
# metadata.name — 对象的名称。下面不再单独说明。
#
# 职责分离：GitRepository 只下载仓库、不做任何应用，
# 这个对象接收下载下来的内容并使集群与之保持一致。名称 Kustomization 与
# kustomize 工具的名称相同，但它们是不同的东西——这里它是集群中的一个对象。
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passes
  # 与 Flux 各服务位于同一处——否则 kustomize-controller 不会拾取它。
  namespace: flux-system
spec:
  # 多久将集群的实际状态与 Git 中所描述的状态对账一次。
  # 这不是「每分钟重新应用一次」——而是「每分钟比较并修正
  # 差异一次」。即使 Git 中没有任何改动，通过 kubectl edit
  # 手工做的改动也会被悄悄回滚。稍后在本实验中，当你自己绕过 Git
  # 在集群里改动某些东西时，就会看到这种差异。
  interval: 1m
  # 仓库内部的一个文件夹。其中的所有内容都会进入集群；与它相邻的文件
  # ——例如根目录下的 README.md——不会被触及。名称 `apps` 是我们选的，但它
  # 必须与你在自己仓库中放置清单的文件夹相匹配。
  path: ./apps
  # 从集群中删除那些已从 Git 中消失的对象。
  # 没有这一项，Git 就不再是完整的描述：从仓库中删除的内容
  # 仍会在集群里继续运行，而没有人会知道这一点。
  prune: true
  # 要查看哪个源。名称 `passes` 是 gitrepository.yaml 里的 metadata.name，
  # 而不是 GitHub 上仓库的名称。在那里改名了——这里也要改，否则 Flux
  # 会等待一个不存在的源，Kustomization 也不会变为就绪。
  sourceRef:
    kind: GitRepository
    name: passes
  # 等待已应用的资源变为就绪，而不是在 apply 之后立刻报告成功。
  # 这个区别正如「已提交申请」和「申请已完成」之间的差异：没有 wait，
  # 即使随后 Pod 起不来，Flux 也会报告成功。
  wait: true
  # 在判定应用失败之前，要等待这种就绪多久。
  # 三分钟——为在空节点上拉取镜像留有余量。取值太小
  # 会在慢速网络上产生误报失败，太大——你就会长时间
  # 盯着「进行中」而不是看到明确的错误。
  timeout: 3m
