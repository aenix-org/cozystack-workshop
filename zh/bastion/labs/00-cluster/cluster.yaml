# 用于实验 1-14 的教学 Kubernetes 集群。
# 应用前请将 tenant-workshopXX 替换为你自己的 namespace。
#
# 在管理集群上应用 —— 使用随租户一起下发的那份访问权限。
# 这个集群自身的 kubeconfig 还不存在：它只会在
# 集群启动之后才出现。
#
#   kubectl apply -f cluster.yaml
#
apiVersion: apps.cozystack.io/v1alpha1
kind: Kubernetes
metadata:
  name: lab
  namespace: tenant-workshopXX
spec:
  version: v1.35
  storageClass: replicated
  controlPlane:
    # 控制平面只保留一个副本：这是教学环境，节省资源
    # 比容错更重要。
    replicas: 1
  addons:
    monitoringAgents:
      # 立即启用。指标采集无法事后补开：在勾选之前
      # 发生的一切都会丢失。实验 14 依赖这些数据。
      enabled: true
  nodeGroups:
    md0:
      # 当副本开始空间不足时，该组能够自行添加节点。
      # 在扩缩容那节实验里不会到这一步：那里增长的是副本，而不是节点。
      minReplicas: 1
      maxReplicas: 3
      instanceType: u1.medium
      diskSize: 20Gi
      storageClass: replicated
