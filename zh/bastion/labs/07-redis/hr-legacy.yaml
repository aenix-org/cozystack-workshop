---
# 实验 7 · 遗留员工通讯录的桩服务。
# 现实中这是别人的系统，你不会被允许去重写它：它响应需要 800 毫秒，
# 你只能想办法与之共处。这里是一个行为相同的桩，好让你有东西可以测量。
#
# 适用范围：你的 `lab` 集群（export KUBECONFIG=~/lab.kubeconfig），而不是 Cozystack
# 管理集群。命令：kubectl apply -f hr-legacy.yaml
#
# HARBOR-HOST 是占位符，不是地址。请替换成你自己 Harbor 的地址，否则集群会去
# 从一个不存在的主机拉取镜像：
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # macOS
#
# 该文件包含两个由 `---` 行分隔的对象：一个 Deployment（运行什么、运行多少
# 个副本）和一个 Service（用来访问这些副本的固定名称）。每个对象的
# apiVersion 和 kind 说明它是什么类型的对象，metadata.name 是它的名称；
# 下文中这三个字段不再注释。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-legacy
  labels:
    app: hr-legacy
spec:
  # 保持运行多少个副本。如果某个副本消失，集群会不加询问地创建一个新的。
  # 对通讯录来说一个就够了：它在这里不是为了承载负载，而是为了测量。
  replicas: 1
  # Deployment 通过这个标签在集群中所有其他 Pod 里识别出属于自己的 Pod。
  # selector 中的标签与下面 template 中的标签必须一致，否则该对象
  # 找不到它自己创建的东西。
  selector:
    matchLabels:
      app: hr-legacy
  # template 是 Pod 模板。下面的一切描述的都是一个副本：用什么来组装它、
  # 以什么权限运行它，以及如何判断它已经准备好接收请求。
  template:
    metadata:
      labels:
        app: hr-legacy
    spec:
      # Pod 级别的安全要求。进程不以 root 运行（uid 10001），
      # seccomp 配置切断了应用不需要的系统调用。
      # 在启用了策略的集群中，缺少这些字段的 Pod 根本无法启动。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Harbor 用登录名和密码封闭起来，集群需要以某种方式表明自己的身份。`harbor`
      # 密文是你在关于镜像仓库的实验里创建的。没有这个引用，镜像就拉不下来，
      # Pod 会停留在 ImagePullBackOff 状态。
      imagePullSecrets:
        - name: harbor
      containers:
        - name: hr
          # 与 Pod 级别相同，但针对具体容器：我们禁止提权，
          # 并放弃所有内核权能。这个 Go 应用
          # 一个都不需要。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 镜像对通讯录和「通行证」服务本身是同一个。
          # 究竟启动哪个进程，由下面的 MODE 变量决定。
          image: HARBOR-HOST/passes/passes-api:v2
          # 端口有名称，而不仅仅是编号：就绪探针和下面的 Service
          # 引用的是名称。如果编号变了，你只需在一个地方修改。
          ports:
            - containerPort: 8080
              name: http
          # 环境变量是配置这个应用的唯一方式。
          # 不需要为了改变行为而重新构建镜像。
          env:
            # MODE=hr — 该实例假装成 HR 系统：它等待并响应。
            - name: MODE
              value: "hr"
            # 正是真实通讯录所表现出的那个延迟。
            # 改变它，你就改变了「情况有多糟」——稍后试试 2s。
            - name: HR_DELAY
              value: "800ms"
            # Pod 事先并不知道自己的名称——集群在创建时才分配它。
            # fieldRef 在启动时把这个名称注入变量，它
            # 会出现在服务的响应里：你可以看到是哪个副本作出了回应。
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # requests — 在选择节点时为容器预留多少资源，
          # limits — 不允许超过的上限。类似于 vSphere 中的 reservation
          # 和 limit，但它是按容器设置的，而不是按虚拟机。
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # 就绪探针。在 /healthz 作出响应之前，Service 不会向这个副本发送
          # 任何一个请求。没有探针，流量会打到一个还没启动的进程上，
          # 于是你会平白无故地看到错误——尽管「一切都已部署」。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — 一组 Pod 的固定名称和固定地址。Pod 会被重建，
# 每次都获得一个新 IP，但名称 hr-legacy 保持不变。类似于负载均衡器
# 的 VIP，但它只用四行就建立起来，并且存活在集群内部。
apiVersion: v1
kind: Service
metadata:
  name: hr-legacy
spec:
  # Service 通过这个标签汇集出存活副本的列表。与上面 Pod 上的标签相同：
  # 如果不匹配，Service 会存在但不指向任何地方。
  selector:
    app: hr-legacy
  ports:
    # 请求从 80 端口进来，在 Pod 内部转到名为 http 的端口（8080）。
    - port: 80
      targetPort: http
