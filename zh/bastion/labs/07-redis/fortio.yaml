---
# 实验 7 · 带 Web 界面的负载生成器。
# 与扩缩容实验中用的是同一个：在浏览器里点按钮启动负载，
# 延迟直方图也在同一处可见。如果它在你的环境里已经部署过——就不需要
# 应用本文件，kubectl 会回复「unchanged」。
#
# 应用位置：你的 `lab` 集群（export KUBECONFIG=~/lab.kubeconfig）。
# 命令：kubectl apply -f fortio.yaml
#
# 用 `---` 分隔的两个对象：Deployment（生成器本身）和 Service（用于访问它的名字）。
# 下文不再对 apiVersion、kind 和 metadata.name 作注释。
#
# 镜像从公共 Docker Hub 拉取，而非从你的 Harbor：Fortio 不是「通行证」服务的
# 一部分，而是临时驻留在集群中的一台测量仪器。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # 一个副本。负载生成器不需要扩容——需要的是让它独自
  # 如实地统计延迟。两个副本会给出两份未合并的直方图。
  replicas: 1
  # Deployment 借以识别自己 Pod 的标签。与下方 template 中的标签一致。
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # 与其余组件相同的安全要求：进程不以 root 运行，
      # 系统调用受 seccomp 配置限制。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 这里的 `latest` 标签是为工作坊做的简化，它与私有镜像仓库实验
          # 所教的内容相悖：该标签下的镜像可能在两次 apply 之间悄然改变，
          # 昨天的测量结果便会变得不可复现。对于教学台架上的
          # 负载生成器这是可以接受的，但对生产系统则不行。
          image: fortio/fortio:latest
          # `server` 是 Fortio 启动 Web 界面并等待你按下按钮的模式。
          # 没有这个参数，镜像会执行一次性命令后退出。
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # 生成器需要一些 CPU 余量，否则它会触及
              # 自身上限，那样你压的就是 Fortio 而不是应用。
              cpu: "1"
              memory: 256Mi
---
# 需要 Service 来打开 Web 界面：通过端口转发按名字访问生成器——
# kubectl port-forward svc/fortio 8081:8080——然后访问
# localhost:8081。不用 Service 也能压测服务，用命令
# kubectl exec deploy/fortio，但只有这条路径能在浏览器里给出直方图。
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  # 这里 Service 的端口号与容器端口相同——不同于实验里其余的
  # 服务，那些是外部 80、内部 8080。区别仅在于方便。
  ports:
    - port: 8080
      targetPort: http
