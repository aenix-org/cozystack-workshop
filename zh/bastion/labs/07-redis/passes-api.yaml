---
# 实验 7 · “通行证”服务，v2 版本——能够使用缓存的那个版本。
# 这里缓存还没有启用：我们先测量一下没有它时有多糟糕。它稍后才会启用，
# 通过同一文件夹里的 cache-patch.yaml 补丁。
#
# 应用位置：你的 `lab` 集群（export KUBECONFIG=~/lab.kubeconfig）。
# 命令：kubectl apply -f passes-api.yaml
#
# HARBOR-HOST 是占位符，不是地址。请替换成你自己 Harbor 的地址（见 hr-legacy.yaml，
# 那里也有一次性替换所有文件的 sed 命令）。
#
# 文件里有两个用 `---` 分隔的对象：Deployment（应用的副本）和 Service（给它们的一个稳定名称）。
# apiVersion、kind 和 metadata.name 在文件下方不再注释。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # 两个副本，而不是一个,这样稍后就能看到缓存的主要特性：它是共享的。
  # 一个 Pod 把答案放进 Redis，另一个从那里取出来，尽管它自己从没访问过通讯录。
  replicas: 2
  # Deployment 通过这个标签把自己的 Pod 和别人的区分开。它必须和下方 template 里的标签一致，
  # 否则对象就找不到自己创建的东西。
  selector:
    matchLabels:
      app: passes-api
  # template —— Pod 模板：每个副本按什么来组装。
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Pod 级别的安全要求：不以 root 运行，受限的系统调用集合。
      # 在启用了策略的集群里，缺少这些字段的 Pod 不会被接受。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # 拉取镜像时集群将如何向封闭的 Harbor 表明身份。没有对这个 secret 的引用，
      # Pod 就会卡在 ImagePullBackOff。
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # 容器的权限被削减到最低：禁止提权，没有内核特权。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 和通讯录相同的镜像。区分它们的只有下面的 MODE。
          image: HARBOR-HOST/passes/passes-api:v2
          # 需要端口名称，这样探针和 Service 引用的是名称，而不是数字。
          ports:
            - containerPort: 8080
              name: http
          # 应用的全部行为都在这里设定。请注意：列表里没有
          # REDIS_ADDR 和 REDIS_PASSWORD 这两个变量——正因如此缓存才是关闭的，
          # 每个请求都老老实实地跑去访问慢速的通讯录。
          env:
            # MODE=api —— 这个实例作为“通行证”服务本身运行。
            - name: MODE
              value: "api"
            # 应用工作时并不需要版本和注册表——它们会显示在对 “/” 的响应里，
            # 让你确认正在运行的正是你刚刚构建的东西。
            - name: APP_VERSION
              value: "v2"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # 去哪里取数据。用服务名，而不是地址：通讯录的副本
            # 可以被重建任意多次，名称不会改变。
            - name: HR_URL
              value: "http://hr-legacy.default.svc.cluster.local"
            # 谁在哪里执行请求。集群会自己填入这三个值：
            # 事先没有人知道它们。它们会出现在服务的响应里，从中可以看出
            # 是哪个副本、在哪个节点上作出的应答——这在测量时会派上用场。
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests —— 挑选节点时预留的量，limits —— 上限。这里一核的上限
          # 不是贪心：在负载下应用会顶到它，而不会吃掉整个节点，
          # 于是测量显示的是通讯录的延迟，而不是对 CPU 的争夺。
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # 在 /healthz 应答之前，Service 不会向这个副本发送任何一个请求。
          # 更新时这同一个字段能让你免于中断：旧副本不会被移除，
          # 直到新副本报告就绪。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service —— 给两个副本一个稳定的名称，并在它们之间分配请求。
# Pod 会被重建并更换 IP，而 passes-api 这个名称保持不变。Fortio
# 和检查脚本都通过这个名称访问服务。
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # Service 依据这个标签收集存活副本的列表。若它与 Pod 的标签不一致——
  # Service 会存在，却指向空无一物。
  selector:
    app: passes-api
  ports:
    # 从外部通过 80 端口访问，进入 Pod 后转到名为 http（8080）的端口。
    - port: 80
      targetPort: http
