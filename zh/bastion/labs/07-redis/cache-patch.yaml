---
# 实验 7 · 真正启用缓存。在已经部署的 passes-api 之上应用，
# 位于你的 `lab` 集群中（export KUBECONFIG=~/lab.kubeconfig）：
#   kubectl patch deployment passes-api --patch-file cache-patch.yaml
#
# 这是一个补丁，而不是完整的清单：这里只描述发生变化的部分。其余的一切——
# 镜像、标签、探针、资源——都保持 passes-api.yaml 中的原样不动。所以这个文件
# 直接从 spec 开始：一路向下到容器的路径复刻了 Deployment 的结构，以便
# 集群明白该把改动应用到哪里。
#
# 容器名 `api` 不是装饰，而是地址：集群靠它在列表中找到正确的容器。
# 名字写错了，得到的不是一次改动，而是第二个容器。
#
# 用你自己的 Redis 地址替换 REDIS-ADDR——它是一个占位符，而不是主机名。
# 你在仪表盘里、在你的托管 Redis 应用卡片中获取该地址。
spec:
  template:
    spec:
      containers:
        - name: api
          # Kubernetes 中的 env 列表按 name 字段合并，所以下面这三条
          # 会追加到 Deployment 中已有的条目上，而不是把它们替换掉。
          env:
            # 这个变量的出现正是「启用缓存」的含义：应用在启动时检查它，
            # 如果它已设置，就先去访问 Redis。为空或
            # 缺失——则和以前一样工作，每次请求都走目录查询。
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
            # 密码不以明文写出：它来自一个 secret，你会
            # 用另一条命令创建它。在存放于 Git 中的清单里，
            # 密码没有容身之处。
            #
            # secretKeyRef 是一个引用：name——同一集群中 secret 对象的名字，
            # key——取其中的哪个字段。该值在 Pod 启动时被替换进来，
            # 永远不会出现在文件里。
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
            # 一条记录在缓存中存活多少秒。定为六十——因为
            # 员工目录每天变一次，而不是每秒变一次。
            #
            # 时间越长——我们访问目录越少，但供出过期姓氏的时间也越久。
            # 越短——数据越新鲜，收益越小。这是一种权衡，
            # 而不是有唯一正确值的设置。
            - name: CACHE_TTL
              value: "60"
