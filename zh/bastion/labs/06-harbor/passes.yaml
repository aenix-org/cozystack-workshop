---
# 实验 6 · 你自己的私有镜像仓库。清单的可用版本。
#
# 这与 passes-broken.yaml 是同一个文件，只是多了那里所缺的一处——
# 它在下面用「这就是所缺的部分」标注。请在你已经
# 看到损坏版本的失败并弄清失败原因之后再应用它。
#
# 在你的 `lab` 集群上应用（不是在 Cozystack 管理集群上——那里
# 只运行 Harbor 本身），位于默认命名空间中：
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl delete -f passes-broken.yaml
#     kubectl apply -f passes.yaml
#
# 注意：HARBOR-HOST 是占位符，而不是可用的地址。应用之前请替换成
# 你自己 Harbor 的地址；字符串 HARBOR-HOST 在文件中出现两次，sed 会同时替换两处：
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # macOS
#
# 在下面的对象中：apiVersion 是描述模式的版本，kind 是我们要创建什么，
# metadata.name 是对象的名称。后面不再单独说明。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # 两个副本，而不是一个：这样服务的响应就能看出请求是由
  # 不同的 Pod 处理的，以及镜像下载到节点上只有一次，但启动了两次。
  replicas: 2
  # 条件「我的副本就是带有标签 app: passes-api 的 Pod」。下面 Pod 模板中的标签
  # 必须与这个一致，否则集群会拒绝该清单。
  selector:
    matchLabels:
      app: passes-api
  # 复制副本所依据的模板。里面的一切都描述一个 Pod。
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # 对整个 Pod 的安全约束：不以 root 运行，以
      # 非特权用户 10001 工作，把系统调用集合限制为
      # 标准配置。镜像也是照此构建的（见 app/Dockerfile 中的 USER 行）。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # 这就是 passes-broken.yaml 中所缺的部分——就这两行，别无其他。
      #
      # 私有仓库不会把镜像交给任何人：首先你必须表明身份。密钥 `harbor`
      # （类型 kubernetes.io/dockerconfigjson）保存了仓库地址、登录名和密码；你
      # 用 kubectl create secret docker-registry 命令创建了它。这里只是按名称
      # 引用这个密钥——从那里取用它的不是应用程序，而是节点上的 kubelet，就在
      # 它去下载镜像的那一刻。因此密钥必须与 Pod 位于同一个
      # 命名空间：kubelet 只在那里查找它，别处都不找。
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # 容器级别的权限：不获取额外特权，并放弃所有特殊的
          # 内核能力。应用程序需要一个网络端口，其余都多余。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 镜像名称的第一部分是仓库地址，正因如此迁移到你自己的
          # 仓库会改变清单：镜像名称变得不同。若地址不在
          # 开头，集群就会去 Docker Hub 取镜像，而那正是安全策略所禁止的。
          image: HARBOR-HOST/passes/passes-api:v1
          # 应用端口。名称 `http` 在下面被就绪探针和 Service 使用，
          # 因此端口号只在一个地方设置，而不是三个地方。
          ports:
            - containerPort: 8080
              name: http
          # 环境变量，应用程序从中得知自己是谁、来自哪里。
          # 它在响应中打印的正是这些（见 app/main.go 中的 identity 结构体）。
          # APP_VERSION 和 IMAGE_REGISTRY 以文本形式设置——由我们自己写入。
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # 接下来是 Downward API：集群自己把它所知道的关于 Pod 的信息放入变量。
            # 应用程序既不需要猜自己的名字，也不需要为此去访问集群 API，
            # 更不需要携带这类请求所需的权限。这些值在副本
            # 启动的时刻被替换进去，因此每个副本各有自己的值。
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests——为一个副本预留什么：调度器根据这些数字挑选
          # 节点。limits——上限：内存超过上限，容器会被杀掉，
          # CPU 超过则会被限速。16Mi 够用是因为应用程序是用 Go 写的且没有
          # 依赖，几乎不在内存里保留什么；换成 JVM 会需要多出两个数量级。
          # 20m 是一个 CPU 核心的两万分之二十（即千分之二十）。
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # 就绪探针：在应用程序对 /healthz 作出响应之前，Service 不会
          # 把流量发到这个副本。在新版本滚动更新时，旧副本只有在
          # 新副本已经作出响应之后才从负载均衡中移除——因此请求
          # 不会落到一个尚未启动完成的进程上。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# 一个固定的名称，两个副本都站在它后面。Pod 会被重建并改变地址，
# 而名称 passes-api.default.svc.cluster.local 不变。没有这个对象，应用程序
# 照样运行，但在集群内部没有任何途径能访问到它——而 check.sh 中的检查
# 正是访问这里，而不是访问 Pod。
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # 与 Pod 的关联不是地址列表，而是按标签的条件。带有标签
  # app: passes-api 的新副本会自动纳入负载均衡，无需注册它。
  selector:
    app: passes-api
  # port——Service 本身在哪个端口上响应；targetPort 引用上面 ports 块中的名称
  # `http`，而不是数字，所以当数字改变时关联不会断掉。
  ports:
    - port: 80
      targetPort: http
