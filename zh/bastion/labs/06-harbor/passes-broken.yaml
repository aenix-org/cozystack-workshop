---
# 实验 6 · 你自己的私有镜像仓库。此文件是故意不完整的。
#
# 它不会正常工作，而这是有意为之：你应当亲眼看到失败，并自己
# 弄清楚集群缺少了什么。这里缺少的只有一样东西——当集群前来取镜像时，
# 它对这个封闭的仓库自称的身份。仓库不会把镜像随便交给任何人，
# 而这份描述里没有任何东西能帮助集群证明自己的
# 权利。到底是哪一行修好了它——你会在实验过程中弄明白；可用的版本
# 就放在旁边的 passes.yaml 里，在讲解之前打开它没有意义。
#
# 这里只有一个 Deployment，没有 Service：暂时还不需要给服务一个稳定的名字——
# 反正镜像下载不下来，我们根本到不了一个能响应的 pod。
#
# 在你的 `lab` 集群、默认命名空间中应用：
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f passes-broken.yaml
#     kubectl get pods -l app=passes-api -w
#
# 注意：HARBOR-HOST 是占位符，不是可用的地址。请替换成你自己 Harbor 的地址，
# 否则你得到的会是另一种错误，而不是这个文件为之编写的那种（带占位符的行有两处）：
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # macOS
#
# 在下面的对象中：apiVersion——描述模式的版本，kind——我们要创建什么，
# metadata.name——对象的名字。下文不再单独解释。
#
# Deployment 不是「运行一个容器」，而是「保持运行这么多份这样的容器副本」。
# 一份副本消失了——集群会不加询问地创建一份新的。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # 一份副本：要讲解这次失败，一份就够了，而且日志和
  # kubectl describe 的输出里噪声会更少。
  replicas: 1
  # 条件「我的副本是带有标签 app: passes-api 的 pod」。下面 pod 模板里的标签
  # 必须与此一致，否则集群会拒绝这份清单。
  selector:
    matchLabels:
      app: passes-api
  # 用来冲压出副本的模板。里面的一切都描述了单个 pod。
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # 对整个 pod 的安全约束：不以 root 运行，以
      # 非特权用户 10001 工作，把系统调用集合限制为
      # 标准配置。镜像也是按这个构建的（见 app/Dockerfile 里的 USER 行）。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # 容器级别的权限：不给自己添加额外特权，并放弃所有特殊的
          # 内核 capability。应用只需要一个网络端口，其余都是多余的。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 镜像名的第一部分是仓库地址。正因如此，迁移到你自己的
          # 仓库会改变清单：镜像名变得不同了。如果没有地址，
          # 集群就会去 Docker Hub 取镜像——也就是安全团队禁止去的地方。
          image: HARBOR-HOST/passes/passes-api:v1
          # 应用的端口。名字 `http` 在下文被就绪探针使用，
          # 因此端口号只在一个地方设置，而不是两个。
          ports:
            - containerPort: 8080
              name: http
          # 应用从这些环境变量得知它是谁、来自哪里。
          # 它在响应中打印的正是这些（见 app/main.go 里的 identity 结构体）。
          # APP_VERSION 和 IMAGE_REGISTRY 以文本形式设置——由我们自己写；接下来的三个
          # 在副本启动时由集群自己填入，应用无从得知它们。
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests——为一份副本预留什么：调度器按这些数字挑选
          # 节点。limits——上限：内存超过上限容器会被杀掉，CPU
          # 超过则被限流。16Mi 够用是因为这个应用是用 Go 写的、没有
          # 依赖。20m 是一个 CPU 核心的两万分之二十。
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # 就绪探针：在应用于 /healthz 上响应之前，流量不会
          # 流向该副本。今天不会走到这一步——它检查的是已经运行的
          # 进程，而对我们来说更早的一步会卡住，即镜像下载。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
