# 实验 8 · 第 2 步（共 3 步）：密码从 Deployment 中移出，放入独立的 Secret 对象。
# “天真的修复”：应用描述里已经看不到密码，开发者很满意，
# 审计员却不满意。为什么——只需一条命令就能看到。
#
# 这一步比第一步好在哪里：该值不再是应用描述的一部分，
# 现在通过名称来引用它。它比第三步差在哪里——该值仍然
# 得写在某个地方，而这里就是直接写在这个文件里。
#
#   secrets-demo-naive.yaml      任何打开文件的人都能看到密码
#   secrets-demo-secret.yaml  <- 你在这里：密码放在 Secret 对象里
#   secrets-demo.yaml            清单里根本没有密码
#
# 使用位置：你的 `lab` 集群（export KUBECONFIG=~/lab.kubeconfig）。
# 命令：kubectl apply -f secrets-demo-secret.yaml
#
# 本文件里的密码是教学用的、虚构的。文件里有两个对象，由一行
# `---` 分隔：一个 Secret 和一个引用它的 Deployment。文件下方的 apiVersion、kind
# 和 metadata.name 不再逐一注释。
#
# Secret 是一种独立的对象类型，用于那些不应放在应用描述里的东西。
# 集群对待它比对待普通配置更谨慎一些：其值
# 不会在 kubectl describe 中显示，读取权限单独授予。
apiVersion: v1
kind: Secret
metadata:
  name: passes-db
# Opaque 意为“任意的键值对集合”。还有一些特殊类型——
# 用于访问镜像仓库、用于 TLS 证书——但这里不需要任何
# 特殊类型。
type: Opaque
data:
  # 这不是加密。这是 base64——一种用可打印字符来书写字节的方式。
  # 没有密钥，没有解密口令，任何人都能做反向转换。
  password: UHJvcHVzazIwMTkh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # 下面的 Deployment 和第一步里的完全相同。只有一个
  # 地方变了：DB_PASSWORD 是如何进入 pod 的。
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # 不以 root 运行，系统调用集合受限。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 又是 busybox 加几行 shell：我们关注密码的路径，
          # 而不是应用的工作本身。
          image: busybox:1.36
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # 这就是与第一步的全部区别。用 valueFrom 而不是 value 意味着
            # “从那里取值”：secretKeyRef.name——哪个对象，key——它里面的哪个
            # 字段。替换发生在 pod 启动时，应用描述里只留下名称。
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: passes-db
                  key: password
          # 和第一步相同的循环：它打印密码的指纹，而不是密码
          # 本身。指纹正好便于比较各步骤——如果它没有
          # 变化，就说明进入 pod 的是和之前相同的值。
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
