# 实验 8 · 3 步中的第 1 步：密码以明文形式写在清单里。
# 这就是「通行证」服务今天的样子——也正是审计发现的那个文件。
# 我们只会应用它一次，好亲眼看看这个问题。
#
# 本实验的三个步骤，别弄混了：
#   secrets-demo-naive.yaml   <- 你在这里：任何打开文件的人都能看到密码
#   secrets-demo-secret.yaml     密码被移到了单独的 Secret 对象里
#   secrets-demo.yaml            清单里根本没有密码
#
# 在哪里应用：你的 `lab` 集群（export KUBECONFIG=~/lab.kubeconfig）。
# 命令：kubectl apply -f secrets-demo-naive.yaml
#
# 本文件里的密码是教学用的、虚构的，这里没有任何真实密码。只有一个对象——
# 一个 Deployment；apiVersion、kind 和 metadata.name 后面不再注释。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # 一个副本就够了：我们关注的不是容错，而是
  # 应用从哪里取得密码。
  replicas: 1
  # Deployment 通过这个标签识别自己的 Pod。它与下面 template 中的标签一致。
  selector:
    matchLabels:
      app: secrets-demo
  # template——Pod 模板：用什么来构建一个副本。
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # 安全要求：不以 root 运行，限制系统调用集合。
      # 注意这里的脱节：Pod 按照所有信息安全规则做了配置，而这丝毫
      # 无法阻止密码就写在下面十行处的文件里。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 这里没有真正的应用——只有 busybox 和几行 shell。
          # 对本实验只有一件事重要：密码从哪里来，而不是之后
          # 对它做了什么。
          image: busybox:1.36
          env:
            # 数据库地址和用户名不是秘密：知道
            # 数据库叫 passes-db 本身并不会给你访问权限。
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # 这就是审计发现的那一行。
            # 文件在 Git 里，也就是说凡是能访问仓库的人、
            # 以及曾经克隆过它的每个人都知道这个密码。
            - name: DB_PASSWORD
              value: "Propusk2019!"
          # 无限循环：每十秒往日志里打印一行。进入日志的不是密码
          # 本身，而是它的 sha256 指纹——前十二个字符。从指纹
          # 可以看出密码变了，但无法从中还原出原值。
          # 真实服务里的日志正是这样写的。
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s 正在连接到 %s，身份为 %s，密码指纹 sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          # 胃口极小：这是演示，不是真实负载。
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
