# 实验 8 · 第 3 步（共 3 步）：清单里没有密码——既不是明文，也不是 base64。
# 最终版本。这个文件可以提交到 Git、拿给外包看，还可以印
# 在 T 恤上。
#
# 这一步与第二步的区别：那里的值终究还是被写下来了——写进文件，
# 然后写进集群对象。这里它在描述中根本不存在；应用在启动时
# 自己从 OpenBao 存储里取密码。
#
#   secrets-demo-naive.yaml      谁打开文件谁就能看到密码
#   secrets-demo-secret.yaml     密码被移到了 Secret 对象里
#   secrets-demo.yaml         <- 你在这里：密码在启动时从存储送达
#
# 应用之前：把 tenant-workshopXX 换成你自己的 namespace——它是下面
# 存储地址的一部分。XX 是占位符，不是名字的一部分。
# 在哪里应用：你的 `lab` 集群（export KUBECONFIG=~/lab.kubeconfig）。
# 命令：kubectl apply -f secrets-demo.yaml
#
# 应用向存储表明身份所用的令牌放在 passes-bao-token 这个 secret 里。
# 你用命令创建它，而不是用文件：这个清单里只有对象的名字，
# 而名字不是秘密。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # 一切都以非 root 身份运行。需要 fsGroup 是因为这里有两个容器：一个
      # 写入带密码的文件，另一个读取它。没有共享的组，init 容器
      # 写出的文件主容器打不开，你会花上半个小时琢磨
      # 到底哪里错了。
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # 一个容器放密码、另一个读密码的地方。
      # medium: Memory 意味着这个「磁盘」位于节点的内存里，
      # 永远不会落到真正的磁盘上：不会进备份，不会进卷转储，也不会到
      # 把磁盘从服务器里拿走的人手上。Pod 没了——内容也就没了。
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      # init 容器在主容器之前运行，并且必须成功完成。
      # 如果它取不到密码，应用就根本不会启动，这是正确的
      # 行为：一个没有数据库密码的服务本来就不可用，与其起来后
      # 往日志里狂喷错误，不如干脆起不来更诚实。
      initContainers:
        - name: fetch-secret
          # 我们采用 OpenBao 镜像本身，只为了其中一个工具 `bao`——它的客户端。
          # 不需要写自己的代码。
          image: openbao/openbao:2.5.1
          # bao kv get -field=password——按单个路径取单个字段，而不是整个
          # secret。tr -d '\n' 去掉换行符，否则它会跑到密码
          # 里面：多一个末尾字符数据库不会接受，而排查这种问题很讨厌。
          # chmod 0400——只有属主能读这个文件。
          # set -e 在第一个错误处就停止脚本：否则容器会带着空文件
          # 成功退出，然后你就得在应用里去排查了。
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              bao kv get -field=password secret/passes/db \
                | tr -d '\n' > /secrets/db_password
              chmod 0400 /secrets/db_password
              echo "пароль получен из OpenBao, в манифесте его нет"
          # 存储的地址，以及应用用来证明自己有读取权限的令牌。
          # 令牌通过对某个由命令创建的对象的引用取得；它不会进到这里、进到文件里。
          # 地址里的 tenant-workshopXX 就是那个需要替换的占位符。
          env:
            - name: BAO_ADDR
              value: http://openbao-secrets.tenant-workshopXX.svc.cozy.local:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: passes-bao-token
                  key: token
          # 共享文件夹。这个容器被授予了写权限——它往里面写。
          volumeMounts:
            - name: secrets
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 限额比主容器高：OpenBao 工具比 busybox 重，
          # 但它只活几秒钟，所以这不是长期开销。
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      # 主容器只有在 init 容器完成之后才启动。
      containers:
        - name: app
          image: busybox:1.36
          # 和前几步一样的循环，但密码现在不在环境
          # 变量里，而在文件里：指纹直接从 /secrets/db_password 计算。
          # 环境变量在 kubectl describe pod 的输出里可见，还会进到进程
          # 转储里；而 pod 内存里的文件不会。
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(sha256sum /secrets/db_password | cut -c1-12)"
                sleep 10
              done
          # 这里只剩下非机密的配置——地址和登录名。
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
          # 同一个文件夹，但只读：应用无法损坏或替换密码，
          # 哪怕它非常想这么做。
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
