---
# 实验 12。用于承载遗留员工通讯录的虚拟机：磁盘和机器本身，
# 一个文件里两个对象，用 `---` 行分隔。
#
# 这些是租户对象：它们不在 `lab` 集群里，而在管理集群上你自己的
# namespace 中。需要用租户的 kubeconfig。
#
# 应用前请把 tenant-workshopXX 替换成你自己的 namespace，否则订单会发到
# 别人的租户，而不是你的。
#
#     export KUBECONFIG=~/.kube/config
#     kubectl apply -f staff-directory-vm.yaml
#
# 同样的操作也可以在租户仪表盘里用鼠标完成（创建应用 -> VM Disk，
# 然后 VM Instance）——结果完全一样。
#
# 注意：之后调用这台机器所用的名字与 metadata.name 不一致，这并不是
# 实验里的笔误。平台用 `vm-instance` 图表部署一个名为 X 的 VMInstance 对象，
# 而图表名会拼接到发布名上：运行中的实例
# 叫 vm-instance-X。此外，目标要带上类型前缀，因为
# 租户权限授予的是实例（virtualmachineinstances，即 vmi），而不是
# virtualmachines——裸名字会返回 forbidden。因此进入控制台的命令是：
#     virtctl console --namespace=tenant-workshopXX vmi/vm-instance-spravochnik
# 列出运行中的实例：kubectl get vmi -n tenant-workshopXX
# 而 `kubectl get vminstance spravochnik` 显示的不是实例，而是你对它的订单——
# 也就是下面描述的那个对象。
#
# 磁盘和机器是两个不同的对象，这不是官僚主义：磁盘比机器
# 活得更久。机器可以删除后重新创建，再挂上同一块磁盘。
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  source:
    image:
      # 来自平台共享镜像集合的名字，不是 URL。
      # 创建磁盘时在仪表盘里能看到这个列表。
      name: ubuntu-22.04
  # 磁盘大小。它不能小于源镜像：ubuntu-22.04 展开
  # 需要 20Gi，平台会拒绝往 10Gi 的磁盘里灌。磁盘以后可以扩容，
  # 但不能缩小，所以在这里估小比估大代价更高。
  storage: 20Gi
  # 存储类。`replicated`——数据会以多份副本写到平台的不同
  # 节点上：持有副本的节点挂掉，机器仍能继续工作。本质上这就是
  # 一面镜子，只不过是通过网络组起来的。相邻实验里的数据库用的是同一个类。
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  # 1 个 CPU，4 GB。就是从同一份目录参考里取的，
  # Kubernetes 节点的规格也从这里取：机器和节点在这里用同样的方式度量。
  instanceType: u1.medium
  # 客户机操作系统的配置档：给机器塞哪些驱动和设备。
  instanceProfile: ubuntu
  # Always 表示“保持开机”：自己关了——就再开起来。
  # Halted——关机，Manual——保持原样。
  runStrategy: Always
  # 给机器挂哪些磁盘。引用是按上面 VMDisk 对象的名字——就是
  # 那个会比这台机器活得更久的对象。
  disks:
    - name: spravochnik
  # 请注意：这里没有 replicas 字段，以后也不会有。
  # 虚拟机是单个对象。需要两台机器——就是两个对象，
  # 名字不同。这是与 Deployment 的根本区别，
  # 见 README 中讲这个区别在哪里会带来痛点的那一节。
  # 客户机操作系统的初次配置。cloud-init 是 Linux 云
  # 镜像的标准机制：首次启动时机器读取这段文本并把它应用到自身。就其作用而言
  # 它相当于 vSphere 里的客户机定制——密码、文件、服务——只不过是用描述，而不是
  # 用向导。`|` 之后缩进以下的一切都会原样进入客户机，并在
  # 那里解析，而不是由 Kubernetes 解析。
  #
  # 这里 cloud-init 把通讯录变成一个服务器：放上一个 HTML 页面并建立一个服务，
  # 通过 HTTP 在 8080 端口把它提供出去。python3 已经在 ubuntu 镜像里了——为此
  # 不需要互联网。8080 端口不是随便选的：主讲人事先已在你的租户里创建了
  # Service `spravochnik-http`（80 -> 8080）和 Ingress `spravochnik`，一旦机器
  # 内部的服务起来，通讯录就会发布到租户域名上。
  cloudInit: |
    #cloud-config
    # 需要这个密码是为了从仪表盘登入控制台。在生产机器上
    # 不该这么做——那里要用 sshKeys。
    password: ubuntu
    chpasswd: { expire: false }
    ssh_pwauth: true
    write_files:
      - path: /opt/directory/index.html
        content: |
          <!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Справочник</title></head><body><h1>Справочник сотрудников</h1><ul><li>Иванов И. — 101</li><li>Петров П. — 102</li></ul></body></html>
      - path: /etc/systemd/system/directory.service
        content: |
          [Unit]
          Description=Staff directory
          After=network.target
          [Service]
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0 --directory /opt/directory
          Restart=always
          [Install]
          WantedBy=multi-user.target
    runcmd: [ "systemctl daemon-reload", "systemctl enable --now directory" ]
