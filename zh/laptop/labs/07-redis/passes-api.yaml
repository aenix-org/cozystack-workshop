---
# 实验 7 · “通行证”服务，v2 版本——能够配合缓存工作的那个版本。
# 这里暂时还没有启用缓存：我们先测量一下没有缓存时情况有多糟糕。缓存会在稍后启用，
# 使用本文件夹里的 cache-patch.yaml 补丁。
#
# 应用位置：你的 `lab` 集群（export KUBECONFIG=~/lab.kubeconfig）。
# 命令：kubectl apply -f passes-api.yaml
#
# HARBOR-HOST 是占位符，不是地址。请替换成你自己 Harbor 的地址（见 hr-legacy.yaml，
# 那里还有一次性替换所有文件中该值的 sed 命令）。
#
# 文件中通过 `---` 分隔两个对象：Deployment（应用的副本）和 Service（它们的固定名称）。
# apiVersion、kind 和 metadata.name 在文件后面不再逐一注释。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # 两个副本，而不是一个——这样稍后就能看到缓存的关键特性：它是共享的。
  # 一个 Pod 把响应放进 Redis，另一个从那里取出，尽管它自己从没去过目录服务。
  replicas: 2
  # Deployment 通过这个标签把自己的 Pod 和别的 Pod 区分开。它必须和下面 template 里的
  # 标签一致，否则对象将找不到自己创建的东西。
  selector:
    matchLabels:
      app: passes-api
  # template 是 Pod 模板：每个副本由什么组装而成。
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Pod 级别的安全要求：不以 root 运行，受限的系统调用集合。在启用了策略的集群中，
      # 缺少这些字段的 Pod 将不被准入。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # 集群在拉取镜像时向封闭的 Harbor 出示的凭据。没有对这个 secret 的引用，
      # Pod 会卡在 ImagePullBackOff。
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # 容器的权限被削减到最小：不允许提权，没有内核特权。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 和目录服务相同的镜像。只有下面的 MODE 把它们区分开。
          image: HARBOR-HOST/passes/passes-api:v2
          # 需要端口名，这样探针和 Service 就能引用名称，而不是数字。
          ports:
            - containerPort: 8080
              name: http
          # 应用的全部行为都在这里设定。注意：列表里没有 REDIS_ADDR 和 REDIS_PASSWORD
          # 变量——正因如此缓存才是关闭的，每个请求都老老实实地去往缓慢的目录服务。
          env:
            # MODE=api——这个实例作为“通行证”服务本身运行。
            - name: MODE
              value: "api"
            # 版本和镜像仓库对应用运行来说并不需要——它们会显示在对“/”的响应里，
            # 让你确认正在运行的正是你刚刚构建的那个。
            - name: APP_VERSION
              value: "v2"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # 去哪里取数据。是服务名而不是地址：目录服务的副本可以被
            # 重建任意多次，名称不会改变。
            - name: HR_URL
              value: "http://hr-legacy.default.svc.cluster.local"
            # 谁在哪里执行请求。集群自己填入这三个值：事先没人知道它们。
            # 它们会进入服务的响应，通过它们能看出是哪个副本、在哪个节点上
            # 作出了应答——这在测量时会派上用场。
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests 是选择节点时预留的资源，limits 是上限。这里一个核心的上限
          # 不是贪心：在负载下应用会撞上它，而不是吃光整个节点，这样测量显示的
          # 是目录服务的延迟，而不是对 CPU 的争抢。
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # 在 /healthz 应答之前，Service 不会向这个副本发送任何一个请求。
          # 更新时，同一个字段能保护你免于故障：旧副本不会被移除，
          # 直到新副本报告就绪。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service——两个副本共用的一个固定名称，以及它们之间的请求分发。
# Pod 会被重建并更换 IP，而 passes-api 这个名称保持不变。Fortio 和检查脚本
# 都通过这个名称访问服务。
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # Service 用来收集存活副本列表的标签。若与 Pod 的标签不一致——
  # Service 会存在，但通向虚无。
  selector:
    app: passes-api
  ports:
    # 外部访问 80 端口，进入 Pod 后转发到名为 http 的端口（8080）。
    - port: 80
      targetPort: http
