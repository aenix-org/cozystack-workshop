---
# 实验 7 · 遗留员工目录的桩服务。
# 现实中这是别人的系统，你无权重写它：它的响应耗时 800 毫秒，
# 你只能想办法与之共处。这里是一个行为相同的桩，好让你有东西可测量。
#
# 适用位置：你的 `lab` 集群（export KUBECONFIG=~/lab.kubeconfig），而非 Cozystack
# 管理集群。命令：kubectl apply -f hr-legacy.yaml
#
# HARBOR-HOST 是占位符，而不是地址。请替换成你自己 Harbor 的地址，否则集群会
# 试图从一个不存在的主机拉取镜像：
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # macOS
#
# 文件中有两个对象，以 `---` 行分隔：一个 Deployment（运行什么、运行多少个
# 副本）和一个 Service（用于访问这些副本的固定名称）。每个对象的
# apiVersion 和 kind 说明它是什么类型的对象，metadata.name 是它的名称；
# 文件往下这三个字段不再注释。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-legacy
  labels:
    app: hr-legacy
spec:
  # 保持运行多少个副本。若某个副本消失，集群会不加询问地创建一个新的。
  # 目录只需一个副本：它在这里不是为了承载负载，而是为了测量。
  replicas: 1
  # Deployment 靠这个标签在集群所有 Pod 中辨认出属于自己的 Pod。
  # selector 中的标签与下方 template 中的标签必须一致，否则该对象
  # 会找不到自己创建的东西。
  selector:
    matchLabels:
      app: hr-legacy
  # template 是 Pod 模板。下面的一切描述的是一个副本：用什么来构建它、
  # 以何种权限运行它，以及如何判断它已准备好接收请求。
  template:
    metadata:
      labels:
        app: hr-legacy
    spec:
      # Pod 级别的安全要求。进程不以 root 身份运行（uid 10001），
      # seccomp 配置切断了应用不需要的系统调用。
      # 在启用了策略的集群中，缺少这些字段的 Pod 根本无法启动。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Harbor 由登录名和密码保护，集群需要用某种凭据来表明身份。`harbor`
      # 密钥是你在讲镜像仓库的实验里创建的。没有这个引用，镜像就拉取不下来，
      # Pod 会停留在 ImagePullBackOff 状态。
      imagePullSecrets:
        - name: harbor
      containers:
        - name: hr
          # 与 Pod 级别相同，但针对具体容器：我们禁止提权并丢弃所有内核
          # 能力。这个 Go 应用一个都不需要。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 目录服务和「通行证」服务本身使用的是同一个镜像。
          # 究竟启动哪个进程，由下面的 MODE 变量决定。
          image: HARBOR-HOST/passes/passes-api:v2
          # 端口除了编号还有名称：就绪探针和下面的 Service 引用的是名称。
          # 如果编号变了，你只需在一处修改。
          ports:
            - containerPort: 8080
              name: http
          # 环境变量是配置这个应用的唯一方式。
          # 无需为改变行为而重新构建镜像。
          env:
            # MODE=hr — 该实例假装成一个 HR 系统：等待并作出响应。
            - name: MODE
              value: "hr"
            # 恰好是真实目录所表现出的那个延迟。
            # 改动它，你就改变了「情况有多糟」——之后可以试试 2s。
            - name: HR_DELAY
              value: "800ms"
            # Pod 事先并不知道自己的名称——名称由集群在创建时分配。
            # fieldRef 在启动时把这个名称代入变量，它会
            # 出现在服务的响应中：可以看出是哪个副本作了应答。
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # requests — 选择节点时为容器预留多少资源，
          # limits — 不允许其超过的上限。类似于 vSphere 中的 reservation
          # 和 limit，但设置在容器上，而非虚拟机上。
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # 就绪探针。在 /healthz 作出响应之前，Service 不会向这个副本发送
          # 任何请求。没有探针，流量会打到一个尚未启动的进程上，
          # 于是你会无端看到错误——尽管「一切都已部署完成」。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — 为一组 Pod 提供固定的名称和固定的地址。Pod 会被重建，
# 每次都获得新的 IP，但名称 hr-legacy 保持不变。类似于负载均衡器的
# VIP，但用四行就能建立，且存活于集群内部。
apiVersion: v1
kind: Service
metadata:
  name: hr-legacy
spec:
  # Service 靠这个标签收集存活副本的列表。与上面 Pod 的标签相同：
  # 若不匹配，Service 会存在却不指向任何地方。
  selector:
    app: hr-legacy
  ports:
    # 请求从 80 端口进入，在 Pod 内部转发到名为 http 的端口（8080）。
    - port: 80
      targetPort: http
