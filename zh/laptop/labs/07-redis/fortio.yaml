---
# 实验 7 · 带 Web 界面的负载生成器。
# 与扩缩容实验中用的是同一个：在浏览器里点击按钮启动负载，
# 延迟直方图也在同一页面显示。如果它已经为你部署好了，就无需再
# 应用这个文件，kubectl 会回复 “unchanged”。
#
# 应用位置：你的 `lab` 集群（export KUBECONFIG=~/lab.kubeconfig）。
# 命令：kubectl apply -f fortio.yaml
#
# 用 `---` 分隔的两个对象：Deployment（生成器本身）和 Service（用来访问它的
# 名称）。apiVersion、kind 和 metadata.name 后面不再注释。
#
# 镜像从公共 Docker Hub 拉取，而不是从你的 Harbor：Fortio 不是「Пропуск」
# 服务的一部分，而是一台临时驻留在集群里的测量仪器。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # 只有一个副本。负载生成器不需要扩缩容——你需要它作为唯一一个
  # 老实统计延迟的实例。两个副本会给出两份无法合并的直方图。
  replicas: 1
  # Deployment 借以识别自己 Pod 的标签。与下面 template 中的标签一致。
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # 与其余部分相同的安全要求：进程不以 root 运行，
      # 系统调用受 seccomp 配置文件限制。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 这里的 `latest` 标签是为了工作坊而做的简化，它与那节关于自建
          # 镜像仓库的实验所教的内容相矛盾：该标签下的镜像可能在两次 apply
          # 之间悄然改变，昨天的测量结果就变得无法复现。对于教学台上的
          # 负载生成器这是可以接受的，对于生产系统则不行。
          image: fortio/fortio:latest
          # `server` 是让 Fortio 启动 Web 界面并等待你按下按钮的模式。
          # 没有这个参数，镜像会执行一次性命令然后退出。
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # 生成器需要 CPU 余量，否则它会卡在
              # 自己身上，你压的就不是应用，而是 Fortio。
              cpu: "1"
              memory: 256Mi
---
# 需要 Service 来打开 Web 界面：通过端口转发按名称访问生成器
# —— kubectl port-forward svc/fortio 8081:8080 —— 然后打开
# localhost:8081。不用 Service 也能压测服务，用命令
# kubectl exec deploy/fortio，但只有这条路径能在浏览器里给出直方图。
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  # 这里 Service 的端口号与容器端口一致——不同于实验里其余的
  # 服务，那些是外部 80、内部 8080。区别只在于方便。
  ports:
    - port: 8080
      targetPort: http
