---
# 实验 7 · 此补丁故意不完整。它的作用是让你看到
# “缓存好像开了，但速度并没有变快”是什么样子。可用的版本在 cache-patch.yaml 中。
#
# 在你的 `lab` 集群中应用（export KUBECONFIG=~/lab.kubeconfig）：
#   kubectl patch deployment passes-api --patch-file cache-patch-broken.yaml
#
# 不需要偷看答案。应用它，发几个请求，然后查看
# 应用日志：kubectl logs -l app=passes-api。应用会告诉你它哪里出了问题，
# —— 关键在于读懂这条消息，弄清楚这个文件缺了什么。
#
# 用你自己的 Redis 地址替换 REDIS-ADDR（参见查找地址的那一步）。
# 不能保留占位符：否则你会得到另一个错误，而不是这一切原本要展示的那个。
spec:
  template:
    spec:
      containers:
        # 容器名称就是集群用来定位待修改位置的地址。
        - name: api
          env:
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
