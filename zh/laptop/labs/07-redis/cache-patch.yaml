---
# 实验 7 · 真正启用缓存。应用在已经部署好的 passes-api 之上，
# 部署在你的 `lab` 集群中（export KUBECONFIG=~/lab.kubeconfig）：
#   kubectl patch deployment passes-api --patch-file cache-patch.yaml
#
# 这是一个补丁，而不是完整的清单：它只描述发生变化的部分。其余一切——
# 镜像、标签、探针、资源——都保持 passes-api.yaml 中的原样不动。正因如此，
# 文件直接从 spec 开始：一路向下到容器的路径复刻了 Deployment 的结构，
# 好让集群明白到底应该把改动应用到哪里。
#
# 容器名 `api` 不是装饰，而是地址：集群靠它在列表里找到正确的容器。
# 名字写错，得到的不是改动，而是第二个容器。
#
# 用你自己 Redis 的地址替换 REDIS-ADDR——它是一个占位符，不是主机名。
# 地址从仪表盘里、你的托管 Redis 应用的卡片中获取。
spec:
  template:
    spec:
      containers:
        - name: api
          # Kubernetes 中的 env 列表按 name 字段合并，所以下面这三条
          # 会追加到 Deployment 中已有的条目上，而不是替换它们。
          env:
            # 这个变量的出现就是“启用缓存”的含义：应用在启动时检查它，
            # 如果它被设置了，就先去查 Redis。为空或缺失——则和以前一样，
            # 每个请求都去查名录。
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
            # 我们不把密码写成明文：它来自一个密钥（secret），你会用
            # 另一条命令单独创建它。在存于 Git 中的清单里，
            # 密码没有容身之地。
            #
            # secretKeyRef 是一个引用：name——同一集群中密钥对象的名字，
            # key——取它内部的哪个字段。取值在 Pod 启动时被填入，
            # 永远不会出现在文件里。
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
            # 一条记录在缓存中存活多少秒。六十——因为员工名录
            # 一天变一次，而不是一秒变一次。
            #
            # 时间越长——查名录越少，但供出过期姓氏的时间越长。
            # 时间越短——数据越新，收益越小。这是一个权衡，
            # 而不是一个有正确值的设置项。
            - name: CACHE_TTL
              value: "60"
