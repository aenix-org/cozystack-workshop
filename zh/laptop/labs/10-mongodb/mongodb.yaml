# 实验 10 · 为不同类型的通行证订购一个 MongoDB 数据库。
# 描述你想要得到的东西；平台负责组装并配置该服务。
# 与你在仪表板里用鼠标下单的效果相同 —— 只是改成了文本。
# 应用的目标不是实验集群，而是管理集群上的一个租户：
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f mongodb.yaml
#
# 应用之前：把 tenant-workshopXX 替换成你自己的 namespace，
# 把 ЗдесьВашПароль 替换成你自己想好的密码。
apiVersion: apps.cozystack.io/v1alpha1
kind: MongoDB
metadata:
  name: passes
  namespace: tenant-workshopXX
spec:
  # 单个副本。MongoDB 设计为三个成员的副本集：它们投票选出主节点，
  # 并能在丢失其中一个时继续存活。只有一个副本时没有其他节点可以一起投票，
  # 于是 chart 为此启用了一个单独的“不安全”模式。用于实验足够了，
  # 但不适合生产环境。
  replicas: 1
  # 存放数据的磁盘。四个学习用文档一兆字节就够了，但预先把卷的容量
  # 留得宽裕一些，比之后再扩容要容易。
  size: 5Gi
  # replicated —— 在集群另一个节点上有副本的卷：某个节点掉线，
  # 数据依然保留。
  storageClass: replicated
  # 分配给数据库 pod 的 CPU 和内存。对四个文档而言绰绰有余。
  resourcesPreset: s1.small
  # MongoDB 的分支。事后在运行中的数据库上更改它，只能通过升级来完成。
  version: v8
  # false —— 数据库只能从集群内部访问，不会对外暴露端口。
  # 你将从旁边启动的工作 pod 里访问它。
  external: false
  # 分片会把数据切分到多组服务器上。当数据放不下单台服务器时才需要；
  # 四个通行证是放得下的。
  sharding: false
  # 数据库用户及其密码。请自己想好密码并牢记：工作 pod
  # （在 MONGO_URI 连接字符串里）和检查脚本（MONGO_PASSWORD 变量）
  # 都需要它。账户是在服务数据库 admin 中创建的 ——
  # 因此连接字符串里必须带上 authSource=admin。
  users:
    passapp:
      password: ЗдесьВашПароль
  # passes 数据库以及其中的权限：passapp 用户被授予该数据库的 admin 角色，
  # 也就是说它可以读、写、建立索引以及更改集合设置。
  # 这并不授予对其他数据库的权限。
  databases:
    passes:
      roles:
        admin:
          - passapp
  # 备份到对象存储。在学习环境中已关闭。
  backup:
    enabled: false
