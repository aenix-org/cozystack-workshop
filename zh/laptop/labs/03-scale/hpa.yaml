---
# 实验 3。按 CPU 负载扩展副本。
# 目标为 requests.cpu（20m）的 50%，即阈值为每个 Pod 10m。
# 特意设得很低：负载必须在几秒内触发，
# 我们做这个实验只有半小时，而不是半天。
#
# 单个对象。应用在你的学习集群 `lab` 上，而不是在管理集群上的租户里：
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f hpa.yaml
# 这里没有像 tenant-workshopXX 这样的占位符——你不需要在任何地方替换自己的编号。
#
# 有两个条件，缺少它们对象会被创建但无法工作：
#   1. rickroll 容器设置了 requests.cpu——否则没有东西可以用来计算百分比，
#      并且 `kubectl get hpa` 的 TARGETS 列会永远显示 <unknown>。
#   2. 集群中运行着 metrics-server——它是 Pod 当前消耗的数据源。
# 这两个条件都由本文件夹中的 check.sh 检查。
#
# 只要 HPA 存在，Deployment 的 replicas 字段就归它所有。你可以通过
# `kubectl scale` 手动改变副本数，但 HPA 会在几秒内把它恢复成自己的值。
# 所以在实验 4 中，发布前会删除这个对象：两个机制争夺同一个字段——
# 是让人绝对搞不清发生了什么的可靠办法。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # HPA 的名称不必与应用名称一致——这里一致只是为了方便。
  # 它管理什么由下面的 scaleTargetRef 决定，而不是这个名称。
  name: rickroll
spec:
  # 看谁、改谁的 replicas 字段。三个字段放在一起，因为没有类型的名称
  # 是有歧义的：Deployment 和 StatefulSet 可以叫同一个名字。
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rickroll
  # HPA 在任何负载下都不会越出的区间。下界就是实验开始时的
  # 那一个副本。上界是六个：在 limits.cpu 为 300m 时学习节点上
  # 能容纳这么多，并且在 Pod 列表里一眼就能明显看出来。
  # 设成 maxReplicas: 1，对象会被创建但什么也不做。
  minReplicas: 1
  maxReplicas: 6
  # 根据什么来做决策。可以有多个指标，那样 HPA 会取要求副本数
  # 更多的那个。这里只有一个——CPU。
  metrics:
    - type: Resource
      resource:
        name: cpu
        # Utilization——是容器 requests.cpu 的占比，而不是节点容量的占比。
        # 由此有一个反直觉的结果：这个值轻松就能到 600%，而且这
        # 不是错误：Pod 吃掉的量是它预留量的六倍。
        # 另一种方式是 AverageValue，那里直接用毫核设置阈值。
        target:
          type: Utilization
          averageUtilization: 50
  # 反应有多迅速。这个块是可选的：没有它就使用默认值，
  # 那些默认值是为生产环境运行设计的，而不是为演示设计的。
  behavior:
    scaleUp:
      # 默认情况下 Kubernetes 会等待稳定并且增长缓慢。
      # 在实验里这看起来像“什么都没发生”，所以我们加快它。
      stabilizationWindowSeconds: 0
      # 每十五秒不超过两个新副本。这个步长是靠经验选出来的：
      # 增长看起来是增长，而不是从一个瞬间跳到六个，
      # 那样参与者就没什么可观察的了。
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      # 而向下缩容则相反——不是瞬间的，否则 Pod 会在参与者
      # 来得及观察它们之前就消失。
      # 用一分钟而不是默认的五分钟：实验只进行半小时，等缩容
      # 等五分钟没什么事可做。在生产集群里长窗口反而有用——
      # 它能抑制不平稳负载上的来回摇摆。
      stabilizationWindowSeconds: 60
