# 实验 9 · 订购一个 ClickHouse 数据库，用于对门禁通行日志进行分析。
# 描述你想要得到的结果；由平台负责组装和配置该服务。
# 与你在仪表盘中用鼠标下单的内容相同 —— 只是改用文本表达。
# 它不是应用到实验集群，而是应用到管理集群上的租户中：
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f clickhouse.yaml
#
# 应用前：将 tenant-workshopXX 替换为你自己的 namespace，
# 并将 ЗдесьВашПароль 替换为你自己设定的密码。
apiVersion: apps.cozystack.io/v1alpha1
kind: ClickHouse
metadata:
  name: analytics
  namespace: tenant-workshopXX
spec:
  # 一个副本和一个分片。生产环境中至少保留两个副本，否则丢失一个节点
  # 就意味着数据不可用 —— 但我们需要的是一百万行数据，而不是容错
  # 能力，多余的副本只会白白吃掉实验台的资源。
  replicas: 1
  shards: 1
  # 用于存放表数据的磁盘。本实验的一百万行数据只占用几十兆字节：
  # 带字典的列式存储对这样的日志压缩得非常厉害。
  size: 5Gi
  # 用于存放服务器系统日志（包括查询日志）的独立磁盘。
  logStorageSize: 2Gi
  # 查询日志保留多少天后丢弃。我们会去查看它。
  logTTL: 15
  # replicated —— 在集群另一个节点上有副本的卷：某个节点掉线了，
  # 数据依然保留。
  storageClass: replicated
  # 1 个处理器，4 GB。ClickHouse 在内存中计算，对一百万行做
  # 分组时这一点很明显。
  resourcesPreset: u1.small
  # 数据库用户及其密码。请设定并记住你自己的密码：工作 Pod
  # （变量 CH_AUTH）和校验脚本（变量 CH_PASSWORD）都需要它。
  # 创建后可以在仪表盘中、在 secret clickhouse-analytics-credentials 里看到它。
  users:
    analyst:
      password: ЗдесьВашПароль
  # 备份到对象存储。这里的数据是生成的，
  # 没有什么需要恢复的 —— 在教学实验台上已关闭。
  backup:
    enabled: false
  # Keeper 用于副本之间的协调。只有一个副本 —— 没有谁需要
  # 协调，而三个 Keeper Pod 会白白占用资源。
  clickhouseKeeper:
    enabled: false
