---
# 实验 5 · 用 Git 管理基础设施。为「通行证」（Пропуск）服务准备的命名空间。
#
# 这个文件不会手动应用到集群。你把它放进自己在 GitHub 上的仓库，
# 放到 apps/ 目录里，然后由 Flux 自动地、按计划地把它搬进 `lab` 集群：
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# 如何读懂任何清单：apiVersion —— 描述 schema 的版本（集群靠它知道
# 该如何解析对象），kind —— 我们要创建什么，metadata.name —— 之后用来查找对象的
# 名称。这三个字段每个对象里都有，下面不再单独说明。
#
# 命名空间（namespace）—— 单个集群内部的逻辑隔断：
# 有自己的名称作用域、自己的权限、自己的配额。在 vSphere 里最接近的东西是
# vCenter 树里的文件夹或 resource pool。
#
# 为什么它要和应用一起放进 Git，而不是手动创建：当服务从仓库里
# 移除时，Flux 也会把命名空间一并删除。不会留下一个空的隔断，
# 那种半年后谁也想不起来当初为什么建它的东西。
apiVersion: v1
kind: Namespace
metadata:
  name: passes
  # 这个标签不影响服务的运行 —— 它的作用是让一条命令就能找到所有
  # 属于「通行证」的东西：kubectl get all -A -l app.kubernetes.io/part-of=passes。
  # part-of 这个名字取自 Kubernetes 通用的标签集合，不是我们自己发明的：
  # 第三方工具（监控、导出）找的正是它。
  labels:
    app.kubernetes.io/part-of: passes
