---
# 实验 5 · Git 中的基础设施。「通行证」服务本身：一个文件里的四个对象。
#
# 不用手动应用到集群。该文件放入它在 GitHub 上自己的仓库中，放进
# apps/ 目录，与 namespace.yaml 相邻，然后由 Flux 自己把它搬进 `lab` 集群：
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# --- 这一行分隔对象：一个文件，四个相互独立的对象。文件中的顺序
# 不影响创建顺序——集群会自己搞定。
#
# 每个对象里：apiVersion——描述模式的版本，kind——我们创建的是什么，
# metadata.name——对象的名字，metadata.namespace——它住在集群的哪个隔间里。
# 往下这些字段不再单独说明。
#
# 四个对象里没有一个包含密码、密钥或令牌，这并非
# 偶然：进了 Git 的东西就永远留在那里——历史可以改写，但
# 所有已经克隆过的人都会保留旧副本。密钥在这里没有位置。

# --- 4 之 1。Web 服务器设置 ----------------------------------------------------
# ConfigMap 把一个文本文件与应用分开放入集群，而在下面（在
# volumes 部分）这个文件被挂进容器内部。意义在于——修改设置而无需
# 重建镜像：你在这里改，提交，一分钟后集群里就有了新版本。
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-conf
  namespace: passes
# data 里的键会成为容器中的文件名：default.conf 会落到 nginx 启动时
# 读取的那个目录里。名字后面的竖线是在 YAML 中把多行文本原样
# 写入、保留换行的一种方式。
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      # 就绪检查的地址。集群敲这里，在收到应答之前
      # 不会把流量发到某个副本上。
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        # 在返回的页面里，把 __POD__ 替换为运行 nginx 的机器名。
        # 在 pod 内部，机器名就是 pod 自己的名字。
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
    }
---
# --- 4 之 2。服务返回的页面 ----------------------------------------------------
# 在这个实验里页面是个占位：真正的应用稍后才会出现。现在重要的
# 不是服务显示什么，而是它是从哪儿进到集群里的。标记中的 __POD__ 文本——
# 是替换的标记：nginx 会把它替换成返回该页面的 pod 的名字，往后你就能
# 通过这个名字看到副本已经不止一个。
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-page
  namespace: passes
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Пропуск</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 40rem;
               color: #222; }
        h1 { font-weight: 600; }
        .v { display: inline-block; padding: .2rem .6rem; border-radius: .3rem;
             background: #eef; font-family: ui-monospace, monospace; }
        .pod { margin-top: 2rem; color: #666; font-size: .9rem; }
        b { font-family: ui-monospace, monospace; color: #222; }
      </style>
    </head>
    <body>
      <h1>Сервис «Пропуск»</h1>
      <p>Заказ пропуска для гостя. Версия <span class="v">v1</span></p>
      <p>Развёрнуто из Git. Руками сюда никто не ходил.</p>
      <div class="pod">вас обслужил под <b>__POD__</b></div>
    </body>
    </html>
---
# --- 4 之 3。应用本身的描述 ----------------------------------------------------
# Deployment 不是「运行一个容器」，而是「保持运行着这么多份这样的
# 容器副本」。区别在副本死掉时显现：集群会创建一个新的，既不
# 询问也不通知。在 vSphere 里最接近的是 HA，但那里重启的是机器，
# 而这里重建的是应用的副本，而且这是持续在做的，不只是在故障时。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes
  namespace: passes
  labels:
    app: passes
spec:
  # 要保持运行多少份副本。措辞很重要：不是「运行一个」，而是
  # 「保持一个」。这个数字你将通过 Git 修改，然后看会发生什么。
  replicas: 1
  # Deployment 靠什么标志识别自己的副本。这不是 pod 名字的列表——
  # 名字每次重建都会变——而是条件「所有带标签 app: passes 的 pod」。
  # 下面 template.metadata.labels 里的标签必须与这个条件一致：一旦不一致
  # ——集群会拒绝接受清单，因为那些副本会变成没有归属。
  selector:
    matchLabels:
      app: passes
  # template——用来批量印制副本的样板。里面的一切都描述一个
  # pod。修改样板意味着推出新版本：旧副本被新副本替换。
  template:
    metadata:
      labels:
        app: passes
    spec:
      # 整个 pod 层面的安全限制。在 vSphere 里没有对应物：那里
      # 隔离由虚拟机监控程序提供，而容器与节点共享内核，所以权限
      # 必须显式地削减。
      #   runAsNonRoot   如果镜像想以 root 运行，就不启动
      #   runAsUser      以哪个数字用户运行；65532——是极简镜像中
      #                  公认的「非特权」标识符
      #   seccompProfile 允许哪些系统调用；RuntimeDefault——一套
      #                  切掉明显危险、又不破坏任何东西的集合
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # 同样的限制，但现在是针对具体的容器。
          #   allowPrivilegeEscalation: false  进程无法给自己攫取更多权限
          #   capabilities.drop: ["ALL"]       收回所有特殊的内核权限
          #                                    （改动网络、挂载、改动时间）；
          #                                    web 服务器一个都不需要
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 镜像取自公共仓库——在下一个实验里信息安全会禁止这样做，
          # 地址会换成自己的 Harbor。选 unprivileged 变体不是为了好看：
          # 普通的 nginx 镜像监听 80 端口，为此需要 root 权限，而在上面的
          # runAsNonRoot 之下它根本就起不来。
          # 版本被固定了（1.27-alpine），而不是 latest：否则同一个
          # 清单明天就会部署出另一个应用，而你对此毫不知情。
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # 应用监听的端口。名字 `http` 不是装饰：下面的就绪检查
          # 和文件末尾的 Service 都引用它。你改端口号时，只需在一个
          # 地方改，而不是三个。
          ports:
            - containerPort: 8080
              name: http
          # requests——保证预留多少资源；调度器按这个数字挑选节点。
          # limits——上限，超过就不放行。
          # 把 requests 压低意味着节点上会塞进比它承受能力更多的东西；
          # 超过内存 limits——容器被杀，超过 CPU——被限速。
          # 20m = 千分之二十核，Mi = 兆字节。这里的数值很小，
          # 因为实验里只有一个节点，而且它不大。
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # 就绪检查：集群敲这个地址，在收到应答之前不会把流量发到
          # 某个副本上。没有它，Service 就会把请求发给还没起来的
          # nginx，而用户在每次推出时都会看到错误。
          # Flux 也在等它——在 kustomization.yaml 里我们要求了 wait: true。
          #   initialDelaySeconds  在第一次敲之前等待，给进程启动的时间
          #   periodSeconds        往后每隔多久敲一次
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # 把文件开头那两个 ConfigMap 的内容放到容器内部的哪里。
          # /etc/nginx/conf.d——nginx 启动时读取设置的目录，
          # /usr/share/nginx/html——它对外提供文件的目录。
          # 镜像本身不变：文件在启动的那一刻才出现在里面。
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: page
              mountPath: /usr/share/nginx/html
      # 具体挂载什么。名字 conf 和 page 是内部的，它们把这个
      # 块与上面的 volumeMounts 联系起来；configMap 里的 name 才是集群中
      # 真实对象的名字。写错它——pod 就会挂着等待一个不存在的 ConfigMap。
      volumes:
        - name: conf
          configMap:
            name: passes-conf
        - name: page
          configMap:
            name: passes-page
---
# --- 4 之 4。所有副本背后那个恒定的名字 ----------------------------------------
# pod 会被重建，它们的地址每次都是新的。Service 给出一个不变的名字——
# passes.passes.svc.cluster.local——在集群内部凭它总能触达活着的
# 副本。这是内部的负载均衡，从集群外部目前还进不来这里。
apiVersion: v1
kind: Service
metadata:
  name: passes
  namespace: passes
spec:
  # Service 与 pod 的联系不是地址列表，而是条件「所有带标签 app: passes 的 pod」。
  # 出现了带这种标签的新副本——它自己就进入了负载均衡，什么都
  # 不需要注册。消失了——它就被从分发中移除。
  selector:
    app: passes
  # port——Service 自己在哪个端口应答，targetPort——它转发到容器
  # 内部的哪里。这里 targetPort 引用的是上面 ports 块里的名字 `http`，
  # 而不是号码：号码可以在一个地方改，联系不会断。
  ports:
    - port: 80
      targetPort: http
