---
# 实验 5 · Git 中的基础设施。任务：究竟要把仓库里的什么应用到集群。
#
# 与相邻的 gitrepository.yaml 一起应用到你的 `lab` 集群：
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# 每个对象中：apiVersion — 描述模式的版本，kind — 我们创建的是什么，
# metadata.name — 对象的名称。下面不再单独说明这些。
#
# 职责划分：GitRepository 下载仓库但不应用任何东西，
# 这个对象取用已下载的内容并使集群与之保持一致。名称 Kustomization 与
# kustomize 工具的名称相同，但它们是不同的东西 — 这里它是集群中的一个对象。
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passes
  # 与 Flux 服务位于同一处 — 否则 kustomize-controller 不会拾取它。
  namespace: flux-system
spec:
  # 多久将集群的实际状态与 Git 中描述的状态协调一次。
  # 这不是「每分钟重新应用一次」 — 而是「每分钟比较一次并
  # 修正差异」。即使 Git 里什么都没变，通过 kubectl edit
  # 手工做出的改动也会被悄无声息地回滚。你会在实验稍后
  # 亲自绕过 Git 在集群中改动某些东西时看到这个差异。
  interval: 1m
  # 仓库内的文件夹。其中的一切都会进入集群；与它相邻的文件 —
  # 例如根目录下的 README.md — 不会被触及。名称 `apps` 是我们选的，但它
  # 必须与你在自己仓库中放置清单的文件夹相匹配。
  path: ./apps
  # 从集群中删除那些已从 Git 消失的对象。
  # 没有这个，Git 就不再是完整的描述：从仓库中删除的东西
  # 会继续在集群里运行，而没有人会知道这件事。
  prune: true
  # 看向哪个源。名称 `passes` 是 gitrepository.yaml 中的 metadata.name，
  # 而不是 GitHub 上的仓库名。在那里重命名了 — 这里也要改，否则 Flux
  # 会等待一个不存在的源，Kustomization 也不会变为就绪。
  sourceRef:
    kind: GitRepository
    name: passes
  # 等待已应用的资源变为就绪，而不是在 apply 之后立即回报。
  # 这个差别恰如「申请已提交」和「申请已完成」之间的差别：没有 wait，
  # 即使随后 Pod 起不来，Flux 也会回报成功。
  wait: true
  # 在判定应用失败之前，等待这个就绪状态多久。
  # 三分钟 — 为在空节点上拉取镜像留有余量。值太小
  # 会在慢速网络上产生误报失败，值太大 — 你会
  # 长时间盯着「进行中」而不是一个清晰的错误。
  timeout: 3m
