---
# 实验 5 · Git 中的基础设施。源：Flux 从哪里获取期望状态。
#
# 与相邻的 kustomization.yaml 一起应用到你的 `lab` 集群上：
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# 注意：在应用之前，请把 url 替换为你自己仓库的地址：字符串
# ЗАМЕНИТЕ-МЕНЯ 是占位符，保留它的话 Flux 会访问一个不存在的地址并因错误而卡住。
# 也要检查分支：GitHub 会用 main 分支创建新仓库。
#
# 每个对象中：apiVersion — 描述模式的版本，kind — 我们创建的是什么，
# metadata.name — 后续引用该对象所用的名字。下面不再重复。
#
# 这个对象唯一的任务，是在集群中保存一份仓库的最新副本。
# 它不应用任何东西：只做下载。真正应用的是相邻的 Kustomization，
# 它通过名字 `passes` 引用这里，所以不能单独更改这个名字。
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: passes
  # flux-system — flux install 命令创建的命名空间；Flux 的服务本身就住在其中。
  # 配置对象也放到那里，否则这些服务看不到它们。
  namespace: flux-system
spec:
  # 多久去 Git 取一次新状态。一分钟 — 用于实验；
  # 生产中通常是 1–5 分钟，而即时反应则用来自 GitHub 的 webhook 实现。
  interval: 1m
  # 仓库地址。它是公开的，所以这里既没有登录名也没有密钥 —
  # 这是教学环境的简化。生产中仓库是私有的，旁边会出现
  # 一个指向带 deploy 密钥的 secret 的引用（secretRef 字段）。
  url: https://github.com/ЗАМЕНИТЕ-МЕНЯ/passes-gitops
  # 把哪个分支当作真相之源。合并进 main 的内容会进入集群；
  # 待在其他分支里的内容不会进入。评审正是由此而来：一处改动
  # 先住在自己的分支里，可以在那里查看它，只有合并进 main
  # 才会让它生效。如果仓库是用旧的 master 分支创建的 —
  # 请在这里修正，否则 Flux 找不到要读取的内容。
  ref:
    branch: main
