---
# 实验 13。Cozystack 目录的应用定义 —— 也就是那个「目录条目」。
#
# 这个对象本身不部署任何东西。它把三样东西绑在一起：你的 chart
# （部署什么）、API 中的一个新对象类型（如何下单该应用），以及仪表盘
# 中的一张卡片（下单时用户看到什么）。在它存在之前，chart 只是一个
# 平台一无所知的文件夹，而在 Postgres 和 Redis 旁边的应用列表里空空如也。
#
# 用一条命令应用，无需 namespace：
#   kubectl apply -f applicationdefinition.yaml
#
# 重要：这个对象是 CLUSTER-SCOPED（集群级）—— 它没有 namespace，整个集群
# 只有一个。租户无法应用它，这一点已验证：
#   kubectl auth can-i create applicationdefinitions   ->   no
# 你的工作在文件写好并在本地校验完成后就结束了。
# 由平台管理员来应用它。参见 README 中「你的权限到哪里为止」
# 一节。
apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: guest-pass
spec:
  # --- 这在 API 中长什么样 ----------------------------------------------
  application:
    # 新对象类型的 Kind。应用之后，集群中会出现一个 kind: GuestPass，
    # 你就可以用普通的 kubectl 操作它。
    kind: GuestPass
    plural: guestpasses
    singular: guestpass
    # 值的 schema —— 与 chart 中 values.schema.json 文件里的那份相同，
    # 只是写成了一行。API 用它来拒绝无效的值，
    # 而仪表盘用它来渲染创建表单。
    openAPISchema: |-
      {"title":"Chart Values","type":"object","properties":{"replicas":{"description":"Number of application replicas.","type":"integer","default":2},"greeting":{"description":"Text shown on the main page.","type":"string","default":"Order a pass for your guest"},"external":{"description":"Enable external access from outside the cluster.","type":"boolean","default":false},"resources":{"description":"Explicit CPU and memory configuration.","type":"object","default":{},"properties":{"cpu":{"description":"CPU available to each replica.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true},"memory":{"description":"Memory (RAM) available to each replica.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true}}}}}

  # --- 部署什么 ----------------------------------------------
  release:
    # 释放名 = prefix + 对象名。一个名为 `main` 的 GuestPass 对象
    # 会部署为名为 `guest-pass-main` 的 release。prefix 是必填的，其存在是
    # 为了让不同应用的 release 不会因为重名而冲突。
    prefix: guest-pass-
    labels:
      # Cozystack 用同一个 key 把租户的 release 分布到各个 Flux 分片上。
      # 没有它，就没有谁来服务这个 release。
      sharding.fluxcd.io/key: tenants
    chartRef:
      # 从哪里获取 chart。允许的 kind：OCIRepository、HelmChart、
      # ExternalArtifact。外部目录通常经由
      # GitRepository -> HelmChart 引入，它们的 namespace 是 cozy-public。
      kind: HelmChart
      name: cozystack-guest-pass
      namespace: cozy-public

  # --- 这在仪表盘中长什么样 ------------------------------------------
  dashboard:
    # 目录分区。使用的有：PaaS、IaaS、NaaS、Administration、
    # Networking —— 取一个已有的，而不要自己发明，
    # 否则应用会落到一个只有一项的分区里。
    category: PaaS
    singular: Guest Pass
    plural: Guest Passes
    description: Internal guest pass service for employees and reception
    tags:
      - internal
      - web
    # 图标 —— base64 编码的 SVG。就是要 base64，不是路径也不是 URL：仪表盘
    # 不会去任何地方下载任何东西。源文件就在旁边的 icon.svg 里。
    icon: 
    # 对象的 YAML 表示中的字段顺序。这是外观上的小事，但没有它，
    # 字段会杂乱地排列，表单读起来更差。
    keysOrder: [["apiVersion"], ["kind"], ["metadata"], ["metadata", "name"], ["spec", "replicas"], ["spec", "greeting"], ["spec", "external"], ["spec", "resources"]]
