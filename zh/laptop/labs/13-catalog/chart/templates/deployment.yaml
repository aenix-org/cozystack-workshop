# 实验 13。Deployment 模板：运行什么以及运行多少个副本。
#
# templates/ 中的文件是草稿，而非成品清单。Helm 将取值代入其中，
# 再把结果交给集群：`helm template main chart` 会显示成品文本而不实际应用，
# `helm install main chart` 则会应用它。
#
# 双花括号是替换点。在其中你会遇到：
#   .Values.名称  — 参数的取值：若客户未改动则来自 values.yaml，
#                   若在仪表盘的订单表单中选了自己的值，则来自那里；
#   .Release.Name — 发布名称，也就是某次具体部署该 chart 的名字。
# 花括号之外的文本原样进入清单。
apiVersion: apps/v1
kind: Deployment
metadata:
  # 对象名称由发布名称拼装而成，而非写死。同一个 chart 会不止一次地
  # 部署到同一个 namespace，固定名称就意味着第二个订单会覆盖第一个。
  # 发布 `main` 会得到名为 `main` 的 Deployment、Service 和 ConfigMap
  # — 从名字一眼就能看出它们是一组。
  name: {{ .Release.Name }}
  # 标签：name 对该应用的所有订单都相同，instance 区分各个订单。
  # 对象靠它们互相找到彼此，`kubectl get` 的输出也靠它们筛选。
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # 要保持运行的副本数量。如果某个副本消失，集群会不加询问地创建一个新的，
  # — 这就是无需值守管理员的自愈能力。
  replicas: {{ .Values.replicas }}
  # selector 告诉 Deployment 该把哪些 pod 视为自己的 — 靠标签，而不是靠名字。
  # 这里的标签和 template.metadata.labels 里的标签必须一致。一旦不一致，
  # Deployment 就找不到自己的副本，于是一遍又一遍地把它们造出来。
  selector:
    matchLabels:
      app.kubernetes.io/name: guest-pass
      app.kubernetes.io/instance: {{ .Release.Name }}
  # template 是 pod 的蓝图。下面的一切描述的不是 Deployment 本身，而是
  # 它按此蓝图创建的应用副本。
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guest-pass
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # pod 注解中的配置哈希。没有它，编辑 ConfigMap 不会重启
        # pod，新文本就不会出现，直到有人手动把它们删掉。
        # 这是对 chart 最常见的抱怨。
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # 应用不以 root 运行，且权限被削减。目录里的 chart 会被
      # 别的租户部署到他们自己的 namespace，容器的权限是你连同应用
      # 一起向他们承诺的一部分。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 镜像写在模板里，故意不作为参数暴露：客户选择
          # 尺寸和文本，但不能把应用本身换成任意的东西。
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # 没有这个变量，nginx 会按节点每个核心启动一个工作进程。
          # 在有几十个核心的节点上就会有几十个进程，一个内存限额只有
          # 一百兆的 pod 会在第一个请求之前就以 OOMKilled 死掉。chart 会流转
          # 到别的租户，那里的节点可能是任何配置，所以这里这是必须的。
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # 容器内部的端口。名字 http 在后面的探针和 Service 中都会用到，
          # 好让端口号只写在一处，而不是三处。
          ports:
            - containerPort: 8080
              name: http
          # requests — 保证分配多少，调度器按这些数字挑选节点。
          # 这里的 limits 只针对内存：超了容器就被杀掉并重新
          # 拉起。故意不设 CPU 限额，否则应用会撞上
          # 天花板，而不是仅仅跑得慢一些。
          # `| quote` 过滤器把代入的值用引号括起来：用户
          # 可能输入 1，若不加引号，本该是 "1" 或 "100m" 这样字符串的
          # 地方就会进去一个数字。
          resources:
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
            limits:
              memory: {{ .Values.resources.memory | quote }}
          # readinessProbe — 提出“准备好接收请求了吗？”这个问题。在 /healthz 应答之前，
          # Service 不会把流量发给这个副本。由此实现不中断的更新：旧
          # 副本要在新副本应答之后才被移出负载均衡。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          # 页面和 nginx 配置作为文件从 ConfigMap 挂载进来。subPath 只代入
          # 恰好一个文件：没有它，挂载的目录就会替换掉整个 /etc/nginx/
          # conf.d，镜像自带的设置也会随之消失。
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      # ConfigMap 的名字由发布名称拼装而成，所以 pod 始终挂载自己那个
      # 订单的配置，而不是邻居的。
      volumes:
        - name: page
          configMap:
            name: {{ .Release.Name }}
        - name: conf
          configMap:
            name: {{ .Release.Name }}
