# 实验 13. Service 模板：为应用提供稳定的地址。
#
# 应用的副本来来去去，它们的地址每次都是新的。Service 提供一个不会变化的名字，
# 并把请求分发到存活的副本上。从相邻的 Pod 中，通过发布名称即可访问该应用。
#
# 关于双大括号中的替换，以及对象名称从何而来，
# 已在 templates/deployment.yaml 中说明——这里的原理完全相同。
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # values 中的一个开关决定应用是否获得集群外部的地址。
  # Cozystack 的内置应用也是这样工作的：external 字段。
  # if/else 结构在渲染时从两个值中选择其一——最终生成的清单里
  # 要么是 LoadBalancer，要么是 ClusterIP，其中不再保留任何分支。
  type: {{ if .Values.external }}LoadBalancer{{ else }}ClusterIP{{ end }}
  # 把流量发给谁。Service 按标签而不是按名字来筛选 Pod，所以
  # 它不关心有多少副本、它们叫什么名字。这些标签与 Deployment
  # 给自己的副本打上的标签相同。
  selector:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
  # port——Service 自身监听的端口，targetPort——它向 Pod 内部敲的端口。
  # targetPort 用名字来写：名为 http 的端口在 Deployment 模板中声明。
  # 那里的端口号变了，这里也不需要改动。
  ports:
    - name: http
      port: 80
      targetPort: http
