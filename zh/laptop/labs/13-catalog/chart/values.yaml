# 实验 13。“通行证”chart 的默认值。
#
# 这些是 chart 在部署时所提问题的答案：需要多少个副本、页面上放什么
# 文本、是否需要外部地址。此处记录它们是为了应对“什么都没选”的情况。
# 下单该应用的人会覆盖它们：在仪表盘中通过表单字段，在终端中通过
# `--set replicas=5` 标志或自己的文件 `helm install ... -f my.yaml`。
# 编辑此文件会改变未来订单的默认值，而不是已部署订单的默认值。
#
# 此处的值如何变成仪表盘中的订单表单：
#   类型       — 显示哪种字段：{int} 数字，{bool} 开关，
#                {string} 文本输入框，{struct} 嵌套字段组；
#   描述       — 字段标签及其下方的提示；
#   =值        — 打开表单时字段中已有的内容；
#   必填性     — 由 schema 中的 required 列表设定。这里没有：每个
#                参数都有默认值，因此任何字段都可以跳过。
# 这就是为什么描述用英文书写：读它们的不只是 chart 作者，还有任何
# 在仪表盘中下单该应用的人。

## 形如 `## @param` 的注释不是装饰。Cozystack 生成器
## （cozyvalues-gen）用它们来生成 values.schema.json 和 README 中的参数表。
## 格式：## @param {类型} 名称=默认值 - 描述。

# 保持运行的应用副本数量。一个副本意味着节点重启期间会有停机；
# 两个副本可以在任一副本丢失时继续存活。
## @param {int} replicas=2 - Number of application replicas.
replicas: 2

# 主页上的文本。之所以做成参数，是因为每家子公司都有自己的文本，
# 没有人会仅仅为此单独构建一个镜像。
## @param {string} greeting=Order a pass for your guest - Text shown on the main page.
greeting: "Order a pass for your guest"

# 应用是否需要集群外部的地址。Cozystack 目录约定：
# 名为 external 的字段对所有应用都表示同一含义——外部访问。
## @param {bool} external=false - Enable external access from outside the cluster.
external: false

# 单个副本的大小。之所以做成单独的一组字段，是为了在订单表单中它
# 看起来像一个“资源”块，而不是两个不相关的字段。
## @typedef {struct} Resources - CPU and memory for each replica.
## @field {quantity} cpu - CPU available to each replica.
## @field {quantity} memory - Memory (RAM) available to each replica.

## @param {Resources} resources - Explicit CPU and memory configuration.
resources:
  cpu: 100m
  memory: 128Mi
