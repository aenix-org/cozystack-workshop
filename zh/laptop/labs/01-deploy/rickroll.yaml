# 实验 1。整个 rickroll 教学应用都在一个文件里：nginx 配置、页面、
# 部署本身，以及访问它的固定地址。四个对象，用 `---` 分隔。
#
# 应用在你的教学集群 `lab` 上，而不是在管理集群的租户里：
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll.yaml
# 这里没有 tenant-workshopXX 之类的占位符——不需要在任何地方替换成你的编号。
#
# 在所有四个对象中重复出现的字段，这里统一讲一次：
#   apiVersion — 这个对象类型所属的 API 组；
#   kind       — 对象类型本身；
#   metadata.name — 之后通过 `kubectl get` 查找对象时用的名字。
# 名字在其所属类型内部唯一，因此下面的 Deployment 和 Service 都叫
# rickroll，也不会冲突。
---
# nginx 配置。它在页面版本之间不变，所以单独放出来。
# ConfigMap — 一个配置文件，它自身独立存在于集群中，并在启动时被放进
# 容器内部。目的是在不重建镜像的情况下修改配置。`default.conf` 这个键
# 会成为卷挂载目录中的文件名。
#
# `|` 之后缩进的所有内容都不是 YAML，而是文件的逐字内容。这个块里带井号
# 的行会原样进入 nginx 配置，而不会在解析时消失。出于同样的原因，下面的
# 页面块里没有加注释：
# 那是 HTML，井号会显示在用户屏幕上。
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-conf
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      location / {
        # 本实验的精髓：nginx 把自己的 pod 名字直接替换进 HTML。
        # pod 内部的 $hostname 就是 pod 名字。
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
---
# 页面，版本 1。作为独立于配置的对象——这样在实验 4 中就能把应用
# 切换到第二个版本，而不用改动 nginx 配置或重建镜像。
# 名字里的 -v1 后缀不是装饰：rickroll-page-v2 会出现在它旁边，而在两者之间
# 切换卷，正是新版本发布的过程。
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v1
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Never Gonna Give You Up</title>
    <style>
      body{background:#0d0d12;color:#e8e8ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#ff0057,#ffb800,#00e0ff,#ff0057);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#9aa0b5;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#6f7690}
      .pod b{display:block;margin-top:.4em;color:#00e0ff;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#4d5366;font-size:14px}
    </style>
    <h1>Never Gonna Give You Up</h1>
    <p class="lyr">Never gonna let you down &middot; Never gonna run around and desert you</p>
    <div class="pod">вас обслужил под<b>__POD__</b></div>
    <p class="hint">Обновите страницу. Когда реплик станет больше — имя начнёт меняться.</p>
    </html>
---
# 应用本身。Deployment 描述期望状态——运行哪个镜像、
# 保持多少副本、更新时如何替换它们。之后集群会自己让
# 现实与这份描述保持一致，并持续监视它，而不是在创建时只做一次。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rickroll
  labels:
    app: rickroll
spec:
  # 保持多少副本运行。措辞恰恰是这样：不是「启动一个」，
  # 而是「保持一个」。副本消失了，集群会不加询问地创建一个新的。在实验 3 中
  # 自动扩缩容会开始改动这同一个字段，所以之后不再用手去动它。
  replicas: 1
  # Deployment 依据哪个标签认定 pod 归自己所有。这里的标签和下面 template 中
  # 的标签必须一致：不一致对象根本不会被创建。
  selector:
    matchLabels:
      app: rickroll
  # pod 模板——每个副本都从它冲压而出。改动 template 内部的任何字段
  # 都意味着应用的一个新修订版，并逐个替换副本（这正是实验 4）。
  # 改动 template 之外的字段（例如 replicas）不会产生修订版。
  template:
    metadata:
      labels:
        # 同样的标签也挂在 pod 本身上：文件末尾的 Service 依据它来找到它们。
        app: rickroll
    spec:
      # 整个 pod 层面上 `restricted` 安全配置的要求：不以 root
      # 运行、指定的 UID，以及标准的 seccomp 配置。在启用了 `restricted`
      # 的企业集群里，缺少这些字段的 pod 不会被允许运行，
      # 而且拒绝发生在 pod 创建时，而不是在 apply 清单时。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # 同样的严格，但在容器层面：内部的进程被禁止
          # 提升自己的权限，且它的所有 linux capabilities 都被拿掉了。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 非特权变体：监听 8080 且不以 root 运行。
          # 光是这一点就足以满足 `baseline` 配置，但不够 `restricted`——后者需要
          # 在 pod 和容器上都有显式的 securityContext，已在上面设置。在
          # 企业集群里通常启用的正是 `restricted`。
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # nginx 默认会按节点每个核心起一个工作进程。在只有一个核心的教学
          # 机器上那是一个进程，但在有 64 核的生产节点上就是 64 个，
          # 于是内存 limit 很小的 pod 会在第一个请求之前就以 OOMKilled 死掉。
          # 自动调优按 CPU limit 计算 worker 数：在 300m 时是一个进程。
          # 通过环境变量，而不是通过 -g：该指令已经在镜像的基础
          # 配置里，第二次声明会让 nginx 以「duplicate」错误崩溃。
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # 给端口起了名字，而不只是号码：下面的 readinessProbe 和 Service 的
          # targetPort 都引用 `http`。号码变了，只需在一处修改。
          ports:
            - containerPort: 8080
              name: http
          # 两件经常被混淆的不同东西。requests — 保证预留多少资源；
          # 调度器依据它来选节点，实验 3 中的自动扩缩容也依据它
          # 按百分比计算负载。
          # limits — 不允许超过的上限：CPU 上撞到墙时会被限速，
          # 内存上则会杀掉容器。
          resources:
            # 故意极小：工作坊上会有很多这样的应用。
            # 20m 是百分之二个核心。这个值故意压低：requests 越小，
            # 负载越快越过阈值，实验 3 中副本增长就能在几秒内
            # 看到，而不是半小时。
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          # 就绪检查。在这个地址收到响应之前，集群不会
          # 把流量路由到该副本。为了它，nginx 配置里专门设了一个
          # location /healthz，返回「ok」。正是这个字段换来了实验 4 中
          # 的零停机发布：只有在新副本响应之后，才关闭旧副本。
          # 去掉它——更新就会开始丢请求。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            # 第一次探测前的两秒——凭经验得出。更少没有
            # 意义，nginx 启动就要这么久；更多则会白白拉长每次发布。
            initialDelaySeconds: 2
          # 把 ConfigMap 的内容放到容器内部的什么位置。目录不是
          # 随意选的：第一个 nginx 从里面提供文件，第二个从里面读配置。
          # 没有这两行，两个 ConfigMap 就只会躺在集群里，
          # 而 nginx 会显示它的默认页面。
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
      # 给 pod 挂载哪些 ConfigMap。这里的卷名把它和上面 volumeMounts 中的
      # 条目关联起来——必须一致的正是名字，顺序对这个关联不起作用。
      # 但对实验 4 起作用，见下面的警告。
      volumes:
        # 注意：这个卷必须是第一个（volumes[0]）。
        # 实验 4 通过按索引打补丁来切换页面版本。
        # JSON Patch 用号码而不是名字来定位列表元素。把这两个卷
        # 调换位置——补丁就会悄悄地把 nginx 配置替换掉而不是页面，应用
        # 会坏掉，而错误信息说的却完全是另一回事。
        - name: page
          configMap:
            name: rickroll-page-v1
        - name: conf
          configMap:
            name: rickroll-conf
---
# 应用的固定地址。副本会诞生也会消亡，它们的地址会变，但名字
# `rickroll` 在集群内部保持不变——邻居们正是用它来调用这个应用。
# 这个名字背后的活副本清单由集群自己依据标签维护。
apiVersion: v1
kind: Service
metadata:
  name: rickroll
spec:
  # 把谁放到这个地址后面：所有带这种标签的 pod，无论是谁
  # 创建的。由此产生一个典型的麻烦——一个带 app: rickroll 标签的外来 pod
  # 会悄悄进入负载均衡，开始应答你的用户。这个文件夹里的 check.sh
  # 脚本会单独检查没有这样的冒名者。
  selector:
    app: rickroll
  ports:
    # port — 服务本身在哪个端口应答，targetPort — 它往 pod 内部
    # 的哪里敲。这里 targetPort 用容器里端口的名字来指定，而不是数字：容器里
    # 号码变了——这个文件也不用改。
    - port: 80
      targetPort: http
