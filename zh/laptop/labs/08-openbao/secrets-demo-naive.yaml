# 实验 8 · 3 步中的第 1 步：密码以明文形式写在清单里。
# 这就是「Propusk」服务现在的样子——也正是审计发现的那个文件。
# 我们只会应用它一次，为的是亲眼看到这个问题。
#
# 本实验的三个步骤，免得你迷失方向：
#   secrets-demo-naive.yaml   <- 你在这里：任何打开文件的人都能看到密码
#   secrets-demo-secret.yaml     密码被移到了单独的 Secret 对象中
#   secrets-demo.yaml            密码根本不在清单里
#
# 应用位置：你的 `lab` 集群（export KUBECONFIG=~/lab.kubeconfig）。
# 命令：kubectl apply -f secrets-demo-naive.yaml
#
# 本文件中的密码是为教学而虚构的，这里没有任何真实密码。只有一个对象——
# Deployment；apiVersion、kind 和 metadata.name 后面不再注释。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # 一个副本就够了：我们关注的不是容错能力，而是
  # 应用从哪里取得密码。
  replicas: 1
  # Deployment 通过这个标签识别属于自己的 Pod。它与下面 template 中的标签一致。
  selector:
    matchLabels:
      app: secrets-demo
  # template——Pod 模板：从什么来组装一个副本。
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # 安全要求：不以 root 运行，受限的系统调用集合。
      # 注意这里的落差：Pod 按所有安全规则做了配置，而这丝毫
      # 不妨碍密码就躺在下面十行处的文件里。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 这里没有真正的应用——只有 busybox 和几行 shell。
          # 对本实验而言只有一件事重要：密码从哪里来，而不是之后
          # 对它做了什么。
          image: busybox:1.36
          env:
            # 数据库地址和用户名不是机密：知道数据库
            # 叫 passes-db，本身并不能授予访问权限。
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # 就是这一行被审计发现了。
            # 文件存在 Git 里，这意味着密码为每一个能访问
            # 该仓库的人所知，也为每一个曾经克隆过它的人所知。
            - name: DB_PASSWORD
              value: "Propusk2019!"
          # 无限循环：每十秒往日志里打印一行。进入日志的不是密码
          # 本身，而是它的 sha256 指纹——前十二个字符。从指纹可以
          # 看出密码变了，但无法据此还原出它的值。
          # 在真实的服务里，日志正是这样写的。
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          # 胃口很小：这是演示，不是真实负载。
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
