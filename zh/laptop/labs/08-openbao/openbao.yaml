# 实验 8 · 订购 OpenBao 密钥存储。
# 与你在仪表盘里用鼠标订购的东西完全一样——只是换成了文本形式。
# 应用的目标不是实验集群，而是管理集群上的一个租户：
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f openbao.yaml
#
# 应用之前：把 tenant-workshopXX 换成你自己的 namespace。XX 是占位符，
# 并非名称的一部分；你的编号已随密码一起发给你了。如果它进了别人的租户，
# 你会收到拒绝访问——而这已经是所有可能结果里最好的一个了。
#
# kind: OpenBAO 并不是 Kubernetes 内置对象，而是 Cozystack 新增的一种类型。
# 你描述自己需要什么，平台就会自行部署 pod、磁盘和服务，此后也由它自己保持更新。
# 这更接近于从目录里订购一项服务，而不是在别人交给你的虚拟机上安装软件。
apiVersion: apps.cozystack.io/v1alpha1
kind: OpenBAO
metadata:
  # 名称的影响不止于仪表盘里的那张卡片：存储的内部地址就是由它拼出来的——
  # openbao-secrets.<namespace>.svc.cozy.local。如果你改了名，
  # 就要在 secrets-demo.yaml 里以及 check.sh 用到的 BAO_APP 变量里同步修改地址。
  name: secrets
  namespace: tenant-workshopXX
spec:
  # 只有一份副本。生产环境用三份，从而获得 Raft 复制：一旦 replicas > 1，
  # chart 就会自行启用它。来回切换需要迁移数据，
  # 所以这个决定要在事前做出，而不是事后。
  replicas: 1
  # 存储数据用的磁盘。两个 GB 绰绰有余：密钥本身只占几个字节，
  # 空间主要花在版本历史和审计日志上。卷创建之后无法缩小，
  # 但通常可以扩大，所以在这里没必要抠门。
  size: 2Gi
  # replicated 存储类意味着数据会在不同节点上保存多个副本。
  # 某个节点故障不会把你所有的密码一并带走——而从备份中恢复
  # 一个密钥存储本身就是一件另外让人头疼的事。
  storageClass: replicated
  # 一套现成的“多少 CPU 和内存”配置。平台以列表形式提供它们，
  # 免得每个人都要手工计算 requests 和 limits。
  resourcesPreset: t1.small
  # Web 界面在集群内部启动。我们不把它对外暴露：
  # external: true 会挂上一个 LoadBalancer，而实验里我们并不需要它。
  ui: true
  external: false
