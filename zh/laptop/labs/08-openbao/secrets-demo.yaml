# 实验 8 · 第 3 步（共 3 步）：清单里没有密码——既没有明文，也没有 base64。
# 最终版本。这个文件可以放进 Git、拿给承包商看，甚至印在
# T 恤上。
#
# 这一步与第二步的区别：那里值毕竟还是被写下来了——先写进文件，
# 然后写进集群对象。这里描述中根本没有它；应用自己在启动时
# 从 OpenBao 存储中取回密码。
#
#   secrets-demo-naive.yaml      任何打开文件的人都能看到密码
#   secrets-demo-secret.yaml     密码被移到 Secret 对象里
#   secrets-demo.yaml         <- 你在这里：密码在启动时从存储中到达
#
# 应用前：把 tenant-workshopXX 替换成你自己的 namespace——它是下面存储
# 地址的一部分。XX 是占位符，不是名字的一部分。
# 应用位置：你的 `lab` 集群（export KUBECONFIG=~/lab.kubeconfig）。
# 命令：kubectl apply -f secrets-demo.yaml
#
# 应用向存储表明身份所用的令牌存放在 passes-bao-token 这个 secret 里。
# 你用命令创建它，而不是用文件：这份清单里只有对象的名字，
# 而名字不是秘密。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # 一切都以非 root 运行。之所以需要 fsGroup，是因为这里有两个容器：一个
      # 写入带密码的文件，另一个读取它。没有共享的组，init 容器
      # 写出的文件主容器将无法打开，于是你会花上半小时琢磨
      # 到底哪里出了错。
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # 一个地方，一个容器把密码放进去，另一个从中读取。
      # medium: Memory 意味着这块「磁盘」位于节点的内存中，
      # 永远不会落到真正的磁盘上：不会进备份，不会进卷转储，也不会到
      # 那个把磁盘从服务器里取走的人手上。Pod 没了——内容也就没了。
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      # init 容器在主容器之前运行，并且必须成功结束。
      # 如果它取不到密码，应用根本不会启动，而这正是正确的
      # 行为：没有数据库密码的服务本就不可用，与其起来后往日志里
      # 猛灌错误，不如干脆起不来来得诚实。
      initContainers:
        - name: fetch-secret
          # 我们直接用 OpenBao 自己的镜像，只为其中一个工具 `bao`——它的客户端。
          # 不需要自己写代码。
          image: openbao/openbao:2.5.1
          # bao kv get -field=password——按一个路径取一个字段，而不是整个
          # secret。tr -d '\n' 去掉换行符，否则它会跑进
          # 密码里面：末尾多一个字符数据库不会接受，而这种问题查起来很难受。
          # chmod 0400——只有属主能读该文件。
          # set -e 在第一个错误处就停止脚本：否则容器会以一个空文件
          # 成功结束，而你只能在应用里去排查。
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              bao kv get -field=password secret/passes/db \
                | tr -d '\n' > /secrets/db_password
              chmod 0400 /secrets/db_password
              echo "пароль получен из OpenBao, в манифесте его нет"
          # 存储的地址，以及应用用来证明自己有读取权限的令牌。
          # 令牌通过对某个用命令创建的对象的引用而来；它不会跑到这里的文件里。
          # 地址里的 tenant-workshopXX 就是那个必须替换掉的占位符。
          env:
            - name: BAO_ADDR
              value: http://openbao-secrets.tenant-workshopXX.svc.cozy.local:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: passes-bao-token
                  key: token
          # 共享文件夹。这个容器被赋予对它的写权限——它往里面写。
          volumeMounts:
            - name: secrets
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 限额比主容器更高：OpenBao 工具比 busybox 重，
          # 但它只活几秒钟，所以这不是长期的代价。
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      # 主容器只有在 init 容器结束之后才启动。
      containers:
        - name: app
          image: busybox:1.36
          # 与前几步相同的循环，但密码现在不在环境
          # 变量里，而在文件里：指纹直接从 /secrets/db_password 读取。
          # 环境变量在 kubectl describe pod 的输出中可见，并会进入进程
          # 转储；而 pod 内存中的文件不会。
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(sha256sum /secrets/db_password | cut -c1-12)"
                sleep 10
              done
          # 这里只剩下非机密的设置——地址和登录名。
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
          # 同一个文件夹，但只读：应用无法损坏或替换密码，
          # 哪怕它真的很想。
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
