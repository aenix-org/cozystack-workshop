# 实验 8 · 第 2 步(共 3 步):密码已从 Deployment 移出到单独的 Secret 对象中。
# “天真的修复”:应用描述中已看不到密码,开发者很满意,
# 审计员则不然。为什么——我们用一条命令就能看到。
#
# 这一步比第一步好在哪:值不再是应用描述的一部分,
# 现在通过名称引用它。它比第三步差在哪——值仍然
# 必须写在某个地方,而这里就直接写在了这个文件里。
#
#   secrets-demo-naive.yaml      任何打开文件的人都能看到密码
#   secrets-demo-secret.yaml  <- 你在这里:密码在 Secret 对象里
#   secrets-demo.yaml            清单里根本没有密码
#
# 适用范围:你的 `lab` 集群(export KUBECONFIG=~/lab.kubeconfig)。
# 命令:kubectl apply -f secrets-demo-secret.yaml
#
# 这个文件里的密码是教学用的、虚构的。文件包含两个对象,由一行
# `---` 分隔:Secret 和引用它的 Deployment。apiVersion、kind
# 和 metadata.name 在文件后面不再注释。
#
# Secret 是一种单独的对象类型,用于那些不该放在应用描述里的东西。
# 集群对待它比对待普通设置略微谨慎一些:值
# 不会在 kubectl describe 中显示,读取权限单独授予。
apiVersion: v1
kind: Secret
metadata:
  name: passes-db
# Opaque 表示“一组任意的键值对”。也有专门的类型——
# 用于访问镜像仓库、用于 TLS 证书——但这里不需要任何
# 特殊的东西。
type: Opaque
data:
  # 这不是加密。这是 base64——一种用可打印字符书写字节的方式。
  # 没有密钥,没有解密密码,任何人都能做逆变换。
  password: UHJvcHVzazIwMTkh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # 下面的 Deployment 和第一步里的是同一个。只有一个
  # 地方变了:DB_PASSWORD 是如何进入 pod 的。
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # 不以 root 运行,限定的系统调用集合。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 又是 busybox 和几行 shell:我们关注的是密码的路径,
          # 而不是应用的运行。
          image: busybox:1.36
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # 这就是和第一步的全部区别。valueFrom 代替 value 表示
            # “从那里取值”:secretKeyRef.name——哪个对象,key——它内部
            # 的哪个字段。替换发生在 pod 启动时,而在应用
            # 描述中只留下名称。
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: passes-db
                  key: password
          # 和第一步相同的循环:它打印的是密码的指纹,而不是密码
          # 本身。指纹恰好便于比较各步骤——如果它没有
          # 变化,就说明进入 pod 的值和之前一样。
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
