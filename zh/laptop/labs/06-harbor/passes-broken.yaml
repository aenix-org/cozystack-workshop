---
# 实验 6 · 你自己的私有镜像仓库。本文件是故意留成不完整的。
#
# 它无法工作，而这正是设计意图：你应当亲眼看到失败，并自己弄清楚集群缺了什么。这里缺的只有
# 一样东西——集群向一个封闭的仓库来取镜像时，用来称呼自己的那个东西。仓库不会把镜像随便交给
# 任何人，而这份清单里没有任何东西能帮助集群证明它有权取得镜像。到底是哪一行修好了它——你会
# 在实验过程中弄明白；可用的版本就在旁边，在 passes.yaml 里，在你自己想通之前打开它没有意义。
#
# 这里只有一个 Deployment，没有 Service：暂时还不需要给服务一个固定的名字——反正镜像下载不下来，
# 我们也到不了一个能应答的 pod。
#
# 在你的 `lab` 集群上、默认命名空间中应用：
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f passes-broken.yaml
#     kubectl get pods -l app=passes-api -w
#
# 注意：HARBOR-HOST 是占位符，不是可用的地址。请替换成你自己 Harbor 的地址，
# 否则你得到的会是另一种错误，而不是这个文件所要展示的那个（带占位符的有两行）：
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # macOS
#
# 下面这个对象里：apiVersion——描述模式的版本，kind——我们要创建什么，
# metadata.name——对象的名字。后面不再单独解释。
#
# Deployment 不是「运行一个容器」，而是「让这么多份这样的容器保持运行」。一份副本消失了——
# 集群会不声不响地再创建一份新的。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # 一份副本：要弄清失败，一份就够了，而且日志和 kubectl describe 的输出里噪音会更少。
  replicas: 1
  # 条件「我的副本是带有标签 app: passes-api 的 pod」。下面 pod 模板里的标签
  # 必须和这个一致，否则集群会拒绝该清单。
  selector:
    matchLabels:
      app: passes-api
  # 副本据以印制的模板。里面的一切都描述了一个 pod。
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # 对整个 pod 的安全限制：不以 root 运行，以非特权用户 10001 工作，
      # 把系统调用的集合限制到标准配置。镜像也是按同样的要求构建的（见 app/Dockerfile 里的 USER 行）。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # 容器层面的权限：不给自己增加特权，并放弃所有特殊的内核能力。
          # 应用只需要一个网络端口，其余的都是多余的。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 镜像名的第一部分就是仓库地址。正因如此，迁移到你自己的仓库会改变清单：
          # 镜像名变得不一样了。要是没有这个地址，集群就会去 Docker Hub 取镜像——
          # 也就是去安全团队禁止的地方。
          image: HARBOR-HOST/passes/passes-api:v1
          # 应用的端口。名字 `http` 在下面被就绪探针使用，
          # 这样端口号只在一个地方设置，而不是两个。
          ports:
            - containerPort: 8080
              name: http
          # 环境变量，应用从中得知自己是谁、从哪里来。它正是把这些打印在自己的应答里
          # （见 app/main.go 里的 identity 结构体）。APP_VERSION 和 IMAGE_REGISTRY 以文本设置——
          # 那些是我们自己写的；接下来三个由集群在副本启动时自行填入，应用无从得知它们。
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests——为一份副本预留什么：调度器按这些数字挑选节点。limits——上限：
          # 内存超过上限，容器会被杀掉；CPU 超过上限，会被限流。16Mi 就够，是因为应用是用 Go 写的、
          # 没有依赖。20m 是一个 CPU 核心的两万分之二十。
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # 就绪探针：在应用于 /healthz 应答之前，流量不会打到这份副本上。今天还到不了这一步——
          # 它检查的是一个已经运行起来的进程，而对我们来说，更早的一步、下载镜像，会卡住。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
