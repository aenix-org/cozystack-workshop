---
# 实验 6 · 你自己的私有镜像仓库。清单的可用版本。
#
# 这与 passes-broken.yaml 是同一个文件，只是多了那里缺少的一处——
# 下面用「这就是之前缺少的」字样标出。请在你已经
# 看到损坏版本的失败并弄清原因之后再应用它。
#
# 应用在你的 `lab` 集群上（不是在 Cozystack 管理集群上——那里
# 只运行 Harbor 本身），使用默认命名空间：
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl delete -f passes-broken.yaml
#     kubectl apply -f passes.yaml
#
# 注意：HARBOR-HOST 是占位符，不是可用地址。应用前请替换为
# 你自己 Harbor 的地址；字符串 HARBOR-HOST 在文件中出现两次，sed 会替换两处：
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # macOS
#
# 在下面的对象中：apiVersion 是描述 schema 的版本，kind 是我们要创建什么，
# metadata.name 是对象的名字。后面不再单独说明。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # 两个副本，而不是一个：这样在服务的响应里就能看到请求由
  # 不同的 pod 来处理，也能看到镜像下载到节点上一次、却启动了两次。
  replicas: 2
  # 条件「我的副本就是带有标签 app: passes-api 的 pod」。下面 pod 模板里的标签
  # 必须与这个一致，否则集群会拒绝该清单。
  selector:
    matchLabels:
      app: passes-api
  # 用来压印副本的模板。里面的一切描述的是一个 pod。
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # 对整个 pod 的安全约束：不以 root 运行，以
      # 非特权用户 10001 工作，把系统调用集合限制到
      # 标准 profile。镜像正是按此构建的（见 app/Dockerfile 里的 USER 行）。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # 这就是 passes-broken.yaml 里之前缺少的——就这两行，别无其他。
      #
      # 封闭的仓库不会把镜像发给任何人：首先你得表明身份。密钥 `harbor`
      #（类型为 kubernetes.io/dockerconfigjson）保存仓库地址、登录名和密码；你
      # 用 kubectl create secret docker-registry 命令创建了它。这里只是按名字
      # 引用该密钥——取用它的不是应用，而是节点上的 kubelet，在它
      # 去下载镜像的那一刻。因此密钥必须与 pod 处在同一个
      # 命名空间：kubelet 恰恰在那里查找它，别处都不找。
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # 容器级别的权限：不给自己攫取额外特权，并交出所有特殊的
          # 内核能力。应用只需要一个网络端口，其余都是多余的。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 镜像名的第一部分就是仓库地址，正因如此，迁移到你自己的
          # 仓库会改变清单：镜像名变得不同。开头若没有地址，
          # 集群就会去 Docker Hub 取镜像，而这正是安全策略所禁止的。
          image: HARBOR-HOST/passes/passes-api:v1
          # 应用端口。名字 `http` 下面被就绪探针和 Service 使用，
          # 所以端口号只在一处设定，而不是三处。
          ports:
            - containerPort: 8080
              name: http
          # 环境变量，应用从中得知自己是谁、从哪里来。
          # 它在响应里打印的正是这些（见 app/main.go 里的 identity 结构体）。
          # APP_VERSION 和 IMAGE_REGISTRY 以文本形式设定——由我们自己写入。
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # 接下来是 Downward API：集群自己把它所知道的关于 pod 的信息放进变量里。
            # 应用既不需要猜测自己的名字，也不需要为此去访问集群 API，
            # 更不需要随身携带做这种请求的权限。这些值在副本
            # 启动的那一刻被填入，所以每个副本各有各的。
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests——为一个副本预留什么：调度器按这些数字挑选节点。
          # limits——上限：内存超过上限，容器会被杀掉；CPU 超过上限，
          # 会被限速。16Mi 就够，是因为应用用 Go 编写、没有
          # 依赖，几乎不在内存里保留任何东西；换成 JVM 会需要多两个数量级。
          # 20m 是一个 CPU 核心的二十毫分。
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # 就绪探针：在应用于 /healthz 作出应答之前，Service 不会
          # 把流量发到这个副本上。在滚动发布新版本时，旧副本只有在
          # 新副本已经应答之后才会从负载均衡里移除——所以请求
          # 不会打到还没起来的进程上。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# 一个恒定的名字，背后站着两个副本。pod 会被重建、会更换地址，
# 而名字 passes-api.default.svc.cluster.local 不变。没有这个对象，应用
# 照样运行，但在集群内部无从触达它——而 check.sh 里的检查
# 恰恰是访问这里，而不是访问 pod。
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # 与 pod 的关联不是一份地址清单，而是一个基于标签的条件。带有标签
  # app: passes-api 的新副本会自己被纳入负载均衡，无需注册它。
  selector:
    app: passes-api
  # port——Service 自身在哪个端口应答；targetPort 引用上面 ports 块里的
  # 名字 `http`，而不是号码，所以号码变更时关联不会断开。
  ports:
    - port: 80
      targetPort: http
