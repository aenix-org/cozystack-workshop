---
# 实验 12。用于承载遗留员工通讯录的虚拟机：磁盘和机器本身，
# 两个对象在同一个文件里，用 `---` 行分隔。
#
# 这些是租户对象：它们不住在 `lab` 集群里，而是住在管理集群上你的
# namespace 中。你需要租户的 kubeconfig。
#
# 应用前，请把 tenant-workshopXX 替换成你自己的 namespace，否则订单会发到
# 别的租户，而不是你的。
#
#     export KUBECONFIG=~/.kube/workshop
#     kubectl apply -f staff-directory-vm.yaml
#
# 同样的事情也可以在租户仪表盘里用鼠标完成（创建应用 -> VM Disk，
# 然后 VM Instance）——结果完全一样。
#
# 注意：后面用来称呼这台机器的名字与 metadata.name 并不一致，这不是
# 实验里的笔误。平台用 `vm-instance` chart 来部署名为 X 的 VMInstance 对象，
# 而 chart 名会与 release 名拼接：运行中的实例
# 叫做 vm-instance-X。除此之外，目标要带上类型前缀，因为
# 租户权限是授予实例（virtualmachineinstances，即 vmi）的，而不是
# virtualmachines——裸名字会返回 forbidden。因此进入控制台的命令是：
#     virtctl console --namespace=tenant-workshopXX vmi/vm-instance-spravochnik
# 列出运行中的实例：kubectl get vmi -n tenant-workshopXX
# 而 `kubectl get vminstance spravochnik` 显示的不是实例，而是你对它的订单——
# 也就是下面描述的那个对象。
#
# 磁盘和机器是两个不同的对象，这不是官僚主义：磁盘比
# 机器活得更久。机器可以被删除再重新创建，然后接上同一块磁盘。
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  source:
    image:
      # 来自平台共享镜像集合的名字，不是 URL。
      # 创建磁盘时可以在仪表盘里看到这个列表。
      name: ubuntu-22.04
  # 磁盘大小。它不能小于源镜像：ubuntu-22.04 会展开
  # 到 20Gi，平台会拒绝往 10Gi 的磁盘里填充。磁盘之后可以扩容，
  # 但不能缩容，所以这里估小比估大代价更高。
  storage: 20Gi
  # 存储类。`replicated` —— 数据会以多份副本写到平台的不同
  # 节点上：带副本的节点可以宕机，机器会继续工作。本质上它是一面
  # 镜子，只不过是通过网络拼装起来的。相邻实验里的数据库用的也是同一个类。
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  # 1 个 CPU，4 GB。取自和 Kubernetes 节点尺寸同一份目录参考：
  # 这里的机器和节点是用同样的方式来度量的。
  instanceType: u1.medium
  # 客户机操作系统配置：给机器塞哪些驱动和设备。
  instanceProfile: ubuntu
  # Always 意味着「保持开机」：如果它自己关机了，会被再次开机。
  # Halted —— 关机，Manual —— 保持原样。
  runStrategy: Always
  # 给机器挂载哪些磁盘。引用是按上面那个 VMDisk 对象的名字来的——就是
  # 那个会比这台机器活得更久的磁盘。
  disks:
    - name: spravochnik
  # 注意：这里没有 replicas 字段，将来也不会有。
  # 虚拟机是单个对象。需要两台机器——就用两个
  # 名字不同的对象。这是与 Deployment 的一个根本区别，
  # 参见 README 中关于这个区别在哪里会硌手的那一节。
  # 客户机操作系统的初始配置。cloud-init 是 Linux 云镜像的标准机制：
  # 首次启动时机器会读取这段文本并把它应用到自身。按作用来说
  # 它相当于 vSphere 里的客户机定制——密码、文件、服务——只不过是靠描述，而不是
  # 向导。`|` 之后缩进的一切都会原样进入客户机，并在那里解析，
  # 而不是由 Kubernetes 解析。
  #
  # 这里 cloud-init 把通讯录变成一台服务器：它放置一个 HTML 页面并建立一个服务，
  # 通过 HTTP 在 8080 端口对外提供它。python3 已经在 ubuntu 镜像里了——这不需要
  # 联网。8080 端口不是随便选的：主持人已经预先在你的租户里创建了一个
  # Service `spravochnik-http`（80 -> 8080）和一个 Ingress `spravochnik`，一旦机器
  # 内部的服务起来，通讯录就会发布到租户域名上。
  cloudInit: |
    #cloud-config
    # 需要这个密码才能从仪表盘登录到控制台。在生产机器上
    # 不要这么做——那里要用 sshKeys。
    password: ubuntu
    chpasswd: { expire: false }
    ssh_pwauth: true
    write_files:
      - path: /opt/directory/index.html
        content: |
          <!doctype html><html lang="zh"><head><meta charset="utf-8"><title>通讯录</title></head><body><h1>员工通讯录</h1><ul><li>王军 — 101</li><li>潘平 — 102</li></ul></body></html>
      - path: /etc/systemd/system/directory.service
        content: |
          [Unit]
          Description=Staff directory
          After=network.target
          [Service]
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0 --directory /opt/directory
          Restart=always
          [Install]
          WantedBy=multi-user.target
    runcmd: [ "systemctl daemon-reload", "systemctl enable --now directory" ]
