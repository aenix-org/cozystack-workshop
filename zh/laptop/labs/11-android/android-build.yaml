---
# 实验 11。构建本身：ConfigMap 中的脚本，以及运行它的 Job。
# 一个文件里两个对象，用 `---` 行分隔。
#
# 应用到你的教学集群 `lab`，而不是管理集群上的租户：
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f android-build.yaml
# 这里没有 tenant-workshopXX 之类的占位符——你不需要在任何地方替换自己的编号。
#
# 在应用之前，集群中必须已经存在两个对象，否则构建 Pod 不会启动：
# 集群不会挂载不存在的东西，Pod 会一直等待。
#     configmap/propusk-src   源码：kubectl apply -f propusk-src.yaml
#     secret/bucket-creds     访问桶的四个密钥，手动录入
#
# 用 Job 而不是 Deployment：构建有终点。Deployment 会把已完成的进程
# 当作失败，重新拉起一个新副本——构建就会循环，永不停止。
#
# 为什么构建脚本作为一个单独的对象存在，而不是写在 Job 自己的 command 字段里的字符串：
#   - YAML 字段里六十行 shell 无法阅读也无法检查：在这里它是
#     一个普通文件，编辑器会做语法高亮，并且能通过 `bash -n`；
#   - 用一条命令就能看到它的全部：kubectl get configmap android-build-script -o yaml；
#   - 你可以在不动任务定义的情况下修改构建，反之亦然。
# 便利的代价：脚本与 Job 分开存在。修改 ConfigMap——一个
# 已经在运行的构建不会察觉；只有下一次运行才会看到新文本。
apiVersion: v1
kind: ConfigMap
metadata:
  name: android-build-script
data:
  # 五个构建步骤——正是你会在构建服务器上手动敲入的那些命令。
  # 容器启动时几乎是空的：Java 和 Gradle 来自镜像，其余的由脚本
  # 自己带来。
  #   1/5  下载 command-line tools——用来安装 Android SDK 本身的工具（1-2 分钟）
  #   2/5  接受许可并安装 SDK、平台 34 和 build-tools。最长的一步，
  #        5-15 分钟，而且这段时间日志一片寂静：sdkmanager 在非交互模式下
  #        不打印进度。这里的寂静不是卡死
  #   3/5  gradle :app:assembleDebug——把 /src 中的源码编译成 APK（3-8 分钟）
  #   4/5  安装 mc，对象存储的控制台客户端
  #   5/5  用两个名字把 APK 放进桶里：一个带日期的和 propusk-latest（几秒）
  #
  # 每次构建都同样耗时：没有缓存，/work 磁盘是一次性的（见文件末尾的
  # emptyDir）。在真正的构建服务器上会用持久卷代替它，第二次
  # 构建会在几分钟内完成。
  #
  # 下面是 build.sh 文件的逐字内容，不是 YAML。其中带井号的行
  # 会原样进入脚本：它们是 shell 注释，不需要删掉。
  build.sh: |
    #!/usr/bin/env bash
    # 这里 set -e 是合适的：这不是检查，而是构建。如果某一步失败了——
    # 继续下去没有意义，Job 应当以错误结束，并连同日志一起
    # 留在集群里。
    set -euo pipefail

    WORK=/work
    export HOME="$WORK"
    export ANDROID_SDK_ROOT="$WORK/android-sdk"
    export ANDROID_HOME="$ANDROID_SDK_ROOT"
    export GRADLE_USER_HOME="$WORK/gradle-home"
    # 在一次性容器里不需要 Gradle 守护进程：它是为下一次
    # 构建而存在的，而这个容器里不会有下一次构建。
    # -Duser.home 是必需的，而且它不是上面 export HOME 的重复。Java 获取家
    # 目录不是从环境变量，而是从系统用户记录，而
    # 非特权 uid 没有这条记录——Gradle 会填入 "?" 并在打包
    # APK 时失败：它会在形如 /work/project/app/?/.android/ 的路径下寻找签名密钥。
    export GRADLE_OPTS="-Xmx3g -Dorg.gradle.daemon=false -Duser.home=$WORK"

    CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
    MC_URL="https://dl.min.io/client/mc/release/linux-amd64/mc"

    echo "== 1/5 ставлю Android command-line tools =="
    mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    cd "$ANDROID_SDK_ROOT/cmdline-tools"
    curl -fsSL -o tools.zip "$CMDLINE_TOOLS_URL"
    # 不是每个基础镜像里都有 unzip，但 JDK 里的 jar 能解压 zip。
    unzip -q tools.zip 2>/dev/null || jar xf tools.zip
    rm -f tools.zip
    mv cmdline-tools latest
    export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

    echo "== 2/5 принимаю лицензии и качаю SDK (самый долгий шаг) =="
    # 当 sdkmanager 关闭其输入时，`yes` 会收到 SIGPIPE，并返回
    # 非零码。在 set -o pipefail 下，这会无缘无故地使构建失败，
    # 所以这里故意抑制了返回码。如果许可确实
    # 没被接受——下一条命令会说出来。
    yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
    sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
      "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    echo "== 3/5 собираю APK =="
    # ConfigMap 以只读方式挂载，而 Gradle 会在源码旁边写入，
    # 所以先把整棵树复制到磁盘。
    # -L 会解引用符号链接：ConfigMap 挂载的不是文件，
    # 而是指向内部 ..data 目录的链接，没有 -L 项目里就会进去一堆链接。
    # 用通配符而不是 /src/.——是为了不把这个内部目录本身复制进去。
    mkdir -p "$WORK/project"
    cp -rL /src/* "$WORK/project/"
    cd "$WORK/project"
    gradle --no-daemon :app:assembleDebug

    APK="$WORK/project/app/build/outputs/apk/debug/app-debug.apk"
    ls -l "$APK"

    echo "== 4/5 ставлю клиент S3 =="
    # 我们把客户端放在工作目录，而不是 /usr/local/bin。Pod 以
    # 非特权用户运行，而镜像的系统目录属于 root：
    # 往那里写会以 Permission denied 告终——而且恰好在这里，第四步，
    # 也就是构建了半个小时之后。/work 目录属于我们，可以往里写。
    mkdir -p "$WORK/bin"
    curl -fsSL -o "$WORK/bin/mc" "$MC_URL"
    chmod +x "$WORK/bin/mc"
    # PATH 是 shell 查找命令的目录列表。我们把自己的目录追加进去，这样后面
    # 就可以直接写 `mc`，而不是完整路径。
    export PATH="$WORK/bin:$PATH"

    echo "== 5/5 кладу APK в бакет =="
    # accessKey/secretKey/endpoint/bucketName 变量来自 Secret，
    # 通过 envFrom 传入。我们抑制 alias set 的输出：没必要让它往日志里打印任何东西。
    # 同样的原因，脚本里没有 set -x——它会打印出密钥。
    # 别名叫 builds，而不是 lab：在所有实验里 `lab` 这个词都指教学
    # 集群，别把两者搞混。
    mc alias set builds "https://${endpoint}" "${accessKey}" "${secretKey}" >/dev/null
    STAMP="$(date -u +%Y%m%d-%H%M%S)"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-${STAMP}.apk"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-latest.apk"
    # 一行标记：check.sh 用它来区分「Job 运行过」和「APK 送达了」。
    echo "APK-UPLOADED ${bucketName}/propusk/propusk-${STAMP}.apk"
    mc ls --recursive "builds/${bucketName}/propusk/"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: propusk-build
spec:
  # 构建失败时重新创建 Pod 的次数。零会更诚实，
  # 但下载 SDK 时网络偶尔会抖一下，而重试一次的代价
  # 比解释「我这为什么挂了」要小。
  backoffLimit: 1
  # 对整个构建的上限。没有它，一个卡住的构建会把节点占用到傍晚。
  # 计时从 Job 的创建开始，而不是从容器启动开始：处于 Pending 的时间以及
  # 实验稍后的节点重建也会消耗它。一小时不够用——
  # 在人已经等到头之后，构建才以 DeadlineExceeded 死掉。
  activeDeadlineSeconds: 7200
  # Pod 模板：Job 从它冲压出将要运行构建的 Pod。Pod 没有自己的
  # 名字——Job 会在自己的名字后追加一个随机后缀，所以查找 Pod 得
  # 靠 job-name 标签，而不是靠名字。
  template:
    spec:
      # 构建会从互联网上拉取别人的代码并立即运行它。为此它不需要 root
      # 权限：它只往 /work 写入——包括 S3 客户端，它也把自己下载
      # 到那里，因为非特权用户不会被允许写入镜像的
      # 系统目录。同样的三个字段也曾用在第一个实验的应用
      # 上，出于同样的原因：没有它们，Pod 不会被启用了
      # `restricted` 安全配置的集群准入。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # 对 Job 来说这是必填字段。Never 意味着：失败的 Pod 不在原地
      # 重启，而是把决定权交给 Job——它会创建一个新的。
      restartPolicy: Never
      containers:
        - name: build
          # 容器层面同样的严格：禁止给自己提权，
          # 每一个 linux 能力都被剥离。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 一个自带 Gradle 和 JDK 17 的现成镜像。JDK 版本不是随便选的：它
          # 必须与 app-build.gradle.kts 中的 jvmTarget = "17" 一致，否则构建
          # 会因字节码版本不匹配而失败。镜像里没有 Android SDK——
          # 脚本的第一步会去下载它，因为内置 SDK 的镜像重达几十
          # GB，拉取时间会比 SDK 本身还长。
          image: gradle:8.9-jdk17
          # 我们运行的不是镜像默认执行的东西，而是我们自己在
          # 挂载于 /scripts 的 ConfigMap 里的脚本。
          command: ["bash", "/scripts/build.sh"]
          envFrom:
            # 密钥的全部四个键都变成环境变量，
            # 名字保持不变：accessKey、secretKey、endpoint、bucketName。
            - secretRef:
                name: bucket-creds
          # Android 构建的真实代价，通过实验摸索出来的。requests 是要
          # 预留多少：调度器按这个数字挑选节点，而不是按实际
          # 消耗。Kotlin 编译器在少于四 GB 时活不下来。
          # limits 是上限：CPU 上碰到它会被限速，内存上
          # 容器会被杀掉（OOMKilled）。作为对比，第一个实验的应用
          # 靠 20m 的 CPU 和 32Mi 的内存就够了。正是因为这些数字，教学
          # 集群的节点得扩容：构建塞不进实验 0 里订购的那个节点。
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 6Gi
          # 三个卷。源码和脚本——只读：ConfigMap 本来就以
          # 只读方式挂载，但显式的 readOnly 一眼就说明构建不往那里写。
          # 它写的是 /work，那也是唯一允许它写的地方。
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: src
          configMap:
            name: propusk-src
            # ConfigMap 的键不能包含斜杠，但挂载时的路径
            # 可以。这就是扁平的映射如何展开成 Gradle 所期待的
            # 目录树。
            items:
              - key: settings.gradle.kts
                path: settings.gradle.kts
              - key: build.gradle.kts
                path: build.gradle.kts
              - key: app-build.gradle.kts
                path: app/build.gradle.kts
              - key: AndroidManifest.xml
                path: app/src/main/AndroidManifest.xml
              - key: MainActivity.kt
                path: app/src/main/kotlin/io/aenix/propusk/MainActivity.kt
              - key: strings.xml
                path: app/src/main/res/values/strings.xml
        - name: scripts
          configMap:
            name: android-build-script
            # 卷中文件的权限：读和执行。脚本以
            # `bash /scripts/build.sh` 的方式调用，所以这里的执行位是一层保险——
            # 将来某个直接运行该文件的人会用到它。
            defaultMode: 0755
        - name: work
          # 节点上的临时磁盘，其存活时间恰好与 Pod 一样长。
          # SDK、Gradle 依赖和构建结果都会落到这里。
          emptyDir:
            # 十二 GB 留有余量：SDK、Gradle 缓存和构建结果加起来是
            # 六到八 GB。需要这个上限，是为了让膨胀的构建不至于把节点的磁盘
            # 整个吃光，把邻近的 Pod 也一起拖垮。
            sizeLimit: 12Gi
