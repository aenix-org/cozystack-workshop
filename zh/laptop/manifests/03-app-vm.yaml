# 应用前，请将 tenant-workshopXX 替换为你自己的 namespace。
# 更简单的做法是一次性替换所有文件：见 README 中关于替换编号的章节。
# 另外：在下面的 url 字段中，插入 convert.sh（第 2 步）生成的 presigned 链接。
#
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  source:
    http:
      url: "ВСТАВЬТЕ_PRESIGNED_URL"  # 来自 convert.sh（Share: 行）
  storage: 10Gi
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  instanceType: u1.medium
  instanceProfile: centos.7
  runStrategy: Always
  disks:
    - name: app-1
# 从外部访问应用 — 通过 `virtctl port-forward`（见 README）。
# 该环境（Cilium + robotlb）上的 external LoadBalancer 对虚拟机不起作用，
# 因此这里不启用 external。