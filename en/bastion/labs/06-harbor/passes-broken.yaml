---
# Lab 6 · Your own private image registry. THIS FILE IS DELIBERATELY INCOMPLETE.
#
# It will not work, and that is intended: you should see the failure with your own eyes and
# figure out for yourself what the cluster was missing. Only one thing is missing here — what
# the cluster calls itself to the closed registry when it comes for an image. The registry does
# not hand out images to just anyone, and there is nothing in this description that would help
# the cluster prove its right. Which exact line fixes it — you will work out over the course of
# the lab; the working version sits next to it, in passes.yaml, and there is no point opening it
# before the walkthrough.
#
# Here there is only a Deployment, no Service: a stable name for the service is not needed yet —
# we will not get as far as a responding pod anyway, since the image will not download.
#
# Applied on your `lab` cluster, in the default namespace:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f passes-broken.yaml
#     kubectl get pods -l app=passes-api -w
#
# NOTE: HARBOR-HOST is a placeholder, not a working address. Substitute the address of your Harbor,
# otherwise you will get a different error than the one this file was written for (there are two lines with the placeholder):
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # macOS
#
# In the object below: apiVersion — the version of the description schema, kind — what we are creating,
# metadata.name — the object name. Not explained separately further down.
#
# A Deployment is not "run a container" but "keep so many copies of this container running".
# A copy disappears — the cluster creates a new one without asking.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # One copy: to walk through the failure, one is enough, and there will be less noise in the logs
  # and in the output of kubectl describe.
  replicas: 1
  # The condition "my copies are pods with the label app: passes-api". The label in the pod template below
  # must match this one, otherwise the cluster will reject the manifest.
  selector:
    matchLabels:
      app: passes-api
  # The template from which copies are stamped out. Everything inside describes a single pod.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Security constraints for the whole pod: do not run as root, work as the
      # unprivileged user 10001, restrict the set of system calls to the
      # standard profile. The image is built for this too (see app/Dockerfile, the USER line).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Container-level rights: do not grant itself extra privileges and drop all special
          # kernel capabilities. The application needs a single network port, the rest is unnecessary.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The first part of the image name is the registry address. That is exactly why moving to your own
          # registry changes the manifests: the image name becomes different. Were there no address,
          # the cluster would go for the image to Docker Hub — that is, to where the security team forbade.
          image: HARBOR-HOST/passes/passes-api:v1
          # The application port. The name `http` is used further down by the readiness probe,
          # so the port number is set in one place, not in two.
          ports:
            - containerPort: 8080
              name: http
          # Environment variables from which the application learns who it is and where it came from.
          # It prints exactly these in the response (see app/main.go, the identity struct).
          # APP_VERSION and IMAGE_REGISTRY are set as text — we write them ourselves; the next three
          # are filled in by the cluster itself at the moment a copy starts, the application has no way to know them.
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — what to reserve for a copy: the scheduler picks a node by these numbers.
          # limits — the ceiling: for memory above the ceiling the container is killed, for
          # CPU it is throttled. 16Mi is enough because the application is in Go with no
          # dependencies. 20m is twenty thousandths of a CPU core.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Readiness probe: until the application responds on /healthz, traffic to the copy
          # will not flow. Today it will not come to this — it checks an already running
          # process, and for us an earlier step will get stuck, the image download.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
