---
# Lab 7 · the "Pass" service, version v2 — the one that can work with a cache.
# The cache is NOT enabled here yet: first we measure how bad it is without it. It gets enabled later,
# by the cache-patch.yaml patch from this same folder.
#
# Where it is applied: your `lab` cluster (export KUBECONFIG=~/lab.kubeconfig).
# Command: kubectl apply -f passes-api.yaml
#
# HARBOR-HOST is a placeholder, not an address. Substitute the address of your own Harbor (see hr-legacy.yaml,
# it also has the sed command to replace it across all files at once).
#
# The file has two objects separated by `---`: Deployment (copies of the application) and Service (a stable name
# for them). apiVersion, kind and metadata.name are not commented further down the file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Two copies, not one, so that later the main property of the cache is visible: it is shared.
  # One pod put the answer into Redis, another took it from there, even though it never went to the directory itself.
  replicas: 2
  # By this label the Deployment tells its own pods from foreign ones. It must match the label
  # in the template below, otherwise the object will not find what it created itself.
  selector:
    matchLabels:
      app: passes-api
  # template — the pod template: what to assemble each copy from.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Pod-level security requirements: not from root, a restricted set of system
      # calls. In a cluster with policies enabled, a pod without these fields will not be accepted.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # How the cluster will identify itself to the closed Harbor when pulling the image. Without a reference
      # to this secret the pod will get stuck in ImagePullBackOff.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # The container's privileges are cut to a minimum: escalation is forbidden, no kernel privileges.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The same image as the directory. Only the MODE below separates them.
          image: HARBOR-HOST/passes/passes-api:v2
          # The port name is needed so that the probe and the Service reference a name, not a number.
          ports:
            - containerPort: 8080
              name: http
          # All the application's behavior is set here. Note: the variables
          # REDIS_ADDR and REDIS_PASSWORD are not in the list — and that is exactly why the cache is off,
          # and every request honestly goes to the slow directory.
          env:
            # MODE=api — this instance works as the "Pass" service itself.
            - name: MODE
              value: "api"
            # The application does not need the version and registry to work — they are visible in the response to "/"
            # and let you confirm that exactly what you just built is running.
            - name: APP_VERSION
              value: "v2"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # Where to go for data. A service name, not an address: the directory's copies
            # can be recreated any number of times, the name does not change.
            - name: HR_URL
              value: "http://hr-legacy.default.svc.cluster.local"
            # Who executes the request and where. The cluster substitutes these three values itself:
            # nobody knows them in advance. They end up in the service's response, and from them you can see
            # which copy on which node answered — this will be useful during measurements.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — what gets reserved when picking a node, limits — the ceiling. A one-core ceiling
          # here is not greed: under load the application will hit it rather than eat up
          # the whole node, and the measurement will show the directory's latency, not a fight for the CPU.
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # Until /healthz responds, the Service will not send a single request to this copy.
          # During an update this same field saves you from an outage: old copies are not removed
          # until the new ones report readiness.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — one stable name for both copies and distribution of requests between them.
# Pods are recreated and change IPs, the name passes-api stays. By this name both Fortio
# and the check script reach the service.
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # The label by which the Service gathers the list of live copies. If it does not match the pods' label —
  # the Service will exist and lead nowhere.
  selector:
    app: passes-api
  ports:
    # From outside they connect on 80, into the pod it goes to the port named http (8080).
    - port: 80
      targetPort: http
