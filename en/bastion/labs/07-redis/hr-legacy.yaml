---
# Lab 7 · stub of the legacy employee directory.
# In real life this is someone else's system that you won't be allowed to rewrite: it responds in 800 ms,
# and you have to live with that somehow. Here is a stub with the same behavior, so there is something to measure.
#
# Where it applies: your `lab` cluster (export KUBECONFIG=~/lab.kubeconfig), not the Cozystack
# management cluster. Command: kubectl apply -f hr-legacy.yaml
#
# HARBOR-HOST is a placeholder, not an address. Substitute the address of your own Harbor, otherwise the cluster will
# try to pull the image from a nonexistent host:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # macOS
#
# The file has two objects separated by a `---` line: a Deployment (what runs and in how many
# copies) and a Service (a permanent name by which those copies are reached). For each object
# apiVersion and kind say what kind of object it is, and metadata.name is what it is called;
# further down these three fields are not commented.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-legacy
  labels:
    app: hr-legacy
spec:
  # How many copies to keep running. If a copy disappears, the cluster creates a new one without
  # asking. One is enough for the directory: it is here not for load, but for measurement.
  replicas: 1
  # By this label the Deployment recognizes its own pods among all the others in the cluster.
  # The label in selector and the label in template below must match, otherwise the object
  # won't find what it created itself.
  selector:
    matchLabels:
      app: hr-legacy
  # template is the pod template. Everything below describes one copy: what to assemble it from,
  # with what privileges to run it and how to tell that it is ready to accept requests.
  template:
    metadata:
      labels:
        app: hr-legacy
    spec:
      # Pod-level security requirements. The process runs not as root (uid 10001),
      # the seccomp profile cuts off system calls that the application does not need.
      # In a cluster with policies enabled a pod without these fields won't start at all.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Harbor is closed off with a login and password, and the cluster needs to identify itself somehow. The `harbor`
      # secret you set up in the registry lab. Without this reference the image won't pull,
      # and the pod will stay in the ImagePullBackOff state.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: hr
          # The same as at the pod level, but for a specific container: we forbid
          # privilege escalation and drop all kernel capabilities. The Go application
          # needs none of them.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The image is the same for the directory and for the «Guest Pass» service itself.
          # Which process actually starts is decided by the MODE variable below.
          image: HARBOR-HOST/passes/passes-api:v2
          # The port has a name, not just a number: the readiness probe and the Service below
          # reference the name. If the number changes, you fix it in one place.
          ports:
            - containerPort: 8080
              name: http
          # Environment variables are the only way to configure this application.
          # Rebuilding the image just to change behavior is not needed.
          env:
            # MODE=hr — the instance pretends to be the HR system: it waits and responds.
            - name: MODE
              value: "hr"
            # Exactly the delay that the real directory shows.
            # By changing it, you change «how bad things are» — try 2s later.
            - name: HR_DELAY
              value: "800ms"
            # The pod does not know its own name in advance — the cluster assigns it at creation.
            # fieldRef injects that name into the variable at startup, and it
            # ends up in the service's response: you can see which copy answered.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # requests — how many resources are reserved for the container when choosing a node,
          # limits — the ceiling above which it won't be allowed. Similar to reservation
          # and limit in vSphere, but set per container, not per virtual machine.
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # Readiness probe. Until /healthz responds, the Service won't send a single
          # request to this copy. Without the probe traffic goes to a process that hasn't started yet,
          # and you'll see errors out of nowhere — even though «everything deployed».
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — a permanent name and permanent address for a set of pods. Pods are recreated
# and each time get a new IP, but the name hr-legacy stays the same. Similar to a load balancer
# VIP, but it's set up in four lines and lives inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: hr-legacy
spec:
  # By this label the Service assembles the list of live copies. The same label as on the pods above:
  # if it doesn't match, the Service will exist and lead nowhere.
  selector:
    app: hr-legacy
  ports:
    # Requests come in on port 80, inside the pod this goes to the port named http (8080).
    - port: 80
      targetPort: http
