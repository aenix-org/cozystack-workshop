---
# Lab 7 · load generator with a web UI.
# The same one as in the scaling lab: load is launched with a button in the browser,
# and the latency histogram is visible right there. If it is already deployed in your
# setup, you do not need to apply this file — kubectl will answer "unchanged".
#
# Where it is applied: your `lab` cluster (export KUBECONFIG=~/lab.kubeconfig).
# Command: kubectl apply -f fortio.yaml
#
# Two objects separated by `---`: Deployment (the generator itself) and Service (the name
# used to reach it). apiVersion, kind and metadata.name are not commented on further below.
#
# The image is pulled from the public Docker Hub, not from your Harbor: Fortio is not part
# of the "Propusk" service but a measuring instrument that lives in the cluster temporarily.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # A single copy. The load generator does not need to be scaled — what is needed is for it
  # alone to count latencies honestly. Two copies would give two unmerged histograms.
  replicas: 1
  # The label by which the Deployment recognizes its pod. Matches the label in the template below.
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # The same security requirements as everything else: the process does not run as root,
      # and system calls are restricted by a seccomp profile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The `latest` tag here is a simplification for the workshop, and it contradicts what
          # the private-registry lab teaches: the image under this tag can silently change
          # between two applies, and yesterday's measurement will become unreproducible. For a
          # load generator on a training stand this is acceptable, for a production system it is not.
          image: fortio/fortio:latest
          # `server` is the mode in which Fortio brings up the web interface and waits until you
          # press a button. Without this argument the image runs a one-off command and exits.
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # The generator needs some CPU headroom, otherwise it will hit
              # its own limit and you will be loading Fortio rather than the application.
              cpu: "1"
              memory: 256Mi
---
# The Service is needed to open the web interface: the generator is reached by name through
# port forwarding — kubectl port-forward svc/fortio 8081:8080 — and accessed at
# localhost:8081. You can hammer the service without a Service too, with the command
# kubectl exec deploy/fortio, but only this path gives you the histogram in the browser.
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  # Here the Service number and the container port coincide — unlike the other
  # services in the lab, where it is 80 outside and 8080 inside. The difference is only convenience.
  ports:
    - port: 8080
      targetPort: http
