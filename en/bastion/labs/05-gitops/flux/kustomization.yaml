---
# Lab 5 · Infrastructure in Git. Task: what exactly from the repository to apply to the cluster.
#
# Applied on your `lab` cluster together with the neighboring gitrepository.yaml:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# In each object: apiVersion — the version of the description schema, kind — what we create,
# metadata.name — the object's name. Not explained separately below.
#
# Separation of duties: GitRepository downloads the repository and applies nothing,
# this object takes what was downloaded and brings the cluster in line with it. The name Kustomization matches
# the name of the kustomize utility, but these are different things — here it is an object in the cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passes
  # Lives in the same place as the Flux services — otherwise kustomize-controller won't pick it up.
  namespace: flux-system
spec:
  # How often to reconcile the actual state of the cluster with the one described in Git.
  # This is not "apply again once a minute" — it is "compare and fix
  # discrepancies once a minute". Even if nothing changed in Git, an edit made
  # by hand via kubectl edit will be silently rolled back. You will see the difference
  # a bit later in the lab, when you change something in the cluster yourself, bypassing Git.
  interval: 1m
  # A folder inside the repository. Everything in it will end up in the cluster; files next
  # to it — for example README.md in the root — won't be touched. The name `apps` was chosen by us, but it
  # must match the folder into which you put manifests in your repository.
  path: ./apps
  # Delete from the cluster objects that have disappeared from Git.
  # Without this Git stops being a complete description: what was deleted from the repository
  # would keep running in the cluster, and no one would know about it.
  prune: true
  # Which source to look at. The name `passes` is the metadata.name from gitrepository.yaml,
  # not the repository's name on GitHub. Rename it there — fix it here too, otherwise Flux
  # will wait for a source that doesn't exist, and the Kustomization won't become ready.
  sourceRef:
    kind: GitRepository
    name: passes
  # Wait for the applied resources to become ready, rather than reporting success right after apply.
  # The difference is exactly the same as between "request submitted" and "request completed": without wait
  # Flux will report success even if the pods don't come up afterward.
  wait: true
  # How long to wait for that readiness before declaring the apply unsuccessful.
  # Three minutes — with a margin for pulling the image on an empty node. Too small a
  # value will give false failures on a slow network, too large — you will
  # stare at "in progress" for a long time instead of a clear error.
  timeout: 3m
