---
# Lab 5 · Infrastructure in Git. Namespace for the "Passes" service.
#
# You do not apply this file to the cluster by hand. You put it into your repository on
# GitHub, in the apps/ folder, and Flux moves it into the `lab` cluster itself, on schedule:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# How to read any manifest: apiVersion — the version of the description schema (the cluster
# uses it to know how to parse the object), kind — what we are creating, metadata.name — the
# name by which the object is later found. These three fields are present in every object and
# are not explained separately below.
#
# A namespace is a logical partition inside a single cluster: its own name scope, its own
# permissions, its own quotas. The closest thing in vSphere is a folder in the vCenter tree
# or a resource pool.
#
# Why it lives in Git together with the application rather than being created by hand: when
# the service leaves the repository, Flux will remove the namespace too. No empty partition
# will be left behind that in six months nobody remembers why it was set up.
apiVersion: v1
kind: Namespace
metadata:
  name: passes
  # The label does not affect how the service runs — it is needed so that a single command
  # can find everything related to "Passes": kubectl get all -A -l app.kubernetes.io/part-of=passes.
  # The part-of name is taken from the common Kubernetes set of labels, not invented by us:
  # external tools (monitoring, exports) look for exactly this one.
  labels:
    app.kubernetes.io/part-of: passes
