---
# Lab 5 · Infrastructure in Git. The "Pass" service itself: four objects in one file.
#
# It is not applied to the cluster by hand. The file is placed into its own repository on
# GitHub, into the apps/ folder, next to namespace.yaml, and Flux carries it into the `lab`
# cluster on its own:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# The --- line separates objects: one file, four independent objects. The order in the file
# does not affect the order of creation — the cluster figures it out on its own.
#
# In each object: apiVersion — the version of the description schema, kind — what we are
# creating, metadata.name — the object's name, metadata.namespace — which partition of the
# cluster it lives in. These fields are not explained separately further on.
#
# None of the four objects contains a password, a key, or a token, and that is not an
# accident: whatever ends up in Git stays there forever — history can be rewritten, but
# everyone who managed to clone it keeps the old copy. Secrets have no place here.

# --- 1 of 4. Web server settings ----------------------------------------------------
# A ConfigMap places a text file into the cluster separately from the application, and below
# (in the volumes section) this file is mounted inside the container. The point is to change
# settings without rebuilding the image: you edit here, commit, and within a minute the
# cluster has the new version.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-conf
  namespace: passes
# A key inside data becomes the file name in the container: default.conf lands in the folder
# that nginx reads at startup. The vertical bar after the name is the way to write
# multi-line text in YAML as is, preserving line breaks.
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      # Address for the readiness check. The cluster knocks here and does not let
      # traffic onto a copy until it gets an answer.
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        # In the page being served we replace __POD__ with the name of the machine where
        # nginx is running. Inside the pod the machine name is the pod's own name.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
    }
---
# --- 2 of 4. The page that the service serves ----------------------------------------
# In this lab the page is a stub: the real application appears later. Right now what matters
# is not what the service shows, but where it came from in the cluster. The text __POD__ in
# the markup is a placeholder for substitution: nginx replaces it with the name of the pod
# that served the page, and by that name you will later see that there is more than one copy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-page
  namespace: passes
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Guest Pass</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 40rem;
               color: #222; }
        h1 { font-weight: 600; }
        .v { display: inline-block; padding: .2rem .6rem; border-radius: .3rem;
             background: #eef; font-family: ui-monospace, monospace; }
        .pod { margin-top: 2rem; color: #666; font-size: .9rem; }
        b { font-family: ui-monospace, monospace; color: #222; }
      </style>
    </head>
    <body>
      <h1>Guest Pass service</h1>
      <p>Requesting a guest pass. Version <span class="v">v1</span></p>
      <p>Deployed from Git. No one touched it by hand.</p>
      <div class="pod">served by pod <b>__POD__</b></div>
    </body>
    </html>
---
# --- 3 of 4. Description of the application itself ---------------------------------------
# A Deployment is not "run a container", but "keep so many copies of such-and-such container
# running". The difference shows when a copy dies: the cluster creates a new one, without
# asking and without notifying. In vSphere the closest thing is HA, but there a machine is
# restarted, whereas here a copy of the application is recreated, and it is done constantly,
# not only on failure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes
  namespace: passes
  labels:
    app: passes
spec:
  # How many copies to keep running. The wording matters: not "run one", but "keep one".
  # This is the number you will change through Git and watch what happens.
  replicas: 1
  # By what sign the Deployment recognizes its copies. This is not a list of pod names —
  # names change on every recreation — but the condition "all pods with the label app: passes".
  # The label below, in template.metadata.labels, must match this condition: if they diverge,
  # the cluster refuses to accept the manifest, because the copies would belong to no one.
  selector:
    matchLabels:
      app: passes
  # template — the pattern from which copies are stamped out. Everything inside describes one
  # pod. Editing the pattern means rolling out a new version: old copies are replaced with new.
  template:
    metadata:
      labels:
        app: passes
    spec:
      # Security restrictions at the level of the whole pod. In vSphere there is no analogue:
      # there isolation is provided by the hypervisor, whereas containers share the kernel
      # with the node, so privileges have to be trimmed explicitly.
      #   runAsNonRoot   do not run if the image wants to work as root
      #   runAsUser      which numeric user to run as; 65532 is the accepted
      #                  "unprivileged" identifier in minimal images
      #   seccompProfile which system calls are allowed; RuntimeDefault is a set that
      #                  cuts off the obviously dangerous ones and breaks nothing
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # The same restrictions, but now for a specific container.
          #   allowPrivilegeEscalation: false  the process cannot gain more privileges for itself
          #   capabilities.drop: ["ALL"]       strip all special kernel capabilities
          #                                    (change the network, mount, change the time);
          #                                    a web server needs none of them
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The image is taken from a public registry — in the next lab InfoSec will forbid
          # this, and the address will change to our own Harbor. The unprivileged variant was
          # chosen not for looks: the ordinary nginx image listens on port 80 and wants root
          # for that, and with runAsNonRoot above it would not start at all.
          # The version is pinned (1.27-alpine), not latest: otherwise the same manifest would
          # deploy a different application tomorrow, and you would not know about it.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # The port the application listens on. The name `http` is not decoration: the
          # readiness check below and the Service at the end of the file refer to it. Change
          # the port number and you will change it in one place, not in three.
          ports:
            - containerPort: 8080
              name: http
          # requests — how many resources are guaranteed to be reserved; the scheduler picks a
          # node by this number. limits — the ceiling above which it will not be let past.
          # Understating requests means more will fit onto a node than it can handle;
          # exceeding limits on memory — the container is killed, on CPU — it is throttled.
          # 20m = twenty thousandths of a core, Mi = megabytes. The values here are small,
          # because there is a single node in the lab and it is not large.
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Readiness check: the cluster knocks at this address and does not let traffic onto
          # a copy until it gets an answer. Without it the Service would send requests to an
          # nginx that has not yet come up, and the user would see an error on every rollout.
          # Flux waits for it too — in kustomization.yaml we asked for wait: true.
          #   initialDelaySeconds  wait before the first knock, give the process time to start
          #   periodSeconds        how often to knock afterwards
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # Where inside the container to place the contents of the two ConfigMaps from the
          # start of the file. /etc/nginx/conf.d — the folder nginx reads settings from at
          # startup, /usr/share/nginx/html — the folder it serves files from.
          # The image itself does not change: the files appear in it at the moment of launch.
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: page
              mountPath: /usr/share/nginx/html
      # What exactly to mount. The names conf and page are internal, they link this block with
      # the volumeMounts above; name inside configMap is already the name of the real object
      # in the cluster. Get it wrong and the pod will hang waiting for a nonexistent ConfigMap.
      volumes:
        - name: conf
          configMap:
            name: passes-conf
        - name: page
          configMap:
            name: passes-page
---
# --- 4 of 4. A permanent name behind which all the copies stand -----------------------------
# Pods are recreated, and their addresses are new every time. A Service gives an unchanging
# name — passes.passes.svc.cluster.local — by which the live copies can always be reached
# inside the cluster. This is internal balancing; from outside the cluster you cannot get here yet.
apiVersion: v1
kind: Service
metadata:
  name: passes
  namespace: passes
spec:
  # The link between the Service and the pods is not a list of addresses, but the condition
  # "all pods with the label app: passes". A new copy with such a label appeared — it came
  # under balancing by itself, nothing needs to be registered. It disappeared — it is removed from the pool.
  selector:
    app: passes
  # port — the port the Service itself answers on, targetPort — where it forwards inside the
  # container. Here targetPort refers to the name `http` from the ports block above, not to a
  # number: the number can be changed in one place, and the link will not break.
  ports:
    - port: 80
      targetPort: http
