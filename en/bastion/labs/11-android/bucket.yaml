---
# Lab 11. Bucket for built APKs.
#
# A bucket is a named area in object storage: files are put and fetched as whole
# objects, over HTTP, and are never mounted anywhere. There are no directories inside;
# a slash in an object name is drawn as a tree only in the interface.
#
# This is a tenant object: it lives NOT in the `lab` cluster, but in your namespace
# on the management cluster. That is why the kubeconfig here must be the tenant one,
# not the one you use to work with the `lab` cluster. This is by design: build artifacts
# must outlive the cluster they were built in.
#
# Before applying, replace tenant-workshopXX with your own namespace, otherwise the order
# will go to the wrong tenant and most likely will not pass the permission checks.
#
#     export KUBECONFIG=~/.kube/config
#     kubectl apply -f bucket.yaml
#
# The same thing can be done with the mouse in the tenant dashboard (Create application -> Bucket).
# The result is identical; the difference is that text can be reviewed and put into Git.
#
# What happens after applying: the platform will bring up the bucket in a few seconds
# and issue access keys, storing them in the secret bucket-builds-ci-credentials in the same
# namespace. Four values from there (endpoint, bucketName, accessKey, secretKey)
# are transferred into the `lab` cluster by hand — the clusters are different, nothing moves on its own.
apiVersion: apps.cozystack.io/v1alpha1
kind: Bucket
metadata:
  # The name of the Cozystack object, and only that. The real bucket name in storage is
  # issued by the platform itself — long, of the form bucket-a9209f83-... It will end up in the
  # bucketName field of the issued secret, and that is exactly what must be plugged into the build, not `builds`.
  name: builds
  namespace: tenant-workshopXX
spec:
  users:
    # Each key of this map is a separate S3 user with its own key pair.
    # An empty object means "full read and write access".
    # This way you can grant the builder write access, and the mobile team — read-only:
    #   ci: {}
    #   mobile:
    #     readonly: true
    ci: {}
