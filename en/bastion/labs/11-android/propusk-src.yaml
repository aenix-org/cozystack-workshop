---
# Lab 11. Sources of the "Propusk" mobile app — what is fed to the build as input.
#
# Applied to your training cluster `lab`, not to the tenant on the management cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f propusk-src.yaml
# There are no placeholders like tenant-workshopXX here — you don't need to substitute your number anywhere.
# Namespace is also not specified: the object will land in the one set in your kubeconfig.
#
# The app is deliberately tiny: one activity, one line of text on the screen.
# The point of the lab is not Android, but the fact that a build travels into the cluster.
#
# WHAT THESE FILES ARE, if you have never built a mobile app.
# An Android project is not a single file with code, but a tree of three kinds of files:
#   *.gradle.kts  the build description: where to fetch libraries, what to compile with, for which
#                 Android versions to build. By its role it's a makefile, only in the Kotlin language;
#   *.kt          the actual application code;
#   *.xml         resources: texts and the description of which screen to open when the icon
#                 is tapped.
# The Gradle builder reads this tree and produces an APK — a single installer file for the phone,
# by its role the same as an .msi for Windows. You don't need to install the Android SDK yourself
# and build by hand: a Job from android-build.yaml will do that, and here lies only its input.
#
# The sources live in a ConfigMap rather than in the image, for exactly the same reason
# that in the lab with the first app the nginx page lived in a ConfigMap:
# to change them without rebuilding anything. A ConfigMap is a cluster object inside
# which text files live; when a container starts, the cluster slips them
# inside it as ordinary files on disk.
#
# The keys inside `data` are file names, and everything below the indent after `|` is the
# verbatim content of the file, not YAML. A comment placed inside such a
# block would become a line of the file itself, so all the explanations below stand outside,
# before the key.
#
# The flat map of six keys unfolds into a directory tree not here, but at
# mount time: the "key -> path" correspondence is defined in android-build.yaml, in the
# volumes.items block. A ConfigMap key cannot contain a slash — hence the flat name
# app-build.gradle.kts, which in the project becomes app/build.gradle.kts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: propusk-src
data:
  # The top project file: it lists where Gradle pulls plugins and libraries from and which
  # modules are part of the project (here there's one — app). All three repositories are public, on the internet:
  # the build container starts empty and pulls everything from there, hence the build duration.
  # This is also the first place you'll edit when infosec closes off outbound access — an
  # internal proxy repository will be written in here, exactly as Docker Hub was swapped for Harbor.
  settings.gradle.kts: |
    pluginManagement {
      repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
      }
    }
    dependencyResolutionManagement {
      repositories {
        google()
        mavenCentral()
      }
    }
    rootProject.name = "propusk"
    include(":app")

  # The root build file: pins the versions of two plugins — the Android builder and the Kotlin
  # compiler. `apply false` means "declare the version, but don't enable it in the root project":
  # the app module will enable them. The versions are nailed down on purpose. A build that pulls
  # "latest" builds differently in a month than it does today, and you'll be the one figuring it out.
  build.gradle.kts: |
    plugins {
      id("com.android.application") version "8.5.2" apply false
      id("org.jetbrains.kotlin.android") version "1.9.24" apply false
    }

  # Description of the app module itself. Here are three numbers on which both what the build
  # downloads and where the app will even run depend:
  #   compileSdk 34   the Android SDK version we compile with. It's what the SDK install step
  #                   downloads — about one and a half gigabytes, the slowest build step;
  #   minSdk 24       the oldest Android on which the app will run (that's Android 7).
  #                   Raise it — you cut off old phones, lower it — you'll have to drag in
  #                   compatibility libraries;
  #   jvmTarget 17    Kotlin compiles to Java bytecode, and this number must match
  #                   the JDK version in the build image (gradle:8.9-jdk17 in android-build.yaml).
  #                   If they diverge, the build fails on a bytecode version mismatch.
  app-build.gradle.kts: |
    plugins {
      id("com.android.application")
      id("org.jetbrains.kotlin.android")
    }

    android {
      namespace = "io.aenix.propusk"
      compileSdk = 34

      defaultConfig {
        applicationId = "io.aenix.propusk"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
      }

      compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
      }

      kotlinOptions {
        jvmTarget = "17"
      }

      sourceSets {
        getByName("main") {
          java.srcDirs("src/main/kotlin")
        }
      }
    }

  # The app's passport for the phone: which screens it has and which of them opens
  # when the icon is tapped. That's exactly what the intent-filter block with MAIN and LAUNCHER handles —
  # without it the app will install, but no icon will appear in the menu.
  AndroidManifest.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <manifest xmlns:android="http://schemas.android.com/apk/res/android">
      <application android:label="@string/app_name">
        <activity
            android:name=".MainActivity"
            android:exported="true">
          <intent-filter>
            <action android:name="android.intent.action.MAIN" />
            <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
        </activity>
      </application>
    </manifest>

  # The app's only screen — and all the code the project has at all.
  # Bare android.app.Activity is used, not a compatibility library: the project has zero external
  # dependencies, and that saves a couple of minutes of downloading on every build.
  # R.string.greeting — a reference to text from strings.xml. The R class is not in the sources, it's
  # generated by the build. So the error "unresolved reference: R" means a failed resource
  # generation step, not a typo in the code.
  MainActivity.kt: |
    package io.aenix.propusk

    import android.app.Activity
    import android.os.Bundle
    import android.widget.TextView

    class MainActivity : Activity() {
      override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val view = TextView(this)
        view.textSize = 22f
        view.setPadding(48, 96, 48, 48)
        view.text = getString(R.string.greeting)
        setContentView(view)
      }
    }

  # Texts extracted from the code: this way they're edited and translated without touching the programmer.
  # app_name is visible under the icon on the phone, greeting — on the screen itself.
  strings.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <resources>
      <string name="app_name">Guest Pass</string>
      <string name="greeting">Request a guest pass</string>
    </resources>
