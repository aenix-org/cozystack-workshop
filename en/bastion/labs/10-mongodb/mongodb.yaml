# Lab 10 · ordering a MongoDB database for passes of different kinds.
# A description of what you want to get; the platform assembles and configures the service.
# The same thing you would order with the mouse in the dashboard — only as text.
# Applied NOT to the lab cluster, but to a tenant on the management cluster:
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f mongodb.yaml
#
# BEFORE APPLYING: replace tenant-workshopXX with your namespace,
# and ЗдесьВашПароль with a password of your own choosing.
apiVersion: apps.cozystack.io/v1alpha1
kind: MongoDB
metadata:
  name: passes
  namespace: tenant-workshopXX
spec:
  # A single copy. MongoDB is designed for a replica set of three: they vote on which
  # one is primary and survive the loss of one. With a single copy there is no one to
  # vote with, and the chart enables a separate "unsafe" mode for that. Fine for a lab,
  # not for production.
  replicas: 1
  # Disk for the data. A megabyte would be enough for four training documents, but it is
  # easier to take a volume with some headroom than to expand it later.
  size: 5Gi
  # replicated — volumes that have a copy on another node of the cluster: a node drops out,
  # the data remains.
  storageClass: replicated
  # CPU and memory allocated to the database pod. More than enough for four documents.
  resourcesPreset: s1.small
  # MongoDB branch. Changing it after the fact on a live database is not possible without an upgrade.
  version: v8
  # false — the database is accessible only from inside the cluster, no port is exposed outward.
  # You will access it from a work pod running next to it.
  external: false
  # Sharding splits the data across several sets of servers. Needed when
  # the data does not fit on a single server; four passes do fit.
  sharding: false
  # The database user and its password. Choose your own password and remember it: it is needed by
  # the work pod (in the MONGO_URI connection string) and by the check script
  # (the MONGO_PASSWORD variable). The account is created in the service database admin —
  # which is why authSource=admin is mandatory in the connection string.
  users:
    passapp:
      password: ЗдесьВашПароль
  # The passes database and permissions in it: the passapp user is granted the admin role of this
  # database, meaning it can read, write, build indexes and change collection settings.
  # This grants no permissions on other databases.
  databases:
    passes:
      roles:
        admin:
          - passapp
  # Backups to object storage. Disabled on the training stand.
  backup:
    enabled: false
