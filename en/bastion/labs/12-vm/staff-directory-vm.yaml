---
# Lab 12. A virtual machine for a legacy staff directory: the disk and the machine itself,
# two objects in one file, separated by a `---` line.
#
# These are tenant objects: they live NOT in the `lab` cluster, but in your namespace
# on the management cluster. You need the tenant kubeconfig.
#
# Before applying, replace tenant-workshopXX with your own namespace, otherwise the order will go
# to the wrong tenant instead of yours.
#
#     export KUBECONFIG=~/.kube/config
#     kubectl apply -f staff-directory-vm.yaml
#
# The same thing can be done with the mouse in the tenant dashboard (Create application -> VM Disk,
# then VM Instance) — the result is identical.
#
# ATTENTION: the name the machine is called by later does NOT match metadata.name, and this is not
# a typo in the lab. The platform deploys a VMInstance object named X with the
# `vm-instance` chart, and the chart name is glued to the release name: the running instance
# is called vm-instance-X. On top of that, the target is specified with a type prefix, because
# tenant permissions are granted on instances (virtualmachineinstances, aka vmi), not on
# virtualmachines — a bare name will return forbidden. Hence the console login command:
#     virtctl console --namespace=tenant-workshopXX vmi/vm-instance-spravochnik
# List of running instances: kubectl get vmi -n tenant-workshopXX
# And `kubectl get vminstance spravochnik` shows not the instance, but your order for it —
# the very object described below.
#
# The disk and the machine are TWO DIFFERENT objects, and this is not bureaucracy: the disk outlives
# the machine. The machine can be deleted and recreated, attaching the same disk.
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  source:
    image:
      # A name from the platform's shared image collection, not a URL.
      # The list is visible in the dashboard when creating a disk.
      name: ubuntu-22.04
  # Disk size. It cannot be smaller than the source image: ubuntu-22.04 expands
  # to 20Gi, and the platform would refuse to fill a 10Gi disk. The disk can be expanded later,
  # but not shrunk, so underestimating here costs more than overestimating.
  storage: 20Gi
  # Storage class. `replicated` — data is written in several copies to different platform
  # nodes: a node holding a copy can die, and the machine keeps working. In essence this is
  # a mirror, only assembled over the network. The databases in the neighboring labs use the same class.
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  # 1 CPU, 4 GB. The same catalog reference from which the sizes of
  # Kubernetes nodes are taken: machines and nodes are measured the same way here.
  instanceType: u1.medium
  # Guest OS profile: which drivers and devices to hand to the machine.
  instanceProfile: ubuntu
  # Always means "keep it running": if it shuts down on its own — it will be started again.
  # Halted — off, Manual — as left.
  runStrategy: Always
  # Which disks to attach to the machine. The reference is by the name of the VMDisk object above — the
  # very one that will outlive this machine.
  disks:
    - name: spravochnik
  # Note: there is NO replicas field here, and there won't be.
  # A virtual machine is a single object. Need two machines — two objects
  # with different names. This is a fundamental difference from Deployment,
  # see the README section about where this difference hurts.
  # Initial setup of the guest OS. cloud-init is the standard mechanism of Linux cloud
  # images: on first boot the machine reads this text and applies it to itself. In its role
  # it is guest customization in vSphere — passwords, files, services — only by description, not
  # by a wizard. Everything below the indentation after `|` goes to the guest verbatim and is parsed
  # there, not by Kubernetes.
  #
  # Here cloud-init turns the directory into a server: it places an HTML page and sets up a service
  # that serves it over HTTP on port 8080. python3 is already in the ubuntu image — the internet
  # is not needed for this. Port 8080 is not random: the instructor has already created a
  # Service `spravochnik-http` (80 -> 8080) and an Ingress `spravochnik` in your tenant, and as soon as the service
  # inside the machine comes up, the directory will be published on the tenant domain.
  cloudInit: |
    #cloud-config
    # The password is needed to log in to the console from the dashboard. On a production machine
    # you should not do this — use sshKeys there.
    password: ubuntu
    chpasswd: { expire: false }
    ssh_pwauth: true
    write_files:
      - path: /opt/directory/index.html
        content: |
          <!doctype html><html lang="en"><head><meta charset="utf-8"><title>Directory</title></head><body><h1>Staff directory</h1><ul><li>Whitfield J. — 101</li><li>Petersen P. — 102</li></ul></body></html>
      - path: /etc/systemd/system/directory.service
        content: |
          [Unit]
          Description=Staff directory
          After=network.target
          [Service]
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0 --directory /opt/directory
          Restart=always
          [Install]
          WantedBy=multi-user.target
    runcmd: [ "systemctl daemon-reload", "systemctl enable --now directory" ]
