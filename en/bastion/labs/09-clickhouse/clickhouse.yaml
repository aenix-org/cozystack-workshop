# Lab 9 · order a ClickHouse database for analytics over the access-pass log.
# A description of what you want to get; the platform assembles and configures the service.
# The same thing you would order with the mouse in the dashboard — just as text.
# Applied NOT to the lab cluster, but to a tenant on the management cluster:
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f clickhouse.yaml
#
# BEFORE APPLYING: replace tenant-workshopXX with your namespace,
# and ЗдесьВашПароль with a password you come up with.
apiVersion: apps.cozystack.io/v1alpha1
kind: ClickHouse
metadata:
  name: analytics
  namespace: tenant-workshopXX
spec:
  # One copy and one shard. In production you keep at least two copies, otherwise losing a node
  # means the data becomes unavailable — but we need a million rows, not fault
  # tolerance, and an extra copy would just eat up the stand's resources.
  replicas: 1
  shards: 1
  # Disk for the table data. A million rows from this lab will take up tens of megabytes:
  # columnar storage with dictionaries compresses such a log very heavily.
  size: 5Gi
  # A separate disk for the server's system logs, including the query log.
  logStorageSize: 2Gi
  # After how many days to discard the query log. We are going to look into it.
  logTTL: 15
  # replicated — volumes that have a copy on another cluster node: the node dropped out,
  # the data stayed.
  storageClass: replicated
  # 1 CPU, 4 GB. ClickHouse computes in memory, and on groupings over
  # a million rows this is noticeable.
  resourcesPreset: u1.small
  # The database user and its password. Come up with your own password and remember it: it is needed
  # by the worker pod (the CH_AUTH variable) and the check script (the CH_PASSWORD variable).
  # After creation it is visible in the dashboard, in the clickhouse-analytics-credentials secret.
  users:
    analyst:
      password: ЗдесьВашПароль
  # Backups to object storage. The data here is generated,
  # there is nothing to restore — disabled on the training stand.
  backup:
    enabled: false
  # Keeper is needed to reconcile between copies. There is one copy — there is no one
  # to reconcile with, and three Keeper pods would take up resources for nothing.
  clickhouseKeeper:
    enabled: false
