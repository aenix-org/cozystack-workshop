---
# Lab 3. Scaling replicas by CPU load.
# Target is 50% of requests.cpu (20m), i.e. the threshold is 10m per pod.
# Chosen deliberately low: the load must trigger within seconds,
# we have half an hour for the lab, not half a day.
#
# A single object. Applied on your training cluster `lab`, not in the tenant
# on the management cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f hpa.yaml
# There are no placeholders like tenant-workshopXX here — no need to substitute your number anywhere.
#
# Two conditions without which the object will be created but won't work:
#   1. The rickroll container has requests.cpu set — otherwise there is nothing to compute the percentage from,
#      and the TARGETS column of `kubectl get hpa` will forever stay <unknown>.
#   2. metrics-server is running in the cluster — the source of pods' current consumption.
# check.sh in this folder verifies both conditions.
#
# As long as the HPA exists, the Deployment's replicas field belongs to it. You can change the number
# of copies by hand via `kubectl scale`, but the HPA will restore its own value within seconds.
# That is why in lab 4, before the rollout, this object is deleted: two mechanisms on one field —
# a guaranteed way to not understand what happened.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # The HPA name doesn't have to match the application name — the match here is for convenience.
  # What to manage is determined by scaleTargetRef below, not by this name.
  name: rickroll
spec:
  # Whom to watch and whose replicas field to change. Three fields together, because a name
  # without a type is ambiguous: a Deployment and a StatefulSet can be named the same.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rickroll
  # The corridor the HPA won't leave under any load. The lower bound is the same
  # single copy the lab started with. The upper is six: that many fit
  # on a training node at limits.cpu 300m and are still noticeable to the eye in the pod list.
  # Set maxReplicas: 1 and the object will be created and do nothing.
  minReplicas: 1
  maxReplicas: 6
  # What to base the decision on. There can be several metrics, then the HPA takes the one
  # that requires the larger number of copies. Here there is one — the CPU.
  metrics:
    - type: Resource
      resource:
        name: cpu
        # Utilization is the fraction of the container's requests.cpu, not of the node's capacity.
        # Hence a non-intuitive consequence: the value can calmly be 600%, and that is
        # not an error: the pod eats six times more than it reserved.
        # An alternative is AverageValue, where the threshold is set in millicores directly.
        target:
          type: Utilization
          averageUtilization: 50
  # How briskly to react. The block is optional: without it the default values are used,
  # designed for production operation, not for a demonstration.
  behavior:
    scaleUp:
      # By default Kubernetes waits for stabilization and grows slowly.
      # In a lab this looks like "nothing is happening", so we speed it up.
      stabilizationWindowSeconds: 0
      # No more than two new copies every fifteen seconds. The step was chosen empirically:
      # growth is seen as growth, and not as an instant jump from one straight to six,
      # in which the participant has nothing to observe.
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      # And downward, on the contrary — not instantly, otherwise the pods will disappear
      # before the participant manages to observe them.
      # A minute instead of the default five: the lab runs for half an hour, there's nothing
      # to fill five of them with while waiting for the scale-down. In a production cluster a long window is actually useful —
      # it dampens the swings on uneven load.
      stabilizationWindowSeconds: 60
