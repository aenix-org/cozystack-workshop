# Lab 3. Fortio load generator: the generator itself and a stable address for its
# web interface. Two objects, separated by `---`.
#
# Applied to your `lab` training cluster, not to a tenant on the management cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f fortio.yaml
# There are no placeholders like tenant-workshopXX here — you don't need to substitute your number anywhere.
# This same file is needed in lab 4: `kubectl apply -f ../03-scale/fortio.yaml`.
#
# Common manifest fields (apiVersion, kind, metadata.name, selector, template,
# securityContext) are broken down line by line in ../01-deploy/rickroll.yaml and are not
# repeated here. We comment only on what is specific to the load generator.
---
# Load generator with a web UI.
# Chosen over hey/ab on purpose: you start the load with a button in the browser,
# and the latency histogram is visible right there. At past workshops we lost
# people precisely on console tools.
#
# Fortio lives in the cluster as an ordinary application and hits the rickroll address from the inside.
# Loading it from the outside, from the VM, would be more honest traffic-wise, but it would run into the channel
# to the cluster, and you would be measuring your Wi-Fi rather than the application.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # One copy of the generator is enough: it produces load in many threads by itself.
  # A second copy here would only blur the picture — each copy has its own counters in the web
  # interface, and you would see half of the requests.
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # The same security profile as rickroll: runs as non-root, a specific
      # UID, standard seccomp. Left in on purpose — so the file can be applied
      # even in a cluster with the `restricted` profile enabled, where the pod would otherwise not start.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The latest tag is a deliberate simplification for the workshop, to avoid comparing versions.
          # In a production cluster this is not done: the image under this tag may silently
          # change between two applies, and you won't be able to reproduce yesterday's result.
          image: fortio/fortio:latest
          # The `server` mode brings up the web interface and keeps it running. Without this argument
          # Fortio would do a single run from the command line and exit, and the cluster
          # would keep restarting the container in a loop.
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            # The request is higher than rickroll's own (20m): the generator needs room on the node
            # in advance, otherwise the scheduler will place it tightly and the ramp-up will be uneven.
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # The generator needs CPU headroom, otherwise it will run
              # into itself and you'll be loading Fortio rather than the application.
              cpu: "1"
              memory: 256Mi
---
# Stable address of the generator inside the cluster. Needed to open the web interface
# from the VM via `kubectl port-forward svc/fortio 8081:8080` — from the outside the cluster
# publishes nothing, and there are no other doors to Fortio.
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  ports:
    # 8080 on both sides: both the service and the container. The number is the same as rickroll's
    # inside the pod, but there's no collision — each pod has its own network stack.
    - port: 8080
      targetPort: http
