# Lab 8 · step 3 of 3: there is no password in the manifest — neither in plain text nor in base64.
# The final version. This file can be committed to Git, shown to a contractor and printed
# on a T-shirt.
#
# How this step differs from the second one: there the value was still written down — into a file
# and then into a cluster object. Here it is not present in the description at all; the application fetches
# the password itself, at startup, from the OpenBao store.
#
#   secrets-demo-naive.yaml      the password is visible to anyone who opens the file
#   secrets-demo-secret.yaml     the password is moved into a Secret object
#   secrets-demo.yaml         <- you are here: the password arrives from the store at startup
#
# BEFORE APPLYING: replace tenant-workshopXX with your own namespace — it is part of the store
# address below. XX is a placeholder, not part of the name.
# Where it is applied: your `lab` cluster (export KUBECONFIG=~/lab.kubeconfig).
# Command: kubectl apply -f secrets-demo.yaml
#
# The token the application uses to identify itself to the store lives in the passes-bao-token secret.
# You create it with a command, not with a file: this manifest contains only the object name,
# and a name is not a secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # Everything runs as non-root. fsGroup is needed because there are two containers here: one
      # writes the file with the password, the other reads it. Without a shared group the init container
      # would write a file that the main one cannot open, and you would spend half an hour wondering
      # where you went wrong.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # The place where one container puts the password and the other reads it.
      # medium: Memory means that this "disk" lives in the node's RAM
      # and never reaches a real disk: not in a backup, not in a volume dump, not to whoever
      # takes the disk out of the server. The pod is gone — so is its content.
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      # The init container runs BEFORE the main one and must complete successfully.
      # If it fails to fetch the password, the application will not start at all, and that is the correct
      # behavior: a service without a database password is unusable anyway, it is more honest to not come up
      # than to come up and spew errors into the log.
      initContainers:
        - name: fetch-secret
          # We take the OpenBao image itself for the sake of one tool, `bao` — its client.
          # No custom code needed.
          image: openbao/openbao:2.5.1
          # bao kv get -field=password — fetch a single field by a single path, not the whole
          # secret. tr -d '\n' removes the newline that would otherwise end up inside the
          # password: an extra trailing character will be rejected by the database, and tracking it down is unpleasant.
          # chmod 0400 — only the owner can read the file.
          # set -e stops the script at the very first error: otherwise the container would exit
          # successfully with an empty file, and you would have to debug it in the application.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              bao kv get -field=password secret/passes/db \
                | tr -d '\n' > /secrets/db_password
              chmod 0400 /secrets/db_password
              echo "пароль получен из OpenBao, в манифесте его нет"
          # The store address and the token the application uses to prove its right to read.
          # The token is referenced from an object created by a command; it never gets here, into the file.
          # In the address, tenant-workshopXX is that same placeholder that must be replaced.
          env:
            - name: BAO_ADDR
              value: http://openbao-secrets.tenant-workshopXX.svc.cozy.local:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: passes-bao-token
                  key: token
          # The shared folder. This container has it granted for writing — it writes into it.
          volumeMounts:
            - name: secrets
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Limits higher than the main container's: the OpenBao tool is heavier than busybox,
          # but it lives for a few seconds, so this is not a permanent cost.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      # The main container starts only after the init container has finished.
      containers:
        - name: app
          image: busybox:1.36
          # The same loop as in the previous steps, but the password is now not in an environment
          # variable but in a file: the fingerprint is computed straight from /secrets/db_password.
          # Environment variables are visible in the output of kubectl describe pod and end up in process
          # dumps; a file in the pod's memory is not.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(sha256sum /secrets/db_password | cut -c1-12)"
                sleep 10
              done
          # Only non-secret settings remain here — the address and the login.
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
          # The same folder, but read-only: the application cannot spoil or substitute the password,
          # even if it very much wants to.
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
