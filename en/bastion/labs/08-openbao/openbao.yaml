# Lab 8 · ordering an OpenBao secrets store.
# The same thing you would order with the mouse in the dashboard — only as text.
# It is applied NOT to the lab cluster, but to a tenant on the management cluster:
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f openbao.yaml
#
# BEFORE APPLYING: replace tenant-workshopXX with your own namespace. XX is a placeholder,
# not part of the name; you received your own number together with the password. If it goes
# into someone else's tenant — you get an access denial, and that is the best possible outcome.
#
# kind: OpenBAO — this is not a built-in Kubernetes object, but a type that Cozystack
# adds. You describe what you need, and the platform itself deploys the pods, disks
# and services, and then updates them itself. It is closest to ordering a service from a catalog,
# not to installing software on a handed-out virtual machine.
apiVersion: apps.cozystack.io/v1alpha1
kind: OpenBAO
metadata:
  # The name affects not only the card in the dashboard: the store's internal address
  # is assembled from it — openbao-secrets.<namespace>.svc.cozy.local. If you rename it —
  # fix the address in secrets-demo.yaml and in the BAO_APP variable for check.sh.
  name: secrets
  namespace: tenant-workshopXX
spec:
  # A single copy. In production three are deployed and you get Raft replication: the chart enables
  # it itself as soon as replicas > 1. Switching back and forth requires
  # moving data, so the decision is made before, not after.
  replicas: 1
  # Disk for the store's data. Two gigabytes is with a reserve: secrets weigh bytes,
  # space goes to version history and the audit log. You cannot shrink a volume after creation,
  # but you can usually grow it, so there is no point being stingy here.
  size: 2Gi
  # The replicated storage class means the data lies in several copies on
  # different nodes. A node failure does not take all your passwords with it — and restoring
  # a secrets store from a backup is a separately unpleasant affair.
  storageClass: replicated
  # A ready-made "how much CPU and memory" set. The platform offers them as a list,
  # so as not to force everyone to compute requests and limits by hand.
  resourcesPreset: t1.small
  # The web interface comes up inside the cluster. We do not expose it outside:
  # external: true would attach a LoadBalancer, and we do not need it in the lab.
  ui: true
  external: false
