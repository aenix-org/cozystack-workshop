# Lab 8 · step 1 of 3: the password sits in the manifest in plain text.
# This is how the "Propusk" service looks today — and this is the very file the audit found.
# We will apply it exactly once, to see the problem with our own eyes.
#
# The three steps of the lab, so you don't get lost:
#   secrets-demo-naive.yaml   <- you are here: anyone who opens the file sees the password
#   secrets-demo-secret.yaml     the password is moved into a separate Secret object
#   secrets-demo.yaml            there is no password in the manifest at all
#
# Where it applies: your `lab` cluster (export KUBECONFIG=~/lab.kubeconfig).
# Command: kubectl apply -f secrets-demo-naive.yaml
#
# The password in this file is a training, made-up one; there are no real ones here. A single object —
# a Deployment; apiVersion, kind and metadata.name are not commented on further.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # One copy is enough: we are looking not at fault tolerance, but at
  # where the application gets the password from.
  replicas: 1
  # By this label the Deployment recognizes its pods. It matches the label in the template below.
  selector:
    matchLabels:
      app: secrets-demo
  # template — the pod template: what to build a copy from.
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # Security requirements: not as root, a limited set of system calls.
      # Note the disconnect: the pod is configured by all the security rules, and that does nothing
      # to prevent the password from sitting in the file ten lines below.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # There is no real application here — busybox and a few lines of shell.
          # For this lab only one thing matters: where the password comes from, not what is
          # done with it afterwards.
          image: busybox:1.36
          env:
            # The database address and the user name are not secrets: knowing that
            # the database is called passes-db does not by itself grant access.
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # THIS IS THE LINE THE AUDIT FOUND.
            # The file is in Git, which means the password is known to everyone who has access
            # to the repository, and everyone who ever cloned it.
            - name: DB_PASSWORD
              value: "Propusk2019!"
          # Infinite loop: once every ten seconds it prints a line to the log. What goes to the log is not the
          # password itself, but its sha256 fingerprint — the first twelve characters. From the fingerprint
          # you can see that the password changed, but you cannot recover the value from it.
          # In real services logs are written exactly this way.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          # The appetite is tiny: this is a demonstration, not a workload.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
