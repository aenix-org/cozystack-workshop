---
# Lab 13. Application definition for the Cozystack catalog — that very "catalog entry".
#
# On its own this object deploys nothing. It ties together three things: your chart
# (what to deploy), a new object type in the API (how the application is ordered) and a card
# in the dashboard (what a person sees along the way). Until it exists, the chart stays a folder
# of files that the platform knows nothing about, and the application list next to Postgres and
# Redis is empty.
#
# Applied with a single command, without a namespace:
#   kubectl apply -f applicationdefinition.yaml
#
# IMPORTANT: this object is CLUSTER-SCOPED — it has no namespace, there is one per whole
# cluster. A tenant CANNOT apply it, this has been verified:
#   kubectl auth can-i create applicationdefinitions   ->   no
# Your job ends when the file is written and checked locally.
# It is applied by the platform admin. See README, section "Where your
# permissions end".
apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: guest-pass
spec:
  # --- HOW IT LOOKS IN THE API ----------------------------------------------
  application:
    # Kind of the new object type. After applying, a
    # kind: GuestPass appears in the cluster, and you can work with it via the usual kubectl.
    kind: GuestPass
    plural: guestpasses
    singular: guestpass
    # The values schema — the same one that sits in the chart as the file values.schema.json,
    # only written on a single line. The API uses it to reject invalid
    # values, and the dashboard uses it to render the creation form.
    openAPISchema: |-
      {"title":"Chart Values","type":"object","properties":{"replicas":{"description":"Number of application replicas.","type":"integer","default":2},"greeting":{"description":"Text shown on the main page.","type":"string","default":"Order a pass for your guest"},"external":{"description":"Enable external access from outside the cluster.","type":"boolean","default":false},"resources":{"description":"Explicit CPU and memory configuration.","type":"object","default":{},"properties":{"cpu":{"description":"CPU available to each replica.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true},"memory":{"description":"Memory (RAM) available to each replica.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true}}}}}

  # --- WHAT TO DEPLOY ----------------------------------------------
  release:
    # Release name = prefix + object name. A GuestPass object named `main`
    # deploys as release `guest-pass-main`. The prefix is mandatory and needed
    # so that releases of different applications do not collide by name.
    prefix: guest-pass-
    labels:
      # With the same key Cozystack distributes tenant releases across Flux shards.
      # Without it there is no one to reconcile the release.
      sharding.fluxcd.io/key: tenants
    chartRef:
      # Where to take the chart from. Allowed kinds: OCIRepository, HelmChart,
      # ExternalArtifact. External catalogs usually arrive via
      # GitRepository -> HelmChart, and their namespace is cozy-public.
      kind: HelmChart
      name: cozystack-guest-pass
      namespace: cozy-public

  # --- HOW IT LOOKS IN THE DASHBOARD ------------------------------------------
  dashboard:
    # Catalog section. Used values are PaaS, IaaS, NaaS, Administration,
    # Networking — take an existing one rather than inventing your own,
    # otherwise the application ends up in a section with a single item.
    category: PaaS
    singular: Guest Pass
    plural: Guest Passes
    description: Internal guest pass service for employees and reception
    tags:
      - internal
      - web
    # Icon — SVG in base64. Exactly base64, not a path and not a URL: the dashboard
    # does not go anywhere to download anything. The source sits next to it in icon.svg.
    icon: 
    # Field order in the YAML representation of the object. Cosmetic, but without it
    # the fields line up haphazardly and the form reads worse.
    keysOrder: [["apiVersion"], ["kind"], ["metadata"], ["metadata", "name"], ["spec", "replicas"], ["spec", "greeting"], ["spec", "external"], ["spec", "resources"]]
