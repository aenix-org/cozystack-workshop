# Lab 13. Default values for the "Passes" chart.
#
# These are answers to the questions the chart asks at deploy time: how many copies, what
# text on the page, whether an external address is needed. They are written here for the "nothing
# was selected" case. Whoever orders the application overrides them: in the dashboard — with form
# fields, in the terminal — with the `--set replicas=5` flag or their own file `helm install ... -f my.yaml`.
# Editing this file changes the defaults for future orders, not for already deployed ones.
#
# How the values here turn into an order form in the dashboard:
#   type       — which field to show: {int} number, {bool} toggle,
#                {string} input line, {struct} nested group of fields;
#   Description — the field label and the hint below it;
#   =value     — what is already in the field when the form is opened;
#   required-ness  — set by the required list in the schema. There is none here: every
#                parameter has a default value, so any field can be skipped.
# That is why descriptions are written in English: they are read not only by the chart author, but by anyone
# who orders the application in the dashboard.

## Comments of the form `## @param` are not decoration. From them the Cozystack generator
## (cozyvalues-gen) builds values.schema.json and the parameter table in the README.
## Format: ## @param {type} name=default-value - Description.

# How many copies of the application to keep running. One copy means downtime during a
# node restart; two survive the loss of either one.
## @param {int} replicas=2 - Number of application replicas.
replicas: 2

# Text on the main page. Exposed as a parameter because each subsidiary has
# its own, and nobody is going to build a separate image just for that.
## @param {string} greeting=Order a pass for your guest - Text shown on the main page.
greeting: "Order a pass for your guest"

# Whether the application needs an address outside the cluster. The Cozystack catalog convention:
# a field named external means the same thing across all applications — external access.
## @param {bool} external=false - Enable external access from outside the cluster.
external: false

# The size of one copy. Grouped as a separate set of fields so that in the order form it
# looks like a single "resources" block rather than two unrelated fields.
## @typedef {struct} Resources - CPU and memory for each replica.
## @field {quantity} cpu - CPU available to each replica.
## @field {quantity} memory - Memory (RAM) available to each replica.

## @param {Resources} resources - Explicit CPU and memory configuration.
resources:
  cpu: 100m
  memory: 128Mi
