# Lab 13. Service template: a stable address for the application.
#
# Copies of the application come and go, their addresses new each time. A Service gives a name
# that does not change, and spreads requests across the live copies. From a neighboring pod
# the application is reached by the release name.
#
# Substitution in double curly braces and where object names come from is
# described in templates/deployment.yaml — here everything works the same way.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # A single flag in values decides whether the application gets an address outside the cluster or not.
  # Cozystack's built-in applications work the same way: the external field.
  # The if/else construct picks one of two values at render time — the finished manifest
  # gets either LoadBalancer or ClusterIP, and no branching remains in it.
  type: {{ if .Values.external }}LoadBalancer{{ else }}ClusterIP{{ end }}
  # Whom to send traffic to. The Service selects pods by labels, not by names, so
  # it does not care how many copies there are or what they are called. The labels are the same as those
  # the Deployment assigns to its copies.
  selector:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
  # port — which port the Service itself listens on, targetPort — where it knocks inside the pod.
  # targetPort is written by name: the port named http is declared in the Deployment template.
  # If the number changes there, no edit is needed here.
  ports:
    - name: http
      port: 80
      targetPort: http
