# Lab 13. ConfigMap template: the "Passes" page and nginx configuration.
#
# The ConfigMap stores text files and serves them to the pods. The page lives here rather than
# inside the image, so the text can be changed without a rebuild: the greeting value is substituted
# at render time, and it is enough to update the release.
#
# Substitution works inside `|` blocks too: Helm processes the template file as plain
# text and knows nothing about the YAML structure. See templates/deployment.yaml for details.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
# Keys in data are file names, and what is under `|` is their entire contents.
# Each key is mounted into the container as a separate file, see volumeMounts in the Deployment.
data:
  # The page the employee will see. Two values land here: greeting from the order
  # form and the release name — so that the open page shows whose order it is.
  index.html: |
    <!doctype html>
    <html lang="en">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Guest Pass</title>
    <style>
      body{background:#0d1117;color:#e6edf3;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:12vh 5vw;margin:0}
      h1{font-size:clamp(26px,6vw,56px);margin:0 0 .3em;color:#2f6fed}
      .pod{font-family:ui-monospace,Menlo,monospace;color:#7d8590;margin-top:3em}
    </style>
    <h1>{{ .Values.greeting }}</h1>
    <p>Guest Pass service, release <b>{{ .Release.Name }}</b></p>
    <div class="pod">served by __POD__</div>
    </html>
  # nginx configuration. sub_filter replaces the __POD__ marker with the pod name at the moment the
  # page is served: this way the browser shows which of the copies answered. A separate response on /healthz
  # is needed by the readinessProbe from the Deployment — it queries exactly this address.
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location / {
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
