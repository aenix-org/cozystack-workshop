# Lab 13. Deployment template: what to run and in how many copies.
#
# Files in templates/ are blueprints, not ready-made manifests. Helm substitutes values into them
# and hands the result to the cluster: `helm template main chart` shows the rendered text without
# applying anything, `helm install main chart` applies it.
#
# Double curly braces are a substitution point. Inside them you'll find:
#   .Values.name  — a parameter value: from values.yaml if the customer didn't touch it,
#                   or from the order form in the dashboard if they chose their own;
#   .Release.Name — the release name, i.e. the name of a specific deployment of the chart.
# Text outside the braces goes into the manifest as is.
apiVersion: apps/v1
kind: Deployment
metadata:
  # Object names are assembled from the release name, not hardcoded. The same chart
  # is deployed into one namespace more than once, and a fixed name would mean the
  # second order overwrites the first. Release `main` yields a Deployment, Service and ConfigMap
  # named `main` — the name makes it obvious at a glance that they are one group.
  name: {{ .Release.Name }}
  # Labels: name is the same for every order of this application, instance distinguishes orders.
  # Objects find each other by them, and `kubectl get` output is filtered by them too.
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # How many copies to keep running. If a copy disappears, the cluster creates a new one
  # without asking — hence self-healing without an on-duty administrator.
  replicas: {{ .Values.replicas }}
  # selector tells the Deployment which pods to consider its own — by labels, not by names.
  # The labels here and the labels in template.metadata.labels must match. If they diverge,
  # the Deployment doesn't find its own copies and stamps them out again and again.
  selector:
    matchLabels:
      app.kubernetes.io/name: guest-pass
      app.kubernetes.io/instance: {{ .Release.Name }}
  # template is the pod blueprint. Everything below describes not the Deployment itself, but the
  # application copies it creates from this blueprint.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guest-pass
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Configuration hash in a pod annotation. Without it, editing the ConfigMap doesn't restart
        # the pods, and the new text won't appear until someone deletes them by hand.
        # This is the most common complaint about charts in general.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # The application runs not as root and with reduced privileges. A chart from the catalog
      # is deployed by other tenants in their namespaces, and the container's privileges are part of
      # what you promise them along with the application.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The image is written in the template and deliberately not exposed as a parameter: the customer
          # chooses the size and text, but does not swap the application itself for an arbitrary one.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # Without this variable nginx starts one worker process per node core.
          # On a node with several dozen cores there will be dozens of them, and a pod with a memory
          # limit of a hundred megabytes will die with OOMKilled before the first request. The chart ships
          # into other tenants, where nodes can be anything, so this is mandatory here.
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # The port inside the container. The name http is used further on in the probe and in the Service,
          # so that the port number is recorded in one place, not in three.
          ports:
            - containerPort: 8080
              name: http
          # requests — how much to allocate guaranteed; the scheduler picks a node by these numbers.
          # limits here are memory-only: exceed it and the container is killed and brought back up.
          # There is deliberately no CPU limit, otherwise the application hits a ceiling instead
          # of just running slower.
          # The `| quote` filter wraps the substituted value in quotes: the user
          # may enter 1, and without quotes a number would go into the manifest where a string
          # like "1" or "100m" is expected.
          resources:
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
            limits:
              memory: {{ .Values.resources.memory | quote }}
          # readinessProbe — the question "ready to accept requests?". Until /healthz answers,
          # the Service sends no traffic to this copy. Hence updates without interruption: the old
          # copy is taken out of balancing after the new one has answered.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          # The nginx page and config are mounted as files from the ConfigMap. subPath substitutes
          # exactly one file: without it the mounted directory would replace the entire /etc/nginx/
          # conf.d and the image's stock settings would disappear.
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      # The ConfigMap name is assembled from the release name, so the pod always mounts the configuration
      # of its own order, not a neighbor's.
      volumes:
        - name: page
          configMap:
            name: {{ .Release.Name }}
        - name: conf
          configMap:
            name: {{ .Release.Name }}
