# Before applying, replace tenant-workshopXX with your own namespace.
# Easier to do it across all files at once: see README, the section on substituting the number.
# Also: in the url field below, insert the presigned link from convert.sh (step 2).
#
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  source:
    http:
      url: "ВСТАВЬТЕ_PRESIGNED_URL"  # from convert.sh (the Share: line)
  storage: 10Gi
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  instanceType: u1.medium
  instanceProfile: centos.7
  runStrategy: Always
  disks:
    - name: app-1
# External access to the application is by the domain name app.<tenant>.workshop.aenix.io
# (the Ingress is created by the operator; port-forward is not needed on this path, see README).
# external LoadBalancer on this stand (Cilium + robotlb) does not work for VMs,
# so we do NOT enable external here.
