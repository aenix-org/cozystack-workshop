# Before applying, replace tenant-workshopXX with your own namespace.
# It's easier to do it across all files at once: see the README, the section on substituting the number.
#
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: convert-tools
  namespace: tenant-workshopXX
spec:
  source:
    image:
      name: ubuntu-20.04
  storage: 25Gi
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: convert
  namespace: tenant-workshopXX
spec:
  instanceType: u1.large
  instanceProfile: ubuntu
  runStrategy: Always
  disks:
    - name: convert-tools
  cloudInit: |
    #cloud-config
    password: ubuntu
    chpasswd: { expire: false }
    ssh_pwauth: true
    package_update: true
    packages: [ libguestfs-tools, virt-v2v, qemu-utils ]
    runcmd:
      - [ bash, -c, "curl -fsSL https://github.com/pgsty/mc/releases/download/RELEASE.2026-09-13T00-00-00Z/mcli_20260913000000.0.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin mcli && mv /usr/local/bin/mcli /usr/local/bin/mc && chmod +x /usr/local/bin/mc" ]