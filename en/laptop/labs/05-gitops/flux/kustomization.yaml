---
# Lab 5 · Infrastructure in Git. Task: what exactly from the repository to apply to the cluster.
#
# Applied to your `lab` cluster together with the adjacent gitrepository.yaml:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# In each object: apiVersion — the version of the description schema, kind — what we create,
# metadata.name — the object's name. These are not explained separately below.
#
# Separation of duties: GitRepository downloads the repository and applies nothing,
# this object takes what was downloaded and brings the cluster in line with it. The name Kustomization matches
# the name of the kustomize utility, but they are different things — here it is an object in the cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passes
  # Lives in the same place as the Flux services — otherwise the kustomize-controller won't pick it up.
  namespace: flux-system
spec:
  # How often to reconcile the actual state of the cluster with the one described in Git.
  # This is not "re-apply once a minute" — it is "compare once a minute and
  # fix the differences". Even if nothing changed in Git, a change made
  # by hand via kubectl edit will be silently rolled back. You will see the difference
  # a bit further into the lab, when you change something in the cluster outside of Git yourself.
  interval: 1m
  # The folder inside the repository. Everything in it goes into the cluster; files next to
  # it — for example README.md at the root — are not touched. The name `apps` was chosen by us, but it
  # must match the folder into which you put manifests in your own repository.
  path: ./apps
  # Delete from the cluster objects that have disappeared from Git.
  # Without this, Git stops being the complete description: something deleted from the repository
  # would keep running in the cluster, and no one would know about it.
  prune: true
  # Which source to look at. The name `passes` is metadata.name from gitrepository.yaml,
  # not the repository name on GitHub. Rename it there — fix it here too, otherwise Flux
  # will wait for a source that doesn't exist, and the Kustomization won't become ready.
  sourceRef:
    kind: GitRepository
    name: passes
  # Wait for the applied resources to become ready, rather than reporting back immediately after apply.
  # The difference is exactly that between "the request was submitted" and "the request was completed": without wait
  # Flux will report success even if the pods fail to come up afterwards.
  wait: true
  # How long to wait for this readiness before declaring the apply unsuccessful.
  # Three minutes — with a margin for pulling the image onto an empty node. Too small a
  # value gives false failures on a slow network, too large a one — you'll be
  # staring at "in progress" for a long time instead of a clear error.
  timeout: 3m
