---
# Lab 5 · Infrastructure in Git. The source: where Flux gets the desired state from.
#
# Applied on your `lab` cluster together with the neighboring kustomization.yaml:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# ATTENTION: REPLACE the url with the address of YOUR repository before applying: the
# ЗАМЕНИТЕ-МЕНЯ string is a stub, with it Flux will go to a nonexistent address and stall
# with an error. Check the branch too: GitHub creates new repositories with the main branch.
#
# In each object: apiVersion — the version of the description schema, kind — what we create,
# metadata.name — the name by which the object is referenced further on. Not repeated below.
#
# The only task of this object is to keep a fresh copy of the repository in the cluster.
# It applies nothing: it only downloads. The neighboring Kustomization applies things,
# and it references here by the name `passes`, so the name cannot be changed on its own.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: passes
  # flux-system — the namespace that the flux install command set up; the Flux services
  # themselves live in it. Configuration objects go there too, otherwise the services won't see them.
  namespace: flux-system
spec:
  # How often to go to Git for the new state. One minute — for the lab;
  # in production usually 1–5 minutes, and an instant reaction is done with a webhook from GitHub.
  interval: 1m
  # The repository address. It's public, so there's neither a login nor a key here —
  # this is a simplification of the training stand. In production the repository is private, and next to it
  # appears a reference to a secret with a deploy key (the secretRef field).
  url: https://github.com/ЗАМЕНИТЕ-МЕНЯ/passes-gitops
  # Which branch to consider the source of truth. What is merged into main goes to the cluster;
  # what lies in other branches does not go. This is where review comes from: a change
  # first lives in its own branch, where it can be looked at, and only a merge into main
  # makes it effective. If the repository was created with the old master branch —
  # fix it here, otherwise Flux won't find what to read.
  ref:
    branch: main
