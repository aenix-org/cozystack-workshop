---
# Lab 5 · Infrastructure in Git. Namespace for the "Passes" service.
#
# This file is not applied to the cluster by hand. You put it into your repository on
# GitHub, into the apps/ folder, and Flux carries it into the `lab` cluster — on its own, on a schedule:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# How to read any manifest: apiVersion — the version of the description schema (the cluster uses it to know
# how to parse the object), kind — what we are creating, metadata.name — the name by which the object is
# later found. These three fields are present in every object and are not explained separately below.
#
# A namespace is a logical partition inside a single cluster:
# its own name scope, its own permissions, its own quotas. The closest thing in vSphere is a folder
# in the vCenter tree or a resource pool.
#
# Why it lives in Git together with the application instead of being created by hand: when the service leaves
# the repository, Flux will remove the namespace too. No empty partition will be left behind,
# the one that six months later nobody remembers why it was created.
apiVersion: v1
kind: Namespace
metadata:
  name: passes
  # The label does not affect how the service runs — it is needed so that a single command can find everything
  # that belongs to "Passes": kubectl get all -A -l app.kubernetes.io/part-of=passes.
  # The part-of name is taken from the common set of Kubernetes labels, not invented by us:
  # third-party tools (monitoring, exports) look for exactly this one.
  labels:
    app.kubernetes.io/part-of: passes
