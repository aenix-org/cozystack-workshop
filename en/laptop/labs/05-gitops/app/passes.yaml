---
# Lab 5 · Infrastructure in Git. The "Pass" service itself: four objects in one file.
#
# Not applied to the cluster by hand. The file is placed into its own repository on GitHub, in the
# apps/ folder, next to namespace.yaml, and Flux carries it into the `lab` cluster — on its own:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# The --- line separates objects: one file, four independent objects. The order in the file
# does not affect the creation order — the cluster will sort it out on its own.
#
# In each object: apiVersion — the version of the description schema, kind — what we are creating,
# metadata.name — the object's name, metadata.namespace — which partition of the cluster it
# lives in. These fields are not explained separately further on.
#
# None of the four objects contains a password, a key, or a token, and this is not
# by chance: whatever gets into Git stays there forever — history can be rewritten, but
# everyone who already cloned it keeps the old copy. Secrets have no place here.

# --- 1 of 4. Web server settings ----------------------------------------------------
# A ConfigMap puts a text file into the cluster separately from the application, and below (in the
# volumes section) this file is mounted inside the container. The point is to change settings without
# rebuilding the image: you edit here, commit, and a minute later the cluster has the new version.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-conf
  namespace: passes
# The key inside data becomes the file name in the container: default.conf will land in the folder
# that nginx reads at startup. The vertical bar after the name is the way to write
# multi-line text as-is in YAML, preserving line breaks.
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      # The address for the readiness check. The cluster knocks here and does not send
      # traffic to a copy until it gets a response.
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        # In the served page we replace __POD__ with the name of the machine where
        # nginx runs. Inside the pod the machine name is the pod's own name.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
    }
---
# --- 2 of 4. The page the service serves --------------------------------------------
# In this lab the page is a stub: the real application will appear later. Right now what matters
# is not what the service shows, but where it came from in the cluster. The __POD__ text in the markup
# is a substitution marker: nginx will replace it with the name of the pod that served the page, and by
# that name you will later see that there is now more than one copy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-page
  namespace: passes
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Пропуск</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 40rem;
               color: #222; }
        h1 { font-weight: 600; }
        .v { display: inline-block; padding: .2rem .6rem; border-radius: .3rem;
             background: #eef; font-family: ui-monospace, monospace; }
        .pod { margin-top: 2rem; color: #666; font-size: .9rem; }
        b { font-family: ui-monospace, monospace; color: #222; }
      </style>
    </head>
    <body>
      <h1>Сервис «Пропуск»</h1>
      <p>Заказ пропуска для гостя. Версия <span class="v">v1</span></p>
      <p>Развёрнуто из Git. Руками сюда никто не ходил.</p>
      <div class="pod">вас обслужил под <b>__POD__</b></div>
    </body>
    </html>
---
# --- 3 of 4. The application description itself -------------------------------------
# A Deployment is not "run a container" but "keep so many copies of such a container
# running". The difference shows when a copy dies: the cluster creates a new one without
# asking and without notifying. In vSphere the closest thing is HA, but there a machine restarts,
# while here a copy of the application is recreated, and this is done constantly, not only on failure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes
  namespace: passes
  labels:
    app: passes
spec:
  # How many copies to keep running. The wording matters: not "run one", but
  # "keep one". You will change this number through Git and watch what happens.
  replicas: 1
  # By what sign the Deployment recognizes its copies. This is not a list of pod names —
  # names change on every recreation — but the condition "all pods with the label app: passes".
  # The label below, in template.metadata.labels, must match this condition: if they diverge
  # the cluster will refuse to accept the manifest, because the copies would belong to no one.
  selector:
    matchLabels:
      app: passes
  # template — the pattern from which copies are stamped out. Everything inside describes one
  # pod. Editing the pattern means rolling out a new version: old copies are replaced with new ones.
  template:
    metadata:
      labels:
        app: passes
    spec:
      # Security restrictions at the level of the whole pod. In vSphere there is no analog: there
      # isolation is provided by the hypervisor, while containers share the kernel with the node, so
      # permissions have to be cut back explicitly.
      #   runAsNonRoot   do not start if the image wants to run as root
      #   runAsUser      which numeric user to run as; 65532 — the accepted
      #                  "unprivileged" identifier in minimal images
      #   seccompProfile which system calls are allowed; RuntimeDefault — a set
      #                  that cuts off the obviously dangerous and breaks nothing
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # The same restrictions, but now on a specific container.
          #   allowPrivilegeEscalation: false  the process will not be able to gain more permissions
          #   capabilities.drop: ["ALL"]       take away all special kernel privileges
          #                                    (change the network, mount, change the time);
          #                                    the web server needs none of them
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The image is taken from a public registry — in the next lab security will forbid this, and
          # the address will change to our own Harbor. The unprivileged variant was chosen not for looks:
          # the regular nginx image listens on port 80 and wants root permissions for that, and with
          # runAsNonRoot above it would not start at all.
          # The version is pinned (1.27-alpine), not latest: otherwise the same
          # manifest would deploy a different application tomorrow, and you would not know about it.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # The port the application listens on. The name `http` is not decoration: it is
          # referenced by the readiness check below and the Service at the end of the file. If you change
          # the port number, you will have to change it in one place, not three.
          ports:
            - containerPort: 8080
              name: http
          # requests — how many resources are guaranteed to be reserved; by this number
          # the scheduler picks a node. limits — the ceiling above which it will not be allowed.
          # Understating requests means more will fit on the node than it can handle;
          # exceeding the memory limit — the container is killed, exceeding CPU — it is throttled.
          # 20m = twenty thousandths of a core, Mi = megabytes. The values here are small
          # because there is a single, small node in the lab.
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # The readiness check: the cluster knocks at this address and does not send traffic
          # to a copy until it gets a response. Without it the Service would send requests to
          # an nginx that has not yet come up, and the user would see an error on every rollout.
          # Flux also waits for it — in kustomization.yaml we asked for wait: true.
          #   initialDelaySeconds  wait before the first knock, give the process time to start
          #   periodSeconds        how often to knock afterwards
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # Where inside the container to place the contents of the two ConfigMaps from the start of the file.
          # /etc/nginx/conf.d — the folder from which nginx reads settings at startup,
          # /usr/share/nginx/html — the folder from which it serves files.
          # The image itself does not change: the files appear in it at the moment of launch.
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: page
              mountPath: /usr/share/nginx/html
      # What exactly to mount. The names conf and page are internal, they link this
      # block to the volumeMounts above; name inside configMap is already the name of a real object
      # in the cluster. Get it wrong and the pod will hang waiting for a nonexistent ConfigMap.
      volumes:
        - name: conf
          configMap:
            name: passes-conf
        - name: page
          configMap:
            name: passes-page
---
# --- 4 of 4. A permanent name that all copies stand behind --------------------------
# Pods are recreated, and their addresses are new each time. The Service gives a stable name —
# passes.passes.svc.cluster.local — by which inside the cluster you can always reach
# the live copies. This is internal load balancing; from outside the cluster you cannot get here yet.
apiVersion: v1
kind: Service
metadata:
  name: passes
  namespace: passes
spec:
  # The Service's link to pods is not a list of addresses, but the condition "all pods with the label app: passes".
  # A new copy with such a label appeared — it came under load balancing on its own, nothing
  # needs to be registered. It disappeared — it was removed from the pool.
  selector:
    app: passes
  # port — on which port the Service itself answers, targetPort — where it forwards
  # inside the container. Here targetPort refers to the name `http` from the ports block above,
  # not to a number: the number can be changed in one place, and the link will not break.
  ports:
    - port: 80
      targetPort: http
