# Lab 10 · ordering a MongoDB database for passes of different kinds.
# A description of what you want to get; the platform assembles and configures the service.
# The same thing you would order with the mouse in the dashboard — only as text.
# Applied NOT to the lab cluster, but to a tenant on the management cluster:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f mongodb.yaml
#
# BEFORE APPLYING: replace tenant-workshopXX with your namespace,
# and ЗдесьВашПароль with a password you come up with.
apiVersion: apps.cozystack.io/v1alpha1
kind: MongoDB
metadata:
  name: passes
  namespace: tenant-workshopXX
spec:
  # A single copy. MongoDB is designed for a replica set of three: they vote on who
  # is primary and survive the loss of one. With a single copy there is no one to vote
  # with, and the chart enables a separate "unsafe" mode for this. Fine for a lab,
  # not for production.
  replicas: 1
  # Disk for data. A megabyte would be enough for four learning documents, but it is
  # easier to size the volume generously up front than to expand it later.
  size: 5Gi
  # replicated — volumes that have a copy on another cluster node: a node drops out,
  # the data remains.
  storageClass: replicated
  # CPU and memory allocated to the database pod. More than enough for four documents.
  resourcesPreset: s1.small
  # MongoDB branch. Changing it after the fact on a live database is not possible without an upgrade.
  version: v8
  # false — the database is reachable only from inside the cluster, no port is exposed outward.
  # You will access it from a working pod started alongside it.
  external: false
  # Sharding splits data across several sets of servers. Needed when
  # the data does not fit on a single server; four passes do fit.
  sharding: false
  # The database user and its password. Come up with your own password and remember it: it is needed
  # by the working pod (in the MONGO_URI connection string) and by the check script
  # (the MONGO_PASSWORD variable). The account is created in the service database admin —
  # that is why authSource=admin is mandatory in the connection string.
  users:
    passapp:
      password: ЗдесьВашПароль
  # The passes database and permissions in it: the passapp user is granted the admin role of this database,
  # meaning it can read, write, build indexes and change collection settings.
  # This does not grant rights to other databases.
  databases:
    passes:
      roles:
        admin:
          - passapp
  # Backups to object storage. Disabled on the learning stand.
  backup:
    enabled: false
