---
# Lab 6 · Your own private image registry. The WORKING version of the manifest.
#
# This is the same file as passes-broken.yaml, plus one place that was missing there —
# it is marked below with the words "THIS IS WHAT WAS MISSING". Apply it after you have
# seen the failure on the broken version and figured out why it happened.
#
# Applied on your `lab` cluster (not on the Cozystack management cluster — only Harbor
# itself lives there), in the default namespace:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl delete -f passes-broken.yaml
#     kubectl apply -f passes.yaml
#
# ATTENTION: HARBOR-HOST is a placeholder, not a working address. Before applying, substitute
# the address of your own Harbor; the string HARBOR-HOST appears in the file twice, sed will replace both:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # macOS
#
# In the objects below: apiVersion is the version of the description schema, kind is what we create,
# metadata.name is the object's name. They are not explained separately further on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Two copies, not one: this way the service's response will show that requests are served
  # by different pods, and that the image was downloaded to the node once but started twice.
  replicas: 2
  # The condition "my copies are pods with the label app: passes-api". The label in the pod template below
  # must match this one, otherwise the cluster will reject the manifest.
  selector:
    matchLabels:
      app: passes-api
  # The template from which the copies are stamped. Everything inside describes a single pod.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Security constraints for the whole pod: do not run as root, work as an
      # unprivileged user 10001, restrict the set of system calls to the
      # standard profile. The image is built for exactly this (see app/Dockerfile, the USER line).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # THIS IS WHAT WAS MISSING in passes-broken.yaml — these two lines, and nothing else.
      #
      # A closed registry does not hand out the image to just anyone: first you have to identify yourself. The secret `harbor`
      # (of type kubernetes.io/dockerconfigjson) stores the registry address, login and password; you
      # created it with the kubectl create secret docker-registry command. Here the secret is only
      # REFERENCED by name — and it is taken from there not by the application but by the kubelet on the node, at the
      # moment it goes to download the image. That is why the secret must be in the same
      # namespace as the pod: the kubelet looks for it exactly there and nowhere else.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # Container-level permissions: do not grab extra privileges and drop all special
          # kernel capabilities. The application needs a single network port, the rest is unnecessary.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The first part of the image name is the registry address, and that is exactly why moving to your own
          # registry changes the manifests: the image name becomes different. Were there no address at the
          # start, the cluster would go for the image to Docker Hub, and that is what security forbade.
          image: HARBOR-HOST/passes/passes-api:v1
          # The application port. The name `http` is used further on by the readiness probe and the Service,
          # so the port number is set in one place, not in three.
          ports:
            - containerPort: 8080
              name: http
          # Environment variables from which the application learns who it is and where it came from.
          # These are exactly what it prints in the response (see app/main.go, the identity struct).
          # APP_VERSION and IMAGE_REGISTRY are set as text — we write them ourselves.
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # Next — the Downward API: the cluster itself puts into the variables what it knows about the pod.
            # The application does not need to guess its own name, nor go for it to the cluster API,
            # nor carry with it the rights for such a request. The values are substituted at the moment
            # a copy starts, so each copy has its own.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — what to reserve for a copy: the scheduler picks a node by these numbers.
          # limits — the ceiling: for memory above the ceiling the container is killed, for
          # CPU it is throttled. 16Mi is enough because the application is written in Go without
          # dependencies and holds almost nothing in memory; a JVM would need two orders of magnitude
          # more. 20m is twenty thousandths of a CPU core.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Readiness probe: until the application answers on /healthz, the Service will not
          # send traffic to this copy. During a rollout of a new version the old copy is removed
          # from load balancing only after the new one has answered — so requests
          # do not fail on a process that has not yet come up.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# A permanent name behind which both copies stand. Pods are recreated and change addresses,
# the name passes-api.default.svc.cluster.local does not change. Without this object the application
# works, but there is nothing to reach it by inside the cluster — and the check in check.sh
# goes exactly here, not to the pod.
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # The link to the pods is not a list of addresses but a condition on a label. A new copy with the label
  # app: passes-api falls under load balancing on its own, there is no need to register it.
  selector:
    app: passes-api
  # port — on which port the Service itself answers; targetPort refers to the name `http`
  # from the ports block above, not to the number, so the link will not break when the number changes.
  ports:
    - port: 80
      targetPort: http
