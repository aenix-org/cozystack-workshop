---
# Lab 6 · Your own private image registry. THIS FILE IS DELIBERATELY INCOMPLETE.
#
# It won't work, and that's by design: you should see the failure with your own eyes and
# figure out for yourself what the cluster was missing. What's missing here is one thing —
# the thing the cluster calls itself to a closed registry when it comes for an image. The
# registry doesn't hand out images to just anyone, and there's nothing in this manifest
# that would help the cluster prove its right to them. Which exact line fixes this — you'll
# work out over the course of the lab; the working version sits next to it, in passes.yaml,
# and there's no point opening it before you've reasoned it through.
#
# Here there's only a Deployment, no Service: a permanent name for the service isn't needed
# yet — we won't reach a responding pod anyway, since the image doesn't download.
#
# Applied on your `lab` cluster, in the default namespace:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f passes-broken.yaml
#     kubectl get pods -l app=passes-api -w
#
# ATTENTION: HARBOR-HOST is a placeholder, not a working address. Substitute the address of
# your own Harbor, otherwise you'll get a different error than the one the file was written for
# (there are two lines with the placeholder):
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # macOS
#
# In the object below: apiVersion — the version of the description schema, kind — what we're
# creating, metadata.name — the object's name. Not explained separately further down.
#
# A Deployment is not "run a container" but "keep so many copies of such-and-such a container
# running". A copy disappears — the cluster creates a new one without asking.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # One copy: to work through the failure one is enough, and the logs and the output of
  # kubectl describe will have less noise.
  replicas: 1
  # The condition "my copies are pods with the label app: passes-api". The label in the pod
  # template below must match this one, otherwise the cluster will reject the manifest.
  selector:
    matchLabels:
      app: passes-api
  # The template copies are stamped from. Everything inside describes a single pod.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Security restrictions for the whole pod: don't run as root, work under the
      # unprivileged user 10001, limit the set of system calls to the standard profile.
      # The image is built for the same (see app/Dockerfile, the USER line).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Rights at the container level: don't gain extra privileges and drop all special
          # kernel capabilities. The application needs one network port, the rest is excess.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The first part of the image name is the registry address. This is exactly why
          # moving to your own registry changes the manifests: the image name becomes
          # different. Without the address, the cluster would go for the image to Docker Hub —
          # that is, to where the security team forbade.
          image: HARBOR-HOST/passes/passes-api:v1
          # The application's port. The name `http` is used further down by the readiness
          # probe, so the port number is set in one place, not two.
          ports:
            - containerPort: 8080
              name: http
          # Environment variables from which the application learns who it is and where it
          # came from. Exactly these it prints in its response (see app/main.go, the identity
          # struct). APP_VERSION and IMAGE_REGISTRY are set as text — those we write ourselves;
          # the next three are filled in by the cluster itself when the copy starts, the
          # application has no way to know them.
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — what to reserve for a copy: by these numbers the scheduler picks a
          # node. limits — the ceiling: for memory above the ceiling the container is killed,
          # for CPU it's throttled. 16Mi is enough because the application is in Go with no
          # dependencies. 20m is twenty thousandths of a CPU core.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Readiness probe: until the application answers on /healthz, traffic won't go to
          # the copy. Today it won't get that far — it checks an already-running process, and
          # for us an earlier step, downloading the image, will get stuck.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
