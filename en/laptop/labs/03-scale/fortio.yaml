# Lab 3. Fortio load generator: the generator itself and a stable address for its
# web interface. Two objects, separated by `---`.
#
# Applied to your `lab` training cluster, not to a tenant on the management cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f fortio.yaml
# There are no placeholders like tenant-workshopXX here — you don't need to substitute your number anywhere.
# This same file will be needed in lab 4: `kubectl apply -f ../03-scale/fortio.yaml`.
#
# The manifest's common fields (apiVersion, kind, metadata.name, selector, template,
# securityContext) are dissected line by line in ../01-deploy/rickroll.yaml and are not
# repeated here. We comment only on what is specific to the load generator.
---
# Load generator with a web interface.
# Chosen over hey/ab on purpose: you start the load with a button in the browser,
# and you see the latency histogram right there. At past workshops we lost
# people precisely on console tools.
#
# Fortio lives in the cluster as an ordinary application and hits the rickroll address from inside.
# Loading it from outside, from a laptop, would be more honest in terms of traffic, but it would run into the channel
# to the cluster, and you would be measuring your Wi-Fi rather than the application.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # One copy of the generator is enough: it produces load in many threads by itself.
  # A second copy here would only blur the picture — the counters in the web interface
  # are per-copy, and you would see half the requests.
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # The same security profile as rickroll: runs not as root, a specific
      # UID, standard seccomp. Left in on purpose — so the file can also be applied
      # in a cluster with the `restricted` profile enabled, where otherwise the pod would not start.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The latest tag is a deliberate simplification for the workshop, to avoid matching versions.
          # In a production cluster you don't do this: the image under this tag may silently
          # change between two applies, and you won't be able to reproduce yesterday's result.
          image: fortio/fortio:latest
          # The `server` mode brings up the web interface and keeps it running. Without this argument
          # Fortio would run a single pass from the command line and exit, and the cluster
          # would restart the container in a loop.
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            # The request is higher than rickroll's own (20m): the generator needs room on the node
            # in advance, otherwise the scheduler will pack it in tightly and the ramp-up will be uneven.
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # The generator needs CPU headroom, otherwise it will hit
              # its own limit and you will be loading Fortio, not the application.
              cpu: "1"
              memory: 256Mi
---
# A stable address for the generator inside the cluster. Needed to open the web interface
# from a laptop via `kubectl port-forward svc/fortio 8081:8080` — from the outside the cluster
# publishes nothing, and there are no other doors to Fortio.
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  ports:
    # 8080 on both sides: both the service and the container. The number is the same as rickroll's
    # inside the pod, but there is no collision — each pod has its own network stack.
    - port: 8080
      targetPort: http
