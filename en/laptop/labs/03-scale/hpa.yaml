---
# Lab 3. Scaling replicas by CPU load.
# Target is 50% of requests.cpu (20m), i.e. the threshold is 10m per pod.
# Deliberately set low: the load must trigger within seconds,
# we have half an hour for the lab, not half a day.
#
# A single object. Applied on your training cluster `lab`, not in a tenant
# on the management cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f hpa.yaml
# There are no placeholders like tenant-workshopXX here — you don't need to substitute your number anywhere.
#
# Two conditions without which the object will be created but won't work:
#   1. The rickroll container has requests.cpu set — otherwise there's nothing to compute percentages from,
#      and the TARGETS column of `kubectl get hpa` will forever show <unknown>.
#   2. metrics-server is running in the cluster — the source of current pod consumption.
# Both conditions are checked by check.sh in this folder.
#
# As long as the HPA exists, the Deployment's replicas field belongs to it. You can change the number
# of copies by hand via `kubectl scale`, but the HPA will restore its own within seconds.
# That's why in lab 4 this object is deleted before rollout: two mechanisms over one field —
# a guaranteed way to not understand what happened.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # The HPA name doesn't have to match the application name — the match here is for convenience.
  # What it manages is determined by scaleTargetRef below, not by this name.
  name: rickroll
spec:
  # Who to watch and whose replicas field to change. Three fields together, because a name
  # without a type is ambiguous: a Deployment and a StatefulSet can be named the same.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rickroll
  # The corridor the HPA won't leave under any load. The lower bound is the same
  # single copy the lab started with. The upper is six: that's how many fit
  # on the training node at limits.cpu 300m and is still noticeable at a glance in the pod list.
  # Set maxReplicas: 1 and the object will be created and do nothing.
  minReplicas: 1
  maxReplicas: 6
  # What to base the decision on. There can be several metrics, then the HPA takes the one
  # that requires more copies. Here there's just one — CPU.
  metrics:
    - type: Resource
      resource:
        name: cpu
        # Utilization — a fraction of the container's requests.cpu, not of the node's capacity.
        # Hence a counterintuitive consequence: the value calmly reaches 600%, and that's
        # not an error: the pod eats six times more than it reserved.
        # The alternative is AverageValue, where the threshold is set in millicores directly.
        target:
          type: Utilization
          averageUtilization: 50
  # How briskly to react. The block is optional: without it the default values are used,
  # designed for production operation, not for a demonstration.
  behavior:
    scaleUp:
      # By default Kubernetes waits for stabilization and grows slowly.
      # In a lab this looks like "nothing is happening", so we speed it up.
      stabilizationWindowSeconds: 0
      # No more than two new copies every fifteen seconds. The step was chosen empirically:
      # growth is seen as growth, not as an instant jump from one straight to six,
      # in which the participant has nothing to observe.
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      # But downward it's the opposite — not instant, otherwise the pods would disappear
      # before the participant manages to observe them.
      # A minute instead of the default five: the lab runs for half an hour, waiting five of them
      # for the scale-down has nothing to fill it with. In a production cluster a long window is actually useful —
      # it dampens the seesaw on uneven load.
      stabilizationWindowSeconds: 60
