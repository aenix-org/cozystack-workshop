---
# Lab 7 · turning the cache on for real. Applied on top of the already-deployed passes-api
# in your `lab` cluster (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch.yaml
#
# This is a patch, not a full manifest: it describes only what changes. Everything else —
# the image, labels, probes, resources — stays untouched from passes-api.yaml. That is why the
# file starts straight from spec: the path down to the container mirrors the Deployment
# structure so the cluster understands exactly where to apply the edit.
#
# The container name `api` is not decoration but an address: the cluster uses it to find the
# right container in the list. Get the name wrong and instead of an edit you get a second container.
#
# Substitute the address of your own Redis in place of REDIS-ADDR — it is a placeholder, not a hostname.
# You take the address from the dashboard, in the card of your managed Redis application.
spec:
  template:
    spec:
      containers:
        - name: api
          # env lists in Kubernetes are merged by the name field, so the three entries below
          # are added to those already in the Deployment rather than replacing them.
          env:
            # The appearance of this variable is what "turn the cache on" means: the application checks
            # it at startup and, if it is set, goes to Redis first. Empty or
            # missing — it works as before, hitting the directory on every request.
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
            # We do not write the password as text: it arrives from a secret that you
            # will create with a separate command. In a manifest that lives in Git,
            # a password has no place.
            #
            # secretKeyRef is a reference: name — the name of the secret object in the same cluster,
            # key — which field inside it to take. The value is substituted when the
            # pod starts and never appears in the file.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
            # How many seconds a record lives in the cache. Sixty — because the
            # employee directory changes once a day, not once a second.
            #
            # A longer term — we hit the directory less often, but serve a stale
            # surname for longer. A shorter one — the data is fresher, the gain is smaller. This is a trade-off,
            # not a setting with a correct value.
            - name: CACHE_TTL
              value: "60"
