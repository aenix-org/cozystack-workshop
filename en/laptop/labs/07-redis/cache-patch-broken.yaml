---
# Lab 7 · THIS PATCH IS INTENTIONALLY INCOMPLETE. It exists so that you can see what
# "we sort of turned the cache on, but it didn't get any faster" looks like. The working version is in cache-patch.yaml.
#
# Applied in your `lab` cluster (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch-broken.yaml
#
# No need to peek at the answer. Apply it, make a couple of requests, and look at the
# application logs: kubectl logs -l app=passes-api. The application tells you what's wrong with it
# — the point is to read the message and figure out what this file is missing.
#
# Substitute your own Redis address in place of REDIS-ADDR (see the step about finding the address).
# You must not leave the placeholder: then you'll get a different error, not the one this whole thing was set up for.
spec:
  template:
    spec:
      containers:
        # The container name is the address by which the cluster finds the place to patch.
        - name: api
          env:
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
