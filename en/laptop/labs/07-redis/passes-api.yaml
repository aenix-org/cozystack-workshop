---
# Lab 7 · the "Pass" service, version v2 — the one that can work with a cache.
# The cache is NOT enabled here yet: first we measure how bad things are without it. It gets
# enabled later, with the cache-patch.yaml patch from this same folder.
#
# Where it is applied: your `lab` cluster (export KUBECONFIG=~/lab.kubeconfig).
# Command: kubectl apply -f passes-api.yaml
#
# HARBOR-HOST is a placeholder, not an address. Substitute the address of your own Harbor
# (see hr-legacy.yaml, which also has the sed command to replace it across all files at once).
#
# The file has two objects separated by `---`: a Deployment (copies of the application) and a
# Service (a stable name for them). apiVersion, kind and metadata.name are not commented further down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Two copies, not one, so that later the key property of the cache becomes visible: it is shared.
  # One pod put a response into Redis, another took it from there, even though it never went to the directory itself.
  replicas: 2
  # By this label the Deployment tells its own pods from others. It must match the label
  # in the template below, otherwise the object won't find what it created itself.
  selector:
    matchLabels:
      app: passes-api
  # template is the pod template: what each copy is assembled from.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Pod-level security requirements: not as root, a restricted set of system
      # calls. In a cluster with policies enabled a pod without these fields won't be admitted.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # What the cluster presents to the closed Harbor when pulling the image. Without a reference
      # to this secret the pod will get stuck in ImagePullBackOff.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # The container's privileges are trimmed to the minimum: no escalation, no kernel privileges.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The same image as the directory. Only the MODE below separates them.
          image: HARBOR-HOST/passes/passes-api:v2
          # The port name is needed so that the probe and the Service reference a name, not a number.
          ports:
            - containerPort: 8080
              name: http
          # All the application's behavior is set here. Note: the REDIS_ADDR and REDIS_PASSWORD
          # variables are not in the list — and that is exactly why the cache is off,
          # and every request honestly goes to the slow directory.
          env:
            # MODE=api — this instance works as the "Pass" service itself.
            - name: MODE
              value: "api"
            # The version and registry are not needed by the application to run — they are visible in the response to "/"
            # and let you confirm that exactly what you just built is running.
            - name: APP_VERSION
              value: "v2"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # Where to go for data. A service name, not an address: the directory's copies
            # can be recreated any number of times, the name doesn't change.
            - name: HR_URL
              value: "http://hr-legacy.default.svc.cluster.local"
            # Who runs the request and where. The cluster fills in these three values itself:
            # nobody knows them in advance. They end up in the service's response, and by them you can see
            # which copy and on which node answered — this will come in handy during measurements.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests is what gets reserved when a node is chosen, limits is the ceiling. A one-core ceiling
          # here is not greed: under load the application hits it rather than eating up the
          # whole node, and the measurement shows the directory's latency, not a fight over the CPU.
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # Until /healthz answers, the Service won't send a single request to this copy.
          # During an update this same field saves you from an outage: the old copies aren't removed
          # until the new ones report readiness.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — a single stable name for both copies and load distribution between them.
# Pods get recreated and change IP, the name passes-api stays. Both Fortio and the check
# script reach the service by this name.
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # The label by which the Service gathers the list of live copies. If it doesn't match the pods' label,
  # the Service will exist and lead nowhere.
  selector:
    app: passes-api
  ports:
    # Externally they reach port 80, inside the pod it goes to the port named http (8080).
    - port: 80
      targetPort: http
