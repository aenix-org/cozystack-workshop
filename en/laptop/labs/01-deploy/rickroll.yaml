# Lab 1. The entire rickroll training app in a single file: nginx settings, the page,
# the deployment itself, and a permanent address to reach it. Four objects, separated by `---`.
#
# Applied on your training cluster `lab`, not in a tenant on the management cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll.yaml
# There are no placeholders like tenant-workshopXX here — you don't need to substitute your number anywhere.
#
# The fields that repeat across all four objects are covered once here:
#   apiVersion — the API group this object type lives in;
#   kind       — the object type itself;
#   metadata.name — the name by which the object is later looked up via `kubectl get`.
# A name is unique within its own type, so the Deployment and Service below are both called
# rickroll and don't conflict.
---
# nginx settings. They don't change between page versions, so they're kept separately.
# ConfigMap — a settings file that lives in the cluster on its own and is placed
# inside the container at startup. The point is to change settings without rebuilding
# the image. The `default.conf` key becomes the file name in the directory where the volume is mounted.
#
# Everything below the indent after `|` is not YAML but the verbatim contents of the file. Lines
# with a hash inside this block end up in the nginx config as-is, rather than disappearing during
# parsing. For the same reason, no comments were added to the page block below:
# it's HTML, and a hash there would be visible to the user on screen.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-conf
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      location / {
        # The whole point of the lab: nginx substitutes its own pod name right into the HTML.
        # $hostname inside the pod is exactly the pod name.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
---
# The page, version 1. A separate object from the settings — so that in lab 4 the app can be
# switched to the second version without touching the nginx config or rebuilding the image.
# The -v1 suffix in the name is not decoration: rickroll-page-v2 will appear alongside it, and switching
# the volume between them is exactly what a new-version rollout is.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v1
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Never Gonna Give You Up</title>
    <style>
      body{background:#0d0d12;color:#e8e8ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#ff0057,#ffb800,#00e0ff,#ff0057);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#9aa0b5;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#6f7690}
      .pod b{display:block;margin-top:.4em;color:#00e0ff;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#4d5366;font-size:14px}
    </style>
    <h1>Never Gonna Give You Up</h1>
    <p class="lyr">Never gonna let you down &middot; Never gonna run around and desert you</p>
    <div class="pod">served by pod<b>__POD__</b></div>
    <p class="hint">Refresh the page. Once there are more replicas, the name will start changing.</p>
    </html>
---
# The app itself. Deployment describes the desired state — which image to run,
# how many copies to keep, how to replace them on update. From there the cluster itself brings
# reality to match this description and keeps watching it continuously, not just once at creation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rickroll
  labels:
    app: rickroll
spec:
  # How many copies to keep running. The wording is exactly this: not "start one",
  # but "keep one". If a copy disappears, the cluster creates a new one without asking. In lab 3
  # autoscaling will start changing this same field, so you no longer touch it by hand.
  replicas: 1
  # By which label the Deployment considers pods its own. The label here and the label in the template
  # below must match: on a mismatch the object won't be created at all.
  selector:
    matchLabels:
      app: rickroll
  # The pod template — every copy is stamped from it. Editing any field inside template
  # means a new revision of the app and replacing copies one by one (that's exactly lab 4).
  # Editing fields outside template (for example, replicas) does not create a revision.
  template:
    metadata:
      labels:
        # The same label hangs on the pods themselves: the Service at the end of the file finds them by it.
        app: rickroll
    spec:
      # Requirements of the `restricted` security profile at the whole-pod level: running
      # not as root, a specific UID, and the standard seccomp profile. In a corporate
      # cluster with `restricted` enabled, a pod without these fields won't be admitted to run,
      # and the rejection comes at pod creation time, not at manifest apply.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # The same strictness, but at the container level: the process inside is forbidden
          # to escalate its privileges, and all linux capabilities are taken away from it.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # An unprivileged variant: listens on 8080 and runs not as root.
          # This alone is enough for the `baseline` profile, but not `restricted` — that one needs
          # explicit securityContext on the pod and the container, set above. In a
          # corporate cluster it's usually `restricted` that's enabled.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # By default nginx spins up one worker process per node core. On a training
          # machine with one core that's one process, but on a production node with 64 cores it's 64,
          # and a pod with a small memory limit dies with OOMKilled before the first request.
          # The autotune counts workers by the CPU limit: at 300m that's one process.
          # Via an environment variable, not via -g: the directive is already in the image's base
          # config, and a second declaration crashes nginx with a "duplicate" error.
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # The port is given a name, not just a number: `http` is referenced by the readinessProbe
          # below and by the Service's targetPort. If the number changes, you edit it in one place.
          ports:
            - containerPort: 8080
              name: http
          # Two different things that are constantly confused. requests — how much of a resource
          # to reserve guaranteed; the scheduler picks a node by it, and autoscaling in lab 3
          # also computes load in percent from it.
          # limits — the ceiling above which it isn't allowed to rise: on CPU it's throttled
          # when it hits the wall, on memory the container is killed.
          resources:
            # Deliberately tiny: there will be many such apps at the workshop.
            # 20m is two hundredths of a core. The value is low on purpose: the smaller
            # requests is, the faster load crosses the threshold and the copy growth in lab 3
            # is visible in seconds, not half an hour.
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          # Readiness check. Until a response arrives at this address, the cluster does not
          # route traffic to the copy. For its sake a separate location /healthz with an "ok"
          # response is set up in the nginx config. This field is what pays for the zero-downtime rollout
          # in lab 4: the old copy is shut down only after the new one has responded.
          # Remove it — and the update will start dropping requests.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            # Two seconds before the first knock — arrived at by experience. Less makes no
            # sense, nginx takes that long to start; more would stretch out every rollout for nothing.
            initialDelaySeconds: 2
          # Where to place the ConfigMap contents inside the container. The directories are chosen
          # not arbitrarily: from the first nginx serves files, from the second it reads settings.
          # Without these two lines both ConfigMaps would just sit in the cluster,
          # and nginx would show its default page.
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
      # Which ConfigMaps to attach to the pod. The volume name here ties it to the entry
      # in volumeMounts above — the names are what must match; the order doesn't matter for the binding.
      # But it does matter for lab 4, see the warning below.
      volumes:
        # ATTENTION: this volume must be first (volumes[0]).
        # Lab 4 switches the page version with a patch by index.
        # JSON Patch addresses a list element by number, not by name. Swap the volumes
        # around — and the patch will silently replace the nginx settings instead of the page, the app
        # will break, and the error message will be talking about something else entirely.
        - name: page
          configMap:
            name: rickroll-page-v1
        - name: conf
          configMap:
            name: rickroll-conf
---
# The app's permanent address. Copies are born and die, their addresses change, but the name
# `rickroll` inside the cluster stays the same — that's how neighbors call the app.
# The cluster keeps the list of live copies behind this name itself, by labels.
apiVersion: v1
kind: Service
metadata:
  name: rickroll
spec:
  # Who to put behind this address: all pods with such a label, whoever created them.
  # Hence a typical nuisance — a stray pod with the label app: rickroll
  # will silently end up in the load balancing and start answering your users. The check.sh
  # script in this folder separately verifies that there are no such impostors.
  selector:
    app: rickroll
  ports:
    # port — which port the service itself answers on, targetPort — where it knocks inside
    # the pod. Here targetPort is set by the container port's name, not a number: if the
    # number in the container changes, you won't have to edit this file.
    - port: 80
      targetPort: http
