---
# Lab 11. The build itself: a script in a ConfigMap and a Job that runs it.
# Two objects in one file, separated by a `---` line.
#
# Applied to your training cluster `lab`, not to the tenant on the management cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f android-build.yaml
# There are no placeholders like tenant-workshopXX here — you don't need to substitute your number anywhere.
#
# Before applying, two objects must already exist in the cluster, otherwise the build pod won't start:
# the cluster doesn't mount what isn't there, and the pod keeps waiting.
#     configmap/propusk-src   sources: kubectl apply -f propusk-src.yaml
#     secret/bucket-creds     four bucket access keys, entered by hand
#
# Job, not Deployment: a build has an end. A Deployment treats a finished process
# as a failure and spins up a fresh copy — the build would loop and never stop.
#
# WHY THE BUILD SCRIPT LIVES AS A SEPARATE OBJECT rather than a string in the Job's own command field:
#   - sixty lines of shell inside a YAML field can't be read or checked: here it's
#     an ordinary file that the editor highlights and that accepts `bash -n`;
#   - you can see it in full with one command: kubectl get configmap android-build-script -o yaml;
#   - you can fix the build without touching the job definition, and vice versa.
# The price of convenience: the script lives separately from the Job. Change the ConfigMap — a
# build already running won't notice; only the next run will see the new text.
apiVersion: v1
kind: ConfigMap
metadata:
  name: android-build-script
data:
  # Five build steps — exactly the commands you'd type by hand on a build server.
  # The container starts almost empty: Java and Gradle come from the image, the rest the script
  # brings with it.
  #   1/5  downloads the command-line tools — the utilities used to install the Android SDK itself (1-2 min)
  #   2/5  accepts licenses and installs the SDK, platform 34 and build-tools. The longest step,
  #        5-15 minutes, and the whole time the log is silent: sdkmanager prints no progress
  #        in non-interactive mode. Silence here is not a hang
  #   3/5  gradle :app:assembleDebug — compiles the sources from /src into an APK (3-8 minutes)
  #   4/5  installs mc, the console client for object storage
  #   5/5  puts the APK into the bucket under two names: a dated one and propusk-latest (seconds)
  #
  # Every build takes equally long: there's no cache, the /work disk is disposable (see emptyDir
  # at the end of the file). On a real build server there'd be a persistent volume instead, and a second
  # build would finish in minutes.
  #
  # Below is the verbatim content of the build.sh file, not YAML. The hash lines inside it
  # go into the script as-is: they are shell comments, and there's no need to remove them.
  build.sh: |
    #!/usr/bin/env bash
    # Here set -e is appropriate: this isn't a check, it's a build. If a step fails —
    # continuing is pointless, the Job should finish with an error and remain
    # in the cluster with its logs.
    set -euo pipefail

    WORK=/work
    export HOME="$WORK"
    export ANDROID_SDK_ROOT="$WORK/android-sdk"
    export ANDROID_HOME="$ANDROID_SDK_ROOT"
    export GRADLE_USER_HOME="$WORK/gradle-home"
    # The Gradle daemon isn't needed in a disposable container: it lives for the next
    # build, and there will be no next build in this container.
    # -Duser.home is mandatory, and it's not a duplicate of export HOME above. Java takes the home
    # directory not from the environment variable but from the system user record, and an
    # unprivileged uid has none — Gradle substitutes "?" and fails at packaging the
    # APK: it looks for the signing key at a path like /work/project/app/?/.android/.
    export GRADLE_OPTS="-Xmx3g -Dorg.gradle.daemon=false -Duser.home=$WORK"

    CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
    MC_URL="https://dl.min.io/client/mc/release/linux-amd64/mc"

    echo "== 1/5 installing Android command-line tools =="
    mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    cd "$ANDROID_SDK_ROOT/cmdline-tools"
    curl -fsSL -o tools.zip "$CMDLINE_TOOLS_URL"
    # unzip isn't in every base image, but jar from the JDK can unpack zip.
    unzip -q tools.zip 2>/dev/null || jar xf tools.zip
    rm -f tools.zip
    mv cmdline-tools latest
    export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

    echo "== 2/5 accepting licenses and downloading the SDK (the longest step) =="
    # `yes` receives SIGPIPE when sdkmanager closes its input, and returns
    # a non-zero code. With set -o pipefail that would fail the build for no reason,
    # so the return code is suppressed here deliberately. If the licenses really
    # weren't accepted — the next command will say so.
    yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
    sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
      "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    echo "== 3/5 building the APK =="
    # The ConfigMap is mounted read-only, and Gradle writes next to the sources,
    # so the tree is first copied to disk.
    # -L dereferences symbolic links: a ConfigMap is mounted not as files,
    # but as links into the internal ..data directory, and without -L the links would end up in the project.
    # A glob instead of /src/. — so that this internal directory itself isn't copied.
    mkdir -p "$WORK/project"
    cp -rL /src/* "$WORK/project/"
    cd "$WORK/project"
    gradle --no-daemon :app:assembleDebug

    APK="$WORK/project/app/build/outputs/apk/debug/app-debug.apk"
    ls -l "$APK"

    echo "== 4/5 installing the S3 client =="
    # We put the client in the working directory, NOT in /usr/local/bin. The pod runs as
    # an unprivileged user, and the image's system directories belong to root:
    # writing there would end in Permission denied — and right here, at the fourth step,
    # i.e. after half an hour of building. The /work directory belongs to us, we can write to it.
    mkdir -p "$WORK/bin"
    curl -fsSL -o "$WORK/bin/mc" "$MC_URL"
    chmod +x "$WORK/bin/mc"
    # PATH is the list of directories where the shell looks for commands. We append ours so that further on
    # we can write just `mc` instead of the full path.
    export PATH="$WORK/bin:$PATH"

    echo "== 5/5 uploading the APK to the bucket =="
    # The accessKey/secretKey/endpoint/bucketName variables come from the Secret
    # via envFrom. We suppress the alias set output: no need for it to print anything to the log.
    # For the same reason there's no set -x in the script — it would print the keys.
    # The alias is named builds, not lab: the word `lab` names the training cluster in all the labs,
    # and one shouldn't confuse the two.
    mc alias set builds "https://${endpoint}" "${accessKey}" "${secretKey}" >/dev/null
    STAMP="$(date -u +%Y%m%d-%H%M%S)"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-${STAMP}.apk"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-latest.apk"
    # A marker line: check.sh uses it to tell "the Job ran" from "the APK arrived".
    echo "APK-UPLOADED ${bucketName}/propusk/propusk-${STAMP}.apk"
    mc ls --recursive "builds/${bucketName}/propusk/"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: propusk-build
spec:
  # How many times to recreate the pod if the build fails. Zero would be more honest,
  # but the network sometimes blinks while downloading the SDK, and a second attempt is cheaper
  # than explaining "why did mine fail".
  backoffLimit: 1
  # A ceiling on the whole build. Without it a stuck build would hold the node until evening.
  # The count starts from the CREATION of the Job, not from the container start: time in Pending and
  # the node recreation a bit later in the lab also consume it. An hour wasn't enough —
  # the build died with DeadlineExceeded after the person had already waited it out.
  activeDeadlineSeconds: 7200
  # The pod template: the Job stamps out the pod that will run the build from it. The pod has no name
  # of its own — the Job appends a random suffix to its own name, so you have to find the pod
  # by the job-name label, not by name.
  template:
    spec:
      # The build pulls someone else's code from the internet and runs it right away. It doesn't need root
      # rights for that: it writes only to /work — including the S3 client, which it downloads
      # there too, because an unprivileged user won't be allowed to write to the image's
      # system directories. The same three fields were on the application
      # from the first lab and for the same reason: without them the pod won't be admitted to a cluster where
      # the `restricted` security profile is enabled.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # For a Job this is a required field. Never means: don't restart a failed pod
      # in place, but hand the decision to the Job — it will create a new one.
      restartPolicy: Never
      containers:
        - name: build
          # The same strictness at the container level: escalating one's privileges is forbidden,
          # every single linux capability is dropped.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # A ready-made image with Gradle and JDK 17. The JDK version isn't chosen arbitrarily: it
          # must match jvmTarget = "17" in app-build.gradle.kts, otherwise the build
          # will fail on a bytecode version mismatch. There's no Android SDK in the image — the
          # first step of the script downloads it, because images with the SDK inside weigh tens of
          # gigabytes and would pull longer than the SDK itself.
          image: gradle:8.9-jdk17
          # We run not what the image does by default, but our own script from the ConfigMap
          # mounted at /scripts.
          command: ["bash", "/scripts/build.sh"]
          envFrom:
            # All four keys of the secret become environment variables
            # with the same names: accessKey, secretKey, endpoint, bucketName.
            - secretRef:
                name: bucket-creds
          # The honest cost of an Android build, found by experiment. requests is how much
          # to reserve: the scheduler picks a node by this number, not by actual
          # consumption. The Kotlin compiler won't survive on less than four gigabytes.
          # limits is the ceiling: on CPU, hitting it throttles you; on memory, the
          # container is killed (OOMKilled). For comparison, the application from the first lab
          # got by on 20m of CPU and 32Mi of memory. It's precisely because of these numbers that the training
          # cluster's node has to be enlarged: the build doesn't fit into the one ordered in lab 0.
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 6Gi
          # Three volumes. Sources and script — read-only: a ConfigMap is mounted
          # read-only anyway, but an explicit readOnly says right away that the build doesn't write there.
          # It writes to /work, and that's the only place it's allowed to.
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: src
          configMap:
            name: propusk-src
            # A ConfigMap key can't contain a slash, but the mount path
            # can. This is how a flat map unfolds into the directory tree
            # that Gradle expects.
            items:
              - key: settings.gradle.kts
                path: settings.gradle.kts
              - key: build.gradle.kts
                path: build.gradle.kts
              - key: app-build.gradle.kts
                path: app/build.gradle.kts
              - key: AndroidManifest.xml
                path: app/src/main/AndroidManifest.xml
              - key: MainActivity.kt
                path: app/src/main/kotlin/io/aenix/propusk/MainActivity.kt
              - key: strings.xml
                path: app/src/main/res/values/strings.xml
        - name: scripts
          configMap:
            name: android-build-script
            # File permissions for the volume: read and execute. The script is invoked as
            # `bash /scripts/build.sh`, so the execute bit here is a safety net — it
            # will be needed by whoever one day runs the file directly.
            defaultMode: 0755
        - name: work
          # A temporary disk on the node, lives exactly as long as the pod.
          # The SDK, Gradle dependencies and the build result will land here.
          emptyDir:
            # Twelve gigabytes with headroom: the SDK, Gradle cache and build result are
            # six to eight. The ceiling is needed so a bloated build doesn't eat the node's disk
            # entirely and drag the neighboring pods down with it.
            sizeLimit: 12Gi
