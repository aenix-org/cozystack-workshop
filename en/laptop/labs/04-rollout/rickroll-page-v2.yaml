---
# Lab 4. The second version of the page — the one we roll out under load.
# It should differ noticeably: the participant looks at the browser, not at a diff.
#
# A single object. Applied to your training cluster `lab`, not to the tenant
# on the management cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll-page-v2.yaml
# There are no placeholders like tenant-workshopXX here — no need to plug in your number anywhere.
#
# The main thing people stumble on here: this apply by itself rolls out nothing.
# It puts one more settings file into the cluster next to the first one. As long as the `page` volume
# of the Deployment references rickroll-page-v1, users see the first version.
# The rollout becomes the next step of the lab — switching the volume to this ConfigMap.
# Hence the whole two-object construction: the first version stays in the cluster
# untouched, and a rollback brings it back in full, rather than reconstructing it from memory.
#
# Were we to edit the rickroll-page-v1 ConfigMap in place instead, there would be
# nowhere to roll back to, and the pods would get new content without replacing copies and without a record
# in the revision history — that is, without everything the lab is done for.
#
# The object name must not be changed: rickroll-page-v2 is referenced by the patch from the README
# and by the check in check.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v2
data:
  # Everything below the indent after `|` is the verbatim content of the index.html file
  # that will end up inside the container. This is no longer YAML: there are no comments here
  # and there cannot be — a hash would land on the page as ordinary text.
  #
  # Two things matter in the markup, which check.sh looks at: the caption «ВЕРСИЯ 2» —
  # by it the check tells the second version from the first, and the placeholder __POD__ — it is
  # replaced with the nginx pod name by the rule from the rickroll-conf ConfigMap (lab 1).
  # Remove either of them and the lab check will not pass, though the rollout will succeed.
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>We're No Strangers To Love</title>
    <style>
      body{background:#07131a;color:#e8f6ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      .tag{display:inline-block;margin-bottom:1.5em;padding:.35em 1em;border-radius:999px;
           background:#00e0ff;color:#052; font-weight:700;letter-spacing:.08em;font-size:13px}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#00ffa3,#00e0ff,#7a5cff,#00ffa3);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#7f96a3;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#5d7380}
      .pod b{display:block;margin-top:.4em;color:#00ffa3;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#3f5561;font-size:14px}
    </style>
    <div class="tag">ВЕРСИЯ 2</div>
    <h1>We're No Strangers To Love</h1>
    <p class="lyr">You know the rules &middot; And so do I</p>
    <div class="pod">вас обслужил под<b>__POD__</b></div>
    <p class="hint">Обновление прошло под нагрузкой. Посмотрите в Fortio: ошибок ноль.</p>
    </html>
