# Training Kubernetes cluster for labs 1-14.
# Before applying, replace tenant-workshopXX with your own namespace.
#
# Applied on the MANAGEMENT cluster — with the access that was issued together
# with the tenant. The kubeconfig for this cluster itself does not exist yet: it
# appears only after the cluster comes up.
#
#   kubectl apply -f cluster.yaml
#
apiVersion: apps.cozystack.io/v1alpha1
kind: Kubernetes
metadata:
  name: lab
  namespace: tenant-workshopXX
spec:
  version: v1.35
  storageClass: replicated
  controlPlane:
    # A single copy of the control plane: this is a training stand, saving
    # resources matters more than fault tolerance.
    replicas: 1
  addons:
    monitoringAgents:
      # Enable right away. Metrics collection cannot be enabled retroactively:
      # everything that happened before the checkbox was set is lost. Lab 14 relies on this data.
      enabled: true
  nodeGroups:
    md0:
      # The group can add nodes on its own if the copies start running out of space.
      # In the scaling lab it won't get that far: there the copies grow, not the nodes.
      minReplicas: 1
      maxReplicas: 3
      instanceType: u1.medium
      diskSize: 20Gi
      storageClass: replicated
