# Lab 13. Default values for the "Passes" chart.
#
# These are the answers to the questions the chart asks at deployment time: how many replicas,
# what text goes on the page, whether an external address is needed. They are recorded here for the
# "nothing was selected" case. Whoever orders the application overrides them: in the dashboard with
# form fields, in the terminal with the `--set replicas=5` flag or their own file `helm install ... -f my.yaml`.
# Editing this file changes the defaults for future orders, not for already deployed ones.
#
# How values from here turn into the order form in the dashboard:
#   type       — which field to show: {int} a number, {bool} a toggle,
#                {string} a text input, {struct} a nested group of fields;
#   Description — the field label and the hint beneath it;
#   =value     — what is already in the field when the form is opened;
#   requiredness — set by the required list in the schema. There is none here: every
#                parameter has a default value, so any field can be skipped.
# That is why descriptions are written in English: they are read not only by the chart author, but by anyone
# who orders the application in the dashboard.

## Comments like `## @param` are not decoration. The Cozystack generator
## (cozyvalues-gen) uses them to assemble values.schema.json and the parameter table in the README.
## Format: ## @param {type} name=default-value - Description.

# How many application replicas to keep running. One replica means downtime while
# a node restarts; two survive the loss of either one.
## @param {int} replicas=2 - Number of application replicas.
replicas: 2

# Text on the main page. Exposed as a parameter because each subsidiary has its own,
# and no one will build a separate image just for that.
## @param {string} greeting=Order a pass for your guest - Text shown on the main page.
greeting: "Order a pass for your guest"

# Whether the application needs an address outside the cluster. Cozystack catalog convention:
# a field named external means the same thing for all applications — external access.
## @param {bool} external=false - Enable external access from outside the cluster.
external: false

# Size of a single replica. Exposed as a separate group of fields so that in the order form it
# looks like one "resources" block rather than two unrelated fields.
## @typedef {struct} Resources - CPU and memory for each replica.
## @field {quantity} cpu - CPU available to each replica.
## @field {quantity} memory - Memory (RAM) available to each replica.

## @param {Resources} resources - Explicit CPU and memory configuration.
resources:
  cpu: 100m
  memory: 128Mi
