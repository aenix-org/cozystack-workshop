---
# Lab 13. This is what ordering your application will look like AFTER
# the admin applies applicationdefinition.yaml. Apply it in your tenant:
#   kubectl apply -f guestpass-example.yaml
#
# ATTENTION: tenant-workshopXX is a placeholder, not a namespace name. Replace XX with
# your tenant number before applying, otherwise kubectl will refuse: there is no such namespace,
# and you won't be let into someone else's.
#
# Note: the apps.cozystack.io group is the same one used by Bucket,
# VMInstance and the other catalog applications. Your application will line up
# alongside them, not off to the side.
#
# You cannot apply this file before the admin has registered the definition:
# kubectl will respond `no matches for kind "GuestPass"`.
apiVersion: apps.cozystack.io/v1alpha1
kind: GuestPass
metadata:
  name: main
  namespace: tenant-workshopXX
# The fields in spec are exactly the parameters described in chart/values.yaml and shown
# by the order form in the dashboard. Here they are written out as text: the same as clicking
# the button in the dashboard, but such a file can be reviewed, put in Git and rolled back.
spec:
  replicas: 2
  greeting: "Order a pass for your guest"
  external: false
  resources:
    cpu: 100m
    memory: 128Mi
