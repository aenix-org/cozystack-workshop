# Lab 9 · ordering a ClickHouse database for analytics over the access-pass log.
# A description of what you want to get; the platform assembles and configures the service.
# The same thing you would order with the mouse in the dashboard — only as text.
# Applied NOT to the lab cluster, but to a tenant on the management cluster:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f clickhouse.yaml
#
# BEFORE APPLYING: replace tenant-workshopXX with your namespace,
# and ЗдесьВашПароль with a password you come up with.
apiVersion: apps.cozystack.io/v1alpha1
kind: ClickHouse
metadata:
  name: analytics
  namespace: tenant-workshopXX
spec:
  # One replica and one shard. In production you keep at least two replicas, otherwise losing a node
  # means data unavailability, — but we need a million rows, not fault
  # tolerance, and an extra replica would just eat up the stand's resources.
  replicas: 1
  shards: 1
  # Disk for table data. A million rows from this lab will take up tens of megabytes:
  # columnar storage with dictionaries compresses such a log very strongly.
  size: 5Gi
  # A separate disk for the server's system logs, including the query log.
  logStorageSize: 2Gi
  # After how many days to discard the query log. We will be looking into it.
  logTTL: 15
  # replicated — volumes that have a copy on another cluster node: a node dropped,
  # the data remained.
  storageClass: replicated
  # 1 processor, 4 GB. ClickHouse computes in memory, and on group-bys over a
  # million rows this is noticeable.
  resourcesPreset: u1.small
  # The database user and its password. Come up with your own password and remember it: it is needed
  # by the worker pod (variable CH_AUTH) and the verification script (variable CH_PASSWORD).
  # After creation it is visible in the dashboard, in the secret clickhouse-analytics-credentials.
  users:
    analyst:
      password: ЗдесьВашПароль
  # Backups to object storage. The data here is generated,
  # there is nothing to restore — disabled on the training stand.
  backup:
    enabled: false
  # Keeper is needed for coordination between replicas. There is one replica — nothing
  # to coordinate with, and three Keeper pods would waste resources for nothing.
  clickhouseKeeper:
    enabled: false
