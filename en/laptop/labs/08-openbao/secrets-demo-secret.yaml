# Lab 8 · step 2 of 3: the password is moved out of the Deployment into a separate Secret object.
# A "naive fix": the password is no longer visible in the application description, the developer is happy,
# the auditor is not. Why — we'll see with a single command.
#
# How this step is better than the first: the value is no longer part of the application description,
# it is now referenced by name. How it is worse than the third — the value still
# has to be written down somewhere, and here it is written right in this file.
#
#   secrets-demo-naive.yaml      the password is visible to anyone who opens the file
#   secrets-demo-secret.yaml  <- you are here: the password is in a Secret object
#   secrets-demo.yaml            there is no password in the manifest at all
#
# Where it applies: your `lab` cluster (export KUBECONFIG=~/lab.kubeconfig).
# Command: kubectl apply -f secrets-demo-secret.yaml
#
# The password in this file is a training, made-up one. The file has two objects separated by a
# `---` line: the Secret and the Deployment that references it. apiVersion, kind
# and metadata.name are not commented on further in the file.
#
# A Secret is a separate kind of object for things that must not sit in the application description.
# The cluster treats it a bit more carefully than ordinary settings: values
# are not shown in kubectl describe, read permissions are granted separately.
apiVersion: v1
kind: Secret
metadata:
  name: passes-db
# Opaque means "an arbitrary set of key-value pairs". There are special types —
# for accessing an image registry, for TLS certificates, — but here nothing
# special is needed.
type: Opaque
data:
  # This is NOT encryption. This is base64 — a way to write bytes with printable characters.
  # There is no key, no decryption password, the reverse transform can be done by anyone.
  password: UHJvcHVzazIwMTkh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # The Deployment below is the same one as in the first step. Exactly one
  # place changed: how DB_PASSWORD gets into the pod.
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # Not as root, a limited set of system calls.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Again busybox and a few lines of shell: we look at the password's path,
          # not at the application's work.
          image: busybox:1.36
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # Here is the whole difference from the first step. valueFrom instead of value means
            # "take the value from there": secretKeyRef.name — which object, key — which
            # field inside it. The substitution happens when the pod starts, and in the application
            # description only the name remains.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: passes-db
                  key: password
          # The same loop as in the first step: it prints the password's fingerprint, not the
          # password itself. The fingerprint is handy precisely for comparing steps — if it hasn't
          # changed, then the same value as before arrived in the pod.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
