# Lab 8 · ordering an OpenBao secrets store.
# The same thing you would order with the mouse in the dashboard — only as text.
# Applied NOT to the lab cluster, but to a tenant on the management cluster:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f openbao.yaml
#
# BEFORE APPLYING: replace tenant-workshopXX with your own namespace. XX is a placeholder,
# not part of the name; you received your own number together with the password. If it goes
# into someone else's tenant, you get an access denied — and that is the best possible outcome.
#
# kind: OpenBAO is not a built-in Kubernetes object, but a type added by
# Cozystack. You describe what you need, and the platform itself deploys the pods, disks,
# and services and then keeps them updated on its own. It is closer to ordering a service from
# a catalog than to installing software on a VM you were handed.
apiVersion: apps.cozystack.io/v1alpha1
kind: OpenBAO
metadata:
  # The name affects more than just the card in the dashboard: the store's internal address
  # is built from it — openbao-secrets.<namespace>.svc.cozy.local. If you rename it,
  # fix the address in secrets-demo.yaml and in the BAO_APP variable for check.sh.
  name: secrets
  namespace: tenant-workshopXX
spec:
  # One copy. In production three are used, which gives Raft replication: the chart enables
  # it itself as soon as replicas > 1. Switching back and forth requires
  # migrating the data, so the decision is made before, not after.
  replicas: 1
  # Disk for the store's data. Two gigabytes is plenty: secrets weigh bytes,
  # the space goes to version history and the audit log. You cannot shrink the volume after
  # creation, but you can usually grow it, so there is no point being stingy here.
  size: 2Gi
  # The replicated storage class means the data is kept in several copies on
  # different nodes. A node failure does not carry away all your passwords — and restoring
  # a secrets store from a backup is a separately unpleasant affair.
  storageClass: replicated
  # A ready-made "how much CPU and memory" set. The platform offers them as a list,
  # so as not to force everyone to compute requests and limits by hand.
  resourcesPreset: t1.small
  # The web interface comes up inside the cluster. We do not expose it outward:
  # external: true would attach a LoadBalancer, and we don't need it in the lab.
  ui: true
  external: false
