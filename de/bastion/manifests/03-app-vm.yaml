# Vor dem Anwenden ersetzen Sie tenant-workshopXX durch Ihren eigenen Namespace.
# Einfacher auf einmal in allen Dateien: siehe README, Abschnitt zum Ersetzen der Nummer.
# Und noch: im Feld url unten fügen Sie den presigned-Link aus convert.sh ein (Schritt 2).
#
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  source:
    http:
      url: "ВСТАВЬТЕ_PRESIGNED_URL"  # aus convert.sh (Zeile Share:)
  storage: 10Gi
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  instanceType: u1.medium
  instanceProfile: centos.7
  runStrategy: Always
  disks:
    - name: app-1
# Externer Zugriff auf die Anwendung von außen erfolgt über den Domainnamen app.<tenant>.workshop.aenix.io
# (den Ingress erstellt der Operator; port-forward wird auf diesem Weg nicht benötigt, siehe README).
# externer LoadBalancer auf diesem Stand (Cilium + robotlb) funktioniert für VMs nicht,
# daher aktivieren wir external hier NICHT.