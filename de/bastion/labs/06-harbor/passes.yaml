---
# Lab 6 · Deine eigene private Image-Registry. FUNKTIONIERENDE Version des Manifests.
#
# Das ist dieselbe Datei wie passes-broken.yaml, plus die eine Stelle, die dort fehlte —
# sie ist unten mit den Worten «DAS WAR ES, WAS FEHLTE» markiert. Wende es an, nachdem du
# den Fehlschlag der kaputten Version gesehen und verstanden hast, warum er auftrat.
#
# Wird auf deinem Cluster `lab` angewendet (nicht auf dem Cozystack-Management-Cluster — dort
# lebt nur Harbor selbst), im Standard-Namespace:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl delete -f passes-broken.yaml
#     kubectl apply -f passes.yaml
#
# ACHTUNG: HARBOR-HOST ist ein Platzhalter, keine funktionierende Adresse. Setze vor dem Anwenden die Adresse
# deines eigenen Harbor ein; die Zeichenkette HARBOR-HOST kommt in der Datei zweimal vor, sed ersetzt beide:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # macOS
#
# In den Objekten unten: apiVersion ist die Version des Beschreibungsschemas, kind ist, was wir erstellen,
# metadata.name ist der Name des Objekts. Sie werden weiter unten nicht gesondert erklärt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Zwei Kopien, nicht eine: so wird an der Antwort des Service sichtbar, dass Anfragen von
  # verschiedenen Pods bedient werden und dass das Image einmal auf den Knoten heruntergeladen, aber zweimal gestartet wurde.
  replicas: 2
  # Die Bedingung «meine Kopien sind Pods mit dem Label app: passes-api». Das Label in der Pod-Vorlage unten
  # muss mit diesem übereinstimmen, sonst weist der Cluster das Manifest zurück.
  selector:
    matchLabels:
      app: passes-api
  # Die Vorlage, nach der die Kopien gestempelt werden. Alles darin beschreibt einen einzelnen Pod.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Sicherheitsbeschränkungen für den ganzen Pod: nicht als root laufen, als
      # unprivilegierter Benutzer 10001 arbeiten, die Menge der Systemaufrufe auf das
      # Standardprofil beschränken. Das Image ist genau darauf gebaut (siehe app/Dockerfile, die USER-Zeile).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # DAS WAR ES, WAS in passes-broken.yaml FEHLTE — diese zwei Zeilen, und sonst nichts.
      #
      # Eine private Registry gibt das Image nicht an jeden heraus: zuerst musst du dich ausweisen. Das Secret `harbor`
      # (Typ kubernetes.io/dockerconfigjson) speichert die Registry-Adresse, den Login und das Passwort; du
      # hast es mit dem Befehl kubectl create secret docker-registry erstellt. Hier wird das Secret nur
      # per Namen REFERENZIERT — es nimmt es nicht die Anwendung von dort, sondern das kubelet auf dem Knoten, in dem
      # Moment, in dem es das Image herunterladen geht. Deshalb muss das Secret im selben
      # Namespace wie der Pod liegen: das kubelet sucht es genau dort und nirgendwo sonst.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # Berechtigungen auf Container-Ebene: sich keine zusätzlichen Privilegien holen und alle besonderen
          # Kernel-Capabilities abgeben. Die Anwendung braucht einen Netzwerkport, der Rest ist überflüssig.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Der erste Teil des Image-Namens ist die Registry-Adresse, und genau deshalb ändert der Umzug auf deine eigene
          # Registry die Manifeste: der Image-Name wird ein anderer. Stünde die Adresse nicht am
          # Anfang, würde der Cluster das Image im Docker Hub holen, und genau das hat die Sicherheit verboten.
          image: HARBOR-HOST/passes/passes-api:v1
          # Der Anwendungsport. Der Name `http` wird weiter unten von der Readiness-Probe und dem Service verwendet,
          # so ist die Portnummer an einer Stelle festgelegt, nicht an dreien.
          ports:
            - containerPort: 8080
              name: http
          # Umgebungsvariablen, aus denen die Anwendung erfährt, wer sie ist und woher sie kam.
          # Genau diese druckt sie in der Antwort aus (siehe app/main.go, die identity-Struktur).
          # APP_VERSION und IMAGE_REGISTRY sind als Text gesetzt — die schreiben wir selbst.
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # Weiter — die Downward API: der Cluster legt selbst in die Variablen, was er über den Pod weiß.
            # Die Anwendung muss weder ihren eigenen Namen erraten, noch dafür zur Cluster-API gehen,
            # noch die Berechtigungen für eine solche Anfrage mit sich tragen. Die Werte werden im Moment
            # des Starts einer Kopie eingesetzt, deshalb hat jede Kopie ihre eigenen.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — was für eine Kopie reserviert wird: nach diesen Zahlen wählt der Scheduler einen
          # Knoten. limits — die Obergrenze: bei Speicher über der Obergrenze wird der Container getötet, bei
          # CPU wird er gedrosselt. 16Mi reichen, weil die Anwendung in Go ohne
          # Abhängigkeiten ist und fast nichts im Speicher hält; eine JVM bräuchte zwei Größenordnungen
          # mehr. 20m sind zwanzig Tausendstel eines CPU-Kerns.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Readiness-Probe: solange die Anwendung nicht auf /healthz antwortet, schickt der Service
          # keinen Verkehr an diese Kopie. Beim Ausrollen einer neuen Version wird die alte Kopie erst dann
          # aus dem Balancing entfernt, nachdem die neue geantwortet hat — deshalb fallen Anfragen
          # nicht auf einen noch nicht hochgekommenen Prozess.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Ein dauerhafter Name, hinter dem beide Kopien stehen. Pods werden neu erstellt und ändern ihre Adressen,
# der Name passes-api.default.svc.cluster.local ändert sich nicht. Ohne dieses Objekt funktioniert die Anwendung,
# aber es gibt nichts, worüber man sie innerhalb des Clusters erreichen könnte — und die Prüfung in check.sh
# geht genau hierher, nicht zum Pod.
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # Die Verbindung zu den Pods ist keine Liste von Adressen, sondern eine Bedingung per Label. Eine neue Kopie mit dem Label
  # app: passes-api fällt von selbst unter das Balancing, man muss sie nicht registrieren.
  selector:
    app: passes-api
  # port — auf welchem Port der Service selbst antwortet; targetPort verweist auf den Namen `http`
  # aus dem ports-Block oben, nicht auf die Nummer, damit die Verbindung beim Ändern der Nummer nicht abreißt.
  ports:
    - port: 80
      targetPort: http
