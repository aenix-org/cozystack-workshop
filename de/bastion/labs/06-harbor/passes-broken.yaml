---
# Lab 6 · Deine eigene private Image-Registry. DIESE DATEI IST ABSICHTLICH UNVOLLSTÄNDIG.
#
# Sie wird nicht funktionieren, und das ist Absicht: Du sollst das Scheitern mit eigenen Augen
# sehen und selbst herausfinden, was dem Cluster gefehlt hat. Nur eines fehlt hier — das, womit
# sich der Cluster gegenüber der geschlossenen Registry ausweist, wenn er ein Image abholt. Die
# Registry gibt Images nicht an jeden heraus, und in dieser Beschreibung gibt es nichts, was dem
# Cluster helfen würde, sein Recht nachzuweisen. Welche Zeile genau das behebt — das erarbeitest du
# im Laufe der Lab; die funktionierende Version liegt daneben, in passes.yaml, und es hat keinen
# Sinn, sie vor der Durchsprache zu öffnen.
#
# Hier gibt es nur ein Deployment, keinen Service: ein stabiler Name für den Service wird noch nicht
# benötigt — wir kommen ohnehin nicht bis zu einem antwortenden Pod, da das Image nicht geladen wird.
#
# Angewendet auf deinem `lab`-Cluster, im Standard-Namespace:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f passes-broken.yaml
#     kubectl get pods -l app=passes-api -w
#
# ACHTUNG: HARBOR-HOST ist ein Platzhalter, keine funktionierende Adresse. Setze die Adresse deines Harbor ein,
# sonst bekommst du einen anderen Fehler als den, für den diese Datei geschrieben wurde (es gibt zwei Zeilen mit dem Platzhalter):
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # macOS
#
# Im Objekt unten: apiVersion — die Version des Beschreibungsschemas, kind — was wir erstellen,
# metadata.name — der Objektname. Weiter unten nicht mehr gesondert erklärt.
#
# Ein Deployment ist nicht "starte einen Container", sondern "halte so viele Kopien dieses Containers am Laufen".
# Verschwindet eine Kopie — erstellt der Cluster eine neue, ohne zu fragen.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Eine Kopie: um das Scheitern durchzugehen, reicht eine, und in den Logs und in der Ausgabe
  # von kubectl describe gibt es weniger Rauschen.
  replicas: 1
  # Die Bedingung "meine Kopien sind Pods mit dem Label app: passes-api". Das Label in der Pod-Vorlage unten
  # muss mit diesem übereinstimmen, sonst weist der Cluster das Manifest zurück.
  selector:
    matchLabels:
      app: passes-api
  # Die Vorlage, aus der Kopien gestanzt werden. Alles darin beschreibt einen einzelnen Pod.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Sicherheitsbeschränkungen für den ganzen Pod: nicht als root laufen, als
      # unprivilegierter Benutzer 10001 arbeiten, den Satz an Systemaufrufen auf das
      # Standardprofil beschränken. Das Image ist ebenfalls dafür gebaut (siehe app/Dockerfile, die USER-Zeile).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Rechte auf Container-Ebene: sich keine zusätzlichen Privilegien geben und alle besonderen
          # Kernel-Capabilities abgeben. Die Anwendung braucht einen einzigen Netzwerkport, der Rest ist unnötig.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Der erste Teil des Image-Namens ist die Registry-Adresse. Genau deshalb ändert der Umzug auf deine eigene
          # Registry die Manifeste: der Image-Name wird ein anderer. Gäbe es keine Adresse,
          # ginge der Cluster für das Image zu Docker Hub — also dorthin, wohin es die Security-Abteilung verboten hat.
          image: HARBOR-HOST/passes/passes-api:v1
          # Der Anwendungsport. Der Name `http` wird weiter unten von der Readiness-Probe verwendet,
          # sodass die Portnummer an einer Stelle gesetzt wird, nicht an zwei.
          ports:
            - containerPort: 8080
              name: http
          # Umgebungsvariablen, aus denen die Anwendung erfährt, wer sie ist und woher sie kam.
          # Genau diese gibt sie in der Antwort aus (siehe app/main.go, die identity-Struktur).
          # APP_VERSION und IMAGE_REGISTRY sind als Text gesetzt — die schreiben wir selbst; die nächsten drei
          # füllt der Cluster selbst im Moment des Starts einer Kopie, die Anwendung kann sie nicht kennen.
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — was für eine Kopie reserviert wird: anhand dieser Zahlen wählt der Scheduler einen
          # Knoten. limits — die Obergrenze: bei Speicher über der Obergrenze wird der Container getötet, bei
          # CPU wird er gedrosselt. 16Mi reicht, weil die Anwendung in Go ohne
          # Abhängigkeiten ist. 20m sind zwanzig Tausendstel eines CPU-Kerns.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Readiness-Probe: solange die Anwendung nicht auf /healthz antwortet, fließt kein Traffic zur
          # Kopie. Heute kommt es nicht dazu — sie prüft einen bereits laufenden
          # Prozess, und bei uns bleibt ein früherer Schritt hängen, das Herunterladen des Images.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
