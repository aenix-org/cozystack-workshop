---
# Lab 11. Der Build selbst: ein Skript in einer ConfigMap und ein Job, der es ausführt.
# Zwei Objekte in einer Datei, getrennt durch die Zeile `---`.
#
# Wird auf deinem Trainingscluster `lab` angewendet, nicht auf dem Tenant im Management-Cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f android-build.yaml
# Platzhalter wie tenant-workshopXX gibt es hier nicht — du musst nirgends deine Nummer einsetzen.
#
# Vor dem Anwenden müssen bereits zwei Objekte im Cluster vorhanden sein, sonst startet der Build-Pod nicht:
# der Cluster mountet nicht, was nicht existiert, und der Pod wartet weiter.
#     configmap/propusk-src   Quellen: kubectl apply -f propusk-src.yaml
#     secret/bucket-creds     vier Zugriffsschlüssel für den Bucket, von Hand eingegeben
#
# Ein Job, kein Deployment: ein Build hat ein Ende. Ein Deployment wertet einen beendeten Prozess
# als Fehler und startet eine frische Kopie — der Build würde in einer Schleife laufen und nie aufhören.
#
# WARUM DAS BUILD-SKRIPT ALS EIGENES OBJEKT LEBT und nicht als String im command-Feld des Jobs selbst:
#   - sechzig Zeilen Shell in einem YAML-Feld lassen sich weder lesen noch prüfen: hier ist es
#     eine gewöhnliche Datei, die der Editor hervorhebt und die `bash -n` akzeptiert;
#   - sie ist mit einem Befehl vollständig sichtbar: kubectl get configmap android-build-script -o yaml;
#   - du kannst den Build anpassen, ohne die Beschreibung der Aufgabe zu berühren, und umgekehrt.
# Der Preis der Bequemlichkeit: das Skript lebt getrennt vom Job. Änderst du die ConfigMap, bemerkt ein bereits
# laufender Build das nicht — nur der nächste Lauf sieht den neuen Text.
apiVersion: v1
kind: ConfigMap
metadata:
  name: android-build-script
data:
  # Fünf Build-Schritte — genau die Befehle, die du auf einem Build-Server von Hand eingeben würdest.
  # Der Container startet fast leer: Java und Gradle kommen aus dem Image, den Rest bringt das Skript
  # selbst mit.
  #   1/5  lädt die command-line tools herunter — die Werkzeuge, mit denen das Android SDK selbst installiert wird (1-2 Min)
  #   2/5  akzeptiert Lizenzen und installiert das SDK, Plattform 34 und build-tools. Der längste Schritt,
  #        5-15 Minuten, und die ganze Zeit ist es im Log still: sdkmanager gibt im nicht-interaktiven
  #        Modus keinen Fortschritt aus. Stille hier ist kein Hängenbleiben
  #   3/5  gradle :app:assembleDebug — kompiliert die Quellen aus /src in ein APK (3-8 Minuten)
  #   4/5  installiert mc, den Konsolen-Client für den Objektspeicher
  #   5/5  legt das APK unter zwei Namen in den Bucket: einem datierten und propusk-latest (Sekunden)
  #
  # Jeder Build dauert gleich lang: es gibt keinen Cache, die Platte /work ist Einweg (siehe emptyDir
  # am Ende der Datei). Auf einem echten Build-Server gäbe es stattdessen ein persistentes Volume, und der zweite
  # Build wäre in Minuten fertig.
  #
  # Unten steht der wortwörtliche Inhalt der Datei build.sh, kein YAML. Zeilen mit Rautezeichen darin
  # gelangen unverändert in das Skript: es sind Shell-Kommentare, und sie müssen nicht entfernt werden.
  build.sh: |
    #!/usr/bin/env bash
    # set -e ist hier angebracht: das ist keine Prüfung, sondern ein Build. Wenn ein Schritt fehlschlägt —
    # ist Weitermachen sinnlos, der Job soll mit einem Fehler enden und
    # mit seinen Logs im Cluster verbleiben.
    set -euo pipefail

    WORK=/work
    export HOME="$WORK"
    export ANDROID_SDK_ROOT="$WORK/android-sdk"
    export ANDROID_HOME="$ANDROID_SDK_ROOT"
    export GRADLE_USER_HOME="$WORK/gradle-home"
    # Der Gradle-Daemon wird in einem Einweg-Container nicht gebraucht: er lebt für den nächsten
    # Build, und einen nächsten Build wird es in diesem Container nicht geben.
    # -Duser.home ist zwingend und kein Duplikat von export HOME oben. Java nimmt das Home-
    # Verzeichnis nicht aus der Umgebungsvariable, sondern aus dem System-Benutzereintrag, und eine
    # unprivilegierte uid hat keinen — Gradle setzt "?" ein und scheitert beim Verpacken des
    # APK: es sucht den Signaturschlüssel unter einem Pfad wie /work/project/app/?/.android/.
    export GRADLE_OPTS="-Xmx3g -Dorg.gradle.daemon=false -Duser.home=$WORK"

    CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
    MC_URL="https://dl.min.io/client/mc/release/linux-amd64/mc"

    echo "== 1/5 ставлю Android command-line tools =="
    mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    cd "$ANDROID_SDK_ROOT/cmdline-tools"
    curl -fsSL -o tools.zip "$CMDLINE_TOOLS_URL"
    # unzip ist nicht in jedem Basis-Image vorhanden, und jar aus dem JDK kann zip entpacken.
    unzip -q tools.zip 2>/dev/null || jar xf tools.zip
    rm -f tools.zip
    mv cmdline-tools latest
    export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

    echo "== 2/5 принимаю лицензии и качаю SDK (самый долгий шаг) =="
    # `yes` erhält SIGPIPE, wenn sdkmanager seine Eingabe schließt, und liefert
    # einen Code ungleich null zurück. Mit set -o pipefail würde das den Build grundlos zum Absturz bringen,
    # deshalb wird der Rückgabecode hier bewusst unterdrückt. Wenn die Lizenzen tatsächlich
    # nicht akzeptiert wurden — sagt der nächste Befehl das.
    yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
    sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
      "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    echo "== 3/5 собираю APK =="
    # Die ConfigMap wird nur lesend gemountet, und Gradle schreibt neben die Quellen,
    # deshalb wird der Baum zuerst auf die Platte kopiert.
    # -L dereferenziert symbolische Links: die ConfigMap wird nicht als Dateien gemountet,
    # sondern als Links auf das interne Verzeichnis ..data, und ohne -L würden die Links im Projekt landen.
    # Ein Glob statt /src/. — damit dieses interne Verzeichnis selbst nicht mitkopiert wird.
    mkdir -p "$WORK/project"
    cp -rL /src/* "$WORK/project/"
    cd "$WORK/project"
    gradle --no-daemon :app:assembleDebug

    APK="$WORK/project/app/build/outputs/apk/debug/app-debug.apk"
    ls -l "$APK"

    echo "== 4/5 ставлю клиент S3 =="
    # Wir legen den Client in den Arbeitsordner, NICHT in /usr/local/bin. Der Pod läuft als
    # unprivilegierter Benutzer, und die System-Ordner des Images gehören root:
    # ein Schreiben dorthin würde mit Permission denied enden — und zwar genau hier, im vierten Schritt,
    # also nach einer halben Stunde Build. Der Ordner /work gehört uns, dorthin dürfen wir schreiben.
    mkdir -p "$WORK/bin"
    curl -fsSL -o "$WORK/bin/mc" "$MC_URL"
    chmod +x "$WORK/bin/mc"
    # PATH ist die Liste der Ordner, in denen die Shell nach Befehlen sucht. Wir hängen unseren an, damit man später
    # einfach `mc` schreiben kann statt des vollen Pfades.
    export PATH="$WORK/bin:$PATH"

    echo "== 5/5 кладу APK в бакет =="
    # Die Variablen accessKey/secretKey/endpoint/bucketName kommen aus dem Secret
    # über envFrom. Die Ausgabe von alias set unterdrücken wir: es muss nichts ins Log schreiben.
    # Aus demselben Grund gibt es im Skript kein set -x — es würde die Schlüssel ausgeben.
    # Der Alias heißt builds, nicht lab: das Wort `lab` bezeichnet in allen Labs den Trainings-
    # cluster, und das eine soll nicht mit dem anderen verwechselt werden.
    mc alias set builds "https://${endpoint}" "${accessKey}" "${secretKey}" >/dev/null
    STAMP="$(date -u +%Y%m%d-%H%M%S)"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-${STAMP}.apk"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-latest.apk"
    # Eine Markierungszeile: daran unterscheidet check.sh «der Job lief» von «das APK ist angekommen».
    echo "APK-UPLOADED ${bucketName}/propusk/propusk-${STAMP}.apk"
    mc ls --recursive "builds/${bucketName}/propusk/"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: propusk-build
spec:
  # Wie oft der Pod neu erstellt wird, wenn der Build fehlschlug. Null wäre ehrlicher,
  # aber das Netz blinzelt beim Herunterladen des SDK manchmal, und ein zweiter Versuch ist billiger
  # als die Erklärung «warum ist meiner fehlgeschlagen».
  backoffLimit: 1
  # Eine Obergrenze für den gesamten Build. Ohne sie würde ein hängender Build den Knoten bis zum Abend halten.
  # Der Countdown läuft ab der ERSTELLUNG des Jobs, nicht ab dem Containerstart: Zeit im Zustand Pending und
  # die Neuerstellung des Knotens etwas später im Lab verbrauchen sie ebenfalls. Eine Stunde reichte nicht —
  # der Build starb mit DeadlineExceeded, gerade nachdem ein Mensch ihn abgewartet hatte.
  activeDeadlineSeconds: 7200
  # Das Pod-Template: daraus stanzt der Job den Pod, in dem der Build läuft. Der Pod hat keinen eigenen
  # Namen — der Job hängt an seinen eigenen Namen einen zufälligen Anhang, deshalb muss man den Pod
  # über das Label job-name suchen, nicht über den Namen.
  template:
    spec:
      # Der Build zieht fremden Code aus dem Internet und führt ihn sofort aus. Root-Rechte braucht er
      # dafür nicht: er schreibt nur nach /work — einschließlich des S3-Clients, den er sich
      # ebenfalls dorthin lädt, weil ein unprivilegierter Benutzer nicht in die System-Ordner des Images
      # schreiben darf. Dieselben drei Felder standen bei der App aus dem ersten Lab und aus demselben Grund:
      # ohne sie wird der Pod nicht in einen Cluster zugelassen, in dem das
      # Sicherheitsprofil `restricted` aktiviert ist.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # Für einen Job ist dies ein Pflichtfeld. Never bedeutet: einen fehlgeschlagenen Pod nicht
      # an Ort und Stelle neu starten, sondern die Entscheidung dem Job überlassen — er erstellt einen neuen.
      restartPolicy: Never
      containers:
        - name: build
          # Dieselbe Strenge auf Container-Ebene: sich selbst Rechte hochzustufen ist verboten,
          # die linux capabilities sind bis auf die letzte entzogen.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Ein fertiges Image mit Gradle und JDK 17. Die JDK-Version ist nicht willkürlich gewählt: sie
          # muss mit jvmTarget = "17" in app-build.gradle.kts übereinstimmen, sonst schlägt der Build
          # an einem Bytecode-Versions-Konflikt fehl. Ein Android SDK ist im Image nicht enthalten — der
          # erste Schritt des Skripts lädt es herunter, weil Images mit SDK darin zig
          # Gigabyte wiegen und länger zu ziehen wären als das SDK selbst.
          image: gradle:8.9-jdk17
          # Wir führen nicht das aus, was das Image standardmäßig tut, sondern unser eigenes Skript aus der ConfigMap,
          # die unter /scripts gemountet ist.
          command: ["bash", "/scripts/build.sh"]
          envFrom:
            # Alle vier Schlüssel des Secrets werden zu Umgebungsvariablen
            # mit denselben Namen: accessKey, secretKey, endpoint, bucketName.
            - secretRef:
                name: bucket-creds
          # Der ehrliche Preis eines Android-Builds, empirisch ermittelt. requests — wie viel
          # zu reservieren ist: der Scheduler wählt einen Knoten nach dieser Zahl, nicht nach dem tatsächlichen
          # Verbrauch. Weniger als vier Gigabyte überlebt der Kotlin-Compiler nicht.
          # limits — die Obergrenze: bei der CPU wird beim Anschlag gedrosselt, beim Speicher wird der
          # Container getötet (OOMKilled). Zum Vergleich: der App aus dem ersten Lab
          # genügten 20m CPU und 32Mi Speicher. Genau wegen dieser Zahlen muss der Knoten des Trainings-
          # clusters vergrößert werden: in den in Lab 0 bestellten passt der Build nicht.
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 6Gi
          # Drei Volumes. Die Quellen und das Skript — nur lesend: die ConfigMap wird ohnehin
          # read-only gemountet, aber ein explizites readOnly sagt sofort, dass der Build dort nicht schreibt.
          # Er schreibt nach /work, und das ist der einzige Ort, an dem er darf.
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: src
          configMap:
            name: propusk-src
            # Ein ConfigMap-Schlüssel darf keinen Schrägstrich enthalten, ein Mount-Pfad
            # aber schon. So wird eine flache Map in den Verzeichnisbaum entfaltet,
            # den Gradle erwartet.
            items:
              - key: settings.gradle.kts
                path: settings.gradle.kts
              - key: build.gradle.kts
                path: build.gradle.kts
              - key: app-build.gradle.kts
                path: app/build.gradle.kts
              - key: AndroidManifest.xml
                path: app/src/main/AndroidManifest.xml
              - key: MainActivity.kt
                path: app/src/main/kotlin/io/aenix/propusk/MainActivity.kt
              - key: strings.xml
                path: app/src/main/res/values/strings.xml
        - name: scripts
          configMap:
            name: android-build-script
            # Dateirechte für das Volume: lesen und ausführen. Das Skript wird als
            # `bash /scripts/build.sh` aufgerufen, deshalb ist das Ausführungsbit hier ein Sicherheitsnetz — es
            # wird von demjenigen gebraucht, der die Datei eines Tages direkt ausführt.
            defaultMode: 0755
        - name: work
          # Eine temporäre Platte auf dem Knoten, lebt genau so lange wie der Pod.
          # Hierher kommen das SDK, die Gradle-Abhängigkeiten und das Build-Ergebnis.
          emptyDir:
            # Zwölf Gigabyte mit Reserve: das SDK, der Gradle-Cache und das Build-Ergebnis sind
            # sechs bis acht. Die Obergrenze wird gebraucht, damit ein außer Kontrolle geratener Build nicht die Platte des Knotens
            # vollständig auffrisst und die benachbarten Pods mitreißt.
            sizeLimit: 12Gi
