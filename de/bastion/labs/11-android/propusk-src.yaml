---
# Lab 11. Quellcode der mobilen App „Propusk" — das, was dem Build als Eingabe zugeführt wird.
#
# Wird auf Ihrem Schulungscluster `lab` angewendet, nicht auf dem Tenant im Management-Cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f propusk-src.yaml
# Platzhalter wie tenant-workshopXX gibt es hier nicht — Sie müssen Ihre Nummer nirgends einsetzen.
# Der Namespace ist ebenfalls nicht angegeben: Das Objekt landet in dem, der in Ihrer kubeconfig eingetragen ist.
#
# Die App ist absichtlich winzig: eine Activity, eine Textzeile auf dem Bildschirm.
# Der Sinn der Lab ist nicht Android, sondern die Tatsache, dass ein Build in den Cluster wandert.
#
# WAS DIESE DATEIEN SIND, falls Sie noch nie eine mobile App gebaut haben.
# Ein Android-Projekt ist nicht eine einzelne Datei mit Code, sondern ein Baum aus drei Arten von Dateien:
#   *.gradle.kts  die Build-Beschreibung: woher Bibliotheken zu holen sind, womit zu kompilieren ist, für welche
#                 Android-Versionen zu bauen ist. Von der Rolle her ein Makefile, nur in der Sprache Kotlin;
#   *.kt          der eigentliche Anwendungscode;
#   *.xml         Ressourcen: Texte und die Beschreibung, welcher Bildschirm beim Antippen des Symbols
#                 geöffnet wird.
# Der Gradle-Builder liest diesen Baum und erzeugt ein APK — eine einzige Installationsdatei für das Telefon,
# von der Rolle her dasselbe wie eine .msi für Windows. Sie müssen das Android SDK nicht selbst installieren
# und nicht von Hand bauen: Das erledigt ein Job aus android-build.yaml, und hier liegt nur dessen Eingabe.
#
# Der Quellcode liegt in einer ConfigMap statt im Image, aus genau demselben Grund, aus
# dem in der Lab mit der ersten App die nginx-Seite in einer ConfigMap lag:
# um sie zu ändern, ohne irgendetwas neu zu bauen. Eine ConfigMap ist ein Cluster-Objekt, in dem
# Textdateien liegen; beim Start eines Containers schiebt der Cluster sie
# als gewöhnliche Dateien auf der Platte in ihn hinein.
#
# Die Schlüssel innerhalb von `data` sind Dateinamen, und alles unterhalb der Einrückung nach `|` ist der
# wortwörtliche Inhalt der Datei, kein YAML. Ein Kommentar, der innerhalb eines solchen
# Blocks steht, würde zu einer Zeile der Datei selbst — deshalb stehen alle Erläuterungen unten außerhalb,
# vor dem Schlüssel.
#
# Die flache Map aus sechs Schlüsseln entfaltet sich nicht hier zu einem Verzeichnisbaum, sondern beim
# Mounten: Die Zuordnung „Schlüssel -> Pfad" ist in android-build.yaml definiert, im
# Block volumes.items. Ein ConfigMap-Schlüssel darf keinen Schrägstrich enthalten — daher der flache Name
# app-build.gradle.kts, der im Projekt zu app/build.gradle.kts wird.
apiVersion: v1
kind: ConfigMap
metadata:
  name: propusk-src
data:
  # Die oberste Projektdatei: Sie listet auf, woher Gradle Plugins und Bibliotheken zieht und welche
  # Module Teil des Projekts sind (hier eines — app). Alle drei Repositories sind öffentlich, im Internet:
  # der Build-Container startet leer und zieht alles von dort, daher die Build-Dauer.
  # Das ist auch die erste Stelle, die Sie ändern werden, wenn die IT-Sicherheit den Ausgang nach außen schließt — hierher
  # wird ein internes Proxy-Repository eingetragen, genau so, wie Docker Hub gegen Harbor getauscht wurde.
  settings.gradle.kts: |
    pluginManagement {
      repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
      }
    }
    dependencyResolutionManagement {
      repositories {
        google()
        mavenCentral()
      }
    }
    rootProject.name = "propusk"
    include(":app")

  # Die Wurzel-Build-Datei: Sie fixiert die Versionen zweier Plugins — des Android-Builders und des Kotlin-
  # Compilers. `apply false` bedeutet „die Version deklarieren, aber im Wurzelprojekt nicht aktivieren":
  # das app-Modul aktiviert sie. Die Versionen sind absichtlich festgenagelt. Ein Build, der
  # „latest" zieht, baut in einem Monat anders als heute, und Sie werden derjenige sein, der das aufklärt.
  build.gradle.kts: |
    plugins {
      id("com.android.application") version "8.5.2" apply false
      id("org.jetbrains.kotlin.android") version "1.9.24" apply false
    }

  # Beschreibung des App-Moduls selbst. Hier stehen drei Zahlen, von denen sowohl das, was der Build
  # herunterlädt, als auch, wo die App überhaupt läuft, abhängt:
  #   compileSdk 34   die Android-SDK-Version, mit der wir kompilieren. Sie ist es, die der SDK-Installationsschritt
  #                   herunterlädt — etwa anderthalb Gigabyte, der langsamste Build-Schritt;
  #   minSdk 24       das älteste Android, auf dem die App läuft (das ist Android 7).
  #                   Erhöhen Sie ihn — Sie schneiden alte Telefone ab, senken Sie ihn — müssen Sie
  #                   Kompatibilitätsbibliotheken mitschleppen;
  #   jvmTarget 17    Kotlin kompiliert zu Java-Bytecode, und diese Zahl muss mit
  #                   der JDK-Version im Build-Image übereinstimmen (gradle:8.9-jdk17 in android-build.yaml).
  #                   Weichen sie voneinander ab, scheitert der Build an einer Bytecode-Versionsabweichung.
  app-build.gradle.kts: |
    plugins {
      id("com.android.application")
      id("org.jetbrains.kotlin.android")
    }

    android {
      namespace = "io.aenix.propusk"
      compileSdk = 34

      defaultConfig {
        applicationId = "io.aenix.propusk"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
      }

      compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
      }

      kotlinOptions {
        jvmTarget = "17"
      }

      sourceSets {
        getByName("main") {
          java.srcDirs("src/main/kotlin")
        }
      }
    }

  # Der Reisepass der App für das Telefon: welche Bildschirme sie hat und welcher davon
  # beim Antippen des Symbols geöffnet wird. Genau dafür ist der intent-filter-Block mit MAIN und LAUNCHER zuständig —
  # ohne ihn wird die App installiert, aber es erscheint kein Symbol im Menü.
  AndroidManifest.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <manifest xmlns:android="http://schemas.android.com/apk/res/android">
      <application android:label="@string/app_name">
        <activity
            android:name=".MainActivity"
            android:exported="true">
          <intent-filter>
            <action android:name="android.intent.action.MAIN" />
            <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
        </activity>
      </application>
    </manifest>

  # Der einzige Bildschirm der App — und der gesamte Code, den das Projekt überhaupt hat.
  # Verwendet wird die nackte android.app.Activity, keine Kompatibilitätsbibliothek: Das Projekt hat null externe
  # Abhängigkeiten, und das spart bei jedem Build ein paar Minuten Download.
  # R.string.greeting — eine Referenz auf Text aus strings.xml. Die Klasse R liegt nicht im Quellcode, sie wird
  # vom Build generiert. Deshalb bedeutet der Fehler „unresolved reference: R" einen fehlgeschlagenen Schritt
  # der Ressourcengenerierung, keinen Tippfehler im Code.
  MainActivity.kt: |
    package io.aenix.propusk

    import android.app.Activity
    import android.os.Bundle
    import android.widget.TextView

    class MainActivity : Activity() {
      override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val view = TextView(this)
        view.textSize = 22f
        view.setPadding(48, 96, 48, 48)
        view.text = getString(R.string.greeting)
        setContentView(view)
      }
    }

  # Aus dem Code ausgelagerte Texte: So werden sie bearbeitet und übersetzt, ohne den Programmierer anzurühren.
  # app_name ist unter dem Symbol auf dem Telefon sichtbar, greeting — auf dem Bildschirm selbst.
  strings.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <resources>
      <string name="app_name">Gästeausweis</string>
      <string name="greeting">Gästeausweis anfordern</string>
    </resources>
