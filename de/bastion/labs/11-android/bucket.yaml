---
# Lab 11. Bucket für die gebauten APKs.
#
# Ein Bucket ist ein benannter Bereich im Objektspeicher: Dateien werden als ganze
# Objekte abgelegt und abgeholt, über HTTP, und werden nirgends gemountet. Verzeichnisse
# gibt es darin nicht; ein Schrägstrich im Objektnamen wird nur in der Oberfläche als
# Baum dargestellt.
#
# Dies ist ein Tenant-Objekt: Es lebt NICHT im Cluster `lab`, sondern in eurem Namespace
# auf dem Management-Cluster. Deshalb muss die kubeconfig hier die des Tenants sein,
# nicht die, mit der ihr am Cluster `lab` arbeitet. Das ist so gewollt: Build-Artefakte
# müssen den Cluster überleben, in dem sie gebaut wurden.
#
# Ersetzt vor dem Anwenden tenant-workshopXX durch euren eigenen Namespace, sonst geht
# die Bestellung an den falschen Tenant und besteht höchstwahrscheinlich die Rechteprüfung nicht.
#
#     export KUBECONFIG=~/.kube/config
#     kubectl apply -f bucket.yaml
#
# Dasselbe lässt sich mit der Maus im Tenant-Dashboard erledigen (Anwendung erstellen -> Bucket).
# Das Ergebnis ist identisch; der Unterschied ist, dass Text reviewt und in Git abgelegt werden kann.
#
# Was nach dem Anwenden passiert: Die Plattform startet den Bucket in wenigen Sekunden
# und stellt Zugangsschlüssel aus, die sie im Secret bucket-builds-ci-credentials im selben
# Namespace ablegt. Vier Werte daraus (endpoint, bucketName, accessKey, secretKey)
# werden von Hand in den Cluster `lab` übertragen — die Cluster sind verschieden, von selbst wandert nichts.
apiVersion: apps.cozystack.io/v1alpha1
kind: Bucket
metadata:
  # Der Name des Cozystack-Objekts, und nur dieser. Den echten Bucket-Namen im Speicher
  # vergibt die Plattform selbst — lang, in der Form bucket-a9209f83-... Er landet im Feld
  # bucketName des ausgestellten Secrets, und genau dieser muss in den Build eingesetzt werden, nicht `builds`.
  name: builds
  namespace: tenant-workshopXX
spec:
  users:
    # Jeder Schlüssel dieser Map ist ein eigener S3-Benutzer mit eigenem Schlüsselpaar.
    # Ein leeres Objekt bedeutet «voller Lese- und Schreibzugriff».
    # So könnt ihr dem Builder Schreibzugriff geben und dem Mobile-Team nur Lesezugriff:
    #   ci: {}
    #   mobile:
    #     readonly: true
    ci: {}
