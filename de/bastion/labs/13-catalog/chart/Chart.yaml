# Lab 13. Steckbrief des Charts „Pässe".
#
# Ein Chart ist ein Ordner: Manifest-Templates in templates/, Standardwerte in values.yaml
# und das Parameterschema in values.schema.json. Es wird mit dem Befehl
# `helm install <Release-Name> chart` aus dem Lab-Ordner ausgerollt und im Cozystack-Katalog — von der
# Plattform selbst, wenn jemand eine Anwendung über das Dashboard bestellt.
#
# Chart.yaml ist der Umschlag des Pakets: daraus erfährt Helm, wie das Paket heißt und welche Version es hat.
apiVersion: v2
name: guest-pass
description: Internal guest pass service — order a pass for a visitor
type: application

# Als Nächstes kommen zwei Versionen, und sie werden häufiger verwechselt als alles andere in Helm. Das sind unterschiedliche Dinge.
#
# version — die Verpackungsversion. Sie ändert sich, wenn Sie Templates, Werte oder das Schema bearbeiten,
# selbst wenn die Anwendung darin gleich geblieben ist. Genau diese vergleicht Helm bei einem Release-
# Upgrade, und an ihr unterscheiden sich die ins Repository hochgeladenen Pakete. Ohne sie zu erhöhen,
# nimmt die Plattform an, das Paket habe sich nicht geändert, und die neue Version bleibt womöglich unbemerkt.
version: 0.1.0
# appVersion — die Version der Anwendung selbst innerhalb des Pakets, hier ist es nginx. Sie lebt ihr eigenes
# Leben: die Anwendung kann zehnmal aktualisiert werden, ohne dass ein einziges Template geändert wird, und umgekehrt —
# Sie haben die Templates umgeschrieben, aber die Anwendung ist dieselbe. Sie taucht nicht in Objektnamen auf, sie wird
# in der Ausgabe von `helm list` und in der Katalogkarte angezeigt.
appVersion: "1.0"
