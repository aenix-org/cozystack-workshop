# Lab 13. Standardwerte für den Chart „Pässe".
#
# Dies sind die Antworten auf die Fragen, die der Chart beim Deployment stellt: wie viele Kopien, welcher
# Text auf der Seite, ob eine Adresse von außen nötig ist. Sie sind hier für den Fall „nichts
# ausgewählt" hinterlegt. Wer die Anwendung bestellt, überschreibt sie: im Dashboard — mit Formularfeldern,
# im Terminal — mit dem Flag `--set replicas=5` oder einer eigenen Datei `helm install ... -f my.yaml`.
# Das Bearbeiten dieser Datei ändert die Standardwerte für künftige Bestellungen, nicht für bereits ausgerollte.
#
# Wie die Werte von hier zu einem Bestellformular im Dashboard werden:
#   Typ        — welches Feld angezeigt wird: {int} Zahl, {bool} Umschalter,
#                {string} Eingabezeile, {struct} verschachtelte Feldgruppe;
#   Beschreibung — Feldbeschriftung und der Hinweis darunter;
#   =Wert      — was bereits im Feld steht, wenn das Formular geöffnet wird;
#   Pflichtangabe — wird durch die required-Liste im Schema festgelegt. Hier gibt es keine: jeder
#                Parameter hat einen Standardwert, daher kann jedes Feld übersprungen werden.
# Deshalb werden die Beschreibungen auf Englisch geschrieben: sie werden nicht nur vom Chart-Autor gelesen, sondern von jedem,
# der die Anwendung im Dashboard bestellt.

## Kommentare der Form `## @param` sind keine Dekoration. Aus ihnen erzeugt der Cozystack-Generator
## (cozyvalues-gen) values.schema.json und die Parametertabelle in der README.
## Format: ## @param {Typ} Name=Standardwert - Beschreibung.

# Wie viele Kopien der Anwendung laufen sollen. Eine Kopie bedeutet Ausfall während eines
# Knoten-Neustarts; zwei überstehen den Verlust einer beliebigen davon.
## @param {int} replicas=2 - Number of application replicas.
replicas: 2

# Text auf der Hauptseite. Als Parameter herausgezogen, weil jede Tochtergesellschaft
# ihren eigenen hat und niemand nur dafür ein separates Image bauen wird.
## @param {string} greeting=Order a pass for your guest - Text shown on the main page.
greeting: "Order a pass for your guest"

# Ob die Anwendung eine Adresse außerhalb des Clusters braucht. Die Cozystack-Katalog-Konvention:
# ein Feld namens external bedeutet bei allen Anwendungen dasselbe — externer Zugriff.
## @param {bool} external=false - Enable external access from outside the cluster.
external: false

# Die Größe einer Kopie. Als separate Feldgruppe zusammengefasst, damit sie im Bestellformular
# wie ein einzelner Block „Ressourcen" aussieht und nicht wie zwei unabhängige Felder.
## @typedef {struct} Resources - CPU and memory for each replica.
## @field {quantity} cpu - CPU available to each replica.
## @field {quantity} memory - Memory (RAM) available to each replica.

## @param {Resources} resources - Explicit CPU and memory configuration.
resources:
  cpu: 100m
  memory: 128Mi
