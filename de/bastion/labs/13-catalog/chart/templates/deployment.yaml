# Lab 13. Deployment-Vorlage: was ausgeführt werden soll und in wie vielen Kopien.
#
# Dateien in templates/ sind Vorlagen, keine fertigen Manifeste. Helm setzt Werte in sie ein
# und übergibt das Ergebnis dem Cluster: `helm template main chart` zeigt den gerenderten Text, ohne
# etwas anzuwenden, `helm install main chart` wendet es an.
#
# Doppelte geschweifte Klammern sind eine Einsetzstelle. Darin findest du:
#   .Values.name  — einen Parameterwert: aus values.yaml, wenn der Kunde ihn nicht angerührt hat,
#                   oder aus dem Bestellformular im Dashboard, wenn er einen eigenen gewählt hat;
#   .Release.Name — den Release-Namen, also den Namen einer konkreten Bereitstellung des Charts.
# Text außerhalb der Klammern geht unverändert ins Manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  # Objektnamen werden aus dem Release-Namen zusammengesetzt, nicht fest verdrahtet. Derselbe Chart
  # wird mehr als einmal in einen Namespace bereitgestellt, und ein fester Name würde bedeuten, dass
  # die zweite Bestellung die erste überschreibt. Release `main` ergibt ein Deployment, einen Service und eine ConfigMap
  # mit dem Namen `main` — der Name macht auf einen Blick deutlich, dass sie eine Gruppe sind.
  name: {{ .Release.Name }}
  # Labels: name ist bei jeder Bestellung dieser Anwendung gleich, instance unterscheidet die Bestellungen.
  # Objekte finden einander über sie, und danach wird auch die Ausgabe von `kubectl get` gefiltert.
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Wie viele Kopien laufend gehalten werden. Verschwindet eine Kopie, erstellt der Cluster eine neue,
  # ohne zu fragen — daher Selbstheilung ohne diensthabenden Administrator.
  replicas: {{ .Values.replicas }}
  # selector sagt dem Deployment, welche Pods als seine eigenen gelten — anhand von Labels, nicht von Namen.
  # Die Labels hier und die Labels in template.metadata.labels müssen übereinstimmen. Weichen sie ab,
  # findet das Deployment seine eigenen Kopien nicht und stanzt sie immer wieder aus.
  selector:
    matchLabels:
      app.kubernetes.io/name: guest-pass
      app.kubernetes.io/instance: {{ .Release.Name }}
  # template ist die Pod-Vorlage. Alles darunter beschreibt nicht das Deployment selbst, sondern die
  # Anwendungskopien, die es nach dieser Vorlage erstellt.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guest-pass
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Konfigurations-Hash in einer Pod-Annotation. Ohne ihn startet das Bearbeiten der ConfigMap die
        # Pods nicht neu, und der neue Text erscheint nicht, bis jemand sie von Hand löscht.
        # Das ist die häufigste Beschwerde über Charts überhaupt.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # Die Anwendung läuft nicht als root und mit reduzierten Rechten. Ein Chart aus dem Katalog
      # wird von fremden Tenants in ihren Namespaces bereitgestellt, und die Rechte des Containers sind Teil dessen,
      # was du ihnen zusammen mit der Anwendung zusicherst.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Das Image ist in der Vorlage festgeschrieben und bewusst nicht als Parameter herausgezogen: der Kunde
          # wählt Größe und Text, tauscht aber nicht die Anwendung selbst gegen eine beliebige aus.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # Ohne diese Variable startet nginx einen Worker-Prozess pro Kern des Knotens.
          # Auf einem Knoten mit mehreren Dutzend Kernen werden es Dutzende, und ein Pod mit einem
          # Speicherlimit von hundert Megabyte stirbt mit OOMKilled noch vor der ersten Anfrage. Der Chart wird
          # in fremde Tenants ausgeliefert, wo die Knoten beliebig sein können, daher ist das hier zwingend.
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # Der Port innerhalb des Containers. Der Name http wird weiter unten in der Probe und im Service verwendet,
          # damit die Portnummer an einer Stelle steht, nicht an dreien.
          ports:
            - containerPort: 8080
              name: http
          # requests — wie viel garantiert zugeteilt wird; anhand dieser Zahlen wählt der Scheduler
          # einen Knoten. limits sind hier nur Speicher: wird es überschritten, wird der Container getötet
          # und wieder hochgefahren. Ein CPU-Limit gibt es bewusst nicht, sonst stößt die Anwendung
          # an eine Decke, statt einfach langsamer zu laufen.
          # Der Filter `| quote` schließt den eingesetzten Wert in Anführungszeichen ein: der Benutzer
          # kann 1 eingeben, und ohne Anführungszeichen ginge eine Zahl ins Manifest, wo eine Zeichenkette
          # wie "1" oder "100m" erwartet wird.
          resources:
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
            limits:
              memory: {{ .Values.resources.memory | quote }}
          # readinessProbe — die Frage «bereit, Anfragen anzunehmen?». Solange /healthz nicht antwortet,
          # sendet der Service keinen Traffic an diese Kopie. Daher Updates ohne Unterbrechung: die alte
          # Kopie wird aus dem Balancing genommen, nachdem die neue geantwortet hat.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          # Die nginx-Seite und -Konfiguration werden als Dateien aus der ConfigMap eingehängt. subPath setzt
          # genau eine Datei ein: ohne ihn würde das eingehängte Verzeichnis das gesamte /etc/nginx/
          # conf.d ersetzen und die Standardeinstellungen des Images würden verschwinden.
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      # Der ConfigMap-Name wird aus dem Release-Namen zusammengesetzt, sodass der Pod immer die Konfiguration
      # seiner eigenen Bestellung einhängt, nicht die eines Nachbarn.
      volumes:
        - name: page
          configMap:
            name: {{ .Release.Name }}
        - name: conf
          configMap:
            name: {{ .Release.Name }}
