# Lab 13. Service-Template: eine stabile Adresse für die Anwendung.
#
# Kopien der Anwendung kommen und gehen, ihre Adressen sind jedes Mal neu. Ein Service gibt einen Namen,
# der sich nicht ändert, und verteilt Anfragen auf die lebenden Kopien. Aus einem benachbarten Pod
# wird die Anwendung über den Release-Namen erreicht.
#
# Über die Ersetzung in doppelten geschweiften Klammern und woher die Objektnamen stammen, ist
# in templates/deployment.yaml beschrieben — hier funktioniert alles auf dieselbe Weise.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Ein einziges Flag in values entscheidet, ob die Anwendung eine Adresse außerhalb des Clusters erhält oder nicht.
  # Die eingebauten Anwendungen von Cozystack funktionieren genauso: das Feld external.
  # Die if/else-Konstruktion wählt beim Rendern einen von zwei Werten aus — das fertige Manifest
  # bekommt entweder LoadBalancer oder ClusterIP, und keine Verzweigung bleibt darin übrig.
  type: {{ if .Values.external }}LoadBalancer{{ else }}ClusterIP{{ end }}
  # Wem der Traffic zugestellt wird. Der Service wählt Pods anhand von Labels aus, nicht anhand von Namen, daher
  # ist es ihm egal, wie viele Kopien es gibt oder wie sie heißen. Die Labels sind dieselben, die
  # das Deployment seinen Kopien zuweist.
  selector:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
  # port — auf welchem Port der Service selbst lauscht, targetPort — wohin er in den Pod hinein klopft.
  # targetPort ist per Name angegeben: der Port mit dem Namen http ist im Deployment-Template deklariert.
  # Ändert sich die Nummer dort, muss hier nichts angepasst werden.
  ports:
    - name: http
      port: 80
      targetPort: http
