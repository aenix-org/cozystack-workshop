---
# Lab 13. So wird die Bestellung Ihrer Anwendung aussehen, NACHDEM
# der Admin applicationdefinition.yaml angewendet hat. Wird in Ihrem Tenant angewendet:
#   kubectl apply -f guestpass-example.yaml
#
# ACHTUNG: tenant-workshopXX ist ein Platzhalter, kein Namespace-Name. Ersetzen Sie XX durch
# Ihre Tenant-Nummer vor dem Anwenden, sonst verweigert kubectl: einen solchen Namespace gibt es nicht,
# und in einen fremden werden Sie nicht gelassen.
#
# Beachten Sie: Die Gruppe apps.cozystack.io ist dieselbe wie bei Bucket,
# VMInstance und den übrigen Anwendungen des Katalogs. Ihre Anwendung reiht sich
# neben ihnen ein, nicht irgendwo abseits.
#
# Diese Datei anzuwenden, bevor der Admin die Definition registriert hat,
# ist nicht möglich: kubectl antwortet `no matches for kind "GuestPass"`.
apiVersion: apps.cozystack.io/v1alpha1
kind: GuestPass
metadata:
  name: main
  namespace: tenant-workshopXX
# Die Felder in spec sind genau die Parameter, die in chart/values.yaml beschrieben und vom
# Bestellformular im Dashboard angezeigt werden. Hier sind sie als Text ausgeschrieben: dasselbe wie das Drücken
# einer Schaltfläche im Dashboard, aber eine solche Datei kann man reviewen, in Git ablegen und zurückrollen.
spec:
  replicas: 2
  greeting: "Order a pass for your guest"
  external: false
  resources:
    cpu: 100m
    memory: 128Mi
