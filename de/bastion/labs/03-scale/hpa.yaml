---
# Lab 3. Replikas nach CPU-Last hochskalieren.
# Ziel sind 50 % von requests.cpu (20m), das heißt der Schwellwert liegt bei 10m pro Pod.
# Bewusst niedrig gewählt: die Last muss innerhalb von Sekunden auslösen,
# wir haben für das Lab eine halbe Stunde, nicht einen halben Tag.
#
# Ein einzelnes Objekt. Es wird auf deinem Schulungscluster `lab` angewendet, nicht im Tenant
# auf dem Management-Cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f hpa.yaml
# Platzhalter wie tenant-workshopXX gibt es hier nicht — du musst nirgends deine Nummer einsetzen.
#
# Zwei Bedingungen, ohne die das Objekt zwar angelegt wird, aber nicht funktioniert:
#   1. Der rickroll-Container hat requests.cpu gesetzt — sonst gibt es nichts, woraus sich der Prozentwert berechnen ließe,
#      und die Spalte TARGETS von `kubectl get hpa` bleibt für immer auf <unknown>.
#   2. metrics-server läuft im Cluster — die Quelle des aktuellen Verbrauchs der Pods.
# check.sh in diesem Ordner prüft beide Bedingungen.
#
# Solange der HPA existiert, gehört das Feld replicas des Deployments ihm. Du kannst die Zahl
# der Kopien von Hand über `kubectl scale` ändern, aber der HPA stellt seinen eigenen Wert innerhalb von Sekunden wieder her.
# Deshalb wird in Lab 4 vor dem Rollout dieses Objekt gelöscht: zwei Mechanismen auf einem Feld —
# ein garantierter Weg, um nicht zu verstehen, was passiert ist.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # Der HPA-Name muss nicht mit dem Namen der Anwendung übereinstimmen — die Übereinstimmung hier dient der Bequemlichkeit.
  # Was verwaltet wird, bestimmt scaleTargetRef weiter unten, nicht dieser Name.
  name: rickroll
spec:
  # Wen beobachten und wessen Feld replicas ändern. Drei Felder zusammen, weil ein Name
  # ohne Typ mehrdeutig ist: ein Deployment und ein StatefulSet können gleich heißen.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rickroll
  # Der Korridor, den der HPA unter keiner Last verlässt. Die untere Grenze ist dieselbe
  # eine Kopie, mit der das Lab begann. Die obere ist sechs: so viele passen
  # auf einen Schulungsknoten bei limits.cpu 300m und sind in der Pod-Liste trotzdem mit dem Auge erkennbar.
  # Setzt du maxReplicas: 1, wird das Objekt angelegt und tut nichts.
  minReplicas: 1
  maxReplicas: 6
  # Woran die Entscheidung festmachen. Es kann mehrere Metriken geben, dann nimmt der HPA diejenige,
  # die die größere Anzahl an Kopien erfordert. Hier gibt es nur eine — die CPU.
  metrics:
    - type: Resource
      resource:
        name: cpu
        # Utilization ist der Anteil an requests.cpu des Containers, nicht an der Kapazität des Knotens.
        # Daraus folgt eine unintuitive Konsequenz: der Wert kann ruhig 600 % betragen, und das ist
        # kein Fehler: der Pod verbraucht sechsmal mehr, als er reserviert hat.
        # Eine Alternative ist AverageValue, wo der Schwellwert direkt in Millicores angegeben wird.
        target:
          type: Utilization
          averageUtilization: 50
  # Wie flott reagieren. Der Block ist optional: ohne ihn werden die Standardwerte verwendet,
  # die für den Produktivbetrieb ausgelegt sind, nicht für eine Vorführung.
  behavior:
    scaleUp:
      # Standardmäßig wartet Kubernetes auf Stabilisierung und wächst langsam.
      # Im Lab sieht das aus wie „es passiert nichts“, deshalb beschleunigen wir.
      stabilizationWindowSeconds: 0
      # Nicht mehr als zwei neue Kopien alle fünfzehn Sekunden. Der Schritt wurde empirisch
      # gewählt: Wachstum ist als Wachstum zu sehen, und nicht als ein sofortiger Sprung von einer direkt auf sechs,
      # bei dem es für den Teilnehmer nichts zu beobachten gibt.
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      # Nach unten dagegen — nicht sofort, sonst verschwinden die Pods,
      # bevor der Teilnehmer sie beobachten kann.
      # Eine Minute statt der standardmäßigen fünf: das Lab läuft eine halbe Stunde, es gibt nichts,
      # womit man fünf davon füllen könnte, während man auf das Herunterskalieren wartet. In einem Produktivcluster ist ein langes Fenster tatsächlich nützlich —
      # es dämpft die Ausschläge bei ungleichmäßiger Last.
      stabilizationWindowSeconds: 60
