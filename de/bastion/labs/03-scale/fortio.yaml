# Lab 3. Fortio-Lastgenerator: der Generator selbst und eine feste Adresse für seine
# Weboberfläche. Zwei Objekte, getrennt durch `---`.
#
# Wird auf deinem Lern-Cluster `lab` angewendet, nicht in einem Tenant auf dem Management-Cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f fortio.yaml
# Platzhalter wie tenant-workshopXX gibt es hier nicht — du musst deine Nummer nirgends einsetzen.
# Dieselbe Datei wird in Lab 4 gebraucht: `kubectl apply -f ../03-scale/fortio.yaml`.
#
# Allgemeine Manifest-Felder (apiVersion, kind, metadata.name, selector, template,
# securityContext) sind zeilenweise in ../01-deploy/rickroll.yaml erklärt und werden hier
# nicht wiederholt. Wir kommentieren nur das, was speziell für den Lastgenerator gilt.
---
# Lastgenerator mit Weboberfläche.
# Bewusst statt hey/ab gewählt: Die Last wird per Knopf im Browser gestartet,
# und das Latenz-Histogramm ist gleich dort zu sehen. Bei früheren Workshops haben wir
# Leute genau an den Konsolenwerkzeugen verloren.
#
# Fortio lebt im Cluster als gewöhnliche Anwendung und trifft die rickroll-Adresse von innen.
# Von außen zu belasten, von der VM aus, wäre traffic-mäßig ehrlicher, würde aber am Kanal
# zum Cluster hängenbleiben, und du würdest dein WLAN messen statt die Anwendung.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # Eine Kopie des Generators reicht: Sie erzeugt die Last selbst in vielen Threads.
  # Eine zweite Kopie würde das Bild nur verwischen — jede Kopie hat ihre eigenen Zähler in der
  # Weboberfläche, und du würdest die Hälfte der Anfragen sehen.
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # Dasselbe Sicherheitsprofil wie bei rickroll: läuft nicht als root, eine bestimmte
      # UID, standardmäßiges seccomp. Bewusst beibehalten — damit die Datei auch
      # in einem Cluster mit aktiviertem Profil `restricted` angewendet werden kann, wo der Pod sonst nicht startet.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Der Tag latest ist eine bewusste Vereinfachung für den Workshop, um Versionen nicht abgleichen zu müssen.
          # In einem Produktiv-Cluster macht man das nicht: Das Image unter diesem Tag kann sich unbemerkt
          # zwischen zwei Applies ändern, und du kannst das gestrige Ergebnis nicht mehr reproduzieren.
          image: fortio/fortio:latest
          # Der Modus `server` startet die Weboberfläche und hält sie am Laufen. Ohne dieses Argument
          # würde Fortio einen einzelnen Durchlauf von der Kommandozeile ausführen und beenden, und der Cluster
          # würde den Container immer wieder neu starten.
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            # Der Request ist höher als der von rickroll selbst (20m): Der Generator braucht vorab Platz auf dem Knoten,
            # sonst platziert der Scheduler ihn knapp und der Hochlauf wird ungleichmäßig.
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # Der Generator braucht CPU-Reserve, sonst läuft er
              # in sich selbst hinein und du belastest Fortio statt die Anwendung.
              cpu: "1"
              memory: 256Mi
---
# Feste Adresse des Generators innerhalb des Clusters. Nötig, um die Weboberfläche
# von der VM aus über `kubectl port-forward svc/fortio 8081:8080` zu öffnen — nach außen veröffentlicht der Cluster
# nichts, und es gibt keine anderen Türen zu Fortio.
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  ports:
    # 8080 auf beiden Seiten: sowohl Service als auch Container. Die Nummer ist dieselbe wie bei rickroll
    # innerhalb des Pods, aber es gibt keine Kollision — jeder Pod hat seinen eigenen Netzwerk-Stack.
    - port: 8080
      targetPort: http
