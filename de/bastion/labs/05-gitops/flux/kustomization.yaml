---
# Lab 5 · Infrastruktur in Git. Aufgabe: was genau aus dem Repository in den Cluster anzuwenden ist.
#
# Wird auf Ihrem Cluster `lab` zusammen mit dem benachbarten gitrepository.yaml angewendet:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# In jedem Objekt: apiVersion — die Version des Beschreibungsschemas, kind — was wir erstellen,
# metadata.name — der Name des Objekts. Unten werden sie nicht gesondert erläutert.
#
# Aufgabenteilung: GitRepository lädt das Repository herunter und wendet nichts an,
# dieses Objekt nimmt das Heruntergeladene und bringt den Cluster damit in Übereinstimmung. Der Name Kustomization stimmt
# mit dem Namen des Werkzeugs kustomize überein, aber das sind verschiedene Dinge — hier ist es ein Objekt im Cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passes
  # Lebt dort, wo die Flux-Dienste sind — sonst nimmt der kustomize-controller es nicht auf.
  namespace: flux-system
spec:
  # Wie oft der tatsächliche Zustand des Clusters mit dem in Git beschriebenen abgeglichen wird.
  # Das ist nicht „einmal pro Minute erneut anwenden" — es ist „einmal pro Minute vergleichen und
  # Abweichungen korrigieren". Selbst wenn sich in Git nichts geändert hat, wird eine von
  # Hand über kubectl edit gemachte Änderung stillschweigend zurückgerollt. Den Unterschied sehen Sie
  # etwas weiter im Lab, wenn Sie selbst etwas im Cluster an Git vorbei ändern.
  interval: 1m
  # Der Ordner innerhalb des Repositorys. Alles, was darin liegt, gelangt in den Cluster; Dateien daneben
  # — zum Beispiel README.md im Wurzelverzeichnis — werden nicht angerührt. Der Name `apps` ist von uns gewählt, aber er
  # muss mit dem Ordner übereinstimmen, in den Sie die Manifeste in Ihrem Repository legen.
  path: ./apps
  # Aus dem Cluster die Objekte löschen, die aus Git verschwunden sind.
  # Ohne dies hört Git auf, eine vollständige Beschreibung zu sein: aus dem Repository Gelöschtes
  # würde weiter im Cluster laufen, und niemand wüsste davon.
  prune: true
  # Auf welche Quelle geschaut wird. Der Name `passes` ist der metadata.name aus gitrepository.yaml,
  # nicht der Name des Repositorys auf GitHub. Benennen Sie ihn dort um — korrigieren Sie es auch hier, sonst wartet Flux
  # auf eine Quelle, die es nicht gibt, und die Kustomization wird nicht bereit.
  sourceRef:
    kind: GitRepository
    name: passes
  # Auf die Bereitschaft des Angewendeten warten, statt gleich nach dem apply Erfolg zu melden.
  # Der Unterschied ist genau derselbe wie zwischen „den Antrag eingereicht" und „der Antrag ist erledigt": ohne wait
  # meldet Flux Erfolg, selbst wenn die Pods danach nicht hochkommen.
  wait: true
  # Wie lange auf diese Bereitschaft gewartet wird, bevor die Anwendung als erfolglos gilt.
  # Drei Minuten — mit Reserve für das Herunterladen des Images auf einem leeren Node. Ein zu kleiner
  # Wert führt zu falschen Fehlschlägen in einem langsamen Netz, ein zu großer — Sie schauen
  # lange auf „in Bearbeitung" statt auf einen klaren Fehler.
  timeout: 3m
