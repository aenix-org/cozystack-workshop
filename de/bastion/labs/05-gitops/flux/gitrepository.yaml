---
# Lab 5 · Infrastruktur in Git. Quelle: woher Flux den gewünschten Zustand nimmt.
#
# Wird auf Ihrem Cluster `lab` zusammen mit dem benachbarten kustomization.yaml angewendet:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# ACHTUNG: ERSETZEN Sie die url durch die Adresse IHRES eigenen Repositorys, bevor Sie anwenden: die Zeile
# ЗАМЕНИТЕ-МЕНЯ ist ein Platzhalter, mit ihr geht Flux zu einer nicht existierenden Adresse und bleibt
# mit einem Fehler stehen. Prüfen Sie auch den Branch: GitHub erstellt neue Repositorys mit dem Branch main.
#
# In jedem Objekt: apiVersion — die Version des Beschreibungsschemas, kind — was wir erstellen,
# metadata.name — der Name, über den weiter unten auf das Objekt verwiesen wird. Unten nicht wiederholt.
#
# Die einzige Aufgabe dieses Objekts ist, im Cluster eine frische Kopie des Repositorys zu halten.
# Es wendet nichts an: es lädt nur herunter. Angewendet wird von der benachbarten Kustomization,
# und sie verweist hierher über den Namen `passes`, deshalb kann der Name nicht allein geändert werden.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: passes
  # flux-system — der Namespace, den der Befehl flux install angelegt hat; in ihm leben
  # die Flux-Dienste selbst. Konfigurationsobjekte legt man dorthin, sonst sehen die Dienste sie nicht.
  namespace: flux-system
spec:
  # Wie oft nach dem neuen Zustand in Git gegangen wird. Eine Minute — für das Lab;
  # in der Produktion üblicherweise 1–5 Minuten, eine sofortige Reaktion macht man mit einem Webhook aus GitHub.
  interval: 1m
  # Die Adresse des Repositorys. Es ist öffentlich, deshalb gibt es hier weder Login noch Schlüssel —
  # das ist eine Vereinfachung des Schulungsstands. In der Produktion ist das Repository privat, und daneben erscheint
  # ein Verweis auf ein Secret mit dem Deploy-Schlüssel (Feld secretRef).
  url: https://github.com/ЗАМЕНИТЕ-МЕНЯ/passes-gitops
  # Welcher Branch als Quelle der Wahrheit gilt. In den Cluster reist, was in main gemergt ist;
  # was in anderen Branches liegt, reist nicht. Daher kommt die Review: eine Änderung
  # lebt zuerst in ihrem eigenen Branch, wo man sie ansehen kann, und erst das Mergen in main
  # macht sie wirksam. Falls das Repository mit dem alten Branch master erstellt wurde —
  # korrigieren Sie es hier, sonst findet Flux nichts zum Lesen.
  ref:
    branch: main
