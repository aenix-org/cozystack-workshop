---
# Lab 5 · Infrastruktur in Git. Der Dienst „Ausweis" selbst: vier Objekte in einer Datei.
#
# Wird nicht von Hand auf den Cluster angewendet. Die Datei wird in ihr eigenes Repository auf
# GitHub gelegt, in den Ordner apps/, neben namespace.yaml, und in den Cluster `lab` überträgt
# sie Flux — von selbst:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# Die Zeile --- trennt die Objekte: eine Datei, vier unabhängige Objekte. Die Reihenfolge in der
# Datei beeinflusst die Reihenfolge der Erstellung nicht — der Cluster regelt das selbst.
#
# In jedem Objekt: apiVersion — die Version des Beschreibungsschemas, kind — was wir erstellen,
# metadata.name — der Name des Objekts, metadata.namespace — in welcher Abtrennung des Clusters
# es lebt. Diese Felder werden weiter unten nicht mehr gesondert erläutert.
#
# In keinem der vier Objekte steht ein Passwort, ein Schlüssel oder ein Token, und das ist kein
# Zufall: Was in Git gelangt, bleibt dort für immer — die Historie lässt sich umschreiben, aber
# bei allen, die es rechtzeitig geklont haben, bleibt die alte Kopie erhalten. Für Geheimnisse ist hier kein Platz.

# --- 1 von 4. Einstellungen des Webservers --------------------------------------------------
# Eine ConfigMap legt eine Textdatei getrennt von der Anwendung in den Cluster, und weiter unten
# (im Abschnitt volumes) wird diese Datei in den Container eingehängt. Der Sinn — Einstellungen
# ändern, ohne das Image neu zu bauen: Sie bearbeiten hier, committen, und binnen einer Minute hat
# der Cluster die neue Version.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-conf
  namespace: passes
# Ein Schlüssel innerhalb von data wird zum Dateinamen im Container: default.conf landet in dem
# Ordner, den nginx beim Start liest. Der senkrechte Strich nach dem Namen ist die Art, mehrzeiligen
# Text in YAML unverändert zu schreiben, unter Beibehaltung der Zeilenumbrüche.
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      # Adresse für die Bereitschaftsprüfung. Der Cluster klopft hier an und lässt keinen
      # Verkehr auf eine Kopie, bis er eine Antwort erhält.
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        # In der ausgelieferten Seite ersetzen wir __POD__ durch den Namen der Maschine, auf der
        # nginx läuft. Innerhalb des Pods ist der Maschinenname der Name des Pods selbst.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
    }
---
# --- 2 von 4. Die Seite, die der Dienst ausliefert ----------------------------------------
# In diesem Lab ist die Seite ein Platzhalter: die echte Anwendung erscheint später. Jetzt ist
# nicht wichtig, was der Dienst zeigt, sondern woher er im Cluster kommt. Der Text __POD__ in der
# Auszeichnung ist eine Marke für die Ersetzung: nginx ersetzt sie durch den Namen des Pods, der die
# Seite ausgeliefert hat, und an diesem Namen sehen Sie später, dass es mehr als eine Kopie gibt.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-page
  namespace: passes
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Gästeausweis</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 40rem;
               color: #222; }
        h1 { font-weight: 600; }
        .v { display: inline-block; padding: .2rem .6rem; border-radius: .3rem;
             background: #eef; font-family: ui-monospace, monospace; }
        .pod { margin-top: 2rem; color: #666; font-size: .9rem; }
        b { font-family: ui-monospace, monospace; color: #222; }
      </style>
    </head>
    <body>
      <h1>Dienst „Gästeausweis“</h1>
      <p>Anforderung eines Gästeausweises. Version <span class="v">v1</span></p>
      <p>Aus Git ausgerollt. Von Hand hat hier niemand etwas angefasst.</p>
      <div class="pod">bedient von Pod <b>__POD__</b></div>
    </body>
    </html>
---
# --- 3 von 4. Beschreibung der Anwendung selbst ---------------------------------------------
# Ein Deployment bedeutet nicht „starte einen Container", sondern „halte so und so viele Kopien
# eines solchen Containers am Laufen". Der Unterschied zeigt sich, wenn eine Kopie stirbt: der
# Cluster erstellt eine neue, ohne zu fragen und ohne zu benachrichtigen. In vSphere kommt HA am
# nächsten, aber dort wird eine Maschine neu gestartet, während hier eine Kopie der Anwendung neu
# erstellt wird, und das geschieht ständig, nicht nur bei einem Ausfall.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes
  namespace: passes
  labels:
    app: passes
spec:
  # Wie viele Kopien am Laufen gehalten werden sollen. Die Formulierung ist wichtig: nicht „starte
  # eine", sondern „halte eine". Diese Zahl werden Sie über Git ändern und sehen, was passiert.
  replicas: 1
  # An welchem Merkmal das Deployment seine Kopien erkennt. Das ist keine Liste von Pod-Namen —
  # Namen ändern sich bei jeder Neuerstellung —, sondern die Bedingung „alle Pods mit dem Label app: passes".
  # Das Label unten, in template.metadata.labels, muss mit dieser Bedingung übereinstimmen: weichen sie
  # ab, verweigert der Cluster die Annahme des Manifests, weil die Kopien niemandem gehören würden.
  selector:
    matchLabels:
      app: passes
  # template — die Vorlage, nach der die Kopien gestanzt werden. Alles darin beschreibt einen
  # Pod. Die Bearbeitung der Vorlage bedeutet das Ausrollen einer neuen Version: alte Kopien werden durch neue ersetzt.
  template:
    metadata:
      labels:
        app: passes
    spec:
      # Sicherheitsbeschränkungen auf Ebene des gesamten Pods. In vSphere gibt es kein Gegenstück: dort
      # wird die Isolation vom Hypervisor geliefert, während Container den Kernel mit dem Knoten teilen,
      # weshalb die Rechte ausdrücklich beschnitten werden müssen.
      #   runAsNonRoot   nicht starten, wenn das Image als root arbeiten will
      #   runAsUser      unter welchem numerischen Benutzer gearbeitet wird; 65532 — der akzeptierte
      #                  „unprivilegierte" Bezeichner in minimalen Images
      #   seccompProfile welche Systemaufrufe erlaubt sind; RuntimeDefault — ein Satz,
      #                  der das offensichtlich Gefährliche abschneidet und nichts kaputt macht
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Dieselben Beschränkungen, aber nun für einen konkreten Container.
          #   allowPrivilegeEscalation: false  der Prozess kann sich keine weiteren Rechte verschaffen
          #   capabilities.drop: ["ALL"]       alle besonderen Kernel-Befugnisse entziehen
          #                                    (Netzwerk ändern, einhängen, Zeit ändern);
          #                                    ein Webserver braucht keine davon
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Das Image wird aus einer öffentlichen Registry bezogen — im nächsten Lab wird die IT-Sicherheit
          # das verbieten, und die Adresse wechselt zum eigenen Harbor. Die Variante unprivileged wurde
          # nicht aus Schönheit gewählt: das gewöhnliche nginx-Image lauscht auf Port 80 und will dafür
          # root-Rechte, und mit runAsNonRoot oben würde es überhaupt nicht starten.
          # Die Version ist festgeschrieben (1.27-alpine), nicht latest: sonst würde dasselbe
          # Manifest morgen eine andere Anwendung ausrollen, und Sie würden davon nichts erfahren.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # Der Port, auf dem die Anwendung lauscht. Der Name `http` ist keine Zierde: darauf
          # verweisen die Bereitschaftsprüfung unten und der Service am Ende der Datei. Ändern Sie
          # die Portnummer — Sie müssen sie an einer Stelle ändern, nicht an dreien.
          ports:
            - containerPort: 8080
              name: http
          # requests — wie viele Ressourcen garantiert reserviert werden; nach dieser Zahl wählt
          # der Scheduler einen Knoten aus. limits — die Obergrenze, über die hinaus nicht durchgelassen wird.
          # Zu niedrige requests bedeuten, dass mehr auf einen Knoten passt, als er verkraften kann;
          # Überschreitung der limits beim Speicher — der Container wird getötet, bei der CPU — er wird gedrosselt.
          # 20m = zwanzig Tausendstel eines Kerns, Mi = Megabyte. Die Werte hier sind klein,
          # weil es im Lab nur einen Knoten gibt und der nicht groß ist.
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Bereitschaftsprüfung: der Cluster klopft an dieser Adresse an und lässt keinen Verkehr auf
          # eine Kopie, bis er eine Antwort erhält. Ohne sie würde der Service Anfragen an ein noch nicht
          # hochgefahrenes nginx senden, und der Benutzer würde bei jedem Ausrollen einen Fehler sehen.
          # Auch Flux wartet auf sie — in kustomization.yaml haben wir wait: true angefordert.
          #   initialDelaySeconds  vor dem ersten Anklopfen warten, dem Prozess Zeit zum Starten geben
          #   periodSeconds        wie oft danach angeklopft wird
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # Wohin innerhalb des Containers der Inhalt der beiden ConfigMaps vom Anfang der Datei gelegt wird.
          # /etc/nginx/conf.d — der Ordner, aus dem nginx beim Start die Einstellungen liest,
          # /usr/share/nginx/html — der Ordner, aus dem es Dateien ausliefert.
          # Das Image selbst ändert sich dabei nicht: die Dateien erscheinen darin im Moment des Starts.
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: page
              mountPath: /usr/share/nginx/html
      # Was genau eingehängt werden soll. Die Namen conf und page sind intern, sie verbinden diesen
      # Block mit den volumeMounts oben; name innerhalb von configMap ist bereits der Name des realen
      # Objekts im Cluster. Vertun Sie sich dabei — der Pod hängt und wartet auf eine nicht existierende ConfigMap.
      volumes:
        - name: conf
          configMap:
            name: passes-conf
        - name: page
          configMap:
            name: passes-page
---
# --- 4 von 4. Ein dauerhafter Name, hinter dem alle Kopien stehen -----------------------------
# Pods werden neu erstellt, und ihre Adressen sind jedes Mal neu. Ein Service gibt einen unveränderlichen
# Namen — passes.passes.svc.cluster.local —, unter dem die lebenden Kopien innerhalb des Clusters immer
# erreichbar sind. Das ist interne Lastverteilung, von außerhalb des Clusters kommt man hier noch nicht hin.
apiVersion: v1
kind: Service
metadata:
  name: passes
  namespace: passes
spec:
  # Die Verbindung des Service mit den Pods ist keine Liste von Adressen, sondern die Bedingung „alle Pods mit dem Label app: passes".
  # Ist eine neue Kopie mit einem solchen Label erschienen — sie geriet von selbst unter die Lastverteilung, es muss
  # nichts registriert werden. Ist sie verschwunden — sie wurde aus der Ausgabe entfernt.
  selector:
    app: passes
  # port — auf welchem Port der Service selbst antwortet, targetPort — wohin er nach innen in den
  # Container weiterleitet. Hier verweist targetPort auf den Namen `http` aus dem Block ports oben,
  # nicht auf die Nummer: die Nummer lässt sich an einer Stelle ändern, und die Verbindung reißt nicht.
  ports:
    - port: 80
      targetPort: http
