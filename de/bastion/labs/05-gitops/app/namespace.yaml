---
# Lab 5 · Infrastruktur in Git. Namespace für den Dienst «Gästeausweis».
#
# Diese Datei wird nicht von Hand auf den Cluster angewendet. Sie legen sie in Ihr Repository auf
# GitHub, in den Ordner apps/, und Flux überträgt sie selbst in den Cluster `lab` — nach Zeitplan:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# Wie man ein beliebiges Manifest liest: apiVersion — die Version des Beschreibungsschemas (daran
# erkennt der Cluster, wie er es parsen muss), kind — was wir erstellen, metadata.name — der Name,
# unter dem das Objekt später gesucht wird. Diese drei Felder gibt es in jedem Objekt und sie werden
# unten nicht gesondert erklärt.
#
# Ein Namespace ist eine logische Trennwand innerhalb eines einzelnen Clusters:
# eigener Namenssichtbarkeitsbereich, eigene Rechte, eigene Quotas. Das Nächstliegende in vSphere ist
# ein Ordner im vCenter-Baum oder ein Resource Pool.
#
# Warum er zusammen mit der Anwendung in Git liegt und nicht von Hand erstellt wird: wenn der Dienst
# aus dem Repository verschwindet, entfernt Flux auch den Namespace. Es bleibt keine leere Trennwand
# zurück, bei der sich in einem halben Jahr niemand mehr erinnert, wozu sie angelegt wurde.
apiVersion: v1
kind: Namespace
metadata:
  name: passes
  # Das Label beeinflusst nicht den Betrieb des Dienstes — es wird gebraucht, um mit einem einzigen
  # Befehl alles zu finden, was zum «Gästeausweis» gehört: kubectl get all -A -l app.kubernetes.io/part-of=passes.
  # Der Name part-of stammt aus dem gängigen Satz von Kubernetes-Labels und ist nicht von uns erfunden:
  # fremde Werkzeuge (Monitoring, Exporte) suchen genau nach ihm.
  labels:
    app.kubernetes.io/part-of: passes
