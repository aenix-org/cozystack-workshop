# Lab 10 · Bestellung einer MongoDB-Datenbank für Ausweise unterschiedlicher Art.
# Eine Beschreibung dessen, was Sie erhalten möchten; die Plattform baut und konfiguriert den Dienst.
# Dasselbe, was Sie mit der Maus im Dashboard bestellen würden — nur als Text.
# Wird NICHT auf den Lab-Cluster angewendet, sondern auf einen Tenant im Management-Cluster:
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f mongodb.yaml
#
# VOR DEM ANWENDEN: Ersetzen Sie tenant-workshopXX durch Ihren eigenen Namespace
# und ЗдесьВашПароль durch ein Passwort Ihrer Wahl.
apiVersion: apps.cozystack.io/v1alpha1
kind: MongoDB
metadata:
  name: passes
  namespace: tenant-workshopXX
spec:
  # Eine einzelne Kopie. MongoDB ist für ein Replica-Set aus drei Knoten ausgelegt: sie stimmen ab,
  # welcher der primäre ist, und überstehen den Ausfall eines Knotens. Mit einer einzelnen Kopie gibt es
  # niemanden zum Abstimmen, und der Chart aktiviert dafür einen separaten „unsicheren“ Modus. Für ein Lab
  # in Ordnung, für die Produktion nicht.
  replicas: 1
  # Festplatte für die Daten. Für vier Übungsdokumente würde ein Megabyte reichen, aber es ist
  # einfacher, ein Volume mit etwas Reserve zu nehmen, als es später zu erweitern.
  size: 5Gi
  # replicated — Volumes, die eine Kopie auf einem anderen Knoten des Clusters haben: fällt ein Knoten aus,
  # bleiben die Daten erhalten.
  storageClass: replicated
  # CPU und Speicher, die dem Datenbank-Pod zugewiesen werden. Für vier Dokumente mehr als genug.
  resourcesPreset: s1.small
  # MongoDB-Zweig. Ihn nachträglich an einer laufenden Datenbank zu ändern, ist ohne Upgrade nicht möglich.
  version: v8
  # false — die Datenbank ist nur von innerhalb des Clusters erreichbar, nach außen wird kein Port freigegeben.
  # Sie greifen von einem daneben laufenden Arbeits-Pod darauf zu.
  external: false
  # Sharding teilt die Daten auf mehrere Server-Sätze auf. Nötig, wenn
  # die Daten nicht auf einen einzelnen Server passen; vier Ausweise passen.
  sharding: false
  # Der Datenbank-Benutzer und sein Passwort. Wählen Sie Ihr eigenes Passwort und merken Sie es sich: es wird vom
  # Arbeits-Pod (in der Verbindungszeichenfolge MONGO_URI) und vom Prüfskript benötigt
  # (die Variable MONGO_PASSWORD). Das Konto wird in der Dienstdatenbank admin angelegt —
  # weshalb authSource=admin in der Verbindungszeichenfolge zwingend erforderlich ist.
  users:
    passapp:
      password: ЗдесьВашПароль
  # Die Datenbank passes und die Rechte darin: dem Benutzer passapp wird die Rolle admin dieser
  # Datenbank erteilt, das heißt, er kann lesen, schreiben, Indizes erstellen und Sammlungseinstellungen ändern.
  # Rechte an anderen Datenbanken gewährt dies nicht.
  databases:
    passes:
      roles:
        admin:
          - passapp
  # Backups in den Objektspeicher. Auf dem Übungsstand deaktiviert.
  backup:
    enabled: false
