# Lab 9 · Bestellen einer ClickHouse-Datenbank für die Analyse über das Zutrittsprotokoll.
# Eine Beschreibung dessen, was Sie erhalten möchten; die Plattform stellt den Dienst zusammen und konfiguriert ihn.
# Dasselbe, was Sie mit der Maus im Dashboard bestellen würden — nur als Text.
# Wird NICHT auf den Laborcluster angewendet, sondern auf einen Tenant im Management-Cluster:
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f clickhouse.yaml
#
# VOR DEM ANWENDEN: Ersetzen Sie tenant-workshopXX durch Ihren Namespace
# und ЗдесьВашПароль durch ein Passwort, das Sie sich ausdenken.
apiVersion: apps.cozystack.io/v1alpha1
kind: ClickHouse
metadata:
  name: analytics
  namespace: tenant-workshopXX
spec:
  # Eine Kopie und ein Shard. In der Produktion hält man mindestens zwei Kopien, sonst bedeutet der Ausfall eines Knotens,
  # dass die Daten nicht verfügbar sind — aber wir brauchen eine Million Zeilen, keine Ausfall-
  # sicherheit, und eine zusätzliche Kopie würde nur die Ressourcen des Stands verbrauchen.
  replicas: 1
  shards: 1
  # Festplatte für die Tabellendaten. Eine Million Zeilen aus diesem Lab belegen einige zehn Megabyte:
  # die spaltenorientierte Speicherung mit Wörterbüchern komprimiert ein solches Protokoll sehr stark.
  size: 5Gi
  # Eine separate Festplatte für die System-Logs des Servers, einschließlich des Query-Logs.
  logStorageSize: 2Gi
  # Nach wie vielen Tagen das Query-Log verworfen wird. Wir werden hineinschauen.
  logTTL: 15
  # replicated — Volumes, die eine Kopie auf einem anderen Cluster-Knoten haben: der Knoten ist ausgefallen,
  # die Daten sind geblieben.
  storageClass: replicated
  # 1 CPU, 4 GB. ClickHouse rechnet im Arbeitsspeicher, und bei Gruppierungen über
  # eine Million Zeilen ist das spürbar.
  resourcesPreset: u1.small
  # Der Datenbankbenutzer und sein Passwort. Denken Sie sich Ihr eigenes Passwort aus und merken Sie es sich: es wird benötigt
  # vom Worker-Pod (Variable CH_AUTH) und vom Prüfskript (Variable CH_PASSWORD).
  # Nach der Erstellung ist es im Dashboard sichtbar, im Secret clickhouse-analytics-credentials.
  users:
    analyst:
      password: ЗдесьВашПароль
  # Backups in den Objektspeicher. Die Daten hier sind generiert,
  # es gibt nichts wiederherzustellen — auf dem Lernstand deaktiviert.
  backup:
    enabled: false
  # Keeper wird für den Abgleich zwischen den Kopien benötigt. Es gibt nur eine Kopie — es gibt niemanden,
  # mit dem abgeglichen werden könnte, und drei Keeper-Pods würden die Ressourcen umsonst belegen.
  clickhouseKeeper:
    enabled: false
