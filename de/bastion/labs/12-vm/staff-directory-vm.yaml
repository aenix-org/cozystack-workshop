---
# Labor 12. Eine virtuelle Maschine für ein Legacy-Mitarbeiterverzeichnis: die Festplatte und die Maschine selbst,
# zwei Objekte in einer Datei, getrennt durch eine `---`-Zeile.
#
# Dies sind Tenant-Objekte: Sie leben NICHT im `lab`-Cluster, sondern in Ihrem Namespace
# auf dem Management-Cluster. Sie benötigen die Tenant-Kubeconfig.
#
# Ersetzen Sie vor dem Anwenden tenant-workshopXX durch Ihren eigenen Namespace, sonst geht die Bestellung
# an den falschen Tenant statt an Ihren.
#
#     export KUBECONFIG=~/.kube/config
#     kubectl apply -f staff-directory-vm.yaml
#
# Dasselbe lässt sich mit der Maus im Tenant-Dashboard erledigen (Anwendung erstellen -> VM Disk,
# dann VM Instance) — das Ergebnis ist identisch.
#
# ACHTUNG: der Name, unter dem die Maschine später angesprochen wird, stimmt NICHT mit metadata.name überein, und das ist kein
# Tippfehler im Labor. Die Plattform stellt ein VMInstance-Objekt namens X mit dem
# `vm-instance`-Chart bereit, und der Chart-Name wird mit dem Release-Namen zusammengefügt: die laufende Instanz
# heißt vm-instance-X. Hinzu kommt, dass das Ziel mit einem Typ-Präfix angegeben wird, weil
# Tenant-Rechte auf Instanzen (virtualmachineinstances, alias vmi) vergeben sind, nicht auf
# virtualmachines — ein bloßer Name gibt forbidden zurück. Daher der Befehl zum Anmelden an der Konsole:
#     virtctl console --namespace=tenant-workshopXX vmi/vm-instance-spravochnik
# Liste der laufenden Instanzen: kubectl get vmi -n tenant-workshopXX
# Und `kubectl get vminstance spravochnik` zeigt nicht die Instanz, sondern Ihre Bestellung dafür —
# genau das Objekt, das unten beschrieben ist.
#
# Die Festplatte und die Maschine sind ZWEI VERSCHIEDENE Objekte, und das ist keine Bürokratie: die Festplatte überlebt
# die Maschine. Die Maschine kann gelöscht und neu erstellt werden, wobei dieselbe Festplatte angehängt wird.
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  source:
    image:
      # Ein Name aus der gemeinsamen Image-Sammlung der Plattform, keine URL.
      # Die Liste ist im Dashboard beim Erstellen einer Festplatte sichtbar.
      name: ubuntu-22.04
  # Festplattengröße. Sie kann nicht kleiner als das Quell-Image sein: ubuntu-22.04 wird auf
  # 20Gi entpackt, und die Plattform würde sich weigern, eine 10Gi-Festplatte zu befüllen. Die Festplatte kann später erweitert,
  # aber nicht verkleinert werden, daher kostet ein zu niedriger Wert hier mehr als ein zu hoher.
  storage: 20Gi
  # Storage-Klasse. `replicated` — die Daten werden in mehreren Kopien auf verschiedene Plattform-
  # Knoten geschrieben: ein Knoten mit einer Kopie kann ausfallen, und die Maschine läuft weiter. Im Grunde ist das
  # ein Spiegel, nur über das Netzwerk zusammengesetzt. Die Datenbanken in den benachbarten Laboren nutzen dieselbe Klasse.
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  # 1 CPU, 4 GB. Dieselbe Katalog-Referenz, aus der die Größen der
  # Kubernetes-Knoten entnommen werden: Maschinen und Knoten werden hier gleich gemessen.
  instanceType: u1.medium
  # Gast-Betriebssystem-Profil: welche Treiber und Geräte der Maschine übergeben werden sollen.
  instanceProfile: ubuntu
  # Always bedeutet „am Laufen halten": schaltet sie sich von selbst ab — wird sie wieder gestartet.
  # Halted — aus, Manual — wie hinterlassen.
  runStrategy: Always
  # Welche Festplatten an die Maschine angehängt werden sollen. Der Verweis erfolgt über den Namen des VMDisk-Objekts oben — genau
  # desjenigen, das diese Maschine überleben wird.
  disks:
    - name: spravochnik
  # Beachten Sie: es gibt hier KEIN replicas-Feld, und es wird auch keins geben.
  # Eine virtuelle Maschine ist ein einzelnes Objekt. Braucht man zwei Maschinen — zwei Objekte
  # mit unterschiedlichen Namen. Das ist ein grundlegender Unterschied zu Deployment,
  # siehe den README-Abschnitt darüber, wo dieser Unterschied wehtut.
  # Erstkonfiguration des Gast-Betriebssystems. cloud-init ist der Standardmechanismus von Linux-Cloud-
  # Images: beim ersten Start liest die Maschine diesen Text und wendet ihn auf sich selbst an. In seiner Rolle
  # ist es Gast-Anpassung in vSphere — Passwörter, Dateien, Dienste — nur per Beschreibung, nicht
  # per Assistent. Alles unterhalb der Einrückung nach `|` geht wortwörtlich an den Gast und wird
  # dort geparst, nicht von Kubernetes.
  #
  # Hier macht cloud-init aus dem Verzeichnis einen Server: es legt eine HTML-Seite ab und richtet einen Dienst ein,
  # der sie über HTTP auf Port 8080 ausliefert. python3 ist bereits im ubuntu-Image — das Internet
  # wird dafür nicht benötigt. Port 8080 ist nicht zufällig: der Kursleiter hat in Ihrem Tenant bereits einen
  # Service `spravochnik-http` (80 -> 8080) und einen Ingress `spravochnik` erstellt, und sobald der Dienst
  # in der Maschine hochkommt, wird das Verzeichnis auf der Tenant-Domain veröffentlicht.
  cloudInit: |
    #cloud-config
    # Das Passwort wird benötigt, um sich vom Dashboard aus an der Konsole anzumelden. Auf einer Produktionsmaschine
    # sollte man das nicht tun — dort verwendet man sshKeys.
    password: ubuntu
    chpasswd: { expire: false }
    ssh_pwauth: true
    write_files:
      - path: /opt/directory/index.html
        content: |
          <!doctype html><html lang="de"><head><meta charset="utf-8"><title>Verzeichnis</title></head><body><h1>Mitarbeiterverzeichnis</h1><ul><li>Weber J. — 101</li><li>Peters P. — 102</li></ul></body></html>
      - path: /etc/systemd/system/directory.service
        content: |
          [Unit]
          Description=Staff directory
          After=network.target
          [Service]
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0 --directory /opt/directory
          Restart=always
          [Install]
          WantedBy=multi-user.target
    runcmd: [ "systemctl daemon-reload", "systemctl enable --now directory" ]
