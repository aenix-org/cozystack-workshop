# Lab 8 · Schritt 3 von 3: Im Manifest gibt es kein Passwort — weder im Klartext noch in base64.
# Die finale Version. Diese Datei kann man in Git ablegen, einem Auftragnehmer zeigen und
# auf ein T-Shirt drucken.
#
# Worin sich dieser Schritt vom zweiten unterscheidet: dort wurde der Wert doch niedergeschrieben — in eine Datei
# und dann in ein Cluster-Objekt. Hier ist er in der Beschreibung überhaupt nicht vorhanden; die Anwendung holt
# das Passwort selbst, beim Start, aus dem OpenBao-Speicher.
#
#   secrets-demo-naive.yaml      das Passwort sieht jeder, der die Datei öffnet
#   secrets-demo-secret.yaml     das Passwort ist in ein Secret-Objekt ausgelagert
#   secrets-demo.yaml         <- Sie sind hier: das Passwort kommt beim Start aus dem Speicher
#
# VOR DEM ANWENDEN: Ersetzen Sie tenant-workshopXX durch Ihren eigenen Namespace — er ist Teil der Speicher-
# Adresse unten. XX ist ein Platzhalter, kein Teil des Namens.
# Wo es angewendet wird: Ihr Cluster `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Befehl: kubectl apply -f secrets-demo.yaml
#
# Das Token, mit dem sich die Anwendung gegenüber dem Speicher ausweist, liegt im Secret passes-bao-token.
# Sie erstellen es mit einem Befehl, nicht mit einer Datei: dieses Manifest enthält nur den Objektnamen,
# und ein Name ist kein Geheimnis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # Alles läuft als non-root. fsGroup wird benötigt, weil es hier zwei Container gibt: einer
      # schreibt die Datei mit dem Passwort, der andere liest sie. Ohne eine gemeinsame Gruppe schreibt der Init-Container
      # eine Datei, die der Haupt-Container nicht öffnen kann, und Sie grübeln eine halbe Stunde,
      # wo Sie sich vertan haben.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Der Ort, an dem ein Container das Passwort ablegt und der andere es liest.
      # medium: Memory bedeutet, dass diese „Festplatte“ im RAM des Knotens liegt
      # und niemals auf eine echte Festplatte gelangt: nicht in ein Backup, nicht in einen Volume-Dump, nicht zu dem,
      # der die Festplatte aus dem Server nimmt. Ist der Pod weg — ist auch der Inhalt weg.
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      # Der Init-Container läuft VOR dem Haupt-Container und muss erfolgreich abschließen.
      # Schafft er es nicht, das Passwort zu holen, startet die Anwendung gar nicht, und das ist das richtige
      # Verhalten: ein Dienst ohne Datenbank-Passwort ist ohnehin unbrauchbar, es ist ehrlicher, nicht hochzukommen,
      # als hochzukommen und Fehler ins Log zu spucken.
      initContainers:
        - name: fetch-secret
          # Wir nehmen das OpenBao-Image selbst wegen eines einzigen Werkzeugs, `bao` — seines Clients.
          # Eigenen Code muss man nicht schreiben.
          image: openbao/openbao:2.5.1
          # bao kv get -field=password — ein einzelnes Feld über einen einzelnen Pfad holen, nicht das ganze
          # Secret. tr -d '\n' entfernt den Zeilenumbruch, der sonst im Passwort landen würde:
          # ein zusätzliches Zeichen am Ende wird von der Datenbank abgelehnt, und so etwas aufzuspüren ist unangenehm.
          # chmod 0400 — nur der Eigentümer kann die Datei lesen.
          # set -e stoppt das Skript beim allerersten Fehler: andernfalls würde der Container
          # erfolgreich mit einer leeren Datei beenden, und man müsste es erst in der Anwendung debuggen.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              bao kv get -field=password secret/passes/db \
                | tr -d '\n' > /secrets/db_password
              chmod 0400 /secrets/db_password
              echo "Passwort aus OpenBao geholt, im Manifest steht es nicht"
          # Die Speicher-Adresse und das Token, mit dem die Anwendung ihr Leserecht nachweist.
          # Das Token wird über ein per Befehl erstelltes Objekt referenziert; hierher, in die Datei, gelangt es nicht.
          # In der Adresse ist tenant-workshopXX genau jener Platzhalter, der ersetzt werden muss.
          env:
            - name: BAO_ADDR
              value: http://openbao-secrets.tenant-workshopXX.svc.cozy.local:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: passes-bao-token
                  key: token
          # Der gemeinsame Ordner. Diesem Container ist er zum Schreiben zugeteilt — er schreibt hinein.
          volumeMounts:
            - name: secrets
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Limits höher als beim Haupt-Container: das OpenBao-Werkzeug ist schwerer als busybox,
          # aber es lebt nur wenige Sekunden, das sind also keine dauerhaften Kosten.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      # Der Haupt-Container startet erst, nachdem der Init-Container fertig ist.
      containers:
        - name: app
          image: busybox:1.36
          # Dieselbe Schleife wie in den vorherigen Schritten, aber das Passwort ist jetzt nicht in einer Umgebungs-
          # variablen, sondern in einer Datei: der Fingerabdruck wird direkt aus /secrets/db_password berechnet.
          # Umgebungsvariablen sind in der Ausgabe von kubectl describe pod sichtbar und landen in Prozess-
          # Dumps; eine Datei im Speicher des Pods nicht.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s verbinde mit %s als %s, Passwort-Fingerabdruck sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(sha256sum /secrets/db_password | cut -c1-12)"
                sleep 10
              done
          # Hier bleiben nur die nicht geheimen Einstellungen — die Adresse und der Login.
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
          # Derselbe Ordner, aber nur lesend: die Anwendung kann das Passwort weder beschädigen noch austauschen,
          # selbst wenn sie es unbedingt möchte.
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
