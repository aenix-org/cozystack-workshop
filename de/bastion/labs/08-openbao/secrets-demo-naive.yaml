# Lab 8 · Stufe 1 von 3: Das Passwort liegt im Klartext im Manifest.
# So sieht der Dienst «Propusk» heute aus — und genau diese Datei hat das Audit gefunden.
# Wir wenden sie genau einmal an, um das Problem mit eigenen Augen zu sehen.
#
# Die drei Stufen der Lab, damit du den Überblick behältst:
#   secrets-demo-naive.yaml   <- du bist hier: jeder, der die Datei öffnet, sieht das Passwort
#   secrets-demo-secret.yaml     das Passwort ist in ein separates Secret-Objekt ausgelagert
#   secrets-demo.yaml            im Manifest steht überhaupt kein Passwort mehr
#
# Wo es angewendet wird: dein Cluster `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Befehl: kubectl apply -f secrets-demo-naive.yaml
#
# Das Passwort in dieser Datei ist ein Übungspasswort und erfunden, echte gibt es hier keine. Ein einziges Objekt —
# ein Deployment; apiVersion, kind und metadata.name werden im Folgenden nicht weiter kommentiert.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # Eine Kopie genügt: Wir schauen nicht auf Ausfallsicherheit, sondern darauf,
  # woher die Anwendung das Passwort bezieht.
  replicas: 1
  # An diesem Label erkennt das Deployment seine Pods. Es stimmt mit dem Label im Template unten überein.
  selector:
    matchLabels:
      app: secrets-demo
  # template — die Pod-Vorlage: woraus eine Kopie gebaut wird.
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # Sicherheitsanforderungen: nicht als root, ein eingeschränkter Satz an Systemaufrufen.
      # Beachte den Widerspruch: Der Pod ist nach allen Sicherheitsregeln konfiguriert, und das hindert
      # das Passwort keineswegs daran, zehn Zeilen weiter unten in der Datei zu liegen.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Eine echte Anwendung gibt es hier nicht — busybox und ein paar Zeilen Shell.
          # Für diese Lab zählt nur eines: woher das Passwort kommt, nicht was damit
          # danach geschieht.
          image: busybox:1.36
          env:
            # Die Datenbankadresse und der Benutzername sind keine Geheimnisse: zu wissen, dass
            # die Datenbank passes-db heißt, gewährt für sich genommen keinen Zugang.
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # GENAU DIESE ZEILE HAT DAS AUDIT GEFUNDEN.
            # Die Datei liegt in Git, das heißt das Passwort kennt jeder, der Zugriff
            # auf das Repository hat, und jeder, der es jemals geklont hat.
            - name: DB_PASSWORD
              value: "Propusk2019!"
          # Endlosschleife: alle zehn Sekunden wird eine Zeile ins Log geschrieben. Ins Log geht nicht das
          # Passwort selbst, sondern sein sha256-Fingerabdruck — die ersten zwölf Zeichen. Am Fingerabdruck
          # sieht man, dass das Passwort gewechselt hat, aber den Wert kann man daraus nicht rekonstruieren.
          # In echten Diensten werden Logs genau so geschrieben.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          # Der Appetit ist winzig: Das ist eine Demonstration, keine Last.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
