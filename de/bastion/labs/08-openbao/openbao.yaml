# Lab 8 · Bestellung eines OpenBao-Secrets-Speichers.
# Dasselbe, was Sie mit der Maus im Dashboard bestellen würden — nur als Text.
# Wird NICHT auf den Laborcluster angewendet, sondern auf einen Tenant im Management-Cluster:
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f openbao.yaml
#
# VOR DEM ANWENDEN: Ersetzen Sie tenant-workshopXX durch Ihren eigenen Namespace. XX ist ein Platzhalter,
# kein Teil des Namens; Ihre eigene Nummer haben Sie zusammen mit dem Passwort erhalten. Landet es
# im Tenant eines anderen — bekommen Sie eine Zugriffsverweigerung, und das ist noch der beste mögliche Ausgang.
#
# kind: OpenBAO — das ist kein eingebautes Kubernetes-Objekt, sondern ein Typ, den Cozystack
# hinzufügt. Sie beschreiben, was Sie brauchen, und die Plattform selbst rollt die Pods, Datenträger
# und Dienste aus und aktualisiert sie danach selbst. Am nächsten kommt das dem Bestellen eines Dienstes aus einem Katalog,
# nicht der Installation von Software auf einer bereitgestellten virtuellen Maschine.
apiVersion: apps.cozystack.io/v1alpha1
kind: OpenBAO
metadata:
  # Der Name wirkt sich nicht nur auf die Karte im Dashboard aus: Die interne Adresse des Speichers
  # wird daraus zusammengesetzt — openbao-secrets.<namespace>.svc.cozy.local. Wenn Sie ihn umbenennen —
  # passen Sie die Adresse in secrets-demo.yaml und in der Variable BAO_APP für check.sh an.
  name: secrets
  namespace: tenant-workshopXX
spec:
  # Eine einzige Kopie. In Produktion stellt man drei auf und erhält Raft-Replikation: Das Chart aktiviert
  # sie selbst, sobald replicas > 1. Ein Hin- und Herwechseln erfordert
  # das Verschieben von Daten, daher wird die Entscheidung davor getroffen, nicht danach.
  replicas: 1
  # Datenträger für die Daten des Speichers. Zwei Gigabyte sind mit Reserve: Secrets wiegen Bytes,
  # der Platz geht für den Versionsverlauf und das Audit-Log drauf. Ein Volume nach dem Anlegen zu verkleinern
  # ist nicht möglich, es zu vergrößern in der Regel schon, deshalb lohnt sich Knausern hier nicht.
  size: 2Gi
  # Die Speicherklasse replicated bedeutet, dass die Daten in mehreren Kopien auf
  # verschiedenen Knoten liegen. Der Ausfall eines Knotens nimmt nicht all Ihre Passwörter mit sich — und einen
  # Secrets-Speicher aus einem Backup wiederherzustellen ist eine gesondert unangenehme Angelegenheit.
  storageClass: replicated
  # Ein fertiges Set „wie viel CPU und Arbeitsspeicher“. Die Plattform bietet sie als Liste an,
  # um nicht jeden zu zwingen, Requests und Limits von Hand auszurechnen.
  resourcesPreset: t1.small
  # Die Weboberfläche wird innerhalb des Clusters hochgefahren. Nach außen geben wir sie nicht frei:
  # external: true würde einen LoadBalancer anhängen, und den brauchen wir im Labor nicht.
  ui: true
  external: false
