# Lab 8 · Stufe 2 von 3: Das Passwort wird aus dem Deployment in ein eigenes Secret-Objekt ausgelagert.
# "Naive Reparatur": Im Anwendungsbeschrieb ist das Passwort nicht mehr sichtbar, der Entwickler ist zufrieden,
# der Auditor nicht. Warum — sehen wir mit einem einzigen Befehl.
#
# Wodurch diese Stufe besser ist als die erste: Der Wert ist nicht mehr Teil des Anwendungsbeschriebs,
# er wird jetzt über den Namen referenziert. Wodurch sie schlechter ist als die dritte — der Wert muss
# trotzdem irgendwo aufgeschrieben werden, und hier steht er direkt in dieser Datei.
#
#   secrets-demo-naive.yaml      das Passwort sieht jeder, der die Datei öffnet
#   secrets-demo-secret.yaml  <- Sie sind hier: das Passwort steht in einem Secret-Objekt
#   secrets-demo.yaml            im Manifest gibt es überhaupt kein Passwort
#
# Wo es angewendet wird: Ihr Cluster `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Befehl: kubectl apply -f secrets-demo-secret.yaml
#
# Das Passwort in dieser Datei ist ein erfundenes Übungspasswort. Die Datei enthält zwei Objekte, getrennt
# durch eine `---`-Zeile: ein Secret und ein Deployment, das darauf verweist. apiVersion, kind
# und metadata.name werden weiter unten in der Datei nicht kommentiert.
#
# Ein Secret ist eine eigene Art von Objekt für das, was nicht im Anwendungsbeschrieb liegen soll.
# Der Cluster geht damit etwas sorgfältiger um als mit gewöhnlichen Einstellungen: Werte
# werden in kubectl describe nicht angezeigt, Leserechte werden separat vergeben.
apiVersion: v1
kind: Secret
metadata:
  name: passes-db
# Opaque bedeutet "eine beliebige Menge von Schlüssel-Wert-Paaren". Es gibt spezielle Typen —
# für den Zugriff auf eine Image-Registry, für TLS-Zertifikate, — aber hier wird nichts
# Spezielles benötigt.
type: Opaque
data:
  # Das ist KEINE Verschlüsselung. Das ist base64 — eine Art, Bytes mit druckbaren Zeichen zu schreiben.
  # Es gibt keinen Schlüssel, kein Passwort zum Entschlüsseln, die Rückumwandlung kann jeder durchführen.
  password: UHJvcHVzazIwMTkh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # Das Deployment unten ist dasselbe wie in der ersten Stufe. Genau eine
  # Stelle hat sich geändert: wie DB_PASSWORD in den Pod gelangt.
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # Nicht als root, ein eingeschränkter Satz von Systemaufrufen.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Wieder busybox und ein paar Zeilen Shell: Wir betrachten den Weg des Passworts,
          # nicht die Arbeit der Anwendung.
          image: busybox:1.36
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # Das ist der ganze Unterschied zur ersten Stufe. valueFrom statt value bedeutet
            # "den Wert von dort nehmen": secretKeyRef.name — welches Objekt, key — welches
            # Feld darin. Die Einsetzung erfolgt beim Start des Pods, im Anwendungs-
            # beschrieb bleibt nur der Name.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: passes-db
                  key: password
          # Dieselbe Schleife wie in der ersten Stufe: Sie gibt den Fingerabdruck des Passworts aus, nicht das
          # Passwort selbst. Der Fingerabdruck ist gerade zum Vergleich der Stufen praktisch — wenn er sich nicht
          # geändert hat, dann ist derselbe Wert wie zuvor im Pod angekommen.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
