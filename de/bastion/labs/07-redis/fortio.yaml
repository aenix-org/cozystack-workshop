---
# Lab 7 · Lastgenerator mit Weboberfläche.
# Derselbe wie im Skalierungs-Lab: die Last wird per Knopf im Browser gestartet,
# und das Latenz-Histogramm ist gleich dort zu sehen. Wenn er bei dir bereits
# ausgerollt ist, musst du diese Datei nicht anwenden — kubectl antwortet «unchanged».
#
# Wo es angewendet wird: dein Cluster `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Befehl: kubectl apply -f fortio.yaml
#
# Zwei Objekte, getrennt durch `---`: Deployment (der Generator selbst) und Service (der Name,
# über den er erreicht wird). apiVersion, kind und metadata.name werden weiter unten nicht kommentiert.
#
# Das Image wird vom öffentlichen Docker Hub bezogen, nicht aus deinem Harbor: Fortio ist nicht Teil
# des Dienstes «Gästeausweis», sondern ein Messgerät, das nur vorübergehend im Cluster lebt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # Eine einzige Kopie. Der Lastgenerator muss nicht skaliert werden — er soll allein
  # die Latenzen ehrlich zählen. Zwei Kopien ergäben zwei nicht zusammengeführte Histogramme.
  replicas: 1
  # Das Label, an dem das Deployment seinen Pod erkennt. Stimmt mit dem Label im template unten überein.
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # Dieselben Sicherheitsanforderungen wie beim Rest: der Prozess läuft nicht als root,
      # und Systemaufrufe sind durch ein seccomp-Profil eingeschränkt.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Der Tag `latest` ist hier eine Vereinfachung für den Workshop, und sie widerspricht dem, was
          # das Lab zur eigenen Registry lehrt: das Image unter diesem Tag kann sich unbemerkt
          # zwischen zwei Applies ändern, und die gestrige Messung wird nicht reproduzierbar. Für einen
          # Lastgenerator auf einem Übungsstand ist das akzeptabel, für ein Produktivsystem nicht.
          image: fortio/fortio:latest
          # `server` ist der Modus, in dem Fortio die Weboberfläche hochfährt und wartet, bis du
          # einen Knopf drückst. Ohne dieses Argument führt das Image einen einmaligen Befehl aus und beendet sich.
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # Der Generator braucht CPU-Reserve, sonst stößt er an
              # sein eigenes Limit und du belastest nicht die Anwendung, sondern Fortio.
              cpu: "1"
              memory: 256Mi
---
# Der Service wird gebraucht, um die Weboberfläche zu öffnen: den Generator erreicht man über den Namen
# per Portweiterleitung — kubectl port-forward svc/fortio 8081:8080 — und geht
# auf localhost:8081. Den Dienst beschießen kann man auch ohne Service, mit dem Befehl
# kubectl exec deploy/fortio, aber das Histogramm im Browser gibt nur dieser Weg.
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  # Hier stimmen die Nummer beim Service und der Container-Port überein — anders als bei den übrigen
  # Diensten des Labs, wo außen 80 und innen 8080 ist. Der Unterschied liegt nur in der Bequemlichkeit.
  ports:
    - port: 8080
      targetPort: http
