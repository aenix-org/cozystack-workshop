---
# Lab 7 · Stub des Legacy-Mitarbeiterverzeichnisses.
# Im echten Leben ist das ein fremdes System, das Sie nicht umschreiben dürfen: es antwortet in 800 ms,
# und damit muss man irgendwie leben. Hier ein Stub mit demselben Verhalten, damit es etwas zu messen gibt.
#
# Wo es zum Einsatz kommt: Ihr Cluster `lab` (export KUBECONFIG=~/lab.kubeconfig), nicht der Cozystack-
# Management-Cluster. Befehl: kubectl apply -f hr-legacy.yaml
#
# HARBOR-HOST ist ein Platzhalter, keine Adresse. Setzen Sie die Adresse Ihres eigenen Harbor ein, sonst versucht der Cluster,
# das Image von einem nicht existierenden Host zu ziehen:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # macOS
#
# Die Datei enthält zwei durch eine `---`-Zeile getrennte Objekte: ein Deployment (was läuft und in wie vielen
# Kopien) und ein Service (ein dauerhafter Name, über den diese Kopien erreicht werden). Bei jedem Objekt
# sagen apiVersion und kind, um welche Art von Objekt es sich handelt, und metadata.name ist sein Name;
# weiter unten werden diese drei Felder nicht kommentiert.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-legacy
  labels:
    app: hr-legacy
spec:
  # Wie viele Kopien laufen sollen. Verschwindet eine Kopie, erstellt der Cluster eine neue, ohne
  # zu fragen. Dem Verzeichnis reicht eine: es ist hier nicht für Last da, sondern zum Messen.
  replicas: 1
  # An diesem Label erkennt das Deployment seine eigenen Pods unter allen anderen im Cluster.
  # Das Label im selector und das Label im template unten müssen übereinstimmen, sonst findet das Objekt
  # nicht, was es selbst erstellt hat.
  selector:
    matchLabels:
      app: hr-legacy
  # template ist die Pod-Vorlage. Alles darunter beschreibt eine Kopie: woraus sie zusammengesetzt wird,
  # mit welchen Rechten sie läuft und wie man erkennt, dass sie bereit ist, Anfragen anzunehmen.
  template:
    metadata:
      labels:
        app: hr-legacy
    spec:
      # Sicherheitsanforderungen auf Pod-Ebene. Der Prozess läuft nicht als root (uid 10001),
      # das seccomp-Profil schneidet Systemaufrufe ab, die die Anwendung nicht braucht.
      # In einem Cluster mit aktivierten Policies startet ein Pod ohne diese Felder gar nicht.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Harbor ist mit Login und Passwort geschützt, und der Cluster muss sich irgendwie ausweisen. Das Secret
      # `harbor` haben Sie im Registry-Lab angelegt. Ohne diese Referenz wird das Image nicht gezogen,
      # und der Pod bleibt im Zustand ImagePullBackOff.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: hr
          # Dasselbe wie auf Pod-Ebene, aber für einen konkreten Container: wir verbieten
          # Privilege-Escalation und entziehen alle Kernel-Capabilities. Die Go-Anwendung
          # braucht keine davon.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Das Image ist dasselbe für das Verzeichnis und für den Dienst «Gästeausweis» selbst.
          # Welcher Prozess tatsächlich startet, entscheidet die Variable MODE unten.
          image: HARBOR-HOST/passes/passes-api:v2
          # Der Port hat einen Namen, nicht nur eine Nummer: die Readiness-Probe und der Service unten
          # verweisen auf den Namen. Ändert sich die Nummer, korrigieren Sie es an einer Stelle.
          ports:
            - containerPort: 8080
              name: http
          # Umgebungsvariablen sind die einzige Möglichkeit, diese Anwendung zu konfigurieren.
          # Das Image nur zum Ändern des Verhaltens neu zu bauen ist nicht nötig.
          env:
            # MODE=hr — die Instanz gibt vor, das HR-System zu sein: sie wartet und antwortet.
            - name: MODE
              value: "hr"
            # Genau die Verzögerung, die das echte Verzeichnis zeigt.
            # Indem Sie sie ändern, ändern Sie «wie schlimm es steht» — probieren Sie später 2s.
            - name: HR_DELAY
              value: "800ms"
            # Der Pod kennt seinen eigenen Namen nicht im Voraus — der Cluster vergibt ihn bei der Erstellung.
            # fieldRef fügt diesen Namen beim Start in die Variable ein, und er
            # landet in der Antwort des Dienstes: man sieht, welche Kopie geantwortet hat.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # requests — wie viele Ressourcen für den Container bei der Knotenauswahl reserviert werden,
          # limits — die Obergrenze, über die er nicht hinausgelassen wird. Ähnlich wie reservation
          # und limit in vSphere, aber pro Container gesetzt, nicht pro virtuelle Maschine.
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # Readiness-Probe. Solange /healthz nicht antwortet, sendet der Service keine einzige
          # Anfrage an diese Kopie. Ohne Probe geht der Traffic an einen noch nicht gestarteten Prozess,
          # und Sie sehen Fehler aus dem Nichts — obwohl «alles ausgerollt ist».
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — ein dauerhafter Name und eine dauerhafte Adresse für eine Menge von Pods. Pods werden neu erstellt
# und bekommen jedes Mal eine neue IP, aber der Name hr-legacy bleibt derselbe. Ähnlich wie ein Load-Balancer-
# VIP, aber er wird in vier Zeilen eingerichtet und lebt innerhalb des Clusters.
apiVersion: v1
kind: Service
metadata:
  name: hr-legacy
spec:
  # An diesem Label stellt der Service die Liste der lebenden Kopien zusammen. Dasselbe Label wie bei den Pods oben:
  # stimmt es nicht überein, existiert der Service und führt nirgendwohin.
  selector:
    app: hr-legacy
  ports:
    # Anfragen kommen auf Port 80 herein, im Pod geht das an den Port mit Namen http (8080).
    - port: 80
      targetPort: http
