---
# Lab 7 · den Cache im Ernstfall aktivieren. Wird über die bereits ausgerollte passes-api
# in eurem `lab`-Cluster angewendet (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch.yaml
#
# Das ist ein Patch, kein vollständiges Manifest: hier ist nur beschrieben, was sich ändert. Alles Übrige —
# das Image, die Labels, die Probes, die Ressourcen — bleibt aus passes-api.yaml unangetastet. Deshalb
# beginnt die Datei gleich mit spec: der Pfad bis zum Container spiegelt die Struktur des Deployments wider, damit
# der Cluster versteht, wo genau die Änderung einzutragen ist.
#
# Der Containername `api` ist keine Zierde, sondern eine Adresse: darüber findet der Cluster den richtigen Container
# in der Liste. Vertippt ihr euch im Namen, bekommt ihr statt einer Änderung einen zweiten Container.
#
# Setzt die Adresse eures eigenen Redis anstelle von REDIS-ADDR ein — das ist ein Platzhalter, kein Hostname.
# Die Adresse entnehmt ihr dem Dashboard, in der Karte eurer verwalteten Redis-Anwendung.
spec:
  template:
    spec:
      containers:
        - name: api
          # env-Listen in Kubernetes werden über das Feld name zusammengeführt, deshalb
          # werden die drei Einträge unten zu den bereits im Deployment vorhandenen hinzugefügt, statt sie zu ersetzen.
          env:
            # Das Auftauchen dieser Variable ist genau das, was «den Cache aktivieren» bedeutet: die Anwendung prüft sie
            # beim Start und geht, falls sie gesetzt ist, zuerst zu Redis. Leer oder
            # nicht vorhanden — arbeitet sie wie zuvor, über das Verzeichnis bei jeder Anfrage.
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
            # Das Passwort schreiben wir nicht im Klartext: es kommt aus einem Secret, das ihr
            # mit einem separaten Befehl erstellt. In ein Manifest, das in Git liegt,
            # gehört ein Passwort nicht.
            #
            # secretKeyRef ist eine Referenz: name — der Name des Secret-Objekts im selben Cluster,
            # key — welches Feld daraus zu nehmen ist. Der Wert wird beim Start
            # des Pods eingesetzt und taucht niemals in der Datei auf.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
            # Wie viele Sekunden ein Eintrag im Cache lebt. Sechzig — weil
            # sich das Mitarbeiterverzeichnis einmal am Tag ändert, nicht einmal pro Sekunde.
            #
            # Längere Frist — wir gehen seltener ins Verzeichnis, geben aber länger einen veralteten
            # Nachnamen aus. Kürzer — die Daten sind frischer, der Gewinn ist geringer. Das ist ein Kompromiss,
            # keine Einstellung mit einem richtigen Wert.
            - name: CACHE_TTL
              value: "60"
