---
# Lab 7 · Dienst „Pass", Version v2 — diejenige, die mit einem Cache arbeiten kann.
# Der Cache ist hier noch NICHT aktiviert: zuerst messen wir, wie schlecht es ohne ihn ist. Aktiviert wird er später,
# per Patch cache-patch.yaml aus demselben Ordner.
#
# Wo es angewendet wird: dein Cluster `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Befehl: kubectl apply -f passes-api.yaml
#
# HARBOR-HOST ist ein Platzhalter, keine Adresse. Setze die Adresse deines eigenen Harbor ein (siehe hr-legacy.yaml,
# dort steht auch der sed-Befehl, um sie in allen Dateien auf einmal zu ersetzen).
#
# Die Datei enthält zwei Objekte, getrennt durch `---`: Deployment (Kopien der Anwendung) und Service (ein stabiler Name
# für sie). apiVersion, kind und metadata.name werden weiter unten in der Datei nicht mehr kommentiert.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Zwei Kopien, nicht eine, damit später die Haupteigenschaft des Caches sichtbar wird: er ist gemeinsam.
  # Ein Pod hat die Antwort in Redis abgelegt, ein anderer hat sie von dort geholt, obwohl er selbst nie das Verzeichnis aufgesucht hat.
  replicas: 2
  # Anhand dieses Labels unterscheidet das Deployment seine eigenen Pods von fremden. Es muss mit dem Label
  # im template unten übereinstimmen, sonst findet das Objekt nicht, was es selbst erstellt hat.
  selector:
    matchLabels:
      app: passes-api
  # template — die Pod-Vorlage: woraus jede Kopie zusammengebaut wird.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Sicherheitsanforderungen auf Pod-Ebene: nicht als root, eingeschränkter Satz an System-
      # aufrufen. In einem Cluster mit aktivierten Richtlinien wird ein Pod ohne diese Felder nicht akzeptiert.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Wie sich der Cluster gegenüber dem geschlossenen Harbor beim Ziehen des Images ausweist. Ohne Verweis
      # auf dieses Secret bleibt der Pod in ImagePullBackOff hängen.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # Die Rechte des Containers sind auf ein Minimum reduziert: Eskalation ist verboten, keine Kernel-Privilegien.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Dasselbe Image wie das Verzeichnis. Nur das MODE unten trennt sie.
          image: HARBOR-HOST/passes/passes-api:v2
          # Der Portname wird benötigt, damit die Probe und der Service auf einen Namen verweisen, nicht auf eine Zahl.
          ports:
            - containerPort: 8080
              name: http
          # Das gesamte Verhalten der Anwendung wird hier festgelegt. Beachte: die Variablen
          # REDIS_ADDR und REDIS_PASSWORD stehen nicht in der Liste — und genau deshalb ist der Cache aus,
          # und jede Anfrage geht ehrlich an das langsame Verzeichnis.
          env:
            # MODE=api — diese Instanz arbeitet als der Dienst „Pass" selbst.
            - name: MODE
              value: "api"
            # Die Anwendung braucht Version und Registry nicht zum Arbeiten — sie sind in der Antwort auf „/" sichtbar
            # und lassen dich bestätigen, dass genau das läuft, was du gerade gebaut hast.
            - name: APP_VERSION
              value: "v2"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # Wohin für Daten gegangen wird. Ein Service-Name, keine Adresse: die Kopien des Verzeichnisses
            # können beliebig oft neu erstellt werden, der Name ändert sich nicht.
            - name: HR_URL
              value: "http://hr-legacy.default.svc.cluster.local"
            # Wer die Anfrage ausführt und wo. Der Cluster setzt diese drei Werte selbst ein:
            # niemand kennt sie im Voraus. Sie landen in der Antwort des Dienstes, und daran ist zu sehen,
            # welche Kopie auf welchem Knoten geantwortet hat — das ist bei den Messungen nützlich.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — was bei der Knotenauswahl reserviert wird, limits — die Obergrenze. Eine Obergrenze von einem
          # Kern ist hier keine Gier: unter Last stößt die Anwendung an sie, statt den
          # ganzen Knoten aufzufressen, und die Messung zeigt die Latenz des Verzeichnisses, nicht einen Kampf um die CPU.
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # Solange /healthz nicht antwortet, sendet der Service keine einzige Anfrage an diese Kopie.
          # Bei einem Update bewahrt dich genau dieses Feld vor einem Ausfall: alte Kopien werden nicht entfernt,
          # bis die neuen ihre Bereitschaft melden.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — ein stabiler Name für beide Kopien und die Verteilung der Anfragen zwischen ihnen.
# Pods werden neu erstellt und wechseln IPs, der Name passes-api bleibt. Unter diesem Namen erreichen
# sowohl Fortio als auch das Prüfskript den Dienst.
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # Das Label, anhand dessen der Service die Liste der lebenden Kopien zusammenstellt. Stimmt es nicht mit dem Label der Pods überein —
  # existiert der Service und führt ins Leere.
  selector:
    app: passes-api
  ports:
    # Von außen verbindet man sich auf 80, in den Pod geht es zum Port mit dem Namen http (8080).
    - port: 80
      targetPort: http
