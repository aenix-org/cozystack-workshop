---
# Lab 7 · DIESER PATCH IST ABSICHTLICH UNVOLLSTÄNDIG. Er ist dazu da, dass Sie sehen, wie
# «wir haben den Cache irgendwie aktiviert, aber es wurde nicht schneller» aussieht. Die funktionierende Variante steht in cache-patch.yaml.
#
# Wird in Ihrem Cluster `lab` angewendet (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch-broken.yaml
#
# Nicht bei der Lösung spicken. Wenden Sie ihn an, senden Sie ein paar Anfragen und schauen Sie in die
# Anwendungslogs: kubectl logs -l app=passes-api. Die Anwendung sagt Ihnen, was mit ihr nicht stimmt
# — es geht darum, die Nachricht zu lesen und herauszufinden, was in dieser Datei fehlt.
#
# Setzen Sie Ihre eigene Redis-Adresse anstelle von REDIS-ADDR ein (siehe den Schritt zum Finden der Adresse).
# Den Platzhalter dürfen Sie nicht stehen lassen: dann bekommen Sie den falschen Fehler, nicht den, für den das Ganze eingerichtet wurde.
spec:
  template:
    spec:
      containers:
        # Der Containername ist die Adresse, über die der Cluster die zu bearbeitende Stelle findet.
        - name: api
          env:
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
