# Lab 1. Die gesamte Lern-App rickroll in einer einzigen Datei: nginx-Einstellungen, die Seite,
# das Deployment selbst und eine dauerhafte Adresse, um sie zu erreichen. Vier Objekte, getrennt durch `---`.
#
# Wird auf Ihrem Lern-Cluster `lab` angewendet, nicht in einem Tenant auf dem Management-Cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll.yaml
# Platzhalter wie tenant-workshopXX gibt es hier nicht — Sie müssen Ihre Nummer nirgends einsetzen.
#
# Die Felder, die sich über alle vier Objekte wiederholen, werden hier einmal behandelt:
#   apiVersion — die API-Gruppe, in der dieser Objekttyp lebt;
#   kind       — der Objekttyp selbst;
#   metadata.name — der Name, unter dem das Objekt später über `kubectl get` gesucht wird.
# Ein Name ist innerhalb seines eigenen Typs eindeutig, daher heißen das Deployment und der Service unten beide
# rickroll und kollidieren nicht.
---
# nginx-Einstellungen. Sie ändern sich zwischen den Seitenversionen nicht, deshalb werden sie separat gehalten.
# ConfigMap — eine Einstellungsdatei, die eigenständig im Cluster lebt und beim Start in den
# Container gelegt wird. Der Sinn ist, Einstellungen zu ändern, ohne das Image neu zu bauen.
# Der Schlüssel `default.conf` wird zum Dateinamen in dem Verzeichnis, in das das Volume gemountet ist.
#
# Alles unterhalb der Einrückung nach `|` ist kein YAML, sondern der wortwörtliche Inhalt der Datei. Zeilen
# mit einer Raute innerhalb dieses Blocks landen unverändert in der nginx-Konfiguration, statt beim
# Parsen zu verschwinden. Aus demselben Grund wurden im Seitenblock unten keine Kommentare hinzugefügt:
# es ist HTML, und eine Raute darin wäre für den Benutzer am Bildschirm sichtbar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-conf
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      location / {
        # Der ganze Sinn der Lab: nginx setzt seinen eigenen Pod-Namen direkt in das HTML ein.
        # $hostname innerhalb des Pods ist genau der Pod-Name.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
---
# Die Seite, Version 1. Ein separates Objekt von den Einstellungen — damit in Lab 4 die App auf die
# zweite Version umgeschaltet werden kann, ohne die nginx-Konfiguration anzufassen oder das Image neu zu bauen.
# Das Suffix -v1 im Namen ist keine Dekoration: rickroll-page-v2 wird daneben erscheinen, und das Umschalten
# des Volumes zwischen ihnen ist genau das, was ein Rollout einer neuen Version ist.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v1
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Never Gonna Give You Up</title>
    <style>
      body{background:#0d0d12;color:#e8e8ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#ff0057,#ffb800,#00e0ff,#ff0057);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#9aa0b5;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#6f7690}
      .pod b{display:block;margin-top:.4em;color:#00e0ff;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#4d5366;font-size:14px}
    </style>
    <h1>Never Gonna Give You Up</h1>
    <p class="lyr">Never gonna let you down &middot; Never gonna run around and desert you</p>
    <div class="pod">bedient von Pod<b>__POD__</b></div>
    <p class="hint">Aktualisieren Sie die Seite. Sobald es mehr Repliken gibt, beginnt der Name sich zu ändern.</p>
    </html>
---
# Die App selbst. Deployment beschreibt den gewünschten Zustand — welches Image gestartet werden soll,
# wie viele Kopien gehalten werden, wie sie bei einem Update ersetzt werden. Von da an bringt der Cluster selbst
# die Realität mit dieser Beschreibung in Einklang und überwacht sie fortlaufend, nicht nur einmal bei der Erstellung.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rickroll
  labels:
    app: rickroll
spec:
  # Wie viele Kopien laufend gehalten werden sollen. Die Formulierung ist genau so: nicht „starte eine“,
  # sondern „halte eine“. Verschwindet eine Kopie, erstellt der Cluster ungefragt eine neue. In Lab 3
  # beginnt das Autoscaling, dieses Feld zu ändern, deshalb fasst man es nicht mehr von Hand an.
  replicas: 1
  # Anhand welchen Labels das Deployment Pods als die seinen betrachtet. Das Label hier und das Label im Template
  # unten müssen übereinstimmen: bei Abweichung wird das Objekt gar nicht erst erstellt.
  selector:
    matchLabels:
      app: rickroll
  # Das Pod-Template — jede Kopie wird daraus gestanzt. Das Bearbeiten eines beliebigen Feldes innerhalb von template
  # bedeutet eine neue Revision der App und das Ersetzen der Kopien nacheinander (das ist genau Lab 4).
  # Das Bearbeiten von Feldern außerhalb von template (zum Beispiel replicas) erzeugt keine Revision.
  template:
    metadata:
      labels:
        # Dasselbe Label hängt an den Pods selbst: der Service am Ende der Datei findet sie darüber.
        app: rickroll
    spec:
      # Anforderungen des `restricted`-Sicherheitsprofils auf Ebene des gesamten Pods: Betrieb
      # nicht als root, eine bestimmte UID und das Standard-seccomp-Profil. In einem Unternehmens-
      # Cluster mit aktiviertem `restricted` wird ein Pod ohne diese Felder nicht zum Start zugelassen,
      # wobei die Ablehnung im Moment der Pod-Erstellung kommt, nicht beim apply des Manifests.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Dieselbe Strenge, aber auf Container-Ebene: dem Prozess darin ist es untersagt,
          # seine Rechte zu erhöhen, und ihm sind alle linux-Capabilities entzogen.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Eine unprivilegierte Variante: lauscht auf 8080 und läuft nicht als root.
          # Das allein genügt dem `baseline`-Profil, aber nicht `restricted` — das braucht
          # explizite securityContext bei Pod und Container, oben gesetzt. In einem
          # Unternehmens-Cluster ist üblicherweise genau `restricted` aktiviert.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # Standardmäßig startet nginx einen Worker-Prozess pro Kern des Knotens. Auf einer Lern-
          # Maschine mit einem Kern ist das ein Prozess, aber auf einem Produktionsknoten mit 64 Kernen sind es 64,
          # und ein Pod mit einem kleinen Speicherlimit stirbt mit OOMKilled noch vor der ersten Anfrage.
          # Das Autotune zählt die Worker anhand des CPU-Limits: bei 300m ist das ein Prozess.
          # Über eine Umgebungsvariable, nicht über -g: die Direktive ist bereits in der Basis-
          # Konfiguration des Images enthalten, und eine zweite Deklaration lässt nginx mit einem „duplicate“-Fehler abstürzen.
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # Dem Port ist ein Name gegeben, nicht nur eine Nummer: auf `http` verweisen die readinessProbe
          # unten und der targetPort des Service. Ändert sich die Nummer, bearbeitet man es an einer Stelle.
          ports:
            - containerPort: 8080
              name: http
          # Zwei verschiedene Dinge, die ständig verwechselt werden. requests — wie viel einer Ressource
          # garantiert reserviert werden soll; danach wählt der Scheduler einen Knoten, und daraus
          # berechnet auch das Autoscaling in Lab 3 die Auslastung in Prozent.
          # limits — die Obergrenze, über die hinaus nicht gestiegen werden darf: bei der CPU wird bei
          # Anschlag gedrosselt, beim Speicher wird der Container getötet.
          resources:
            # Bewusst winzig: auf dem Workshop wird es viele solcher Apps geben.
            # 20m sind zwei Hundertstel eines Kerns. Der Wert ist bewusst niedrig: je kleiner
            # requests ist, desto schneller überschreitet die Last die Schwelle und das Wachstum der Kopien in Lab 3
            # ist in Sekunden statt in einer halben Stunde zu sehen.
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          # Bereitschaftsprüfung. Solange an dieser Adresse keine Antwort eingetroffen ist, leitet der Cluster
          # keinen Traffic auf die Kopie. Ihretwegen ist in der nginx-Konfiguration eine eigene
          # location /healthz mit der Antwort „ok“ eingerichtet. Mit diesem Feld ist der Rollout ohne Ausfallzeit
          # in Lab 4 bezahlt: die alte Kopie wird erst abgeschaltet, nachdem die neue geantwortet hat.
          # Entfernen Sie es — und das Update beginnt, Anfragen fallen zu lassen.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            # Zwei Sekunden bis zum ersten Klopfen — durch Erfahrung ermittelt. Weniger ergibt keinen
            # Sinn, so lange braucht nginx zum Starten; mehr würde jeden Rollout unnötig in die Länge ziehen.
            initialDelaySeconds: 2
          # Wohin der ConfigMap-Inhalt innerhalb des Containers gelegt wird. Die Verzeichnisse sind
          # nicht willkürlich gewählt: aus dem ersten liefert nginx Dateien, aus dem zweiten liest es Einstellungen.
          # Ohne diese zwei Zeilen würden beide ConfigMaps einfach im Cluster liegen bleiben,
          # und nginx würde seine Standardseite zeigen.
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
      # Welche ConfigMaps an den Pod angehängt werden. Der Volume-Name hier verbindet es mit dem Eintrag
      # in volumeMounts oben — übereinstimmen müssen genau die Namen, die Reihenfolge spielt für die Bindung keine Rolle.
      # Aber für Lab 4 spielt sie eine, siehe die Warnung unten.
      volumes:
        # ACHTUNG: dieses Volume muss das erste sein (volumes[0]).
        # Lab 4 schaltet die Seitenversion mit einem Patch nach Index um.
        # JSON Patch adressiert ein Listenelement über die Nummer, nicht über den Namen. Vertauschen Sie die Volumes,
        # dann ersetzt der Patch stillschweigend die nginx-Einstellungen statt der Seite, die App
        # geht kaputt, und die Fehlermeldung wird von etwas ganz anderem sprechen.
        - name: page
          configMap:
            name: rickroll-page-v1
        - name: conf
          configMap:
            name: rickroll-conf
---
# Die dauerhafte Adresse der App. Kopien werden geboren und sterben, ihre Adressen ändern sich, aber der Name
# `rickroll` innerhalb des Clusters bleibt derselbe — darüber rufen die Nachbarn die App.
# Die Liste der lebenden Kopien hinter diesem Namen führt der Cluster selbst, anhand von Labels.
apiVersion: v1
kind: Service
metadata:
  name: rickroll
spec:
  # Wen man hinter diese Adresse stellt: alle Pods mit einem solchen Label, von wem auch immer sie
  # erstellt wurden. Daher eine typische Unannehmlichkeit — ein fremder Pod mit dem Label app: rickroll
  # gerät stillschweigend in den Lastausgleich und beginnt, Ihren Benutzern zu antworten. Das Skript
  # check.sh in diesem Ordner prüft separat, dass es keine solchen Hochstapler gibt.
  selector:
    app: rickroll
  ports:
    # port — auf welchem Port der Service selbst antwortet, targetPort — wohin er in den
    # Pod hinein klopft. Hier ist targetPort über den Namen des Ports aus dem Container gesetzt, nicht über eine Zahl:
    # ändert sich die Nummer im Container, muss diese Datei nicht bearbeitet werden.
    - port: 80
      targetPort: http
