---
# Labor 7 · Dienst «Пропуск», Version v2 — die, die mit dem Cache arbeiten kann.
# Der Cache ist hier noch NICHT aktiviert: zuerst messen wir, wie schlecht es ohne ihn ist. Aktiviert
# wird er später, mit dem Patch cache-patch.yaml aus demselben Ordner.
#
# Wo es angewendet wird: dein Cluster `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Befehl: kubectl apply -f passes-api.yaml
#
# HARBOR-HOST ist ein Platzhalter, keine Adresse. Setze die Adresse deines eigenen Harbor ein (siehe hr-legacy.yaml,
# dort steht auch der sed-Befehl, um sie in allen Dateien auf einmal zu ersetzen).
#
# Die Datei enthält zwei Objekte, getrennt durch `---`: ein Deployment (Kopien der Anwendung) und einen
# Service (ein beständiger Name für sie). apiVersion, kind und metadata.name werden weiter unten nicht mehr kommentiert.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Zwei Kopien, nicht eine, damit später die wichtigste Eigenschaft des Cache sichtbar wird: er ist gemeinsam.
  # Ein Pod hat eine Antwort in Redis abgelegt, ein anderer hat sie von dort geholt, obwohl er selbst nie zum Verzeichnis ging.
  replicas: 2
  # An diesem Label unterscheidet das Deployment seine eigenen Pods von fremden. Es muss mit dem Label
  # im template weiter unten übereinstimmen, sonst findet das Objekt nicht, was es selbst erstellt hat.
  selector:
    matchLabels:
      app: passes-api
  # template ist die Pod-Vorlage: woraus jede Kopie zusammengebaut wird.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Sicherheitsanforderungen auf Pod-Ebene: nicht als root, ein eingeschränkter Satz von System-
      # aufrufen. In einem Cluster mit aktivierten Policies wird ein Pod ohne diese Felder nicht zugelassen.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Womit sich der Cluster gegenüber dem geschlossenen Harbor beim Herunterladen des Images ausweist. Ohne Verweis
      # auf dieses Secret bleibt der Pod in ImagePullBackOff hängen.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # Die Rechte des Containers sind auf das Minimum beschnitten: keine Eskalation, keine Kernel-Privilegien.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Dasselbe Image wie beim Verzeichnis. Nur das MODE unten trennt sie.
          image: HARBOR-HOST/passes/passes-api:v2
          # Der Portname wird gebraucht, damit die Probe und der Service auf einen Namen verweisen, nicht auf eine Zahl.
          ports:
            - containerPort: 8080
              name: http
          # Das gesamte Verhalten der Anwendung wird hier festgelegt. Beachte: die Variablen
          # REDIS_ADDR und REDIS_PASSWORD stehen nicht in der Liste — und genau deshalb ist der Cache aus,
          # und jede Anfrage geht brav in das langsame Verzeichnis.
          env:
            # MODE=api — diese Instanz arbeitet als der Dienst «Пропуск» selbst.
            - name: MODE
              value: "api"
            # Version und Registry braucht die Anwendung zum Laufen nicht — sie sind in der Antwort auf «/» sichtbar
            # und lassen dich bestätigen, dass genau das läuft, was du gerade gebaut hast.
            - name: APP_VERSION
              value: "v2"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # Wohin man für Daten geht. Ein Service-Name, keine Adresse: die Kopien des Verzeichnisses
            # können beliebig oft neu erstellt werden, der Name ändert sich nicht.
            - name: HR_URL
              value: "http://hr-legacy.default.svc.cluster.local"
            # Wer die Anfrage ausführt und wo. Der Cluster setzt diese drei Werte selbst ein:
            # niemand kennt sie im Voraus. Sie landen in der Antwort des Dienstes, und an ihnen sieht man,
            # welche Kopie und auf welchem Knoten geantwortet hat — das ist bei den Messungen nützlich.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests ist, was bei der Auswahl eines Knotens reserviert wird, limits ist die Obergrenze. Eine Obergrenze von einem
          # Kern ist hier keine Gier: unter Last stößt die Anwendung an sie an, statt den
          # ganzen Knoten aufzufressen, und die Messung zeigt die Latenz des Verzeichnisses, nicht einen Kampf um die CPU.
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # Solange /healthz nicht antwortet, schickt der Service keine einzige Anfrage an diese Kopie.
          # Bei einem Update bewahrt dich dasselbe Feld vor einem Ausfall: die alten Kopien werden nicht entfernt,
          # bis die neuen ihre Bereitschaft melden.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — ein einziger beständiger Name für beide Kopien und die Verteilung der Anfragen zwischen ihnen.
# Pods werden neu erstellt und ändern ihre IP, der Name passes-api bleibt. Über diesen Namen erreichen
# sowohl Fortio als auch das Prüfskript den Service.
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # Das Label, über das der Service die Liste der lebenden Kopien zusammenstellt. Stimmt es nicht mit dem Label der Pods überein —
  # existiert der Service und führt ins Leere.
  selector:
    app: passes-api
  ports:
    # Von außen erreicht man Port 80, in den Pod geht es zum Port mit dem Namen http (8080).
    - port: 80
      targetPort: http
