---
# Lab 7 · den Cache im Ernstfall einschalten. Wird auf das bereits ausgerollte passes-api
# in Ihrem Cluster `lab` angewendet (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch.yaml
#
# Das ist ein Patch, kein vollständiges Manifest: Er beschreibt nur, was sich ändert. Alles andere —
# das Image, die Labels, die Probes, die Ressourcen — bleibt aus passes-api.yaml unberührt. Deshalb
# beginnt die Datei direkt bei spec: Der Pfad hinunter zum Container spiegelt die Deployment-Struktur
# wider, damit der Cluster genau versteht, wo die Änderung anzuwenden ist.
#
# Der Containername `api` ist keine Verzierung, sondern eine Adresse: Der Cluster findet damit den
# richtigen Container in der Liste. Vertippen Sie sich im Namen, bekommen Sie statt einer Änderung einen zweiten Container.
#
# Setzen Sie die Adresse Ihres eigenen Redis anstelle von REDIS-ADDR ein — es ist ein Platzhalter, kein Hostname.
# Die Adresse entnehmen Sie dem Dashboard, in der Karte Ihrer verwalteten Redis-Anwendung.
spec:
  template:
    spec:
      containers:
        - name: api
          # env-Listen in Kubernetes werden über das Feld name zusammengeführt, deshalb werden die drei Einträge unten
          # zu den bereits im Deployment vorhandenen hinzugefügt, statt sie zu ersetzen.
          env:
            # Das Auftauchen dieser Variablen bedeutet «den Cache einschalten»: Die Anwendung prüft sie
            # beim Start und geht, wenn sie gesetzt ist, zuerst zu Redis. Leer oder
            # fehlend — sie arbeitet wie zuvor und greift bei jeder Anfrage auf das Verzeichnis zu.
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
            # Das Passwort schreiben wir nicht im Klartext: Es kommt aus einem Secret, das Sie
            # mit einem separaten Befehl erstellen. In einem Manifest, das in Git liegt,
            # hat ein Passwort nichts zu suchen.
            #
            # secretKeyRef ist eine Referenz: name — der Name des Secret-Objekts im selben Cluster,
            # key — welches Feld darin zu nehmen ist. Der Wert wird beim Start des
            # Pods eingesetzt und erscheint niemals in der Datei.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
            # Wie viele Sekunden ein Eintrag im Cache lebt. Sechzig — weil das
            # Mitarbeiterverzeichnis sich einmal am Tag ändert, nicht einmal pro Sekunde.
            #
            # Eine längere Dauer — wir greifen seltener auf das Verzeichnis zu, liefern aber länger einen
            # veralteten Nachnamen aus. Eine kürzere — die Daten sind frischer, der Gewinn ist kleiner. Das ist ein Kompromiss,
            # keine Einstellung mit einem richtigen Wert.
            - name: CACHE_TTL
              value: "60"
