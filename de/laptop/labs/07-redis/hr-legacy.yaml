---
# Lab 7 · ein Stub für das Legacy-Mitarbeiterverzeichnis.
# Im echten Leben ist das ein fremdes System, das ihr nicht umschreiben dürft: es antwortet in 800 ms,
# und damit muss man irgendwie leben. Hier ist ein Stub mit demselben Verhalten, damit es etwas zu messen gibt.
#
# Wo es zum Einsatz kommt: euer Cluster `lab` (export KUBECONFIG=~/lab.kubeconfig), nicht der Cozystack-
# Management-Cluster. Befehl: kubectl apply -f hr-legacy.yaml
#
# HARBOR-HOST ist ein Platzhalter, keine Adresse. Setzt die Adresse eures eigenen Harbor ein, sonst versucht der Cluster,
# das Image von einem nicht existierenden Host zu ziehen:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # macOS
#
# Die Datei enthält zwei Objekte, getrennt durch eine `---`-Zeile: ein Deployment (was läuft und in wie vielen
# Kopien) und einen Service (ein permanenter Name, über den man diese Kopien erreicht). Bei jedem Objekt
# sagen apiVersion und kind, um welche Art von Objekt es sich handelt, und metadata.name, wie es heißt;
# weiter unten werden diese drei Felder nicht kommentiert.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-legacy
  labels:
    app: hr-legacy
spec:
  # Wie viele Kopien am Laufen gehalten werden. Verschwindet eine Kopie, erstellt der Cluster eine neue, ohne
  # zu fragen. Dem Verzeichnis reicht eine: es ist nicht für Last da, sondern zum Messen.
  replicas: 1
  # An diesem Label erkennt das Deployment seine Pods unter all den anderen im Cluster.
  # Das Label im selector und das Label im template unten müssen übereinstimmen, sonst findet das Objekt
  # nicht, was es selbst erstellt hat.
  selector:
    matchLabels:
      app: hr-legacy
  # template ist die Pod-Vorlage. Alles darunter beschreibt eine Kopie: woraus sie zusammengebaut wird,
  # mit welchen Rechten sie läuft und woran man erkennt, dass sie bereit ist, Anfragen anzunehmen.
  template:
    metadata:
      labels:
        app: hr-legacy
    spec:
      # Sicherheitsanforderungen auf Pod-Ebene. Der Prozess läuft nicht als root (uid 10001),
      # das seccomp-Profil schneidet Systemaufrufe ab, die die Anwendung nicht braucht.
      # In einem Cluster mit aktivierten Policies startet ein Pod ohne diese Felder gar nicht.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Harbor ist durch Login und Passwort geschützt, und der Cluster muss sich irgendwie ausweisen. Das
      # Secret `harbor` habt ihr in der Registry-Lab angelegt. Ohne diese Referenz wird das Image nicht gezogen,
      # und der Pod bleibt im Zustand ImagePullBackOff.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: hr
          # Dasselbe wie auf Pod-Ebene, aber für einen bestimmten Container: wir verbieten
          # Privilege-Escalation und entziehen alle Kernel-Capabilities. Die Go-Anwendung
          # braucht keine davon.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Das Image ist dasselbe für das Verzeichnis und für den Dienst "Пропуск" selbst.
          # Welcher Prozess tatsächlich startet, entscheidet die Variable MODE unten.
          image: HARBOR-HOST/passes/passes-api:v2
          # Der Port hat einen Namen, nicht nur eine Nummer: die Readiness-Probe und der Service unten
          # verweisen auf den Namen. Ändert sich die Nummer, bearbeitet ihr sie an einer einzigen Stelle.
          ports:
            - containerPort: 8080
              name: http
          # Umgebungsvariablen sind die einzige Möglichkeit, diese Anwendung zu konfigurieren.
          # Das Image muss nicht neu gebaut werden, um das Verhalten zu ändern.
          env:
            # MODE=hr — die Instanz gibt vor, ein HR-System zu sein: sie wartet und antwortet.
            - name: MODE
              value: "hr"
            # Genau die Verzögerung, die das echte Verzeichnis zeigt.
            # Indem ihr sie ändert, ändert ihr "wie schlimm es steht" — probiert danach 2s.
            - name: HR_DELAY
              value: "800ms"
            # Ein Pod kennt seinen eigenen Namen nicht im Voraus — der Cluster vergibt ihn bei der Erstellung.
            # fieldRef setzt diesen Namen beim Start in die Variable ein, und er
            # landet in der Antwort des Service: man sieht, welche Kopie geantwortet hat.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # requests — wie viele Ressourcen für den Container bei der Knotenauswahl reserviert werden,
          # limits — die Obergrenze, die er nicht überschreiten darf. Ähnlich wie reservation
          # und limit in vSphere, aber pro Container festgelegt, nicht pro virtueller Maschine.
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # Readiness-Probe. Bis /healthz antwortet, sendet der Service keine einzige Anfrage
          # an diese Kopie. Ohne die Probe würde Traffic an einen noch nicht gestarteten Prozess gehen,
          # und ihr würdet Fehler aus dem Nichts sehen — obwohl "alles ausgerollt ist".
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — ein permanenter Name und eine permanente Adresse für eine Gruppe von Pods. Pods werden neu erstellt
# und erhalten jedes Mal eine neue IP, aber der Name hr-legacy bleibt derselbe. Ähnlich wie eine Load-
# Balancer-VIP, aber in vier Zeilen eingerichtet und lebt innerhalb des Clusters.
apiVersion: v1
kind: Service
metadata:
  name: hr-legacy
spec:
  # An diesem Label stellt der Service die Liste der lebenden Kopien zusammen. Dasselbe Label wie bei den Pods oben:
  # stimmt es nicht überein, existiert der Service und führt ins Leere.
  selector:
    app: hr-legacy
  ports:
    # Anfragen kommen auf Port 80 herein, innerhalb des Pods geht das an den Port mit dem Namen http (8080).
    - port: 80
      targetPort: http
