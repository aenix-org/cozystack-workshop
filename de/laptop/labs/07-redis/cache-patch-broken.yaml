---
# Lab 7 · DIESER PATCH IST ABSICHTLICH UNVOLLSTÄNDIG. Er dient dazu, dass Sie sehen, wie
# «wir haben den Cache scheinbar eingeschaltet, aber schneller wurde es nicht» aussieht. Die funktionierende Variante liegt in cache-patch.yaml.
#
# Wird in Ihrem Cluster `lab` angewendet (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch-broken.yaml
#
# Sie müssen die Antwort nicht vorher ansehen. Wenden Sie ihn an, senden Sie ein paar Anfragen und sehen Sie sich die Logs
# der Anwendung an: kubectl logs -l app=passes-api. Die Anwendung sagt Ihnen, was mit ihr nicht stimmt,
# — es geht darum, die Meldung zu lesen und zu verstehen, was in dieser Datei fehlt.
#
# Setzen Sie die Adresse Ihres eigenen Redis anstelle von REDIS-ADDR ein (siehe Schritt zum Finden der Adresse).
# Der Platzhalter darf nicht stehen bleiben: dann erhalten Sie einen anderen Fehler, nicht den, für den das Ganze eingerichtet wurde.
spec:
  template:
    spec:
      containers:
        # Der Container-Name ist die Adresse, über die der Cluster die zu bearbeitende Stelle findet.
        - name: api
          env:
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
