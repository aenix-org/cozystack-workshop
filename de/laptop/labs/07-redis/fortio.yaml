---
# Lab 7 · Lastgenerator mit Weboberfläche.
# Derselbe wie im Skalierungs-Lab: Die Last startet man mit einem Knopf im Browser,
# und das Latenz-Histogramm ist gleich dort sichtbar. Wenn er bei Ihnen bereits
# ausgerollt ist, muss diese Datei nicht angewendet werden — kubectl antwortet mit „unchanged".
#
# Wo es angewendet wird: Ihr Cluster `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Befehl: kubectl apply -f fortio.yaml
#
# Zwei Objekte, getrennt durch `---`: ein Deployment (der Generator selbst) und ein Service (der Name,
# über den man ihn erreicht). apiVersion, kind und metadata.name werden weiter nicht kommentiert.
#
# Das Image wird vom öffentlichen Docker Hub bezogen, nicht aus Ihrem Harbor: Fortio ist kein Teil
# des Dienstes „Gästeausweis", sondern ein Messinstrument, das nur vorübergehend im Cluster lebt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # Eine einzige Kopie. Ein Lastgenerator muss nicht skaliert werden — er soll als Einziger
  # die Latenzen ehrlich zählen. Zwei Kopien ergäben zwei nicht zusammengeführte Histogramme.
  replicas: 1
  # Das Label, an dem das Deployment seinen Pod erkennt. Stimmt mit dem Label im Template unten überein.
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # Dieselben Sicherheitsanforderungen wie beim Rest: Der Prozess läuft nicht als root,
      # und Systemaufrufe sind durch ein seccomp-Profil eingeschränkt.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Der Tag `latest` ist hier eine Vereinfachung für den Workshop und widerspricht dem, was
          # das Lab über die eigene Registry lehrt: Das Image unter diesem Tag kann sich zwischen zwei
          # Applies unbemerkt ändern, und die gestrige Messung wird nicht reproduzierbar. Für einen
          # Lastgenerator auf einem Übungsstand ist das akzeptabel, für ein Produktivsystem nicht.
          image: fortio/fortio:latest
          # `server` ist der Modus, in dem Fortio die Weboberfläche hochfährt und darauf wartet, dass Sie
          # den Knopf drücken. Ohne dieses Argument führt das Image einen einmaligen Befehl aus und beendet sich.
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # Der Generator braucht CPU-Reserve, sonst wird er zum eigenen Flaschenhals
              # und Sie belasten Fortio statt der Anwendung.
              cpu: "1"
              memory: 256Mi
---
# Der Service wird benötigt, um die Weboberfläche zu öffnen: Den Generator erreicht man per Namen
# über Port-Forwarding — kubectl port-forward svc/fortio 8081:8080 — und geht dann
# auf localhost:8081. Man kann den Dienst auch ohne Service beschießen, mit
# kubectl exec deploy/fortio, aber nur dieser Weg liefert das Histogramm im Browser.
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  # Hier stimmen die Nummer beim Service und der Container-Port überein — anders als bei den übrigen
  # Diensten des Labs, wo außen 80 und innen 8080 ist. Der Unterschied liegt nur in der Bequemlichkeit.
  ports:
    - port: 8080
      targetPort: http
