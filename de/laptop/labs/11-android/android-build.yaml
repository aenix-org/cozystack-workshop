---
# Lab 11. Der Build selbst: ein Skript in einer ConfigMap und ein Job, der es ausführt.
# Zwei Objekte in einer Datei, getrennt durch eine `---`-Zeile.
#
# Wird auf euren Trainingscluster `lab` angewendet, nicht auf den Tenant im Management-Cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f android-build.yaml
# Platzhalter wie tenant-workshopXX gibt es hier nicht — ihr müsst nirgends eure Nummer einsetzen.
#
# Vor dem Anwenden müssen zwei Objekte bereits im Cluster existieren, sonst startet der Build-Pod nicht:
# der Cluster mountet nicht, was nicht da ist, und der Pod wartet weiter.
#     configmap/propusk-src   Quellen: kubectl apply -f propusk-src.yaml
#     secret/bucket-creds     vier Bucket-Zugriffsschlüssel, von Hand eingegeben
#
# Job, kein Deployment: ein Build hat ein Ende. Ein Deployment behandelt einen beendeten Prozess
# als Fehler und startet eine neue Kopie — der Build würde in einer Schleife laufen und nie stoppen.
#
# WARUM DAS BUILD-SKRIPT ALS SEPARATES OBJEKT LEBT und nicht als String im command-Feld des Jobs selbst:
#   - sechzig Zeilen Shell in einem YAML-Feld lassen sich nicht lesen oder prüfen: hier ist es
#     eine gewöhnliche Datei, die der Editor hervorhebt und die `bash -n` akzeptiert;
#   - man sieht sie vollständig mit einem Befehl: kubectl get configmap android-build-script -o yaml;
#   - man kann den Build ändern, ohne die Job-Definition anzufassen, und umgekehrt.
# Der Preis der Bequemlichkeit: das Skript lebt getrennt vom Job. Ändert ihr die ConfigMap — ein
# bereits laufender Build merkt es nicht; nur der nächste Lauf sieht den neuen Text.
apiVersion: v1
kind: ConfigMap
metadata:
  name: android-build-script
data:
  # Fünf Build-Schritte — genau die Befehle, die ihr von Hand auf einem Build-Server eingeben würdet.
  # Der Container startet fast leer: Java und Gradle kommen aus dem Image, den Rest bringt das Skript
  # selbst mit.
  #   1/5  lädt die command-line tools herunter — die Werkzeuge, mit denen das Android SDK selbst installiert wird (1-2 Min)
  #   2/5  akzeptiert Lizenzen und installiert das SDK, Plattform 34 und build-tools. Der längste Schritt,
  #        5-15 Minuten, und die ganze Zeit ist das Log still: sdkmanager gibt im nicht-interaktiven
  #        Modus keinen Fortschritt aus. Stille bedeutet hier kein Hängen
  #   3/5  gradle :app:assembleDebug — kompiliert die Quellen aus /src in ein APK (3-8 Minuten)
  #   4/5  installiert mc, den Konsolen-Client für den Objektspeicher
  #   5/5  legt das APK unter zwei Namen in den Bucket: einem datierten und propusk-latest (Sekunden)
  #
  # Jeder Build dauert gleich lang: es gibt keinen Cache, die /work-Platte ist Wegwerf (siehe emptyDir
  # am Ende der Datei). Auf einem echten Build-Server gäbe es stattdessen ein persistentes Volume, und ein zweiter
  # Build wäre in Minuten fertig.
  #
  # Unten ist der wortwörtliche Inhalt der Datei build.sh, kein YAML. Die Raute-Zeilen darin
  # gehen unverändert ins Skript: es sind Shell-Kommentare, und man muss sie nicht entfernen.
  build.sh: |
    #!/usr/bin/env bash
    # Hier ist set -e angebracht: das ist keine Prüfung, es ist ein Build. Wenn ein Schritt fehlschlägt —
    # ist Weitermachen sinnlos, der Job soll mit einem Fehler enden und
    # mit seinen Logs im Cluster bleiben.
    set -euo pipefail

    WORK=/work
    export HOME="$WORK"
    export ANDROID_SDK_ROOT="$WORK/android-sdk"
    export ANDROID_HOME="$ANDROID_SDK_ROOT"
    export GRADLE_USER_HOME="$WORK/gradle-home"
    # Der Gradle-Daemon wird in einem Wegwerf-Container nicht gebraucht: er lebt für den nächsten
    # Build, und in diesem Container wird es keinen nächsten Build geben.
    # -Duser.home ist zwingend, und es ist kein Duplikat von export HOME oben. Java nimmt das Home-
    # Verzeichnis nicht aus der Umgebungsvariablen, sondern aus dem System-Benutzereintrag, und ein
    # unprivilegierter uid hat keinen — Gradle setzt "?" ein und scheitert beim Verpacken des
    # APK: es sucht den Signierschlüssel unter einem Pfad wie /work/project/app/?/.android/.
    export GRADLE_OPTS="-Xmx3g -Dorg.gradle.daemon=false -Duser.home=$WORK"

    CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
    MC_URL="https://dl.min.io/client/mc/release/linux-amd64/mc"

    echo "== 1/5 installiere Android command-line tools =="
    mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    cd "$ANDROID_SDK_ROOT/cmdline-tools"
    curl -fsSL -o tools.zip "$CMDLINE_TOOLS_URL"
    # unzip ist nicht in jedem Basis-Image, aber jar aus dem JDK kann zip entpacken.
    unzip -q tools.zip 2>/dev/null || jar xf tools.zip
    rm -f tools.zip
    mv cmdline-tools latest
    export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

    echo "== 2/5 akzeptiere Lizenzen und lade das SDK herunter (der längste Schritt) =="
    # `yes` erhält SIGPIPE, wenn sdkmanager seine Eingabe schließt, und gibt
    # einen von null verschiedenen Code zurück. Mit set -o pipefail würde das den Build grundlos scheitern lassen,
    # deshalb wird der Rückgabecode hier absichtlich unterdrückt. Wenn die Lizenzen wirklich
    # nicht akzeptiert wurden — sagt es der nächste Befehl.
    yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
    sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
      "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    echo "== 3/5 baue das APK =="
    # Die ConfigMap wird schreibgeschützt gemountet, und Gradle schreibt neben die Quellen,
    # deshalb wird der Baum zuerst auf die Platte kopiert.
    # -L dereferenziert symbolische Links: eine ConfigMap wird nicht als Dateien gemountet,
    # sondern als Links in das interne Verzeichnis ..data, und ohne -L würden die Links im Projekt landen.
    # Ein Glob statt /src/. — damit dieses interne Verzeichnis selbst nicht kopiert wird.
    mkdir -p "$WORK/project"
    cp -rL /src/* "$WORK/project/"
    cd "$WORK/project"
    gradle --no-daemon :app:assembleDebug

    APK="$WORK/project/app/build/outputs/apk/debug/app-debug.apk"
    ls -l "$APK"

    echo "== 4/5 installiere den S3-Client =="
    # Wir legen den Client ins Arbeitsverzeichnis, NICHT nach /usr/local/bin. Der Pod läuft als
    # unprivilegierter Benutzer, und die System-Verzeichnisse des Images gehören root:
    # das Schreiben dorthin würde mit Permission denied enden — und zwar genau hier, im vierten Schritt,
    # also nach einer halben Stunde Build. Das Verzeichnis /work gehört uns, dorthin dürfen wir schreiben.
    mkdir -p "$WORK/bin"
    curl -fsSL -o "$WORK/bin/mc" "$MC_URL"
    chmod +x "$WORK/bin/mc"
    # PATH ist die Liste der Verzeichnisse, in denen die Shell nach Befehlen sucht. Wir hängen unseres an, damit man weiter unten
    # einfach `mc` schreiben kann statt des vollen Pfads.
    export PATH="$WORK/bin:$PATH"

    echo "== 5/5 lade das APK in den Bucket =="
    # Die Variablen accessKey/secretKey/endpoint/bucketName kommen aus dem Secret
    # über envFrom. Die Ausgabe von alias set unterdrücken wir: es braucht nichts ins Log zu drucken.
    # Aus demselben Grund gibt es kein set -x im Skript — es würde die Schlüssel ausgeben.
    # Der Alias heißt builds, nicht lab: das Wort `lab` bezeichnet in allen Labs den Trainingscluster,
    # und man sollte die beiden nicht verwechseln.
    mc alias set builds "https://${endpoint}" "${accessKey}" "${secretKey}" >/dev/null
    STAMP="$(date -u +%Y%m%d-%H%M%S)"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-${STAMP}.apk"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-latest.apk"
    # Eine Markierungszeile: check.sh unterscheidet damit „der Job lief" von „das APK kam an".
    echo "APK-UPLOADED ${bucketName}/propusk/propusk-${STAMP}.apk"
    mc ls --recursive "builds/${bucketName}/propusk/"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: propusk-build
spec:
  # Wie oft der Pod neu erstellt wird, wenn der Build fehlschlägt. Null wäre ehrlicher,
  # aber das Netz blinzelt manchmal beim Herunterladen des SDK, und ein zweiter Versuch ist billiger
  # als die Erklärung „warum ist meiner fehlgeschlagen".
  backoffLimit: 1
  # Eine Obergrenze für den gesamten Build. Ohne sie würde ein hängender Build den Node bis zum Abend halten.
  # Die Zählung beginnt bei der ERSTELLUNG des Jobs, nicht beim Container-Start: Zeit in Pending und
  # die Node-Neuerstellung etwas später im Lab verbrauchen sie ebenfalls. Eine Stunde reichte nicht —
  # der Build starb mit DeadlineExceeded, nachdem die Person ihn bereits abgewartet hatte.
  activeDeadlineSeconds: 7200
  # Das Pod-Template: daraus stanzt der Job den Pod, in dem der Build läuft. Der Pod hat keinen eigenen
  # Namen — der Job hängt an seinen eigenen Namen ein zufälliges Suffix an, deshalb muss man den Pod
  # über das Label job-name suchen, nicht über den Namen.
  template:
    spec:
      # Der Build zieht fremden Code aus dem Internet und führt ihn sofort aus. Root-Rechte braucht er
      # dafür nicht: er schreibt nur nach /work — einschließlich des S3-Clients, den er sich
      # ebenfalls dorthin herunterlädt, weil ein unprivilegierter Benutzer nicht in die System-
      # Verzeichnisse des Images schreiben darf. Dieselben drei Felder standen bei der Anwendung
      # aus dem ersten Lab und aus demselben Grund: ohne sie wird der Pod nicht in einen Cluster zugelassen, in dem
      # das Sicherheitsprofil `restricted` aktiviert ist.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # Für einen Job ist dies ein Pflichtfeld. Never bedeutet: einen fehlgeschlagenen Pod nicht
      # an Ort und Stelle neu starten, sondern die Entscheidung dem Job überlassen — er erstellt einen neuen.
      restartPolicy: Never
      containers:
        - name: build
          # Dieselbe Strenge auf Container-Ebene: sich selbst Rechte zu erhöhen ist verboten,
          # alle Linux-Capabilities bis auf die letzte sind entzogen.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Ein fertiges Image mit Gradle und JDK 17. Die JDK-Version ist nicht willkürlich gewählt: sie
          # muss mit jvmTarget = "17" in app-build.gradle.kts übereinstimmen, sonst schlägt der Build
          # an einer Bytecode-Versions-Unstimmigkeit fehl. Ein Android SDK gibt es im Image nicht — der
          # erste Schritt des Skripts lädt es herunter, weil Images mit dem SDK darin zig
          # Gigabyte wiegen und länger ziehen würden als das SDK selbst.
          image: gradle:8.9-jdk17
          # Wir führen nicht das aus, was das Image standardmäßig tut, sondern unser eigenes Skript aus der ConfigMap,
          # die unter /scripts gemountet ist.
          command: ["bash", "/scripts/build.sh"]
          envFrom:
            # Alle vier Schlüssel des Secrets werden zu Umgebungsvariablen
            # mit denselben Namen: accessKey, secretKey, endpoint, bucketName.
            - secretRef:
                name: bucket-creds
          # Der ehrliche Preis eines Android-Builds, experimentell ermittelt. requests ist, wie viel
          # reserviert wird: der Scheduler wählt einen Node nach dieser Zahl, nicht nach tatsächlichem
          # Verbrauch. Mit weniger als vier Gigabyte überlebt der Kotlin-Compiler nicht.
          # limits ist die Obergrenze: bei CPU wird beim Anschlagen gedrosselt, bei Speicher wird der
          # Container getötet (OOMKilled). Zum Vergleich, die Anwendung aus dem ersten Lab
          # kam mit 20m CPU und 32Mi Speicher aus. Gerade wegen dieser Zahlen muss der Node des Trainings-
          # clusters vergrößert werden: in den in Lab 0 bestellten passt der Build nicht.
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 6Gi
          # Drei Volumes. Quellen und Skript — nur zum Lesen: eine ConfigMap wird ohnehin
          # schreibgeschützt gemountet, aber ein explizites readOnly sagt sofort, dass der Build dorthin nicht schreibt.
          # Er schreibt nach /work, und das ist der einzige Ort, an den er darf.
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: src
          configMap:
            name: propusk-src
            # Ein ConfigMap-Schlüssel darf keinen Schrägstrich enthalten, aber der Mount-Pfad
            # darf es. So entfaltet sich eine flache Map in den Verzeichnisbaum,
            # den Gradle erwartet.
            items:
              - key: settings.gradle.kts
                path: settings.gradle.kts
              - key: build.gradle.kts
                path: build.gradle.kts
              - key: app-build.gradle.kts
                path: app/build.gradle.kts
              - key: AndroidManifest.xml
                path: app/src/main/AndroidManifest.xml
              - key: MainActivity.kt
                path: app/src/main/kotlin/io/aenix/propusk/MainActivity.kt
              - key: strings.xml
                path: app/src/main/res/values/strings.xml
        - name: scripts
          configMap:
            name: android-build-script
            # Dateirechte für das Volume: lesen und ausführen. Das Skript wird als
            # `bash /scripts/build.sh` aufgerufen, deshalb ist das Ausführungsbit hier ein Sicherheitsnetz — es
            # wird von dem gebraucht, der die Datei eines Tages direkt ausführt.
            defaultMode: 0755
        - name: work
          # Eine temporäre Platte auf dem Node, lebt genau so lange wie der Pod.
          # Hierhin kommen SDK, Gradle-Abhängigkeiten und das Build-Ergebnis.
          emptyDir:
            # Zwölf Gigabyte mit Reserve: SDK, Gradle-Cache und Build-Ergebnis sind
            # sechs bis acht. Die Obergrenze wird gebraucht, damit ein aufgeblähter Build nicht die Node-Platte
            # komplett auffrisst und die Nachbar-Pods mit sich reißt.
            sizeLimit: 12Gi
