---
# Lab 11. Quellcode der mobilen Anwendung „Propusk" — das, was dem Build als Eingabe zugeführt wird.
#
# Wird auf Ihrem Schulungscluster `lab` angewendet, nicht in einem Tenant auf dem Management-Cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f propusk-src.yaml
# Platzhalter wie tenant-workshopXX gibt es hier nicht — Sie müssen Ihre Nummer nirgends einsetzen.
# Der Namespace ist ebenfalls nicht angegeben: das Objekt landet in dem, der in Ihrer kubeconfig eingetragen ist.
#
# Die Anwendung ist bewusst winzig: eine Activity, eine Textzeile auf dem Bildschirm.
# Der Sinn des Labs ist nicht Android, sondern die Tatsache, dass ein Build in den Cluster wandert.
#
# WAS DIESE DATEIEN SIND, falls Sie noch nie mobile Anwendungen gebaut haben.
# Ein Android-Projekt ist keine einzelne Datei mit Code, sondern ein Baum aus drei Arten von Dateien:
#   *.gradle.kts  die Build-Beschreibung: woher Bibliotheken zu holen sind, womit zu kompilieren ist, für welche
#                 Android-Versionen zu bauen ist. Von seiner Rolle her ist es ein Makefile, nur in der Sprache Kotlin;
#   *.kt          der eigentliche Anwendungscode;
#   *.xml         Ressourcen: Texte und die Beschreibung, welcher Bildschirm beim Antippen des Symbols
#                 geöffnet werden soll.
# Der Gradle-Builder liest diesen Baum und erzeugt ein APK — eine einzelne Installationsdatei für das Telefon,
# von seiner Rolle her dasselbe wie eine .msi für Windows. Sie müssen das Android SDK nicht selbst installieren und
# von Hand bauen: dafür sorgt ein Job aus android-build.yaml, und hier liegt nur dessen Eingabe.
#
# Der Quellcode liegt in einer ConfigMap, nicht in einem Image, aus genau demselben Grund,
# aus dem im Lab mit der ersten Anwendung die nginx-Seite in einer ConfigMap lag:
# damit man sie ändern kann, ohne etwas neu zu bauen. Eine ConfigMap ist ein Cluster-Objekt, in dem
# Textdateien liegen; beim Start des Containers legt der Cluster sie
# in ihn hinein als gewöhnliche Dateien auf der Festplatte.
#
# Die Schlüssel innerhalb von `data` sind Dateinamen, und alles unterhalb der Einrückung nach `|` ist
# der wörtliche Inhalt der Datei, nicht YAML. Ein Kommentar, der innerhalb eines solchen
# Blocks gesetzt wird, würde zu einer Zeile der Datei selbst, deshalb stehen alle Erläuterungen unten außerhalb,
# vor dem Schlüssel.
#
# Die flache Karte aus sechs Schlüsseln entfaltet sich nicht hier zu einem Verzeichnisbaum, sondern beim
# Mounten: die Zuordnung „Schlüssel -> Pfad" ist in android-build.yaml festgelegt, im
# Block volumes.items. Ein ConfigMap-Schlüssel darf keinen Schrägstrich enthalten — daher der flache Name
# app-build.gradle.kts, der im Projekt zu app/build.gradle.kts wird.
apiVersion: v1
kind: ConfigMap
metadata:
  name: propusk-src
data:
  # Die oberste Datei des Projekts: listet auf, woher Gradle Plugins und Bibliotheken zieht und welche
  # Module zum Projekt gehören (hier gibt es eines — app). Alle drei Repositories sind öffentlich, im Internet:
  # der Build-Container startet leer und zieht alles von dort, daher die Dauer des Builds.
  # Dies ist auch die erste Stelle, die Sie ändern, wenn die IT-Sicherheit den ausgehenden Zugang schließt — hierhin
  # wird ein internes Proxy-Repository eingetragen, genau wie Docker Hub gegen Harbor getauscht wurde.
  settings.gradle.kts: |
    pluginManagement {
      repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
      }
    }
    dependencyResolutionManagement {
      repositories {
        google()
        mavenCentral()
      }
    }
    rootProject.name = "propusk"
    include(":app")

  # Die Wurzel-Build-Datei: fixiert die Versionen zweier Plugins — des Android-Builders und des Kotlin-
  # Compilers. `apply false` bedeutet „die Version deklarieren, aber im Wurzelprojekt nicht aktivieren":
  # aktivieren wird sie das Modul app. Die Versionen sind bewusst festgenagelt. Ein Build, der
  # „das Neueste" zieht, baut einen Monat später anders als heute, und Sie werden derjenige sein, der das aufklärt.
  build.gradle.kts: |
    plugins {
      id("com.android.application") version "8.5.2" apply false
      id("org.jetbrains.kotlin.android") version "1.9.24" apply false
    }

  # Beschreibung des Anwendungsmoduls selbst. Hier sind drei Zahlen, von denen sowohl abhängt, was der Build
  # herunterlädt, als auch, wo die Anwendung überhaupt läuft:
  #   compileSdk 34   die Android-SDK-Version, mit der wir kompilieren. Genau diese lädt der SDK-Installationsschritt
  #                   herunter — etwa anderthalb Gigabyte, der längste Build-Schritt;
  #   minSdk 24       das älteste Android, auf dem die Anwendung läuft (das ist Android 7).
  #                   Heben Sie es an — schneiden Sie alte Telefone ab, senken Sie es — müssen Sie
  #                   Kompatibilitätsbibliotheken mitschleppen;
  #   jvmTarget 17    Kotlin kompiliert zu Java-Bytecode, und diese Zahl muss mit
  #                   der JDK-Version im Build-Image übereinstimmen (gradle:8.9-jdk17 in android-build.yaml).
  #                   Weichen sie voneinander ab — scheitert der Build an einer Bytecode-Versionsungleichheit.
  app-build.gradle.kts: |
    plugins {
      id("com.android.application")
      id("org.jetbrains.kotlin.android")
    }

    android {
      namespace = "io.aenix.propusk"
      compileSdk = 34

      defaultConfig {
        applicationId = "io.aenix.propusk"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
      }

      compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
      }

      kotlinOptions {
        jvmTarget = "17"
      }

      sourceSets {
        getByName("main") {
          java.srcDirs("src/main/kotlin")
        }
      }
    }

  # Der Ausweis der Anwendung für das Telefon: welche Bildschirme sie hat und welcher davon sich
  # beim Antippen des Symbols öffnet. Genau dafür ist der intent-filter-Block mit MAIN und LAUNCHER da —
  # ohne ihn installiert sich die Anwendung, aber im Menü erscheint kein Symbol.
  AndroidManifest.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <manifest xmlns:android="http://schemas.android.com/apk/res/android">
      <application android:label="@string/app_name">
        <activity
            android:name=".MainActivity"
            android:exported="true">
          <intent-filter>
            <action android:name="android.intent.action.MAIN" />
            <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
        </activity>
      </application>
    </manifest>

  # Der einzige Bildschirm der Anwendung — und der gesamte Code, den das Projekt überhaupt hat.
  # Verwendet wird das nackte android.app.Activity, keine Kompatibilitätsbibliothek: das Projekt hat null externe
  # Abhängigkeiten, und das spart bei jedem Build ein paar Minuten Download.
  # R.string.greeting — ein Verweis auf einen Text aus strings.xml. Die Klasse R liegt nicht im Quellcode, sie wird
  # vom Build generiert. Deshalb bedeutet der Fehler „unresolved reference: R" einen gescheiterten Schritt
  # der Ressourcengenerierung, keinen Tippfehler im Code.
  MainActivity.kt: |
    package io.aenix.propusk

    import android.app.Activity
    import android.os.Bundle
    import android.widget.TextView

    class MainActivity : Activity() {
      override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val view = TextView(this)
        view.textSize = 22f
        view.setPadding(48, 96, 48, 48)
        view.text = getString(R.string.greeting)
        setContentView(view)
      }
    }

  # Aus dem Code ausgelagerte Texte: so werden sie bearbeitet und übersetzt, ohne den Programmierer anzurühren.
  # app_name ist unter dem Symbol auf dem Telefon sichtbar, greeting — auf dem Bildschirm selbst.
  strings.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <resources>
      <string name="app_name">Gästeausweis</string>
      <string name="greeting">Gästeausweis anfordern</string>
    </resources>
