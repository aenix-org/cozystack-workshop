---
# Lab 5 · Infrastruktur in Git. Aufgabe: was genau aus dem Repository auf den Cluster angewendet wird.
#
# Wird auf Ihrem Cluster `lab` zusammen mit der benachbarten gitrepository.yaml angewendet:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# In jedem Objekt: apiVersion — die Version des Beschreibungsschemas, kind — was wir erstellen,
# metadata.name — der Name des Objekts. Diese werden unten nicht gesondert erläutert.
#
# Aufgabentrennung: GitRepository lädt das Repository herunter und wendet nichts an,
# dieses Objekt nimmt das Heruntergeladene und bringt den Cluster damit in Einklang. Der Name Kustomization stimmt
# mit dem Namen des Werkzeugs kustomize überein, aber das sind verschiedene Dinge — hier ist es ein Objekt im Cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passes
  # Lebt am selben Ort wie die Flux-Dienste — sonst nimmt der kustomize-controller es nicht auf.
  namespace: flux-system
spec:
  # Wie oft der tatsächliche Zustand des Clusters mit dem in Git beschriebenen abgeglichen wird.
  # Das ist nicht «einmal pro Minute erneut anwenden» — es ist «einmal pro Minute vergleichen und
  # die Abweichungen korrigieren». Selbst wenn sich in Git nichts geändert hat, wird eine
  # von Hand über kubectl edit vorgenommene Änderung stillschweigend zurückgerollt. Den Unterschied sehen Sie
  # etwas später in der Lab, wenn Sie selbst etwas im Cluster an Git vorbei ändern.
  interval: 1m
  # Der Ordner innerhalb des Repositorys. Alles, was darin liegt, gelangt in den Cluster; Dateien daneben
  # — zum Beispiel README.md im Wurzelverzeichnis — werden nicht angetastet. Der Name `apps` wurde von uns gewählt, aber er
  # muss mit dem Ordner übereinstimmen, in den Sie die Manifeste in Ihrem eigenen Repository legen.
  path: ./apps
  # Objekte aus dem Cluster löschen, die aus Git verschwunden sind.
  # Ohne dies hört Git auf, die vollständige Beschreibung zu sein: aus dem Repository Gelöschtes
  # würde im Cluster weiterlaufen, und niemand wüsste davon.
  prune: true
  # Auf welche Quelle geschaut wird. Der Name `passes` ist metadata.name aus gitrepository.yaml,
  # nicht der Repository-Name auf GitHub. Benennen Sie ihn dort um — korrigieren Sie ihn auch hier, sonst wartet Flux
  # auf eine Quelle, die es nicht gibt, und die Kustomization wird nicht ready.
  sourceRef:
    kind: GitRepository
    name: passes
  # Auf die Bereitschaft des Angewendeten warten, statt sofort nach dem apply zurückzumelden.
  # Der Unterschied ist genau derselbe wie zwischen «Antrag abgeschickt» und «Antrag erledigt»: ohne wait
  # meldet Flux Erfolg, selbst wenn die Pods danach nicht hochkommen.
  wait: true
  # Wie lange auf diese Bereitschaft gewartet wird, bevor die Anwendung als erfolglos gilt.
  # Drei Minuten — mit Reserve für das Herunterladen des Images auf einen leeren Knoten. Ein zu kleiner
  # Wert führt zu falschen Fehlschlägen in einem langsamen Netz, ein zu großer — Sie werden
  # lange auf «in Bearbeitung» starren statt auf einen klaren Fehler.
  timeout: 3m
