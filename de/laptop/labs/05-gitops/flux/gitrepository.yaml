---
# Lab 5 · Infrastruktur in Git. Die Quelle: woher Flux den gewünschten Zustand bezieht.
#
# Wird auf Ihrem Cluster `lab` zusammen mit der benachbarten kustomization.yaml angewendet:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# ACHTUNG: ERSETZEN Sie die url durch die Adresse IHRES eigenen Repositorys, bevor Sie anwenden: die
# Zeichenkette ЗАМЕНИТЕ-МЕНЯ ist ein Platzhalter, mit ihr läuft Flux auf eine nicht existierende Adresse und bleibt
# mit einem Fehler hängen. Prüfen Sie auch den Branch: GitHub legt neue Repositorys mit dem Branch main an.
#
# In jedem Objekt: apiVersion — die Version des Beschreibungsschemas, kind — was wir erstellen,
# metadata.name — der Name, über den auf das Objekt weiter verwiesen wird. Wird unten nicht wiederholt.
#
# Die einzige Aufgabe dieses Objekts ist es, eine frische Kopie des Repositorys im Cluster zu halten.
# Es wendet nichts an: es lädt nur herunter. Angewendet wird durch die benachbarte Kustomization,
# und sie verweist hierher über den Namen `passes`, daher darf der Name nicht allein geändert werden.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: passes
  # flux-system — der Namespace, den der Befehl flux install eingerichtet hat; in ihm leben
  # die Flux-Dienste selbst. Konfigurationsobjekte kommen ebenfalls dorthin, sonst sehen die Dienste sie nicht.
  namespace: flux-system
spec:
  # Wie oft für den neuen Zustand nach Git gegangen wird. Eine Minute — für die Lab;
  # in der Produktion üblicherweise 1–5 Minuten, und eine sofortige Reaktion erreicht man mit einem Webhook aus GitHub.
  interval: 1m
  # Die Adresse des Repositorys. Es ist öffentlich, daher gibt es hier weder Login noch Schlüssel —
  # das ist eine Vereinfachung des Lernstands. In der Produktion ist das Repository privat, und daneben erscheint
  # ein Verweis auf ein Secret mit einem Deploy-Schlüssel (das Feld secretRef).
  url: https://github.com/ЗАМЕНИТЕ-МЕНЯ/passes-gitops
  # Welcher Branch als Quelle der Wahrheit gilt. In den Cluster geht, was in main gemergt wurde;
  # was in anderen Branches liegt, geht nicht. Daher kommt das Review: eine Änderung
  # lebt zunächst in ihrem eigenen Branch, wo man sie ansehen kann, und erst ein Merge in main
  # macht sie wirksam. Wenn das Repository mit dem alten Branch master angelegt wurde —
  # korrigieren Sie es hier, sonst findet Flux nicht, was es lesen soll.
  ref:
    branch: main
