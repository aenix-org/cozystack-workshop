---
# Lab 5 · Infrastruktur in Git. Der Dienst „Pass" selbst: vier Objekte in einer Datei.
#
# Wird nicht von Hand auf den Cluster angewendet. Die Datei wird in ihr eigenes Repository auf GitHub gelegt, in den
# Ordner apps/, neben namespace.yaml, und Flux trägt sie in den Cluster `lab` — von selbst:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# Die Zeile --- trennt Objekte: eine Datei, vier unabhängige Objekte. Die Reihenfolge in der Datei
# beeinflusst die Reihenfolge der Erstellung nicht — der Cluster regelt das von selbst.
#
# In jedem Objekt: apiVersion — die Version des Beschreibungsschemas, kind — was wir erstellen,
# metadata.name — der Name des Objekts, metadata.namespace — in welcher Trennwand des Clusters es
# lebt. Diese Felder werden weiter unten nicht mehr einzeln erläutert.
#
# Keines der vier Objekte enthält ein Passwort, einen Schlüssel oder ein Token, und das ist kein
# Zufall: Was in Git gerät, bleibt dort für immer — die Historie lässt sich umschreiben, aber
# jeder, der es bereits geklont hat, behält die alte Kopie. Geheimnisse haben hier nichts zu suchen.

# --- 1 von 4. Webserver-Einstellungen ----------------------------------------------
# Eine ConfigMap legt eine Textdatei getrennt von der Anwendung in den Cluster, und weiter unten (im
# Abschnitt volumes) wird diese Datei in den Container eingelegt. Der Sinn — Einstellungen ändern, ohne
# das Image neu zu bauen: hier ändern, committen, und eine Minute später hat der Cluster die neue Version.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-conf
  namespace: passes
# Der Schlüssel innerhalb von data wird zum Dateinamen im Container: default.conf landet in dem Ordner,
# den nginx beim Start liest. Der senkrechte Strich nach dem Namen ist eine Möglichkeit, mehrzeiligen
# Text in YAML unverändert zu schreiben, unter Beibehaltung der Zeilenumbrüche.
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      # Adresse für die Bereitschaftsprüfung. Der Cluster klopft hier an und lässt keinen
      # Verkehr auf eine Kopie, solange er keine Antwort erhält.
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        # In der ausgelieferten Seite ersetzen wir __POD__ durch den Namen der Maschine, auf der
        # nginx läuft. Innerhalb des Pods ist der Maschinenname der Name des Pods selbst.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
    }
---
# --- 2 von 4. Die Seite, die der Dienst ausliefert ---------------------------------
# In diesem Lab ist die Seite ein Platzhalter: die echte Anwendung erscheint später. Jetzt ist wichtig
# nicht, was der Dienst zeigt, sondern woher er im Cluster kam. Der Text __POD__ in der Auszeichnung —
# eine Marke für die Ersetzung: nginx ersetzt sie durch den Namen des Pods, der die Seite ausgeliefert hat, und an
# diesem Namen sehen Sie später, dass es nun mehr als eine Kopie gibt.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-page
  namespace: passes
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Пропуск</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 40rem;
               color: #222; }
        h1 { font-weight: 600; }
        .v { display: inline-block; padding: .2rem .6rem; border-radius: .3rem;
             background: #eef; font-family: ui-monospace, monospace; }
        .pod { margin-top: 2rem; color: #666; font-size: .9rem; }
        b { font-family: ui-monospace, monospace; color: #222; }
      </style>
    </head>
    <body>
      <h1>Сервис «Пропуск»</h1>
      <p>Заказ пропуска для гостя. Версия <span class="v">v1</span></p>
      <p>Развёрнуто из Git. Руками сюда никто не ходил.</p>
      <div class="pod">вас обслужил под <b>__POD__</b></div>
    </body>
    </html>
---
# --- 3 von 4. Die Beschreibung der Anwendung selbst --------------------------------
# Ein Deployment ist nicht „starte einen Container", sondern „halte so viele Kopien eines
# solchen Containers am Laufen". Der Unterschied zeigt sich, wenn eine Kopie stirbt: der Cluster erstellt eine neue, ohne
# zu fragen und ohne zu benachrichtigen. In vSphere kommt HA dem am nächsten, aber dort startet eine Maschine neu,
# während hier eine Kopie der Anwendung neu erstellt wird, und das geschieht ständig, nicht nur bei einem Ausfall.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes
  namespace: passes
  labels:
    app: passes
spec:
  # Wie viele Kopien am Laufen zu halten sind. Die Formulierung ist wichtig: nicht „starte eine", sondern
  # „halte eine". Diese Zahl werden Sie über Git ändern und sehen, was passiert.
  replicas: 1
  # Woran das Deployment seine Kopien erkennt. Das ist keine Liste von Pod-Namen —
  # Namen ändern sich bei jeder Neuerstellung — sondern die Bedingung „alle Pods mit dem Label app: passes".
  # Das Label weiter unten, in template.metadata.labels, muss dieser Bedingung entsprechen: weichen sie voneinander ab
  # — verweigert der Cluster die Annahme des Manifests, weil die Kopien niemandem gehören würden.
  selector:
    matchLabels:
      app: passes
  # template — die Vorlage, nach der Kopien gestanzt werden. Alles darin beschreibt einen
  # Pod. Das Bearbeiten der Vorlage bedeutet das Ausrollen einer neuen Version: alte Kopien werden durch neue ersetzt.
  template:
    metadata:
      labels:
        app: passes
    spec:
      # Sicherheitsbeschränkungen auf Ebene des gesamten Pods. In vSphere gibt es kein Analogon: dort
      # liefert der Hypervisor die Isolation, während Container den Kernel mit dem Knoten teilen, deshalb
      # müssen Rechte explizit beschnitten werden.
      #   runAsNonRoot   nicht starten, wenn das Image als root laufen möchte
      #   runAsUser      unter welchem numerischen Benutzer laufen; 65532 — der übliche
      #                  „unprivilegierte" Bezeichner in minimalen Images
      #   seccompProfile welche Systemaufrufe erlaubt sind; RuntimeDefault — ein Satz,
      #                  der das offensichtlich Gefährliche abschneidet und nichts kaputtmacht
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Dieselben Beschränkungen, aber nun für einen konkreten Container.
          #   allowPrivilegeEscalation: false  der Prozess kann sich keine weiteren Rechte holen
          #   capabilities.drop: ["ALL"]       alle besonderen Kernel-Befugnisse entziehen
          #                                    (Netzwerk ändern, mounten, Zeit ändern);
          #                                    der Webserver braucht keine davon
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Das Image wird aus einer öffentlichen Registry genommen — im nächsten Lab wird die Sicherheit das verbieten, und
          # die Adresse wechselt zum eigenen Harbor. Die Variante unprivileged wurde nicht der Schönheit wegen gewählt:
          # das gewöhnliche nginx-Image lauscht auf Port 80 und will dafür root-Rechte, und mit
          # runAsNonRoot oben würde es überhaupt nicht starten.
          # Die Version ist festgeschrieben (1.27-alpine), nicht latest: sonst würde dasselbe
          # Manifest morgen eine andere Anwendung ausrollen, und Sie würden davon nichts erfahren.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # Der Port, auf dem die Anwendung lauscht. Der Name `http` ist keine Verzierung: darauf
          # verweisen die Bereitschaftsprüfung unten und der Service am Ende der Datei. Ändern Sie die
          # Portnummer, müssen Sie sie an einer Stelle ändern, nicht an drei.
          ports:
            - containerPort: 8080
              name: http
          # requests — wie viele Ressourcen garantiert reserviert werden; anhand dieser Zahl
          # wählt der Scheduler einen Knoten. limits — die Obergrenze, über die hinaus nichts erlaubt wird.
          # Zu niedrige requests bedeuten, dass mehr auf den Knoten passt, als er tragen kann;
          # Überschreiten des Speicher-limits — der Container wird getötet, beim Prozessor — gedrosselt.
          # 20m = zwanzig Tausendstel eines Kerns, Mi = Megabyte. Die Werte hier sind klein,
          # weil es im Lab einen einzigen, kleinen Knoten gibt.
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Bereitschaftsprüfung: der Cluster klopft an dieser Adresse an und lässt keinen Verkehr
          # auf eine Kopie, solange er keine Antwort erhält. Ohne sie würde der Service Anfragen an
          # ein noch nicht hochgefahrenes nginx senden, und der Benutzer sähe bei jedem Ausrollen einen Fehler.
          # Auch Flux wartet darauf — in kustomization.yaml haben wir wait: true verlangt.
          #   initialDelaySeconds  vor dem ersten Klopfen warten, dem Prozess Zeit zum Starten geben
          #   periodSeconds        wie oft danach zu klopfen ist
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # Wohin innerhalb des Containers der Inhalt der beiden ConfigMaps vom Dateianfang zu legen ist.
          # /etc/nginx/conf.d — der Ordner, aus dem nginx beim Start die Einstellungen liest,
          # /usr/share/nginx/html — der Ordner, aus dem es Dateien ausliefert.
          # Das Image selbst ändert sich dabei nicht: die Dateien erscheinen darin im Moment des Starts.
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: page
              mountPath: /usr/share/nginx/html
      # Was genau einzulegen ist. Die Namen conf und page sind intern, sie verbinden diesen
      # Block mit den volumeMounts oben; name innerhalb von configMap ist bereits der Name eines realen Objekts
      # im Cluster. Vertun Sie sich darin, hängt der Pod und wartet auf eine nicht existierende ConfigMap.
      volumes:
        - name: conf
          configMap:
            name: passes-conf
        - name: page
          configMap:
            name: passes-page
---
# --- 4 von 4. Ein beständiger Name, hinter dem alle Kopien stehen ------------------
# Pods werden neu erstellt, und ihre Adressen sind jedes Mal neu. Der Service gibt einen unveränderlichen Namen —
# passes.passes.svc.cluster.local —, unter dem man innerhalb des Clusters immer die
# lebenden Kopien erreichen kann. Das ist interne Lastverteilung, von außerhalb des Clusters kommt man hier noch nicht hin.
apiVersion: v1
kind: Service
metadata:
  name: passes
  namespace: passes
spec:
  # Die Verbindung des Service zu Pods ist keine Liste von Adressen, sondern die Bedingung „alle Pods mit dem Label app: passes".
  # Eine neue Kopie mit einem solchen Label ist aufgetaucht — sie kam von selbst unter die Lastverteilung, es muss
  # nichts registriert werden. Sie verschwand — sie wurde aus der Ausgabe entfernt.
  selector:
    app: passes
  # port — auf welchem Port der Service selbst antwortet, targetPort — wohin er weiterleitet
  # in den Container hinein. Hier verweist targetPort auf den Namen `http` aus dem ports-Block oben,
  # nicht auf eine Nummer: die Nummer kann an einer Stelle geändert werden, und die Verbindung reißt nicht.
  ports:
    - port: 80
      targetPort: http
