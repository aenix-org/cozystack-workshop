# Lab 9 · Bestellung einer ClickHouse-Datenbank für die Analyse des Zutrittsprotokolls.
# Eine Beschreibung dessen, was Sie erhalten möchten; die Plattform baut den Dienst zusammen und konfiguriert ihn.
# Dasselbe, was Sie mit der Maus im Dashboard bestellen würden — nur als Text.
# Wird NICHT auf das Laborcluster angewendet, sondern auf einen Tenant im Management-Cluster:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f clickhouse.yaml
#
# VOR DEM ANWENDEN: Ersetzen Sie tenant-workshopXX durch Ihren Namespace
# und ЗдесьВашПароль durch ein Passwort, das Sie sich ausdenken.
apiVersion: apps.cozystack.io/v1alpha1
kind: ClickHouse
metadata:
  name: analytics
  namespace: tenant-workshopXX
spec:
  # Eine Replika und ein Shard. In der Produktion hält man mindestens zwei Replikas, sonst bedeutet der
  # Ausfall eines Knotens die Nichtverfügbarkeit der Daten, — aber wir brauchen eine Million Zeilen, keine
  # Ausfallsicherheit, und eine zusätzliche Replika würde einfach die Ressourcen des Stands auffressen.
  replicas: 1
  shards: 1
  # Festplatte für die Tabellendaten. Eine Million Zeilen aus diesem Lab belegen einige zehn Megabyte:
  # spaltenorientierte Speicherung mit Wörterbüchern komprimiert ein solches Protokoll sehr stark.
  size: 5Gi
  # Eine separate Festplatte für die Systemprotokolle des Servers, einschließlich des Abfrageprotokolls.
  logStorageSize: 2Gi
  # Nach wie vielen Tagen das Abfrageprotokoll verworfen wird. Wir werden hineinschauen.
  logTTL: 15
  # replicated — Volumes, die eine Kopie auf einem anderen Clusterknoten haben: Ein Knoten fiel aus,
  # die Daten blieben erhalten.
  storageClass: replicated
  # 1 Prozessor, 4 GB. ClickHouse rechnet im Speicher, und bei Gruppierungen über
  # eine Million Zeilen macht sich das bemerkbar.
  resourcesPreset: u1.small
  # Der Datenbankbenutzer und sein Passwort. Denken Sie sich Ihr eigenes Passwort aus und merken Sie es sich: Es wird
  # vom Arbeits-Pod (Variable CH_AUTH) und vom Prüfskript (Variable CH_PASSWORD) benötigt.
  # Nach der Erstellung ist es im Dashboard sichtbar, im Secret clickhouse-analytics-credentials.
  users:
    analyst:
      password: ЗдесьВашПароль
  # Backups in den Objektspeicher. Die Daten hier sind generiert,
  # es gibt nichts wiederherzustellen — auf dem Trainingsstand deaktiviert.
  backup:
    enabled: false
  # Keeper wird für die Koordination zwischen Replikas benötigt. Es gibt eine Replika — es gibt niemanden,
  # mit dem koordiniert werden könnte, und drei Keeper-Pods würden Ressourcen umsonst verbrauchen.
  clickhouseKeeper:
    enabled: false
