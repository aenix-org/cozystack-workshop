# Lab 10 · Bestellung einer MongoDB-Datenbank für Ausweise verschiedener Art.
# Eine Beschreibung dessen, was Sie erhalten möchten; die Plattform baut und konfiguriert den Dienst.
# Dasselbe, was Sie mit der Maus im Dashboard bestellen würden — nur als Text.
# Wird NICHT auf den Lab-Cluster angewendet, sondern auf einen Tenant im Management-Cluster:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f mongodb.yaml
#
# VOR DEM ANWENDEN: Ersetzen Sie tenant-workshopXX durch Ihren Namespace
# und ЗдесьВашПароль durch ein Passwort, das Sie sich ausdenken.
apiVersion: apps.cozystack.io/v1alpha1
kind: MongoDB
metadata:
  name: passes
  namespace: tenant-workshopXX
spec:
  # Eine einzelne Kopie. MongoDB ist für ein Replica-Set aus dreien ausgelegt: sie stimmen darüber ab, wer
  # primär ist, und überstehen den Ausfall einer. Mit einer einzelnen Kopie gibt es niemanden zum Abstimmen,
  # und der Chart aktiviert dafür einen separaten „unsicheren“ Modus. Für ein Lab in Ordnung,
  # für die Produktion nicht.
  replicas: 1
  # Festplatte für Daten. Ein Megabyte würde für vier Lerndokumente ausreichen, aber es ist
  # einfacher, das Volume von vornherein großzügig zu bemessen, als es später zu erweitern.
  size: 5Gi
  # replicated — Volumes, die eine Kopie auf einem anderen Cluster-Knoten haben: fällt ein Knoten aus,
  # bleiben die Daten erhalten.
  storageClass: replicated
  # CPU und Arbeitsspeicher, die dem Datenbank-Pod zugewiesen sind. Mehr als genug für vier Dokumente.
  resourcesPreset: s1.small
  # MongoDB-Zweig. Ein nachträgliches Ändern an einer laufenden Datenbank ist ohne ein Upgrade nicht möglich.
  version: v8
  # false — die Datenbank ist nur von innerhalb des Clusters erreichbar, es wird kein Port nach außen bereitgestellt.
  # Sie greifen von einem daneben gestarteten Arbeits-Pod darauf zu.
  external: false
  # Sharding verteilt Daten über mehrere Gruppen von Servern. Nötig, wenn
  # die Daten nicht auf einen einzelnen Server passen; vier Ausweise passen.
  sharding: false
  # Der Datenbankbenutzer und sein Passwort. Denken Sie sich Ihr eigenes Passwort aus und merken Sie es sich: es wird benötigt
  # vom Arbeits-Pod (im MONGO_URI-Verbindungsstring) und vom Prüfskript
  # (der Variable MONGO_PASSWORD). Das Konto wird in der Dienstdatenbank admin angelegt —
  # deshalb ist authSource=admin im Verbindungsstring zwingend erforderlich.
  users:
    passapp:
      password: ЗдесьВашПароль
  # Die Datenbank passes und die Rechte darin: dem Benutzer passapp wird die admin-Rolle dieser Datenbank gewährt,
  # das heißt, er kann lesen, schreiben, Indizes erstellen und Collection-Einstellungen ändern.
  # Rechte an anderen Datenbanken gewährt dies nicht.
  databases:
    passes:
      roles:
        admin:
          - passapp
  # Backups in den Objektspeicher. Auf dem Lernstand deaktiviert.
  backup:
    enabled: false
