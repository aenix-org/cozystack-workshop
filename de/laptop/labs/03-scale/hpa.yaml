---
# Lab 3. Replikas nach CPU-Last hochskalieren.
# Ziel sind 50% von requests.cpu (20m), das heißt der Schwellenwert liegt bei 10m pro Pod.
# Bewusst niedrig gewählt: die Last muss innerhalb von Sekunden auslösen,
# wir haben eine halbe Stunde für das Lab, nicht einen halben Tag.
#
# Ein einziges Objekt. Wird auf eurem Trainingscluster `lab` angewendet, nicht in einem Tenant
# auf dem Management-Cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f hpa.yaml
# Platzhalter wie tenant-workshopXX gibt es hier nicht — ihr müsst nirgends eure eigene Nummer einsetzen.
#
# Zwei Bedingungen, ohne die das Objekt zwar erstellt wird, aber nicht funktioniert:
#   1. Der Container rickroll hat requests.cpu gesetzt — sonst gibt es nichts, wovon man Prozente berechnen könnte,
#      und in der Spalte TARGETS von `kubectl get hpa` bleibt für immer <unknown> stehen.
#   2. Im Cluster läuft metrics-server — die Quelle des aktuellen Pod-Verbrauchs.
# Beide Bedingungen prüft check.sh in diesem Ordner.
#
# Solange der HPA existiert, gehört das replicas-Feld des Deployments ihm. Die Anzahl der
# Kopien lässt sich zwar von Hand über `kubectl scale` ändern, aber der HPA stellt seinen eigenen Wert
# innerhalb von Sekunden wieder her. Deshalb wird dieses Objekt in Lab 4 vor dem Rollout gelöscht: zwei Mechanismen
# auf einem Feld — ein garantierter Weg, nicht zu verstehen, was passiert ist.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # Der HPA-Name muss nicht mit dem Namen der Anwendung übereinstimmen — die Übereinstimmung hier ist der Bequemlichkeit wegen.
  # Was verwaltet wird, bestimmt scaleTargetRef weiter unten, nicht dieser Name.
  name: rickroll
spec:
  # Wen beobachten und wessen replicas-Feld ändern. Drei Felder zusammen, weil ein Name
  # ohne Typ mehrdeutig ist: ein Deployment und ein StatefulSet können gleich heißen.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rickroll
  # Der Korridor, den der HPA unter keiner Last verlässt. Die untere Grenze ist dieselbe
  # eine Kopie, mit der das Lab begonnen hat. Die obere ist sechs: so viele passen
  # auf den Trainings-Node bei limits.cpu 300m und sind zugleich in der Pod-Liste auf einen Blick erkennbar.
  # Setzt ihr maxReplicas: 1, wird das Objekt erstellt und tut nichts.
  minReplicas: 1
  maxReplicas: 6
  # Worauf die Entscheidung gestützt wird. Es kann mehrere Metriken geben, dann nimmt der HPA diejenige,
  # die mehr Kopien erfordert. Hier gibt es nur eine — die CPU.
  metrics:
    - type: Resource
      resource:
        name: cpu
        # Utilization — ein Anteil an requests.cpu des Containers, nicht an der Kapazität des Nodes.
        # Daher eine unintuitive Folge: der Wert erreicht gelassen 600%, und das ist
        # kein Fehler: der Pod frisst sechsmal mehr, als er reserviert hat.
        # Die Alternative ist AverageValue, bei der der Schwellenwert direkt in Millicores angegeben wird.
        target:
          type: Utilization
          averageUtilization: 50
  # Wie flott reagieren. Der Block ist optional: ohne ihn werden die Standardwerte verwendet,
  # die für den Produktivbetrieb ausgelegt sind, nicht für eine Demonstration.
  behavior:
    scaleUp:
      # Standardmäßig wartet Kubernetes auf Stabilisierung und wächst langsam.
      # Im Lab sieht das aus wie „nichts passiert“, deshalb beschleunigen wir es.
      stabilizationWindowSeconds: 0
      # Nicht mehr als zwei neue Kopien pro fünfzehn Sekunden. Der Schritt wurde empirisch
      # gewählt: das Wachstum ist als Wachstum zu sehen, nicht als sofortiger Sprung von eins direkt auf sechs,
      # bei dem es für den Teilnehmer nichts zu betrachten gibt.
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      # Nach unten dagegen umgekehrt — nicht sofort, sonst würden die Pods verschwinden,
      # bevor der Teilnehmer sie betrachten kann.
      # Eine Minute statt der standardmäßigen fünf: das Lab dauert eine halbe Stunde, fünf davon
      # auf das Herunterskalieren zu warten, lässt sich mit nichts füllen. In einem Produktivcluster ist ein langes Fenster gerade nützlich —
      # es dämpft das Schaukeln bei ungleichmäßiger Last.
      stabilizationWindowSeconds: 60
