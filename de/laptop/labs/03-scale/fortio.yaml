# Lab 3. Fortio-Lastgenerator: der Generator selbst und eine stabile Adresse für seine
# Weboberfläche. Zwei Objekte, getrennt durch `---`.
#
# Wird auf deinem Trainingscluster `lab` angewendet, nicht auf einem Tenant im Management-Cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f fortio.yaml
# Platzhalter wie tenant-workshopXX gibt es hier nicht — du musst nirgends deine Nummer einsetzen.
# Dieselbe Datei wird in Lab 4 benötigt: `kubectl apply -f ../03-scale/fortio.yaml`.
#
# Die gemeinsamen Felder des Manifests (apiVersion, kind, metadata.name, selector, template,
# securityContext) werden in ../01-deploy/rickroll.yaml Zeile für Zeile seziert und hier
# nicht wiederholt. Wir kommentieren nur das, was speziell für den Lastgenerator ist.
---
# Lastgenerator mit Weboberfläche.
# Bewusst statt hey/ab gewählt: die Last startet man per Knopf im Browser,
# und das Latenz-Histogramm sieht man direkt dort. Bei früheren Workshops haben wir
# Leute genau an Konsolen-Werkzeugen verloren.
#
# Fortio lebt im Cluster als gewöhnliche Anwendung und trifft die rickroll-Adresse von innen.
# Von außen, vom Laptop aus, zu belasten wäre verkehrstechnisch ehrlicher, würde aber am Kanal
# zum Cluster hängen, und du würdest dein WLAN messen statt der Anwendung.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # Eine Kopie des Generators reicht: sie erzeugt die Last selbst in vielen Threads.
  # Eine zweite Kopie würde das Bild hier nur verwischen — die Zähler in der Weboberfläche
  # sind pro Kopie, und du würdest die Hälfte der Anfragen sehen.
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # Dasselbe Sicherheitsprofil wie bei rickroll: läuft nicht als root, eine konkrete
      # UID, Standard-seccomp. Bewusst beibehalten — damit die Datei auch in einem Cluster
      # mit aktiviertem Profil `restricted` angewendet werden kann, wo der Pod sonst nicht startet.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Das Tag latest ist eine bewusste Vereinfachung für den Workshop, um Versionen nicht abgleichen zu müssen.
          # In einem Produktionscluster macht man das nicht: das Image unter diesem Tag kann sich unbemerkt
          # zwischen zwei Applies ändern, und du kannst das Ergebnis von gestern nicht reproduzieren.
          image: fortio/fortio:latest
          # Der Modus `server` bringt die Weboberfläche hoch und hält sie am Laufen. Ohne dieses Argument
          # würde Fortio einen einzelnen Durchlauf von der Kommandozeile ausführen und beenden, und der Cluster
          # würde den Container in einer Schleife neu starten.
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            # Der Request ist höher als der von rickroll selbst (20m): der Generator braucht vorab Platz auf dem Knoten,
            # sonst packt der Scheduler ihn eng, und der Hochlauf wird ungleichmäßig.
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # Der Generator braucht CPU-Reserve, sonst stößt er
              # an sein eigenes Limit, und du belastest Fortio statt der Anwendung.
              cpu: "1"
              memory: 256Mi
---
# Eine stabile Adresse für den Generator innerhalb des Clusters. Nötig, um die Weboberfläche
# vom Laptop aus über `kubectl port-forward svc/fortio 8081:8080` zu öffnen — von außen veröffentlicht der Cluster
# nichts, und es gibt keine anderen Türen zu Fortio.
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  ports:
    # 8080 auf beiden Seiten: sowohl der Service als auch der Container. Die Nummer ist dieselbe wie bei rickroll
    # innerhalb des Pods, aber es gibt keine Kollision — jeder Pod hat seinen eigenen Netzwerkstack.
    - port: 8080
      targetPort: http
