---
# Lab 12. Eine virtuelle Maschine für ein Legacy-Mitarbeiterverzeichnis: die Festplatte und die Maschine selbst,
# zwei Objekte in einer Datei, getrennt durch die Zeile `---`.
#
# Dies sind Tenant-Objekte: sie leben NICHT im Cluster `lab`, sondern in Ihrem Namespace
# auf dem Management-Cluster. Sie brauchen die Tenant-Kubeconfig.
#
# Ersetzen Sie vor dem Anwenden tenant-workshopXX durch Ihren Namespace, sonst geht die Bestellung
# in den falschen Tenant statt in Ihren.
#
#     export KUBECONFIG=~/.kube/workshop
#     kubectl apply -f staff-directory-vm.yaml
#
# Dasselbe lässt sich mit der Maus im Tenant-Dashboard erledigen (Anwendung erstellen -> VM Disk,
# dann VM Instance) — das Ergebnis ist identisch.
#
# ACHTUNG: der Name, unter dem die Maschine später angesprochen wird, stimmt NICHT mit metadata.name überein, und das ist
# kein Tippfehler in der Lab. Ein VMInstance-Objekt mit dem Namen X rollt die Plattform mit dem Chart
# `vm-instance` aus, und der Chart-Name wird mit dem Release-Namen zusammengeklebt: die laufende Instanz
# heißt vm-instance-X. Hinzu kommt, dass das Ziel mit einem Typ-Präfix angegeben wird, weil
# die Tenant-Rechte auf Instanzen (virtualmachineinstances, auch vmi genannt) vergeben sind, nicht auf
# virtualmachines — ein nackter Name gibt forbidden zurück. Daher der Befehl zum Anmelden an der Konsole:
#     virtctl console --namespace=tenant-workshopXX vmi/vm-instance-spravochnik
# Liste der laufenden Instanzen: kubectl get vmi -n tenant-workshopXX
# Und `kubectl get vminstance spravochnik` zeigt nicht die Instanz, sondern Ihre Bestellung dafür —
# genau das Objekt, das unten beschrieben ist.
#
# Die Festplatte und die Maschine sind ZWEI VERSCHIEDENE Objekte, und das ist keine Bürokratie: die Festplatte überlebt
# die Maschine. Die Maschine kann gelöscht und neu erstellt werden, wobei dieselbe Festplatte angehängt wird.
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  source:
    image:
      # Ein Name aus der gemeinsamen Image-Sammlung der Plattform, keine URL.
      # Die Liste ist im Dashboard beim Erstellen einer Festplatte sichtbar.
      name: ubuntu-22.04
  # Festplattengröße. Sie kann nicht kleiner sein als das Quell-Image: ubuntu-22.04 entpackt sich
  # auf 20Gi, und eine 10Gi-Festplatte würde die Plattform nicht befüllen. Die Festplatte lässt sich später vergrößern,
  # aber nicht verkleinern, deshalb kostet ein zu niedriger Wert hier mehr als ein zu hoher.
  storage: 20Gi
  # Storage-Klasse. `replicated` — die Daten werden in mehreren Kopien auf verschiedene Knoten
  # der Plattform geschrieben: ein Knoten mit einer Kopie kann ausfallen, die Maschine läuft weiter. Im Grunde ist das
  # ein Spiegel, nur über das Netzwerk zusammengesetzt. Dieselbe Klasse verwenden die Datenbanken in den benachbarten Labs.
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  # 1 Prozessor, 4 GB. Dieselbe Katalog-Referenz, aus der die
  # Größen der Kubernetes-Knoten stammen: Maschinen und Knoten werden hier gleich gemessen.
  instanceType: u1.medium
  # Profil des Gast-Betriebssystems: welche Treiber und Geräte der Maschine untergeschoben werden.
  instanceProfile: ubuntu
  # Always bedeutet „eingeschaltet halten": schaltet sie sich selbst aus — wird sie wieder eingeschaltet.
  # Halted — ausgeschaltet, Manual — so wie hinterlassen.
  runStrategy: Always
  # Welche Festplatten an die Maschine angeschlossen werden. Die Referenz erfolgt über den Namen des VMDisk-Objekts oben — genau
  # jenes, das diese Maschine überleben wird.
  disks:
    - name: spravochnik
  # Beachten Sie: ein replicas-Feld gibt es hier NICHT und wird es nicht geben.
  # Eine virtuelle Maschine ist ein einziges Objekt. Braucht man zwei Maschinen — zwei Objekte
  # mit unterschiedlichen Namen. Das ist ein grundlegender Unterschied zu Deployment,
  # siehe den README-Abschnitt darüber, wo dieser Unterschied wehtut.
  # Erstkonfiguration des Gast-Betriebssystems. cloud-init ist der Standardmechanismus von Cloud-Images
  # für Linux: beim ersten Start liest die Maschine diesen Text und wendet ihn auf sich selbst an. Von der Rolle her
  # ist es die Gast-Anpassung in vSphere — Passwörter, Dateien, Dienste — nur per Beschreibung, nicht
  # per Assistent. Alles unterhalb der Einrückung nach `|` geht wortwörtlich in den Gast und wird
  # dort geparst, nicht von Kubernetes.
  #
  # Hier macht cloud-init aus dem Verzeichnis einen Server: es legt eine HTML-Seite ab und richtet einen Dienst ein,
  # der sie über HTTP auf Port 8080 ausliefert. python3 ist im ubuntu-Image bereits vorhanden — das Internet
  # wird dafür nicht benötigt. Port 8080 ist nicht zufällig: der Leiter hat in Ihrem Tenant im Voraus
  # einen Service `spravochnik-http` (80 -> 8080) und einen Ingress `spravochnik` erstellt, und sobald der Dienst
  # innerhalb der Maschine hochfährt, wird das Verzeichnis auf der Tenant-Domain veröffentlicht.
  cloudInit: |
    #cloud-config
    # Das Passwort wird gebraucht, um sich vom Dashboard aus an der Konsole anzumelden. Auf einer Produktionsmaschine
    # sollte man das nicht tun — dort sshKeys.
    password: ubuntu
    chpasswd: { expire: false }
    ssh_pwauth: true
    write_files:
      - path: /opt/directory/index.html
        content: |
          <!doctype html><html lang="de"><head><meta charset="utf-8"><title>Verzeichnis</title></head><body><h1>Mitarbeiterverzeichnis</h1><ul><li>Weber J. — 101</li><li>Peters P. — 102</li></ul></body></html>
      - path: /etc/systemd/system/directory.service
        content: |
          [Unit]
          Description=Staff directory
          After=network.target
          [Service]
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0 --directory /opt/directory
          Restart=always
          [Install]
          WantedBy=multi-user.target
    runcmd: [ "systemctl daemon-reload", "systemctl enable --now directory" ]
