---
# Labor 4. Die zweite Version der Seite — die, die wir unter Last ausrollen.
# Sie soll sich deutlich unterscheiden: Der Teilnehmer schaut in den Browser, nicht in einen Diff.
#
# Ein einzelnes Objekt. Wird auf deinem Trainingscluster `lab` angewendet, nicht im Tenant
# auf dem Management-Cluster:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll-page-v2.yaml
# Platzhalter wie tenant-workshopXX gibt es hier nicht — du musst nirgends deine Nummer einsetzen.
#
# Die Hauptsache, über die man hier stolpert: Dieses apply rollt für sich genommen nichts aus.
# Es legt eine weitere Einstellungsdatei neben die erste in den Cluster. Solange das Volume `page`
# des Deployments auf rickroll-page-v1 verweist, sehen die Nutzer die erste Version.
# Zum Rollout wird der nächste Schritt des Labors — das Umschalten des Volumes auf diese ConfigMap.
# Daher die ganze Konstruktion mit zwei Objekten: Die erste Version bleibt im Cluster
# unangetastet, und ein Rollback bringt sie vollständig zurück, statt sie aus dem Gedächtnis zu rekonstruieren.
#
# Würden wir stattdessen die ConfigMap rickroll-page-v1 an Ort und Stelle bearbeiten, gäbe es
# kein Ziel für einen Rollback, und die Pods bekämen neuen Inhalt ohne Austausch der Kopien und ohne Eintrag
# in der Revisionshistorie — also ohne all das, wofür das Labor gemacht ist.
#
# Der Objektname darf nicht geändert werden: Auf rickroll-page-v2 verweist der Patch aus der README
# und die Prüfung in check.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v2
data:
  # Alles unterhalb der Einrückung nach `|` ist der wortwörtliche Inhalt der Datei index.html,
  # die im Container landet. Das ist kein YAML mehr: Kommentare gibt es hier nicht
  # und kann es nicht geben — eine Raute würde als gewöhnlicher Text auf der Seite landen.
  #
  # Zwei Dinge sind im Markup wichtig, auf die check.sh schaut: die Aufschrift «ВЕРСИЯ 2» —
  # daran unterscheidet die Prüfung die zweite Version von der ersten, und der Platzhalter __POD__ — er wird
  # nach der Regel aus der ConfigMap rickroll-conf (Labor 1) durch den Namen des nginx-Pods ersetzt.
  # Entfernst du eines von beiden, besteht die Laborprüfung nicht, obwohl der Rollout erfolgreich ist.
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>We're No Strangers To Love</title>
    <style>
      body{background:#07131a;color:#e8f6ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      .tag{display:inline-block;margin-bottom:1.5em;padding:.35em 1em;border-radius:999px;
           background:#00e0ff;color:#052; font-weight:700;letter-spacing:.08em;font-size:13px}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#00ffa3,#00e0ff,#7a5cff,#00ffa3);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#7f96a3;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#5d7380}
      .pod b{display:block;margin-top:.4em;color:#00ffa3;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#3f5561;font-size:14px}
    </style>
    <div class="tag">ВЕРСИЯ 2</div>
    <h1>We're No Strangers To Love</h1>
    <p class="lyr">You know the rules &middot; And so do I</p>
    <div class="pod">вас обслужил под<b>__POD__</b></div>
    <p class="hint">Обновление прошло под нагрузкой. Посмотрите в Fortio: ошибок ноль.</p>
    </html>
