# Trainings-Kubernetes-Cluster für die Labs 1-14.
# Vor dem Anwenden tenant-workshopXX durch euren eigenen Namespace ersetzen.
#
# Wird auf dem VERWALTUNGS-Cluster angewendet — mit dem Zugang, der zusammen
# mit dem Tenant ausgegeben wurde. Die kubeconfig dieses Clusters selbst existiert noch
# nicht: sie erscheint erst, nachdem der Cluster hochgefahren ist.
#
#   kubectl apply -f cluster.yaml
#
apiVersion: apps.cozystack.io/v1alpha1
kind: Kubernetes
metadata:
  name: lab
  namespace: tenant-workshopXX
spec:
  version: v1.35
  storageClass: replicated
  controlPlane:
    # Eine einzige Kopie der Control Plane: Dies ist ein Trainingsstand, Ressourcen
    # zu schonen ist wichtiger als Ausfallsicherheit.
    replicas: 1
  addons:
    monitoringAgents:
      # Sofort aktivieren. Die Metrikerfassung lässt sich nicht rückwirkend aktivieren:
      # alles, was vor dem Setzen des Häkchens passiert ist, ist verloren. Lab 14 stützt sich auf diese Daten.
      enabled: true
  nodeGroups:
    md0:
      # Die Gruppe kann selbst Nodes hinzufügen, wenn den Kopien der Platz ausgeht.
      # Im Skalierungs-Lab kommt es nicht so weit: dort wachsen die Kopien, nicht die Nodes.
      minReplicas: 1
      maxReplicas: 3
      instanceType: u1.medium
      diskSize: 20Gi
      storageClass: replicated
