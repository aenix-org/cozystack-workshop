---
# Lab 6 · Deine eigene private Image-Registry. DIESE DATEI IST ABSICHTLICH UNVOLLSTÄNDIG.
#
# Sie wird nicht funktionieren, und das ist so gewollt: Du sollst das Scheitern mit eigenen
# Augen sehen und selbst herausfinden, was dem Cluster gefehlt hat. Es fehlt hier eine einzige
# Sache — das, als was sich der Cluster einer geschlossenen Registry gegenüber ausgibt, wenn er
# ein Image abholen kommt. Die Registry gibt Images nicht an jeden beliebigen heraus, und in
# diesem Manifest steht nichts, was dem Cluster helfen würde, seinen Anspruch darauf zu belegen.
# Welche Zeile genau das behebt — das erarbeitest du dir im Verlauf des Labs; die funktionierende
# Fassung liegt daneben, in passes.yaml, und es hat keinen Sinn, sie zu öffnen, bevor du es
# durchdacht hast.
#
# Hier gibt es nur ein Deployment, keinen Service: ein dauerhafter Name für den Dienst wird noch
# nicht gebraucht — wir erreichen sowieso keinen antwortenden Pod, da das Image nicht geladen wird.
#
# Angewendet auf deinem `lab`-Cluster, im Standard-Namespace:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f passes-broken.yaml
#     kubectl get pods -l app=passes-api -w
#
# ACHTUNG: HARBOR-HOST ist ein Platzhalter, keine funktionierende Adresse. Setze die Adresse
# deines eigenen Harbor ein, sonst bekommst du einen anderen Fehler als den, für den die Datei
# geschrieben wurde (es gibt zwei Zeilen mit dem Platzhalter):
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # macOS
#
# Im Objekt unten: apiVersion — die Version des Beschreibungsschemas, kind — was wir erstellen,
# metadata.name — der Name des Objekts. Weiter unten nicht mehr gesondert erklärt.
#
# Ein Deployment ist nicht «starte einen Container», sondern «halte so und so viele Kopien so
# eines Containers am Laufen». Verschwindet eine Kopie — der Cluster erstellt eine neue, ohne zu
# fragen.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Eine Kopie: um das Scheitern durchzuarbeiten, reicht eine, und in den Logs und in der Ausgabe
  # von kubectl describe gibt es weniger Rauschen.
  replicas: 1
  # Die Bedingung «meine Kopien sind Pods mit dem Label app: passes-api». Das Label im Pod-Muster
  # unten muss mit diesem übereinstimmen, sonst weist der Cluster das Manifest zurück.
  selector:
    matchLabels:
      app: passes-api
  # Das Muster, nach dem die Kopien gestanzt werden. Alles darin beschreibt einen einzelnen Pod.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Sicherheitsbeschränkungen für den gesamten Pod: nicht als root laufen, unter dem
      # unprivilegierten Benutzer 10001 arbeiten, den Satz an Systemaufrufen auf das Standardprofil
      # begrenzen. Das Image ist auf ebendies gebaut (siehe app/Dockerfile, die USER-Zeile).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Rechte auf Container-Ebene: sich keine zusätzlichen Privilegien holen und alle
          # besonderen Kernel-Berechtigungen abgeben. Die Anwendung braucht einen Netzwerk-Port,
          # der Rest ist überflüssig.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Der erste Teil des Image-Namens ist die Registry-Adresse. Genau deshalb ändert der
          # Umzug auf die eigene Registry die Manifeste: der Image-Name wird ein anderer. Ohne die
          # Adresse würde der Cluster das Image von Docker Hub holen — also von dort, wohin es die
          # Sicherheitsabteilung verboten hat.
          image: HARBOR-HOST/passes/passes-api:v1
          # Der Port der Anwendung. Der Name `http` wird weiter unten von der Readiness-Probe
          # verwendet, sodass die Portnummer an einer Stelle festgelegt ist, nicht an zweien.
          ports:
            - containerPort: 8080
              name: http
          # Umgebungsvariablen, aus denen die Anwendung erfährt, wer sie ist und woher sie kommt.
          # Genau diese gibt sie in ihrer Antwort aus (siehe app/main.go, die identity-Struktur).
          # APP_VERSION und IMAGE_REGISTRY sind als Text gesetzt — die schreiben wir selbst; die
          # nächsten drei füllt der Cluster selbst beim Start der Kopie aus, die Anwendung kann sie
          # nicht von anderswo kennen.
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — was für eine Kopie zu reservieren ist: nach diesen Zahlen wählt der
          # Scheduler einen Knoten. limits — die Obergrenze: bei Speicher über der Grenze wird der
          # Container getötet, bei CPU wird er gedrosselt. 16Mi reicht, weil die Anwendung in Go
          # ohne Abhängigkeiten geschrieben ist. 20m sind zwanzig Tausendstel eines CPU-Kerns.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Readiness-Probe: solange die Anwendung nicht auf /healthz antwortet, geht kein Traffic
          # an die Kopie. Heute kommt es nicht so weit — sie prüft einen bereits laufenden Prozess,
          # und bei uns bleibt ein früherer Schritt hängen, das Herunterladen des Images.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
