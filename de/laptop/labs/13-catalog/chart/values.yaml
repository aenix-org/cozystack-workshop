# Lab 13. Standardwerte für den Chart „Ausweise".
#
# Das sind die Antworten auf die Fragen, die der Chart beim Ausrollen stellt: wie viele Kopien,
# welcher Text auf der Seite steht, ob eine Adresse von außen nötig ist. Sie sind hier für den Fall
# „nichts wurde ausgewählt" festgehalten. Wer die Anwendung bestellt, überschreibt sie: im Dashboard
# über Formularfelder, im Terminal mit dem Schlüssel `--set replicas=5` oder einer eigenen Datei `helm install ... -f my.yaml`.
# Das Bearbeiten dieser Datei ändert die Standardwerte für künftige Bestellungen, nicht für bereits ausgerollte.
#
# Wie die Werte von hier zum Bestellformular im Dashboard werden:
#   Typ          — welches Feld angezeigt wird: {int} eine Zahl, {bool} ein Schalter,
#                {string} ein Texteingabefeld, {struct} eine verschachtelte Gruppe von Feldern;
#   Beschreibung — die Feldbeschriftung und der Hinweis darunter;
#   =Wert        — was bereits im Feld steht, wenn das Formular geöffnet wird;
#   Pflichtangabe — wird durch die Liste required im Schema festgelegt. Hier gibt es keine: jeder
#                Parameter hat einen Standardwert, daher kann jedes Feld übersprungen werden.
# Deshalb werden die Beschreibungen auf Englisch geschrieben: sie werden nicht nur vom Chart-Autor gelesen, sondern von jedem,
# der die Anwendung im Dashboard bestellt.

## Kommentare wie `## @param` sind keine Verzierung. Anhand von ihnen sammelt der Cozystack-Generator
## (cozyvalues-gen) die values.schema.json und die Parametertabelle in der README.
## Format: ## @param {Typ} Name=Standardwert - Beschreibung.

# Wie viele Kopien der Anwendung laufen sollen. Eine Kopie bedeutet Ausfallzeit, während
# ein Knoten neu startet; zwei überleben den Verlust einer der beiden.
## @param {int} replicas=2 - Number of application replicas.
replicas: 2

# Text auf der Hauptseite. Als Parameter herausgezogen, weil jede Tochtergesellschaft ihren eigenen hat,
# und niemand nur dafür ein separates Image baut.
## @param {string} greeting=Order a pass for your guest - Text shown on the main page.
greeting: "Order a pass for your guest"

# Ob die Anwendung eine Adresse außerhalb des Clusters braucht. Konvention des Cozystack-Katalogs:
# ein Feld namens external bedeutet bei allen Anwendungen dasselbe — externen Zugriff.
## @param {bool} external=false - Enable external access from outside the cluster.
external: false

# Größe einer einzelnen Kopie. Als separate Gruppe von Feldern herausgezogen, damit es im Bestellformular
# wie ein einziger Block „Ressourcen" aussieht und nicht wie zwei unverbundene Felder.
## @typedef {struct} Resources - CPU and memory for each replica.
## @field {quantity} cpu - CPU available to each replica.
## @field {quantity} memory - Memory (RAM) available to each replica.

## @param {Resources} resources - Explicit CPU and memory configuration.
resources:
  cpu: 100m
  memory: 128Mi
