# Labor 13. Steckbrief des Charts „Pässe".
#
# Ein Chart ist ein Ordner: Manifest-Vorlagen in templates/, Standardwerte in values.yaml
# und das Parameterschema in values.schema.json. Es wird mit dem Befehl
# `helm install <Release-Name> chart` aus dem Labor-Ordner ausgerollt, und im Cozystack-Katalog — von der
# Plattform selbst, wenn jemand eine Anwendung über das Dashboard bestellt.
#
# Chart.yaml ist das Deckblatt des Pakets: daraus erfährt Helm, wie das Paket heißt und welche Version es hat.
apiVersion: v2
name: guest-pass
description: Internal guest pass service — order a pass for a visitor
type: application

# Als Nächstes kommen zwei Versionen, und sie werden häufiger verwechselt als alles andere in Helm. Das sind verschiedene Dinge.
#
# version — die Verpackungsversion. Sie ändert sich, wenn Sie die Vorlagen, Werte oder das Schema bearbeiten,
# auch wenn die Anwendung darin gleich geblieben ist. Genau diese vergleicht Helm beim Aktualisieren eines
# Release, und an ihr unterscheiden sich die ins Repository hochgeladenen Pakete. Ohne sie zu erhöhen, geht die
# Plattform davon aus, dass sich das Paket nicht geändert hat, und die neue Version kann unbemerkt bleiben.
version: 0.1.0
# appVersion — die Version der Anwendung selbst innerhalb des Pakets, hier ist es nginx. Sie führt ihr eigenes
# Leben: die Anwendung kann zehnmal aktualisiert werden, ohne eine einzige Änderung an den Vorlagen, und umgekehrt —
# Sie haben die Vorlagen neu geschrieben, aber die Anwendung ist dieselbe. In Objektnamen taucht sie nicht auf, sie wird
# in der Ausgabe von `helm list` und in der Katalogkarte angezeigt.
appVersion: "1.0"
