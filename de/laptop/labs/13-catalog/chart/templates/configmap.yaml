# Lab 13. ConfigMap-Template: die Seite «Ausweise» und die nginx-Konfiguration.
#
# Eine ConfigMap speichert Textdateien und liefert sie an Pods aus. Die Seite liegt hier und nicht im
# Image, damit sich der Text ohne Neubau ändern lässt: der Wert greeting wird beim Rendern eingesetzt,
# und es genügt, das Release zu aktualisieren.
#
# Die Ersetzung funktioniert auch innerhalb von `|`-Blöcken: Helm behandelt die Template-Datei als reinen
# Text und weiß nichts über die YAML-Struktur. Mehr dazu in templates/deployment.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
# Die Schlüssel in data sind Dateinamen, und das, was unter `|` steht, ist deren gesamter Inhalt.
# Jeder Schlüssel wird als eigene Datei in den Container gemountet, siehe volumeMounts im Deployment.
data:
  # Die Seite, die ein Mitarbeiter sieht. Hier landen zwei Werte: greeting aus dem
  # Bestellformular und der Release-Name — damit an der geöffneten Seite erkennbar ist, wessen Bestellung es ist.
  index.html: |
    <!doctype html>
    <html lang="en">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Guest Pass</title>
    <style>
      body{background:#0d1117;color:#e6edf3;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:12vh 5vw;margin:0}
      h1{font-size:clamp(26px,6vw,56px);margin:0 0 .3em;color:#2f6fed}
      .pod{font-family:ui-monospace,Menlo,monospace;color:#7d8590;margin-top:3em}
    </style>
    <h1>{{ .Values.greeting }}</h1>
    <p>Guest Pass service, release <b>{{ .Release.Name }}</b></p>
    <div class="pod">served by __POD__</div>
    </html>
  # nginx-Konfiguration. sub_filter ersetzt die Markierung __POD__ beim Ausliefern der Seite durch den
  # Pod-Namen: so zeigt der Browser, welche der Kopien geantwortet hat. Eine separate Antwort auf /healthz
  # benötigt die readinessProbe aus dem Deployment — sie fragt genau diese Adresse ab.
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location / {
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
