---
# Lab 13. So wird die Bestellung Ihrer Anwendung aussehen, NACHDEM
# der Admin applicationdefinition.yaml angewendet hat. Anwenden in Ihrem Tenant:
#   kubectl apply -f guestpass-example.yaml
#
# ACHTUNG: tenant-workshopXX ist ein Platzhalter, kein Namespace-Name. Ersetzen Sie XX durch
# Ihre Tenant-Nummer vor dem Anwenden, sonst verweigert kubectl: einen solchen Namespace gibt es nicht,
# und in einen fremden werden Sie nicht gelassen.
#
# Beachten Sie: die Gruppe apps.cozystack.io ist dieselbe, die von Bucket,
# VMInstance und den übrigen Anwendungen des Katalogs verwendet wird. Ihre Anwendung reiht sich
# neben ihnen ein, nicht irgendwo an der Seite.
#
# Sie können diese Datei nicht anwenden, bevor der Admin die Definition registriert hat:
# kubectl antwortet `no matches for kind "GuestPass"`.
apiVersion: apps.cozystack.io/v1alpha1
kind: GuestPass
metadata:
  name: main
  namespace: tenant-workshopXX
# Die Felder in spec sind genau die Parameter, die in chart/values.yaml beschrieben und
# vom Bestellformular im Dashboard angezeigt werden. Hier sind sie als Text ausgeschrieben: dasselbe wie das Klicken
# der Schaltfläche im Dashboard, aber eine solche Datei kann man reviewen, in Git ablegen und zurückrollen.
spec:
  replicas: 2
  greeting: "Order a pass for your guest"
  external: false
  resources:
    cpu: 100m
    memory: 128Mi
