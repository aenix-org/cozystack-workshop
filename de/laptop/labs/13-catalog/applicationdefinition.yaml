---
# Lab 13. Anwendungsdefinition für den Cozystack-Katalog — genau der „Katalogeintrag".
#
# Für sich allein stellt dieses Objekt nichts bereit. Es verbindet drei Dinge: euer Chart
# (was bereitgestellt wird), einen neuen Objekttyp in der API (womit die Anwendung bestellt wird) und eine Karte
# im Dashboard (was ein Mensch dabei sieht). Solange es nicht existiert, bleibt das Chart ein Ordner
# mit Dateien, von dem die Plattform nichts weiß, und die Anwendungsliste neben Postgres und Redis ist leer.
#
# Wird mit einem einzigen Befehl angewendet, ohne Namespace:
#   kubectl apply -f applicationdefinition.yaml
#
# WICHTIG: dieses Objekt ist CLUSTER-SCOPED — es hat keinen Namespace, es gibt eines für den gesamten
# Cluster. Ein Tenant KANN es NICHT anwenden, das ist geprüft:
#   kubectl auth can-i create applicationdefinitions   ->   no
# Eure Arbeit endet, sobald die Datei geschrieben und lokal geprüft ist.
# Der Plattform-Admin wendet es an. Siehe README, Abschnitt „Wo eure
# Rechte enden".
apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: guest-pass
spec:
  # --- WIE DAS IN DER API AUSSIEHT ----------------------------------------------
  application:
    # Kind des neuen Objekttyps. Nach dem Anwenden erscheint im Cluster
    # kind: GuestPass, und ihr könnt damit mit gewöhnlichem kubectl arbeiten.
    kind: GuestPass
    plural: guestpasses
    singular: guestpass
    # Werteschema — dasselbe, das im Chart als Datei values.schema.json liegt,
    # nur in einer einzigen Zeile geschrieben. Anhand dessen weist die API ungültige
    # Werte ab, und das Dashboard zeichnet das Erstellungsformular.
    openAPISchema: |-
      {"title":"Chart Values","type":"object","properties":{"replicas":{"description":"Number of application replicas.","type":"integer","default":2},"greeting":{"description":"Text shown on the main page.","type":"string","default":"Order a pass for your guest"},"external":{"description":"Enable external access from outside the cluster.","type":"boolean","default":false},"resources":{"description":"Explicit CPU and memory configuration.","type":"object","default":{},"properties":{"cpu":{"description":"CPU available to each replica.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true},"memory":{"description":"Memory (RAM) available to each replica.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true}}}}}

  # --- WAS BEREITGESTELLT WIRD ----------------------------------------------------
  release:
    # Release-Name = Prefix + Objektname. Ein GuestPass-Objekt mit dem Namen `main`
    # wird als Release `guest-pass-main` bereitgestellt. Das Prefix ist verpflichtend und dient dazu,
    # dass Releases verschiedener Anwendungen nicht namentlich kollidieren.
    prefix: guest-pass-
    labels:
      # Mit demselben Schlüssel verteilt Cozystack Tenant-Releases auf Flux-Shards.
      # Ohne ihn gibt es niemanden, der das Release bedient.
      sharding.fluxcd.io/key: tenants
    chartRef:
      # Woher das Chart genommen wird. Zulässige Kinds: OCIRepository, HelmChart,
      # ExternalArtifact. Externe Kataloge kommen üblicherweise über
      # GitRepository -> HelmChart, und ihr Namespace ist cozy-public.
      kind: HelmChart
      name: cozystack-guest-pass
      namespace: cozy-public

  # --- WIE DAS IM DASHBOARD AUSSIEHT ------------------------------------------
  dashboard:
    # Katalog-Abschnitt. Verwendet werden: PaaS, IaaS, NaaS, Administration,
    # Networking — nehmt einen vorhandenen, erfindet keinen eigenen,
    # sonst landet die Anwendung in einem Abschnitt mit einem einzigen Eintrag.
    category: PaaS
    singular: Guest Pass
    plural: Guest Passes
    description: Internal guest pass service for employees and reception
    tags:
      - internal
      - web
    # Icon — SVG in base64. Genau base64, kein Pfad und keine URL: das Dashboard
    # geht nirgendwohin, um etwas herunterzuladen. Die Quelle liegt daneben in icon.svg.
    icon: 
    # Feldreihenfolge in der YAML-Darstellung des Objekts. Kosmetik, aber ohne sie
    # ordnen sich die Felder willkürlich an und das Formular liest sich schlechter.
    keysOrder: [["apiVersion"], ["kind"], ["metadata"], ["metadata", "name"], ["spec", "replicas"], ["spec", "greeting"], ["spec", "external"], ["spec", "resources"]]
