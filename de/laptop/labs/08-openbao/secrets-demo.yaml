# Lab 8 · Schritt 3 von 3: es gibt kein Passwort im Manifest — weder im Klartext noch in base64.
# Die finale Variante. Diese Datei kann in Git committet, einem Auftragnehmer gezeigt und
# auf ein T-Shirt gedruckt werden.
#
# Wie sich dieser Schritt vom zweiten unterscheidet: dort wurde der Wert dennoch aufgeschrieben — in einer Datei
# und dann in einem Cluster-Objekt. Hier steht er in der Beschreibung überhaupt nicht; die Anwendung holt
# das Passwort selbst, beim Start, aus dem OpenBao-Speicher.
#
#   secrets-demo-naive.yaml      jeder, der die Datei öffnet, sieht das Passwort
#   secrets-demo-secret.yaml     das Passwort ist in ein Secret-Objekt ausgelagert
#   secrets-demo.yaml         <- Sie sind hier: das Passwort kommt beim Start aus dem Speicher
#
# VOR DEM ANWENDEN: ersetzen Sie tenant-workshopXX durch Ihren Namespace — er ist Teil der Speicher-
# Adresse unten. XX ist ein Platzhalter, kein Teil des Namens.
# Wo es angewendet wird: Ihr `lab`-Cluster (export KUBECONFIG=~/lab.kubeconfig).
# Befehl: kubectl apply -f secrets-demo.yaml
#
# Das Token, mit dem sich die Anwendung gegenüber dem Speicher ausweist, liegt im Secret passes-bao-token.
# Sie erstellen es mit einem Befehl, nicht mit einer Datei: dieses Manifest enthält nur den Objektnamen,
# und ein Name ist kein Geheimnis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # Alles läuft als non-root. fsGroup wird benötigt, weil es hier zwei Container gibt: einer
      # schreibt die Datei mit dem Passwort, der andere liest sie. Ohne eine gemeinsame Gruppe würde der Init-Container
      # eine Datei schreiben, die der Haupt-Container nicht öffnen kann, und Sie würden eine halbe Stunde damit verbringen herauszufinden,
      # wo Sie sich geirrt haben.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Ein Ort, an dem ein Container das Passwort ablegt und der andere es liest.
      # medium: Memory bedeutet, dass diese „Festplatte" im RAM des Knotens liegt
      # und niemals auf eine echte Festplatte gelangt: nicht in ein Backup, nicht in einen Volume-Dump, nicht zu dem,
      # der die Festplatte aus dem Server nimmt. Der Pod ist weg — und damit auch sein Inhalt.
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      # Der Init-Container läuft VOR dem Haupt-Container und muss erfolgreich beenden.
      # Wenn er das Passwort nicht holen kann, startet die Anwendung gar nicht, und das ist das richtige
      # Verhalten: ein Dienst ohne Datenbankpasswort ist ohnehin unbrauchbar, es ist ehrlicher nicht hochzukommen
      # als hochzukommen und Fehler ins Log zu spucken.
      initContainers:
        - name: fetch-secret
          # Wir nehmen das OpenBao-Image selbst um eines einzigen Werkzeugs willen, `bao` — seines Clients.
          # Es ist nicht nötig, eigenen Code zu schreiben.
          image: openbao/openbao:2.5.1
          # bao kv get -field=password — ein Feld über einen Pfad holen, nicht das ganze
          # Secret. tr -d '\n' entfernt den Zeilenumbruch, der sonst innerhalb des
          # Passworts landen würde: ein zusätzliches Zeichen am Ende wird von der Datenbank abgelehnt, und das aufzuspüren ist unangenehm.
          # chmod 0400 — nur der Eigentümer kann die Datei lesen.
          # set -e stoppt das Skript beim allerersten Fehler: sonst würde der Container erfolgreich
          # mit einer leeren Datei beenden, und Sie müssten es in der Anwendung aufklären.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              bao kv get -field=password secret/passes/db \
                | tr -d '\n' > /secrets/db_password
              chmod 0400 /secrets/db_password
              echo "Passwort aus OpenBao geholt, im Manifest steht es nicht"
          # Die Speicheradresse und das Token, mit dem die Anwendung ihr Leserecht nachweist.
          # Das Token kommt per Referenz auf ein mit einem Befehl erstelltes Objekt; es landet nicht hier, in der Datei.
          # In der Adresse ist tenant-workshopXX derselbe Platzhalter, der ersetzt werden muss.
          env:
            - name: BAO_ADDR
              value: http://openbao-secrets.tenant-workshopXX.svc.cozy.local:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: passes-bao-token
                  key: token
          # Der gemeinsame Ordner. Dieser Container hat Schreibzugriff darauf — er schreibt hinein.
          volumeMounts:
            - name: secrets
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Die Limits sind höher als beim Haupt-Container: das OpenBao-Werkzeug ist schwerer als busybox,
          # aber es lebt nur wenige Sekunden, also sind das keine dauerhaften Kosten.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      # Der Haupt-Container startet erst, nachdem der Init-Container beendet hat.
      containers:
        - name: app
          image: busybox:1.36
          # Dieselbe Schleife wie in den vorherigen Schritten, aber das Passwort steht jetzt nicht in einer Umgebungs-
          # variable, sondern in einer Datei: der Fingerabdruck wird direkt aus /secrets/db_password gelesen.
          # Umgebungsvariablen sind in der Ausgabe von kubectl describe pod sichtbar und landen in Prozess-
          # dumps; eine Datei im Speicher des Pods nicht.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s verbinde mit %s als %s, Passwort-Fingerabdruck sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(sha256sum /secrets/db_password | cut -c1-12)"
                sleep 10
              done
          # Hier bleiben nur die nicht-geheimen Einstellungen — die Adresse und der Login.
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
          # Derselbe Ordner, aber nur lesbar: die Anwendung kann das Passwort nicht verderben oder ersetzen,
          # selbst wenn sie es wirklich wollte.
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
