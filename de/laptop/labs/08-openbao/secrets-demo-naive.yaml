# Lab 8 · Stufe 1 von 3: das Passwort liegt im Klartext im Manifest.
# So sieht der Dienst „Propusk" heute aus — und genau diese Datei hat das Audit gefunden.
# Wir wenden sie genau einmal an, um das Problem mit eigenen Augen zu sehen.
#
# Die drei Stufen der Lab, damit ihr euch nicht verliert:
#   secrets-demo-naive.yaml   <- ihr seid hier: jeder, der die Datei öffnet, sieht das Passwort
#   secrets-demo-secret.yaml     das Passwort ist in ein separates Secret-Objekt ausgelagert
#   secrets-demo.yaml            das Passwort steht überhaupt nicht im Manifest
#
# Wo es angewendet wird: euer `lab`-Cluster (export KUBECONFIG=~/lab.kubeconfig).
# Befehl: kubectl apply -f secrets-demo-naive.yaml
#
# Das Passwort in dieser Datei ist zu Lehrzwecken erfunden, echte gibt es hier nicht. Ein einziges Objekt —
# Deployment; apiVersion, kind und metadata.name werden weiter nicht kommentiert.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # Eine Kopie reicht: uns interessiert nicht die Ausfallsicherheit, sondern,
  # woher die Anwendung das Passwort bezieht.
  replicas: 1
  # An diesem Label erkennt das Deployment seine Pods. Es stimmt mit dem Label im template unten überein.
  selector:
    matchLabels:
      app: secrets-demo
  # template — die Pod-Vorlage: woraus eine Kopie zusammengebaut wird.
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # Sicherheitsanforderungen: nicht als root, ein eingeschränkter Satz an Systemaufrufen.
      # Beachtet den Widerspruch: der Pod ist nach allen Sicherheitsregeln konfiguriert, und das hindert
      # das Passwort in keiner Weise daran, zehn Zeilen weiter unten in der Datei zu liegen.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Eine echte Anwendung gibt es hier nicht — busybox und ein paar Zeilen Shell.
          # Für diese Lab zählt nur eines: woher das Passwort kommt, nicht was danach damit
          # gemacht wird.
          image: busybox:1.36
          env:
            # Die Datenbankadresse und der Benutzername sind keine Geheimnisse: zu wissen, dass die
            # Datenbank passes-db heißt, gewährt für sich genommen keinen Zugriff.
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # DAS IST DIE ZEILE, DIE DAS AUDIT GEFUNDEN HAT.
            # Die Datei liegt in Git, das heißt, das Passwort kennt jeder, der Zugriff
            # auf das Repository hat, und jeder, der es jemals geklont hat.
            - name: DB_PASSWORD
              value: "Propusk2019!"
          # Eine Endlosschleife: alle zehn Sekunden gibt sie eine Zeile ins Log aus. Ins Log geht nicht das
          # Passwort selbst, sondern sein sha256-Fingerabdruck — die ersten zwölf Zeichen. Am Fingerabdruck
          # sieht man, dass sich das Passwort geändert hat, aber man kann seinen Wert daraus nicht rekonstruieren.
          # In echten Diensten werden Logs genau so geschrieben.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          # Der Verbrauch ist winzig: das ist eine Demonstration, keine Last.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
