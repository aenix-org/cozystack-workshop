# Ersetzen Sie vor dem Anwenden tenant-workshopXX durch Ihren eigenen Namespace.
# Einfacher auf einmal über alle Dateien: siehe README, Abschnitt zum Ersetzen der Nummer.
#
apiVersion: apps.cozystack.io/v1alpha1
kind: Postgres
metadata:
  name: db
  namespace: tenant-workshopXX
spec:
  replicas: 1
  size: 10Gi
  storageClass: local
  resourcesPreset: t1.micro
  users:
    orders:
      password: Orders2019!
  databases:
    orders:
      roles:
        admin: [ orders ]
---
apiVersion: apps.cozystack.io/v1alpha1
kind: Kafka
metadata:
  name: kafka
  namespace: tenant-workshopXX
spec:
  kafka:
    replicas: 1
    size: 10Gi
    storageClass: local
    resourcesPreset: c1.small
  zookeeper:
    replicas: 1
    size: 5Gi
    storageClass: local
    resourcesPreset: c1.small
  topics:
    - name: orders
      partitions: 1
      replicas: 1
      config: {}