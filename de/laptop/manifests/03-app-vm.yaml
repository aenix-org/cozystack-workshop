# Ersetzen Sie tenant-workshopXX vor dem Anwenden durch Ihren eigenen Namespace.
# Einfacher auf einmal über alle Dateien: siehe README, Abschnitt zum Ersetzen der Nummer.
# Und noch etwas: Fügen Sie im Feld url unten den presigned-Link aus convert.sh ein (Schritt 2).
#
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  source:
    http:
      url: "ВСТАВЬТЕ_PRESIGNED_URL"  # aus convert.sh (Zeile Share:)
  storage: 10Gi
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  instanceType: u1.medium
  instanceProfile: centos.7
  runStrategy: Always
  disks:
    - name: app-1
# Zugriff auf die Anwendung von außen erfolgt über `virtctl port-forward` (siehe README).
# external LoadBalancer funktioniert auf diesem Stand (Cilium + robotlb) für VMs nicht,
# daher aktivieren wir external hier NICHT.
