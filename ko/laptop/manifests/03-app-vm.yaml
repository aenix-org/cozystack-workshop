# 적용하기 전에 tenant-workshopXX를 자신의 namespace로 바꾸세요.
# 모든 파일에서 한 번에 바꾸는 것이 더 쉽습니다: README의 번호 치환 섹션을 참고하세요.
# 그리고: 아래 url 필드에 convert.sh(2단계)에서 나온 presigned 링크를 넣으세요.
#
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  source:
    http:
      url: "ВСТАВЬТЕ_PRESIGNED_URL"  # convert.sh에서 (Share: 줄)
  storage: 10Gi
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  instanceType: u1.medium
  instanceProfile: centos.7
  runStrategy: Always
  disks:
    - name: app-1
# 앱에 대한 외부 접근은 `virtctl port-forward`를 통해 이루어집니다 (README 참고).
# 이 스탠드(Cilium + robotlb)에서 external LoadBalancer는 VM에 대해 동작하지 않으므로,
# 여기서는 external을 켜지 않습니다.
