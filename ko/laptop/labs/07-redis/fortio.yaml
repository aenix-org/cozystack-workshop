---
# 랩 7 · 웹 UI가 있는 부하 생성기.
# 스케일링 랩에서 쓴 것과 동일합니다: 브라우저에서 버튼으로 부하를 시작하고,
# 지연 시간 히스토그램을 바로 그 자리에서 볼 수 있습니다. 이미 배포되어 있다면 이
# 파일을 적용할 필요가 없으며, kubectl은 «unchanged»라고 답합니다.
#
# 적용되는 곳: 여러분의 `lab` 클러스터 (export KUBECONFIG=~/lab.kubeconfig).
# 명령: kubectl apply -f fortio.yaml
#
# `---`로 구분된 두 개의 객체: Deployment(생성기 자체)와 Service(그것에 도달하는
# 이름). apiVersion, kind, metadata.name은 이후로 주석을 달지 않습니다.
#
# 이미지는 여러분의 Harbor가 아니라 공개 Docker Hub에서 가져옵니다: Fortio는 «Пропуск»
# 서비스의 일부가 아니라, 클러스터에 임시로 사는 측정 도구입니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # 복제본 하나. 부하 생성기는 스케일링할 필요가 없습니다 — 하나가 지연 시간을
  # 정직하게 세도록 하는 것이 필요합니다. 두 개의 복제본은 합쳐지지 않은 두 개의 히스토그램을 줍니다.
  replicas: 1
  # Deployment가 자신의 파드를 인식하는 레이블. 아래 template의 레이블과 일치합니다.
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # 나머지 모든 것과 동일한 보안 요구사항: 프로세스는 root로 실행되지 않고,
      # 시스템 호출은 seccomp 프로파일로 제한됩니다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 여기서 `latest` 태그는 워크숍용 단순화이며, 자체 레지스트리에 관한 랩이
          # 가르치는 것과 모순됩니다: 이 태그의 이미지는 두 번의 apply 사이에 조용히
          # 바뀔 수 있고, 어제의 측정값은 재현 불가능해집니다. 학습용 스탠드의 부하
          # 생성기에는 허용되지만, 운영 시스템에는 그렇지 않습니다.
          image: fortio/fortio:latest
          # `server`는 Fortio가 웹 인터페이스를 띄우고 여러분이 버튼을 누를 때까지
          # 기다리는 모드입니다. 이 인자가 없으면 이미지는 일회성 명령을 실행하고 종료합니다.
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # 생성기는 CPU 여유가 필요합니다. 그렇지 않으면 스스로 병목이 되어
              # 애플리케이션이 아니라 Fortio에 부하를 주게 됩니다.
              cpu: "1"
              memory: 256Mi
---
# 웹 인터페이스를 열려면 Service가 필요합니다: 생성기에 이름으로 도달하려면
# 포트 포워딩 — kubectl port-forward svc/fortio 8081:8080 — 을 통해
# localhost:8081로 접속합니다. Service 없이도 kubectl exec deploy/fortio 명령으로
# 서비스를 두드릴 수 있지만, 브라우저에서 히스토그램을 주는 것은 이 경로뿐입니다.
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  # 여기서는 Service 번호와 컨테이너 포트가 일치합니다 — 밖은 80, 안은 8080인
  # 랩의 다른 서비스들과 달리. 차이는 편의성뿐입니다.
  ports:
    - port: 8080
      targetPort: http
