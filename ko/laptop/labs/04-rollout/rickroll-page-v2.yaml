---
# 랩 4. 페이지의 두 번째 버전 — 부하 상태에서 롤아웃하는 대상입니다.
# 눈에 띄게 달라야 합니다: 참가자는 diff가 아니라 브라우저를 봅니다.
#
# 단일 오브젝트. 관리 클러스터의 테넌트가 아니라 여러분의 학습 클러스터 `lab`에
# 적용합니다:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll-page-v2.yaml
# 여기에는 tenant-workshopXX 같은 플레이스홀더가 없습니다 — 어디에도 자기 번호를 넣을 필요가 없습니다.
#
# 여기서 사람들이 주로 걸려 넘어지는 점: 이 apply 자체는 아무것도 롤아웃하지 않습니다.
# 첫 번째 것 옆에 설정 파일을 하나 더 클러스터에 넣을 뿐입니다. Deployment의 `page` 볼륨이
# rickroll-page-v1을 참조하는 한, 사용자에게는 첫 번째 버전이 보입니다.
# 롤아웃은 랩의 다음 단계가 됩니다 — 볼륨을 이 ConfigMap으로 전환하는 것.
# 그래서 두 오브젝트로 구성하는 것입니다: 첫 번째 버전은 클러스터에 손대지 않은 채
# 남아 있고, 롤백은 기억에 의존해 복원하는 것이 아니라 그것을 통째로 되돌립니다.
#
# 대신 rickroll-page-v1 ConfigMap을 제자리에서 수정한다면 롤백할 곳이
# 없어지고, 파드는 사본 교체 없이, 그리고 리비전 히스토리에 기록 없이
# 새 내용을 받게 됩니다 — 즉 이 랩을 하는 이유 전부가 없어집니다.
#
# 오브젝트 이름은 변경하면 안 됩니다: rickroll-page-v2는 README의 패치와
# check.sh의 검사에서 참조됩니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v2
data:
  # `|` 뒤의 들여쓰기 아래에 있는 모든 것은 컨테이너 안에 들어가게 될 index.html 파일의
  # 그대로의 내용입니다. 이것은 더 이상 YAML이 아닙니다: 여기에는 주석이 없고
  # 있을 수도 없습니다, 해시 기호는 페이지에 일반 텍스트로 나타나게 됩니다.
  #
  # 마크업에서 check.sh가 보는 두 가지가 중요합니다: 캡션 «버전 2» —
  # 이것으로 검사가 두 번째 버전을 첫 번째와 구별하고, 플레이스홀더 __POD__ —
  # 이것은 rickroll-conf ConfigMap(랩 1)의 규칙에 따라 nginx 파드 이름으로 치환됩니다.
  # 둘 중 하나라도 제거하면 롤아웃은 성공하더라도 랩 검사는 통과하지 못합니다.
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>We're No Strangers To Love</title>
    <style>
      body{background:#07131a;color:#e8f6ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      .tag{display:inline-block;margin-bottom:1.5em;padding:.35em 1em;border-radius:999px;
           background:#00e0ff;color:#052; font-weight:700;letter-spacing:.08em;font-size:13px}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#00ffa3,#00e0ff,#7a5cff,#00ffa3);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#7f96a3;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#5d7380}
      .pod b{display:block;margin-top:.4em;color:#00ffa3;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#3f5561;font-size:14px}
    </style>
    <div class="tag">버전 2</div>
    <h1>We're No Strangers To Love</h1>
    <p class="lyr">You know the rules &middot; And so do I</p>
    <div class="pod">요청을 처리한 Pod<b>__POD__</b></div>
    <p class="hint">롤아웃은 부하 상태에서 진행되었습니다. Fortio를 확인해 보세요: 오류 0건.</p>
    </html>
