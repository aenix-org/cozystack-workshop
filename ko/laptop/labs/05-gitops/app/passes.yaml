---
# 랩 5 · Git 안의 인프라. 「출입증(출입증)」 서비스 자체: 한 파일에 담긴 네 개의 오브젝트.
#
# 클러스터에 손으로 적용하지 않는다. 이 파일은 GitHub의 전용 리포지토리, apps/ 폴더 안에
# namespace.yaml 옆에 놓이고, `lab` 클러스터로는 Flux가 알아서 옮겨 준다:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# --- 줄은 오브젝트를 구분한다: 한 파일, 네 개의 독립적인 오브젝트. 파일 안의 순서는
# 생성 순서에 영향을 주지 않는다 — 클러스터가 알아서 정리한다.
#
# 각 오브젝트에서: apiVersion — 기술 스키마의 버전, kind — 무엇을 만드는지,
# metadata.name — 오브젝트의 이름, metadata.namespace — 클러스터의 어느 칸에서
# 사는지. 이 필드들은 이후에 따로 설명하지 않는다.
#
# 네 오브젝트 중 어느 것에도 비밀번호도, 키도, 토큰도 없다. 이것은 우연이
# 아니다: Git에 한번 들어간 것은 거기에 영원히 남는다 — 히스토리는 다시 쓸 수 있어도,
# 이미 클론한 모든 사람에게 옛 사본은 남는다. 시크릿이 있을 자리가 아니다.

# --- 4개 중 1. 웹 서버 설정 --------------------------------------------------
# ConfigMap은 애플리케이션과 별도로 텍스트 파일을 클러스터에 넣고, 아래(volumes
# 섹션)에서 이 파일을 컨테이너 안에 끼워 넣는다. 목적은 이미지를 다시 빌드하지 않고
# 설정을 바꾸는 것: 여기서 고치고, 커밋하면, 1분 뒤 클러스터에 새 버전이 생긴다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-conf
  namespace: passes
# data 안의 키는 컨테이너 안의 파일 이름이 된다: default.conf는 nginx가 시작 시
# 읽는 폴더에 놓인다. 이름 뒤의 세로 막대는 YAML에서 여러 줄 텍스트를 줄바꿈을
# 유지한 채 그대로 적는 방법이다.
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      # 준비 상태 확인용 주소. 클러스터는 여기를 두드리고, 응답을 받기 전까지
      # 사본으로 트래픽을 보내지 않는다.
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        # 내보내는 페이지에서 __POD__를 nginx가 동작하는 머신 이름으로 바꾼다.
        # 파드 안에서 머신 이름은 파드 자신의 이름이다.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
    }
---
# --- 4개 중 2. 서비스가 내보내는 페이지 ----------------------------------------
# 이 랩에서 페이지는 스텁이다: 진짜 애플리케이션은 나중에 등장한다. 지금 중요한 것은
# 서비스가 무엇을 보여 주는가가 아니라, 클러스터에 어디서 왔는가다. 마크업 안의 __POD__ 텍스트는
# 치환용 표식이다: nginx가 이를 페이지를 내보낸 파드의 이름으로 바꾸고, 그 이름으로
# 나중에 사본이 하나보다 많아졌음을 보게 된다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-page
  namespace: passes
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>출입증</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 40rem;
               color: #222; }
        h1 { font-weight: 600; }
        .v { display: inline-block; padding: .2rem .6rem; border-radius: .3rem;
             background: #eef; font-family: ui-monospace, monospace; }
        .pod { margin-top: 2rem; color: #666; font-size: .9rem; }
        b { font-family: ui-monospace, monospace; color: #222; }
      </style>
    </head>
    <body>
      <h1>출입증 서비스</h1>
      <p>방문객 출입증 신청. 버전 <span class="v">v1</span></p>
      <p>Git에서 배포됨. 아무도 손으로 건드리지 않았다.</p>
      <div class="pod">요청을 처리한 Pod <b>__POD__</b></div>
    </body>
    </html>
---
# --- 4개 중 3. 애플리케이션 자체의 기술(記述) ---------------------------------------
# Deployment는 「컨테이너를 실행하라」가 아니라 「이런 컨테이너의 사본을 몇 개 실행된 채로
# 유지하라」다. 차이는 사본이 죽을 때 드러난다: 클러스터가 묻지도 알리지도 않고 새 것을
# 만든다. vSphere에서 가장 가까운 것은 HA이지만, 거기서는 머신이 재시작되고,
# 여기서는 애플리케이션의 사본이 다시 만들어지며, 이것은 장애 때만이 아니라 늘 이뤄진다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes
  namespace: passes
  labels:
    app: passes
spec:
  # 실행된 채로 유지할 사본의 수. 표현이 중요하다: 「하나를 실행하라」가 아니라
  # 「하나를 유지하라」다. 이 숫자를 Git으로 바꾸고 무슨 일이 일어나는지 보게 된다.
  replicas: 1
  # Deployment가 어떤 기준으로 자기 사본을 알아보는가. 이것은 파드 이름의 목록이 아니라 —
  # 이름은 다시 만들 때마다 바뀐다 — 「app: passes 레이블을 가진 모든 파드」라는 조건이다.
  # 아래 template.metadata.labels의 레이블은 이 조건과 일치해야 한다: 어긋나면
  # 클러스터는 매니페스트 수용을 거부한다, 사본이 주인 없는 것이 되기 때문이다.
  selector:
    matchLabels:
      app: passes
  # template — 사본이 찍혀 나오는 본. 그 안의 모든 것이 파드 하나를 기술한다.
  # 본을 고치는 것은 새 버전 출시를 뜻한다: 옛 사본이 새 것으로 교체된다.
  template:
    metadata:
      labels:
        app: passes
    spec:
      # 파드 전체 수준의 보안 제약. vSphere에는 대응물이 없다: 거기서는 격리를
      # 하이퍼바이저가 주지만, 컨테이너는 노드와 커널을 공유하므로 권한을
      # 명시적으로 잘라 내야 한다.
      #   runAsNonRoot   이미지가 root로 동작하려 하면 실행하지 않는다
      #   runAsUser      어떤 숫자 사용자로 동작할지; 65532 — 최소 이미지에서
      #                  통용되는 「비특권」 식별자
      #   seccompProfile 어떤 시스템 호출이 허용되는지; RuntimeDefault — 명백히
      #                  위험한 것을 잘라 내면서 아무것도 망가뜨리지 않는 집합
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # 같은 제약이지만, 이제는 특정 컨테이너에 대한 것.
          #   allowPrivilegeEscalation: false  프로세스가 스스로 권한을 더 얻지 못한다
          #   capabilities.drop: ["ALL"]       모든 특별한 커널 권한을 빼앗는다
          #                                    (네트워크 변경, 마운트, 시간 변경);
          #                                    웹 서버에는 그중 하나도 필요 없다
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 이미지는 공개 레지스트리에서 가져온다 — 다음 랩에서 보안팀이 이를 금지하고,
          # 주소는 자체 Harbor로 바뀐다. unprivileged 변형은 멋 때문에 고른 것이 아니다:
          # 일반 nginx 이미지는 80 포트를 리슨하며 그 때문에 root 권한을 원하는데, 위의
          # runAsNonRoot로는 아예 시작조차 못 했을 것이다.
          # 버전은 고정되어 있다(1.27-alpine), latest가 아니다: 안 그러면 같은
          # 매니페스트가 내일 다른 애플리케이션을 배포하고, 당신은 그것을 모를 것이다.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # 애플리케이션이 리슨하는 포트. 이름 `http`는 장식이 아니다: 아래의 준비 상태
          # 확인과 파일 끝의 Service가 이를 참조한다. 포트 번호를 바꾸면 세 군데가 아니라
          # 한 군데만 바꾸면 된다.
          ports:
            - containerPort: 8080
              name: http
          # requests — 확실히 예약해 둘 리소스의 양; 이 숫자로 스케줄러가 노드를 고른다.
          # limits — 그 위로는 허용하지 않는 상한. requests를 낮게 잡으면 노드가 감당할 수
          # 있는 것보다 많이 올라간다; 메모리 limits 초과 시 — 컨테이너를 죽이고, CPU 초과 시 —
          # 속도를 늦춘다. 20m = 코어의 1000분의 20, Mi = 메가바이트. 여기 값이 작은 것은
          # 랩의 노드가 하나뿐이고 크지 않기 때문이다.
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # 준비 상태 확인: 클러스터는 이 주소를 두드리고, 응답을 받기 전까지 사본으로
          # 트래픽을 보내지 않는다. 이것이 없으면 Service는 아직 뜨지 않은 nginx로 요청을
          # 보내고, 사용자는 출시마다 오류를 보게 된다. 이것을 Flux도 기다린다 —
          # kustomization.yaml에서 우리가 wait: true를 요청했다.
          #   initialDelaySeconds  첫 두드림 전에 대기, 프로세스가 시작할 시간을 준다
          #   periodSeconds        이후 얼마나 자주 두드릴지
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # 파일 시작부의 두 ConfigMap 내용을 컨테이너 안 어디에 끼워 넣을지.
          # /etc/nginx/conf.d — nginx가 시작 시 설정을 읽는 폴더,
          # /usr/share/nginx/html — nginx가 파일을 내보내는 폴더.
          # 이때 이미지 자체는 바뀌지 않는다: 파일은 실행되는 순간 그 안에 나타난다.
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: page
              mountPath: /usr/share/nginx/html
      # 정확히 무엇을 끼워 넣을지. 이름 conf와 page는 내부용으로, 이 블록을 위의
      # volumeMounts와 연결한다; configMap 안의 name은 이미 클러스터 안 실제 오브젝트의
      # 이름이다. 이를 틀리면 파드는 존재하지 않는 ConfigMap을 기다리며 매달려 있게 된다.
      volumes:
        - name: conf
          configMap:
            name: passes-conf
        - name: page
          configMap:
            name: passes-page
---
# --- 4개 중 4. 모든 사본이 뒤에 서 있는 영구적인 이름 -----------------------------
# 파드는 다시 만들어지고, 그 주소는 매번 새롭다. Service는 변하지 않는 이름을 준다 —
# passes.passes.svc.cluster.local — 이 이름으로 클러스터 안에서는 언제나 살아 있는 사본에
# 닿을 수 있다. 이것은 내부 부하 분산이고, 클러스터 밖에서는 아직 여기에 닿지 못한다.
apiVersion: v1
kind: Service
metadata:
  name: passes
  namespace: passes
spec:
  # Service와 파드의 연결은 주소 목록이 아니라 「app: passes 레이블을 가진 모든 파드」라는 조건이다.
  # 그런 레이블을 가진 새 사본이 나타나면 — 스스로 부하 분산 대상이 되고, 아무것도
  # 등록할 필요가 없다. 사라지면 — 출력에서 제외된다.
  selector:
    app: passes
  # port — Service 자신이 어떤 포트로 응답하는지, targetPort — 컨테이너 안 어디로
  # 전달하는지. 여기서 targetPort는 위 ports 블록의 `http` 이름을 참조하고,
  # 번호가 아니다: 번호는 한 군데서 바꿀 수 있고, 연결은 끊기지 않는다.
  ports:
    - port: 80
      targetPort: http
