---
# 랩 5 · Git으로 관리하는 인프라. 「출입증(Пропуск)」 서비스를 위한 네임스페이스.
#
# 이 파일은 손으로 직접 클러스터에 적용하지 않습니다. 여러분은 이 파일을 GitHub의 자기
# 저장소, apps/ 폴더에 넣어 두기만 하고, `lab` 클러스터로는 Flux가 스스로, 정해진 일정에 따라 옮깁니다:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# 모든 매니페스트를 읽는 방법: apiVersion — 기술(記述) 스키마의 버전(클러스터는 이걸 보고
# 객체를 어떻게 해석할지 압니다), kind — 무엇을 만드는지, metadata.name — 나중에 객체를
# 찾을 때 쓰는 이름. 이 세 필드는 모든 객체에 들어 있으며, 아래에서 따로 설명하지 않습니다.
#
# 네임스페이스(namespace)는 하나의 클러스터 안을 나누는 논리적 칸막이입니다:
# 자기만의 이름 범위, 자기만의 권한, 자기만의 쿼터를 가집니다. vSphere에서 가장 가까운 것은
# vCenter 트리의 폴더나 리소스 풀입니다.
#
# 왜 이것을 손으로 만들지 않고 애플리케이션과 함께 Git에 두는가: 서비스가 저장소에서
# 빠지면 Flux가 네임스페이스도 함께 지웁니다. 반년 뒤에 왜 만들었는지 아무도 기억하지 못하는
# 빈 칸막이가 남지 않습니다.
apiVersion: v1
kind: Namespace
metadata:
  name: passes
  # 이 레이블은 서비스의 동작에 영향을 주지 않습니다 — 「출입증」에 관련된 모든 것을 한 번의
  # 명령으로 찾기 위해 필요합니다: kubectl get all -A -l app.kubernetes.io/part-of=passes.
  # part-of라는 이름은 우리가 지어낸 것이 아니라 널리 통용되는 Kubernetes 레이블 집합에서 가져온 것입니다:
  # 외부 도구(모니터링, 데이터 추출)는 바로 이 이름을 찾습니다.
  labels:
    app.kubernetes.io/part-of: passes
