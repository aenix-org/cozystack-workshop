---
# 랩 5 · Git 안의 인프라. 과제: 저장소에서 정확히 무엇을 클러스터에 적용할지.
#
# 옆에 있는 gitrepository.yaml과 함께 여러분의 `lab` 클러스터에 적용됩니다:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# 각 객체에서: apiVersion — 설명 스키마의 버전, kind — 무엇을 만드는지,
# metadata.name — 객체의 이름. 아래에서는 따로 설명하지 않습니다.
#
# 역할 분담: GitRepository는 저장소를 내려받기만 하고 아무것도 적용하지 않으며,
# 이 객체는 내려받은 것을 가져와 클러스터를 거기에 맞춥니다. Kustomization이라는 이름은
# kustomize 유틸리티의 이름과 같지만 서로 다른 것입니다 — 여기서는 클러스터 안의 객체입니다.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passes
  # Flux 서비스와 같은 곳에 있습니다 — 그렇지 않으면 kustomize-controller가 이를 인식하지 못합니다.
  namespace: flux-system
spec:
  # 클러스터의 실제 상태를 Git에 기술된 상태와 얼마나 자주 대조할지.
  # 이것은 «1분에 한 번 다시 적용»이 아니라 «1분에 한 번 비교하고
  # 차이를 바로잡는다»입니다. Git에서 아무것도 바뀌지 않았더라도, kubectl edit로
  # 손으로 직접 한 수정은 조용히 되돌려집니다. 그 차이는 랩을 조금 더 진행하여
  # Git을 거치지 않고 클러스터에서 직접 무언가를 바꿀 때 여러분이 직접 보게 됩니다.
  interval: 1m
  # 저장소 안의 폴더. 그 안에 있는 모든 것이 클러스터에 반영됩니다; 그 옆에 있는 파일들
  # — 예를 들어 루트의 README.md — 은 건드리지 않습니다. `apps`라는 이름은 우리가 정했지만,
  # 여러분의 저장소에서 매니페스트를 넣는 폴더와 일치해야 합니다.
  path: ./apps
  # Git에서 사라진 객체를 클러스터에서 삭제합니다.
  # 이것이 없으면 Git이 완전한 기술이 아니게 됩니다: 저장소에서 삭제된 것이
  # 클러스터에서 계속 동작하고, 아무도 그것을 알지 못하게 됩니다.
  prune: true
  # 어떤 소스를 볼지. `passes`라는 이름은 gitrepository.yaml의 metadata.name이며,
  # GitHub의 저장소 이름이 아닙니다. 거기서 이름을 바꾸면 여기서도 고치세요, 그러지 않으면 Flux는
  # 존재하지 않는 소스를 기다리고, Kustomization은 준비 상태가 되지 않습니다.
  sourceRef:
    kind: GitRepository
    name: passes
  # apply 직후 바로 보고하지 않고, 적용된 것이 준비될 때까지 기다립니다.
  # 그 차이는 «신청서를 보냈다»와 «신청이 완료되었다» 사이의 차이와 정확히 같습니다: wait 없이는
  # 그 후 파드가 뜨지 않더라도 Flux는 성공을 보고합니다.
  wait: true
  # 적용을 실패로 인정하기 전에 이 준비 상태를 얼마나 기다릴지.
  # 3분 — 빈 노드에서 이미지를 내려받는 시간을 여유 있게 잡은 값입니다. 너무 작은
  # 값은 느린 네트워크에서 거짓 실패를 만들고, 너무 큰 값은 명확한 오류 대신
  # 오랫동안 «진행 중»을 바라보게 만듭니다.
  timeout: 3m
