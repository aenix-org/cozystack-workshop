# 랩 9 · 출입 통과 로그에 대한 분석용 ClickHouse 데이터베이스 주문하기.
# 무엇을 얻고 싶은지에 대한 설명입니다. 서비스는 플랫폼이 조립하고 설정합니다.
# 대시보드에서 마우스로 주문하는 것과 동일한 것 — 단지 텍스트로 할 뿐입니다.
# 랩 클러스터가 아니라, 관리 클러스터의 테넌트에 적용합니다:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f clickhouse.yaml
#
# 적용하기 전에: tenant-workshopXX 를 자신의 namespace 로,
# 그리고 ЗдесьВашПароль 를 직접 정한 비밀번호로 바꾸세요.
apiVersion: apps.cozystack.io/v1alpha1
kind: ClickHouse
metadata:
  name: analytics
  namespace: tenant-workshopXX
spec:
  # 복제본 하나와 샤드 하나. 프로덕션에서는 최소 두 개의 복제본을 유지합니다. 그렇지 않으면 노드를
  # 잃었을 때 데이터를 사용할 수 없게 됩니다. — 하지만 우리에게 필요한 것은 백만 행이지 장애
  # 내성이 아니며, 여분의 복제본은 스탠드의 리소스만 잡아먹을 뿐입니다.
  replicas: 1
  shards: 1
  # 테이블 데이터용 디스크. 이 랩의 백만 행은 수십 메가바이트를 차지합니다:
  # 사전을 사용한 컬럼형 저장은 이런 로그를 아주 강하게 압축합니다.
  size: 5Gi
  # 쿼리 로그를 포함한 서버 시스템 로그용 별도 디스크.
  logStorageSize: 2Gi
  # 며칠 후에 쿼리 로그를 버릴지. 우리는 이것을 들여다볼 것입니다.
  logTTL: 15
  # replicated — 클러스터의 다른 노드에 복사본이 있는 볼륨입니다: 노드가 빠져도
  # 데이터는 남아 있습니다.
  storageClass: replicated
  # 프로세서 1개, 4 GB. ClickHouse 는 메모리에서 계산하며, 백만 행에 대한
  # 그룹화에서는 이것이 눈에 띕니다.
  resourcesPreset: u1.small
  # 데이터베이스 사용자와 그 비밀번호. 비밀번호는 직접 정하고 기억하세요: 이것은
  # 워커 파드(변수 CH_AUTH)와 검증 스크립트(변수 CH_PASSWORD)에 필요합니다.
  # 생성 후에는 대시보드의 clickhouse-analytics-credentials 시크릿에서 볼 수 있습니다.
  users:
    analyst:
      password: ЗдесьВашПароль
  # 오브젝트 스토리지로의 백업. 여기 데이터는 생성된 것이라
  # 복원할 것이 없습니다 — 학습용 스탠드에서는 꺼져 있습니다.
  backup:
    enabled: false
  # Keeper 는 복제본 간 조율에 필요합니다. 복제본이 하나뿐이라 조율할
  # 대상이 없으며, Keeper 파드 세 개는 리소스를 헛되이 잡아먹을 것입니다.
  clickhouseKeeper:
    enabled: false
