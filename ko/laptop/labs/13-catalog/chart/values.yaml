# 랩 13. "출입증" 차트의 기본값.
#
# 이것은 배포 시점에 차트가 묻는 질문에 대한 답이다: 복제본을 몇 개로 할지,
# 페이지에 어떤 텍스트를 넣을지, 클러스터 외부 주소가 필요한지. 여기에는 "아무것도
# 선택하지 않은" 경우를 위해 기록해 둔다. 애플리케이션을 주문하는 사람이 이 값을 재정의한다:
# 대시보드에서는 폼 필드로, 터미널에서는 `--set replicas=5` 키나 자신의 파일
# `helm install ... -f my.yaml`로. 이 파일을 편집하면 이미 배포된 것이 아니라 앞으로의 주문에 대한 기본값이 바뀐다.
#
# 여기의 값이 대시보드의 주문 폼으로 바뀌는 방식:
#   타입       — 어떤 필드를 보여줄지: {int} 숫자, {bool} 토글,
#                {string} 텍스트 입력, {struct} 중첩된 필드 그룹;
#   Description — 필드의 라벨과 그 아래의 힌트;
#   =값        — 폼을 열었을 때 필드에 이미 들어 있는 값;
#   필수 여부   — 스키마의 required 목록으로 지정된다. 여기에는 없다: 모든
#                파라미터에 기본값이 있으므로 어떤 필드든 건너뛸 수 있다.
# 그래서 설명은 영어로 쓴다: 차트 작성자뿐 아니라 대시보드에서 애플리케이션을
# 주문하는 누구나 읽기 때문이다.

## `## @param` 형태의 주석은 장식이 아니다. Cozystack 생성기
## (cozyvalues-gen)가 이것으로 values.schema.json과 README의 파라미터 표를 만든다.
## 형식: ## @param {타입} 이름=기본값 - Description.

# 실행 상태로 유지할 애플리케이션 복제본 수. 한 개면 노드가 재시작되는 동안
# 다운타임이 생기고, 두 개면 둘 중 어느 하나를 잃어도 견딘다.
## @param {int} replicas=2 - Number of application replicas.
replicas: 2

# 메인 페이지의 텍스트. 자회사마다 각자의 텍스트가 있는데 그것 하나 때문에
# 별도의 이미지를 만들 사람은 없으므로 파라미터로 노출했다.
## @param {string} greeting=Order a pass for your guest - Text shown on the main page.
greeting: "Order a pass for your guest"

# 애플리케이션에 클러스터 외부 주소가 필요한지. Cozystack 카탈로그 규약:
# external이라는 이름의 필드는 모든 애플리케이션에서 같은 뜻 — 외부 접근을 의미한다.
## @param {bool} external=false - Enable external access from outside the cluster.
external: false

# 복제본 한 개의 크기. 주문 폼에서 서로 무관한 두 개의 필드가 아니라 하나의
# "리소스" 블록처럼 보이도록 별도의 필드 그룹으로 노출했다.
## @typedef {struct} Resources - CPU and memory for each replica.
## @field {quantity} cpu - CPU available to each replica.
## @field {quantity} memory - Memory (RAM) available to each replica.

## @param {Resources} resources - Explicit CPU and memory configuration.
resources:
  cpu: 100m
  memory: 128Mi
