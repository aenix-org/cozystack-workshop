# 랩 13. "출입증" 차트의 명세서.
#
# 차트는 하나의 폴더입니다: 매니페스트 템플릿은 templates/에, 기본값은 values.yaml에,
# 파라미터 스키마는 values.schema.json에 들어 있습니다. 랩 폴더에서
# `helm install <릴리스-이름> chart` 명령으로 배포하며, Cozystack 카탈로그에서는 누군가
# 대시보드를 통해 애플리케이션을 주문할 때 플랫폼 자체가 배포합니다.
#
# Chart.yaml은 패키지의 표지입니다: 이 파일로 Helm은 패키지의 이름과 버전이 무엇인지 파악합니다.
apiVersion: v2
name: guest-pass
description: Internal guest pass service — order a pass for a visitor
type: application

# 다음은 두 개의 버전인데, Helm에서 이 둘만큼 자주 혼동되는 것도 없습니다. 이것들은 서로 다른 것입니다.
#
# version — 패키징 버전입니다. 내부 애플리케이션이 그대로여도, 템플릿, 값 또는 스키마를 수정하면
# 바뀝니다. 릴리스를 업그레이드할 때 Helm이 비교하는 것이 바로 이것이며, 저장소에 업로드된
# 패키지들을 구분하는 것도 이것입니다. 이 버전을 올리지 않으면 플랫폼은 패키지가 바뀌지 않았다고
# 간주하고, 새 버전을 놓칠 수 있습니다.
version: 0.1.0
# appVersion — 패키지 내부에 있는 애플리케이션 자체의 버전으로, 여기서는 nginx입니다. 자기만의
# 삶을 삽니다: 템플릿을 한 번도 수정하지 않고 애플리케이션이 열 번 업데이트될 수도 있고, 반대로
# 템플릿을 다시 작성했지만 애플리케이션은 그대로일 수도 있습니다. 오브젝트 이름에는 들어가지 않고,
# `helm list` 출력과 카탈로그 카드에 표시됩니다.
appVersion: "1.0"
