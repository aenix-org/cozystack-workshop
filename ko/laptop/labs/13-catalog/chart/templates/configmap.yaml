# 랩 13. ConfigMap 템플릿: 「출입증」 페이지와 nginx 설정.
#
# ConfigMap은 텍스트 파일을 저장하고 이를 파드에 제공한다. 페이지는 이미지 안이 아니라 여기에 두는데,
# 이는 재빌드 없이 텍스트를 바꾸기 위함이다: greeting 값은 렌더링 시점에 치환되며,
# 릴리스를 업데이트하는 것만으로 충분하다.
#
# 치환은 `|` 블록 안에서도 동작한다: Helm은 템플릿 파일을 단순 텍스트로 처리하며
# YAML 구조에 대해서는 아무것도 모른다. 자세한 내용은 templates/deployment.yaml 참조.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
# data의 키는 파일 이름이고, `|` 아래에 있는 것이 그 파일의 전체 내용이다.
# 각 키는 컨테이너에 별도의 파일로 마운트된다, Deployment의 volumeMounts 참조.
data:
  # 직원이 보게 될 페이지. 여기에는 두 값이 들어온다: 주문 폼에서 온 greeting과
  # 릴리스 이름 — 열린 페이지만 봐도 누구의 주문인지 알 수 있도록.
  index.html: |
    <!doctype html>
    <html lang="en">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Guest Pass</title>
    <style>
      body{background:#0d1117;color:#e6edf3;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:12vh 5vw;margin:0}
      h1{font-size:clamp(26px,6vw,56px);margin:0 0 .3em;color:#2f6fed}
      .pod{font-family:ui-monospace,Menlo,monospace;color:#7d8590;margin-top:3em}
    </style>
    <h1>{{ .Values.greeting }}</h1>
    <p>Guest Pass service, release <b>{{ .Release.Name }}</b></p>
    <div class="pod">served by __POD__</div>
    </html>
  # nginx 설정. sub_filter는 페이지가 제공되는 순간에 __POD__ 마커를 파드 이름으로 치환한다:
  # 이렇게 하면 어떤 복제본이 응답했는지 브라우저에서 보인다. /healthz에 대한 별도의 응답은
  # Deployment의 readinessProbe에 필요하다 — 프로브가 바로 이 주소를 조회한다.
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location / {
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
