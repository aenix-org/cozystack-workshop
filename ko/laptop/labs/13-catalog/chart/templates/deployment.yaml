# 랩 13. Deployment 템플릿: 무엇을, 몇 개의 사본으로 실행할 것인가.
#
# templates/ 안의 파일들은 완성된 매니페스트가 아니라 초안이다. Helm은 여기에 값을 대입하고
# 그 결과를 클러스터에 넘긴다: `helm template main chart`는 아무것도 적용하지 않고 완성된
# 텍스트를 보여주고, `helm install main chart`는 그것을 적용한다.
#
# 이중 중괄호는 대입 지점이다. 그 안에서 만나게 되는 것:
#   .Values.이름  — 파라미터의 값: 고객이 손대지 않았다면 values.yaml에서,
#                   자기 값을 골랐다면 대시보드의 주문 양식에서 온다;
#   .Release.Name — 릴리스 이름, 즉 차트를 구체적으로 배포한 것의 이름.
# 중괄호 밖의 텍스트는 그대로 매니페스트로 들어간다.
apiVersion: apps/v1
kind: Deployment
metadata:
  # 오브젝트 이름은 하드코딩하지 않고 릴리스 이름으로부터 조립된다. 같은 차트를
  # 하나의 namespace에 여러 번 배포하는데, 고정된 이름이라면 두 번째 주문이 첫 번째를
  # 덮어쓰게 된다. 릴리스 `main`은 `main`이라는 이름의 Deployment, Service, ConfigMap을
  # 준다 — 이름만 봐도 이들이 한 그룹임을 바로 알 수 있다.
  name: {{ .Release.Name }}
  # 레이블: name은 이 애플리케이션의 모든 주문에서 동일하고, instance는 주문을 구별한다.
  # 오브젝트들은 이 레이블로 서로를 찾고, `kubectl get` 출력도 이 레이블로 걸러진다.
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # 몇 개의 사본을 실행 상태로 유지할 것인가. 사본이 사라지면 클러스터는 묻지 않고
  # 새 사본을 만든다 — 여기서 당직 관리자 없는 자가 치유가 나온다.
  replicas: {{ .Values.replicas }}
  # selector는 Deployment에게 어떤 파드를 자기 것으로 볼지 알려준다 — 이름이 아니라 레이블로.
  # 여기의 레이블과 template.metadata.labels의 레이블은 반드시 일치해야 한다. 어긋나면
  # Deployment는 자신의 사본을 찾지 못하고 계속해서 다시 찍어낸다.
  selector:
    matchLabels:
      app.kubernetes.io/name: guest-pass
      app.kubernetes.io/instance: {{ .Release.Name }}
  # template은 파드의 설계도다. 아래의 모든 것은 Deployment 자체가 아니라, 그것이 이
  # 설계도로부터 만드는 애플리케이션 사본을 기술한다.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guest-pass
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # 파드 어노테이션에 담긴 설정 해시. 이것이 없으면 ConfigMap을 수정해도 파드가
        # 재시작되지 않고, 누군가 손으로 파드를 지우기 전까지 새 텍스트가 나타나지 않는다.
        # 이것이 차트 전반에 대한 가장 흔한 불만이다.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # 애플리케이션은 root가 아닌 사용자로, 축소된 권한으로 동작한다. 카탈로그의 차트는
      # 다른 테넌트들이 자기 namespace에 배포하며, 컨테이너의 권한은 애플리케이션과 함께
      # 당신이 그들에게 약속하는 것의 일부다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 이미지는 템플릿에 적혀 있고 의도적으로 파라미터로 빼지 않았다: 고객은 크기와
          # 텍스트를 고르지만, 애플리케이션 자체를 임의의 것으로 바꾸지는 못한다.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # 이 변수가 없으면 nginx는 노드의 코어마다 워커 프로세스를 하나씩 띄운다.
          # 코어가 수십 개인 노드에서는 워커도 수십 개가 되고, 메모리 한계가 백 메가바이트인
          # 파드는 첫 요청도 받기 전에 OOMKilled로 죽는다. 차트는 노드가 어떤 것이든 될 수 있는
          # 다른 테넌트로 가기 때문에, 여기서는 이것이 필수다.
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # 컨테이너 내부의 포트. http라는 이름은 뒤의 프로브와 Service에서 사용되어,
          # 포트 번호가 세 곳이 아니라 한 곳에 적히게 한다.
          ports:
            - containerPort: 8080
              name: http
          # requests — 얼마를 보장해서 할당할지, 이 숫자로 스케줄러가 노드를 고른다.
          # 여기서 limits는 메모리에만 있다: 초과하면 컨테이너를 죽이고 다시 띄운다.
          # CPU 한계는 의도적으로 없다, 그렇지 않으면 애플리케이션이 더 느리게 돌아가는 대신
          # 천장에 부딪힌다.
          # `| quote` 필터는 대입된 값을 따옴표로 감싼다: 사용자가 1을 입력할 수 있는데,
          # 따옴표가 없으면 "1"이나 "100m" 같은 문자열이 기대되는 자리에 숫자가 들어가 버린다.
          resources:
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
            limits:
              memory: {{ .Values.resources.memory | quote }}
          # readinessProbe — 「요청을 받을 준비가 됐는가?」라는 질문. /healthz가 응답하기 전까지
          # Service는 이 사본으로 트래픽을 보내지 않는다. 여기서 중단 없는 업데이트가 나온다:
          # 옛 사본은 새 사본이 응답한 뒤에 로드밸런싱에서 빠진다.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          # 페이지와 nginx 설정은 ConfigMap의 파일로 연결된다. subPath는 정확히 파일 하나만
          # 대입한다: 이것이 없으면 마운트된 디렉터리가 /etc/nginx/conf.d 전체를 덮어쓰고
          # 이미지의 기본 설정이 사라져 버린다.
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      # ConfigMap 이름은 릴리스 이름으로부터 조립되므로, 파드는 언제나 이웃의 것이 아니라
      # 자기 주문의 설정을 마운트한다.
      volumes:
        - name: page
          configMap:
            name: {{ .Release.Name }}
        - name: conf
          configMap:
            name: {{ .Release.Name }}
