---
# 랩 11. 빌드된 APK를 담을 버킷.
#
# 버킷은 객체 스토리지 안의 이름이 붙은 영역입니다: 파일은 통째로 넣고 통째로 가져오며,
# HTTP를 통해 처리되고 어디에도 마운트되지 않습니다. 내부에 디렉터리는 없으며, 객체 이름 안의
# 슬래시는 인터페이스에서만 트리로 그려집니다.
#
# 이것은 테넌트 객체입니다: `lab` 클러스터가 아니라 관리 클러스터에 있는 여러분의 namespace에
# 존재합니다. 그래서 여기서 kubeconfig는 `lab` 클러스터를 다룰 때 쓰는 것이 아니라
# 테넌트용이어야 합니다. 이는 의도된 것입니다: 빌드 아티팩트는
# 자신이 빌드된 클러스터보다 오래 살아남아야 합니다.
#
# 적용하기 전에 tenant-workshopXX를 여러분의 namespace로 바꾸세요. 그러지 않으면 주문이
# 엉뚱한 테넌트로 가고, 십중팔구 권한 검사를 통과하지 못합니다.
#
#     export KUBECONFIG=~/.kube/workshop
#     kubectl apply -f bucket.yaml
#
# 같은 작업을 테넌트 대시보드에서 마우스로도 할 수 있습니다 (애플리케이션 생성 -> Bucket).
# 결과는 동일합니다; 차이는 텍스트는 리뷰하고 Git에 넣을 수 있다는 점입니다.
#
# 적용 후에 일어나는 일: 플랫폼이 몇 초 만에 버킷을 띄우고
# 접근 키를 발급하여, 같은 namespace의 bucket-builds-ci-credentials 시크릿에 담아 둡니다.
# 거기서 네 개의 값(endpoint, bucketName, accessKey, secretKey)은
# `lab` 클러스터로 손수 옮깁니다 — 클러스터가 서로 다르므로 저절로 옮겨지는 것은 없습니다.
apiVersion: apps.cozystack.io/v1alpha1
kind: Bucket
metadata:
  # Cozystack 객체의 이름, 오직 그것뿐입니다. 스토리지에서의 실제 버킷 이름은 플랫폼이
  # 스스로 발급합니다 — bucket-a9209f83-... 같은 긴 이름입니다. 그것은 발급된 시크릿의
  # bucketName 필드에 들어가며, 빌드에 넣어야 하는 것은 `builds`가 아니라 바로 그것입니다.
  name: builds
  namespace: tenant-workshopXX
spec:
  users:
    # 이 맵의 각 키는 자신만의 키 쌍을 가진 별도의 S3 사용자입니다.
    # 빈 객체는 "읽기 및 쓰기 전체 권한"을 의미합니다.
    # 이렇게 하면 빌더에게는 쓰기를, 모바일 팀에는 읽기 전용을 부여할 수 있습니다:
    #   ci: {}
    #   mobile:
    #     readonly: true
    ci: {}
