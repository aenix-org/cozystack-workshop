---
# 랩 11. 빌드 그 자체: ConfigMap에 담긴 스크립트와 그것을 실행하는 Job.
# 하나의 파일에 두 개의 객체가 `---` 줄로 구분되어 있습니다.
#
# 관리 클러스터의 테넌트가 아니라, 여러분의 학습 클러스터 `lab`에 적용됩니다:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f android-build.yaml
# 여기에는 tenant-workshopXX 같은 자리표시자가 없습니다 — 자기 번호를 어디에도 넣을 필요가 없습니다.
#
# 적용하기 전에 클러스터에 두 객체가 이미 존재해야 합니다. 그렇지 않으면 빌드 파드가 시작되지 않습니다:
# 클러스터는 없는 것을 마운트하지 않으며, 파드는 계속 기다립니다.
#     configmap/propusk-src   소스: kubectl apply -f propusk-src.yaml
#     secret/bucket-creds     버킷 접근 키 네 개, 손으로 입력
#
# Deployment가 아니라 Job인 이유: 빌드에는 끝이 있습니다. Deployment는 종료된 프로세스를
# 장애로 간주하고 새 복사본을 띄웁니다 — 빌드가 무한 반복되어 결코 멈추지 않습니다.
#
# 빌드 스크립트가 Job의 command 필드에 문자열로 들어가지 않고 별도 객체로 존재하는 이유:
#   - YAML 필드 안의 예순 줄짜리 셸은 읽거나 검사할 수 없습니다: 여기서는 그것이
#     에디터가 하이라이트하고 `bash -n`으로 검사할 수 있는 평범한 파일입니다;
#   - 명령 하나로 전체를 볼 수 있습니다: kubectl get configmap android-build-script -o yaml;
#   - 작업 정의를 건드리지 않고 빌드를 고칠 수 있고, 그 반대도 됩니다.
# 편리함의 대가: 스크립트가 Job과 별도로 존재합니다. ConfigMap을 바꿔도 — 이미 실행 중인
# 빌드는 알아채지 못하며, 새 텍스트는 다음 실행에서만 반영됩니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: android-build-script
data:
  # 다섯 개의 빌드 단계 — 빌드 서버에서 손으로 직접 입력할 바로 그 명령들입니다.
  # 컨테이너는 거의 비어 있는 상태로 시작합니다: Java와 Gradle은 이미지에서 오고, 나머지는 스크립트가
  # 스스로 가져옵니다.
  #   1/5  command-line tools를 내려받습니다 — Android SDK 자체를 설치하는 데 쓰는 유틸리티 (1-2분)
  #   2/5  라이선스를 수락하고 SDK, 플랫폼 34, build-tools를 설치합니다. 가장 긴 단계,
  #        5-15분이며, 그동안 로그는 조용합니다: sdkmanager는 비대화형 모드에서
  #        진행 상황을 출력하지 않습니다. 여기서의 침묵은 멈춤이 아닙니다
  #   3/5  gradle :app:assembleDebug — /src의 소스를 APK로 컴파일합니다 (3-8분)
  #   4/5  객체 스토리지용 콘솔 클라이언트 mc를 설치합니다
  #   5/5  APK를 버킷에 두 가지 이름으로 넣습니다: 날짜가 붙은 것과 propusk-latest (몇 초)
  #
  # 매 빌드는 똑같이 오래 걸립니다: 캐시가 없고, /work 디스크는 일회용입니다(파일 끝의 emptyDir
  # 참조). 실제 빌드 서버였다면 그 대신 영구 볼륨이 있었을 것이고, 두 번째
  # 빌드는 몇 분 안에 끝났을 것입니다.
  #
  # 아래는 YAML이 아니라 build.sh 파일의 그대로의 내용입니다. 그 안의 해시 줄들은
  # 있는 그대로 스크립트에 들어갑니다: 그것들은 셸 주석이며, 제거할 필요가 없습니다.
  build.sh: |
    #!/usr/bin/env bash
    # 여기서 set -e는 적절합니다: 이것은 검사가 아니라 빌드입니다. 어떤 단계가 실패하면 —
    # 계속할 이유가 없으며, Job은 오류로 종료되어 로그와 함께
    # 클러스터에 남아 있어야 합니다.
    set -euo pipefail

    WORK=/work
    export HOME="$WORK"
    export ANDROID_SDK_ROOT="$WORK/android-sdk"
    export ANDROID_HOME="$ANDROID_SDK_ROOT"
    export GRADLE_USER_HOME="$WORK/gradle-home"
    # 일회용 컨테이너에서는 Gradle 데몬이 필요 없습니다: 그것은 다음 빌드를 위해
    # 사는데, 이 컨테이너에는 다음 빌드가 없습니다.
    # -Duser.home은 필수이며, 위의 export HOME의 중복이 아닙니다. Java는 홈
    # 디렉터리를 환경 변수가 아니라 시스템 사용자 레코드에서 가져오는데, 비특권
    # uid에는 그것이 없습니다 — Gradle은 "?"를 넣고 APK 패키징에서 실패합니다:
    # 서명 키를 /work/project/app/?/.android/ 같은 경로에서 찾습니다.
    export GRADLE_OPTS="-Xmx3g -Dorg.gradle.daemon=false -Duser.home=$WORK"

    CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
    MC_URL="https://dl.min.io/client/mc/release/linux-amd64/mc"

    echo "== 1/5 Android command-line tools 설치 중 =="
    mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    cd "$ANDROID_SDK_ROOT/cmdline-tools"
    curl -fsSL -o tools.zip "$CMDLINE_TOOLS_URL"
    # unzip은 모든 베이스 이미지에 있는 것은 아니지만, JDK의 jar가 zip을 풀 수 있습니다.
    unzip -q tools.zip 2>/dev/null || jar xf tools.zip
    rm -f tools.zip
    mv cmdline-tools latest
    export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

    echo "== 2/5 라이선스에 동의하고 SDK 내려받는 중 (가장 오래 걸리는 단계) =="
    # `yes`는 sdkmanager가 입력을 닫을 때 SIGPIPE를 받고
    # 0이 아닌 코드를 반환합니다. set -o pipefail이면 이것이 이유 없이 빌드를 실패시키므로,
    # 여기서는 반환 코드를 의도적으로 억제합니다. 라이선스가 실제로
    # 수락되지 않았다면 — 다음 명령이 그것을 알려줍니다.
    yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
    sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
      "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    echo "== 3/5 APK 빌드 중 =="
    # ConfigMap은 읽기 전용으로 마운트되고, Gradle은 소스 옆에 쓰기 때문에,
    # 트리를 먼저 디스크로 복사합니다.
    # -L은 심볼릭 링크를 역참조합니다: ConfigMap은 파일이 아니라
    # 내부 ..data 디렉터리로의 링크로 마운트되며, -L이 없으면 링크가 프로젝트로 들어갑니다.
    # /src/. 대신 글로브를 쓰는 것은 — 이 내부 디렉터리 자체가 복사되지 않게 하기 위함입니다.
    mkdir -p "$WORK/project"
    cp -rL /src/* "$WORK/project/"
    cd "$WORK/project"
    gradle --no-daemon :app:assembleDebug

    APK="$WORK/project/app/build/outputs/apk/debug/app-debug.apk"
    ls -l "$APK"

    echo "== 4/5 S3 클라이언트 설치 중 =="
    # 클라이언트를 /usr/local/bin이 아니라 작업 디렉터리에 넣습니다. 파드는
    # 비특권 사용자로 실행되고, 이미지의 시스템 디렉터리는 root 소유입니다:
    # 거기에 쓰면 Permission denied로 끝납니다 — 게다가 바로 여기, 네 번째 단계에서,
    # 즉 30분 빌드 후에요. /work 디렉터리는 우리 소유이므로 거기에 쓸 수 있습니다.
    mkdir -p "$WORK/bin"
    curl -fsSL -o "$WORK/bin/mc" "$MC_URL"
    chmod +x "$WORK/bin/mc"
    # PATH는 셸이 명령을 찾는 디렉터리 목록입니다. 이후로 전체 경로가 아니라
    # 그냥 `mc`라고 쓸 수 있도록 우리 것을 덧붙입니다.
    export PATH="$WORK/bin:$PATH"

    echo "== 5/5 APK를 버킷에 업로드 중 =="
    # accessKey/secretKey/endpoint/bucketName 변수는 envFrom을 통해
    # Secret에서 옵니다. alias set 출력을 억제합니다: 로그에 뭔가 출력할 필요가 없습니다.
    # 같은 이유로 스크립트에 set -x가 없습니다 — 그것은 키를 출력할 것입니다.
    # 별칭 이름이 lab이 아니라 builds인 이유: `lab`이라는 단어는 모든 랩에서 학습
    # 클러스터를 가리키며, 둘을 혼동하면 안 됩니다.
    mc alias set builds "https://${endpoint}" "${accessKey}" "${secretKey}" >/dev/null
    STAMP="$(date -u +%Y%m%d-%H%M%S)"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-${STAMP}.apk"
    mc cp "$APK" "builds/${bucketName}/propusk/propusk-latest.apk"
    # 마커 줄: check.sh는 이것으로 「Job이 실행됨」과 「APK가 도착함」을 구별합니다.
    echo "APK-UPLOADED ${bucketName}/propusk/propusk-${STAMP}.apk"
    mc ls --recursive "builds/${bucketName}/propusk/"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: propusk-build
spec:
  # 빌드가 실패하면 파드를 몇 번 다시 생성할지. 0이 더 정직하겠지만,
  # SDK를 내려받을 때 네트워크가 가끔 깜빡이는데, 두 번째 시도가 「왜 내 것만 실패했지」를
  # 설명하는 것보다 쌉니다.
  backoffLimit: 1
  # 전체 빌드에 대한 상한. 이것이 없으면 멈춘 빌드가 저녁까지 노드를 붙들고 있을 것입니다.
  # 카운트는 컨테이너 시작이 아니라 Job의 생성 시점부터 시작됩니다: Pending에 있는 시간과
  # 랩 뒷부분의 노드 재생성도 이를 소비합니다. 한 시간으로는 부족했습니다 —
  # 사람이 이미 기다려낸 뒤에 빌드가 DeadlineExceeded로 죽었습니다.
  activeDeadlineSeconds: 7200
  # 파드 템플릿: Job은 이것으로 빌드를 실행할 파드를 찍어냅니다. 파드는 자체 이름이
  # 없습니다 — Job이 자기 이름에 임의의 접미사를 붙이므로, 파드는 이름이 아니라
  # job-name 레이블로 찾아야 합니다.
  template:
    spec:
      # 빌드는 인터넷에서 남의 코드를 가져와 바로 실행합니다. 그것에 root 권한은
      # 필요 없습니다: 오직 /work에만 씁니다 — 여기에는 S3 클라이언트도 포함되며, 그것도
      # 거기로 내려받습니다. 왜냐하면 비특권 사용자는 이미지의 시스템 디렉터리에
      # 쓸 수 없기 때문입니다. 같은 세 필드가 첫 랩의 애플리케이션에도
      # 같은 이유로 있었습니다: 그것들이 없으면 `restricted` 보안 프로필이
      # 활성화된 클러스터에 파드가 허용되지 않습니다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # Job에게 이것은 필수 필드입니다. Never는 다음을 의미합니다: 실패한 파드를
      # 그 자리에서 재시작하지 말고, 결정을 Job에 넘긴다 — Job이 새것을 만듭니다.
      restartPolicy: Never
      containers:
        - name: build
          # 컨테이너 수준에서의 같은 엄격함: 자기 권한을 상승시키는 것은 금지되고,
          # 모든 linux capability가 하나도 남김없이 제거됩니다.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Gradle과 JDK 17이 들어 있는 기성 이미지. JDK 버전은 임의로 고른 것이 아닙니다:
          # 그것은 app-build.gradle.kts의 jvmTarget = "17"과 일치해야 하며, 그렇지 않으면 빌드가
          # 바이트코드 버전 불일치로 실패합니다. 이미지에 Android SDK는 없습니다 —
          # 스크립트의 첫 단계가 그것을 내려받습니다. SDK가 안에 들어 있는 이미지는 수십
          # 기가바이트에 달해 SDK 자체보다 더 오래 받아야 하기 때문입니다.
          image: gradle:8.9-jdk17
          # 이미지가 기본으로 하는 것이 아니라, /scripts에 마운트된 ConfigMap의
          # 우리 스크립트를 실행합니다.
          command: ["bash", "/scripts/build.sh"]
          envFrom:
            # 시크릿의 키 네 개 모두 같은 이름의 환경 변수가 됩니다:
            # accessKey, secretKey, endpoint, bucketName.
            - secretRef:
                name: bucket-creds
          # 경험으로 찾아낸 Android 빌드의 정직한 비용. requests는 얼마나
          # 예약할지입니다: 스케줄러는 실제 소비가 아니라 이 숫자로 노드를 고릅니다.
          # Kotlin 컴파일러는 4기가바이트 미만으로는 살아남지 못합니다.
          # limits는 상한입니다: CPU는 한계에 부딪히면 스로틀되고, 메모리는
          # 컨테이너가 죽습니다(OOMKilled). 비교하자면, 첫 랩의 애플리케이션은
          # CPU 20m과 메모리 32Mi로 충분했습니다. 바로 이 숫자들 때문에 학습
          # 클러스터의 노드를 키워야 합니다: 랩 0에서 주문한 노드에는 빌드가 들어가지 않습니다.
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 6Gi
          # 세 개의 볼륨. 소스와 스크립트는 — 읽기 전용: ConfigMap은 어차피 읽기 전용으로
          # 마운트되지만, 명시적인 readOnly는 빌드가 거기에 쓰지 않는다는 것을 바로 말해줍니다.
          # 빌드는 /work에 쓰며, 그것이 쓸 수 있는 유일한 곳입니다.
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: src
          configMap:
            name: propusk-src
            # ConfigMap 키는 슬래시를 포함할 수 없지만, 마운트할 때의 경로는
            # 포함할 수 있습니다. 이렇게 평평한 맵이 Gradle이 기대하는
            # 디렉터리 트리로 펼쳐집니다.
            items:
              - key: settings.gradle.kts
                path: settings.gradle.kts
              - key: build.gradle.kts
                path: build.gradle.kts
              - key: app-build.gradle.kts
                path: app/build.gradle.kts
              - key: AndroidManifest.xml
                path: app/src/main/AndroidManifest.xml
              - key: MainActivity.kt
                path: app/src/main/kotlin/io/aenix/propusk/MainActivity.kt
              - key: strings.xml
                path: app/src/main/res/values/strings.xml
        - name: scripts
          configMap:
            name: android-build-script
            # 볼륨 파일 권한: 읽기와 실행. 스크립트는 `bash /scripts/build.sh`로
            # 호출되므로, 여기의 실행 비트는 안전장치입니다 — 언젠가 파일을 직접
            # 실행하는 사람에게 필요할 것입니다.
            defaultMode: 0755
        - name: work
          # 노드의 임시 디스크로, 파드와 정확히 같은 기간 동안 존재합니다.
          # 여기에 SDK, Gradle 의존성, 빌드 결과가 놓입니다.
          emptyDir:
            # 여유를 둔 12기가바이트: SDK, Gradle 캐시, 빌드 결과가
            # 6~8기가바이트입니다. 상한은 비대해진 빌드가 노드의 디스크를
            # 통째로 먹어치우고 이웃 파드들을 끌어내리지 않도록 필요합니다.
            sizeLimit: 12Gi
