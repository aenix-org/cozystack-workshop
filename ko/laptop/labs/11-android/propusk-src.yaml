---
# 랩 11. 모바일 애플리케이션 "출입증"의 소스 — 빌드에 입력으로 넣는 것들.
#
# 관리 클러스터의 테넌트가 아니라 여러분의 학습 클러스터 `lab`에 적용합니다:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f propusk-src.yaml
# 여기에는 tenant-workshopXX 같은 플레이스홀더가 없습니다 — 어디에도 자기 번호를 대입할 필요가 없습니다.
# 네임스페이스도 지정되어 있지 않습니다: 객체는 여러분의 kubeconfig에 설정된 네임스페이스에 배치됩니다.
#
# 애플리케이션은 의도적으로 아주 작습니다: 액티비티 하나, 화면에 텍스트 한 줄.
# 이 랩의 요점은 Android가 아니라, 빌드가 클러스터로 이동한다는 사실입니다.
#
# 모바일 애플리케이션을 한 번도 빌드해 본 적 없다면, 이 파일들이 무엇인지.
# Android 프로젝트는 코드가 담긴 파일 하나가 아니라, 세 종류의 파일로 이루어진 트리입니다:
#   *.gradle.kts  빌드 설명: 라이브러리를 어디서 가져오는지, 무엇으로 컴파일하는지, 어떤
#                 Android 버전용으로 빌드하는지. 역할로는 makefile인데, Kotlin 언어로 쓰인 것뿐입니다;
#   *.kt          실제 애플리케이션 코드;
#   *.xml         리소스: 텍스트, 그리고 아이콘을 탭했을 때 어떤 화면을 열지에 대한
#                 설명.
# Gradle 빌더는 이 트리를 읽어 APK를 만들어 냅니다 — 전화기용 설치 파일 하나이며,
# 역할로는 Windows의 .msi와 같습니다. Android SDK를 직접 설치하고 손으로 빌드할 필요는
# 없습니다: 그 일은 android-build.yaml의 Job이 처리하고, 여기에는 그 입력만 놓여 있습니다.
#
# 소스는 이미지가 아니라 ConfigMap 안에 있는데, 첫 번째 애플리케이션을 다룬 랩에서
# nginx 페이지가 ConfigMap 안에 있었던 것과 정확히 같은 이유입니다:
# 아무것도 다시 빌드하지 않고 소스를 바꿀 수 있게 하기 위함입니다. ConfigMap은 클러스터
# 객체이며, 그 안에는 텍스트 파일들이 들어 있습니다; 컨테이너가 시작되면 클러스터는 그것들을
# 디스크의 일반 파일처럼 컨테이너 안에 넣어 줍니다.
#
# `data` 안의 키들은 파일 이름이고, `|` 뒤의 들여쓰기 아래에 있는 모든 것은
# YAML이 아니라 파일의 문자 그대로의 내용입니다. 그런 블록 안에 넣은 주석은
# 파일 자체의 한 줄이 되어 버리므로, 아래의 모든 설명은 바깥에,
# 키 앞에 놓여 있습니다.
#
# 여섯 개 키로 된 평평한 맵은 여기서가 아니라 마운트할 때 디렉터리 트리로 펼쳐집니다:
# "키 -> 경로" 대응은 android-build.yaml의 volumes.items 블록에 설정되어 있습니다.
# ConfigMap 키는 슬래시를 포함할 수 없습니다 — 그래서 평평한 이름
# app-build.gradle.kts가 프로젝트에서는 app/build.gradle.kts가 됩니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: propusk-src
data:
  # 프로젝트의 최상위 파일: Gradle이 플러그인과 라이브러리를 어디서 가져오는지, 그리고 어떤
  # 모듈이 프로젝트에 포함되는지(여기서는 하나 — app) 나열합니다. 세 저장소 모두 인터넷의 공개 저장소입니다:
  # 빌드 컨테이너는 비어 있는 상태로 시작해 거기서 모든 것을 가져오며, 그래서 빌드가 오래 걸립니다.
  # 정보보안팀이 외부로의 접근을 차단하면 여러분이 가장 먼저 손댈 곳이 바로 이곳입니다 — 여기에
  # 내부 프록시 저장소가 적히게 되며, Docker Hub를 Harbor로 바꿨던 것과 정확히 같습니다.
  settings.gradle.kts: |
    pluginManagement {
      repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
      }
    }
    dependencyResolutionManagement {
      repositories {
        google()
        mavenCentral()
      }
    }
    rootProject.name = "propusk"
    include(":app")

  # 루트 빌드 파일: 두 플러그인의 버전을 고정합니다 — Android 빌더와 Kotlin
  # 컴파일러. `apply false`는 "버전은 선언하되 루트 프로젝트에서는 활성화하지 않는다"는 뜻입니다:
  # app 모듈이 그것들을 활성화합니다. 버전은 의도적으로 못 박아 두었습니다. "최신"을 가져오는
  # 빌드는 한 달 뒤에는 오늘과 다르게 빌드되며, 그 원인을 파헤치는 건 여러분이 될 것입니다.
  build.gradle.kts: |
    plugins {
      id("com.android.application") version "8.5.2" apply false
      id("org.jetbrains.kotlin.android") version "1.9.24" apply false
    }

  # 애플리케이션 모듈 자체에 대한 설명. 여기에는 빌드가 무엇을 다운로드하고 애플리케이션이
  # 어디서 실행될지를 좌우하는 세 개의 숫자가 있습니다:
  #   compileSdk 34   컴파일에 사용하는 Android SDK 버전. SDK 설치 단계가 바로 이것을
  #                   다운로드합니다 — 약 1.5기가바이트로, 가장 오래 걸리는 빌드 단계입니다;
  #   minSdk 24       애플리케이션이 돌아갈 가장 오래된 Android(이것은 Android 7입니다).
  #                   올리면 오래된 전화기를 잘라내고, 내리면 호환성 라이브러리를
  #                   끌어와야 합니다;
  #   jvmTarget 17    Kotlin은 Java 바이트코드로 컴파일되며, 이 숫자는 빌드 이미지의
  #                   JDK 버전(android-build.yaml의 gradle:8.9-jdk17)과 반드시 일치해야 합니다.
  #                   어긋나면 빌드가 바이트코드 버전 불일치로 실패합니다.
  app-build.gradle.kts: |
    plugins {
      id("com.android.application")
      id("org.jetbrains.kotlin.android")
    }

    android {
      namespace = "io.aenix.propusk"
      compileSdk = 34

      defaultConfig {
        applicationId = "io.aenix.propusk"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
      }

      compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
      }

      kotlinOptions {
        jvmTarget = "17"
      }

      sourceSets {
        getByName("main") {
          java.srcDirs("src/main/kotlin")
        }
      }
    }

  # 전화기를 위한 애플리케이션의 신분증: 어떤 화면들이 있고 아이콘을 탭했을 때 그중 어느 것이
  # 열리는지. 바로 이 일을 MAIN과 LAUNCHER가 있는 intent-filter 블록이 담당합니다 —
  # 그것이 없으면 애플리케이션은 설치되지만 메뉴에 아이콘이 나타나지 않습니다.
  AndroidManifest.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <manifest xmlns:android="http://schemas.android.com/apk/res/android">
      <application android:label="@string/app_name">
        <activity
            android:name=".MainActivity"
            android:exported="true">
          <intent-filter>
            <action android:name="android.intent.action.MAIN" />
            <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
        </activity>
      </application>
    </manifest>

  # 애플리케이션의 유일한 화면 — 그리고 이 프로젝트에 존재하는 모든 코드.
  # 호환성 라이브러리가 아니라 맨 android.app.Activity를 사용했습니다: 프로젝트에는 외부
  # 의존성이 하나도 없으며, 이것이 매 빌드마다 다운로드 시간을 몇 분씩 아껴 줍니다.
  # R.string.greeting — strings.xml의 텍스트에 대한 참조. R 클래스는 소스에 없으며, 빌드가
  # 생성합니다. 따라서 "unresolved reference: R" 오류는 코드의 오타가 아니라 리소스
  # 생성 단계가 실패했음을 뜻합니다.
  MainActivity.kt: |
    package io.aenix.propusk

    import android.app.Activity
    import android.os.Bundle
    import android.widget.TextView

    class MainActivity : Activity() {
      override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val view = TextView(this)
        view.textSize = 22f
        view.setPadding(48, 96, 48, 48)
        view.text = getString(R.string.greeting)
        setContentView(view)
      }
    }

  # 코드에서 분리해 낸 텍스트: 이렇게 하면 프로그래머를 건드리지 않고 그것들을 편집하고 번역합니다.
  # app_name은 전화기에서 아이콘 아래에 보이고, greeting은 화면 자체에 보입니다.
  strings.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <resources>
      <string name="app_name">출입증</string>
      <string name="greeting">방문객 출입증 신청하기</string>
    </resources>
