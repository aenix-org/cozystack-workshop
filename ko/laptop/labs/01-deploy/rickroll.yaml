# 랩 1. rickroll 학습 애플리케이션 전체를 한 파일에 담았습니다: nginx 설정, 페이지,
# 배포 자체, 그리고 거기에 접근하는 고정 주소. `---`로 구분된 네 개의 객체입니다.
#
# 관리 클러스터의 테넌트가 아니라 여러분의 학습 클러스터 `lab`에 적용합니다:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll.yaml
# 여기에는 tenant-workshopXX 같은 자리표시자가 없습니다 — 어디에도 자신의 번호를 넣을 필요가 없습니다.
#
# 네 객체 모두에 반복되는 필드는 여기서 한 번만 다룹니다:
#   apiVersion — 이 객체 타입이 속한 API 그룹;
#   kind       — 객체 타입 그 자체;
#   metadata.name — 이후 `kubectl get`으로 객체를 찾을 때 쓰는 이름.
# 이름은 자기 타입 안에서만 유일하므로, 아래의 Deployment와 Service는 둘 다
# rickroll이라 불려도 충돌하지 않습니다.
---
# nginx 설정. 페이지 버전이 바뀌어도 설정은 변하지 않으므로 따로 분리했습니다.
# ConfigMap — 클러스터 안에 독립적으로 존재하다가 시작 시 컨테이너 안으로 놓이는
# 설정 파일입니다. 이미지를 다시 빌드하지 않고 설정을 바꾸려는 것이 목적입니다.
# `default.conf` 키는 볼륨이 마운트된 디렉터리에서 파일 이름이 됩니다.
#
# `|` 뒤 들여쓰기 아래의 모든 것은 YAML이 아니라 파일의 문자 그대로의 내용입니다. 이 블록
# 안에서 해시가 있는 줄은 파싱될 때 사라지지 않고 nginx 설정에 있는 그대로 들어갑니다.
# 같은 이유로 아래 페이지 블록에는 주석을 넣지 않았습니다:
# 그것은 HTML이고, 거기의 해시는 화면에서 사용자에게 보일 것이기 때문입니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-conf
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      location / {
        # 이 랩의 핵심: nginx가 자기 파드 이름을 HTML 안으로 바로 치환합니다.
        # 파드 안의 $hostname이 바로 파드 이름입니다.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
---
# 페이지, 버전 1. 설정과 별개의 객체로 둡니다 — 랩 4에서 nginx 설정을 건드리거나
# 이미지를 다시 빌드하지 않고 앱을 두 번째 버전으로 전환하기 위해서입니다.
# 이름의 -v1 접미사는 장식이 아닙니다: 옆에 rickroll-page-v2가 생기고, 그 둘 사이에서
# 볼륨을 전환하는 것이 바로 새 버전 롤아웃입니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v1
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Never Gonna Give You Up</title>
    <style>
      body{background:#0d0d12;color:#e8e8ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#ff0057,#ffb800,#00e0ff,#ff0057);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#9aa0b5;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#6f7690}
      .pod b{display:block;margin-top:.4em;color:#00e0ff;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#4d5366;font-size:14px}
    </style>
    <h1>Never Gonna Give You Up</h1>
    <p class="lyr">Never gonna let you down &middot; Never gonna run around and desert you</p>
    <div class="pod">요청을 처리한 Pod<b>__POD__</b></div>
    <p class="hint">페이지를 새로고침하세요. 복제본이 많아지면 이름이 바뀌기 시작합니다.</p>
    </html>
---
# 앱 자체. Deployment는 원하는 상태를 기술합니다 — 어떤 이미지를 실행할지,
# 몇 개의 복제본을 유지할지, 업데이트 시 어떻게 교체할지. 그 다음부터는 클러스터가 스스로
# 현실을 이 기술에 맞추고, 생성 시 한 번이 아니라 계속해서 그것을 감시합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rickroll
  labels:
    app: rickroll
spec:
  # 몇 개의 복제본을 실행 상태로 유지할지. 표현이 정확히 이렇습니다: "하나를 실행하라"가
  # 아니라 "하나를 유지하라". 복제본이 사라지면 클러스터는 묻지 않고 새것을 만듭니다. 랩 3에서는
  # 오토스케일링이 바로 이 필드를 바꾸기 시작하므로, 더는 손으로 건드리지 않습니다.
  replicas: 1
  # Deployment가 어떤 레이블로 파드를 자기 것으로 여기는지. 여기의 레이블과 아래 template의
  # 레이블은 반드시 일치해야 합니다: 어긋나면 객체가 아예 생성되지 않습니다.
  selector:
    matchLabels:
      app: rickroll
  # 파드 템플릿 — 여기서 모든 복제본이 찍혀 나옵니다. template 안의 어떤 필드든 수정하면
  # 앱의 새 리비전이 되고 복제본을 하나씩 교체합니다(이것이 바로 랩 4입니다).
  # template 밖의 필드(예: replicas)를 수정하면 리비전이 생기지 않습니다.
  template:
    metadata:
      labels:
        # 같은 레이블이 파드 자체에도 걸려 있습니다: 파일 끝의 Service가 이 레이블로 파드를 찾습니다.
        app: rickroll
    spec:
      # 파드 전체 수준에서의 `restricted` 보안 프로파일 요구사항: root가 아닌 실행,
      # 특정 UID, 표준 seccomp 프로파일. `restricted`가 켜진 기업 클러스터에서는
      # 이 필드들이 없는 파드는 실행이 허용되지 않으며,
      # 게다가 거부는 매니페스트 apply 시점이 아니라 파드 생성 시점에 옵니다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # 같은 엄격함이지만 컨테이너 수준에서: 내부 프로세스는 자기 권한을
          # 상승시키는 것이 금지되고, 모든 linux capability가 회수됩니다.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 비특권 변형: 8080을 리슨하고 root가 아니게 실행됩니다.
          # 이것만으로도 `baseline` 프로파일에는 충분하지만 `restricted`에는 아닙니다 — 그쪽은
          # 파드와 컨테이너에 명시적 securityContext가 필요하며, 위에서 지정했습니다. 기업
          # 클러스터에서는 보통 바로 이 `restricted`가 켜져 있습니다.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # 기본적으로 nginx는 노드 코어당 워커 프로세스를 하나씩 띄웁니다. 코어가 하나인 학습
          # 머신에서는 프로세스 하나지만, 64코어 프로덕션 노드에서는 64개이고,
          # 메모리 리밋이 작은 파드는 첫 요청 전에 OOMKilled로 죽습니다.
          # 오토튠은 CPU 리밋으로 워커 수를 셉니다: 300m이면 프로세스 하나입니다.
          # -g가 아니라 환경 변수를 통해서: 이 디렉티브는 이미 이미지의 기본
          # 설정에 있고, 두 번째 선언은 nginx를 "duplicate" 오류로 죽입니다.
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # 포트에 번호뿐 아니라 이름도 부여합니다: 아래 readinessProbe와 Service의
          # targetPort가 `http`를 참조합니다. 번호가 바뀌면 한 곳만 고치면 됩니다.
          ports:
            - containerPort: 8080
              name: http
          # 끊임없이 혼동되는 서로 다른 두 가지. requests — 얼마의 자원을 보장하여
          # 예약할지; 스케줄러가 이것으로 노드를 고르고, 랩 3의 오토스케일링도
          # 이것으로 부하를 퍼센트로 계산합니다.
          # limits — 그 위로는 올라갈 수 없는 상한: CPU는 한계에 부딪히면
          # 스로틀링되고, 메모리는 컨테이너가 죽습니다.
          resources:
            # 일부러 아주 작게: 워크숍에는 이런 앱이 많을 것입니다.
            # 20m은 코어의 100분의 2입니다. 값이 낮은 것은 의도적입니다: requests가
            # 작을수록 부하가 임계값을 더 빨리 넘고 랩 3의 복제본 증가가
            # 30분이 아니라 몇 초 만에 보입니다.
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          # 준비성 검사. 이 주소로 응답이 오기 전까지 클러스터는 복제본으로
          # 트래픽을 보내지 않습니다. 이를 위해 nginx 설정에 "ok"로 응답하는 별도의
          # location /healthz를 두었습니다. 이 필드로 랩 4의 무중단 롤아웃 값을 치릅니다:
          # 새 복제본이 응답한 뒤에야 옛 복제본을 끕니다.
          # 이것을 제거하면 업데이트가 요청을 떨어뜨리기 시작합니다.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            # 첫 노크까지 2초 — 경험으로 정한 값입니다. 더 작으면 의미가
            # 없습니다, nginx가 그만큼 걸려 시작합니다; 더 크면 매 롤아웃을 헛되이 늘립니다.
            initialDelaySeconds: 2
          # ConfigMap 내용을 컨테이너 안 어디에 놓을지. 디렉터리는 임의로 고른 것이
          # 아닙니다: 첫 번째에서 nginx가 파일을 서빙하고, 두 번째에서 설정을 읽습니다.
          # 이 두 줄이 없으면 두 ConfigMap은 클러스터에 그냥 놓여 있기만 하고,
          # nginx는 자기 기본 페이지를 보여줄 것입니다.
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
      # 파드에 어떤 ConfigMap을 연결할지. 여기의 볼륨 이름이 위 volumeMounts의 항목과
      # 그것을 묶습니다 — 일치해야 하는 것은 바로 이름이고, 묶는 데에 순서는
      # 상관없습니다. 다만 랩 4에는 상관있습니다, 아래 경고를 보세요.
      volumes:
        # 주의: 이 볼륨은 반드시 첫 번째여야 합니다(volumes[0]).
        # 랩 4는 인덱스 기반 패치로 페이지 버전을 전환합니다.
        # JSON Patch는 리스트 요소를 이름이 아니라 번호로 지정합니다. 볼륨의 자리를
        # 바꾸면 — 패치가 페이지 대신 nginx 설정을 조용히 바꿔치기하고, 앱이
        # 망가지며, 오류 메시지는 전혀 다른 것을 이야기할 것입니다.
        - name: page
          configMap:
            name: rickroll-page-v1
        - name: conf
          configMap:
            name: rickroll-conf
---
# 앱의 고정 주소. 복제본은 태어나고 죽고 그 주소도 바뀌지만, 클러스터 안의 이름
# `rickroll`은 그대로 남습니다 — 이웃들이 이 이름으로 앱을 부릅니다.
# 이 이름 뒤의 살아있는 복제본 목록은 클러스터가 레이블로 스스로 관리합니다.
apiVersion: v1
kind: Service
metadata:
  name: rickroll
spec:
  # 이 주소 뒤에 무엇을 둘지: 누가 만들었든 이런 레이블을 가진 모든 파드.
  # 여기서 전형적인 골칫거리가 나옵니다 — app: rickroll 레이블을 가진 낯선 파드가
  # 조용히 로드 밸런싱에 들어가 여러분의 사용자에게 응답하기 시작합니다. 이 폴더의
  # check.sh 스크립트가 그런 사칭꾼이 없는지 별도로 검사합니다.
  selector:
    app: rickroll
  ports:
    # port — 서비스 자체가 응답하는 포트, targetPort — 파드 안 어디로 노크할지.
    # 여기서 targetPort는 숫자가 아니라 컨테이너의 포트 이름으로 지정됩니다: 컨테이너의
    # 번호가 바뀌어도 이 파일을 고칠 필요가 없습니다.
    - port: 80
      targetPort: http
