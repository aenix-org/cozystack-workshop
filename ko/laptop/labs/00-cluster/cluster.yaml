# 랩 1-14를 위한 학습용 Kubernetes 클러스터.
# 적용하기 전에 tenant-workshopXX를 자신의 namespace로 교체하세요.
#
# 관리(MANAGEMENT) 클러스터에서 적용됩니다 — 테넌트와 함께 발급된 접근 권한으로.
# 이 클러스터 자체의 kubeconfig는 아직 존재하지 않습니다: 클러스터가 올라온
# 뒤에야 생성됩니다.
#
#   kubectl apply -f cluster.yaml
#
apiVersion: apps.cozystack.io/v1alpha1
kind: Kubernetes
metadata:
  name: lab
  namespace: tenant-workshopXX
spec:
  version: v1.35
  storageClass: replicated
  controlPlane:
    # 컨트롤 플레인 사본 한 개: 학습용 스탠드이므로 내결함성보다 리소스 절약이
    # 더 중요합니다.
    replicas: 1
  addons:
    monitoringAgents:
      # 즉시 활성화하세요. 메트릭 수집은 소급해서 켤 수 없습니다: 체크박스를
      # 켜기 전에 일어난 모든 것은 사라집니다. 랩 14는 이 데이터에 의존합니다.
      enabled: true
  nodeGroups:
    md0:
      # 사본에 공간이 부족해지기 시작하면 그룹이 스스로 노드를 추가할 수 있습니다.
      # 스케일링 랩에서는 거기까지 가지 않습니다: 거기서는 노드가 아니라 사본이 늘어납니다.
      minReplicas: 1
      maxReplicas: 3
      instanceType: u1.medium
      diskSize: 20Gi
      storageClass: replicated
