---
# 랩 6 · 나만의 프라이빗 이미지 레지스트리. 이 파일은 의도적으로 불완전합니다.
#
# 이 파일은 동작하지 않으며, 그것이 의도된 것입니다: 여러분은 실패를 자신의 눈으로 직접 보고
# 클러스터에 무엇이 부족했는지 스스로 알아내야 합니다. 여기서 부족한 것은 단 하나 — 클러스터가
# 이미지를 가지러 갈 때 닫힌 레지스트리에 대해 자신을 무엇이라 부르는가입니다. 레지스트리는
# 아무에게나 이미지를 내주지 않으며, 이 매니페스트에는 클러스터가 이미지에 대한 자신의 권리를
# 증명하는 데 도움이 될 만한 것이 아무것도 없습니다. 정확히 어느 줄이 이것을 고치는지는 랩을
# 진행하면서 알아내게 됩니다; 동작하는 버전은 그 옆 passes.yaml에 있으며, 스스로 따져보기 전에
# 그것을 열어보는 것은 의미가 없습니다.
#
# 여기에는 Deployment만 있고 Service는 없습니다: 아직 서비스에 영구적인 이름은 필요 없습니다 —
# 이미지가 다운로드되지 않으므로 어차피 응답하는 파드에는 도달하지 못할 것입니다.
#
# 여러분의 `lab` 클러스터, 기본 네임스페이스에 적용합니다:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f passes-broken.yaml
#     kubectl get pods -l app=passes-api -w
#
# 주의: HARBOR-HOST는 자리표시자이며 동작하는 주소가 아닙니다. 여러분 자신의 Harbor 주소로 바꾸세요,
# 그렇지 않으면 이 파일이 작성된 목적의 오류와는 다른 오류를 만나게 됩니다(자리표시자가 있는 줄은 두 개):
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # macOS
#
# 아래 객체에서: apiVersion — 기술 스키마의 버전, kind — 무엇을 만드는가,
# metadata.name — 객체의 이름. 아래에서 따로 설명하지 않습니다.
#
# Deployment는 「컨테이너를 실행하라」가 아니라 「이러이러한 컨테이너의 사본을 이만큼 실행 상태로
# 유지하라」입니다. 사본이 사라지면 — 클러스터는 묻지 않고 새 사본을 만듭니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # 사본 하나: 실패를 살펴보기에는 하나로 충분하고, 로그와 kubectl describe의 출력에도
  # 잡음이 적을 것입니다.
  replicas: 1
  # 「내 사본은 app: passes-api 레이블을 가진 파드」라는 조건. 아래 파드 템플릿의 레이블은
  # 이것과 일치해야 하며, 그렇지 않으면 클러스터가 매니페스트를 거부합니다.
  selector:
    matchLabels:
      app: passes-api
  # 사본이 찍혀 나오는 템플릿. 그 안의 모든 것이 파드 하나를 기술합니다.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # 파드 전체에 대한 보안 제한: root로 실행하지 않고, 권한 없는 사용자 10001로 동작하며,
      # 시스템 호출 집합을 표준 프로파일로 제한. 이미지는 바로 이에 맞춰 빌드되어 있습니다
      # (app/Dockerfile의 USER 줄 참고).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # 컨테이너 수준의 권한: 추가 권한을 얻지 않고 모든 특수 커널 권한을 내려놓기.
          # 애플리케이션에는 네트워크 포트 하나가 필요하고, 나머지는 불필요합니다.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 이미지 이름의 첫 부분은 레지스트리 주소입니다. 바로 그래서 자신의 레지스트리로
          # 옮기면 매니페스트가 바뀝니다: 이미지 이름이 달라집니다. 주소가 없다면 클러스터는
          # 이미지를 가지러 Docker Hub로 — 즉, 보안팀이 금지한 곳으로 갔을 것입니다.
          image: HARBOR-HOST/passes/passes-api:v1
          # 애플리케이션의 포트. 이름 `http`는 아래에서 준비성 프로브가 사용하므로,
          # 포트 번호가 두 곳이 아니라 한 곳에 지정되어 있습니다.
          ports:
            - containerPort: 8080
              name: http
          # 애플리케이션이 자신이 누구이며 어디에서 왔는지 알게 되는 환경 변수. 바로 이것들을
          # 애플리케이션이 응답에 출력합니다(app/main.go의 identity 구조체 참고).
          # APP_VERSION과 IMAGE_REGISTRY는 텍스트로 지정되어 있습니다 — 이것들은 우리가 직접 씁니다;
          # 다음 세 개는 사본이 시작될 때 클러스터 자신이 채워 넣으며, 애플리케이션은 알 길이 없습니다.
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — 사본에 예약할 것: 이 수치로 스케줄러가 노드를 고릅니다. limits — 상한선:
          # 상한선을 넘는 메모리에 대해서는 컨테이너가 종료되고, 프로세서에 대해서는 스로틀링됩니다.
          # 16Mi로 충분한 것은 애플리케이션이 의존성 없는 Go로 되어 있기 때문입니다.
          # 20m은 프로세서 코어의 20/1000입니다.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # 준비성 프로브: 애플리케이션이 /healthz에 응답하기 전까지는 사본으로 트래픽이
          # 가지 않습니다. 오늘은 여기까지 오지 못합니다 — 이것은 이미 실행 중인 프로세스를
          # 검사하는데, 우리에게는 더 이른 단계인 이미지 다운로드에서 막힐 것입니다.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
