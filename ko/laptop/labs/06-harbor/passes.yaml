---
# 랩 6 · 자신만의 프라이빗 이미지 레지스트리. 매니페스트의 작동하는 버전.
#
# passes-broken.yaml과 동일한 파일에, 거기에 빠져 있던 한 곳을 더한 것입니다 —
# 그 위치는 아래에서 «바로 이것이 빠져 있던 것입니다»라는 말로 표시되어 있습니다. 깨진 버전에서
# 실패를 확인하고 그것이 왜 일어났는지 파악한 뒤에 적용하세요.
#
# 여러분의 `lab` 클러스터에 적용합니다 (Cozystack 관리 클러스터가 아니라 — 거기에는
# Harbor 자체만 있습니다), 기본 네임스페이스에서:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl delete -f passes-broken.yaml
#     kubectl apply -f passes.yaml
#
# 주의: HARBOR-HOST는 자리표시자이며 실제 동작하는 주소가 아닙니다. 적용하기 전에
# 여러분의 Harbor 주소로 바꾸세요; 문자열 HARBOR-HOST는 파일에 두 번 나오며, sed가 둘 다 치환합니다:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # macOS
#
# 아래 객체들에서: apiVersion은 설명 스키마의 버전, kind는 무엇을 만드는지,
# metadata.name은 객체의 이름입니다. 이후에 따로 설명하지 않습니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # 하나가 아니라 두 개의 복제본: 이렇게 하면 서비스 응답에서 요청을 서로 다른 파드가
  # 처리한다는 것과, 이미지가 노드에 한 번 내려받아져 두 번 실행되었다는 것을 볼 수 있습니다.
  replicas: 2
  # «내 복제본은 app: passes-api 레이블이 붙은 파드다»라는 조건. 아래 파드 템플릿의 레이블은
  # 이것과 일치해야 하며, 그렇지 않으면 클러스터가 매니페스트를 거부합니다.
  selector:
    matchLabels:
      app: passes-api
  # 복제본이 찍혀 나오는 템플릿. 안에 있는 모든 것은 하나의 파드를 설명합니다.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # 파드 전체에 대한 보안 제약: root로 실행하지 않고, 권한 없는
      # 사용자 10001로 동작하며, 시스템 호출 집합을 표준 프로파일로
      # 제한합니다. 이미지도 바로 이에 맞게 빌드되어 있습니다 (app/Dockerfile의 USER 줄 참조).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # 바로 이것이 passes-broken.yaml에 빠져 있던 것입니다 — 이 두 줄이며, 그 외에는 아무것도 없습니다.
      #
      # 닫힌 레지스트리는 아무에게나 이미지를 내주지 않습니다: 먼저 자신을 밝혀야 합니다. 시크릿 `harbor`
      # (kubernetes.io/dockerconfigjson 유형)는 레지스트리 주소, 로그인, 비밀번호를 저장하며; 여러분이
      # kubectl create secret docker-registry 명령으로 만들었습니다. 여기서 시크릿은 이름으로
      # 참조되기만 합니다 — 그것을 거기서 가져가는 것은 애플리케이션이 아니라 노드의 kubelet이며, 그
      # 순간은 이미지를 내려받으러 갈 때입니다. 그래서 시크릿은 파드와 같은
      # 네임스페이스에 있어야 합니다: kubelet은 바로 거기서 찾고 다른 어디에서도 찾지 않습니다.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # 컨테이너 수준의 권한: 스스로 권한을 추가로 얻지 않고 모든 특별한
          # 커널 권한을 내려놓습니다. 애플리케이션에는 네트워크 포트 하나만 필요하고, 나머지는 불필요합니다.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 이미지 이름의 첫 부분은 레지스트리 주소이며, 바로 그 때문에 자신의
          # 레지스트리로 옮기면 매니페스트가 바뀝니다: 이미지 이름이 달라집니다. 앞에 주소가
          # 없었다면 클러스터는 Docker Hub로 이미지를 가지러 갔을 텐데, 보안이 바로 그것을 금지했습니다.
          image: HARBOR-HOST/passes/passes-api:v1
          # 애플리케이션 포트. 이름 `http`는 이후 readiness 프로브와 Service가 사용하므로,
          # 포트 번호는 세 곳이 아니라 한 곳에만 지정되어 있습니다.
          ports:
            - containerPort: 8080
              name: http
          # 애플리케이션이 자신이 누구이고 어디에서 왔는지 알게 되는 환경 변수들.
          # 바로 이것들을 응답에 출력합니다 (app/main.go의 identity 구조체 참조).
          # APP_VERSION과 IMAGE_REGISTRY는 텍스트로 지정되어 있습니다 — 우리가 직접 씁니다.
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # 다음은 Downward API입니다: 클러스터가 파드에 대해 아는 것을 스스로 변수에 넣어 줍니다.
            # 애플리케이션은 자신의 이름을 추측할 필요도, 그것을 클러스터 API로 가지러 갈 필요도,
            # 그런 요청을 위한 권한을 지니고 다닐 필요도 없습니다. 값은 복제본이
            # 시작되는 순간에 대입되므로, 각 복제본마다 값이 서로 다릅니다.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — 복제본을 위해 무엇을 예약할지: 이 숫자들로 스케줄러가 노드를
          # 고릅니다. limits — 상한: 상한을 넘는 메모리 때문에 컨테이너는 종료되고,
          # CPU 때문에는 감속됩니다. 16Mi로 충분한 것은 애플리케이션이 의존성 없는 Go로
          # 작성되어 메모리에 거의 아무것도 담지 않기 때문입니다; JVM이라면 두 자릿수는 더
          # 필요했을 것입니다. 20m은 CPU 코어의 1000분의 20입니다.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # readiness 프로브: 애플리케이션이 /healthz에 응답하기 전까지 Service는
          # 이 복제본으로 트래픽을 보내지 않습니다. 새 버전을 배포할 때 이전 복제본은
          # 새 것이 응답한 뒤에야 로드 밸런싱에서 빠집니다 — 그래서 요청이
          # 아직 올라오지 않은 프로세스로 떨어지지 않습니다.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# 두 복제본이 뒤에 서 있는 영구적인 이름. 파드는 다시 생성되며 주소가 바뀌지만,
# passes-api.default.svc.cluster.local 이름은 바뀌지 않습니다. 이 객체가 없으면 애플리케이션은
# 동작하지만, 클러스터 내부에서 그것에 도달할 방법이 없습니다 — 그리고 check.sh의 검사는
# 파드가 아니라 바로 여기로 갑니다.
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # 파드와의 연결은 주소 목록이 아니라 레이블에 대한 조건입니다. app: passes-api 레이블이 붙은
  # 새 복제본은 스스로 로드 밸런싱에 들어가며, 등록할 필요가 없습니다.
  selector:
    app: passes-api
  # port — Service 자체가 어느 포트에서 응답하는지; targetPort는 번호가 아니라 위 ports
  # 블록의 이름 `http`를 참조하므로, 번호가 바뀌어도 연결이 끊기지 않습니다.
  ports:
    - port: 80
      targetPort: http
