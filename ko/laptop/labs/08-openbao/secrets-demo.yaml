# 랩 8 · 3단계 중 3단계: 매니페스트에 비밀번호가 없습니다 — 평문으로도, base64로도.
# 최종 버전. 이 파일은 Git에 커밋하고, 협력업체에 보여주고, 티셔츠에 인쇄해도
# 괜찮습니다.
#
# 이 단계가 두 번째 단계와 다른 점: 거기서는 값이 어쨌든 기록되어 있었습니다 — 파일에,
# 그리고 클러스터 객체에. 여기서는 명세에 아예 없습니다; 애플리케이션이 스스로
# 시작 시점에 OpenBao 저장소에서 비밀번호를 가져옵니다.
#
#   secrets-demo-naive.yaml      파일을 연 사람은 누구나 비밀번호를 봅니다
#   secrets-demo-secret.yaml     비밀번호가 Secret 객체로 옮겨졌습니다
#   secrets-demo.yaml         <- 지금 여기: 비밀번호가 시작 시점에 저장소에서 도착합니다
#
# 적용하기 전에: tenant-workshopXX를 자신의 namespace로 교체하세요 — 그것은 아래 저장소
# 주소의 일부입니다. XX는 자리 표시자이며, 이름의 일부가 아닙니다.
# 적용되는 곳: 자신의 `lab` 클러스터 (export KUBECONFIG=~/lab.kubeconfig).
# 명령: kubectl apply -f secrets-demo.yaml
#
# 애플리케이션이 저장소에 자신을 증명하는 토큰은 passes-bao-token 시크릿에 있습니다.
# 그것은 파일이 아니라 명령으로 생성합니다: 이 매니페스트에는 객체 이름만 있으며,
# 이름은 시크릿이 아닙니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # 모든 것이 root가 아닌 권한으로 동작합니다. fsGroup이 필요한 이유는 여기에 컨테이너가 둘이기 때문입니다: 하나는
      # 비밀번호가 담긴 파일을 쓰고, 다른 하나는 그것을 읽습니다. 공유 그룹이 없으면 init 컨테이너가
      # 메인 컨테이너가 열 수 없는 파일을 쓰게 되고, 어디서 잘못됐는지 반 시간 동안 고민하게
      # 됩니다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # 한 컨테이너가 비밀번호를 놓고 다른 컨테이너가 그것을 읽는 곳입니다.
      # medium: Memory는 이 「디스크」가 노드의 RAM에 있으며
      # 실제 디스크에는 결코 도달하지 않는다는 뜻입니다: 백업에도, 볼륨 덤프에도, 서버에서
      # 디스크를 빼가는 사람에게도. 파드가 사라지면 — 그 내용도 사라집니다.
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      # init 컨테이너는 메인 컨테이너보다 먼저 동작하며 반드시 성공적으로 끝나야 합니다.
      # 비밀번호를 가져오지 못하면 애플리케이션은 아예 시작되지 않으며, 그것이 올바른
      # 동작입니다: 데이터베이스 비밀번호가 없는 서비스는 어차피 작동하지 않으니, 올라와서
      # 로그에 오류를 쏟아내는 것보다 올라오지 않는 편이 더 정직합니다.
      initContainers:
        - name: fetch-secret
          # 단 하나의 유틸리티 `bao`(그 클라이언트)를 위해 OpenBao 이미지 자체를 가져옵니다.
          # 자신의 코드를 작성할 필요는 없습니다.
          image: openbao/openbao:2.5.1
          # bao kv get -field=password — 전체 시크릿이 아니라 한 경로에서 한 필드만
          # 가져옵니다. tr -d '\n'은 그렇지 않으면 비밀번호 안으로 들어갈 개행 문자를 제거합니다:
          # 끝에 붙은 여분의 문자는 데이터베이스가 받아들이지 않고, 그런 것을 찾아내기는 불쾌합니다.
          # chmod 0400 — 파일은 소유자만 읽을 수 있습니다.
          # set -e는 첫 번째 오류에서 스크립트를 멈춥니다: 그렇지 않으면 컨테이너가 빈 파일로
          # 성공적으로 끝나버리고, 그것을 애플리케이션에서 파헤쳐야 하게 됩니다.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              bao kv get -field=password secret/passes/db \
                | tr -d '\n' > /secrets/db_password
              chmod 0400 /secrets/db_password
              echo "OpenBao에서 비밀번호를 가져왔으며, 매니페스트에는 없습니다"
          # 저장소 주소와 애플리케이션이 읽을 권한을 증명하는 토큰.
          # 토큰은 명령으로 생성된 객체에 대한 참조로 들어옵니다; 여기 파일에는 들어오지 않습니다.
          # 주소에서 tenant-workshopXX는 교체해야 하는 바로 그 자리 표시자입니다.
          env:
            - name: BAO_ADDR
              value: http://openbao-secrets.tenant-workshopXX.svc.cozy.local:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: passes-bao-token
                  key: token
          # 공유 폴더. 이 컨테이너에는 쓰기 권한이 주어집니다 — 여기에 씁니다.
          volumeMounts:
            - name: secrets
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 한계값이 메인 컨테이너보다 높습니다: OpenBao 유틸리티는 busybox보다 무겁지만,
          # 몇 초만 살아 있으므로 이것은 상시 비용이 아닙니다.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      # 메인 컨테이너는 init 컨테이너가 끝난 후에만 시작됩니다.
      containers:
        - name: app
          image: busybox:1.36
          # 이전 단계들과 같은 루프이지만, 이제 비밀번호는 환경 변수가 아니라
          # 파일에 있습니다: 지문은 /secrets/db_password에서 바로 읽습니다.
          # 환경 변수는 kubectl describe pod 출력에 보이고 프로세스 덤프에 들어갑니다;
          # 파드 메모리 안의 파일은 그렇지 않습니다.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s %s에 %s로 연결 중, 비밀번호 지문 sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(sha256sum /secrets/db_password | cut -c1-12)"
                sleep 10
              done
          # 여기에는 비밀이 아닌 설정만 남았습니다 — 주소와 로그인.
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
          # 같은 폴더이지만 읽기 전용입니다: 애플리케이션은 아무리 원해도
          # 비밀번호를 훼손하거나 바꿔치기할 수 없습니다.
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
