# 랩 8 · 3단계 중 1단계: 비밀번호가 매니페스트에 평문으로 들어 있습니다.
# 오늘날 «Пропуск» 서비스는 이런 모습입니다 — 그리고 감사(audit)가 찾아낸 것이 바로 이 파일입니다.
# 문제를 직접 눈으로 확인하기 위해 딱 한 번만 적용할 것입니다.
#
# 길을 잃지 않도록, 랩의 세 단계:
#   secrets-demo-naive.yaml   <- 현재 위치: 파일을 여는 사람은 누구나 비밀번호를 볼 수 있습니다
#   secrets-demo-secret.yaml     비밀번호를 별도의 Secret 객체로 옮겼습니다
#   secrets-demo.yaml            매니페스트에 비밀번호가 전혀 없습니다
#
# 적용 위치: 여러분의 `lab` 클러스터 (export KUBECONFIG=~/lab.kubeconfig).
# 명령: kubectl apply -f secrets-demo-naive.yaml
#
# 이 파일의 비밀번호는 교육용으로 지어낸 것이며, 진짜는 여기에 없습니다. 객체 하나 —
# Deployment; apiVersion, kind, metadata.name은 이후 주석을 달지 않습니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # 복제본 하나로 충분합니다: 우리는 내결함성이 아니라 애플리케이션이
  # 비밀번호를 어디서 가져오는지를 봅니다.
  replicas: 1
  # 이 레이블로 Deployment는 자신의 파드를 식별합니다. 아래 template의 레이블과 일치합니다.
  selector:
    matchLabels:
      app: secrets-demo
  # template — 파드 템플릿: 복제본을 무엇으로 조립할지.
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # 보안 요구사항: root가 아니며, 제한된 시스템 콜 집합.
      # 간극에 주목하세요: 파드는 모든 보안 규칙에 따라 구성되어 있지만, 그것이
      # 열 줄 아래 파일에 비밀번호가 들어 있는 것을 전혀 막지 못합니다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 여기에 진짜 애플리케이션은 없습니다 — busybox와 몇 줄의 shell뿐입니다.
          # 이 랩에서 중요한 것은 단 하나: 비밀번호를 이후에 어떻게 다루는지가 아니라
          # 어디서 가져오는지입니다.
          image: busybox:1.36
          env:
            # 데이터베이스 주소와 사용자 이름은 비밀이 아닙니다: 데이터베이스 이름이
            # passes-db라는 것을 안다고 해서 그 자체로 접근 권한이 생기지는 않습니다.
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # 감사가 찾아낸 것이 바로 이 줄입니다.
            # 파일이 Git에 있으므로, 비밀번호는 저장소에 접근 권한이 있는 모든 사람과
            # 언젠가 그것을 클론한 모든 사람에게 알려집니다.
            - name: DB_PASSWORD
              value: "Propusk2019!"
          # 무한 루프: 10초에 한 번 로그에 한 줄을 출력합니다. 로그에 들어가는 것은 비밀번호
          # 자체가 아니라 그것의 sha256 지문 — 처음 열두 글자입니다. 지문으로
          # 비밀번호가 바뀌었다는 것은 알 수 있지만, 그것으로 값을 복원할 수는 없습니다.
          # 실제 서비스에서도 로그를 정확히 이렇게 씁니다.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          # 요구량은 아주 작습니다: 이것은 부하가 아니라 데모입니다.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
