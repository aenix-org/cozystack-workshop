# 랩 8 · 3단계 중 2단계: 비밀번호를 Deployment에서 별도의 Secret 객체로 옮겼습니다.
# "순진한 수정": 애플리케이션 설명에서 비밀번호가 더 이상 보이지 않아 개발자는 만족하지만,
# 감사자는 그렇지 않습니다. 그 이유는 명령 한 번으로 확인해 봅니다.
#
# 이 단계가 첫 번째보다 나은 점: 값이 더 이상 애플리케이션 설명의 일부가 아니며,
# 이제 이름으로 참조됩니다. 세 번째보다 못한 점은, 값이 여전히
# 어딘가에 적혀 있어야 하고, 그것이 바로 이 파일에 적혀 있다는 것입니다.
#
#   secrets-demo-naive.yaml      파일을 연 사람이면 누구나 비밀번호를 볼 수 있음
#   secrets-demo-secret.yaml  <- 여기입니다: 비밀번호가 Secret 객체 안에 있음
#   secrets-demo.yaml            매니페스트에 비밀번호가 아예 없음
#
# 적용되는 곳: 여러분의 `lab` 클러스터 (export KUBECONFIG=~/lab.kubeconfig).
# 명령: kubectl apply -f secrets-demo-secret.yaml
#
# 이 파일의 비밀번호는 학습용이며 지어낸 것입니다. 파일에는
# `---` 줄로 구분된 두 개의 객체가 있습니다: Secret과 그것을 참조하는 Deployment입니다. apiVersion, kind,
# metadata.name은 파일 이후 부분에서 따로 주석을 달지 않습니다.
#
# Secret은 애플리케이션 설명에 있어서는 안 되는 것들을 위한 별도 종류의 객체입니다.
# 클러스터는 이를 일반 설정보다 조금 더 신중하게 다룹니다: 값이
# kubectl describe에 표시되지 않고, 읽기 권한은 별도로 부여됩니다.
apiVersion: v1
kind: Secret
metadata:
  name: passes-db
# Opaque는 "임의의 키-값 집합"을 의미합니다. 특수한 타입도 있습니다 —
# 이미지 레지스트리 접근용, TLS 인증서용 — 하지만 여기서는 특별한 것이
# 필요하지 않습니다.
type: Opaque
data:
  # 이것은 암호화가 아닙니다. 이것은 base64 — 바이트를 출력 가능한 문자로 적는 방법입니다.
  # 키도 없고, 복호화 비밀번호도 없으며, 역변환은 누구나 할 수 있습니다.
  password: UHJvcHVzazIwMTkh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # 아래 Deployment는 첫 번째 단계와 똑같은 것입니다. 정확히 한 군데만
  # 바뀌었습니다: DB_PASSWORD가 파드에 들어가는 방식입니다.
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # root가 아니며, 시스템 호출이 제한된 집합.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 다시 busybox와 몇 줄의 shell: 애플리케이션의 동작이 아니라
          # 비밀번호의 경로를 봅니다.
          image: busybox:1.36
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # 첫 번째 단계와의 차이는 이것이 전부입니다. value 대신 valueFrom은
            # "저기서 값을 가져와라"를 의미합니다: secretKeyRef.name — 어떤 객체인지, key — 그 안의 어떤
            # 필드인지. 치환은 파드가 시작될 때 일어나며, 애플리케이션
            # 설명에는 이름만 남습니다.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: passes-db
                  key: password
          # 첫 번째 단계와 같은 루프: 비밀번호 자체가 아니라 비밀번호의 지문을 출력합니다.
          # 지문은 바로 단계들을 비교하는 데 편리합니다 — 지문이 바뀌지
          # 않았다면, 이전과 같은 값이 파드에 들어왔다는 뜻입니다.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s %s에 %s(으)로 연결 중, 비밀번호 지문 sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
