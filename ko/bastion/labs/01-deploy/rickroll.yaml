# 실습 1. rickroll 학습 애플리케이션 전체를 하나의 파일에 담았습니다: nginx 설정, 페이지,
# 배포 자체, 그리고 그것에 접근하는 영구 주소. `---`로 구분된 네 개의 객체.
#
# 관리 클러스터의 테넌트가 아니라 여러분의 학습 클러스터 `lab`에 적용합니다:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll.yaml
# 여기에는 tenant-workshopXX 같은 플레이스홀더가 없습니다 — 자기 번호를 어디에도 넣을 필요가 없습니다.
#
# 네 객체 모두에서 반복되는 필드는 여기서 한 번만 살펴봅니다:
#   apiVersion — 이 객체 타입이 속한 API 섹션;
#   kind       — 객체 타입 그 자체;
#   metadata.name — 나중에 `kubectl get`으로 객체를 찾을 때 쓰는 이름.
# 이름은 자기 타입 안에서만 고유하므로, 아래의 Deployment와 Service는 둘 다
# rickroll라고 불려도 충돌하지 않습니다.
---
# nginx 설정. 페이지 버전 사이에서 바뀌지 않으므로 따로 분리했습니다.
# ConfigMap — 클러스터 안에 독립적으로 존재하다가 시작 시 컨테이너 내부로
# 마운트되는 설정 파일. 이미지를 다시 빌드하지 않고 설정을 바꾸는 것이 목적입니다.
# `default.conf` 키는 볼륨이 마운트된 디렉터리에서 파일 이름이 됩니다.
#
# `|` 뒤의 들여쓰기 아래는 YAML이 아니라 파일의 문자 그대로의 내용입니다. 이 블록 안에서
# 해시(#)가 있는 줄은 파싱 중에 사라지지 않고 nginx 설정에 그대로 들어갑니다. 같은 이유로
# 아래 페이지 블록에는 주석을 달지 않았습니다:
# 거기는 HTML이라, 그 안의 해시는 화면에서 사용자에게 보이게 되기 때문입니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-conf
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      location / {
        # 이 실습의 핵심: nginx가 자기 파드 이름을 HTML에 그대로 넣습니다.
        # 파드 내부의 $hostname이 바로 파드 이름입니다.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
---
# 페이지, 버전 1. 설정과 별도의 객체로 둔 것은 — 실습 4에서 nginx 설정을 건드리거나
# 이미지를 다시 빌드하지 않고 애플리케이션을 두 번째 버전으로 전환하기 위해서입니다.
# 이름의 -v1 접미사는 장식이 아닙니다: 그 옆에 rickroll-page-v2가 생기고, 둘 사이에서
# 볼륨을 전환하는 것이 바로 새 버전을 롤아웃하는 것입니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v1
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Never Gonna Give You Up</title>
    <style>
      body{background:#0d0d12;color:#e8e8ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#ff0057,#ffb800,#00e0ff,#ff0057);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#9aa0b5;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#6f7690}
      .pod b{display:block;margin-top:.4em;color:#00e0ff;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#4d5366;font-size:14px}
    </style>
    <h1>Never Gonna Give You Up</h1>
    <p class="lyr">Never gonna let you down &middot; Never gonna run around and desert you</p>
    <div class="pod">요청을 처리한 Pod<b>__POD__</b></div>
    <p class="hint">페이지를 새로고침하세요. 복제본이 많아지면 이름이 바뀌기 시작합니다.</p>
    </html>
---
# 애플리케이션 자체. Deployment는 원하는 상태를 기술합니다 — 어떤 이미지를 실행할지,
# 몇 개의 복제본을 유지할지, 업데이트 시 어떻게 교체할지. 그러면 클러스터가 스스로 현실을
# 이 기술에 맞게 조정하고, 생성 시점에 한 번만이 아니라 계속해서 지켜봅니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rickroll
  labels:
    app: rickroll
spec:
  # 몇 개의 복제본을 실행 상태로 유지할지. 표현은 바로 이렇습니다: "하나를 실행하라"가
  # 아니라 "하나를 유지하라". 복제본이 사라지면 클러스터가 묻지 않고 새것을 만듭니다. 실습 3에서
  # 바로 이 필드를 오토스케일링이 바꾸기 시작하므로, 이후로는 손으로 건드리지 않습니다.
  replicas: 1
  # Deployment가 어떤 레이블로 파드를 자기 것으로 여기는지. 여기의 레이블과 아래 template의
  # 레이블은 반드시 일치해야 합니다: 불일치하면 객체가 아예 생성되지 않습니다.
  selector:
    matchLabels:
      app: rickroll
  # 파드 템플릿 — 모든 복제본이 이것으로 찍혀 나옵니다. template 안의 어떤 필드든 수정하면
  # 애플리케이션의 새 리비전이 되고 복제본을 하나씩 교체합니다(이것이 바로 실습 4).
  # template 밖의 필드(예: replicas) 수정은 리비전을 만들지 않습니다.
  template:
    metadata:
      labels:
        # 같은 레이블이 파드 자체에도 붙습니다: 파일 끝의 Service가 이걸로 파드를 찾습니다.
        app: rickroll
    spec:
      # 파드 전체 수준에서의 `restricted` 보안 프로필 요구사항: root가 아닌 실행,
      # 특정 UID, 그리고 표준 seccomp 프로필. `restricted`가 켜진 기업 클러스터에서는
      # 이 필드들이 없는 파드는 실행이 허용되지 않으며,
      # 그 거부는 매니페스트 apply 시점이 아니라 파드 생성 순간에 옵니다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # 같은 엄격함이지만 컨테이너 수준에서: 내부 프로세스는 자기 권한을 상승시키는 것이
          # 금지되고, 모든 linux 기능(capability)이 박탈됩니다.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 비특권 변형: 8080을 리스닝하고 root가 아니게 동작합니다.
          # 이것만으로 `baseline` 프로필에는 충분하지만 `restricted`에는 아닙니다 — 그것은
          # 파드와 컨테이너에 명시적 securityContext가 필요하며, 위에서 설정했습니다. 기업
          # 클러스터에서는 보통 바로 이 `restricted`가 켜져 있습니다.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # 기본적으로 nginx는 노드 코어당 워커 프로세스를 하나씩 띄웁니다. 코어가 하나인 학습
          # 머신에서는 프로세스 하나지만, 코어가 64개인 운영 노드에서는 64개가 되어,
          # 메모리 리밋이 작은 파드는 첫 요청 전에 OOMKilled로 죽습니다.
          # 오토튠은 CPU 리밋으로 워커 수를 셉니다: 300m이면 프로세스 하나입니다.
          # -g가 아니라 환경 변수를 통해서: 이 디렉티브는 이미 이미지의 기본 설정에 있고,
          # 두 번째 선언은 nginx를 "duplicate" 오류로 죽입니다.
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # 포트에는 번호뿐 아니라 이름을 부여했습니다: `http`는 아래의 readinessProbe와
          # Service의 targetPort가 참조합니다. 번호가 바뀌어도 한 곳만 고치면 됩니다.
          ports:
            - containerPort: 8080
              name: http
          # 끊임없이 혼동되는 서로 다른 두 가지. requests — 확실히 예약할 리소스의 양;
          # 스케줄러가 이것으로 노드를 고르고, 실습 3의 오토스케일링도
          # 이것으로 부하를 퍼센트로 계산합니다.
          # limits — 그 위로는 올라가지 못하는 상한: CPU에서는 한계에 부딪히면
          # 스로틀링되고, 메모리에서는 컨테이너를 죽입니다.
          resources:
            # 의도적으로 아주 작게: 워크숍에는 이런 애플리케이션이 많이 생깁니다.
            # 20m은 코어의 2백분의 1입니다. 값이 낮은 것은 의도적입니다: requests가
            # 작을수록 부하가 임계값을 더 빨리 넘어서고, 실습 3에서 복제본 증가가
            # 30분이 아니라 몇 초 만에 보입니다.
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          # 준비 상태 체크. 이 주소에서 응답이 오기 전까지 클러스터는 복제본으로 트래픽을
          # 보내지 않습니다. 이를 위해 nginx 설정에 "ok"를 응답하는 별도의 location /healthz를
          # 두었습니다. 이 필드로 실습 4의 무중단 롤아웃이 성립합니다:
          # 새 복제본이 응답한 뒤에야 기존 복제본을 끕니다.
          # 이것을 없애면 — 업데이트가 요청을 떨어뜨리기 시작합니다.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            # 첫 노크까지 2초 — 경험적으로 정한 값입니다. 더 적게는 의미가 없고,
            # nginx가 그만큼 시작하는 데 걸립니다; 더 크게는 매 롤아웃을 헛되이 늘립니다.
            initialDelaySeconds: 2
          # ConfigMap 내용을 컨테이너 안 어디에 놓을지. 디렉터리는 임의로 고른 것이
          # 아닙니다: 첫 번째에서 nginx가 파일을 제공하고, 두 번째에서 설정을 읽습니다.
          # 이 두 줄이 없으면 두 ConfigMap 모두 클러스터에 그저 놓여 있기만 하고,
          # nginx는 자신의 기본 페이지를 보여줄 것입니다.
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
      # 파드에 어떤 ConfigMap을 연결할지. 여기의 볼륨 이름이 위 volumeMounts의 항목과
      # 그것을 묶습니다 — 일치해야 하는 것은 바로 이름이고, 묶는 데에는 순서가 상관없습니다.
      # 그런데 실습 4에서는 순서가 상관있습니다, 아래 경고를 보세요.
      volumes:
        # 주의: 이 볼륨은 반드시 첫 번째여야 합니다(volumes[0]).
        # 실습 4는 인덱스로 패치를 걸어 페이지 버전을 전환합니다.
        # JSON Patch는 리스트 요소를 이름이 아니라 번호로 지정합니다. 볼륨을 서로 바꿔
        # 놓으면 — 패치가 페이지 대신 nginx 설정을 조용히 바꿔치기해서 애플리케이션이
        # 망가지고, 오류 메시지는 전혀 다른 이야기를 하게 됩니다.
        - name: page
          configMap:
            name: rickroll-page-v1
        - name: conf
          configMap:
            name: rickroll-conf
---
# 애플리케이션의 영구 주소. 복제본은 태어나고 죽으며 그 주소는 바뀌지만, 클러스터 안의
# 이름 `rickroll`은 그대로 유지됩니다 — 이웃들이 애플리케이션을 이 이름으로 부릅니다.
# 이 이름 뒤의 살아있는 복제본 목록은 클러스터가 레이블로 스스로 관리합니다.
apiVersion: v1
kind: Service
metadata:
  name: rickroll
spec:
  # 이 주소 뒤에 누구를 둘지: 누가 만들었든 상관없이 그런 레이블을 가진 모든 파드.
  # 그래서 전형적인 골칫거리가 생깁니다 — app: rickroll 레이블을 가진 엉뚱한 파드가
  # 조용히 밸런싱에 끼어들어 여러분의 사용자에게 응답하기 시작합니다. 이 폴더의 스크립트
  # check.sh가 그런 사칭자가 없는지 따로 검사합니다.
  selector:
    app: rickroll
  ports:
    # port — 서비스 자체가 어떤 포트로 응답하는지, targetPort — 그것이 파드 안 어디로
    # 노크하는지. 여기서 targetPort는 숫자가 아니라 컨테이너의 포트 이름으로 지정했습니다:
    # 컨테이너의 번호가 바뀌어도 이 파일은 고칠 필요가 없습니다.
    - port: 80
      targetPort: http
