---
# 랩 13. Cozystack 카탈로그를 위한 애플리케이션 정의 — 바로 그 "카탈로그 항목".
#
# 이 오브젝트 자체는 아무것도 배포하지 않는다. 이것은 세 가지를 연결한다: 당신의 차트
# (무엇을 배포할지), API의 새로운 오브젝트 타입(애플리케이션을 어떻게 주문하는지),
# 그리고 대시보드의 카드(그 과정에서 사람이 무엇을 보는지). 이것이 없는 동안 차트는
# 플랫폼이 전혀 알지 못하는 파일 폴더로 남고, Postgres 및 Redis 옆의 애플리케이션 목록은 비어 있다.
#
# namespace 없이 단일 명령으로 적용한다:
#   kubectl apply -f applicationdefinition.yaml
#
# 중요: 이 오브젝트는 CLUSTER-SCOPED이다 — namespace가 없으며 클러스터 전체에
# 하나만 존재한다. 테넌트는 이것을 적용할 수 없으며, 이는 검증되었다:
#   kubectl auth can-i create applicationdefinitions   ->   no
# 당신의 작업은 파일을 작성하고 로컬에서 검증하는 것으로 끝난다.
# 이것은 플랫폼 관리자가 적용한다. README의 "당신의 권한이 어디서
# 끝나는가" 섹션을 참고하라.
apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: guest-pass
spec:
  # --- API에서 어떻게 보이는가 ----------------------------------------------
  application:
    # 새로운 오브젝트 타입의 Kind. 적용 후 클러스터에 kind: GuestPass가
    # 나타나며, 일반적인 kubectl로 이를 다룰 수 있게 된다.
    kind: GuestPass
    plural: guestpasses
    singular: guestpass
    # 값 스키마 — 차트에 values.schema.json 파일로 들어 있는 것과 같으며,
    # 단지 한 줄로 작성되어 있다. 이를 기준으로 API는 잘못된 값을 거부하고,
    # 대시보드는 생성 폼을 그린다.
    openAPISchema: |-
      {"title":"Chart Values","type":"object","properties":{"replicas":{"description":"Number of application replicas.","type":"integer","default":2},"greeting":{"description":"Text shown on the main page.","type":"string","default":"Order a pass for your guest"},"external":{"description":"Enable external access from outside the cluster.","type":"boolean","default":false},"resources":{"description":"Explicit CPU and memory configuration.","type":"object","default":{},"properties":{"cpu":{"description":"CPU available to each replica.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true},"memory":{"description":"Memory (RAM) available to each replica.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true}}}}}

  # --- 무엇을 배포할지 ----------------------------------------------------
  release:
    # 릴리스 이름 = prefix + 오브젝트 이름. 이름이 `main`인 GuestPass 오브젝트는
    # `guest-pass-main` 릴리스로 배포된다. 접두사는 필수이며, 서로 다른
    # 애플리케이션의 릴리스가 이름으로 충돌하지 않도록 하기 위해 필요하다.
    prefix: guest-pass-
    labels:
      # Cozystack은 같은 키로 테넌트 릴리스를 Flux 샤드에 분배한다.
      # 이것이 없으면 릴리스를 조정(reconcile)할 주체가 없다.
      sharding.fluxcd.io/key: tenants
    chartRef:
      # 차트를 어디서 가져올지. 허용되는 kind: OCIRepository, HelmChart,
      # ExternalArtifact. 외부 카탈로그는 보통 GitRepository -> HelmChart를
      # 통해 들어오며, 그들의 namespace는 cozy-public이다.
      kind: HelmChart
      name: cozystack-guest-pass
      namespace: cozy-public

  # --- 대시보드에서 어떻게 보이는가 ------------------------------------------
  dashboard:
    # 카탈로그 섹션. PaaS, IaaS, NaaS, Administration, Networking이
    # 사용된다 — 자신만의 것을 만들지 말고 기존 것을 선택하라,
    # 그렇지 않으면 애플리케이션이 항목 하나짜리 섹션에 놓이게 된다.
    category: PaaS
    singular: Guest Pass
    plural: Guest Passes
    description: Internal guest pass service for employees and reception
    tags:
      - internal
      - web
    # 아이콘 — base64로 된 SVG. 경로나 URL이 아니라 정확히 base64이다: 대시보드는
    # 무언가를 다운로드하러 어디에도 가지 않는다. 원본은 옆의 icon.svg에 있다.
    icon: 
    # 오브젝트의 YAML 표현에서 필드 순서. 미관상의 것이지만, 이것이 없으면
    # 필드가 제멋대로 배열되어 폼이 더 읽기 어려워진다.
    keysOrder: [["apiVersion"], ["kind"], ["metadata"], ["metadata", "name"], ["spec", "replicas"], ["spec", "greeting"], ["spec", "external"], ["spec", "resources"]]
