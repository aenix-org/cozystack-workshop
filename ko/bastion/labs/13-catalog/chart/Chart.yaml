# 랩 13. "출입증" 차트의 명세.
#
# 차트는 하나의 폴더입니다: 매니페스트 템플릿은 templates/, 기본값은 values.yaml,
# 그리고 파라미터 스키마는 values.schema.json 에 있습니다. 랩 폴더에서
# `helm install <릴리스-이름> chart` 명령으로 배포되며, Cozystack 카탈로그에서는
# 누군가 대시보드를 통해 애플리케이션을 주문할 때 플랫폼 자체가 배포합니다.
#
# Chart.yaml 은 패키지의 표지입니다: 이것을 보고 Helm 은 패키지 이름과 버전을 파악합니다.
apiVersion: v2
name: guest-pass
description: Internal guest pass service — order a pass for a visitor
type: application

# 다음으로 두 개의 버전이 나오는데, Helm 에서 이것들만큼 자주 혼동되는 것도 없습니다. 이 둘은 서로 다른 것입니다.
#
# version — 패키징 버전입니다. 안에 있는 애플리케이션이 그대로여도, 템플릿·값·스키마를 수정하면
# 바뀝니다. Helm 이 릴리스를 업그레이드할 때 비교하는 것이 바로 이 값이며, 리포지토리에 업로드된
# 패키지들을 구분하는 것도 이 값입니다. 이 값을 올리지 않으면 플랫폼은 패키지가 바뀌지 않았다고
# 간주하고, 새 버전이 눈에 띄지 않을 수 있습니다.
version: 0.1.0
# appVersion — 패키지 안에 있는 애플리케이션 자체의 버전이며, 여기서는 nginx 입니다. 자기 나름의
# 삶을 삽니다: 템플릿을 한 번도 수정하지 않아도 애플리케이션은 열 번 업데이트될 수 있고, 반대로
# 템플릿을 다시 작성했는데 애플리케이션은 그대로일 수도 있습니다. 오브젝트 이름에는 들어가지 않으며,
# `helm list` 의 출력과 카탈로그 카드에 표시됩니다.
appVersion: "1.0"
