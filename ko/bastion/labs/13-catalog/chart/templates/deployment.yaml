# 랩 13. Deployment 템플릿: 무엇을 몇 개의 복제본으로 실행할지.
#
# templates/ 안의 파일은 완성된 매니페스트가 아니라 초안입니다. Helm은 여기에 값을 대입하고
# 그 결과를 클러스터에 넘깁니다: `helm template main chart`는 아무것도 적용하지 않고 완성된
# 텍스트만 보여주고, `helm install main chart`는 그것을 적용합니다.
#
# 이중 중괄호는 대입 지점입니다. 그 안에는 다음이 나타납니다:
#   .Values.이름  — 파라미터 값: 주문자가 건드리지 않았다면 values.yaml에서,
#                   대시보드의 주문 폼에서 직접 선택했다면 거기에서 가져옵니다;
#   .Release.Name — 릴리스 이름, 즉 차트의 구체적인 배포 하나의 이름.
# 중괄호 바깥의 텍스트는 그대로 매니페스트로 들어갑니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  # 오브젝트 이름은 하드코딩되지 않고 릴리스 이름에서 조합됩니다. 같은 차트를 하나의
  # namespace에 한 번 이상 배포하는데, 고정된 이름이라면 두 번째 주문이 첫 번째를
  # 덮어쓴다는 뜻이 됩니다. 릴리스 `main`은 `main`이라는 이름의 Deployment, Service,
  # ConfigMap을 만들어냅니다 — 이름만 봐도 이들이 한 그룹임이 한눈에 드러납니다.
  name: {{ .Release.Name }}
  # 레이블: name은 이 애플리케이션의 모든 주문에서 동일하고, instance는 주문을 구별합니다.
  # 오브젝트는 이들로 서로를 찾고, `kubectl get` 출력도 이들로 필터링됩니다.
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # 실행 상태로 유지할 복제본 수. 복제본이 사라지면 클러스터는 묻지 않고 새것을 만듭니다 —
  # 여기에서 당직 관리자 없이도 이루어지는 자가 치유가 나옵니다.
  replicas: {{ .Values.replicas }}
  # selector는 Deployment에게 어떤 파드를 자기 것으로 볼지 — 이름이 아니라 레이블로 — 알려줍니다.
  # 여기의 레이블과 template.metadata.labels의 레이블은 반드시 일치해야 합니다. 어긋나면
  # Deployment는 자기 복제본을 찾지 못하고 계속해서 새로 찍어냅니다.
  selector:
    matchLabels:
      app.kubernetes.io/name: guest-pass
      app.kubernetes.io/instance: {{ .Release.Name }}
  # template은 파드의 견본입니다. 아래의 모든 것은 Deployment 자체가 아니라, 그것이 이
  # 견본을 따라 만드는 애플리케이션 복제본을 기술합니다.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guest-pass
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # 파드 어노테이션에 담긴 설정 해시. 이것이 없으면 ConfigMap을 수정해도 파드가
        # 재시작되지 않고, 누군가 손으로 파드를 삭제하기 전까지 새 텍스트가 나타나지 않습니다.
        # 이것이 차트 전반에 대한 가장 흔한 불만입니다.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # 애플리케이션은 root가 아닌 계정으로, 축소된 권한으로 실행됩니다. 카탈로그의 차트는
      # 다른 테넌트가 자기 namespace에 배포하며, 컨테이너의 권한은 애플리케이션과 함께
      # 당신이 그들에게 약속하는 것의 일부입니다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 이미지는 템플릿에 기록되어 있으며 의도적으로 파라미터로 노출하지 않았습니다: 주문자는
          # 크기와 텍스트를 선택하지만, 애플리케이션 자체를 임의의 것으로 바꾸지는 못합니다.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # 이 변수가 없으면 nginx는 노드의 코어마다 워커 프로세스를 하나씩 띄웁니다.
          # 코어가 수십 개인 노드에서는 워커도 수십 개가 되고, 메모리 제한이 수백 메가바이트인
          # 파드는 첫 요청도 받기 전에 OOMKilled로 죽습니다. 차트는 노드가 무엇이든 될 수 있는
          # 다른 테넌트로 배포되므로, 여기서는 이것이 필수입니다.
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # 컨테이너 내부의 포트. http라는 이름은 이후 프로브와 Service에서 사용되어,
          # 포트 번호가 세 군데가 아니라 한 군데에만 기록되게 합니다.
          ports:
            - containerPort: 8080
              name: http
          # requests — 얼마를 보장해서 할당할지; 스케줄러는 이 수치로 노드를 고릅니다.
          # 여기 limits는 메모리에만 있습니다: 초과하면 컨테이너가 죽고 다시 올라옵니다.
          # CPU 제한은 의도적으로 없습니다. 있으면 애플리케이션이 더 느리게 도는 대신
          # 천장에 부딪히기 때문입니다.
          # `| quote` 필터는 대입된 값을 따옴표로 감쌉니다: 사용자가 1을 입력할 수 있는데,
          # 따옴표가 없으면 "1"이나 "100m" 같은 문자열이 와야 할 자리에 숫자가
          # 매니페스트로 들어갑니다.
          resources:
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
            limits:
              memory: {{ .Values.resources.memory | quote }}
          # readinessProbe — 「요청을 받을 준비가 됐는가?」라는 질문. /healthz가 응답하기
          # 전까지 Service는 이 복제본으로 트래픽을 보내지 않습니다. 여기에서 끊김 없는 업데이트가
          # 나옵니다: 새 복제본이 응답한 뒤에야 기존 복제본을 밸런싱에서 빼냅니다.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          # nginx의 페이지와 설정은 ConfigMap에서 파일로 마운트됩니다. subPath는 정확히
          # 파일 하나만 대입합니다: 이것이 없으면 마운트된 디렉터리가 /etc/nginx/conf.d
          # 전체를 덮어써서 이미지의 기본 설정이 사라집니다.
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      # ConfigMap 이름은 릴리스 이름에서 조합되므로, 파드는 항상 이웃의 것이 아니라
      # 자기 주문의 설정을 마운트합니다.
      volumes:
        - name: page
          configMap:
            name: {{ .Release.Name }}
        - name: conf
          configMap:
            name: {{ .Release.Name }}
