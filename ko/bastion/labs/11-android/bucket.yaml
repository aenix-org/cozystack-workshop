---
# 랩 11. 빌드된 APK를 담는 버킷.
#
# 버킷은 오브젝트 스토리지 안의 이름 붙은 영역입니다: 파일은 통째로, HTTP를 통해
# 넣고 가져오며, 어디에도 마운트하지 않습니다. 내부에 디렉터리는 없고, 오브젝트
# 이름 속의 슬래시는 인터페이스에서만 트리로 그려집니다.
#
# 이것은 테넌트 오브젝트입니다: `lab` 클러스터가 아니라 관리 클러스터에 있는 여러분의
# namespace에 존재합니다. 그래서 여기서 필요한 kubeconfig는 테넌트용이며,
# `lab` 클러스터로 작업할 때 쓰는 것이 아닙니다. 이것은 의도된 설계입니다: 빌드 산출물은
# 빌드된 클러스터보다 오래 살아남아야 합니다.
#
# 적용하기 전에 tenant-workshopXX를 여러분의 namespace로 바꾸세요. 그러지 않으면 주문이
# 엉뚱한 테넌트로 가고, 십중팔구 권한 검사를 통과하지 못합니다.
#
#     export KUBECONFIG=~/.kube/config
#     kubectl apply -f bucket.yaml
#
# 같은 작업을 테넌트 대시보드에서 마우스로도 할 수 있습니다 (애플리케이션 생성 -> Bucket).
# 결과는 동일합니다; 차이는 텍스트는 리뷰하고 Git에 넣을 수 있다는 점입니다.
#
# 적용 후 무슨 일이 일어나는가: 플랫폼이 몇 초 만에 버킷을 띄우고 접근 키를 발급하여
# 같은 namespace의 bucket-builds-ci-credentials 시크릿에 넣습니다. 거기서 네 개의 값
# (endpoint, bucketName, accessKey, secretKey)을
# `lab` 클러스터로 손수 옮깁니다 — 클러스터가 다르므로 스스로 옮겨가는 것은 아무것도 없습니다.
apiVersion: apps.cozystack.io/v1alpha1
kind: Bucket
metadata:
  # Cozystack 오브젝트의 이름, 오직 그것뿐입니다. 스토리지 안의 실제 버킷 이름은 플랫폼이
  # 직접 발급합니다 — 길고, bucket-a9209f83-... 형태입니다. 그것이 발급된 시크릿의
  # bucketName 필드에 들어가며, 빌드에 넣어야 하는 것은 바로 그것이지 `builds`가 아닙니다.
  name: builds
  namespace: tenant-workshopXX
spec:
  users:
    # 이 맵의 각 키는 자신만의 키 쌍을 가진 별도의 S3 사용자입니다.
    # 빈 객체는 «읽기와 쓰기 전체 권한»을 의미합니다.
    # 이렇게 하면 빌더에게는 쓰기를, 모바일 팀에게는 읽기 전용만 부여할 수 있습니다:
    #   ci: {}
    #   mobile:
    #     readonly: true
    ci: {}
