# 랩 9 · 출입 기록에 대한 분석을 위한 ClickHouse 데이터베이스 주문.
# 무엇을 얻고 싶은지에 대한 설명; 서비스는 플랫폼이 조립하고 구성합니다.
# 대시보드에서 마우스로 주문하는 것과 동일 — 단지 텍스트로.
# 실습 클러스터가 아니라, 관리 클러스터의 테넌트에 적용됩니다:
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f clickhouse.yaml
#
# 적용하기 전에: tenant-workshopXX를 자신의 네임스페이스로,
# ЗдесьВашПароль를 자신이 생각해낸 비밀번호로 교체하세요.
apiVersion: apps.cozystack.io/v1alpha1
kind: ClickHouse
metadata:
  name: analytics
  namespace: tenant-workshopXX
spec:
  # 복제본 하나와 샤드 하나. 프로덕션에서는 최소 두 개의 복제본을 유지합니다. 그렇지 않으면 노드를 잃을 때
  # 데이터를 사용할 수 없게 됩니다 — 하지만 우리에게 필요한 것은 백만 행이지 장애
  # 내성이 아니며, 추가 복제본은 스탠드의 리소스를 잡아먹기만 할 것입니다.
  replicas: 1
  shards: 1
  # 테이블 데이터용 디스크. 이 랩의 백만 행은 수십 메가바이트를 차지합니다:
  # 사전을 사용한 컬럼 저장은 이러한 로그를 매우 강하게 압축합니다.
  size: 5Gi
  # 쿼리 로그를 포함한 서버 시스템 로그용 별도 디스크.
  logStorageSize: 2Gi
  # 며칠 후에 쿼리 로그를 버릴지. 우리는 그것을 들여다볼 것입니다.
  logTTL: 15
  # replicated — 클러스터의 다른 노드에 복사본이 있는 볼륨: 노드가 빠져나가도
  # 데이터는 남습니다.
  storageClass: replicated
  # CPU 1개, 4GB. ClickHouse는 메모리에서 계산하며, 백만 행에 대한
  # 그룹화에서 이것은 눈에 띕니다.
  resourcesPreset: u1.small
  # 데이터베이스 사용자와 그 비밀번호. 비밀번호는 직접 생각해내고 기억하세요: 이것은
  # 워커 파드(CH_AUTH 변수)와 검사 스크립트(CH_PASSWORD 변수)에 필요합니다.
  # 생성 후에는 대시보드의 clickhouse-analytics-credentials 시크릿에서 볼 수 있습니다.
  users:
    analyst:
      password: ЗдесьВашПароль
  # 오브젝트 스토리지로의 백업. 여기 데이터는 생성된 것이라,
  # 복원할 것이 없습니다 — 교육용 스탠드에서는 비활성화되어 있습니다.
  backup:
    enabled: false
  # Keeper는 복제본 간 조정에 필요합니다. 복제본이 하나뿐이라 조정할
  # 대상이 없으며, Keeper 파드 세 개는 리소스를 헛되이 차지할 것입니다.
  clickhouseKeeper:
    enabled: false
