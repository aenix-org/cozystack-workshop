---
# 랩 6 · 나만의 프라이빗 이미지 레지스트리. 이 파일은 의도적으로 불완전합니다.
#
# 이 파일은 동작하지 않으며, 그것이 의도된 것입니다: 여러분은 실패를 직접 눈으로 보고
# 클러스터에 무엇이 부족했는지 스스로 알아내야 합니다. 여기서 부족한 것은 단 하나 —
# 클러스터가 이미지를 가지러 갈 때 닫힌 레지스트리에게 자신을 무엇이라고 밝히는가입니다.
# 레지스트리는 아무에게나 이미지를 내주지 않으며, 이 설명에는 클러스터가 자신의 권리를
# 증명하도록 도와줄 것이 아무것도 없습니다. 정확히 어느 줄이 이것을 고치는지는 — 랩을
# 진행하면서 알아낼 것입니다; 동작하는 버전은 바로 옆 passes.yaml에 있으며, 실습을 하기
# 전에 그것을 열어보는 것은 의미가 없습니다.
#
# 여기에는 Deployment만 있고 Service는 없습니다: 서비스에 안정적인 이름은 아직 필요 없습니다 —
# 이미지가 다운로드되지 않으니 어차피 응답하는 파드까지 도달하지 못할 것이기 때문입니다.
#
# 여러분의 `lab` 클러스터의 기본 네임스페이스에 적용됩니다:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f passes-broken.yaml
#     kubectl get pods -l app=passes-api -w
#
# 주의: HARBOR-HOST는 플레이스홀더이며, 동작하는 주소가 아닙니다. 여러분의 Harbor 주소로 바꾸세요,
# 그러지 않으면 이 파일이 작성된 목적과 다른 오류를 보게 됩니다 (플레이스홀더가 있는 줄은 두 개입니다):
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # macOS
#
# 아래 객체에서: apiVersion — 설명 스키마의 버전, kind — 무엇을 만드는가,
# metadata.name — 객체 이름. 아래에서 따로 설명하지 않습니다.
#
# Deployment는 "컨테이너를 실행하라"가 아니라 "이런 컨테이너의 복제본을 이만큼 계속 실행 상태로
# 유지하라"입니다. 복제본이 사라지면 — 클러스터가 묻지 않고 새것을 만듭니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # 복제본 하나: 실패를 살펴보는 데는 하나로 충분하며, 로그와 kubectl describe 출력에
  # 잡음이 더 적어집니다.
  replicas: 1
  # "내 복제본은 app: passes-api 레이블이 붙은 파드다"라는 조건. 아래 파드 템플릿의 레이블이
  # 이것과 일치해야 하며, 그렇지 않으면 클러스터가 매니페스트를 거부합니다.
  selector:
    matchLabels:
      app: passes-api
  # 복제본을 찍어내는 템플릿. 그 안의 모든 것이 하나의 파드를 설명합니다.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # 파드 전체에 대한 보안 제약: root로 실행하지 않고, 비특권 사용자 10001로 동작하며,
      # 시스템 호출 집합을 표준 프로파일로 제한합니다. 이미지도 이에 맞게
      # 빌드되어 있습니다 (app/Dockerfile의 USER 줄 참조).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # 컨테이너 수준의 권한: 스스로에게 추가 특권을 부여하지 않고 모든 특수한
          # 커널 capability를 버립니다. 애플리케이션에는 네트워크 포트 하나만 필요하고 나머지는 불필요합니다.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 이미지 이름의 첫 부분은 레지스트리 주소입니다. 바로 그래서 자신의 레지스트리로
          # 옮기면 매니페스트가 바뀝니다: 이미지 이름이 달라집니다. 주소가 없었다면
          # 클러스터는 이미지를 가지러 Docker Hub로 — 즉 보안팀이 금지한 곳으로 갔을 것입니다.
          image: HARBOR-HOST/passes/passes-api:v1
          # 애플리케이션 포트. 이름 `http`는 아래에서 준비성 프로브가 사용하므로,
          # 포트 번호는 두 곳이 아니라 한 곳에 지정됩니다.
          ports:
            - containerPort: 8080
              name: http
          # 애플리케이션이 자신이 누구이고 어디에서 왔는지 알게 되는 환경 변수들.
          # 애플리케이션은 바로 이것들을 응답에 출력합니다 (app/main.go의 identity 구조체 참조).
          # APP_VERSION과 IMAGE_REGISTRY는 텍스트로 지정됩니다 — 우리가 직접 씁니다; 다음 세 개는
          # 복제본이 시작되는 순간 클러스터가 직접 채우며, 애플리케이션은 그것들을 알 방법이 없습니다.
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — 복제본에 예약할 것: 스케줄러는 이 숫자로 노드를 고릅니다.
          # limits — 상한: 메모리가 상한을 넘으면 컨테이너가 종료되고, CPU는
          # 스로틀링됩니다. 16Mi로 충분한 이유는 애플리케이션이 의존성 없는 Go로
          # 작성되었기 때문입니다. 20m은 CPU 코어의 천분의 이십입니다.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # 준비성 프로브: 애플리케이션이 /healthz에 응답하기 전까지는 복제본으로 트래픽이
          # 흐르지 않습니다. 오늘은 여기까지 오지 못합니다 — 이것은 이미 실행 중인
          # 프로세스를 확인하는데, 우리에게는 더 이른 단계인 이미지 다운로드에서 막힐 것입니다.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
