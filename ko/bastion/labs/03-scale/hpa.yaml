---
# 랩 3. CPU 부하에 따라 레플리카를 늘립니다.
# 목표는 requests.cpu(20m)의 50%, 즉 파드당 임계값은 10m입니다.
# 의도적으로 낮게 잡았습니다: 부하가 몇 초 안에 작동해야 하며,
# 랩에는 반나절이 아니라 30분밖에 없습니다.
#
# 단일 객체. 관리 클러스터의 테넌트가 아니라 여러분의 학습 클러스터 `lab`에 적용됩니다:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f hpa.yaml
# tenant-workshopXX 같은 플레이스홀더는 여기에 없습니다 — 어디에도 자기 번호를 넣을 필요가 없습니다.
#
# 이 객체가 생성은 되지만 동작하지 않게 되는 두 가지 조건:
#   1. rickroll 컨테이너에 requests.cpu가 설정되어 있어야 합니다 — 그렇지 않으면 백분율을 계산할 기준이 없고,
#      `kubectl get hpa`의 TARGETS 열에 영원히 <unknown>이 남습니다.
#   2. 클러스터에서 metrics-server가 실행 중이어야 합니다 — 파드의 현재 소비량 소스입니다.
# 두 조건 모두 이 폴더의 check.sh가 확인합니다.
#
# HPA가 존재하는 동안 Deployment의 replicas 필드는 HPA의 것입니다. `kubectl scale`로 손수
# 복제본 수를 바꿀 수는 있지만, HPA가 몇 초 안에 자기 값으로 되돌립니다.
# 그래서 랩 4에서는 롤아웃 전에 이 객체를 삭제합니다: 하나의 필드에 두 메커니즘 —
# 무슨 일이 일어났는지 이해하지 못하게 되는 확실한 방법입니다.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # HPA 이름이 애플리케이션 이름과 일치할 필요는 없습니다 — 여기서 일치시킨 것은 편의를 위해서입니다.
  # 무엇을 관리할지는 이 이름이 아니라 아래의 scaleTargetRef가 정합니다.
  name: rickroll
spec:
  # 무엇을 관찰하고 누구의 replicas 필드를 바꿀지. 세 필드가 함께 있는 이유는 타입 없는
  # 이름은 모호하기 때문입니다: Deployment와 StatefulSet이 같은 이름을 가질 수 있습니다.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rickroll
  # 어떤 부하에서도 HPA가 벗어나지 않는 범위. 하한은 랩이 시작할 때와 같은
  # 한 개의 복제본입니다. 상한은 여섯 개: limits.cpu 300m에서 학습 노드에
  # 그만큼이 들어가고, 파드 목록에서 눈으로도 눈에 띕니다.
  # maxReplicas: 1로 설정하면 — 객체는 생성되지만 아무것도 하지 않습니다.
  minReplicas: 1
  maxReplicas: 6
  # 무엇을 근거로 결정할지. 메트릭은 여러 개일 수 있으며, 그럴 때 HPA는 더 많은
  # 복제본 수를 요구하는 것을 선택합니다. 여기서는 하나뿐입니다 — CPU입니다.
  metrics:
    - type: Resource
      resource:
        name: cpu
        # Utilization — 노드 용량이 아니라 컨테이너 requests.cpu에 대한 비율입니다.
        # 여기서 직관적이지 않은 결과가 나옵니다: 값이 아무렇지 않게 600%가 되기도 하며, 이는
        # 오류가 아닙니다: 파드가 예약한 것보다 여섯 배 더 소비하는 것입니다.
        # 대안은 AverageValue이며, 여기서는 임계값을 밀리코어로 직접 지정합니다.
        target:
          type: Utilization
          averageUtilization: 50
  # 얼마나 민첩하게 반응할지. 이 블록은 선택 사항입니다: 없으면 기본값이
  # 사용되며, 이는 시연이 아니라 실전 운영을 염두에 둔 값입니다.
  behavior:
    scaleUp:
      # 기본적으로 Kubernetes는 안정화를 기다리며 천천히 늘립니다.
      # 랩에서는 이것이 «아무 일도 일어나지 않는» 것처럼 보이므로 속도를 높입니다.
      stabilizationWindowSeconds: 0
      # 15초마다 새 복제본은 두 개를 넘지 않습니다. 이 단계는 경험적으로
      # 정했습니다: 증가가 한 개에서 곧바로 여섯 개로 순식간에 도약하는 것이 아니라 증가로 보이며,
      # 그런 도약에서는 참가자가 살펴볼 것이 없습니다.
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      # 반면 축소는 반대로 — 즉시가 아닙니다. 그렇지 않으면 참가자가 파드를
      # 살펴보기도 전에 파드가 사라집니다.
      # 기본값 5분 대신 1분: 랩은 30분 동안 진행되며, 축소를 기다리며
      # 그중 5분을 채울 것이 없습니다. 운영 클러스터에서는 긴 윈도우가 오히려 유용합니다 —
      # 고르지 않은 부하에서 요동을 잠재웁니다.
      stabilizationWindowSeconds: 60
