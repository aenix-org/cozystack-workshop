---
# 랩 5 · Git 안의 인프라. 「출입증」 서비스 자체: 한 파일에 담긴 네 개의 오브젝트.
#
# 손으로 클러스터에 적용하지 않습니다. 파일은 GitHub의 자체 저장소, apps/ 폴더 안
# namespace.yaml 옆에 놓이고, `lab` 클러스터로는 Flux가 알아서 옮깁니다:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# --- 줄이 오브젝트를 구분합니다: 한 파일, 네 개의 독립된 오브젝트. 파일 안의 순서는
# 생성 순서에 영향을 주지 않습니다 — 클러스터가 알아서 해결합니다.
#
# 각 오브젝트에서: apiVersion — 설명 스키마의 버전, kind — 무엇을 만드는지,
# metadata.name — 오브젝트의 이름, metadata.namespace — 클러스터의 어느 칸막이에서
# 그것이 사는지. 이후로는 이 필드들을 따로 설명하지 않습니다.
#
# 네 오브젝트 어디에도 비밀번호도, 키도, 토큰도 없으며, 이는 우연이
# 아닙니다: Git에 들어간 것은 영원히 남습니다 — 히스토리는 다시 쓸 수 있지만,
# 클론한 사람 모두에게 예전 사본이 남습니다. 시크릿이 있을 곳이 아닙니다.

# --- 4개 중 1. 웹 서버 설정 --------------------------------------------------
# ConfigMap은 애플리케이션과 별도로 텍스트 파일을 클러스터에 넣고, 아래(volumes
# 섹션)에서 이 파일이 컨테이너 안으로 끼워집니다. 요점은 이미지를 다시 빌드하지 않고
# 설정을 바꾸는 것: 여기서 고치고, 커밋하면, 1분 뒤 클러스터에 새 버전이 생깁니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-conf
  namespace: passes
# data 안의 키는 컨테이너에서 파일 이름이 됩니다: default.conf는 nginx가 시작 시
# 읽는 폴더에 놓입니다. 이름 뒤의 세로 막대는 YAML에서 여러 줄 텍스트를 줄바꿈을
# 보존한 채 그대로 적는 방법입니다.
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      # 준비 상태 확인용 주소. 클러스터가 여기를 두드리고, 응답을 받기 전까지는
      # 사본으로 트래픽을 보내지 않습니다.
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        # 내보내는 페이지에서 __POD__를 nginx가 동작하는 머신의 이름으로 바꿉니다.
        # 파드 안에서 머신 이름은 파드 자신의 이름입니다.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
    }
---
# --- 4개 중 2. 서비스가 내보내는 페이지 ----------------------------------------
# 이 랩에서 페이지는 자리표시자입니다: 진짜 애플리케이션은 나중에 등장합니다. 지금
# 중요한 건 서비스가 무엇을 보여주느냐가 아니라, 그것이 클러스터에 어디서 왔느냐입니다.
# 마크업 안의 __POD__ 텍스트는 치환용 표식입니다: nginx가 페이지를 내보낸 파드의 이름으로
# 그것을 바꾸고, 그 이름으로 나중에 사본이 한 개보다 많아진 것을 보게 됩니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-page
  namespace: passes
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Пропуск</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 40rem;
               color: #222; }
        h1 { font-weight: 600; }
        .v { display: inline-block; padding: .2rem .6rem; border-radius: .3rem;
             background: #eef; font-family: ui-monospace, monospace; }
        .pod { margin-top: 2rem; color: #666; font-size: .9rem; }
        b { font-family: ui-monospace, monospace; color: #222; }
      </style>
    </head>
    <body>
      <h1>Сервис «Пропуск»</h1>
      <p>Заказ пропуска для гостя. Версия <span class="v">v1</span></p>
      <p>Развёрнуто из Git. Руками сюда никто не ходил.</p>
      <div class="pod">вас обслужил под <b>__POD__</b></div>
    </body>
    </html>
---
# --- 4개 중 3. 애플리케이션 자체의 명세 ---------------------------------------------
# Deployment는 「컨테이너를 실행하라」가 아니라 「이러이러한 컨테이너의 사본을 몇 개
# 실행된 채로 유지하라」입니다. 차이는 사본이 죽을 때 드러납니다: 클러스터가 묻지도
# 알리지도 않고 새것을 만듭니다. vSphere에서는 HA가 가장 가깝지만, 거기서는 머신이
# 재시작되고, 여기서는 애플리케이션 사본이 다시 만들어지며, 그것도 장애 시가 아니라 늘 이뤄집니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes
  namespace: passes
  labels:
    app: passes
spec:
  # 사본을 몇 개 실행된 채로 유지할지. 표현이 중요합니다: 「하나 실행하라」가 아니라
  # 「하나 유지하라」. 이 숫자를 Git으로 바꿔 무슨 일이 생기는지 보게 됩니다.
  replicas: 1
  # Deployment가 자기 사본을 무엇으로 알아보는지. 이것은 파드 이름 목록이 아니라 —
  # 이름은 다시 만들어질 때마다 바뀝니다 — 「app: passes 레이블이 붙은 모든 파드」라는 조건입니다.
  # 아래 template.metadata.labels의 레이블은 이 조건과 일치해야 합니다: 어긋나면
  # 클러스터가 매니페스트 받기를 거부합니다, 사본이 주인 없는 것이 되기 때문입니다.
  selector:
    matchLabels:
      app: passes
  # template — 사본을 찍어내는 본. 그 안의 모든 것이 파드 하나를 명세합니다. 본을 고치면
  # 새 버전 배포를 뜻합니다: 예전 사본이 새것으로 교체됩니다.
  template:
    metadata:
      labels:
        app: passes
    spec:
      # 파드 전체 수준의 보안 제약. vSphere에는 대응물이 없습니다: 거기서는 격리가
      # 하이퍼바이저로 주어지지만, 컨테이너는 노드와 커널을 공유하므로 권한을
      # 명시적으로 잘라내야 합니다.
      #   runAsNonRoot   이미지가 root로 동작하려 하면 실행하지 않음
      #   runAsUser      어느 숫자 사용자로 동작할지; 65532는 최소 이미지에서
      #                  통용되는 「비특권」 식별자
      #   seccompProfile 어떤 시스템 콜이 허용되는지; RuntimeDefault는 명백히
      #                  위험한 것을 차단하고 아무것도 망가뜨리지 않는 집합
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # 같은 제약이지만 이제는 특정 컨테이너에 대해.
          #   allowPrivilegeEscalation: false  프로세스가 스스로 권한을 더 얻을 수 없음
          #   capabilities.drop: ["ALL"]       모든 특별한 커널 권한을 회수
          #                                    (네트워크 변경, 마운트, 시간 변경);
          #                                    웹 서버에는 그중 어느 것도 필요 없음
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 이미지는 공개 레지스트리에서 가져옵니다 — 다음 랩에서 정보보안이 이를 금지하고,
          # 주소가 자체 Harbor로 바뀝니다. unprivileged 변형은 멋 때문에 고른 게 아닙니다:
          # 보통의 nginx 이미지는 80번 포트를 열고 그러기 위해 root 권한을 원하는데,
          # 위의 runAsNonRoot로는 아예 시작조차 못했을 겁니다.
          # 버전은 latest가 아니라 고정(1.27-alpine)입니다: 그러지 않으면 같은
          # 매니페스트가 내일 다른 애플리케이션을 배포해도 당신은 그걸 모릅니다.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # 애플리케이션이 여는 포트. 이름 `http`는 장식이 아닙니다: 아래의 준비 상태
          # 확인과 파일 끝의 Service가 그것을 참조합니다. 포트 번호를 바꾸면 세 군데가
          # 아니라 한 군데에서 바꾸면 됩니다.
          ports:
            - containerPort: 8080
              name: http
          # requests — 자원을 얼마나 확실히 예약할지; 스케줄러가 이 숫자로 노드를 고릅니다.
          # limits — 그 위로는 통과시키지 않는 상한. requests를 낮추면 노드가 감당할 수
          # 있는 것보다 많이 실린다는 뜻이고; 메모리 limits 초과 시 — 컨테이너가 죽고,
          # CPU 초과 시 — 느려집니다.
          # 20m = 코어의 20/1000, Mi = 메가바이트. 여기 값이 작은 건 랩의 노드가 하나뿐이고
          # 크지 않기 때문입니다.
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # 준비 상태 확인: 클러스터가 이 주소를 두드리고, 응답을 받기 전까지는 사본으로
          # 트래픽을 보내지 않습니다. 이것이 없으면 Service가 아직 뜨지 않은 nginx로 요청을
          # 보내고, 사용자는 배포 때마다 오류를 보게 됩니다.
          # Flux도 그것을 기다립니다 — kustomization.yaml에서 우리가 wait: true를 요청했습니다.
          #   initialDelaySeconds  첫 두드림 전에 기다려 프로세스가 시작할 시간을 줌
          #   periodSeconds        이후 얼마나 자주 두드릴지
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # 파일 앞부분의 두 ConfigMap 내용을 컨테이너 안 어디에 놓을지. /etc/nginx/conf.d —
          # nginx가 시작 시 설정을 읽는 폴더, /usr/share/nginx/html — 파일을 내보내는 폴더.
          # 이때 이미지 자체는 바뀌지 않습니다: 파일은 실행되는 순간에 그 안에 나타납니다.
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: page
              mountPath: /usr/share/nginx/html
      # 정확히 무엇을 끼울지. 이름 conf와 page는 내부용으로, 이 블록을 위의 volumeMounts와
      # 연결합니다; configMap 안의 name은 이미 클러스터의 실제 오브젝트 이름입니다.
      # 여기서 틀리면 파드는 존재하지 않는 ConfigMap을 기다리며 매달려 있게 됩니다.
      volumes:
        - name: conf
          configMap:
            name: passes-conf
        - name: page
          configMap:
            name: passes-page
---
# --- 4개 중 4. 모든 사본이 뒤에 서 있는 변하지 않는 이름 -----------------------------
# 파드는 다시 만들어지고, 주소는 매번 새것입니다. Service는 변하지 않는 이름을 줍니다 —
# passes.passes.svc.cluster.local — 그 이름으로 클러스터 안에서는 언제나 살아 있는 사본에
# 닿을 수 있습니다. 이것은 내부 로드밸런싱이며, 클러스터 밖에서는 아직 여기 닿지 못합니다.
apiVersion: v1
kind: Service
metadata:
  name: passes
  namespace: passes
spec:
  # Service와 파드의 연결은 주소 목록이 아니라 「app: passes 레이블이 붙은 모든 파드」라는
  # 조건입니다. 그런 레이블이 붙은 새 사본이 나타나면 — 스스로 로드밸런싱에 들어가며,
  # 아무것도 등록할 필요가 없습니다. 사라지면 — 대상에서 빠집니다.
  selector:
    app: passes
  # port — Service 자신이 응답하는 포트, targetPort — 컨테이너 안 어디로 전달하는지.
  # 여기서 targetPort는 위 ports 블록의 이름 `http`를 참조하며, 번호가 아닙니다: 번호는
  # 한 군데에서 바꿀 수 있고, 연결은 끊어지지 않습니다.
  ports:
    - port: 80
      targetPort: http
