---
# 랩 5 · Git 안의 인프라. 「출입증(Пропуск)」 서비스를 위한 네임스페이스.
#
# 이 파일은 손으로 직접 클러스터에 적용하지 않습니다. GitHub의 자기 리포지토리
# apps/ 폴더에 넣으면, Flux가 스스로 예정된 일정에 따라 `lab` 클러스터로 옮깁니다:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# 어떤 매니페스트든 읽는 법: apiVersion — 기술 스키마의 버전(클러스터가 이 값으로
# 객체를 어떻게 파싱할지 압니다), kind — 무엇을 생성하는지, metadata.name — 이후
# 객체를 찾을 때 쓰는 이름. 이 세 필드는 모든 객체에 존재하며 아래에서는 따로
# 설명하지 않습니다.
#
# 네임스페이스(namespace)는 하나의 클러스터 안의 논리적 칸막이입니다: 고유한 이름
# 가시 범위, 고유한 권한, 고유한 쿼터. vSphere에서 가장 가까운 것은 vCenter 트리의
# 폴더 또는 resource pool입니다.
#
# 왜 이것이 애플리케이션과 함께 Git에 있고 손으로 만들지 않는가: 서비스가
# 리포지토리에서 빠지면 Flux가 네임스페이스도 함께 제거합니다. 반년 뒤에 왜
# 만들어졌는지 아무도 기억하지 못하는 빈 칸막이가 남지 않습니다.
apiVersion: v1
kind: Namespace
metadata:
  name: passes
  # 이 레이블은 서비스 동작에 영향을 주지 않습니다 — 「출입증」과 관련된 모든 것을
  # 한 번의 명령으로 찾기 위해 필요합니다: kubectl get all -A -l app.kubernetes.io/part-of=passes.
  # part-of 이름은 우리가 지어낸 것이 아니라 Kubernetes의 공통 레이블 집합에서
  # 가져온 것입니다: 외부 도구(모니터링, 익스포트)가 바로 이 이름을 찾습니다.
  labels:
    app.kubernetes.io/part-of: passes
