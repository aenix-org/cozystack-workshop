---
# 랩 5 · Git 안의 인프라. 소스: Flux가 원하는 상태를 어디서 가져오는가.
#
# 옆에 있는 kustomization.yaml과 함께 여러분의 `lab` 클러스터에 적용됩니다:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# 주의: 적용하기 전에 url을 여러분 소유 저장소의 주소로 바꾸세요. 문자열
# ЗАМЕНИТЕ-МЕНЯ 는 자리표시자이며, 그대로 두면 Flux가 존재하지 않는 주소로 가서
# 오류로 멈춥니다. 브랜치도 확인하세요: GitHub은 새 저장소를 main 브랜치로 만듭니다.
#
# 모든 객체에서: apiVersion 은 설명 스키마의 버전, kind 는 무엇을 만드는지,
# metadata.name 은 이후 객체를 참조할 때 쓰는 이름입니다. 아래에서는 반복하지 않습니다.
#
# 이 객체의 유일한 임무는 클러스터에 저장소의 최신 복사본을 유지하는 것입니다.
# 아무것도 적용하지 않고 다운로드만 합니다. 적용은 옆의 Kustomization이 하며,
# 그것이 이 객체를 `passes` 라는 이름으로 참조하므로 이름은 혼자 바꿀 수 없습니다.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: passes
  # flux-system 은 flux install 명령이 만든 네임스페이스이며, 여기에
  # Flux 서비스 자체가 삽니다. 설정 객체도 여기에 두어야 하며, 아니면 서비스가 보지 못합니다.
  namespace: flux-system
spec:
  # 새 상태를 얻으러 Git으로 얼마나 자주 갈지. 1분은 랩용입니다.
  # 실무에서는 보통 1~5분이고, 즉각적인 반응은 GitHub의 웹훅으로 만듭니다.
  interval: 1m
  # 저장소 주소. 공개 저장소이므로 로그인도 키도 여기 없습니다 —
  # 이는 학습 스탠드의 단순화입니다. 실무에서는 저장소가 비공개이고, 그 옆에
  # 배포 키가 담긴 시크릿에 대한 참조가 나타납니다(secretRef 필드).
  url: https://github.com/ЗАМЕНИТЕ-МЕНЯ/passes-gitops
  # 어느 브랜치를 진실의 원천으로 삼을지. main에 병합된 것이 클러스터로 갑니다.
  # 다른 브랜치에 있는 것은 가지 않습니다. 여기서 리뷰가 나옵니다: 변경은
  # 먼저 자기 브랜치에 살면서 검토할 수 있고, main으로의 병합만이
  # 그것을 유효하게 만듭니다. 저장소가 예전의 master 브랜치로 만들어졌다면 —
  # 여기서 고치세요. 아니면 Flux가 읽을 것을 찾지 못합니다.
  ref:
    branch: main
