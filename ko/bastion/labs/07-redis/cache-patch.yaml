---
# 랩 7 · 캐시를 실제로 활성화하기. 이미 배포된 passes-api 위에 적용됩니다
# 당신의 `lab` 클러스터에서(export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch.yaml
#
# 이것은 전체 매니페스트가 아니라 패치입니다: 여기에는 바뀌는 부분만 기술되어 있습니다. 나머지 전부 —
# 이미지, 레이블, 프로브, 리소스 — 는 passes-api.yaml에서 그대로 유지됩니다. 그래서 이 파일은
# 바로 spec부터 시작합니다: 컨테이너까지의 경로는 Deployment 구조를 그대로 따라가므로,
# 클러스터가 정확히 어디에 수정을 적용해야 하는지 이해할 수 있습니다.
#
# 컨테이너 이름 `api`는 장식이 아니라 주소입니다: 클러스터는 이것으로 목록에서 올바른 컨테이너를
# 찾습니다. 이름을 틀리면 수정 대신 두 번째 컨테이너가 생깁니다.
#
# REDIS-ADDR 대신 당신의 Redis 주소를 넣으세요 — 이것은 자리표시자이며 호스트 이름이 아닙니다.
# 주소는 대시보드에서, 당신의 managed Redis 애플리케이션 카드에서 얻습니다.
spec:
  template:
    spec:
      containers:
        - name: api
          # Kubernetes에서 env 목록은 name 필드를 기준으로 병합되므로, 아래 세 항목은
          # Deployment에 이미 있는 것들을 대체하지 않고 거기에 추가됩니다.
          env:
            # 이 변수가 나타나는 것이 바로 «캐시 켜기»입니다: 애플리케이션은 시작 시 이것을 확인하고,
            # 설정되어 있으면 먼저 Redis로 갑니다. 비어 있거나
            # 없으면 — 이전처럼, 매 요청마다 디렉터리를 통해 동작합니다.
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
            # 비밀번호는 텍스트로 쓰지 않습니다: 그것은 당신이 별도의 명령으로
            # 생성할 시크릿에서 옵니다. Git에 놓여 있는 매니페스트에는
            # 비밀번호가 있을 자리가 없습니다.
            #
            # secretKeyRef는 참조입니다: name — 같은 클러스터에 있는 시크릿 객체의 이름,
            # key — 그 안의 어떤 필드를 가져올지. 값은 파드가 시작될 때 대입되며
            # 파일에는 결코 나타나지 않습니다.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
            # 항목이 캐시에 몇 초 동안 사는지. 육십 — 왜냐하면
            # 직원 디렉터리는 초당 한 번이 아니라 하루에 한 번 바뀌기 때문입니다.
            #
            # 기간이 길수록 — 디렉터리에 덜 자주 가지만, 오래된 성(姓)을
            # 더 오래 제공합니다. 짧을수록 — 데이터는 더 신선하지만, 이득은 더 작습니다. 이것은 절충이지,
            # 올바른 값이 하나 있는 설정이 아닙니다.
            - name: CACHE_TTL
              value: "60"
