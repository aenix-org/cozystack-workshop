---
# 랩 7 · 레거시 직원 디렉터리의 스텁.
# 실제 상황에서는 여러분이 다시 작성하도록 허락받지 못할 남의 시스템입니다: 응답에 800ms가 걸리고,
# 어떻게든 그것과 함께 살아가야 합니다. 여기서는 측정할 대상이 있도록 동일한 동작을 가진 스텁을 둡니다.
#
# 적용 위치: Cozystack 관리 클러스터가 아니라, 여러분의 `lab` 클러스터(export KUBECONFIG=~/lab.kubeconfig)입니다.
# 명령: kubectl apply -f hr-legacy.yaml
#
# HARBOR-HOST는 주소가 아니라 자리표시자입니다. 여러분 자신의 Harbor 주소로 치환하세요. 그렇지 않으면 클러스터가
# 존재하지 않는 호스트에서 이미지를 내려받으려 시도합니다:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # macOS
#
# 이 파일에는 `---` 줄로 구분된 두 개의 객체가 있습니다: Deployment(무엇이 몇 개의 복사본으로 실행되는지)와
# Service(그 복사본들에 도달하는 데 쓰이는 영구적인 이름). 각 객체에서 apiVersion과 kind는 어떤 종류의 객체인지를
# 말하고, metadata.name은 그것이 무엇이라 불리는지를 말합니다. 이후 아래에서는 이 세 필드에 주석을 달지 않습니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-legacy
  labels:
    app: hr-legacy
spec:
  # 몇 개의 복사본을 계속 실행할지. 복사본이 사라지면 클러스터는 묻지 않고 새 것을 만듭니다.
  # 디렉터리에는 하나면 충분합니다: 여기서는 부하가 아니라 측정을 위한 것이니까요.
  replicas: 1
  # 이 레이블로 Deployment는 클러스터의 다른 모든 것 사이에서 자신의 파드들을 알아봅니다.
  # selector의 레이블과 아래 template의 레이블은 반드시 일치해야 합니다. 그렇지 않으면 객체는
  # 자기 자신이 만든 것을 찾지 못합니다.
  selector:
    matchLabels:
      app: hr-legacy
  # template은 파드 템플릿입니다. 아래의 모든 것은 하나의 복사본을 설명합니다: 무엇으로 조립할지,
  # 어떤 권한으로 실행할지, 그리고 그것이 요청을 받을 준비가 되었는지 어떻게 알지.
  template:
    metadata:
      labels:
        app: hr-legacy
    spec:
      # 파드 수준의 보안 요구사항. 프로세스는 root가 아니라(uid 10001)로 실행되고,
      # seccomp 프로파일은 애플리케이션에 필요 없는 시스템 콜을 차단합니다.
      # 정책이 활성화된 클러스터에서는 이 필드들이 없는 파드는 아예 시작되지 않습니다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Harbor는 로그인과 비밀번호로 잠겨 있고, 클러스터는 어떻게든 자신을 밝혀야 합니다. `harbor`
      # 시크릿은 레지스트리 랩에서 만들었습니다. 이 참조가 없으면 이미지가 내려받아지지 않고,
      # 파드는 ImagePullBackOff 상태로 남습니다.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: hr
          # 파드 수준과 같지만 특정 컨테이너에 대한 것입니다: 권한 상승을 금지하고
          # 모든 커널 capability를 제거합니다. Go 애플리케이션에는 그중 어느 것도
          # 필요하지 않습니다.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 이미지는 디렉터리와 «출입증» 서비스 자체에 대해 동일합니다.
          # 어떤 프로세스가 실제로 시작되는지는 아래의 MODE 변수가 결정합니다.
          image: HARBOR-HOST/passes/passes-api:v2
          # 포트에는 번호뿐 아니라 이름이 있습니다: 준비성 프로브와 아래의 Service가
          # 이름을 참조합니다. 번호가 바뀌면 한 곳에서만 고치면 됩니다.
          ports:
            - containerPort: 8080
              name: http
          # 환경 변수는 이 애플리케이션을 설정하는 유일한 방법입니다.
          # 동작을 바꾸려고 이미지를 다시 빌드할 필요는 없습니다.
          env:
            # MODE=hr — 인스턴스가 HR 시스템인 척합니다: 기다렸다가 응답합니다.
            - name: MODE
              value: "hr"
            # 실제 디렉터리가 보여주는 바로 그 지연.
            # 이것을 바꾸면 «상황이 얼마나 나쁜지»를 바꾸게 됩니다 — 나중에 2s를 시도해 보세요.
            - name: HR_DELAY
              value: "800ms"
            # 파드는 자신의 이름을 미리 알지 못합니다 — 클러스터가 생성 시 할당합니다.
            # fieldRef는 그 이름을 시작 시점에 변수에 주입하고, 그것은
            # 서비스의 응답에 담깁니다: 어느 복사본이 응답했는지 볼 수 있습니다.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # requests — 노드를 선택할 때 컨테이너에 예약되는 리소스의 양,
          # limits — 그 위로는 허용되지 않는 상한. vSphere의 reservation과
          # limit과 비슷하지만, 가상 머신이 아니라 컨테이너 단위로 설정됩니다.
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # 준비성 프로브. /healthz가 응답하기 전까지 Service는 이 복사본으로 단 하나의
          # 요청도 보내지 않습니다. 프로브가 없으면 트래픽은 아직 시작되지 않은 프로세스로 가고,
          # 여러분은 «모든 것이 배포되었는데도» 난데없이 오류를 보게 됩니다.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — 파드 집합을 위한 영구적인 이름과 영구적인 주소. 파드는 다시 생성되고
# 매번 새 IP를 받지만, hr-legacy라는 이름은 그대로입니다. 로드 밸런서의 VIP와
# 비슷하지만, 네 줄로 설정되고 클러스터 안에서 살아갑니다.
apiVersion: v1
kind: Service
metadata:
  name: hr-legacy
spec:
  # 이 레이블로 Service는 살아 있는 복사본들의 목록을 모읍니다. 위의 파드와 같은 레이블입니다:
  # 일치하지 않으면 Service는 존재하되 아무 곳으로도 이어지지 않습니다.
  selector:
    app: hr-legacy
  ports:
    # 요청은 80번 포트로 들어오고, 파드 내부에서는 http라는 이름의 포트(8080)로 갑니다.
    - port: 80
      targetPort: http
