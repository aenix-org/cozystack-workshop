---
# 랩 7 · 웹 UI가 있는 부하 생성기.
# 스케일링 랩에서 쓴 것과 같은 도구다: 부하는 브라우저의 버튼으로 시작하고,
# 지연 시간 히스토그램도 바로 그 자리에서 볼 수 있다. 이미 배포되어 있다면 이 파일을
# 적용할 필요가 없다. kubectl이 «unchanged»라고 답할 것이다.
#
# 적용 위치: 당신의 `lab` 클러스터 (export KUBECONFIG=~/lab.kubeconfig).
# 명령: kubectl apply -f fortio.yaml
#
# `---`로 구분된 두 오브젝트: Deployment(생성기 자체)와 Service(생성기에 접근할 때
# 쓰는 이름). apiVersion, kind, metadata.name은 아래에서 더 이상 설명하지 않는다.
#
# 이미지는 당신의 Harbor가 아니라 공개 Docker Hub에서 가져온다: Fortio는 «Пропуск»
# 서비스의 일부가 아니라 클러스터에 일시적으로 존재하는 계측 장비이기 때문이다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # 복제본 하나. 부하 생성기는 스케일링할 필요가 없다 — 필요한 것은 이것 하나가
  # 지연 시간을 정직하게 계산하는 것이다. 복제본이 둘이면 합쳐지지 않은 히스토그램 둘이 나온다.
  replicas: 1
  # Deployment가 자신의 파드를 인식하는 레이블. 아래 template의 레이블과 일치한다.
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # 나머지 모든 것과 동일한 보안 요구 사항: 프로세스는 root로 실행되지 않고,
      # 시스템 호출은 seccomp 프로파일로 제한된다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 여기서 `latest` 태그는 워크숍을 위한 단순화이며, 자체 레지스트리 랩이 가르치는
          # 것과 모순된다: 이 태그의 이미지는 두 번의 apply 사이에 눈에 띄지 않게 바뀔 수
          # 있고, 어제의 측정값은 재현 불가능해진다. 학습용 스탠드의 부하 생성기라면
          # 이는 허용되지만, 운영 시스템에서는 그렇지 않다.
          image: fortio/fortio:latest
          # `server`는 Fortio가 웹 인터페이스를 띄우고 당신이 버튼을 누를 때까지 기다리는
          # 모드다. 이 인자가 없으면 이미지는 일회성 명령을 실행하고 종료된다.
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # 생성기에는 CPU 여유가 필요하다. 그렇지 않으면 자기 자신의 한계에
              # 부딪혀서 애플리케이션이 아니라 Fortio를 부하 주게 된다.
              cpu: "1"
              memory: 256Mi
---
# Service는 웹 인터페이스를 열기 위해 필요하다: 생성기에는 포트 포워딩으로 이름을 통해
# 접근하고 — kubectl port-forward svc/fortio 8081:8080 — localhost:8081로 들어간다.
# Service 없이도 kubectl exec deploy/fortio 명령으로 서비스를 두들길 수 있지만,
# 브라우저에서 히스토그램을 얻으려면 이 경로뿐이다.
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  # 여기서는 Service의 번호와 컨테이너 포트가 일치한다 — 밖은 80, 안은 8080인
  # 랩의 다른 서비스들과 달리. 차이는 단지 편의상일 뿐이다.
  ports:
    - port: 8080
      targetPort: http
