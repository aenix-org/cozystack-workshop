# 랩 8 · 3단계 중 3단계: 매니페스트에 비밀번호가 없습니다 — 평문으로도, base64로도.
# 최종 버전. 이 파일은 Git에 커밋하고, 협력업체에 보여주고, 티셔츠에
# 인쇄해도 됩니다.
#
# 이 단계가 2단계와 다른 점: 거기서는 값이 어쨌든 기록되었습니다 — 파일에,
# 그다음 클러스터 객체에. 여기서는 설명에 값이 전혀 없습니다; 애플리케이션이
# 비밀번호를 직접, 시작 시점에, OpenBao 저장소에서 가져옵니다.
#
#   secrets-demo-naive.yaml      파일을 연 사람이라면 누구나 비밀번호를 볼 수 있습니다
#   secrets-demo-secret.yaml     비밀번호가 Secret 객체로 분리되었습니다
#   secrets-demo.yaml         <- 현재 위치: 비밀번호가 시작 시 저장소에서 도착합니다
#
# 적용 전에: tenant-workshopXX를 자신의 namespace로 바꾸세요 — 아래 저장소
# 주소에 포함됩니다. XX는 이름의 일부가 아니라 자리표시자입니다.
# 적용 위치: 당신의 `lab` 클러스터 (export KUBECONFIG=~/lab.kubeconfig).
# 명령: kubectl apply -f secrets-demo.yaml
#
# 애플리케이션이 저장소에 자신을 증명하는 토큰은 passes-bao-token 시크릿에 있습니다.
# 파일이 아니라 명령으로 생성합니다: 이 매니페스트에는 객체 이름만 있고,
# 이름은 비밀이 아닙니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # 모든 것이 non-root로 실행됩니다. fsGroup이 필요한 이유는 여기 컨테이너가 둘이기 때문입니다: 하나는
      # 비밀번호가 담긴 파일을 쓰고, 다른 하나는 그것을 읽습니다. 공유 그룹이 없으면 init 컨테이너가
      # 메인 컨테이너가 열 수 없는 파일을 쓰게 되고, 어디서 틀렸는지
      # 30분 동안 고민하게 됩니다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # 한 컨테이너가 비밀번호를 놓고 다른 컨테이너가 읽는 장소입니다.
      # medium: Memory는 이 "디스크"가 노드의 RAM에 존재하며
      # 실제 디스크에는 절대 도달하지 않음을 뜻합니다: 백업에도, 볼륨 덤프에도, 서버에서
      # 디스크를 빼가는 사람에게도. 파드가 사라지면 — 그 내용도 사라집니다.
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      # init 컨테이너는 메인 컨테이너보다 먼저 실행되며 반드시 성공적으로 완료되어야 합니다.
      # 비밀번호를 가져오지 못하면 애플리케이션은 아예 시작되지 않으며, 이것이 올바른
      # 동작입니다: 데이터베이스 비밀번호가 없는 서비스는 어차피 동작하지 않으니, 올라와서
      # 로그에 오류를 쏟아내는 것보다 올라오지 않는 편이 더 정직합니다.
      initContainers:
        - name: fetch-secret
          # 클라이언트인 `bao` 유틸리티 하나 때문에 OpenBao 이미지 자체를 사용합니다.
          # 직접 코드를 작성할 필요가 없습니다.
          image: openbao/openbao:2.5.1
          # bao kv get -field=password — 전체 시크릿이 아니라 하나의 경로에서 하나의 필드만
          # 가져옵니다. tr -d '\n'는 그렇지 않으면 비밀번호 안에 들어갈 개행 문자를
          # 제거합니다: 끝에 붙은 여분의 문자는 데이터베이스가 받아들이지 않으며, 그런 것을 추적하기는 불쾌합니다.
          # chmod 0400 — 소유자만 파일을 읽을 수 있습니다.
          # set -e는 첫 번째 오류에서 스크립트를 멈춥니다: 그렇지 않으면 컨테이너가 빈 파일로
          # 성공적으로 종료되고, 문제는 애플리케이션에서 파악해야 하게 됩니다.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              bao kv get -field=password secret/passes/db \
                | tr -d '\n' > /secrets/db_password
              chmod 0400 /secrets/db_password
              echo "пароль получен из OpenBao, в манифесте его нет"
          # 저장소 주소와 애플리케이션이 읽을 권한을 증명하는 토큰.
          # 토큰은 명령으로 생성된 객체에 대한 참조입니다; 여기, 파일 안으로는 절대 들어오지 않습니다.
          # 주소에서 tenant-workshopXX는 바꿔야 하는 바로 그 자리표시자입니다.
          env:
            - name: BAO_ADDR
              value: http://openbao-secrets.tenant-workshopXX.svc.cozy.local:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: passes-bao-token
                  key: token
          # 공유 폴더. 이 컨테이너에는 쓰기 권한이 부여되어 있습니다 — 여기에 씁니다.
          volumeMounts:
            - name: secrets
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 메인 컨테이너보다 높은 제한: OpenBao 유틸리티는 busybox보다 무겁지만,
          # 몇 초만 살아 있으므로 이것은 영구적인 비용이 아닙니다.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      # 메인 컨테이너는 init 컨테이너가 완료된 후에만 시작됩니다.
      containers:
        - name: app
          image: busybox:1.36
          # 이전 단계와 같은 루프이지만, 이제 비밀번호는 환경 변수가 아니라
          # 파일에 있습니다: 지문은 /secrets/db_password에서 직접 계산됩니다.
          # 환경 변수는 kubectl describe pod 출력에 보이고 프로세스 덤프로
          # 들어가지만; 파드 메모리 안의 파일은 그렇지 않습니다.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(sha256sum /secrets/db_password | cut -c1-12)"
                sleep 10
              done
          # 비밀이 아닌 설정만 여기 남아 있습니다 — 주소와 로그인.
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
          # 같은 폴더이지만 읽기 전용입니다: 애플리케이션은 아무리 원해도
          # 비밀번호를 훼손하거나 바꿔치기할 수 없습니다.
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
