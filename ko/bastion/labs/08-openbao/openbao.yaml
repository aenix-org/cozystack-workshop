# 랩 8 · OpenBao 시크릿 저장소 주문하기.
# 대시보드에서 마우스로 주문하는 것과 똑같은 작업을 텍스트로만 하는 것입니다.
# 랩 클러스터가 아니라 관리 클러스터의 테넌트에 적용됩니다:
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f openbao.yaml
#
# 적용 전에: tenant-workshopXX를 본인의 네임스페이스로 바꾸세요. XX는 자리표시자이며
# 이름의 일부가 아닙니다. 본인 번호는 비밀번호와 함께 받았습니다. 다른 사람의 테넌트로
# 들어가면 접근 거부를 받게 되며, 그것이 그나마 가장 나은 결과입니다.
#
# kind: OpenBAO — 이것은 기본 제공되는 Kubernetes 객체가 아니라 Cozystack이 추가하는
# 타입입니다. 필요한 것을 기술하면 플랫폼이 알아서 파드, 디스크, 서비스를 배포하고
# 이후에도 알아서 업데이트합니다. 지급받은 가상 머신에 소프트웨어를 설치하는 것보다는
# 카탈로그에서 서비스를 주문하는 것에 가장 가깝습니다.
apiVersion: apps.cozystack.io/v1alpha1
kind: OpenBAO
metadata:
  # 이름은 대시보드의 카드에만 영향을 주는 것이 아닙니다: 저장소의 내부 주소가
  # 이름으로부터 조합됩니다 — openbao-secrets.<namespace>.svc.cozy.local. 이름을 바꾸면 —
  # secrets-demo.yaml과 check.sh용 BAO_APP 변수의 주소를 수정하세요.
  name: secrets
  namespace: tenant-workshopXX
spec:
  # 사본 하나. 프로덕션에서는 세 개를 두어 Raft 복제를 얻습니다: replicas > 1이 되는
  # 즉시 차트가 스스로 이를 활성화합니다. 앞뒤로 전환하려면 데이터를 이전해야 하므로,
  # 이 결정은 나중이 아니라 사전에 내립니다.
  replicas: 1
  # 저장소 데이터용 디스크. 2기가바이트는 여유를 둔 값입니다: 시크릿은 바이트 단위로
  # 가볍고, 용량은 버전 이력과 감사 로그에 쓰입니다. 생성 후 볼륨을 줄일 수는 없지만
  # 보통 늘릴 수는 있으므로, 여기서 인색하게 굴 이유가 없습니다.
  size: 2Gi
  # replicated 스토리지 클래스는 데이터가 서로 다른 노드에 여러 사본으로 놓인다는
  # 뜻입니다. 노드 하나가 고장 나도 여러분의 모든 비밀번호가 함께 사라지지 않습니다 —
  # 그리고 시크릿 저장소를 백업에서 복구하는 일은 그 자체로 별개의 불쾌한 사건입니다.
  storageClass: replicated
  # 「CPU와 메모리를 얼마나」에 대한 기성 세트. 플랫폼이 이를 목록으로 제시하여,
  # 모두가 요청량과 제한량을 손으로 계산하지 않아도 되게 합니다.
  resourcesPreset: t1.small
  # 웹 인터페이스는 클러스터 내부에서 뜹니다. 우리는 이를 외부로 노출하지 않습니다:
  # external: true는 LoadBalancer를 붙이지만, 랩에서는 그것이 필요 없습니다.
  ui: true
  external: false
