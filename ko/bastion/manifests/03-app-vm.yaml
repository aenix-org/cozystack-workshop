# 적용하기 전에 tenant-workshopXX를 자신의 namespace로 교체하세요.
# 모든 파일에서 한 번에 처리하는 편이 더 쉽습니다: 번호 치환에 관한 README 섹션을 참고하세요.
# 그리고 하나 더: 아래 url 필드에 convert.sh(2단계)에서 얻은 presigned 링크를 넣으세요.
#
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  source:
    http:
      url: "ВСТАВЬТЕ_PRESIGNED_URL"  # convert.sh에서 (Share: 줄)
  storage: 10Gi
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: app-1
  namespace: tenant-workshopXX
spec:
  instanceType: u1.medium
  instanceProfile: centos.7
  runStrategy: Always
  disks:
    - name: app-1
# 애플리케이션에 대한 외부 접근은 도메인 이름 app.<tenant>.workshop.aenix.io로 이루어집니다
# (Ingress는 오퍼레이터가 생성합니다; 이 경로에서는 port-forward가 필요 없습니다, README 참고).
# 이 스탠드(Cilium + robotlb)의 external LoadBalancer는 VM에서 작동하지 않으므로,
# 여기서는 external을 켜지 않습니다.
