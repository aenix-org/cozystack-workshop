# Cozystack 데모 스탠드 — 카탈로그와 메트릭을 시연하기 위한 managed 서비스 모음.
# 단일 명령으로 적용:
#   kubectl apply -f https://raw.githubusercontent.com/aenix-org/cozystack-migration-workshop/master/demo/demo.yaml
# 모든 객체는 tenant-workshop00에 생성됩니다.
---
apiVersion: apps.cozystack.io/v1alpha1
kind: Postgres
metadata: {name: demo-postgres, namespace: tenant-workshop00}
spec: {replicas: 2, size: 2Gi, storageClass: replicated, resourcesPreset: nano, users: {app: {password: demo}}, databases: {app: {roles: {admin: [app]}}}}
---
apiVersion: apps.cozystack.io/v1alpha1
kind: Kafka
metadata: {name: demo-kafka, namespace: tenant-workshop00}
spec: {replicas: 1, size: 2Gi, storageClass: replicated, resourcesPreset: small, topics: [{name: events, partitions: 3}]}
---
apiVersion: apps.cozystack.io/v1alpha1
kind: Redis
metadata: {name: demo-redis, namespace: tenant-workshop00}
spec: {replicas: 1, size: 1Gi, storageClass: replicated, resourcesPreset: nano, authEnabled: true, version: v8}
---
apiVersion: apps.cozystack.io/v1alpha1
kind: ClickHouse
metadata: {name: demo-clickhouse, namespace: tenant-workshop00}
spec: {replicas: 1, size: 2Gi, storageClass: replicated, resourcesPreset: small, users: {app: {password: demo}}}
---
apiVersion: apps.cozystack.io/v1alpha1
kind: MongoDB
metadata: {name: demo-mongodb, namespace: tenant-workshop00}
spec: {replicas: 1, size: 2Gi, storageClass: replicated, resourcesPreset: nano, users: {app: {password: demo}}}
---
apiVersion: apps.cozystack.io/v1alpha1
kind: NATS
metadata: {name: demo-nats, namespace: tenant-workshop00}
spec: {replicas: 1, size: 1Gi, storageClass: replicated, resourcesPreset: nano}
---
apiVersion: apps.cozystack.io/v1alpha1
kind: Bucket
metadata: {name: demo-bucket, namespace: tenant-workshop00}
spec: {users: {app: {}}}
