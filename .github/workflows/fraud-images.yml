name: fraud workshop images

on:
  push:
    branches: [master, feat/fraud-workshop]
    paths: ["fraud/app/**", ".github/workflows/fraud-images.yml"]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/aenix-org/fraud-workshop

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fraud/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: fraud/app/go.mod
          cache-dependency-path: fraud/app/go.sum
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build the switch binary for the VM
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o auth-switch-linux-amd64 ./cmd/switch
      - name: Publish the switch binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view fraud-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create fraud-latest -R "$GITHUB_REPOSITORY" --prerelease --title "Fraud workshop binaries" --notes "The card authorization switch that runs on the workshop VM."
          gh release upload fraud-latest auth-switch-linux-amd64 -R "$GITHUB_REPOSITORY" --clobber
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: fraud/app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
